# Netlify config — deploys the React frontend from /frontend.
# VITE_API_BASE is baked in here at build time; a variable with the same name
# set in the Netlify UI takes precedence if you ever need to override it.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE = "https://sportsassets-api.onrender.com"

# COMMAND's read endpoints, proxied to the API so they are SAME-ORIGIN.
#
# WHY A PROXY AND NOT AN ABSOLUTE URL. COMMAND's feed code refuses to
# fetch anything outside /api/command/ (`core.endpoint()`) and fetches
# with credentials:'same-origin'. That is deliberate: it means the page
# cannot be re-pointed at another host and cannot carry a token in
# JavaScript or in a URL. The cost is that the API has to appear on this
# origin, which is what this rule does. The session cookie the API sets
# is then a cookie of THIS origin -- HttpOnly, so the page never reads
# it, and scoped to /api/command, so it is sent nowhere else.
#
# THE ORDER MATTERS. Netlify applies the first matching rule, so this
# must stay ABOVE the SPA catch-all below. Underneath it, /api/command/
# would fall through to index.html and COMMAND would parse a page of
# HTML as its portfolio.
[[redirects]]
  from = "/api/command/*"
  to = "https://sportsassets-api.onrender.com/api/command/:splat"
  status = 200
  force = true

# command.bettortoken.com IS COMMAND, AND NOTHING ELSE.
#
# Owner decision 2026-09-19: the COMMAND interface is the whole product on
# that hostname. Performance, Mission and the rest of the React app are
# obsolete there and must not be reachable.
#
# This is a full-URL `from`, which Netlify matches against the REQUEST HOST,
# so it applies to command.bettortoken.com alone. www.bettortoken.com is
# untouched and still serves the React app at / and COMMAND at /command/.
#
# WHY IT SITS BELOW THE API PROXY AND ABOVE THE SPA FALLBACK. Netlify takes
# the first matching rule. The /api/command/* proxy above is path-only, so
# it matches on EVERY host including this one -- which is required, because
# COMMAND's core.endpoint() refuses to fetch anything outside /api/command/
# and fetches same-origin. Below, the SPA fallback would otherwise hand
# this host the React app, which is the exact thing being removed.
#
# COMMAND ROUTES ON THE HASH (location.hash + hashchange, no pushState), so
# every view -- portfolio, orders, EV decisions, risk, intelligence,
# reporting, audit trail, investor briefing -- lives on ONE document at /
# and never reaches the server. The splat exists for the real files beside
# it: command.css, motion.css, config.js, core.js, report.js, motion.js,
# unlock.js, app.js and assets/.
#
# A path that is NOT one of those files 404s rather than falling through to
# the old site. That is deliberate: an obsolete route should say it is gone,
# not quietly serve the page it replaced.
# THE AGENT PAGES AT MANAGEMENT URLS: /derek, /xavier, /audrey, /karen.
#
# REWRITES (status 200), so the address bar keeps the management URL on a
# direct link and on refresh. They go to ONE static shell, not straight to
# the API: the COMMAND session cookie is HttpOnly and scoped to
# /api/command, so a request for /derek never carries it. The shell draws
# the persistent navigation and frames /api/command/agents/<agent>/page --
# same origin through the /api/command/* rule above, so the frame's request
# DOES carry the cookie and the API enforces authentication as it does for
# every other COMMAND page. The shell itself holds no data.
#
# ORDER: below the /api/command/* proxy (which must stay first) and ABOVE the
# command-host catch-all, which would otherwise map /derek to /command/derek.
[[redirects]]
  from = "https://command.bettortoken.com/derek"
  to = "/command/agent.html"
  status = 200
  force = true

[[redirects]]
  from = "https://command.bettortoken.com/xavier"
  to = "/command/agent.html"
  status = 200
  force = true

[[redirects]]
  from = "https://command.bettortoken.com/audrey"
  to = "/command/agent.html"
  status = 200
  force = true

[[redirects]]
  from = "https://command.bettortoken.com/karen"
  to = "/command/agent.html"
  status = 200
  force = true

# ── POSITION ROOMS: /positions (every active position) and /position?g=<key>
# (one correlated position). REWRITES (status 200) to ONE static page that
# holds no data; it reads /api/command/positions/* same-origin through the
# /api/command/* proxy above, so the HttpOnly session cookie is sent and the
# API enforces authentication. Netlify keeps the query string on a rewrite.
# ORDER: below the /api/command/* proxy and ABOVE the command-host catch-all,
# which would otherwise map /positions to the non-existent /command/positions.
[[redirects]]
  from = "https://command.bettortoken.com/positions"
  to = "/command/position.html"
  status = 200
  force = true

[[redirects]]
  from = "https://command.bettortoken.com/position"
  to = "/command/position.html"
  status = 200
  force = true
# ── end POSITION ROOMS ──────────────────────────────────────────────────
# ── EDDIE AND SCOUT (claude/pos-agents, migration 217) ─────────────────
# Eddie (head of execution, SHADOW ONLY) and Scout (market intelligence,
# RESEARCH SHADOW ONLY): the same shell, framing
# /api/command/agents/<agent>/page. Until the API serving that page is
# released, the shell says NOT YET RELEASED (it asks before framing).
[[redirects]]
  from = "https://command.bettortoken.com/eddie"
  to = "/command/agent.html"
  status = 200
  force = true

[[redirects]]
  from = "https://command.bettortoken.com/scout"
  to = "/command/agent.html"
  status = 200
  force = true
# ── end EDDIE AND SCOUT ───────────────────────────────────────────────
# ── THE TRADING FLOOR (/floor) AND THE CHIEF ALLOCATOR'S WORKSPACE ─────
# /floor is BETTOR headquarters: the 3D trading floor (command/floor.html),
# a static page that reads GET /api/command/floor through the same-origin
# /api/command/* proxy above (session cookie, read only). /allocator is the
# Chief Allocator's workspace in the same agent shell as /derek ... /karen.
# REWRITES (status 200) so the address bar keeps the management URL; ORDER:
# below the /api/command/* proxy and ABOVE the command-host catch-all.
[[redirects]]
  from = "https://command.bettortoken.com/floor"
  to = "/command/floor.html"
  status = 200
  force = true

[[redirects]]
  from = "https://command.bettortoken.com/allocator"
  to = "/command/agent.html"
  status = 200
  force = true

# ── MANAGEMENT PROFITABILITY COCKPIT AND PM ACCEPTANCE (claude/ui-cockpit) ──
# /profitability is the management profitability cockpit
# (command/profitability.html): static, it reads GET /api/command/
# profitability/*, /tournament/*, /twin, /coverage, /floor, /p5/evidence and
# /equity/* same-origin through the /api/command/* proxy above (session
# cookie, read only). /acceptance is the PM acceptance + audit matrix
# (command/acceptance.html), which reads only the static
# command/data/audit-matrix.json. REWRITES (status 200) so the address bar
# keeps the management URL; ORDER: below the /api/command/* proxy and ABOVE
# the command-host catch-all.
[[redirects]]
  from = "https://command.bettortoken.com/profitability"
  to = "/command/profitability.html"
  status = 200
  force = true

[[redirects]]
  from = "https://command.bettortoken.com/acceptance"
  to = "/command/acceptance.html"
  status = 200
  force = true

# ── THE IMPROVEMENT PIPELINE (/improvements, claude/ui-improve) ───────
# The bounded self-improvement board (command/improvements.html): every
# improvement item from EVIDENCE to FORWARD RESULT, its peer challenges,
# preserved disagreements, independent evaluation and the human release
# gate. A static page that reads GET /api/command/improvements (+ /{id})
# through the same-origin /api/command/* proxy above (session cookie, read
# only); it has no control that approves, merges, deploys or releases.
# REWRITE (status 200) so the address bar keeps /improvements?item=...;
# ORDER: below the /api/command/* proxy and ABOVE the command-host catch-all.
[[redirects]]
  from = "https://command.bettortoken.com/improvements"
  to = "/command/improvements.html"
  status = 200
  force = true
# ── end IMPROVEMENT PIPELINE ──────────────────────────────────────────

[[redirects]]
  from = "https://command.bettortoken.com/*"
  to = "/command/:splat"
  status = 200
  force = true

# SPA fallback: real files (sw.js, assets) are served as-is; everything else
# routes to index.html so react-router deep links work.
#
# /command/ is a REAL DIRECTORY in the publish root (frontend/public is
# copied verbatim by Vite), so it wins over this rule without force.
#
# This is www.bettortoken.com's rule now. The host-scoped rule above takes
# command.bettortoken.com before this one is reached.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached stale.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
