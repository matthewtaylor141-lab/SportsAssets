# League policy. Source: calib_league.csv. Codes = Polymarket slug prefixes.
allowlist:
  soccer: [fifwc, epl, lal, fl1, uel, acn, lib, bra, spl, bl2, fif, sea, bra2, arg, mex, nor, swe, den, kor, j1100, j2100]
  basketball: [nba, cbb, wnba]
  tennis: [wta]   # ATP measured flat - excluded
  # US majors for the derivative (spread/total) edge — kch123 evidence.
  # NFL moneyline blocked by category below (specialist measured -2.9%);
  # NHL moneyline allowed (+6.6% on 104,779 fills).
  majors: [nhl, nfl]
# MEASURED NEGATIVE — real, sizeable, consistent losses (edge -0.7c to
# -1.6c on 60k-170k fills each). These stay shut.
blocklist: [ucl, bun, elc, tur, por]
# Unlisted leagues TRADE. The allowlist is not a list of leagues that work —
# it is the list the reference account happened to trade, and an absent
# league is unmeasured, not disproven. The edge comes from de-vigging a sharp
# two-sided quote against the venue's price, and that arithmetic is the same
# in the Norwegian second tier as in the Premier League. What IS measured is
# the blocklist above: those leagues lost money and stay shut, as do the
# dead price bands and the league x category blocks below. Every unlisted
# league is graded per league nightly and gets blocklisted if it doesn't pay.
unknown_league_policy: allow
# category_blocks: league -> categories never traded there.
category_blocks:
  nfl: [moneyline]
  cfb: [moneyline]
  # FLAT, not negative. The blocklist conflated two different findings.
  # mlb: -0.14c over 203,317 fills (SE ~0.11c) — about 1.3 standard errors
  # from zero, i.e. indistinguishable from no edge. atp: -0.03c over 348,339
  # (SE ~0.08c). ere: -0.09c over 66,142. Compare the genuinely negative
  # leagues above at -0.7c to -1.6c, 6+ SE from zero. "We could not measure
  # an edge in this account's MONEYLINE bets" is not "no edge exists in this
  # sport" — the reference account's MLB was overwhelmingly moneyline, and
  # kch123 showed the derivative book is a separate business (the same
  # reasoning already applied to NFL above). So: moneyline stays shut on the
  # measurement we have; run lines, totals and their first-5-innings
  # equivalents trade and are graded per league nightly.
  mlb: [moneyline]
  atp: [moneyline]
  ere: [moneyline]

# ── global category quarantine (measured on OUR fills) ─────────────────
#
# Same instrument as the league blocklist, applied to bet type. Measured on
# Polymarket US over ~126 fills, 2026-08-02:
#
#   moneyline  n=95  drift -2.34c  retention 0.239
#   draw       n=31  drift -2.54c  retention 0.146
#
# Three-quarters of the claimed edge on a game line evaporates within a
# minute of entry, consistently and in one direction. That is adverse
# selection, not noise: the free-sample pool shows 0.01c of drift on the
# same categories when we DON'T buy, across 12,000+ observations.
#
# The drift surcharge already taxes these (+2.34c / +2.54c on top of the
# band), but a tax on a bet that is losing at entry only reduces how often
# we take it. Quarantine removes the cohort instead.
#
# Props are deliberately NOT here: 0.01c drift, retention 1.002 on n=196.
# Note that retention CANNOT detect a prop mapping error (a stably-wrong
# number does not move), so props are on probation, not endorsed — the
# per-category settled scorecard is what will decide.
#
# Reversible: empty this list to resume. 'moneyline' covers draws, which are
# priced as the third leg of a moneyline market.
blocked_categories: [moneyline]
