# Entry-price band policy — GENERATED from data/calib_price.csv
# (scripts_gen_bands.py). Every band with measured positive edge is
# tradeable; thresholds follow the validated price-tier ladder.
# Source: 5.34M resolved fills of the reference account.
tradeable:
  "0.00-0.05": {edge_cents: 0.78, min_edge_threshold: 0.030}
  "0.05-0.10": {edge_cents: 2.66, min_edge_threshold: 0.030}
  "0.10-0.15": {edge_cents: 1.41, min_edge_threshold: 0.030}
  "0.15-0.20": {edge_cents: 2.26, min_edge_threshold: 0.025}
  "0.20-0.25": {edge_cents: 0.60, min_edge_threshold: 0.025}
  "0.25-0.30": {edge_cents: 0.95, min_edge_threshold: 0.025}
  "0.30-0.35": {edge_cents: 3.59, min_edge_threshold: 0.025}
  "0.35-0.40": {edge_cents: 2.28, min_edge_threshold: 0.025}
  "0.40-0.45": {edge_cents: -0.37, min_edge_threshold: 0.035, probation: true}
  "0.45-0.50": {edge_cents: 2.94, min_edge_threshold: 0.020}
  "0.50-0.55": {edge_cents: 0.52, min_edge_threshold: 0.020}
  "0.55-0.60": {edge_cents: 0.76, min_edge_threshold: 0.020}
  "0.60-0.65": {edge_cents: 1.17, min_edge_threshold: 0.020}
  "0.70-0.75": {edge_cents: 1.05, min_edge_threshold: 0.015}
  "0.75-0.80": {edge_cents: 2.61, min_edge_threshold: 0.015}
  "0.80-0.85": {edge_cents: 2.21, min_edge_threshold: 0.015}
  "0.85-0.90": {edge_cents: 1.36, min_edge_threshold: 0.012}
dead_zones: ["0.65-0.70", "0.90-0.95", "0.95-1.00"]
kalshi_fee_adjustment: true

# Per-category band policy — GENERATED by scripts/gen_category_bands.py.
# Spread/total markets are two-sided: our fair value de-vigs the PAIR,
# so an edge on one side is the same measurement as the mirror edge on
# the other. The kch123-measured core (spread 0.40-0.55, total
# 0.40-0.50) and its mirror keep the measured 2.5c threshold; the rest
# of 0.10-0.90 is an unmeasured EXTENSION and must clear 3.0c — a
# higher bar than the measured core, and higher than moneyline asks at
# any price. Outside 0.10-0.90 we do not trade derivatives at all: the
# venue ticks in whole cents, and at those prices one tick swamps the
# edge we are trying to measure.
# SHADOW-TESTABLE: the grader scores these bands; if the extension does
# not pay, it comes back out.
# A NET-ROI FLOOR then trims what the evidence alone would allow: a
# band must pay (threshold - crossing cost)/price >= 2% or it is
# excluded — the edge may be real, but at our measured cost of
# crossing it cannot beat the benchmark, and its settlements prove
# nothing for seasons. This is why windows are no longer mirror-
# symmetric: the cheap side of a line pays the floor at thresholds
# the expensive side cannot.
# Ranges are [lo, hi): the upper bound is one cent past the last
# tradeable price.
categories:
  spread:
    tradeable:
      "0.10-0.40": {min_edge_threshold: 0.030}   # extension
      "0.40-0.50": {min_edge_threshold: 0.025}   # measured
      "0.61-0.75": {min_edge_threshold: 0.030}   # extension
    dead_zones: []
  total:
    tradeable:
      "0.10-0.40": {min_edge_threshold: 0.030}   # extension
      "0.40-0.50": {min_edge_threshold: 0.025}   # measured
      "0.61-0.75": {min_edge_threshold: 0.030}   # extension
    dead_zones: []
  prop:
    tradeable:
      "0.05-0.40": {min_edge_threshold: 0.040}   # unmeasured
      "0.40-0.61": {min_edge_threshold: 0.035}   # unmeasured
      "0.61-0.96": {min_edge_threshold: 0.040}   # unmeasured
    dead_zones: []

# Implausibility guard: real measured edges run 1-4c. Anything above this
# is near-certainly a mapping/model error, not free money — logged for
# study (tagged), never traded, in ANY mode.
max_believable_edge: 0.08
