# Entry-price band policy. Source: calib_price.csv (5.34M resolved fills).
tradeable:
  "0.05-0.10": {edge_cents: 2.66, min_edge_threshold: 0.030}
  "0.15-0.20": {edge_cents: 2.26, min_edge_threshold: 0.025}
  "0.30-0.35": {edge_cents: 3.59, min_edge_threshold: 0.025}
  "0.35-0.40": {edge_cents: 2.28, min_edge_threshold: 0.025}
  "0.45-0.50": {edge_cents: 2.94, min_edge_threshold: 0.020}
  "0.75-0.80": {edge_cents: 2.61, min_edge_threshold: 0.015}
  "0.80-0.85": {edge_cents: 2.21, min_edge_threshold: 0.015}
  "0.85-0.90": {edge_cents: 1.36, min_edge_threshold: 0.012}
dead_zones: ["0.40-0.45", "0.65-0.70", "0.90-1.00"]
kalshi_fee_adjustment: true

# Per-category band policy (kch123 extension). Moneyline keeps the measured
# swisstony bands above — its 40-45c dead zone is a MONEYLINE phenomenon.
# Spread/total markets are engineered coin-flips: the kch123 statement
# ($50M settled derivative positions) shows the spread edge lives at
# 0.40-0.55 (19.5-22.5% ROI) and totals cheap-side 0.40-0.50, NEGATIVE
# above 0.55. Thresholds set conservative; paper mode is the judge.
categories:
  spread:
    tradeable:
      "0.40-0.55": {min_edge_threshold: 0.025}
    dead_zones: []
  total:
    tradeable:
      "0.40-0.50": {min_edge_threshold: 0.025}
    dead_zones: ["0.55-1.00"]
