[project]
name = "edge-engine"
version = "0.1.0"
description = "Sports prediction-market edge engine — shadow mode first (see CLAUDE.md)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websockets>=12",
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6",
    "cryptography>=42",
    "polymarket-us>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["pandas>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
