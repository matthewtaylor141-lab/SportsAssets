[project]
name = "sportsassets"
version = "0.1.0"
description = "Real-time Polymarket sports whale tracker: roster, dual-path ingestion, per-sport analytics, notifications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "pywebpush>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "pycryptodome>=3.20",
    "reportlab>=4.0",
    "py-clob-client>=0.17",
    # PINNED EXACTLY, not a floor. `pip install .` in the image resolved
    # `>=0.1.2` to whatever PyPI had latest at build time -- which is how
    # this container ran 0.1.2 (no retry logic) while the deployed image ran
    # 1.0.2 (max_retries=2, so one call makes three HTTP attempts). The
    # local tests could not have caught the 429 amplification because they
    # were exercising a different client. 1.0.2 is the version the deployed
    # image already resolved; the reasoning, the interface check and the
    # retry facts are in `sportsassets/venue_sdk.py`.
    "polymarket-us==1.0.2",
    # E35 (2026-09-10): the institutional preprod adapter (sportsassets/pmx.py)
    # signs its RS256 client assertion with PyJWT (cryptography above is
    # its backend) and speaks REST through requests
    "PyJWT>=2.7",
    "requests>=2.31",
    # Audrey's management chat (sportsassets/agents/audrey_chat.py) calls the
    # Claude API through the OFFICIAL SDK. 1.9.0 is the release the adapter
    # was built and tested against (verified on the package index
    # 2026-09-30); 1.x moved the SDK's HTTP layer to httpx2 (the SDK's own
    # dependency, the maintained fork of httpx by its original author,
    # published by Pydantic), which arrives transitively. The SDK is used only
    # when ANTHROPIC_API_KEY is provisioned; without it the chat answers from
    # records and says so.
    "anthropic>=1.9.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "pglast>=6",
       # the Audrey chat tests drive the real SDK over httpx2.MockTransport
       "httpx2>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sportsassets*"]
