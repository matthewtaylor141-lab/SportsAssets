[project]
name = "sportsassets"
version = "0.1.0"
description = "Real-time Polymarket sports whale tracker: roster, dual-path ingestion, per-sport analytics, notifications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "pywebpush>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "pycryptodome>=3.20",
    "reportlab>=4.0",
    "py-clob-client>=0.17",
    "polymarket-us>=0.1.2",
    # E35 (2026-09-10): the institutional preprod adapter (sportsassets/pmx.py)
    # signs its RS256 client assertion with PyJWT (cryptography above is
    # its backend) and speaks REST through requests
    "PyJWT>=2.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "pglast>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sportsassets*"]
