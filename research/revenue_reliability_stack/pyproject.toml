[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bettor-revenue-reliability-stack"
version = "0.1.0"
description = "Additive research/PAPER-SHADOW reliability layer aligned to BETTOR's current production contracts"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
