[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bettor-alpha-proof-lab"
version = "0.1.0"
description = "Independent research-only profitability proof lab for BETTOR"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
