<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0e" />
    <!-- iPhone standalone PWA: the site's primary surface is Add to Home
         Screen on iOS Safari. black-translucent lets the app paint under
         the status bar; viewport-fit=cover + safe-area insets (theme.css)
         keep content clear of the notch and home indicator. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BettorToken" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BettorToken — Whale Copy Trading</title>
    <meta name="description" content="BettorToken copies the best whale traders on regulated prediction markets. Every settled copy trade, uncapped, live from the order-level ledger." />
    <meta property="og:title" content="BettorToken — Whale Copy Trading" />
    <meta property="og:description" content="The whale copy portfolio, live: every settled copy trade, uncapped, straight from the order-level ledger." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BettorToken" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the app-shell service worker up front (push.ts registers the
      // same '/sw.js', so enabling alerts later reuses this registration).
      // Precaching makes standalone launches instant; sw.js never caches /api/*.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
  </body>
</html>
