<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BettorToken favicon: BT lockup on the app's dark surface; the T
       carries the accent (--s1 #3987e5), matching the nav wordmark. -->
  <rect width="64" height="64" rx="14" fill="#16181b"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <text x="12" y="44" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-weight="700" font-size="34" letter-spacing="-2" fill="#f4f5f2">B</text>
  <text x="33" y="44" font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-weight="700" font-size="34" letter-spacing="-2" fill="#3987e5">T</text>
</svg>
