<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#040912">
  <meta name="description" content="BETTOR Command — the 3D headquarters of an autonomous investment company: the trading floor, the capital core and the desks, live and read-only.">
  <title>BETTOR · Command</title>
  <link rel="icon" href="brand/favicon.ico" sizes="any" data-brand="icon">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/bettortoken-app-icon-32.png" data-brand="icon32">
  <link rel="apple-touch-icon" href="brand/bettortoken-app-icon-180.png" data-brand="touch">
  <link rel="preload" href="fonts/ibm-plex-sans-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="hq.css">
  <!-- the shared reduced-motion contract every Command page carries -->
  <link rel="stylesheet" href="motion.css">
<link rel="stylesheet" href="command-polish.css">
<script defer src="command-polish.js"></script>
  <link rel="stylesheet" href="experience-v4.css" data-experience-v4="css">
  <script defer src="experience-v4.js" data-experience-v4="js"></script>
</head>
<body class="hq" data-start="command">
  <!-- THE 3D HEADQUARTERS (hq-scene.js): the command center itself. -->
  <div id="hq-stage"></div>

  <header id="hq-top">
    <a class="hq-brand" href="#command" data-go="command" aria-label="BETTOR Command home">
      <img src="brand/bettortoken-logo-white.png" alt="BettorToken" width="150" height="26">
    </a>
    <nav id="hq-nav" aria-label="Command">
      <button type="button" data-go="command">Command</button>
      <button type="button" data-go="floor">Floor</button>
      <button type="button" data-go="markets">Markets</button>
      <button type="button" data-go="capital">Capital · Risk</button>
      <button type="button" data-go="reports">Reports</button>
    </nav>
    <div class="hq-status" id="hq-status" aria-live="polite"></div>
  </header>

  <!-- a CRITICAL management-attention item dominates every view; the
       freshness strip keeps stale marks / stale management in sight -->
  <div id="hq-alert" aria-live="assertive"></div>
  <div id="hq-fresh" data-render="fresh" aria-label="Freshness"></div>
  <div id="hq-hint">Drag to look around · click a desk to enter it · keys 1–5 switch views</div>
  <div id="hq-tags" aria-label="Desks on the floor"></div>

  <main id="hq-hud">
    <!-- COMMAND: the control room -->
    <div class="view view-command">
      <div class="hud-col left">
        <section class="ins" data-render="capital" aria-label="Paper capital"></section>
        <section class="ins brass" data-render="coverage" aria-label="Market coverage"></section>
      </div>
      <div class="hud-col right">
        <section class="ins warm" data-render="attention" aria-label="Management attention"></section>
        <section class="ins grow" data-render="team" aria-label="Agent activity"></section>
      </div>
      <div class="phone-only">
        <section class="ins" data-render="opps" data-max="5" aria-label="Opportunities"></section>
      </div>
      <div class="hud-bottom">
        <section class="ins" data-render="funnel" aria-label="Today's funnel"></section>
        <section class="ins" data-render="tape" data-n="3" aria-label="Execution and activity tape"></section>
      </div>
    </div>

    <!-- FLOOR: the room itself, with the desks named in place -->
    <div class="view view-floor">
      <div class="floor-legend">
        <section class="ins" data-render="floor-counts" aria-label="The floor"></section>
        <section class="ins" data-render="legend" aria-label="Legend"></section>
      </div>
      <div class="phone-only desk-cards" data-render="desk-cards"></div>
    </div>

    <!-- MARKETS / OPPORTUNITIES: the opportunity wall, with its detail beside it -->
    <div class="view view-markets">
      <div class="drawer">
        <section class="ins brass" data-render="ranking" aria-label="Allocator ranking"></section>
        <section class="ins grow" data-render="opps" aria-label="Opportunities"></section>
        <section class="ins brass" data-render="coverage" aria-label="Market coverage · sport availability"></section>
      </div>
      <div class="markets-left">
        <section class="ins" data-render="funnel" aria-label="Today's funnel" style="height:112px"></section>
      </div>
    </div>

    <!-- CAPITAL / RISK: the institutional book around the capital core -->
    <div class="view view-capital">
      <div class="cap-grid">
        <section class="ins cap-curve" data-render="cap-curve" aria-label="Equity curve"></section>
        <section class="ins cap-book" data-render="cap-book" aria-label="The book"></section>
        <div class="cap-core" aria-hidden="true"></div>
        <section class="ins brass cap-sleeves" data-render="cap-sleeves" aria-label="Sleeve allocation"></section>
        <section class="ins cap-conc" data-render="cap-conc" aria-label="Exposure concentration"></section>
        <section class="ins warm cap-exc" data-render="cap-exc" aria-label="Mark freshness and exceptions"></section>
      </div>
    </div>

    <!-- REPORTS: the daily management briefing -->
    <div class="view view-reports">
      <article class="sheet"><div class="ins" data-render="report"></div></article>
    </div>
  </main>

  <!-- THE DESK: the work panel when the camera enters a workspace -->
  <aside id="hq-desk" aria-label="Desk"><div class="ins"></div></aside>
  <div id="hq-caption" role="status" aria-live="polite"><div class="ins"></div></div>

  <nav id="hq-tabbar" aria-label="Command">
    <button type="button" data-go="command"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-3H4z"/></svg>Command</button>
    <button type="button" data-go="floor"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"/></svg>Floor</button>
    <button type="button" data-go="markets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 7-9"/><path d="M15 5h4v4"/></svg>Markets</button>
    <button type="button" data-go="capital"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Capital</button>
    <button type="button" data-go="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>Reports</button>
  </nav>
  <div class="hq-foot">READ ONLY · PAPER is simulated execution · SMALL LIVE as served · no order, cancel, limit or capital control on this page</div>

  <!-- Access: the sign-in step (a 401/403 opens it; it never holds a credential). -->
  <script src="unlock.js"></script>
  <!-- The shared floor read layer (GET /api/command/* only) and the Mobile
       Command view models (attention, funnel, opportunities): one rule set for
       the phone app and the headquarters. -->
  <script src="floor-core.js"></script>
  <script src="mobile-command.js"></script>
  <script type="module" src="hq.js"></script>
</body>
</html>
