<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BettorToken · AI Agents</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0b0e13;--ink:#e8ecf2;--mute:#8b95a5;--line:#1c2330;--acc:#e0b54a}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  body{display:flex;flex-direction:column}
  nav{display:flex;gap:4px;align-items:center;padding:0 16px;height:48px;border-bottom:1px solid var(--line)}
  nav .brand{font-weight:700;letter-spacing:.06em;margin-right:16px}
  nav a{color:var(--mute);text-decoration:none;padding:8px 12px;border-radius:6px}
  nav a:hover,nav a:focus-visible{color:var(--ink);outline:2px solid var(--line)}
  nav a[aria-current="page"]{color:var(--ink);background:#151b26;box-shadow:inset 0 -2px 0 var(--acc)}
  nav .tag{margin-left:auto;color:var(--mute);font-size:12px}
  iframe{flex:1;width:100%;border:0;background:var(--bg)}
  noscript{padding:24px}
  #state{margin:48px auto;max-width:640px;padding:20px 24px;border:1px solid #6b3a3a;border-radius:10px;background:#1a1012;color:#f1d3d3;font-weight:600}
</style>
</head>
<body>
<nav aria-label="AI agents">
  <span class="brand">BETTORTOKEN</span>
  <a href="/derek" data-agent="derek">Derek · Discovery &amp; Entry</a>
  <a href="/xavier" data-agent="xavier">Xavier · Portfolio Management</a>
  <a href="/audrey" data-agent="audrey">Audrey · Audit &amp; Intelligence</a>
  <span class="tag">AI agents</span>
</nav>
<iframe id="page" title="Agent page"></iframe>
<div id="state" role="status" hidden></div>
<noscript>This page needs JavaScript. Open <a href="/api/command/agents/page">the agent pages</a> directly.</noscript>
<script>
(function () {
  var AGENTS = {derek: 1, xavier: 1, audrey: 1};
  var name = (location.pathname.replace(/\/+$/, "").split("/").pop() || "").toLowerCase();
  if (!AGENTS[name]) { name = "derek"; }
  document.querySelectorAll("nav a[data-agent]").forEach(function (a) {
    if (a.getAttribute("data-agent") === name) { a.setAttribute("aria-current", "page"); }
  });
  document.title = "BettorToken · " + name.charAt(0).toUpperCase() + name.slice(1);
  var url = "/api/command/agents/" + name + "/page";
  var frame = document.getElementById("page");
  var note = document.getElementById("state");
  function show(msg) { note.textContent = msg; note.hidden = false; frame.hidden = true; }
  // ASK FIRST, THEN FRAME: a page the serving API has not released, a
  // signed-out session and an unavailable service each get their own
  // truthful message instead of an error page inside the frame.
  fetch(url, {method: "GET", credentials: "same-origin", cache: "no-store"})
    .then(function (r) {
      if (r.ok) { frame.src = url; return; }
      if (r.status === 401 || r.status === 403) {
        show("Sign in to COMMAND first (Bettor desk unlock), then refresh this page.");
      } else if (r.status === 404) {
        show("NOT YET RELEASED: the serving API does not have the " + name +
             " page yet. It ships with the next API release.");
      } else {
        show("UNAVAILABLE: the agent service answered HTTP " + r.status +
             ". No data is shown rather than stale or empty figures.");
      }
    })
    .catch(function (e) { show("UNAVAILABLE: the agent service could not be reached (" + e.name + ")."); });
})();
</script>
</body>
</html>
