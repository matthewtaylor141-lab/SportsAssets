# PM EVIDENCE & ACCEPTANCE PACK V1 -- THE INDEPENDENT RELEASE / ACCEPTANCE
# RECEIPT, RUN FROM OUTSIDE (2026-10-07).
#
# For one 40-hex SHA this job establishes, from MACHINE sources only:
#   lineage     git merge-base --is-ancestor <accepted production base> SHA
#   gates       the GitHub conclusions of backend-tests, capital-critical,
#               commit-guard and engine-diagnostic ON THAT EXACT SHA (the
#               newest run of each; anything but success is not green)
#   deployed    Render's LIVE deploy commit of sportsassets-api and of
#               sportsassets-workers (tested = release = deployed) and the
#               OOM / server_failed events since each went live
#   production  GET /api/command/{release,red-team,pm-acceptance,venues,
#               completion-readiness} (ADMIN_TOKEN, read role)
# then POSTs the release receipt to the serving API, which accepts it ONLY
# when deployed_sha is its own RENDER_GIT_COMMIT, appends it (migration 315)
# and never edits it. A receipt is EVIDENCE, never authority: nothing here
# can place, cancel, size, fund or authorize anything, and no setting,
# credential or limit is read or changed.
#
# Finally the byte-identical package harness is re-run HERE over the API's
# machine evidence with the gate / lineage fields replaced by what this job
# read from GitHub itself, and must reach the same RED / YELLOW / GREEN. A
# RED or YELLOW state is the truthful output, not a job failure; the job
# fails only when the evidence cannot be read or the two harness runs
# disagree.
name: pm-acceptance

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "40-hex release SHA (tested = release = deployed)"
        required: true
      post_receipt:
        description: "on = POST the release receipt to the serving API (evidence only); blank = read only"
        required: false
        default: "on"
      implementation_sha:
        description: "optional 40-hex implementation SHA the release tree was tested as (recorded in the evidence packet)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  # the evidence packet's Sigstore attestation (evidence only; no write to
  # the repository, no deploy, no secret)
  id-token: write
  attestations: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://sportsassets-api.onrender.com
      ACCEPTED_BASE: a91be09f125f0ab0d1f29a0d0866b5cb6f5765fd
      SHA: ${{ inputs.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Validate the SHA
        shell: bash
        run: |
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "not a full 40-hex sha: $SHA"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Lineage (accepted production base is an ancestor; the release is the tracked branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p acc
          if git merge-base --is-ancestor "$ACCEPTED_BASE" "$SHA"; then d=true; else d=false; fi
          echo "descendant_of_base=$d ($ACCEPTED_BASE -> $SHA)"
          # THE RELEASE IS THE BRANCH BOTH RENDER SERVICES TRACK
          # (render-ops api-branch-get: claude/release-api, autoDeploy=no).
          # release_sha is READ from that branch, never copied from the input:
          # a build deployed by commit id while claude/release-api was left
          # behind (08828d04 live, branch at a91be09f, 2026-10-07) is then
          # RELEASE_SHA_DIFFERS_FROM_TESTED_SHA, not a silent pass. Unreadable
          # stays unreadable: the receipt is refused (NOT_A_FULL_SHA) and the
          # RELEASE control stays UNKNOWN.
          rel=$(gh api "repos/$REPO/branches/claude/release-api" --jq .commit.sha 2>/dev/null || true)
          echo "$rel" | grep -Eq '^[0-9a-f]{40}$' || rel="UNREADABLE"
          echo "release_branch=claude/release-api release_sha=$rel tested=$SHA"
          jq -n --arg b "$ACCEPTED_BASE" --arg s "$SHA" --arg r "$rel" --argjson d $d \
            '{accepted_base_sha:$b, sha:$s, descendant_of_base:$d,
              release_branch:"claude/release-api", release_sha:$r}' > acc/lineage.json

      - name: Exact-SHA gate conclusions (GitHub)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > acc/runs_raw.json
          jq '[.workflow_runs[] | {name, id, event, status, conclusion, created_at, head_sha, html_url}]' acc/runs_raw.json > acc/runs.json
          jq -n --slurpfile r acc/runs.json '
            def latest(n): ([$r[0][] | select(.name == n)] | sort_by(.created_at) | last);
            def green(n): (latest(n) // {} | (.status == "completed" and .conclusion == "success"));
            {backend_tests_green: green("backend-tests"),
             capital_critical_green: green("capital-critical"),
             commit_guard_green: green("commit-guard"),
             engine_diagnostic_green: green("engine-diagnostic"),
             runs: {backend_tests: latest("backend-tests"),
                    capital_critical: latest("capital-critical"),
                    commit_guard: latest("commit-guard"),
                    engine_diagnostic: latest("engine-diagnostic")}}' > acc/gates.json
          jq -c '{backend_tests_green, capital_critical_green, commit_guard_green, engine_diagnostic_green}' acc/gates.json
          jq -r '.runs | to_entries[] | "  \(.key): \(.value.id // "-") \(.value.status // "absent")/\(.value.conclusion // "-") \(.value.html_url // "")"' acc/gates.json

      - name: Render deploys and OOM events (read only)
        shell: bash
        env:
          KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set +e
          [ -z "${KEY:-}" ] && { echo "no RENDER_API_KEY: deployed commits NOT_ESTABLISHED"; echo '{}' > acc/render.json; exit 0; }
          echo "::add-mask::$KEY"
          API=https://api.render.com/v1
          get() { curl -sS --max-time 45 -H "Authorization: Bearer $KEY" -H "Accept: application/json" "$API$1"; }
          out='{}'
          for svc in sportsassets-api sportsassets-workers sportsassets-market-plane; do
            id=$(get "/services?name=$svc&limit=20" | jq -r --arg n "$svc" '.[]? | select(.service.name==$n) | .service.id' | head -1)
            if [ -z "$id" ]; then
              out=$(jq --arg s "$svc" '.[$s] = {present:false}' <<<"$out"); echo "$svc: ABSENT"; continue
            fi
            get "/services/$id/deploys?limit=20" > "acc/deploys_$svc.json"
            live=$(jq -c '[.[]? | .deploy | select(.status=="live")] | first // {}' "acc/deploys_$svc.json")
            commit=$(jq -r '.commit.id // empty' <<<"$live"); fin=$(jq -r '.finishedAt // empty' <<<"$live")
            get "/services/$id/events?limit=100" > "acc/events_$svc.json"
            ooms=$(jq --arg f "$fin" '[.[]? | .event | select($f == "" or .timestamp >= $f)
                     | select((.details|tostring|test("oom|out of memory";"i")))] | length' "acc/events_$svc.json")
            fails=$(jq --arg f "$fin" '[.[]? | .event | select($f == "" or .timestamp >= $f)
                     | select(.type=="server_failed")] | length' "acc/events_$svc.json")
            out=$(jq --arg s "$svc" --arg c "$commit" --arg f "$fin" --argjson o "${ooms:-null}" --argjson x "${fails:-null}" \
                  '.[$s] = {present:true, live_commit:$c, live_since:$f, oom_events_since_live:$o, server_failed_since_live:$x}' <<<"$out")
            echo "$svc: live=$commit since=$fin oom_since_live=$ooms server_failed_since_live=$fails"
          done
          echo "$out" > acc/render.json

      - name: Production readbacks (ADMIN_TOKEN, read role)
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set +e
          [ -z "${ADMIN_TOKEN:-}" ] && { echo "no ADMIN_TOKEN: production readbacks NOT_ESTABLISHED"; exit 1; }
          echo "::add-mask::$ADMIN_TOKEN"
          get() {
            code=$(curl -s -o "acc/$1.json" -w '%{http_code}' --max-time 150 \
                   -H "X-Admin-Token: $ADMIN_TOKEN" "$BASE$2" || echo 000)
            echo "== $1 GET $2 -> HTTP $code ($(wc -c < "acc/$1.json") bytes) at $(date -u +%FT%TZ)"
          }
          get release /api/command/release
          get red_team /api/command/red-team
          get venues /api/command/venues
          get completion /api/command/completion-readiness
          get pm_before /api/command/pm-acceptance
          jq -c '{api: .api.sha, workers: .workers.sha, alignment, schema: {status: .schema.status, max_version: .schema.max_version}}' acc/release.json | cut -c1-1500
          jq -c '{status, why, red_team: .data.readiness.status, blockers: .data.readiness.blockers}' acc/red_team.json | cut -c1-3000
          jq -c '{status, pm_state: .data.pm_acceptance.pm_state, golden: {passed: .data.golden.passed, total: .data.golden.total, appended: .data.golden.appended_passed, green: .data.golden.green}}' acc/pm_before.json | cut -c1-2000

      - name: POST the release receipt (evidence only)
        if: ${{ inputs.post_receipt == 'on' }}
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set +e
          echo "::add-mask::$ADMIN_TOKEN"
          # the FINGERPRINT half of migration integrity (applied history ==
          # this build's files); the fresh-database half is the
          # capital-critical conclusion this same receipt carries
          mig=$(jq '.data.readiness.controls.MIGRATION_INTEGRITY.evidence as $e
                    | ($e.applied_fingerprint != null)
                      and ($e.applied_fingerprint == $e.repo_fingerprint)
                      and (($e.edited_in_place // []) | length == 0)
                      and (($e.applied_not_in_build // []) | length == 0)' acc/red_team.json 2>/dev/null || echo false)
          jq -n --slurpfile l acc/lineage.json --slurpfile g acc/gates.json --slurpfile p acc/pm_before.json \
                --slurpfile r acc/render.json \
                --arg s "$SHA" --argjson m "${mig:-false}" '
            {accepted_base_sha: $l[0].accepted_base_sha, tested_sha: $s, release_sha: $l[0].release_sha,
             deployed_sha: $s, descendant_of_base: $l[0].descendant_of_base,
             backend_tests_green: $g[0].backend_tests_green,
             capital_critical_green: $g[0].capital_critical_green,
             commit_guard_green: $g[0].commit_guard_green,
             engine_diagnostic_green: $g[0].engine_diagnostic_green,
             migration_fingerprint_match: $m,
             workers_deployed_sha: ($r[0]["sportsassets-workers"].live_commit // null),
             pm_acceptance: ($p[0].data.pm_acceptance // null)}' > acc/receipt_body.json
          code=$(curl -s -o acc/receipt_resp.json -w '%{http_code}' --max-time 60 -X POST \
                 -H "X-Admin-Token: $ADMIN_TOKEN" -H "Content-Type: application/json" \
                 --data @acc/receipt_body.json "$BASE/api/admin/red-team/release-receipt" || echo 000)
          echo "release receipt POST -> HTTP $code: $(head -c 1500 acc/receipt_resp.json)"
          case "$code" in 200) ;; *) echo "receipt not accepted (the API refuses a SHA it is not serving)";; esac

      - name: Re-read PM acceptance and re-run the package harness here
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -o pipefail
          echo "::add-mask::$ADMIN_TOKEN"
          curl -s -o acc/pm_after.json --max-time 150 -H "X-Admin-Token: $ADMIN_TOKEN" "$BASE/api/command/pm-acceptance"
          PYTHONPATH=backend python3 -I - <<'PY'
          import json, os, sys
          sys.path.insert(0, "backend")
          from sportsassets.pm_evidence.pm_acceptance import harness as H
          spec = json.load(open("backend/sportsassets/pm_evidence/data/acceptance_spec.json"))
          pm = json.load(open("acc/pm_after.json"))
          if pm.get("status") != "OK":
              print("pm-acceptance readback unavailable:", pm.get("why")); sys.exit(1)
          api = pm["data"]["pm_acceptance"]
          lin = json.load(open("acc/lineage.json")); g = json.load(open("acc/gates.json"))
          ren = json.load(open("acc/render.json"))
          sha = os.environ["SHA"]
          ev = dict(api["evidence_input"])
          # the CI fields, as THIS job read them from GitHub / git
          ev.update(accepted_base_sha=lin["accepted_base_sha"], tested_sha=sha,
                    release_sha=lin["release_sha"],
                    is_descendant_of_accepted_base=lin["descendant_of_base"],
                    backend_tests=g["backend_tests_green"],
                    capital_critical=g["capital_critical_green"],
                    commit_guard=g["commit_guard_green"],
                    engine_diagnostic=g["engine_diagnostic_green"])
          wk = (ren.get("sportsassets-workers") or {}).get("live_commit")
          ap = (ren.get("sportsassets-api") or {}).get("live_commit")
          mine = H.evaluate(ev, spec)
          out = {"sha": sha, "api_live_commit": ap, "workers_live_commit": wk,
                 "api_serving_sha": ev.get("deployed_sha"),
                 "render": ren, "api_pm_state": api["pm_state"],
                 "independent_pm_state": mine["pm_state"],
                 "critical_failures": mine["critical_failures"],
                 "economic_or_evidence_gaps": mine["economic_or_evidence_gaps"],
                 "fields_without_machine_evidence": api["fields_without_machine_evidence"],
                 "release_receipt": pm["data"].get("release_receipt"),
                 "golden": {k: pm["data"]["golden"].get(k) for k in ("passed", "total", "appended_passed", "appended_total", "green")},
                 "scoreboard_reconciliation": pm["data"]["scoreboard"].get("reconciliation"),
                 "ledger_reconciliation": pm["data"]["scoreboard"].get("ledger_reconciliation"),
                 "authority": pm["data"].get("authority")}
          json.dump(out, open("acc/acceptance.json", "w"), indent=1, default=str)
          print(json.dumps(out, default=str)[:6000])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## PM acceptance for `%s`\n\n" % sha)
              f.write("* PM state (API): **%s**; independent re-run: **%s**\n" % (api["pm_state"], mine["pm_state"]))
              f.write("* API live `%s`, workers live `%s`, serving `%s`\n" % (ap, wk, ev.get("deployed_sha")))
              f.write("* critical failures: %s\n" % (", ".join(mine["critical_failures"]) or "none"))
              f.write("* economic / evidence gaps: %s\n" % (", ".join(mine["economic_or_evidence_gaps"]) or "none"))
          bad = []
          # the receipt the API holds was built from the same GitHub reads, so
          # after it is accepted both runs must agree; before (read only) the
          # API cannot know the gates and is RED by construction
          if pm["data"].get("release_receipt") and mine["pm_state"] != api["pm_state"]:
              bad.append("HARNESS_DISAGREES:%s!=%s" % (mine["pm_state"], api["pm_state"]))
          if bad:
              print("FAIL", bad); sys.exit(1)
          PY

      - name: Production evidence packet (extra readbacks, memory, log counts)
        if: always()
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          KEY: ${{ secrets.RENDER_API_KEY }}
          IMPL_SHA: ${{ inputs.implementation_sha }}
        run: |
          set +e
          mkdir -p acc
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          [ -n "${KEY:-}" ] && echo "::add-mask::$KEY"
          if [ -n "${IMPL_SHA:-}" ] && ! echo "$IMPL_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "implementation_sha is not 40-hex; recorded as absent"; IMPL_SHA=""
          fi
          export IMPL_SHA
          # READ-ONLY readbacks the packet cites (GET, read role)
          get() {
            code=$(curl -s -o "acc/$1.json" -w '%{http_code}' --max-time 150 \
                   -H "X-Admin-Token: $ADMIN_TOKEN" "$BASE$2" || echo 000)
            echo "== $1 GET $2 -> HTTP $code ($(wc -c < "acc/$1.json") bytes)"
          }
          if [ -n "${ADMIN_TOKEN:-}" ]; then
            get shadow_health /api/command/shadow/health
            get capital_readiness /api/command/capital-readiness
            get canary /api/command/canary
            get small_live "/api/command/small-live?limit=20"
            get xavier_management /api/command/xavier/management
            get paper_freshness "/api/command/paper/freshness?limit=0"
            get market_plane /api/command/market-plane
            get profitability_scoreboard /api/command/paper/profitability-scoreboard
            get revenue_readiness /api/command/revenue-readiness
            get paper_reconciliation /api/command/paper/reconciliation
            get loop_health /api/command/loop-health
          fi
          # Render: memory since each service went live (<= 6 h) and the
          # named log lines since then (counts; hasMore = at least 100)
          if [ -n "${KEY:-}" ]; then
            API=https://api.render.com/v1
            rget() { curl -sS --max-time 60 -H "Authorization: Bearer $KEY" -H "Accept: application/json" "$API$1"; }
            END=$(date -u +%FT%TZ); FLOOR=$(date -u -d '-6 hours' +%FT%TZ)
            for svc in sportsassets-api sportsassets-workers; do
              id=$(rget "/services?name=$svc&limit=20" | jq -r --arg n "$svc" '.[]? | select(.service.name==$n) | .service.id' | head -1)
              [ -z "$id" ] && continue
              owner=$(rget "/services/$id" | jq -r '.ownerId // empty')
              since=$(jq -r --arg s "$svc" '.[$s].live_since // empty' acc/render.json 2>/dev/null | cut -c1-19)
              START="${since:+${since}Z}"; [ -z "$START" ] && START=$FLOOR
              [[ "$START" < "$FLOOR" ]] && START=$FLOOR
              rget "/metrics/memory?resource=$id&startTime=$START&endTime=$END&resolutionSeconds=60" > "acc/mem_$svc.json"
              echo "$svc memory $START..$END: $(jq -c '[.[]? | {labels, n: (.values|length), max_mb: ([.values[]?.value] | max / 1048576 | floor)}]' "acc/mem_$svc.json" | cut -c1-600)"
              for pair in "churn|exited cleanly; restarting" "crash|crashed; restarting" \
                          "migration_changed|WAS ALREADY APPLIED" "policy_drift|POLICY_CODE_DRIFT" \
                          "memory_error|MemoryError"; do
                name=${pair%%|*}; text=${pair#*|}
                q="/logs?ownerId=$owner&resource=$id&startTime=$START&endTime=$END&limit=100&direction=backward&text=$(printf '%s' "$text" | jq -sRr @uri)"
                rget "$q" | jq --arg f "$text" --arg w "$START..$END" '. + {_filter: $f, _window: $w}' > "acc/logs_${svc}_${name}.json"
                echo "  $svc '$text': $(jq '.logs | length' "acc/logs_${svc}_${name}.json") lines (hasMore=$(jq '.hasMore' "acc/logs_${svc}_${name}.json"))"
              done
            done
          fi
          python3 -I backend/tools/evidence_packet.py acc
          jq -c '{identity, gates, policy: .policy_integrity, migrations: .migrations.control, memory, log_counts}' acc/evidence_packet.json | cut -c1-6000
          {
            echo "## Production evidence packet"
            echo
            echo '```'
            cat acc/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the evidence packet (Sigstore, evidence only)
        if: always()
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: acc/evidence_packet.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm-acceptance-${{ inputs.sha }}
          path: acc/
          retention-days: 90
