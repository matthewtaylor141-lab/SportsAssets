name: tape-probe

# §B. PROVE THE PUBLIC EXECUTION TAPE IS ACTUALLY DOWNLOADABLE.
#
# A READ-ONLY, CREDENTIAL-FREE SURFACE, separate from research-sql and
# render-ops on purpose. research-sql holds a database key; render-ops
# can restart services. This workflow holds NOTHING: it makes plain
# HTTPS GETs to one public host and needs no secret at all.
#
# WHY A WORKFLOW AND NOT A LOCAL RUN. The agent environment's egress
# policy denies www.polymarketexchange.com (CONNECT 403), so the fetch
# cannot be attempted from there. GitHub Actions can reach it.
#
# WHAT THIS PROVES AND WHAT IT DOES NOT. It proves the venue publishes
# the file and that it is retrievable and parseable from a GitHub
# Actions runner. It does NOT prove the Render worker can reach the
# same host -- that is a separate egress question on a different
# network, and it is called out in the summary rather than assumed.
#
# The guard below refuses to run if the capture module has grown a
# mutating verb, a second host or a credential read since it was
# audited. That check is a property of this workflow, not a promise
# about the code.

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: "CSV files to download (0 discovers links only)"
        required: false
        type: string
        default: "1"

# THE GLOBAL PMUS VENUE-ACCESS DOMAIN, ADOPTED ON THE STRICT READING.
#
# This workflow fetches www.polymarketexchange.com, NOT the §10 gateway, so
# on the merits it belongs in a group of its own -- which is what it had.
# But `venue_domain.venue_touching_workflows` classifies it as venue-
# touching, via INVOKES_VENUE_CAPABLE_MODULE:test_tape_capture. That module
# is only named here as the AST guard this job runs, and its single mention
# of gateway.polymarket.us is inside
# `test_it_cannot_reach_the_collectors_hosts_or_any_trading_host`, which
# asserts the capturer CANNOT reach it. The classifier matched a
# PROHIBITION and read it as a capability.
#
# Two ways to resolve that, and only one of them is safe. Teaching the
# classifier to discount a host named inside a negative assertion would
# make a venue-access gate depend on regexes distinguishing intent from
# prohibition, and the first time that reasoning is wrong a real collector
# escapes the domain. Joining the domain instead costs a manually
# dispatched probe some serialisation and weakens nothing. So the strict
# reading is honoured rather than argued with.
#
# The over-inclusion is deliberate and recorded: being in this group is not
# a claim that this host shares the gateway's rate limiter.
concurrency:
  group: pmus-public-read-global
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard - the capture module is still read-only
        # THE EXISTING AST GATE, NOT A NEW GREP. test_tape_capture.py
        # already proves get-only, single-host, no-credential and
        # no-environment-read by walking the syntax tree with
        # docstrings stripped. A grep over the source would refuse this
        # very module, whose docstring says "No API key, no Auth0
        # token, no client assertion" -- which is the prose promise the
        # AST gate actually verifies.
        run: |
          set -eu
          # httpx too: test_tape_capture imports the capturer, which
          # imports httpx at module scope. The guard must be able to
          # PARSE the module it is gating.
          python3 -m pip install --quiet pytest httpx
          cd research/beta48/tape
          python3 -m pytest test_tape_capture.py -q
          python3 guard_probe.py tape_probe.py

      - name: Probe
        run: |
          set -eu
          MAX="$(jq -r '.inputs.max_files // "1"' "$GITHUB_EVENT_PATH")"
          case "$MAX" in ''|*[!0-9]*) echo "refused: max_files must be digits"; exit 1 ;; esac
          cd research/beta48/tape
          python3 tape_probe.py --out /tmp/tape --max-files "$MAX"

      - name: Summary
        if: always()
        run: |
          set -eu
          echo "== tape_probe.json =="
          # The raw jsonl carries whole page bodies; only the probe
          # block is printed, and its symbol sample is already capped.
          if [ -f /tmp/tape/tape_probe.json ]; then
            python3 ../../../research/beta48/tape/tape_report.py \
              /tmp/tape/tape_probe.json 2>/dev/null \
              || python3 research/beta48/tape/tape_report.py /tmp/tape/tape_probe.json
          else
            echo "no probe output -- the run failed before it was written"
          fi

      - name: Upload raw capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tape-capture
          path: /tmp/tape
          retention-days: 7
          if-no-files-found: warn
