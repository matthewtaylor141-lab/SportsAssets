name: commit-guard

# BACKSTOP, NOT PREVENTION. Render deploys ON PUSH, so by the time this job runs
# the deploy has already begun. .githooks/pre-push is what actually prevents one;
# this exists because core.hooksPath is local config and a fresh clone has no
# hooks until scripts/install-hooks.sh runs. Its job is to make an untagged
# commit loud and permanent in the run history rather than invisible.
#
# THIS WORKFLOW MUST NOT DEPLOY ANYTHING. It reads commit messages and exits.
#
# TWO WAYS A DEPLOY-APPROVED COMMIT SILENTLY FAILS TO DEPLOY (2026-09-20).
# Both were hit in one session; neither produces an error anywhere.
#
# 1. RENDER EVALUATES ONLY THE TIP OF A PUSH. Push two commits where the
#    first is deploy-approved and the second suppresses the build, and
#    the first never deploys -- it gets no Render event at all, so it
#    does not even appear as ignored. This guard checks that EVERY
#    pushed commit declares its intent, which is the right check for its
#    own question, and it cannot see this one.
#
# 2. RENDER SCANS THE WHOLE COMMIT MESSAGE, NOT JUST THE SUBJECT. A
#    commit whose BODY quotes the suppression directive -- for example a
#    message explaining this very trap -- suppresses itself. That is how
#    7f7a9a6 was ignored while carrying deploy-approved in its subject.
#
# If a deploy-approved commit does not appear in `render-ops deploys`,
# check `render-ops events` for commit_ignored before assuming it is
# live. A push is not a deploy.

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  tags:
    runs-on: ubuntu-latest
    # A guard that can hang is worse than no guard: it holds a runner
    # and starves every other job in the account.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every pushed commit declares its deploy intent
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A new branch, or a force-push whose old tip is gone: check only the
            # tip rather than re-litigating history that predates this guard.
            RANGE="$AFTER -1"
            LIST=$(git rev-list -1 "$AFTER")
          else
            LIST=$(git rev-list "$BEFORE..$AFTER")
          fi
          bad=0
          for sha in $LIST; do
            msg=$(git log -1 --format=%B "$sha")
            case "$msg" in
              *'[skip render]'*|*'[deploy-approved]'*) ;;
              *)
                bad=1
                echo "::error::$sha carries neither [skip render] nor [deploy-approved] -- pushing it auto-deployed it: $(git log -1 --format=%s "$sha")"
                ;;
            esac
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::A commit reached the service branch without declaring deploy intent. Render deploys on push, so this deploy has ALREADY STARTED -- read 'deploys' in render-ops and decide whether to act. Prevention is scripts/install-hooks.sh."
            exit 1
          fi
          echo "all pushed commits declare their deploy intent"

      - name: every workflow is startable, and has room to be edited
        run: |
          set -e
          # 2026-09-21: render-ops.yml crossed GitHub's 512,000-byte
          # ceiling and every dispatch returned startup_failure. The
          # lever that operates Render, reads the production database
          # and holds the trading kill switch was taken down by a
          # comment, and two runs were sent at the corpse before anyone
          # checked. yaml.safe_load passed the whole time -- the file
          # was valid YAML and always had been.
          #
          # This checks size against the ceiling AND against a headroom
          # minimum, the structure GitHub requires, and `bash -n` over
          # every run: block. Headroom is the real control: the file
          # that "passed" was 192 bytes from death.
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_workflows.py

      - name: actionlint
        # BOUNDED, BECAUSE THE UNBOUNDED VERSION ATE THE QUEUE.
        # I added this step at 14:2x on 2026-09-21 as
        # `bash <(curl ...) ` with no timeout. The process substitution
        # never returned -- every commit-guard run since sat
        # in_progress on this step for over an hour, each holding a
        # runner, until twenty were stuck and the account's queue was
        # starved. The reconciliation reads I then reported as "blocked
        # behind saturated runners" were blocked behind THIS.
        #
        # A lint step must never be able to outlive the thing it lints.
        timeout-minutes: 3
        run: |
          set -uo pipefail
          # Download to a file with its own bounded curl, redirecting
          # stdin from /dev/null so nothing can wait on a terminal.
          if ! curl -sSfL --max-time 60 -o /tmp/dl-actionlint.bash \
               https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
               </dev/null; then
            echo "::warning::actionlint could not be downloaded; the "\
                 "size/structure/shell checks above still ran"
            exit 0
          fi
          if ! timeout 90 bash /tmp/dl-actionlint.bash >/dev/null 2>&1 </dev/null; then
            echo "::warning::actionlint could not be installed; the "\
                 "size/structure/shell checks above still ran"
            exit 0
          fi
          timeout 90 ./actionlint -color </dev/null
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::warning::actionlint timed out; not treating that as a lint failure"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::actionlint rejected a workflow -- a workflow that does not validate may still be dispatchable, but the failure surfaces as startup_failure at the moment you need the lever"
            exit "$rc"
          fi
