name: platform-capture

# A READ-ONLY SCREEN RECORDING OF THE REAL COMMAND FRONTEND, ENCRYPTED.
#
# source=production records https://command.bettortoken.com itself (the
# deployed build); source=candidate builds target_ref as Netlify does and
# serves it with the read-only preview server (.github/frontend-preview/
# serve.js). Either way the existing read credential is added outside the
# page (Playwright request layer, or the preview server), GET/HEAD only.
# capture.js discovers routes or records a walkthrough plan from Chromium's
# own compositor frames; nothing is injected into the product.
#
# THIS REPOSITORY IS PUBLIC. Nothing readable leaves the runner: all output
# is encrypted with age (X25519 recipient given as an input; authenticated
# encryption) and the ciphertext is checked before the only upload step,
# which runs on success only. A cleanup step removes every plaintext file
# and browser profile on success and on failure. Logs carry step numbers,
# kinds, counts and sizes only. Nothing is deployed or changed.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "production (command.bettortoken.com) or candidate (build target_ref)"
        required: true
        type: choice
        options: [production, candidate]
      target_ref:
        description: "candidate only: branch or 40-hex commit whose frontend is recorded"
        required: false
        type: string
      mode:
        description: "discover or record"
        required: true
        type: choice
        options: [discover, record]
      plan:
        description: "record mode: plan file under .github/frontend-preview/plans/ (harness ref)"
        required: false
        type: string
      recipient:
        description: "age X25519 recipient (age1...) every output is encrypted to"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Recipient
        env:
          RCPT: ${{ inputs.recipient }}
        run: |
          echo "$RCPT" | grep -Eq '^age1[02-9ac-hj-np-z]{58}$' || { echo "recipient refused"; exit 1; }
      - name: Harness (this ref)
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Target ref (candidate)
        if: inputs.source == 'candidate'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the candidate frontend (as Netlify does)
        if: inputs.source == 'candidate'
        working-directory: target/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Playwright (Chromium), ffmpeg, age
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg age >/dev/null
          ffmpeg -hide_banner -version | head -1; age --version
      - name: Capture (read only)
        env:
          READ_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SOURCE: ${{ inputs.source }}
          MODE: ${{ inputs.mode }}
          PLAN: ${{ inputs.plan }}
        run: |
          [ -n "${READ_TOKEN:-}" ] && echo "::add-mask::$READ_TOKEN"
          mkdir -p cap
          P=""
          if [ "$MODE" = record ]; then
            case "$PLAN" in *[!A-Za-z0-9._-]*|"") echo "plan name refused"; exit 1;; esac
            P="$GITHUB_WORKSPACE/harness/.github/frontend-preview/plans/$PLAN"
            test -f "$P"
          fi
          if [ "$SOURCE" = candidate ]; then
            git -C target rev-parse HEAD > cap/target_sha.txt
            ADMIN_TOKEN="$READ_TOKEN" node harness/.github/frontend-preview/serve.js target/frontend/dist target/netlify.toml 8787 cap &
            SERVER=$!
            for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8787/__preview/stats && break; sleep 1; done
            BASE=http://127.0.0.1:8787
            READ_TOKEN="" NODE_PATH="$RUNNER_TEMP/pw/node_modules" node harness/.github/frontend-preview/capture.js "$BASE" cap "$MODE" "$P"
            kill -TERM $SERVER; wait $SERVER 2>/dev/null || true
          else
            curl -s https://command.bettortoken.com/build.json > cap/production_build.json || true
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node harness/.github/frontend-preview/capture.js https://command.bettortoken.com cap "$MODE" "$P"
          fi
          if [ "$MODE" = record ]; then
            python3 harness/.github/frontend-preview/assemble.py cap "$RUNNER_TEMP/capture.mp4"
            ffprobe -v error -show_entries format=duration:stream=width,height,codec_name,pix_fmt,r_frame_rate -of compact "$RUNNER_TEMP/capture.mp4"
            mv "$RUNNER_TEMP/capture.mp4" cap/capture.mp4
            rm -rf cap/frames cap/frames.ffconcat
          fi
          du -sh cap
      - name: Encrypt (age) and verify before upload
        env:
          RCPT: ${{ inputs.recipient }}
        run: |
          tar -C cap -cf "$RUNNER_TEMP/capture.tar" .
          sha256sum "$RUNNER_TEMP/capture.tar" | cut -d' ' -f1 > capture.tar.sha256
          mkdir -p enc
          age -r "$RCPT" -o enc/capture.tar.age "$RUNNER_TEMP/capture.tar"
          head -c 21 enc/capture.tar.age | grep -q '^age-encryption.org/v1' || { echo "ciphertext header missing"; rm -rf enc; exit 1; }
          [ "$(stat -c %s enc/capture.tar.age)" -gt "$(stat -c %s "$RUNNER_TEMP/capture.tar")" ] || { echo "ciphertext size check failed"; rm -rf enc; exit 1; }
          mv capture.tar.sha256 enc/
          ls -la enc
      - uses: actions/upload-artifact@v4
        with:
          name: platform-capture-${{ github.run_id }}
          path: enc
          retention-days: 3
          if-no-files-found: error
      - name: Remove plaintext and browser profiles (always)
        if: always()
        run: |
          for f in "$RUNNER_TEMP/capture.tar" "$RUNNER_TEMP/capture.mp4"; do [ -f "$f" ] && shred -u "$f" || true; done
          [ -d cap ] && find cap -type f -exec shred -u {} + 2>/dev/null; rm -rf cap
          rm -rf /tmp/playwright* /tmp/.org.chromium.* "$HOME/.config/chromium" 2>/dev/null || true
          echo cleaned
