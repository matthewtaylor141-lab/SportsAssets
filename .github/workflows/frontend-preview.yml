name: frontend-preview

# A READ-ONLY PREVIEW OF ANY FRONTEND REF AGAINST PRODUCTION DATA.
#
# Netlify publishes only the production branch for this site (branch and
# deploy-preview aliases answer 404), so a frontend branch is previewed here
# instead: the target ref's frontend is built exactly as Netlify builds it
# (npm ci + npm run build in frontend/), served on the runner with the target
# ref's own netlify.toml redirects (.github/frontend-preview/serve.js), and
# loaded in Chromium at the agreed desktop / iPhone / iPad views plus
# landscape and reduced-motion runs (.github/frontend-preview/shots.js),
# then the Trader device acceptance (.github/frontend-preview/trader_accept.js:
# every position, order, quote and recorded Xavier action on the page equals
# the API snapshot; nothing moves while the data is held still).
#
# READ ONLY: /api/command/* is proxied to the production API like the Netlify
# rule, but only GET/HEAD are forwarded (anything else is refused by the
# server, and aborted in the browser too). The read-role token is added by
# the server process; the page, URLs, cookies and artifacts never carry it.
# Nothing is deployed; production (command.bettortoken.com) is untouched.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "branch or 40-hex commit whose frontend is previewed"
        required: true
        type: string
      recipient:
        description: "age X25519 recipient (age1...): screenshots are encrypted to it; blank = screenshots are not uploaded (this repository is public)"
        required: false
        type: string
        default: ""
      host:
        description: "preview = build target_ref and serve it locally (API reads proxied to production); production = the deployed site https://command.bettortoken.com itself (target_ref must equal its build.json sha)"
        required: false
        type: choice
        options: [preview, production]
        default: preview
      engine:
        description: "browser engine: chromium (default) or webkit; phones/tablets are emulated in it either way, never physical devices"
        required: false
        type: choice
        options: [chromium, webkit]
        default: chromium

permissions:
  contents: read

concurrency:
  group: frontend-preview-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harness (this ref)
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the target frontend (as Netlify does)
        if: inputs.host != 'production'
        working-directory: target/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          echo "target $(git -C .. rev-parse HEAD)"
          cat dist/command/build.json || true
      - name: Playwright (${{ inputs.engine }})
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          case "$ENGINE" in chromium|webkit) ;; *) echo "bad engine"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps "$ENGINE" >/dev/null 2>&1
      - name: Serve (or reach) and capture the device matrix (read only)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          HOST_MODE: ${{ inputs.host }}
          PW_ENGINE: ${{ inputs.engine }}
        run: |
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          mkdir -p out
          git -C target rev-parse HEAD > out/target_sha.txt
          if [ "$HOST_MODE" = "production" ]; then
            # THE DEPLOYED SITE ITSELF: what Netlify serves now, checked
            # against the ref asked for; nothing is built or served here, and
            # the read credential is added by the harness at the browser's
            # request layer (harness_env.js), GET/HEAD /api/command/* only
            BASE=https://command.bettortoken.com
            curl -sS --max-time 30 "$BASE/build.json" -o out/build.json
            LIVE=$(python3 -c "import json;print(json.load(open('out/build.json'))['sha'])")
            WANT=$(cat out/target_sha.txt)
            echo "{\"mode\": \"PRODUCTION_HOST\", \"host\": \"$BASE\", \"live_build_sha\": \"$LIVE\", \"target_sha\": \"$WANT\", \"match\": $([ "$LIVE" = "$WANT" ] && echo true || echo false)}" > out/run_mode.json
            cat out/run_mode.json
            [ "$LIVE" = "$WANT" ] || echo "PRODUCTION_BUILD_DIFFERS_FROM_TARGET (recorded in run_mode.json)"
            export PROD_READ_TOKEN="$ADMIN_TOKEN"
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node harness/.github/frontend-preview/shots.js "$BASE" out
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node harness/.github/frontend-preview/trader_accept.js "$BASE" out \
              || echo "trader acceptance exited non-zero (recorded; the scorecard reads its JSON)"
            unset PROD_READ_TOKEN
          else
            echo '{"mode": "PREVIEW_BUILD", "host": "http://127.0.0.1:8787"}' > out/run_mode.json
            cp target/frontend/dist/command/build.json out/build.json 2>/dev/null || true
            node harness/.github/frontend-preview/serve.js target/frontend/dist target/netlify.toml 8787 out &
            SERVER=$!
            for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8787/__preview/stats && break; sleep 1; done
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node harness/.github/frontend-preview/shots.js http://127.0.0.1:8787 out
            # Trader device acceptance: the rendered page against the API's own
            # snapshot on every device, then a frozen phase in which nothing may
            # move (out/trader_accept.json + out/trader/*.png)
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node harness/.github/frontend-preview/trader_accept.js http://127.0.0.1:8787 out \
              || echo "trader acceptance exited non-zero (recorded; the scorecard reads its JSON)"
            curl -s http://127.0.0.1:8787/__preview/stats > /dev/null
            kill -TERM $SERVER; wait $SERVER 2>/dev/null || true
            echo "== proxy =="; cat out/proxy.json
          fi
          echo "== trader acceptance verdicts =="
          python3 -c "import json;d=json.load(open('out/trader_accept.json'));print([(r.get('device'),r.get('verdict')) for r in d.get('results',[])])" || true
          # the token must never reach the artifact: name any file that holds
          # it (never its content), keep only what is clean, and fail the job
          # (a token too short to be distinctive cannot be scanned for: it
          # matches ordinary text; that is recorded, and is itself a finding)
          if [ -n "${ADMIN_TOKEN:-}" ] && [ "${#ADMIN_TOKEN}" -lt 16 ]; then
            echo "TOKEN_TOO_SHORT_TO_SCAN: the read credential is under 16 characters (a credential finding); artifact scan skipped"
          elif [ -n "${ADMIN_TOKEN:-}" ]; then
            hits=$(grep -rlF -- "$ADMIN_TOKEN" out || true)
            if [ -n "$hits" ]; then
              echo "token bytes found in: $hits (token length ${#ADMIN_TOKEN})"
              python3 - "$hits" <<'PY'
          import json, os, sys
          tok = os.environ["ADMIN_TOKEN"]
          for f in sys.argv[1].split():
              if f.endswith(".json"):
                  def walk(v, p):
                      if isinstance(v, dict):
                          for k, x in v.items():
                              if tok in str(k): print("  key at", p, "contains it")
                              walk(x, p + "/" + str(k))
                      elif isinstance(v, list):
                          for i, x in enumerate(v): walk(x, p + "/" + str(i))
                      elif tok in str(v): print("  value at", f, p)
                  walk(json.load(open(f)), "")
              os.remove(f)
          PY
              echo "files holding the token were removed; failing so this is looked at"
              exit 1
            fi
          fi
      - name: Screenshots never leave in the clear (public repository)
        if: always()
        env:
          RCPT: ${{ inputs.recipient }}
        run: |
          mkdir -p out
          shopt -s nullglob
          imgs=(out/shots out/trader)
          if [ -n "$RCPT" ] && echo "$RCPT" | grep -Eq '^age1[02-9ac-hj-np-z]{58}$'; then
            curl -sSL --max-time 120 -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz
            echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $RUNNER_TEMP/age.tgz" | sha256sum -c -
            tar -C "$RUNNER_TEMP" --strip-components=1 -xzf "$RUNNER_TEMP/age.tgz" age/age
            tar -cf "$RUNNER_TEMP/shots.tar" -C out $(cd out && ls -d shots trader 2>/dev/null)
            "$RUNNER_TEMP/age" -r "$RCPT" -o out/screenshots.tar.age "$RUNNER_TEMP/shots.tar"
            head -c 21 out/screenshots.tar.age | grep -q '^age-encryption.org/v1' || { rm -f out/screenshots.tar.age; echo "encryption check failed"; }
            shred -u "$RUNNER_TEMP/shots.tar" 2>/dev/null || true
          else
            echo "no recipient: screenshots are not uploaded"
          fi
          rm -rf out/shots out/trader
          ls out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-preview-${{ github.run_id }}
          path: out
          retention-days: 30
