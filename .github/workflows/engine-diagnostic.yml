# Live engine diagnostic — the eyes the agent session doesn't have.
#
# Claude Code sessions run behind an egress policy that allows GitHub and
# almost nothing else, so the assistant cannot reach the deployed API, the
# venue, or the odds feed. It CAN read Actions logs. This workflow runs on a
# runner with normal internet, fetches the live engine state, and prints it
# where the assistant can read it — turning "deploy, wait a day, report back"
# into "push, read the log".
#
# Everything fetched here is already public (no auth on these endpoints) and
# no secret is used, so the log is safe to read.
#
# Runs on every push to the working branch, and on demand.

name: engine-diagnostic

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Override the API base URL"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe the live engine
        env:
          DEFAULT_BASE: https://sportsassets-api.onrender.com
          OVERRIDE: ${{ github.event.inputs.api_base }}
        run: |
          BASE="${OVERRIDE:-$DEFAULT_BASE}"
          echo "API base: $BASE"

          # Render free/starter instances cold-start; give the first call room.
          probe () {
            local path="$1" ; local budget="${2:-90}"
            echo ""
            echo "───────────────────────────────────────────────────────────"
            echo "GET $path"
            echo "───────────────────────────────────────────────────────────"
            code=$(curl -sS --max-time "$budget" -o /tmp/body.json \
                        -w '%{http_code}' "$BASE$path" 2>/tmp/err || true)
            echo "HTTP ${code:-000}  ($(wc -c </tmp/body.json 2>/dev/null || echo 0) bytes)"
            if [ -s /tmp/err ]; then echo "transport: $(cat /tmp/err)"; fi
            if [ -s /tmp/body.json ]; then
              jq '.' /tmp/body.json 2>/dev/null || head -c 4000 /tmp/body.json
            fi
          }

          # The verdict line first: it names the single binding constraint.
          probe /api/engine/status 120

          # Status-row race sampler: who is writing this row? Eight quick
          # reads catch BOTH posters when a stale instance interleaves
          # with the current build (observed 2026-08-04).
          echo ""
          echo "STATUS RACE (8 samples, 10s apart — boot id or UNSTAMPED):"
          for i in $(seq 1 8); do
            # Every stage may fail standalone while the API is mid-deploy
            # (curl exit 5/7, jq exit 2 on a partial body). Bare failures
            # kill the whole step under bash -e; partial output must win.
            S=$(curl -sS --max-time 10 "$BASE/api/engine/status" 2>/dev/null || true)
            HB=$(echo "$S" | jq -r '.detail.heartbeat // .beat_at // "?"' 2>/dev/null || true)
            BOOT=$(echo "$S" | jq -r '.detail.boot.id // "UNSTAMPED"' 2>/dev/null || true)
            DROPS=$(echo "$S" | jq -r '.unstamped_drops.n // "n/a"' 2>/dev/null || true)
            echo "  sample $i: boot=$BOOT  hb=$HB  drops=$DROPS"
            sleep 10
          done
          echo ""
          echo "===================== VERDICT ============================="
          jq -r '.detail.verdict // "(no verdict — engine predates this build)"' \
             /tmp/body.json 2>/dev/null || true
          jq -r '"cycle_s=\(.detail.cycle_s // "?")  mode=\(.detail.mode // "?")  logged=\(.detail.logged // "?")  feed_events=\(.detail.feed_events // "?")  books=\(.detail.books_checked // "?")"' \
             /tmp/body.json 2>/dev/null || true
          jq -r '.beat_at // empty | "last heartbeat: \(.)"' /tmp/body.json 2>/dev/null || true
          echo "==========================================================="

          probe /api/engine/summary
          probe /api/pmus-account
          # The public track record's own summary — what the SITE shows.
          echo ""
          echo "TRACK RECORD (site payload summary):"
          curl -sS --max-time 60 -o /tmp/tr.json \
               "$BASE/api/track-record?since=2026-08-01&max_stake=100" || true
          jq -r '.summary // {} | "  settled \(.settled) (\(.wins)W-\(.losses)L)  net $\(.net_pnl)  deployed $\(.deployed)  roi \(.roi // "n/a")"' /tmp/tr.json 2>/dev/null || true
          jq -r '.excluded_over_limit // {} | "  excluded>limit: \(.count // 0) (net $\(.net_pnl // 0))"' /tmp/tr.json 2>/dev/null || true
          jq -r '"  undatable: \(.excluded_undatable // 0)"' /tmp/tr.json 2>/dev/null || true
          jq -r '(.copy_sleeve // .excluded_copy_sleeve) // {} | "  copy_sleeve: n=\(.count // 0) open=\(.open // 0) stake=$\(.stake // 0) net=$\(.net_pnl // 0)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.excluded_unattributed // {} | "  excluded_unattributed: n=\(.count // 0) stake=$\(.stake // 0) net=$\(.net_pnl // 0)"' /tmp/tr.json 2>/dev/null || true
          jq -r '"  source: \(.activities_source // "?")  archive_rows: \(.archive_rows // "?")  window_rows: \(.window_rows // "?")"' /tmp/tr.json 2>/dev/null || true
          jq -r '.error // empty | "  REFUSED: \(.)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.snapshot // {} | "  snapshot: age_s=\(.age_s // "?") pos_pages=\(.positions_pages // "?") complete=\(.positions_complete // "?") refresh_err=\(.refresh_error // "none") streak=\(.refresh_error_streak // 0)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.account // {} | "  ACCOUNT: net=$\(.net_pnl // "?") trades=\(.trades // "?") open=\(.open // "?") stake=$\(.stake // "?")"' /tmp/tr.json 2>/dev/null || true
          jq -r '.daily // [] | .[0:3][] | "  day \(.date)  pnl \(.pnl)  settled \(.settled)  open \(.open // 0)"' /tmp/tr.json 2>/dev/null || true
          # ...and the most recent days — "how is TODAY looking" must be
          # answerable from a probe without shipping anything.
          jq -r '.daily // [] | .[-3:][] | "  day(recent) \(.date)  pnl \(.pnl)  settled \(.settled)  open \(.open // 0)"' /tmp/tr.json 2>/dev/null || true
          echo ""
          echo "#   DAILY BREAKDOWN BY CATEGORY (owner report)             #"
          curl -sS --max-time 90 -o /tmp/db.json "$BASE/api/daily-breakdown" || true
          jq -r '.days[]? | "  BRK \(.date)  rn1=\(.rn1.pnl // 0)/\(.rn1.wins // 0)-\(.rn1.losses // 0)  st=\(.swisstony.pnl // 0)/\(.swisstony.wins // 0)-\(.swisstony.losses // 0)  sw=\(.software.pnl // 0)/\(.software.wins // 0)-\(.software.losses // 0)  arb=\(.arb.pnl // 0)/\(.arb.wins // 0)-\(.arb.losses // 0)"' /tmp/db.json 2>/dev/null || true
          jq -r '.totals | to_entries[]? | "  BRKTOT \(.key)  pnl=\(.value.pnl)  \(.value.wins)-\(.value.losses) of \(.value.settled)"' /tmp/db.json 2>/dev/null || true
          probe /healthz 30

          # ── the decisive number ────────────────────────────────────
          # Whether volume is low because the engine is broken or because
          # the venue simply is not offering edge is answered by ONE thing:
          # the distribution of (fair - ask) across everything we priced.
          # Printed last and compactly, because log tails are what survive.
          curl -sS --max-time 120 -o /tmp/fills.json \
               "$BASE/api/engine/fills?limit=500" || true
          curl -sS --max-time 120 -o /tmp/status.json \
               "$BASE/api/engine/status" || true

          echo ""
          echo "###########################################################"
          echo "#   WHALE COPY FEASIBILITY (copy_probes, 30d)              #"
          echo "###########################################################"
          # Does the source whale's edge survive our copy latency? Residual
          # ROI is measured against the REAL book at our REAL reaction time
          # for every fresh whale BUY — the empirical answer to whether
          # copy-trading deserves its own strategy sleeve.
          # whale= (empty) drops the username filter: the panel must count
          # every source whale, or a renamed handle reads as "no probes".
          curl -sS --max-time 60 -o /tmp/copy.json \
               "$BASE/api/copy-report?hours=720&whale=" || true
          jq -r '.summary // . | to_entries[] | "  \(.key): \(.value)"' \
             /tmp/copy.json 2>/dev/null | head -30 || echo "  (unavailable)"

          echo ""
          echo "#   PAPER AI TRADER (whale copy, paper account, 30d)        #"
          curl -sS --max-time 60 -o /tmp/ai.json \
               "$BASE/api/ai-trader?days=30" || true
          jq -r '.summary // {} | to_entries[] | "  \(.key): \(.value)"' \
             /tmp/ai.json 2>/dev/null | head -20 || echo "  (unavailable)"

          echo ""
          echo "#   LIVE COPY SLEEVE (live_orders — REAL dimes, all whales) #"
          # orders==0 with fresh sub-10c source fills means the WORKERS env
          # is missing LIVE_TRADING_ENABLED/PMUS creds (executor's venue
          # resolves to None and it no-ops silently) — say so, don't guess.
          curl -sS --max-time 60 -o /tmp/live.json "$BASE/api/live-status" || true
          jq -r '"  enabled(api env): \(.enabled // .config.enabled // "?")  paused: \(.paused // "?")",
                 (.by_whale // [] | .[] | "  whale \(.whale): fills \(.fills) deployed $\(.deployed) settled \(.settled) pnl $\(.pnl)"),
                 (.orders // .summary // {} | to_entries[] | "  \(.key): \(.value)"),
                 (.recent // [] | .[0:8][] |
                   "  \(.placed_at // "?")  \(.status // "?")  limit \(.limit_price // "?")  $\(.filled_usd // 0)  \(.market_title // "?") / \(.outcome // "?")  \(.error // "" | .[0:300])")' \
             /tmp/live.json 2>/dev/null | head -25 || echo "  (unavailable)"

          echo ""
          echo "#   MEMORY WATCH (rss_mb over 2 min — where does it die?)    #"
          for i in $(seq 1 24); do
            # A dead API must print DOWN, not exit the step (bash -e turns
            # a failed assignment-substitution into a job failure).
            hz=$(curl -sS --max-time 8 "$BASE/healthz" 2>/dev/null) && code=0 || code=$?
            ts=$(date -u +%H:%M:%S)
            if [ $code -eq 0 ] && echo "$hz" | jq -e .ok >/dev/null 2>&1; then
              echo "  $ts  $(echo "$hz" | jq -c '{rss_mb, db_ok, commit}')"
            else
              echo "  $ts  DOWN"
            fi
            sleep 5
          done

          echo ""
          echo "#   SERVICE HEARTBEATS (which worker is dead, and why)       #"
          curl -sS --max-time 60 "$BASE/api/health/services" 2>&1 | \
            jq -r '.[] | "  \(.service): \(.status)  \(.beat_at)  \(.error // "")"' \
            2>/dev/null | head -15 || echo "  (endpoint not deployed yet)"

          echo ""
          echo "#   WHALE INGESTION RAW (shape + freshness, no jq guessing) #"
          echo "  -- /api/feed?limit=2 --"
          curl -sS --max-time 60 "$BASE/api/feed?limit=2" 2>&1 | head -c 700; echo
          echo "  -- /api/whales --"
          curl -sS --max-time 60 "$BASE/api/whales" 2>&1 | head -c 700; echo

          echo ""
          echo "#   WHALE INGESTION FRESHNESS (is the pipeline alive?)      #"
          # Zero copy probes in 30d means either no fresh detections or a
          # dead listener. The newest ingested trade timestamp settles it —
          # and says whether stored whale data exists to measure edge decay.
          curl -sS --max-time 60 -o /tmp/feed.json "$BASE/api/feed?limit=3" || true
          jq -r '(.trades // .items // .) | if type=="array" then
                   (.[0:3][] | "  \(.fill_ts // .ts // .detected_at // "?")  \(.whale_username // .username // "?")  \(.side // "?") $\(.notional // .size // "?")")
                 else "  (unexpected shape)" end' /tmp/feed.json 2>/dev/null \
            | head -5 || echo "  (unavailable)"
          curl -sS --max-time 60 "$BASE/api/whales" 2>/dev/null | \
            jq -r '(.whales // .) | if type=="array" then
                     "  roster: \(length) whales; newest activity: \([.[].last_trade_at // .[].last_seen // empty] | max // "?")"
                   else "  (unexpected shape)" end' 2>/dev/null \
            || echo "  (unavailable)"

          echo ""
          echo "###########################################################"
          echo "#                 EDGE DISTRIBUTION                       #"
          echo "###########################################################"
          jq -r '
            [.[] | select(.edge != null) | .edge] as $e
            | ($e | length) as $n
            | if $n == 0 then "no priced records"
              else
                "sample: \($n) priced outcomes",
                "positive edge:      \([$e[] | select(. > 0)] | length)",
                "  ...>= 2c (would clear a typical bar): \([$e[] | select(. >= 0.02)] | length)",
                "  ...>= 8c (implausible, mapping error): \([$e[] | select(. >= 0.08)] | length)",
                "negative edge:      \([$e[] | select(. <= 0)] | length)",
                "median:             \(($e | sort)[$n/2|floor])",
                "",
                "histogram (edge in cents):",
                ( [$e[] | (. * 100) | floor] | group_by(.) | sort_by(-length)
                  | .[:14][] | "  \(.[0])c : \(length)" )
              end' /tmp/fills.json 2>/dev/null || echo "(no fills payload)"

          echo ""
          echo "worst 6 (mapping suspects — a real edge is never this big):"
          jq -r 'sort_by(.edge) | .[:6][]
                 | "  \(.edge|tostring|.[0:7])  ask \(.limit_price)  fair \(.fair_value)  \(.outcome_id)"' \
             /tmp/fills.json 2>/dev/null || true
          echo "best 6:"
          jq -r 'sort_by(-.edge) | .[:6][]
                 | "  \(.edge|tostring|.[0:7])  ask \(.limit_price)  fair \(.fair_value)  \(.outcome_id)"' \
             /tmp/fills.json 2>/dev/null || true

          echo ""
          echo "###########################################################"
          echo "#                      VERDICT                            #"
          echo "###########################################################"
          jq -r '.detail.verdict // "(engine predates the verdict build)"' /tmp/status.json 2>/dev/null || true
          # Liveness first. A blank funnel reads identically whether the
          # engine is idle or dead; the heartbeat age is what separates them.
          jq -r '"heartbeat : \(.beat_at // "NONE — engine has not reported")"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '"cycle_s   : \(.detail.cycle_s // "?")",
                 "mode      : \(.detail.mode // "?")",
                 "logged    : \(.detail.logged // "?")",
                 "feed      : \(.detail.feed_events // "?") events",
                 "matched   : \(.detail.matched // "?")   tradeable: \(.detail.tradeable // "?")",
                 "books     : \(.detail.books_checked // "?")",
                 "studied   : \(.detail.studied // "?")",
                 "reclaimed : \(.detail.reclaimed // 0)",
                 "heartbeat : \(.beat_at // "?")"' /tmp/status.json 2>/dev/null || true
          echo "blockers  :"; jq -r '.detail.blockers // {} | to_entries[] | "  \(.key) x\(.value)"' /tmp/status.json 2>/dev/null || true
          echo "rejects   :"; jq -r '.detail.rejects  // {} | to_entries[] | "  \(.key) x\(.value)"' /tmp/status.json 2>/dev/null || true
          echo "gap       :"; jq -r '.detail.threshold_gap // {} | to_entries[] | "  \(.key) x\(.value)"' /tmp/status.json 2>/dev/null || true
          echo "budget    :"; jq -r '.detail.budget // {} | to_entries[] | "  \(.key)=\(.value)"' /tmp/status.json 2>/dev/null || true
          echo ""
          echo "###########################################################"
          echo "#   ENGINE OWN BOOKS (independent of the API deploy)       #"
          echo "###########################################################"
          jq -r '.detail.performance // {} | if .days then
                   "last \(.days)d, live only: \(.live_only)",
                   "fills \(.fills)   staked $\(.staked)   open $\(.open_cost)",
                   "settled \(.settled)  (W \(.wins) / L \(.losses))  win rate \(.win_rate // "n/a")",
                   "realized $\(.realized)   ROI \(.roi // "n/a — nothing settled")"
                 else "(engine predates the scorecard build)" end' /tmp/status.json 2>/dev/null || true
          jq -r '.detail.edge_drift // {} | if .n and .n > 0 then
                   "",
                   "ADVERSE SELECTION: \(.n) entries re-observed",
                   "  edge retention \(.retention)   (1.0 = edge was real, ~0 = we bought stale quotes)",
                   "  mean drift \(.mean_drift_c)c   held \(.held)/\(.n)"
                 else "", "adverse selection: nothing matured yet" end' /tmp/status.json 2>/dev/null || true
          # Per category — a blended drift number hides the one leg doing
          # the damage, which is the whole reason the split exists.
          jq -r '.detail.edge_drift.by_category // {} | to_entries[]
                 | "    \(.key): n=\(.value.n)  drift \(.value.mean_drift_c)c  retention \(.value.retention)"' \
             /tmp/status.json 2>/dev/null || true
          echo "drift surcharge now added to each bar:"
          jq -r '.detail.drift_penalty // {} | to_entries[]
                 | "    \(.key): +\((.value * 100))c"' /tmp/status.json 2>/dev/null \
             || echo "    (none — nothing measured yet)"
          echo "refreshed this cycle: $(jq -r '.detail.refreshed // 0' /tmp/status.json 2>/dev/null)"

          echo ""
          echo "###########################################################"
          echo "#   POSITIONS BY SIZE  (cap-breach detector)               #"
          echo "###########################################################"
          # This split is by COST, nothing else. It was previously labelled
          # "system vs manual", which asserted something the boundary cannot
          # know: every position over $5 was reported as hand-placed. On
          # 2026-08-02 all twenty of them were the engine's own runaway
          # entries, and the label hid the incident behind a plausible
          # explanation. The heuristic is also circular — it assumes the caps
          # held in order to decide who placed a trade.
          #
          # Read the over-cap cohort as a BREACH LIST. With per_market at
          # $1.50, anything above it is the engine entering a market it
          # already held.
          curl -sS --max-time 120 -o /tmp/acct.json "$BASE/api/pmus-account" || true
          jq -r '"boundary: cost <= $\(.system_max_cost)  (SIZE only — says nothing about who placed it)",
                 "",
                 (.system, .manual | "[\(if .cohort == "manual" then "OVER $5 — investigate" else "within $5" end)]  \(.positions) positions, $\(.staked) staked",
                   "   settled \(.settled)  (W \(.wins) / L \(.losses))  win rate \(.win_rate // "n/a")",
                   "   realized $\(.realized)   ROI \(.roi // "n/a")",
                   "   open \(.open) worth $\(.open_cost)", "")' /tmp/acct.json 2>/dev/null || true
          echo "OVER-CAP cohort in detail (cost > \$5 against a \$1.50 per-market cap):"
          jq -r '.manual_positions // [] | if length == 0 then "   (none)"
                 else .[] | "  \(if .settled then "settled" else "OPEN   " end)  cost $\(.cost)  realized \(.realized)  \(.market_slug)" end' \
             /tmp/acct.json 2>/dev/null || true
          echo ""
          echo "within-cap positions in detail:"
          jq -r '.system_positions // [] | .[]
                 | "  \(if .settled then "settled" else "OPEN   " end)  cost $\(.cost)  realized \(.realized)  \(.market_slug)"'              /tmp/acct.json 2>/dev/null || true

          echo ""
          echo "###########################################################"
          echo "#   METHODOLOGY DOCUMENT (generated from the ledger)       #"
          echo "###########################################################"
          # The engine renders this itself from config + its own ledger and
          # publishes it here. Every number in it is computed at generation
          # time, so it cannot drift from the system it describes the way a
          # hand-maintained document does.
          code=$(curl -sS --max-time 60 -o /tmp/meth.json \
                      -w '%{http_code}' "$BASE/api/engine/methodology" || true)
          if [ "$code" = "200" ]; then
            jq -r '"published: \(.updated_at)", "bytes: \(.markdown | length)",
                   "read it: '"$BASE"'/api/engine/methodology?format=md", "",
                   "── verdict ──",
                   (.markdown | split("\n") | map(select(startswith("> **"))) | .[0] // "(none)")' \
               /tmp/meth.json 2>/dev/null || true
          else
            echo "HTTP ${code:-000} — not published yet (the worker publishes"
            echo "on startup and at each day rollover; needs the deploy with"
            echo "edge.reporting to be live)"
          fi

          echo ""
          echo "MAPPING MISSES (the funnel's biggest single loss):"
          jq -r '.detail.unpriced_examples // {} | to_entries[]
                 | "  [\(.key)]", (.value | if type=="array" then .[] else . end
                   | "     \(.)")' /tmp/status.json 2>/dev/null || true

          # ── headline, printed LAST ─────────────────────────────────
          # Everything above is diagnosis; these six lines are the state.
          # The mapping-miss dump above runs to ~90 lines, which is enough
          # to push the numbers that matter out of a log tail — so they go
          # here, where a tail always reaches them.
          echo ""
          echo "###########################################################"
          echo "#                      HEADLINE                           #"
          echo "###########################################################"
          jq -r '"verdict   : \(.detail.verdict // "?")",
                 "mode      : \(.detail.mode // "?")   cycle \(.detail.cycle_s // "?")s   logged \(.detail.logged // "?")"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.edge_drift // {} | if .n and .n > 0 then
                   "drift     : n=\(.n)  retention \(.retention)  mean \(.mean_drift_c)c"
                 else "drift     : nothing matured yet" end' /tmp/status.json 2>/dev/null || true
          jq -r '.detail.edge_drift.by_category // {} | to_entries[]
                 | "   \(.key): n=\(.value.n)  \(.value.mean_drift_c)c  ret \(.value.retention)"' \
             /tmp/status.json 2>/dev/null || true
          # Free samples: staleness measured on outcomes we priced but did
          # not buy. A floor on the fill number, never a substitute for it,
          # but it keeps measuring when the bar is too high to trade.
          jq -r '.detail.price_drift // {} | if .n and .n > 0 then
                   "free      : n=\(.n)  mean \(.mean_drift_c)c  (staleness only, no selection)"
                 else "free      : no second looks yet" end' /tmp/status.json 2>/dev/null || true
          jq -r '.detail.price_drift.by_category // {} | to_entries[]
                 | "   \(.key): n=\(.value.n)  \(.value.mean_drift_c)c"' \
             /tmp/status.json 2>/dev/null || true
          # Reversion: does apparent edge give itself back in proportion to
          # how big the claim was? That is the winner's-curse test, and it
          # decides whether the flat surcharge or proportional shrinkage is
          # the correct instrument.
          jq -r '.detail.reversion // {} | if .keep != null then
                   "reversion : keep \(.keep)  (slope \(.slope), n=\(.n)) -> SHRINKAGE ACTIVE"
                 elif .n then "reversion : n=\(.n), not yet decidable (need n>=200 and spread)"
                 else "reversion : no samples" end' /tmp/status.json 2>/dev/null || true
          echo "surcharge :"
          jq -r '.detail.drift_penalty // {} | to_entries[]
                 | "   \(.key): +\(.value * 100 | .*100|round|./100)c"' /tmp/status.json 2>/dev/null || true
          jq -r '.detail.drift_penalty // {} | if length == 0 then
                   "   (none — below the observation floor)" else empty end' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.system | "system    : \(.settled) settled  W\(.wins)/L\(.losses)  realized $\(.realized)  ROI \(.roi // "n/a")",
                           "            open \(.open) worth $\(.open_cost)"' \
             /tmp/acct.json 2>/dev/null || true
          # What crossing the spread costs, against what we claimed to win.
          # net_c below zero means we were losing at the moment of entry,
          # whatever the model said about the price.
          jq -r '"heartbeat : \(.beat_at // "NONE — engine has not reported")"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.reconciled // {} | if .trades_seen then
                   "reconciled: \(.fills_added) fills restored, $\(.cost_restored) of cost the ledger had forgotten"
                 else empty end' /tmp/status.json 2>/dev/null || true
          echo "ARBITRAGE:"
          jq -r '"   books found: \(.detail.arb_found // 0)   profit booked $\(.detail.arb_profit // 0)"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.arb_status // {} | to_entries[] | "   \(.key): \(.value)"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.arb_books // [] | .[] | "   \(.event): \(.legs) legs, cost $\(.cost), profit/set \(.profit_per_set), depth \(.depth_sets) sets"' \
             /tmp/status.json 2>/dev/null || true
          # The one state that means we are holding a position nobody chose.
          jq -r '.detail.arb_exposed // [] | .[] | "   !! EXPOSED \(.event) holding \(.holding)"' \
             /tmp/status.json 2>/dev/null || true
          echo "SPREAD COST (per fill, cents):"
          jq -r '.detail.spread_cost // {} | if length == 0 then "   (no book snapshots yet)"
                 else to_entries[] | "   \(.key): n=\(.value.n)  spread \(.value.spread_c)c  paid over mid \(.value.paid_over_mid_c)c  claimed edge \(.value.edge_c)c  NET \(.value.net_c)c" end' \
             /tmp/status.json 2>/dev/null || true
          # THE STEERING NUMBER. Profit per dollar of turnover, measured at
          # entry: (claimed edge x retention - paid over mid) / price. It
          # converges in hundreds of fills where settled P&L needs
          # thousands of resolutions; positive here and negative at
          # settlement means the MAP is wrong, not the economics.
          echo "ENTRY MARGIN (profit per $ of turnover, at entry):"
          jq -r '.detail.entry_margin // {} | if length == 0 then "   (no fills measured yet)"
                 else to_entries[] | "   \(.key): n=\(.value.n_fills)  gross \((.value.gross_margin * 100 * 100 | round) / 100)%  net \(if .value.net_margin != null then "\((.value.net_margin * 100 * 100 | round) / 100)%" else "unmeasured (retention n=\(.value.retention_n))" end)" end' \
             /tmp/status.json 2>/dev/null || true
          echo "settled by BAND (our own fills, not the inherited calibration):"
          jq -r '.detail.by_band // {} | if length == 0 then "   (nothing settled yet)"
                 else to_entries[] | "   \(.key): \(.value.settled) settled  $\(.value.realized)  ROI \(.value.roi // "n/a")" end' \
             /tmp/status.json 2>/dev/null || true
          echo "settled by CATEGORY (engine ledger, live only):"
          jq -r '.detail.by_cat_performance // {} | if length == 0 then
                   "   (nothing settled yet)"
                 else to_entries[] | "   \(.key): \(.value.settled) settled  W\(.value.wins)/L\(.value.losses)  staked $\(.value.staked)  realized $\(.value.realized)  ROI \(.value.roi // "n/a")" end' \
             /tmp/status.json 2>/dev/null || true
          echo "per day  (system cohort, settled only):"
          jq -r '.system_daily // [] | if length == 0 then "   (no settlements in window)"
                 else .[] | "   \(.day)  \(.settled) settled  W\(.wins)/L\(.losses)  staked $\(.staked)  realized $\(.realized)  ROI \(.roi // "n/a")" end' \
             /tmp/acct.json 2>/dev/null || true

      - name: Kalshi series census (runner has open internet; the container does not)
        if: always()
        run: |
          B="https://api.elections.kalshi.com/trade-api/v2"
          echo "###########################################################"
          echo "#   KALSHI SERIES CENSUS (find the real sports tickers)    #"
          echo "###########################################################"
          # Sports series list — the authoritative answer to "what does
          # Kalshi actually call tennis/MLB/WNBA series".
          curl -sS --max-time 20 "$B/series?category=Sports&limit=200" \
            | jq -r '.series[]? | "\(.ticker)  \(.title)"' 2>/dev/null \
            | sort | head -80 || echo "(series list unavailable)"
          echo ""
          echo "-- tennis-ish series, with one sample event each --"
          for S in $(curl -sS --max-time 20 "$B/series?category=Sports&limit=200" \
                       | jq -r '.series[]?.ticker' 2>/dev/null \
                       | grep -iE "tennis|atp|wta|match" | head -25); do
            echo "== $S =="
            curl -sS --max-time 15 "$B/events?series_ticker=$S&status=open&with_nested_markets=true&limit=1" \
              | jq -r '.events[]? | {title, event_ticker, outcomes: [.markets[]? | {t: .ticker, name: (.yes_sub_title // .subtitle)}]}' \
              2>/dev/null | head -30 || true
          done
          echo ""
          echo "-- MLB + WNBA sample outcome names (mapper dialect check) --"
          for S in KXMLBGAME KXWNBAGAME; do
            echo "== $S =="
            curl -sS --max-time 15 "$B/events?series_ticker=$S&status=open&with_nested_markets=true&limit=2" \
              | jq -r '.events[]? | {title, event_ticker, outcomes: [.markets[]? | (.yes_sub_title // .subtitle)]}' \
              2>/dev/null | head -20 || true
          done

      - name: Crypto census — Kalshi BTC 15-min series (xv_crypto ground truth)
        if: always()
        run: |
          B="https://api.elections.kalshi.com/trade-api/v2"
          echo "###########################################################"
          echo "#   KALSHI BTC SERIES (discover, don't guess)              #"
          echo "###########################################################"
          # The scanner (edge/shadow/xv_crypto.py) resolves BTC series the
          # same way: list series by category, keep tickers containing BTC.
          # This step prints the venue's actual naming so tuning happens
          # against ground truth, never guesses like KXBTC15M.
          : > /tmp/btc_series.txt
          for CAT in Crypto Financials; do
            echo "-- /series?category=$CAT — tickers containing BTC --"
            curl -sS --max-time 20 "$B/series?category=$CAT&limit=200" \
              -o /tmp/series.json || true
            jq -r '.series[]? | "\(.ticker)  \(.title)  freq=\(.frequency // "?")"' \
              /tmp/series.json 2>/dev/null | grep -i btc | tee -a /tmp/btc_cat.txt \
              || echo "(none / unavailable)"
            jq -r '.series[]?.ticker' /tmp/series.json 2>/dev/null \
              | grep -i btc >> /tmp/btc_series.txt || true
            sleep 1
          done
          echo ""
          echo "-- 3 sample open events per BTC series (tickers/strikes/close_times) --"
          for S in $(sort -u /tmp/btc_series.txt | head -8); do
            echo "== $S =="
            curl -sS --max-time 15 \
              "$B/events?series_ticker=$S&status=open&with_nested_markets=true&limit=3" \
              | jq -r '.events[0:3][]? | {event_ticker, title,
                       markets: [.markets[0:4][]? | {ticker, strike_type,
                                 floor_strike, cap_strike, close_time,
                                 sub: (.yes_sub_title // .subtitle)}]}' \
              2>/dev/null | head -60 || true
            sleep 1
          done

      - name: Crypto census — PMUS crypto markets (public gateway via SDK)
        if: always()
        run: |
          pip install --quiet polymarket-us 2>/dev/null || pip install polymarket-us
          echo "###########################################################"
          echo "#   PMUS CRYPTO CENSUS (slugs, strikes, close times)       #"
          echo "###########################################################"
          python - <<'PY'
          from polymarket_us import PolymarketUS

          pub = PolymarketUS()
          variants = [
              {"active": True, "closed": False, "categories": ["crypto"]},
              {"active": True, "closed": False, "categories": ["Crypto"]},
              {"active": True, "closed": False},
          ]
          events, used = [], None
          for v in variants:
              try:
                  resp = pub.events.list({"limit": 100, **v}) or {}
              except Exception as e:
                  print("variant", v, "->", type(e).__name__, str(e)[:120])
                  continue
              evs = resp.get("events") or []
              print("variant", v, "->", len(evs), "events")
              if evs and used is None:
                  events, used = evs, v
          print("USING:", used)
          words = ("bitcoin", "btc", "ethereum", "eth ", "crypto", "solana", "xrp")
          crypt = [e for e in events
                   if any(w in (e.get("title") or "").lower() for w in words)]
          print(len(crypt), "crypto-looking events of", len(events))
          for e in crypt[:6]:
              print("=" * 66)
              print("event:", e.get("slug"), "|", (e.get("title") or "")[:80])
              print("event keys:", sorted(e.keys()))
              for m in (e.get("markets") or [])[:4]:
                  print("  market:", m.get("slug"),
                        "| title:", (m.get("title") or "?")[:60],
                        "| outcome:", m.get("outcome"),
                        "| closed:", m.get("closed"))
                  print("  market keys:", sorted(m.keys()))
                  for k in ("closeTime", "close_time", "endTime", "end_time",
                            "endDate", "end_date", "expirationTime",
                            "startTime", "start_time"):
                      val = m.get(k) or e.get(k)
                      if val:
                          print("   ", k, "=", val)
          if not crypt:
              # The listing has no crypto — print what surfaces the SDK has
              # so the next tuning pass knows where to look for a search API.
              print("NO crypto events in listing; SDK surfaces:",
                    [a for a in dir(pub) if not a.startswith("_")])
          PY

      - name: Kalshi raw orderbook (what shape does the API actually return)
        if: always()
        run: |
          B="https://api.elections.kalshi.com/trade-api/v2"
          echo "###########################################################"
          echo "#   KALSHI MARKET STATES (why are the books empty?)        #"
          echo "###########################################################"
          for SERIES in KXWTAMATCH KXMLBGAME KXWNBAGAME; do
            sleep 1
            echo "== $SERIES: first 3 open events, with MARKET STATUSES =="
            CODE=$(curl -sS -o /tmp/ev.json -w "%{http_code}" --max-time 15 \
              "$B/events?series_ticker=$SERIES&status=open&with_nested_markets=true&limit=3")
            echo "   (events HTTP $CODE)"
            jq -r '.events[]? | "\(.event_ticker): " + ([.markets[]? | "\(.ticker | split("-") | last)=\(.status)"] | join(" "))' /tmp/ev.json 2>/dev/null | head -6 || true
            T=$(jq -r '[.events[]?.markets[]?.ticker][0] // empty' /tmp/ev.json 2>/dev/null)
            if [ -n "$T" ]; then
              sleep 1
              echo "   -- orderbook for $T (any status) --"
              CODE=$(curl -sS -o /tmp/ob.json -w "%{http_code}" --max-time 15 "$B/markets/$T/orderbook")
              echo "   (orderbook HTTP $CODE)"
              head -c 500 /tmp/ob.json; echo ""
              sleep 1
              curl -sS --max-time 15 "$B/markets/$T" \
                | jq '{ticker: .market.ticker, status: .market.status, open_time: .market.open_time, close_time: .market.close_time, yes_bid: .market.yes_bid, yes_ask: .market.yes_ask, volume: .market.volume, liquidity: .market.liquidity}' 2>/dev/null || true
            fi
          done

      - name: Kalshi V2 create-order spec (docs, via runner)
        if: always()
        run: |
          echo "###########################################################"
          echo "#   KALSHI V2 CREATE-ORDER SPEC                            #"
          echo "###########################################################"
          curl -sSL --max-time 20 \
            "https://docs.kalshi.com/api-reference/orders/create-order-v2.md" \
            -o /tmp/v2.md || true
          wc -c /tmp/v2.md
