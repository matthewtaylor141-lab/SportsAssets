# Live engine diagnostic — the eyes the agent session doesn't have.
#
# Claude Code sessions run behind an egress policy that allows GitHub and
# almost nothing else, so the assistant cannot reach the deployed API, the
# venue, or the odds feed. It CAN read Actions logs. This workflow runs on a
# runner with normal internet, fetches the live engine state, and prints it
# where the assistant can read it — turning "deploy, wait a day, report back"
# into "push, read the log".
#
# Everything fetched here is already public (no auth on these endpoints) and
# no secret is used, so the log is safe to read.
#
# Runs on every push to the working branch, and on demand.

name: engine-diagnostic

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Override the API base URL"
        required: false
        default: ""
      premap_live:
        description: "Flip the premap-live resume lever (on/off; empty = leave alone). Owner-authorized resume path 2026-08-24."
        required: false
        default: ""
      side_echo_reset:
        description: "Type 'confirm' to clear the side-echo circuit AND lift the mapping quarantine (the full resume after an admin-reviewed trip; empty = leave alone). Owner-authorized 2026-08-29."
        required: false
        default: ""
      s1_arm_override:
        description: "Owner-override arm for the S1 chain emitter (on/off; empty = leave alone). Arms without the cert clock; sticky trips keep full authority. Owner order 2026-08-29: 'get it live now'."
        required: false
        default: ""
      verified_whales:
        description: "Set the DB verified-whales roster (comma list, beats the env; 'clear' removes the override; empty = leave alone). Owner order 2026-08-29: 'update the variables'."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # 10 -> 20 (2026-08-18): the weekly-report blob endpoints grew to
    # ~7.5 min combined and were pushing the probe step past the job
    # timeout, cancelling it mid-log four runs in a row.
    #
    # 20 -> 32 (2026-08-31): it happened again, on runs 1408 and 1409,
    # cancelling "Probe the live engine" at 20:07 both times. Removing
    # the whole-book read I had added bought back only seconds, so the
    # step is simply at budget on its own — the endpoints it walks have
    # kept growing. A cancelled probe still prints its early lines,
    # which is why this hid: BRK and EXITCENSUS survive and the TAIL
    # dies, so the log looks healthy exactly where it is read most.
    # Give it real headroom rather than trimming instrumentation that
    # is doing its job.
    timeout-minutes: 32
    steps:
      # The journal publisher (ops/publish_journal.py) runs from the
      # repo — without a checkout the probe job has no files at all
      # (found the hard way 2026-08-21: 'No such file or directory').
      - uses: actions/checkout@v4
      - name: Probe the live engine
        env:
          DEFAULT_BASE: https://sportsassets-api.onrender.com
          OVERRIDE: ${{ github.event.inputs.api_base }}
          # Optional repo secret: enables the DESKG board-count and
          # JARVIS-notes probe lines (admin-gated endpoints). Absent
          # secret -> those curls 401 and the lines print nothing.
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # Resume lever input (owner order 2026-08-24). Passed via env
          # deliberately: any ${{ }} inside the giant run block makes
          # GitHub treat the WHOLE block as one expression template and
          # trips the 21,000-char expression cap — run #1026 failed to
          # parse exactly that way.
          PREMAP_LIVE_INPUT: ${{ inputs.premap_live }}
          SIDE_ECHO_RESET_INPUT: ${{ inputs.side_echo_reset }}
          S1_ARM_OVERRIDE_INPUT: ${{ inputs.s1_arm_override }}
          VERIFIED_WHALES_INPUT: ${{ inputs.verified_whales }}
        run: |
          BASE="${OVERRIDE:-$DEFAULT_BASE}"
          echo "API base: $BASE"

          # Render free/starter instances cold-start; give the first call room.
          probe () {
            local path="$1" ; local budget="${2:-90}"
            echo ""
            echo "───────────────────────────────────────────────────────────"
            echo "GET $path"
            echo "───────────────────────────────────────────────────────────"
            code=$(curl -sS --max-time "$budget" -o /tmp/body.json \
                        -w '%{http_code}' "$BASE$path" 2>/tmp/err || true)
            echo "HTTP ${code:-000}  ($(wc -c </tmp/body.json 2>/dev/null || echo 0) bytes)"
            if [ -s /tmp/err ]; then echo "transport: $(cat /tmp/err)"; fi
            if [ -s /tmp/body.json ]; then
              # Bulk arrays (kalshi_export, tennis-week rows) are thousands of
              # pretty-printed lines and evict the funnel/balances from the
              # ~5k-line retrievable tail — they ship compactly further down.
              jq 'del(.detail.kalshi_export, .detail.kalshi_export_raw, .detail.kalshi_tennis_week.rows)' \
                 /tmp/body.json 2>/dev/null || head -c 4000 /tmp/body.json
            fi
          }

          # The verdict line first: it names the single binding constraint.
          probe /api/engine/status 120

          # Status-row race sampler: who is writing this row? Eight quick
          # reads catch BOTH posters when a stale instance interleaves
          # with the current build (observed 2026-08-04).
          echo ""
          echo "STATUS RACE (8 samples, 10s apart — boot id or UNSTAMPED):"
          for i in $(seq 1 8); do
            # Every stage may fail standalone while the API is mid-deploy
            # (curl exit 5/7, jq exit 2 on a partial body). Bare failures
            # kill the whole step under bash -e; partial output must win.
            S=$(curl -sS --max-time 10 "$BASE/api/engine/status" 2>/dev/null || true)
            HB=$(echo "$S" | jq -r '.detail.heartbeat // .beat_at // "?"' 2>/dev/null || true)
            BOOT=$(echo "$S" | jq -r '.detail.boot.id // "UNSTAMPED"' 2>/dev/null || true)
            DROPS=$(echo "$S" | jq -r '.unstamped_drops.n // "n/a"' 2>/dev/null || true)
            echo "  sample $i: boot=$BOOT  hb=$HB  drops=$DROPS"
            sleep 10
          done
          echo ""
          echo "===================== VERDICT ============================="
          jq -r '.detail.verdict // "(no verdict — engine predates this build)"' \
             /tmp/body.json 2>/dev/null || true
          jq -r '"cycle_s=\(.detail.cycle_s // "?")  mode=\(.detail.mode // "?")  logged=\(.detail.logged // "?")  feed_events=\(.detail.feed_events // "?")  books=\(.detail.books_checked // "?")"' \
             /tmp/body.json 2>/dev/null || true
          jq -r '.beat_at // empty | "last heartbeat: \(.)"' /tmp/body.json 2>/dev/null || true
          echo "==========================================================="

          probe /api/engine/summary
          probe /api/pmus-account
          # The public track record's own summary — what the SITE shows.
          echo ""
          echo "TRACK RECORD (site payload summary):"
          curl -sS --max-time 60 -o /tmp/tr.json \
               "$BASE/api/track-record?since=2026-08-01" || true
          jq -r '.summary // {} | "  settled \(.settled) (\(.wins)W-\(.losses)L)  net $\(.net_pnl)  deployed $\(.deployed)  roi \(.roi // "n/a")"' /tmp/tr.json 2>/dev/null || true
          jq -r '.excluded_over_limit // {} | "  excluded>limit: \(.count // 0) (net $\(.net_pnl // 0))"' /tmp/tr.json 2>/dev/null || true
          jq -r '"  undatable: \(.excluded_undatable // 0)"' /tmp/tr.json 2>/dev/null || true
          jq -r '(.copy_sleeve // .excluded_copy_sleeve) // {} | "  copy_sleeve: n=\(.count // 0) open=\(.open // 0) stake=$\(.stake // 0) net=$\(.net_pnl // 0)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.excluded_unattributed // {} | "  excluded_unattributed: n=\(.count // 0) stake=$\(.stake // 0) net=$\(.net_pnl // 0)"' /tmp/tr.json 2>/dev/null || true
          jq -r '"  source: \(.activities_source // "?")  archive_rows: \(.archive_rows // "?")  window_rows: \(.window_rows // "?")"' /tmp/tr.json 2>/dev/null || true
          jq -r '.error // empty | "  REFUSED: \(.)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.restored_across_deploy // empty | "  RESTORED-ACROSS-DEPLOY: \(.)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.stale_served // empty | "  STALE-SERVED: streak=\(.refused_streak) fresh=\(.fresh_settled)/$\(.fresh_stake) high=\(.high_settled)/$\(.high_stake)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.rebaselined // empty | "  REBASELINED: \(.reason)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.served_by // "fresh" | "  served_by: \(.)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.provenance // "n/a" | "  provenance: \(.)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.hydrate_err // empty | "  HYDRATE: chunks=\(.chunks) err=\(.err // "none")"' /tmp/tr.json 2>/dev/null || true
          jq -r '"  generated_age_s: \((now - (.generated_at // now)) | round)"' /tmp/tr.json 2>/dev/null || true
          jq -r '.snapshot // {} | "  snapshot: age_s=\(.age_s // "?") pos_pages=\(.positions_pages // "?") complete=\(.positions_complete // "?") refresh_err=\(.refresh_error // "none") streak=\(.refresh_error_streak // 0)"' /tmp/tr.json 2>/dev/null || true
          # Copies cohort — the record the copy thesis stands on (owner
          # order 2026-08-20: show that the system is profitable).
          echo "COPIES RECORD (uncapped, order audit):"
          curl -sS --max-time 30 -o /tmp/cop.json "$BASE/api/copies-record" || true
          jq -r '.total // {} | "  COPIES: settled \(.settled) (\(.wins)W-\(.losses)L)  pnl $\(.pnl)  staked $\(.staked)  roi \(.roi // "n/a")"' \
             /tmp/cop.json 2>/dev/null || true
          jq -r '.by_whale[]? | "  COPYW \(.whale)  \(.wins)W-\(.losses)L  $\(.pnl)  roi \(.roi // "n/a")"' \
             /tmp/cop.json 2>/dev/null || true
          # Partner-report splits (owner order 2026-08-20 evening):
          # per-(whale, sport) return on capital, per-(day, whale)
          # series, and the software complement's uncapped daily cost.
          jq -r '.by_whale_sport[]? | "  COPYS \(.whale)|\(.sport)  \(.wins)W-\(.losses)L  pnl \(.pnl)  staked \(.staked)  roi \(.roi // "n/a")"' \
             /tmp/cop.json 2>/dev/null || true
          jq -r '.daily_by_whale[]? | "  COPYD \(.day)|\(.whale)  \(.wins)W-\(.losses)L  pnl \(.pnl)  staked \(.staked)"' \
             /tmp/cop.json 2>/dev/null || true
          jq -r '.software.total // {} | "  SOFT-TOT settled \(.settled) (\(.wins)W-\(.losses)L)  pnl \(.pnl)  staked \(.staked)"' \
             /tmp/cop.json 2>/dev/null || true
          jq -r '.software.daily[]? | "  SOFTD \(.day)  \(.wins)W-\(.losses)L  pnl \(.pnl)  staked \(.staked)"' \
             /tmp/cop.json 2>/dev/null || true
          # Venue-truth rebuild (task #74) — first call kicks the
          # background build; the summary line is what the probe grades.
          echo "VENUE-TRUTH (uncapped, from venue ledgers):"
          curl -sS --max-time 30 -o /tmp/vt.json "$BASE/api/venue-truth" || true
          jq -r 'if .building then "  building (first request since boot)"
                 else "  since \(.since)  settled \(.total.settled) (\(.total.wins)W-\(.total.losses)L)  realized $\(.total.realized)  cost $\(.total.settled_cost)  partial=\(.partial)  age_s=\(.age_s)" end' \
             /tmp/vt.json 2>/dev/null || true
          jq -r '.polymarket_us // {} | if .error then "  PM: ERROR \(.error)" else "  PM: settled \(.settled // "?") realized $\(.realized // "?") open \(.open // "?") ($\(.open_cost // "?"))" end' \
             /tmp/vt.json 2>/dev/null || true
          jq -r '.kalshi // {} | if .error then "  KX: ERROR \(.error)" else "  KX: settled \(.settled // "?") realized $\(.realized // "?") open \(.open // "?") ($\(.open_cost // "?"))" end' \
             /tmp/vt.json 2>/dev/null || true
          jq -r '.kalshi_window_incomplete // empty | "  KX-WINDOW-INCOMPLETE: n=\(.n) \(.tickers | join(","))"' \
             /tmp/vt.json 2>/dev/null || true
          jq -r '.kalshi_note // empty | "  KX-NOTE: \(.)"' /tmp/vt.json 2>/dev/null || true
          jq -r '.daily[]? | "  vt-day \(.day)  realized $\(.realized)  \(.wins)W-\(.losses)L of \(.settled)"' \
             /tmp/vt.json 2>/dev/null | head -8 || true
          # Cash-out ledger (owner 2026-08-08 night: "I see a bunch of
          # cash outs" — name them from the venue's own sell records, so
          # sleeve exits and manual sells are never conflated again).
          echo "SELL LEDGER (every venue-reported sale, by market):"
          jq -r '.sold_markets[]? |
                 "  \(.slug)  qty \(.qty)  proceeds $\(.proceeds)  realized $\(.realized)  at \(.last_ts // 0 | todate)"' \
             /tmp/tr.json 2>/dev/null || true
          echo "CASH-OUTS (rows the venue says were sold, newest first):"
          jq -r '[.rows[]? | select(.cashed_out == true)] |
                 "  total: \(length)  net $\([.[].pnl // 0] | add // 0 | .*100 | round | ./100)",
                 (sort_by(-(.settled_ts // 0)) | .[:12][] |
                  "  \(.title // .slug)  stake $\(.stake)  pnl $\(.pnl // "open")  cohort \(.cohort // "ai")")' \
             /tmp/tr.json 2>/dev/null || true
          # Report downloads (owner 2026-08-07): prove the endpoints serve.
          echo "REPORTS:"
          echo "  range: $(curl -sS --max-time 30 "$BASE/api/report/range?from=2026-08-01" | head -c 120)"
          echo "  pdf: HTTP $(curl -sS -o /dev/null -w '%{http_code} %{size_download}b' --max-time 60 "$BASE/api/report.pdf?from=2026-08-01")"
          echo "  csv: HTTP $(curl -sS -o /dev/null -w '%{http_code} %{size_download}b' --max-time 60 "$BASE/api/report.csv?from=2026-08-01")"
          echo "  today-live: $(curl -sS --max-time 30 "$BASE/api/today-live" | head -c 160)"
          # Which build is the SITE actually serving (owner 2026-08-07:
          # "no changes on the front end" — answer with evidence).
          # The exact Netlify hostname is not recorded anywhere in the
          # repo, and the last two guesses 404ed. Discover it: fetch each
          # candidate, AND ask the API's CORS layer which origin it is
          # configured to allow — CORS_ORIGINS was set to the real site
          # URL, so the echoed Access-Control-Allow-Origin is ground truth.
          # polymarkettracker1 is the CONFIRMED production hostname —
          # named by real browser traffic via /api/system/seen-origins
          # on 2026-08-07. It goes first; the rest stay as fallbacks in
          # case the site is ever renamed.
          echo "SITE discovery:"
          FOUND=""
          for H in polymarkettracker1 markettracker1 marketracker1; do
            CODE=$(curl -s -o /tmp/h.html -w '%{http_code}' --max-time 15 "https://$H.netlify.app/" || echo ERR)
            B=$(grep -o '[^"]*assets/index-[^"]*\.js' /tmp/h.html | head -1 || true)
            ACAO=$(curl -s -o /dev/null --max-time 15 -X OPTIONS "$BASE/api/track-record" \
                     -H "Origin: https://$H.netlify.app" \
                     -H "Access-Control-Request-Method: GET" -D - \
                   | grep -i '^access-control-allow-origin' | tr -d '\r' || true)
            TITLE=$(grep -o '<title>[^<]*' /tmp/h.html | head -1 | cut -c8-80 || true)
            echo "  $H.netlify.app -> HTTP $CODE bundle=${B:-none} title=[${TITLE:-none}]"
            # Our app's title is the identity check; a 200 without our
            # title or a bundle is someone else's site, not evidence.
            if [ "$CODE" = "200" ] && [ -z "$B" ]; then
              head -c 240 /tmp/h.html | tr -d '\r\n' | sed 's/^/    | /'; echo ""
            fi
            if [ -n "$B" ] && [ -z "$FOUND" ]; then FOUND="https://$H.netlify.app"; BUNDLE="$B"; fi
          done
          if [ -n "$FOUND" ]; then
            echo "SITE bundle: $BUNDLE at $FOUND"
            curl -sS --max-time 30 "$FOUND/${BUNDLE#/}" -o /tmp/site.js || true
            echo "  deployed build: $(grep -o 'bsha_[0-9a-f]\{7\}\|bsha_dev' /tmp/site.js | head -1 || echo 'pre-stamp build')"
            echo "  live-strip present: $(grep -c "TODAY'S SETTLEMENTS" /tmp/site.js || echo 0)"
            echo "  reports-card present: $(grep -c 'Performance Reports' /tmp/site.js || echo 0)"
            echo "  homepage-v4 present: $(grep -c 'BEST DAY' /tmp/site.js || echo 0)"
            echo "  is-our-app: $(grep -c 'sportsassets-api.onrender.com' /tmp/site.js || echo 0)"
          else
            echo "SITE bundle: NOT FOUND on any candidate hostname"
          fi
          # Ground truth beats guessing: hostnames of real browsers that
          # have hit this API since its last restart.
          echo "SEEN ORIGINS (real browser traffic):"
          curl -s --max-time 20 "$BASE/api/system/seen-origins" \
            | jq -r '.origins[]? | "  \(.host)  (\(.ago_s)s ago)"' || true
          jq -r '.account // {} | "  ACCOUNT: net=$\(.net_pnl // "?") trades=\(.trades // "?") open=\(.open // "?") stake=$\(.stake // "?")"' /tmp/tr.json 2>/dev/null || true
          jq -r '.daily // [] | .[0:3][] | "  day \(.date)  pnl \(.pnl)  settled \(.settled)  open \(.open // 0)"' /tmp/tr.json 2>/dev/null || true
          # ...and the most recent days — "how is TODAY looking" must be
          # answerable from a probe without shipping anything.
          # `deployed` and `trades` are the VOLUME line — the record has
          # carried them per day all along and the probe printed only
          # P&L, so "how much have we traded this week" was unanswerable
          # from a heartbeat (owner question 2026-08-12). Five days, so a
          # Monday-to-date question is one read.
          jq -r '.daily // [] | .[-5:][] | "  day(recent) \(.date)  pnl \(.pnl)  settled \(.settled)  open \(.open // 0)  VOLUME $\(.deployed // 0) over \(.trades // 0) trades"' /tmp/tr.json 2>/dev/null || true
          echo ""
          echo "#   DAILY BREAKDOWN BY CATEGORY (owner report)             #"
          curl -sS --max-time 90 -o /tmp/db.json "$BASE/api/daily-breakdown" || true
          # `acct` is the DAY ANCHOR and `sw` is the plug that closes the
          # identity against it (app.py: software.pnl = acct - attributed).
          # Printing them side by side is the difference between reading a
          # strategy's loss and reading an attribution gap — without it the
          # 08-12 report showed software "losing" $353 on a day it settled
          # nothing at all, and the two are indistinguishable on the line.
          # copies = ALL sleeve categories summed (2026-08-22: the line
          # printed only rn1/st, so a day carried by ferrari/0x076daa87/
          # HomeRunHazard read as "copies did nothing" while the remainder
          # -- which is fees + marks + >cap trades, NOT software -- looked
          # like a software loss. Twice now that misread reached the owner.)
          jq -r '.days[]? | . as $d | ([$d.rn1, $d.swisstony, $d.kch123, $d.homerunhazard, $d["0x2c335066fe58fe9237c3d3dc7b275c2a034a0563-1759935795465"], $d.ferrarichampions2026, $d["0x076daa87"]] | map(select(. != null)) | {p: (map(.pnl) | add // 0), w: (map(.wins) | add // 0), l: (map(.losses) | add // 0)}) as $c | "  BRK \($d.date)  acct=\($d.account // "?")  copies=\($c.p)/\($c.w)-\($c.l)  ud=\($d.underdog.pnl // 0)  man=\($d.manual.pnl // 0)  ext=\($d.external.pnl // 0)  arb=\($d.arb.pnl // 0)/\($d.arb.wins // 0)-\($d.arb.losses // 0)  resid=\($d.residual.pnl // 0)"' /tmp/db.json 2>/dev/null || true
          jq -r '.totals | to_entries[]? | "  BRKTOT \(.key)  pnl=\(.value.pnl)  \(.value.wins)-\(.value.losses) of \(.value.settled)"' /tmp/db.json 2>/dev/null || true

          # PHANTOM DETECTOR (2026-08-30). The defect that hid for
          # thirteen days was P&L filed under a category with no trades
          # behind it -- `unattr=4970.76/0set` was ON THIS LINE the whole
          # time and read as an ordinary number. `residual` is EXEMPT by
          # construction (it is an error term and always carries
          # settled=0); ANY OTHER category doing it is a real alarm.
          jq -r '.days[]? | . as $d | ($d | to_entries[]
                   | select(.value | type == "object")
                   | select(.key != "residual")
                   | select((.value.settled // 0) == 0
                            and ((.value.pnl // 0) | fabs) > 0.005)
                   | "  BRK-PHANTOM \($d.date) \(.key) pnl=\(.value.pnl) settled=0 — dollars in a category with no trades")' \
             /tmp/db.json 2>/dev/null || true
          jq -r 'if (.reconciled // false) and (.cross_foots_by_construction // false)
                 then "  BRK-TIEOUT cross-foots BY CONSTRUCTION (residual = acct - attributed) — an identity, NOT an independent check"
                 else "  BRK-TIEOUT unexpected shape — the residual identity may have changed" end' \
             /tmp/db.json 2>/dev/null || true

          # ── unattributed residual, row by row (owner order 2026-08-23:
          # "every cent of it") — TODAY's day-detail: the anchor rows vs
          # the copies audit, per-market deltas largest first, plus the
          # non-copy rows that land wholly in the residual.
          # ── RESUME LEVER (owner order 2026-08-24, "copies on and
          # firing for the verifiably profitable whales"): when the
          # dispatch input is set, flip premap-live through the admin
          # switch and print the verdict verbatim — a fully audited
          # go/no-go action, never an ambient default.
          if [ "$PREMAP_LIVE_INPUT" = "on" ] || [ "$PREMAP_LIVE_INPUT" = "off" ]; then
            echo "  LEVER premap-live -> $PREMAP_LIVE_INPUT"
            curl -sS --max-time 30 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
              "$BASE/api/admin/premap-live/$PREMAP_LIVE_INPUT" \
              | head -c 400 || echo "  LEVER call failed"
            echo ""
          fi
          # ── SIDE-ECHO RESET LEVER (owner-authorized 2026-08-29, after
          # the 2026-08-28 trip was reviewed and found to be a net-
          # position confound of our own whale-exit sell): clears the
          # un-overridable circuit and lifts the quarantine the trip
          # re-armed. Requires the literal input 'confirm' — this is
          # the human-eyes step the circuit's design demands, done as a
          # fully audited dispatch, never an ambient default.
          if [ "$SIDE_ECHO_RESET_INPUT" = "confirm" ]; then
            echo "  LEVER side-echo-reset -> confirm"
            curl -sS --max-time 30 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
              "$BASE/api/admin/side-echo-reset" \
              | head -c 400 || echo "  LEVER call failed"
            echo ""
            echo "  LEVER quarantine -> off"
            curl -sS --max-time 30 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
              "$BASE/api/admin/quarantine/off" \
              | head -c 400 || echo "  LEVER call failed"
            echo ""
          fi
          # ── S1 OWNER-OVERRIDE ARM (owner order 2026-08-29, "get it
          # live now"): arms the chain emitter without the cert clock;
          # sticky trips keep full authority. 'off' returns to the
          # certified regime.
          if [ "$S1_ARM_OVERRIDE_INPUT" = "on" ] || [ "$S1_ARM_OVERRIDE_INPUT" = "off" ]; then
            echo "  LEVER s1-arm-override -> $S1_ARM_OVERRIDE_INPUT"
            curl -sS --max-time 30 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
              "$BASE/api/admin/s1/arm-override/$S1_ARM_OVERRIDE_INPUT" \
              | head -c 400 || echo "  LEVER call failed"
            echo ""
          fi
          # ── VERIFIED-WHALES ROSTER LEVER (owner order 2026-08-29,
          # "update the variables"): stores the roster in the DB where
          # it beats a stale env. 'clear' removes the override.
          if [ -n "$VERIFIED_WHALES_INPUT" ]; then
            echo "  LEVER verified-whales -> $VERIFIED_WHALES_INPUT"
            if [ "$VERIFIED_WHALES_INPUT" = "clear" ]; then
              BODY='{"clear": true}'
            else
              BODY="{\"whales\": \"$VERIFIED_WHALES_INPUT\"}"
            fi
            curl -sS --max-time 30 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
              -H "Content-Type: application/json" -d "$BODY" \
              "$BASE/api/admin/verified-whales" \
              | head -c 400 || echo "  LEVER call failed"
            echo ""
          fi
          # ── GATES ECHO (2026-08-29 audit): print the EFFECTIVE gate
          # values so a stale env can never hide from a probe again.
          curl -sS --max-time 30 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/gates.json "$BASE/api/admin/gates" || true
          jq -r '"  GATES verified(\(.verified_source)): \(.verified_effective | join(","))",
                 "  GATES env_set=\(.verified_env_set) stored=\(.verified_stored | tostring | .[0:160])",
                 "  GATES allow_short_env=\(.allow_short_env // "unset")  short_proof=\(.short_side_proof | tostring | .[0:200])",
                 "  GATES exitable: \(.exitable | join(","))",
                 "  GATES sizing: mode=\(.sizing.copy_mode // "?") max_clip=\(.sizing.max_clip_usd // "?") probe_day=\(.sizing.probe_day_usd // "?") trial_day=\(.sizing.trial_daily_usd // "?") trial_total=\(.sizing.trial_total_usd // "?")",
                 "  GATES clips: \(.sizing.per_fill_by_whale // {} | to_entries | map("\(.key)=\(.value)") | join(" "))"' \
             /tmp/gates.json 2>/dev/null || true

          # ── the thesis verification (owner order 2026-08-24: verified,
          # not guessed): per whale, his TRUE edge on the full detected
          # book at his prices vs what our reaction time achieves
          curl -sS --max-time 90 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/tedge.json "$BASE/api/admin/whale-true-edge" || true
          jq -r '.whales[]? | "  TRUEEDGE \(.whale)  detected=\(.detected)  cf_total=\(.cf_total)  cf_on_filled=\(.cf_on_filled)  paper_actual=\(.paper_actual)  miss_sel=\(.miss_selection)  lat_cost=\(.latency_price_cost)  cf_wins=\(.cf_wins)/\(.cf_graded)"' /tmp/tedge.json 2>/dev/null || true
          # FAST COHORT (owner order 2026-08-24 evening, the swisstony
          # question): the blended paper figure averages over months of
          # minutes-late polling, so it reports the OLD world forever.
          # Restricted to detections inside 5s it measures what today's
          # sub-second chain path actually achieves on each whale's flow
          # — the only number that can justify resuming a held whale.
          curl -sS --max-time 90 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/tedge_fast.json \
               "$BASE/api/admin/whale-true-edge?max_reaction_s=5" || true
          jq -r '.whales[]? | select(.detected > 20)
                 | "  TRUEEDGE-FAST \(.whale)  detected=\(.detected)  cf_total=\(.cf_total)  paper_actual=\(.paper_actual)  lat_cost=\(.latency_price_cost)  cf_wins=\(.cf_wins)/\(.cf_graded)"' \
            /tmp/tedge_fast.json 2>/dev/null || echo "  TRUEEDGE-FAST unavailable"

          # ── the syllogism test (owner order 2026-08-24): per whale,
          # venue-true outcomes priced at HIS fill vs OURS — who is
          # copyable at price parity, and what latency actually cost
          curl -sS --max-time 90 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/edge.json "$BASE/api/admin/edge-decay" || true
          jq -r '.whales[]? | "  EDGE \(.whale)  n=\(.n)  at_his=\(.at_his)  at_ours=\(.at_ours_feefree)  actual=\(.actual)  cappedout=\(.actual_capped_out)/\(.over_cap_n)  drag=\(.price_drag)  unmod=\(.unmodeled)  slip=\(.avg_slip // "?")  lat_med=\(.latency_median_s // "?")s  lat_p90=\(.latency_p90_s // "?")s  wins=\(.wins)"' /tmp/edge.json 2>/dev/null || true

          # ── HOW FAST ARE WE RIGHT NOW (owner challenge 2026-08-26).
          # The EDGE line above is month-to-date AND settled-only: its
          # since_day defaults to 2026-08-01 and it selects
          # status='settled', so a copy placed today cannot appear in it
          # until its market resolves. I quoted its lat_med as current
          # latency; the owner correctly said it describes the month.
          # These two lines read live_orders over real windows and EVERY
          # status, so the recent number and the month number sit side
          # by side and any disagreement is visible rather than argued.
          for H in 24 168; do
            curl -sS --max-time 45 -H "X-Admin-Token: $ADMIN_TOKEN" \
                 -o /tmp/lat.json "$BASE/api/admin/copy-latency?hours=$H" || true
            jq -r --arg h "$H" '.whales[]? | select(.n > 0)
              | "  LAT\($h) \(.whale)  n=\(.n) timed=\(.n_timed) fresh=\(.fresh_share)  p50=\(.p50)s p90=\(.p90)s p99=\(.p99)s worst=\(.worst)s  under5=\(.under_5s) under30=\(.under_30s)  filled=\(.filled) rej=\(.rejected) unf=\(.unfilled)"' \
              /tmp/lat.json 2>/dev/null || echo "  LAT$H unavailable"
          done

          # ── OPTION A GRADE (owner order 2026-08-26). The marginal
          # cohort -- fills ABOVE his price, which exist only because of
          # the tolerance -- is the ONLY one that judges the change. The
          # parity rows would have filled under same-or-better too and
          # outnumber them, so a blended average would report a losing
          # Option A as harmless. Printed separately, never summed.
          curl -sS --max-time 45 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/tol.json "$BASE/api/admin/copy-tolerance" || true
          jq -r '.rows[]? | "  TOLA \(.whale) \(.cohort)  n=\(.n) settled=\(.settled)  staked=$\(.staked) roi=\(.roi)  cents_over=\(.cents_over)  pnl=$\(.pnl)"' \
            /tmp/tol.json 2>/dev/null || echo "  TOLA unavailable"

          # ── premap coverage (owner order 2026-08-24: copy-time mapping
          # becomes a lookup; this line watches the table fill)
          curl -sS --max-time 30 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/premap.json "$BASE/api/admin/premap-status" || true
          jq -r '"  PREMAP rows=\(.rows // 0)  events=\(.events // 0)  fresh=\(.fresh // "never")  last=\(.last_sweep // "none")"' /tmp/premap.json 2>/dev/null || true
          # SWEEP COVERAGE, PER LANE. The page loop exits either because
          # the board was exhausted or because the budget ran out, and
          # the summary read the same either way. A truncated board is
          # markets that can never be premapped and therefore never
          # copied — a hard ceiling on how much of a PROVEN whale we can
          # trade. Print pages_walked/max_pages so the ceiling is
          # visible before it has to be inferred from the miss funnel.
          # `(A, B)[]` iterates INSIDE each array, so this yielded the
          # strings "full"/"fast" as separate outputs and destructuring
          # them died on "Cannot index string with number" — into
          # 2>/dev/null, so the line printed nothing at all for two
          # days while reading as "no sweep state". Wrap once, iterate
          # once.
          jq -r '[["full", .last_sweep], ["fast", .last_sweep_fast]] | .[]
                 | . as [$lane, $s]
                 | if $s == null then "  PREMAPSWEEP \($lane): no state"
                   else "  PREMAPSWEEP \($lane): events=\($s.events // 0) "
                      + "rows=\($s.rows // 0) "
                      + "pages=\($s.pages_walked // "?")/\($s.max_pages // "?") "
                      + "window=\($s.window_h | tostring) "
                      + (if $s.truncated then "*** TRUNCATED — part of the board was never read ***"
                         else "complete" end)
                   end' /tmp/premap.json 2>/dev/null || true
          jq -r '"  WORKERS boot=\(.workers_boot // "none")  side_echo=\(.side_echo // "none")  TRIPPED=\(.side_echo_tripped // false)"' /tmp/premap.json 2>/dev/null || true
          # SLEEVE-OFF (owner order 2026-08-24: "only copies flow") —
          # the underdog worker's heartbeat states whether the sleeve is
          # off; anything but off is a lead-with-this alarm.
          jq -r '.sleeve as $s | "  SLEEVE underdog=\($s.state // "?")  status=\($s.status // "?")  copyexit_open=\($s.copyexit_open // 0)  at=\($s.beat_at // "?")"' /tmp/premap.json 2>/dev/null || echo "  SLEEVE unavailable"
          jq -r '"  PREMAP-COV today=\(.coverage.today // 0)  tomorrow=\(.coverage.tomorrow // 0)  err=\(.coverage.err // "none")  sample=\(.coverage.sample // [] | join(" "))"' /tmp/premap.json 2>/dev/null || true
          # SHADOW CERTIFICATION (the resume gate): every quarantined
          # premap resolution re-derived from LIVE venue data by the
          # same precision matcher. ok climbing with mismatch=0 is what
          # licenses the lever; ANY mismatch means do not flip.
          jq -r '.side_echo_shadow as $s
                 | if $s == null then "  SHADOW-CERT no verdicts yet"
                   else "  SHADOW-CERT ok=\($s.ok // 0)  MISMATCH=\($s.mismatch // 0)  unverified=\($s.unverified // 0)  last=\($s.last // "?") \($s.last_detail // "")"
                   end' /tmp/premap.json 2>/dev/null || true
          # SPORTS-PROV: per sports-roster whale, are detections arriving
          # src=chain (sub-second) or src=poll (minutes)? The swisstony
          # capture question answers here. (whales.json is fetched fresh
          # here — the KCR-PROV fetch runs much later in the script.)
          curl -sS --max-time 60 -o /tmp/whales.json "$BASE/api/whales" || true
          for W in rn1 swisstony homerunhazard 0x076daa87 ferrarichampions2026; do
            WID=$(jq -r --arg w "$W" \
              '(if type=="array" then . else (.whales // []) end)
               | .[] | select((.username // "" | ascii_downcase) == $w) | .id' \
              /tmp/whales.json 2>/dev/null | head -1)
            [ -z "$WID" ] && { echo "  SPORTS-PROV $W: not in roster"; continue; }
            # fetch-to-file so a curl failure prints instead of feeding
            # jq empty stdin (which exits 0 and printed NOTHING)
            if ! curl -sS --max-time 60 -o /tmp/feed.json \
                 "$BASE/api/feed?whale_id=$WID&limit=10" 2>/dev/null; then
              echo "  SPORTS-PROV $W: feed fetch failed"; continue
            fi
            jq -r --arg w "$W" '. as $rows
              | if (type=="array" and length > 0) then
                  ($rows | map(select(.source=="chain")) | length) as $ch
                  | ($rows | map(select(.source=="poll")) | length) as $po
                  | "  SPORTS-PROV \($w): last \(length) rows — chain \($ch) / poll \($po)",
                    (.[0:3][] | "    \(.ts)  src=\(.source // "?")  lat=\(.latency_s // "?")s  \(.side) $\(.notional)")
                else "  SPORTS-PROV \($w): no feed rows" end' /tmp/feed.json \
              || echo "  SPORTS-PROV $W: feed parse failed"
          done
          # ── SHADOW-V2 (S0): per-event 0xd543adfd decode vs poll truth.
          # Flip gate math is done HERE, from deltas since window_start —
          # every N2/N10 volume figure subtracts its at_window watermark
          # (cumulative counters read green on stale volume otherwise).
          rm -f /tmp/shadow.json
          curl -sS --fail --max-time 30 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/shadow.json "$BASE/api/admin/shadow-v2" \
            || echo "  SHADOW-V2: endpoint fetch FAILED (auth/5xx — instrument may be dark, this is NOT benign)"
          jq -r '.state as $s
            | if (.detail? // null) != null then "  SHADOW-V2: endpoint error \(.detail | tostring | .[0:80])"
              elif $s == null and (.state_row_present // false) then "  SHADOW-V2: state row CORRUPT (self-heal pending)"
              elif $s == null then "  SHADOW-V2: no state row (deploy pending or SHADOW_V2=off)" else (
              ($s.counters // {}) as $c | ($s.at_window // {}) as $w
              | (($w.pw // {})) as $wp | (($w.emitter // {})) as $we
              | "  SHADOW-V2 pend=\($s.pending // "?")  policy=\($s.leading_policy // "?")  supp=\(($c.sim_exec_suppressed // 0) - ($w.sim_exec_suppressed // 0))  hup_only=\(($c.sim_exec_supp_hup_only // 0) - ($w.sim_exec_supp_hup_only // 0))  cmp=\(($c.compared_execs // 0) - ($w.compared_execs // 0))  residual=\($c["sim_exec_residual_dup"] // 0)/\($c["sim_agg_residual_dup"] // 0)/\($c["sim_ven_residual_dup"] // 0)  ven_supp=\(($c.sim_ven_suppressed // 0) - ($w.sim_ven_suppressed // 0))  agg_supp=\(($c.sim_agg_suppressed // 0) - ($w.sim_agg_suppressed // 0))",
                "  SHADOW-V2 div side=\($c["div.side"] // 0) asset=\($c["div.asset"] // 0) size=\($c["div.size"] // 0) price=\($c["div.price"] // 0) ts=\($c["div.ts"] // 0) keyimpl=\($c.key_impl_mismatch // 0)  tieout=\($c.agg_tieout_ok // 0)/\($c.agg_tieout_fail // 0)  mint=\(($c.mint_transformed // 0) - ($w.mint_transformed // 0))/\($c.mint_side_anomaly // 0)",
                "  SHADOW-V2 orphan none=\($c.orphan_no_row // 0) chainX=\($c.orphan_chain_mismatch // 0) chainOK=\($c.orphan_chain_exact // 0) excess=\($c.orphan_excess_exec // 0)  uncov unexp=\($c.poll_uncovered_unexplained // 0) quiet=\($c.poll_uncovered_quiet_gap // 0)/\(($c.poll_rows_seen // 0) - ($w.poll_rows_seen // 0))",
                "  SHADOW-V2 ts avail le3=\($c["ts_avail.le3s"] // 0) le6=\($c["ts_avail.le6s"] // 0) le15=\($c["ts_avail.le15s"] // 0) gt60=\($c["ts_avail.gt60s"] // 0) never=\($c.ts_never_resolved_live // 0) empty1st=\($c.ts_rpc_empty_first // 0)  cache hit/miss=\($c.live_cache_hit // 0)/\($c.live_cache_miss // 0)",
                "  SHADOW-V2 mult eq=\($c["poll_mult.eq"] // 0) one=\($c["poll_mult.one"] // 0) other=\($c["poll_mult.other"] // 0)  lag_p50=\($s.lag_p50_s // "?")s poll_p50=\($s.poll_lag_p50_s // "?")s  window_age_d=\(if $s.window_start then ((now - $s.window_start) / 86400 * 10 | floor / 10) else "?" end) health_age_d=\(if $s.health_start then ((now - $s.health_start) / 86400 * 10 | floor / 10) else "?" end) boots=\($c.boots // 0) commit=\($s.commit // "?")",
                (($c | to_entries[] | select(.key | startswith("emitter."))
                  | "  SHADOW-V2 emitter \(.key[8:] | .[0:12]) Δ\(.value - (($we[.key] // 0) | if type == "number" then . else 0 end))")),
                (($s.per_whale // {}) | to_entries[] | select(.value.username == "0x076daa87")
                 | .key as $wk
                 | "  SHADOW-V2 TARGET 0x076daa87 nΔ=\(.value.n - (($wp["pw." + $wk + ".n"] // 0) | if type == "number" then . else 0 end)) suppΔ=\(.value.supp - (($wp["pw." + $wk + ".supp"] // 0) | if type == "number" then . else 0 end)) divΔ=\(.value.div - (($wp["pw." + $wk + ".div"] // 0) | if type == "number" then . else 0 end)) lag_p50=\(.value.lag_p50_s // "?")s poll_p50=\(.value.poll_lag_p50_s // "?")s"),
                (if ($c.writer_conflict // 0) > 0 then "  SHADOW-V2 ALARM writer_conflict=\($c.writer_conflict)" else empty end),
                (if $s.updated_at_epoch and (now - $s.updated_at_epoch) > 600 then "  SHADOW-V2 ALARM state stale \((now - $s.updated_at_epoch) | floor)s" else empty end)
              ) end' \
            /tmp/shadow.json 2>/dev/null || echo "  SHADOW-V2: probe fetch/parse failed"
          # ROSTER-GUARD (2026-08-24: rn1 + swisstony silently dropped
          # off the active roster — no detection, no paper cohort, no
          # TRUEEDGE updates). Every configured source whale must be
          # DETECTED even when cut or held: detection is data, the
          # cut/hold/quarantine gates are what stop dollars. Idempotent;
          # prints every action it takes.
          for W in rn1 swisstony homerunhazard 0x076daa87 ferrarichampions2026 kch123; do
            HIT=$(jq -r --arg w "$W" \
              '(if type=="array" then . else (.whales // []) end)
               | [.[] | select((.username // "" | ascii_downcase) == $w)] | length' \
              /tmp/whales.json 2>/dev/null || echo 0)
            if [ "$HIT" = "0" ]; then
              # PIN, not activate: roster.refresh deactivates any whale
              # that is active AND NOT pinned AND absent from the venue
              # leaderboard, so a bare activate is undone on the next
              # roster cycle (observed twice, probes #1031/#1032).
              # Pinned whales survive the refresh.
              echo "  ROSTER-GUARD $W: not active — pinning"
              curl -sS --max-time 30 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"username\": \"$W\"}" \
                "$BASE/api/admin/roster/pin" | head -c 300 || true
              echo ""
            fi
          done

          # ── side-fidelity audit (owner order 2026-08-24: prove which
          # mapping path inverted sides — pick vs the slug we ordered,
          # with venue-true pnl; settled first, then quarantine stream)
          curl -sS --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/mapa.json "$BASE/api/admin/mapping-audit?days=3" || true
          jq -r '.rows[]? | select(.status == "settled") | "  MAPA \(.pnl)  \(.whale)  pick=\(.pick)  slug=\(.us_slug)"' /tmp/mapa.json 2>/dev/null | head -60 || true
          jq -r '.rows[]? | select(.status == "rejected") | "  MAPA-Q \(.whale)  pick=\(.pick)  \(.error)"' /tmp/mapa.json 2>/dev/null | head -25 || true
          # REFUSED-BY-CLASS (corrected 2026-08-25). This counts the
          # mapping class of REJECTED rows only — src= appears in the
          # refusal reason, and an ADMITTED premap resolution writes no
          # error at all, so it is invisible here BY CONSTRUCTION.
          # It was previously labelled "FIDELITY ... premap=" and
          # documented as the climbing number the resume waits on. It
          # can never climb: premap=0 means "no premap row was
          # REFUSED", which is what success looks like. That reading
          # cost real time on 2026-08-24 — it was taken as "the premap
          # lane resolves nothing" while two whales were filling
          # through it. `passed` is the denominator that makes the
          # counts legible.
          jq -r '([.rows[]? | select((.error // "") | test("src=premap"))] | length) as $p
                 | ([.rows[]? | select((.error // "") | test("src=exact"))] | length) as $e
                 | ([.rows[]? | select((.error // "") | test("src=fuzzy"))] | length) as $f
                 | ([.rows[]? | select((.status // "") != "rejected")] | length) as $ok
                 | "  REFUSED-BY-CLASS premap=\($p)  exact=\($e)  fuzzy=\($f)  passed=\($ok)  (of \((.rows // []) | length) audited; premap=0 means none REFUSED, not none resolved)"' \
            /tmp/mapa.json 2>/dev/null || echo "  REFUSED-BY-CLASS unavailable"

          # MEMCENSUS — rank what is actually holding the RSS.
          #
          # Three memory fixes shipped tonight on reasoning; the type
          # filter moved 5.5% of rows and the streaming packer did not
          # stop RSS going 595 -> 1,684.6 MB across one grind. This
          # prints bytes-per-row and the estimate per retained
          # structure, plus the UNACCOUNTED gap. A large gap means the
          # caches are not the story and the next look is allocator
          # arenas, not a fourth cache.
          curl -sS --max-time 45 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/memc.json "$BASE/api/admin/memory-census" || true
          jq -r 'if .rss_mb == null then "  MEMCENSUS unavailable"
                 else "  MEMCENSUS rss=\(.rss_mb)MB accounted=\(.accounted_mb)MB unaccounted=\(.unaccounted_mb)MB | archive \(.archive_cache.rows)r @\(.archive_cache.bytes_per_row)B marginal (naive \(.archive_cache.bytes_per_row_naive)B) = \(.archive_cache.est_mb)MB | grind \(.hydrate_in_progress.rows)r = \(.hydrate_in_progress.est_mb)MB | window \(.raw_window_cache.rows)r = \(.raw_window_cache.est_mb)MB | \(.arena_cap // "arena_cap ?")"
                 end' /tmp/memc.json 2>/dev/null || echo "  MEMCENSUS unreadable"
          # MALLOC — the split that says whether anything HOLDS the gap.
          # in_use ~ RSS means real retention the census cannot see;
          # free_retained ~ the gap means fragmentation, and no cache
          # fix or trim will ever return it.
          jq -r '.malloc_info as $m
                 | if ($m.unavailable // null) != null
                   then "  MALLOC unavailable (\($m.unavailable))"
                   else "  MALLOC in_use=\($m.in_use_mb)MB free_retained=\($m.free_retained_mb)MB arena=\($m.arena_mb)MB mmapped=\($m.hblkhd_mb)MB releasable=\($m.releasable_mb)MB chunks=\($m.free_chunks)"
                   end' /tmp/memc.json 2>/dev/null || true

          # SHORTSHADOW — the evidence the short ban owes us.
          #
          # The ban is 6-for-6 justified on FILLS, but it now refuses
          # most of the live flow (one fill in the five hours after it
          # shipped). Every refusal now records the intent-aware ask
          # for the leg we would have bought, beside the whale's price.
          #
          # Read it as: ratio near 1.0 and a small gap means the leg we
          # name IS his outcome and the ask guard (1.08) plus the side
          # band (0.15) already cover this class — the ban is redundant
          # and can be lifted with LIVE_ALLOW_SHORT=on. Ratios near the
          # complement mean the ban is load-bearing and stays.
          #
          # No count here decides anything on its own. This prints the
          # rows so the decision is made on numbers, by the owner.
          jq -r '.rows[]? | select((.error // "") | test("SHADOW"))
                 | "  SHORTSHADOW \(.whale) pick=\(.pick) \((.error | capture("SHADOW (?<s>.*)$").s))"' \
            /tmp/mapa.json 2>/dev/null | head -25 || true
          # The split, counting UNREADABLE as its own class. First
          # shadowed row (05:21:55, HomeRunHazard, an O/U "Under") came
          # back `ask=unreadable` — and the ask guard refuses a None ask
          # outright, so that flow would NOT return just by lifting the
          # ban. A summary that folded unreadable into "no rows yet"
          # would have hidden the single most useful thing the shadow
          # has said so far.
          jq -r '[.rows[]? | select((.error // "") | test("SHADOW"))] as $all
                 | [$all[] | select((.error) | test("SHADOW ratio="))
                    | (.error | capture("ratio=(?<r>[0-9.]+)") | .r | tonumber)] as $rs
                 | [$all[] | select((.error) | test("ask=unreadable"))] as $u
                 | [$all[] | select((.error) | test("SHADOW err="))] as $e
                 | if ($all | length) == 0
                   then "  SHORTSHADOW n=0 — no shorts refused since the shadow shipped"
                   else "  SHORTSHADOW n=\($all | length) quoted=\($rs | length) unreadable=\($u | length) errored=\($e | length) near1=\([$rs[] | select(. > 0.85 and . < 1.18)] | length) complement=\([$rs[] | select(. > 1.5 or . < 0.6)] | length)"
                   end' /tmp/mapa.json 2>/dev/null || true

          # ── venue-truth restatement status (owner emergency 2026-08-23:
          # settlement was graded by the whale's token; rescore rewrites
          # every settled copy row from the venue's own ledger)
          curl -sS --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/rescore.json "$BASE/api/admin/rescore-copies" || true
          jq -r '"  RESCORE ran=\(.ran // false)  at=\(.at // "?")  rows=\(.settled // 0)  changed=\(.changed // 0)  delta=\(.delta // 0)  slugs=\(.slugs // 0)  no_truth=\(.no_truth // 0)"' /tmp/rescore.json 2>/dev/null || true
          jq -r '.whales // {} | to_entries[]? | "  RESCORE-W \(.key)  old=\(.value.old)  new=\(.value.new)  rows=\(.value.rows)"' /tmp/rescore.json 2>/dev/null || true
          # FORCE PATH (2026-08-24: the startup restatement kept losing
          # to deploy restarts and then failed silently on an
          # undisturbed boot). When the summary says it never ran, run
          # it HERE, chunked newest-window-first so each venue crawl is
          # bounded, and print each verdict verbatim — errors included.
          # Idempotent server-side; this block self-disables once the
          # summary records a completed run.
          # Fire the force path when the restatement never ran OR when
          # its coverage is poor (no_truth > 100 markets unreachable —
          # the archive merge should leave a small remainder; 2026-08-24
          # the self-disable on ran=true alone masked a coverage failure).
          if ! jq -e '(.ran == true) and ((.no_truth // 999999) <= 100)' /tmp/rescore.json >/dev/null 2>&1; then
            for SD in 2026-08-17 2026-08-10 2026-08-01; do
              echo "  RESCORE-POST since=$SD:"
              curl -sS --max-time 280 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
                   "$BASE/api/admin/rescore-copies?since_day=$SD" \
                   | head -c 2000 || true
              echo ""
            done
            curl -sS --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" \
                 -o /tmp/rescore.json "$BASE/api/admin/rescore-copies" || true
            jq -r '"  RESCORE2 ran=\(.ran // false)  rows=\(.settled // 0)  changed=\(.changed // 0)  delta=\(.delta // 0)  no_truth=\(.no_truth // 0)  archive=\(.archive // "absent")"' /tmp/rescore.json 2>/dev/null || true
            jq -r '.whales // {} | to_entries[]? | "  RESCORE-W \(.key)  old=\(.value.old)  new=\(.value.new)  rows=\(.value.rows)"' /tmp/rescore.json 2>/dev/null || true
          fi

          TODAY_ET=$(TZ=America/New_York date +%F)
          curl -sS --max-time 90 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/bdd.json \
               "$BASE/api/admin/breakdown-day-detail?day=$TODAY_ET" || true
          jq -r '"  BDD \(.day)  anchor=\(.anchor.pnl)/\(.anchor.rows)rows  copies=\(.copies.pnl)/\(.copies.rows)rows  arb=\(.arb_pnl)  ext=\(.external_pnl)  RESIDUAL=\(.residual)  (copyDeltas=\(.residual_from_copy_deltas)  noncopy=\(.residual_from_noncopy_rows))"' /tmp/bdd.json 2>/dev/null || true
          # RECONCILIATION TRIPWIRE (owner order 2026-08-24: this class
          # of bug gets ONE DAY of life, never fifteen). A residual
          # beyond $50 means the record and the venue disagree about
          # today — the status must LEAD with this line until it clears.
          jq -r 'if (((.residual // 0) < -50) or ((.residual // 0) > 50)) then "  RECON-ALARM residual=\(.residual) — record vs venue diverging beyond $50 today; do not trust the day number, investigate NOW" else empty end' /tmp/bdd.json 2>/dev/null || true
          # quarantine switch state (resume is POST /api/admin/quarantine/off)
          curl -sS --max-time 30 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/quar.json "$BASE/api/admin/quarantine" || true
          jq -r '"  QUARANTINE \(.quarantine)  env_override=\(.env_override // "none")  premap_live=\(.premap_live // false)"' /tmp/quar.json 2>/dev/null || true
          jq -r '.copy_deltas[]? | "  BDD-D \(.delta)  anchor=\(.anchor) copies=\(.copies)  \(.title[0:80])"' /tmp/bdd.json 2>/dev/null | head -60 || true
          jq -r '.noncopy_anchor_rows[]? | "  BDD-N \(.pnl)  sleeve=\(.sleeve)  \(.title[0:80])"' /tmp/bdd.json 2>/dev/null | head -30 || true
          jq -r '.capped_copy_rows[]? | "  BDD-CAP \(.pnl)  \(.whale)  \(.title[0:80])"' /tmp/bdd.json 2>/dev/null | head -20 || true
          jq -r '.foreign_whale_rows[]? | "  BDD-F \(.pnl)  \(.whale)  \(.title[0:80])"' /tmp/bdd.json 2>/dev/null | head -20 || true
          jq -r '.external_rows[]? | "  BDD-E \(.pnl)  \(.title[0:80])"' /tmp/bdd.json 2>/dev/null | head -20 || true
          probe /healthz 30

          # ── the decisive number ────────────────────────────────────
          # Whether volume is low because the engine is broken or because
          # the venue simply is not offering edge is answered by ONE thing:
          # the distribution of (fair - ask) across everything we priced.
          # Printed last and compactly, because log tails are what survive.
          curl -sS --max-time 120 -o /tmp/fills.json \
               "$BASE/api/engine/fills?limit=500" || true
          curl -sS --max-time 120 -o /tmp/status.json \
               "$BASE/api/engine/status" || true
          # FSC clean cohort: entries AFTER the main-tour + mandatory
          # verification deploy only — the number the sleeve's thesis is
          # judged on (owner promise 2026-08-19).
          jq -r '.detail.fsc_clean // empty | "FSC-CLEAN: settled \(.settled) (\(.wins)W-\(.losses)L)  realized $\(.realized)  staked $\(.staked)  roi \(.roi // "n/a")"' \
             /tmp/status.json 2>/dev/null || true

          echo ""
          echo "###########################################################"
          echo "#   WHALE COPY FEASIBILITY (copy_probes, 30d)              #"
          echo "###########################################################"
          # Does the source whale's edge survive our copy latency? Residual
          # ROI is measured against the REAL book at our REAL reaction time
          # for every fresh whale BUY — the empirical answer to whether
          # copy-trading deserves its own strategy sleeve.
          # whale= (empty) drops the username filter: the panel must count
          # every source whale, or a renamed handle reads as "no probes".
          curl -sS --max-time 60 -o /tmp/copy.json \
               "$BASE/api/copy-report?hours=720&whale=" || true
          jq -r '.summary // . | to_entries[] | "  \(.key): \(.value)"' \
             /tmp/copy.json 2>/dev/null | head -30 || echo "  (unavailable)"
          echo "  -- per-whale vetting census (same yardstick as incumbents) --"
          jq -r '.by_whale[]? | "  VET \(.whale)  probes=\(.probes)  roi1k=\(.avg_roi_1k // "?")  pos=\(.positive_1k)/\(.fillable_1k)  react_p50=\(.reaction_p50 // "?")s  avg_bet=$\(.avg_his_notional // "?")"' \
             /tmp/copy.json 2>/dev/null || true

          echo ""
          echo "#   PAPER AI TRADER (whale copy, paper account, 30d)        #"
          curl -sS --max-time 60 -o /tmp/ai.json \
               "$BASE/api/ai-trader?days=30" || true
          jq -r '.summary // {} | to_entries[] | "  \(.key): \(.value)"' \
             /tmp/ai.json 2>/dev/null | head -20 || echo "  (unavailable)"

          echo ""
          echo "#   LIVE COPY SLEEVE (live_orders — REAL dimes, all whales) #"
          # orders==0 with fresh sub-10c source fills means the WORKERS env
          # is missing LIVE_TRADING_ENABLED/PMUS creds (executor's venue
          # resolves to None and it no-ops silently) — say so, don't guess.
          curl -sS --max-time 60 -o /tmp/live.json "$BASE/api/live-status" || true
          jq -r '.fill_vs_miss_7d // {} | to_entries[] |
                 "  FVM \(.key): filled \(.value.f_n) roi \(.value.f_roi // "n/a") | missed \(.value.m_n) roi \(.value.m_roi // "n/a") (\(.value.m_unres) unresolved)"' \
            /tmp/live.json 2>/dev/null || true
          echo "MANUAL DESK (owner report 2026-08-21):"
          jq -r '.manual_desk.by_status // {} | to_entries[] | "  MDESK-N \(.key): \(.value)"' \
             /tmp/live.json 2>/dev/null || true
          jq -r '.manual_desk.recent // [] | .[] | "  MDESK \(.placed_at // "?") \(.status) req $\(.req // 0) filled $\(.filled // 0) [\(.venue // "?")] \(.error // "")"' \
             /tmp/live.json 2>/dev/null || true

          # Admin-token sanity FIRST: DESKG/JNOTE/MX lines silently
          # defaulted to zeros on a 401, so "games 0" was ambiguous
          # between an empty board and a missing repo secret. The ping
          # oracle answers definitively.
          AUTH=$(curl -sS --max-time 20 -X POST \
                 -H "X-Admin-Token: $ADMIN_TOKEN" \
                 "$BASE/api/admin/ping" 2>/dev/null || echo '{}')
          echo "ADMINAUTH: $(echo "$AUTH" | jq -r '"configured \(.configured // "?") match \(.match // "?")"' 2>/dev/null)"

          # Desk board health (owner report 2026-08-21 "no markets
          # carrying"): non-zero counts prove the venue-native listing
          # variant probe is returning events end-to-end.
          echo "DESK BOARD:"
          DGCODE=$(curl -sS --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/deskg.json -w '%{http_code}' \
               "$BASE/api/admin/desk-games?venue=polymarket" || echo 000)
          echo "  DESKG-HTTP $DGCODE"
          jq -r '"  DESKG pm games \(.games // [] | length) counts \(.counts // {} | to_entries | map("\(.key):\(.value)") | join(" "))"' \
             /tmp/deskg.json 2>/dev/null || true

          # MERIDIAN journal publish: the top entry of the repo journal
          # goes to the platform (idempotent by content hash). The page
          # displays it — the session's own words, versioned in git.
          BASE_URL="$BASE" python3 ops/publish_journal.py || true

          # MERIDIAN conversation mirror: unseen voice turns land in the
          # engine session's context here (owner order 2026-08-21: one
          # continuous record across voice and console).
          echo "MERIDIAN EXCHANGE (unseen voice turns):"
          curl -sS --max-time 30 -H "X-Admin-Token: $ADMIN_TOKEN" \
               "$BASE/api/admin/meridian-exchange?unseen=1&mark=1&limit=60" \
               -o /tmp/mx.json || true
          jq -r '(.turns // []) | .[] | "  MX [\(.at)] \(.role): \(.text)"' \
             /tmp/mx.json 2>/dev/null || true

          # JARVIS notes bridge: unread voice-cockpit notes for the
          # engine session, printed then marked delivered.
          echo "JARVIS NOTES:"
          curl -sS --max-time 30 -H "X-Admin-Token: $ADMIN_TOKEN" \
               "$BASE/api/admin/jarvis-notes?mark=1" -o /tmp/jnotes.json || true
          jq -r '(.notes // []) | .[] | "  JNOTE #\(.id) [\(.created_at)] \(.note)"' \
             /tmp/jnotes.json 2>/dev/null || true
          jq -r '"  JNOTE-REMAINING \(.unread_remaining // 0)"' \
             /tmp/jnotes.json 2>/dev/null || true

          # WHY the engine is not armed, from its own heartbeat — the
          # 2026-08-21 evening incident: PAPER for hours, reason only
          # in Render logs nobody was reading.
          jq -r '.detail.not_armed // empty |
                 "  NOTARMED want \(.want) blocked_by: \((.blocked_by // []) | join(" | "))"' \
             /tmp/status.json 2>/dev/null || true

          echo "KALSHI CRYPTO LEG (owner order 2026-08-21):"
          # WHALE-EXIT DETECTOR: is the new worker actually cycling?
          # first_snapshots on the first pass by design; exits after.
          #
          # v1 of this line read /tmp/status.json for an object keyed by
          # service name. Heartbeats are not there and are not shaped
          # like that: /api/health/services returns a LIST of rows with
          # a .service field. So it matched nothing and printed nothing
          # — and a silent line reads exactly like a dead worker.
          #
          # That is the same failure this whole night kept producing: an
          # instrument that cannot see its subject, reporting anyway.
          # The absence of WHALEEXIT was my own broken probe, not proof
          # the detector was inert, and I nearly filed it as the latter.
          # It fetches its own copy so it does not depend on a later
          # step having run.
          curl -sS --max-time 30 -o /tmp/hb_we.json \
               "$BASE/api/health/services" || true
          jq -r '[.[]? | select(.service | test("whale_exit"))] as $w
                 | if ($w | length) == 0
                   then "  WHALEEXIT no heartbeat row — worker never completed a cycle"
                   else ($w[] | "  WHALEEXIT \(.status) beat=\(.beat_at) \(.detail | tostring | .[0:1600])")
                   end' /tmp/hb_we.json 2>/dev/null \
            || echo "  WHALEEXIT unreadable"
          jq -r '.detail.kalshi_crypto // {} |
                 "  KCRYPTO seen \(.seen // 0) placed \(.placed // 0) filled \(.filled // 0) contracts \(.contracts // 0) deployed $\(.deployed_usd // 0) fees $\(.fees_usd // 0) halted \(.halted // false) err \(.last_error // "none")"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.kalshi_crypto.refused // {} | to_entries[] | "  KCR-REF \(.key): \(.value)"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.kalshi_crypto_whales // [] | .[] | "  KCRW \(.whale): settled \(.settled) \(.wins)W-\(.losses)L staked $\(.staked) pnl $\(.realized) roi \(.roi // "n/a")"' \
             /tmp/status.json 2>/dev/null || true

          jq -r '.sizing_24h // [] | .[] |
                 "  SIZING \(.whale): n24 \(.n_24h) unf \(.unfilled_24h // 0) rej \(.rejected_24h // 0) avg_req $\(.avg_req // "?") avg_filled $\(.avg_filled // "?") max_req $\(.max_req // "?") deployed24 $\(.deployed_24h // 0)"' \
            /tmp/live.json 2>/dev/null || true
          # COPYQUEUE — our OWN latency, which was never measured.
          # A copy rejected as "stale-signal" may have been fresh on
          # arrival and aged entirely waiting for one of four semaphore
          # slots, each held through three sequential venue round trips.
          # max_wait_s is the number that says whether the cap is the
          # bottleneck; it is deliberately measured before it is raised,
          # because widening throughput also lets more orders clear the
          # day-room check before any of them lands.
          #
          # IT PRINTED "unavailable" ON FIVE CONSECUTIVE PROBES and the
          # worker was publishing the block correctly the whole time.
          # /api/health/services used to str()-flatten every nested
          # value, so .detail.copy_queue arrived as a Python repr and
          # indexing it threw. The endpoint keeps nested scalars now;
          # this line distinguishes the three outcomes so a future
          # regression cannot read as a dead worker again — the same
          # mistake this probe made about the exit detector.
          jq -r '[.[]? | select(.service == "copy_sweep")] as $c
                 | if ($c | length) == 0
                   then "  COPYQUEUE no copy_sweep heartbeat — sweep never completed a cycle"
                   elif (($c[0].detail.copy_queue? // null) | type) != "object"
                   then "  COPYQUEUE detail.copy_queue is \(($c[0].detail.copy_queue? // null) | type), not an object — the ENDPOINT is mangling it"
                   else ($c[0].detail.copy_queue
                         | "  COPYQUEUE n=\(.n // 0) concurrency=\(.concurrency // "?") avg=\(.avg_wait_s // 0)s max=\(.max_wait_s // 0)s")
                   end' \
            /tmp/hb_we.json 2>/dev/null || echo "  COPYQUEUE unreadable"

          # EXITCENSUS — why the exit path did or did not act.
          #
          # "mirror_exit has never placed an order" is not a finding,
          # it is the absence of one: nineteen of its twenty refusal
          # paths were silent, so every possible reason reached
          # production as the same event. mx_no_position_of_ours
          # dominating means the exit path WORKS and the fill rate is
          # the constraint — there is nothing to sell. A refusal after
          # mx_reached_position_lookup is the only kind that is a
          # defect.
          jq -r '[.[]? | select(.service == "copy_sweep")] as $c
                 | if ($c | length) == 0
                   then "  EXITCENSUS no copy_sweep heartbeat"
                   elif (($c[0].detail.exit_census? // null) | type) != "object"
                   then "  EXITCENSUS detail.exit_census is \(($c[0].detail.exit_census? // null) | type), not an object"
                   elif (($c[0].detail.exit_census | length) == 0)
                   then "  EXITCENSUS empty — the exit path has not run once since this worker booted"
                   else ($c[0].detail.exit_census | to_entries
                         | sort_by(-.value)[]
                         | "  EXITCENSUS \(.key): \(.value)")
                   end' \
            /tmp/hb_we.json 2>/dev/null || echo "  EXITCENSUS unreadable"
          jq -r '.[]? | select(.service == "copy_sweep")
                 | (.detail.exit_recent // [])[] | "  EXITRECENT \(.)"' \
            /tmp/hb_we.json 2>/dev/null || true

          # PROOF — is the strategy proven profitable yet?
          #
          # Built to be able to say NO. The all-time ledger is negative
          # and that is reported here beside the cohort, never instead
          # of it: showing only the clean cohort would be the same move
          # as choosing the cutoff quietly.
          #
          # The cohort starts at the deploy of the exit classifier —
          # the last change that altered WHAT WE BUY rather than what we
          # report. Copies before it were placed by a system that copied
          # a whale's exit as a DOUBLED ENTRY.
          #
          # INSUFFICIENT is the expected answer for a while. n_still_
          # needed is the number that turns "are we there yet" into a
          # date, and it is sized against the whales' own merge-
          # inclusive ROI, not our noisy point estimate.
          PROOFCODE=$(curl -sS --max-time 90 -w '%{http_code}' \
               -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/proof.json "$BASE/api/admin/proof" \
               2>/dev/null || echo "000")
          # NAME THE CAUSE. "PROOF unavailable" told me nothing for a
          # whole probe cycle: the endpoint was returning 502 because
          # it computed the whale benchmark inline and inherited the
          # heaviest query in the system. A status code and the first
          # 300 bytes of the body would have said so immediately, which
          # is the same fix /api/admin/short-truth needed for the same
          # reason.
          echo "  PROOFHTTP code=$PROOFCODE bytes=$(wc -c < /tmp/proof.json 2>/dev/null || echo 0)"
          if ! jq -e . /tmp/proof.json >/dev/null 2>&1; then
            echo "  PROOFBODY $(head -c 300 /tmp/proof.json 2>/dev/null | tr '\n' ' ')"
          fi
          jq -r '.overall // {} |
                 "  PROOF cohort n=\(.n // 0) staked=$\(.staked // 0) pnl=$\(.pnl // 0) roi=\(.roi // "n/a") ci95=\(.ci95 | tostring)"' \
            /tmp/proof.json 2>/dev/null || echo "  PROOF unavailable"
          jq -r '"  PROOF verdict: \(.overall.verdict // "n/a")"' \
            /tmp/proof.json 2>/dev/null || true
          jq -r '.overall // {} | select(.n_needed_at_target)
                 | "  PROOF need \(.n_needed_at_target) settled copies at target edge \(.target_edge) — \(.n_still_needed) still to go"' \
            /tmp/proof.json 2>/dev/null || true
          jq -r '.benchmark // {} | select(.whale_roi_on_entries)
                 | "  PROOF benchmark: whales return \(.whale_roi_on_entries) on $\(.whale_entry_notional) of entries (\(.basis))"' \
            /tmp/proof.json 2>/dev/null || true
          jq -r '.all_time_including_contaminated // {} |
                 "  PROOF all-time (CONTAMINATED, kept on the page): n=\(.n // 0) roi=\(.roi // "n/a") ci95=\(.ci95 | tostring)"' \
            /tmp/proof.json 2>/dev/null || true
          jq -r '"  PROOF cohort_start=\(.cohort_start // "n/a")"' \
            /tmp/proof.json 2>/dev/null || true
          # PROOF-2 — the decomposed thesis meter (owner order
          # 2026-08-28): sleeve edge = mix-weighted whale edge (their
          # books) - outcome-free capture drag (our fills vs theirs,
          # deterministic per fill) - fees, with the combined CI and
          # P(annual >= 100% of principal) at measured flow and the
          # flow-multiple the thesis requires. The drag CI tightens in
          # hundreds of fills, not 15k — this meter moves first.
          P2CODE=$(curl -sS --max-time 60 -w '%{http_code}' \
               -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/proof2.json "$BASE/api/admin/proof2" \
               2>/dev/null || echo "000")
          echo "  PROOF2HTTP code=$P2CODE bytes=$(wc -c < /tmp/proof2.json 2>/dev/null || echo 0)"
          jq -r '.capture // {} |
                 "  PROOF2 capture n=\(.n // 0) entries=$\(.entry_notional // 0) drag=\(.drag_rate // "n/a") (se \(.drag_se // "n/a")) fees=\(.fee_rate // "n/a")"' \
            /tmp/proof2.json 2>/dev/null || echo "  PROOF2 unavailable"
          jq -r '.edge // {} | select(.available)
                 | "  PROOF2 edge: whales \(.whale_mix_edge) - drag \(.drag_rate) - fees \(.fee_rate) = sleeve \(.sleeve_edge) (se \(.sleeve_se))  P(edge>0)=\(.p_edge_positive)"' \
            /tmp/proof2.json 2>/dev/null || true
          jq -r '.thesis // {} | select(.available)
                 | "  PROOF2 flow=$\(.measured_flow_per_day)/day",
                   (.grid[]? | select(.principal == 2000000)
                    | "  PROOF2 $2M thesis: P(>=100%/yr) at 1x flow \(.p_100pct_at_1x_flow) / 10x \(.p_100pct_at_10x_flow) / 50x \(.p_100pct_at_50x_flow) — needs \(.flow_x_for_p50 // "n/a")x flow at p50")' \
            /tmp/proof2.json 2>/dev/null || true
          jq -r '.edge.unpublished_whales // [] | select(length > 0)
                 | "  PROOF2 note: no published whale CI yet for \(join(", ")) (diluted to zero edge)"' \
            /tmp/proof2.json 2>/dev/null || true
          # the rows carrying the drag: real execution cost vs a
          # pairing artifact reads directly off these lines
          jq -r '.capture.worst_rows // [] | .[]
                 | "  PROOF2WORST \(.whale) \(.side) \(.intent // "?") \(.venue) his=\(.his) ours=\(.ours) sh=\(.shares) drag=$\(.drag_usd) \(.slug)"' \
            /tmp/proof2.json 2>/dev/null || true
          # PRICEFID — "same or better price", measured at last.
          #
          # The status page's slippage median is (fill_price -
          # his_price), which is LONG-ONLY math: on a short, fill_price
          # names the long leg, so that difference read ~66 cents of
          # slippage on six fills that actually BEAT his price by 12.
          # This scores every fill on what it really cost —
          # fill_price for a long, 1-fill_price for a short — and
          # reports the DISTRIBUTION, because the median hides the tail
          # and the tail is where the money is.
          jq -r '.price_fidelity.overall // {} |
                 "  PRICEFID \(.at_or_better // 0)/\(.n // 0) at his price or better (\(.at_or_better_share // "n/a")) | median \(.median_edge_cents // "n/a")c p10 \(.p10_edge_cents // "n/a")c worst \(.worst_edge_cents // "n/a")c | $\(.dollar_edge_vs_his_price // 0) vs his price on $\(.deployed // 0) deployed (\(.edge_per_100_deployed // "n/a") per $100)"' \
            /tmp/proof.json 2>/dev/null || echo "  PRICEFID unavailable"
          jq -r '.price_fidelity.by_whale // {} | to_entries[]
                 | "  PRICEFID-W \(.key): \(.value.at_or_better // 0)/\(.value.n // 0) better, median \(.value.median_edge_cents // "n/a")c, $\(.value.dollar_edge_vs_his_price // 0)"' \
            /tmp/proof.json 2>/dev/null || true
          jq -r '.price_fidelity.overall // {} | select(.unmeasurable > 0)
                 | "  PRICEFID-GAP \(.unmeasurable) fills could not be scored (missing his price or ours) — NOT counted as neutral"' \
            /tmp/proof.json 2>/dev/null || true

          # UNMAPPED — WHY the biggest bucket fails, attributed.
          #
          # listed_mapper_fail is 26,569 rows = 1,155 blocked whale
          # entries a day, and at the repo's own 13.6% entry-to-fill
          # conversion a quarter-fix is +39 fills/day against a 19.2/day
          # baseline. It is the only bucket big enough to move 0.55%.
          #
          # Nothing could attribute it before: api_mapgap filters
          # us_market_slug IS NOT NULL, and that column is written only
          # AFTER a mapping succeeds — it measured the rows that WORKED
          # while reporting on the ones that failed. This runs the true
          # unmapped population back through the resolver and names
          # which of its six decision points returned None, because the
          # six need completely different fixes.
          curl -sS --max-time 90 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/unmapped.json \
               "$BASE/api/admin/unmapped-census?hours=48&sample=400" \
               || true
          echo "  UNMAPHTTP bytes=$(wc -c < /tmp/unmapped.json 2>/dev/null || echo 0)"
          jq -r '.league_alias // {} |
                 "  UNMAPALIAS \(.misses_a_league_strip_would_have_found // 0) of the sample would be found by dropping the league token (share \(.share_of_sample // "n/a"), of no_key_intersection \(.share_of_no_key_intersection // "n/a")) — COUNTED, NOT APPLIED"' \
            /tmp/unmapped.json 2>/dev/null || true
          jq -r '(.league_alias.examples // [])[] | "  UNMAPALIAS-EG his=\(.his_slug) stripped=\(.stripped_key) -> \(.venue_rows_found) venue rows \(.venue_sample | tostring)"' \
            /tmp/unmapped.json 2>/dev/null || true
          jq -r '"  UNMAPPED sampled=\(.sampled // 0) | \(.verdict // "n/a")"' \
            /tmp/unmapped.json 2>/dev/null || echo "  UNMAPPED unreadable"
          jq -r '.steps // {} | to_entries[] | "  UNMAPSTEP \(.key): \(.value)"' \
            /tmp/unmapped.json 2>/dev/null || true
          jq -r '.examples // {} | to_entries[] | "  UNMAPEG \(.key): his=\(.value.his_slug) outcome=\(.value.his_outcome) keys=\(.value.keys) premap_rows=\(.value.premap_rows) | \(.value.detail)"' \
            /tmp/unmapped.json 2>/dev/null | head -8 || true
          # NAMED-LANE ATTESTATION FEED (2026-08-30): the atp/wta
          # whitelist is gated on venue question shapes attested from
          # accumulated audit records — which existed server-side and
          # were never echoed into any log. These lines are that
          # evidence stream; the audits are truncated per-line so the
          # probe's oversize filter keeps them.
          jq -r '.named_ml // {} | "  NAMEDML would_resolve=\(.would_resolve // 0) attested_family=\(.attested_family // 0) sub_gates=\(.sub_gates // {} | tostring | .[0:200])"' \
            /tmp/unmapped.json 2>/dev/null || true
          jq -r '.named_ml.reasons // {} | to_entries[] | "  NAMEDML-RSN \(.key): \(.value)"' \
            /tmp/unmapped.json 2>/dev/null | head -12 || true
          jq -r '.named_ml.lg_pairs // {} | to_entries[] | "  NAMEDML-LG \(.key): \(.value)"' \
            /tmp/unmapped.json 2>/dev/null | head -16 || true
          jq -r '(.named_ml.audits // [])[] | "  NAMEDML-AUD \(tostring | .[0:400])"' \
            /tmp/unmapped.json 2>/dev/null | head -40 || true
          jq -r '.bridge.venue_wordings // {} | to_entries[] | .key as $k | .value[] | "  NAMEDML-Q [\($k)] \(tostring | .[0:300])"' \
            /tmp/unmapped.json 2>/dev/null | head -30 || true

          # MERGEPNL — the whale numbers with their exits included.
          #
          # Every prior whale grade was settlement-only, which cannot
          # see a merge. Three instruments agreed there were no exits
          # because all three read the same trade-feed definition of a
          # sale, and three whales were cut on it.
          #
          # THIS READ IS WINDOWED — since=2026-08-01, one month — and
          # the line below says so on every row. The 95% gate reads the
          # worker's WHOLE-BOOK publish instead (EDGEGATE, further
          # down). On 2026-08-30 I set these two side by side, took the
          # window for the book, and called a month-vs-career
          # difference a corrupt payload. They answer different
          # questions and the labels now say which.
          MERGEWINDOW=2026-08-01
          MERGECODE=$(curl -sS --max-time 120 -w '%{http_code}' \
               -H "X-Admin-Token: $ADMIN_TOKEN" -o /tmp/mergepnl.json \
               "$BASE/api/admin/whale-merge-pnl?since=$MERGEWINDOW" \
               2>/dev/null || echo "000")
          echo "  MERGEHTTP code=$MERGECODE since=$MERGEWINDOW (WINDOWED — not the whole book) bytes=$(wc -c < /tmp/mergepnl.json 2>/dev/null || echo 0)"
          if ! jq -e . /tmp/mergepnl.json >/dev/null 2>&1; then
            echo "  MERGEBODY $(head -c 300 /tmp/mergepnl.json 2>/dev/null | tr '\n' ' ')"
          fi
          jq -r --arg win "$MERGEWINDOW" '.whales // {} | to_entries[]
                 | "  MERGEPNL[since \($win)] \(.key): merges=\(.value.n_merges) shares=\(.value.merge_shares) realised=$\(.value.realized_merge_pnl) sells=$\(.value.realized_sell_pnl) entries=$\(.value.entry_notional) roi=\(.value.roi_on_entries // "n/a") open=\(.value.open_shares)sh/$\(.value.open_cost) cashflow=$\(.value.net_cashflow) fills=\(.value.fills_read // 0)\(if .value.truncated then " TRUNCATED" else "" end)"' \
            /tmp/mergepnl.json 2>/dev/null || echo "  MERGEPNL unavailable"
          jq -r '.whales // {} | to_entries[] | "  MERGEVERDICT \(.key): \(.value.verdict)"' \
            /tmp/mergepnl.json 2>/dev/null || true

          # BIDTRUTH — the venue's bid, on a slug WE HOLD, through the
          # SAME authenticated client mirror_exit prices sales with.
          #
          # The public SDK could not settle this: it reaches only expired
          # markets with null books, and the live ones it did find were
          # stsc-, not our aec-/atc- sports slugs. bbo carries no side
          # dimension, so if its bestBid is the LONG leg and we hold the
          # SHORT one, pricing our sale off it sets an IOC floor at the
          # complement's price — a ~75% giveaway on our own position.
          # That is why slug_bid is still unfixed and 42 exits stand
          # refused. Read-only endpoint; it places nothing.
          BTCODE=$(curl -sS --max-time 90 -w '%{http_code}' \
               -H "X-Admin-Token: $ADMIN_TOKEN" -o /tmp/bidtruth.json \
               "$BASE/api/admin/bid-truth?limit=6&whale=rn1" 2>/dev/null || echo "000")
          echo "  BIDTRUTHHTTP code=$BTCODE"
          jq -r '.rows[]? |
                 "  BIDTRUTH \(.slug): intent=\(.our_intent // "?") long?=\(.our_side_is_long // "?") qty=\(.our_qty // 0) whale=\(.whale // "?")",
                 "    slug_bid_today=\(.slug_bid_today | tostring)  state=\(.state // "?")",
                 "    bestBid=\(.bestBid | tostring) bestAsk=\(.bestAsk | tostring) bidDepth=\(.bidDepth // "?")",
                 "    sides=\(.sides | tostring | .[0:220])",
                 "    bids=\(.bids | tostring | .[0:140]) offers=\(.offers | tostring | .[0:140])",
                 "    ATTRIB=\(.attrib)"' \
             /tmp/bidtruth.json 2>/dev/null || echo "  BIDTRUTH unavailable (endpoint not deployed yet)"
          # rn1 is the only whale we trade, so ask for HIS positions first.
          # But he may hold nothing open right now, and a blank answer
          # would read as "the venue said nothing" rather than "we asked
          # about a settled book" — which is exactly how the first
          # reading came back undecidable. So take a roster-wide sample
          # beside it; ferrari's open aec- market is what settled the
          # attribution the first time.
          curl -sS --max-time 90 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/bidtruth_any.json \
               "$BASE/api/admin/bid-truth?limit=6" 2>/dev/null || true
          jq -r '.rows[]? | select(.state == "MARKET_STATE_OPEN") |
                 "  BIDTRUTH-OPEN \(.slug): intent=\(.our_intent // "?") long?=\(.our_side_is_long // "?") whale=\(.whale // "?")",
                 "    slug_bid_today=\(.slug_bid_today | tostring) bestBid=\(.bestBid | tostring) bestAsk=\(.bestAsk | tostring)",
                 "    sides=\(.sides | tostring | .[0:200])",
                 "    ATTRIB=\(.attrib)"' \
             /tmp/bidtruth_any.json 2>/dev/null || true

          # WHOLEBOOK — REMOVED 2026-08-30, having done its job.
          #
          # It existed to measure rn1's whole book so the fill cap could
          # be set from a number instead of a guess. It answered:
          # 806,085 fills against a 600,000 cap, the cap was raised to
          # 2,000,000, and the gate now reads him complete. Keeping it
          # cost more than it returned — with truncation lifted the read
          # walks all 806k fills every probe, and on run 1408 that
          # pushed this step past `timeout-minutes: 20` and CANCELLED
          # it, losing the whole tail of the diagnostic. The EDGEGATE
          # line already carries fills_read/fills_total from the
          # published payload for free, which is the number that
          # mattered.
          # WHALEEDGE — is this whale PROVABLY profitable, per dollar?
          #
          # The absolute totals flatter enormous turnover. rn1 makes
          # +$231,495 by deploying $24.5M: his edge is 94 BASIS POINTS.
          # Whether 94bp is real or noise depends on the dispersion
          # behind it, and nothing was carrying that until now. Same
          # ratio estimator the copy sleeve is judged by, so his edge
          # and ours are on one scale.
          #
          # This is also the roster instrument: a whale in the verified
          # set whose interval contains zero is one we are funding on
          # an assertion.
          jq -r '.whales // {} | to_entries[]
                 | "  WHALEEDGE \(.key): \(.value.edge_verdict // "n/a")"' \
            /tmp/mergepnl.json 2>/dev/null || echo "  WHALEEDGE unavailable"
          # CLUSTERING (2026-08-30). A whale betting the moneyline, the
          # spread and the total of one game holds three lots driven by
          # ONE result. Grading them as three independent observations
          # made the interval too narrow in the direction that FUNDS
          # people: measured on zero-edge simulated books the iid
          # formula fired at 13.8% against a nominal 5%. deff is how
          # much wider the honest interval is; clusters is how many
          # independent games are really behind the lot count.
          # THE 95% GATE, AS THE MONEY PATH SEES IT. Reconstructed by
          # the endpoint from the same pure decide() the worker calls,
          # after refreshing its own cache — the API and the workers are
          # separate services, so a cached read here would show a
          # verdict nobody spent against.
          jq -r '.edge_gate as $g
                 | "  EDGEGATE measured=\($g.measured_at // "n/a") "
                 + "read_age=\($g.read_age_s // "n/a")s err=\($g.err // "none")",
                 (($g.whales // {}) | to_entries[]
                  | "  EDGEGATE \(if .value.funded then "FUND  " else "REFUSE" end)"
                  + " \(.key): \(.value.reason) ci95=\(.value.ci95 | tostring)"
                  + " games=\(.value.clusters // "n/a")"
                  + " fills=\(.value.fills_read // "n/a")"
                  + "/\(.value.fills_total // "?")")' \
            /tmp/gates.json 2>/dev/null || echo "  EDGEGATE unavailable"
          jq -r '(.per_whale // {}) | to_entries[]?
                 | "  WHALECLUS \(.key): lots=\(.value.edge_lots // 0) "
                 + "events=\(.value.edge_clusters // 0) "
                 + "deff=\(.value.edge_deff // "n/a") "
                 + "se=\(.value.edge_se // "n/a")"' \
            /tmp/mergepnl.json 2>/dev/null || true
          # EXITVALUE — the owner's thesis as one number per whale.
          #
          # Every whale figure this desk has published grades at
          # RESOLUTION, which is a world where the exit never happens.
          # The owner's position is that for a number of the copied
          # whales the EXITS are the edge. TRUEEDGE supports it but
          # compares two different populations (our detected subsample
          # vs their full book), so it is evidence, not proof. This
          # runs both worlds over the SAME fills:
          #
          #   actual  q*(exit_price - avg)   held  q*(payout - avg)
          #   EXIT VALUE = q*(exit_price - payout)   -- avg cancels
          #
          # Positive means exiting BEAT holding to resolution. coverage
          # is the share of closed shares with a known payout; a low
          # coverage number means the verdict is thin, not that the
          # exits were worthless.
          jq -r '.whales // {} | to_entries[]
                 | "  EXITVALUE \(.key): exit_value=$\(.value.exit_value // 0) | actual=$\(.value.cf_actual_on_graded // 0) vs held=$\(.value.cf_hold_on_graded // 0) | graded \(.value.cf_graded_shares // 0)sh of \(.value.cf_closed_shares // 0)sh (coverage \(.value.cf_coverage // "n/a")) | resolved \(.value.conditions_resolved // 0)/\(.value.conditions_touched // 0)"' \
            /tmp/mergepnl.json 2>/dev/null || echo "  EXITVALUE unavailable"
          jq -r '.whales // {} | to_entries[] | select(.value.cf_note)
                 | "  EXITVALUE-NOTE \(.key): \(.value.cf_note)"' \
            /tmp/mergepnl.json 2>/dev/null || true
          jq -r '._errors // {} | to_entries[] | "  EXITVALUE-ERR \(.key): \(.value)"' \
            /tmp/mergepnl.json 2>/dev/null || true

          # SHORTTRUTH — does the venue book a BUY_SHORT as a SELL?
          #
          # The entire "6-for-6 overspend" finding assumed cash cost is
          # fill_price x qty. The SDK says a market is ONE instrument
          # (CreateOrderParams takes marketSlug + intent, with no token
          # id) and that Order.side is DERIVED by the venue from the
          # intent. That is a futures contract, where a short ties up
          # (1 - price) x qty.
          #
          # Under that model all six "overspends" land at or under the
          # authorised amount, one to the cent, worst overage $0.00.
          # Which is exactly why this line exists: a model that fits
          # perfectly is the most persuasive kind of wrong, and the
          # venue states the answer directly in order.side, which we
          # have been storing on every row and never reading.
          # "unavailable" is not a diagnosis. The first run of this line
          # printed exactly that, on a build where the endpoint WAS
          # deployed (healthz said 5e17364), and it said nothing about
          # whether the call 404'd, 500'd, timed out or returned HTML.
          # Capture the status and the first bytes so the next failure
          # names itself instead of needing another round trip.
          SHORTCODE=$(curl -sS --max-time 45 -w '%{http_code}' \
               -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/shorttruth.json \
               "$BASE/api/admin/short-truth?days=7" 2>/dev/null || echo "000")
          echo "  SHORTHTTP code=$SHORTCODE bytes=$(wc -c < /tmp/shorttruth.json 2>/dev/null || echo 0)"
          if ! jq -e . /tmp/shorttruth.json >/dev/null 2>&1; then
            echo "  SHORTBODY $(head -c 300 /tmp/shorttruth.json 2>/dev/null | tr '\n' ' ')"
          fi
          jq -r '"  SHORTTRUTH n=\(.n // 0) with_venue_side=\(.n_with_venue_side // 0) sides=\(.side_counts // {} | tostring) within_auth short_model=\(.within_authorization_under_short_model // 0)/\(.n // 0) long_model=\(.within_authorization_under_long_model // 0)/\(.n // 0)"' \
            /tmp/shorttruth.json 2>/dev/null || echo "  SHORTTRUTH unreadable — see SHORTHTTP/SHORTBODY above"
          jq -r '"  SHORTVERDICT \(.verdict // "unavailable")"' \
            /tmp/shorttruth.json 2>/dev/null || true
          jq -r '.rows[]? | "  SHORTROW \(.slug) lim=\(.limit) req$\(.requested_usd) qty=\(.qty) fill=\(.fill_px) | long_model $\(.cost_if_long_model) short_model $\(.cost_if_short_model) | venue_side=\(.venue_side // "absent") cashQty=\(.venue_cash_order_qty // "absent") avgPx=\(.venue_avg_px // "absent")"' \
            /tmp/shorttruth.json 2>/dev/null | head -10 || true
          # SHORT-RESTATE: the venue's receipts settled the cost model
          # (SHORTVERDICT above), so history written under long math is
          # restated to (1-p)*qty. Idempotent by construction — a row is
          # touched only when it matches the LONG model to the cent, so
          # re-firing every probe is a no-op once history is clean.
          # Same precedent as the RESCORE lever.
          if jq -e '.verdict | test("SHORT IS A SELL")' /tmp/shorttruth.json >/dev/null 2>&1; then
            curl -sS --max-time 60 -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
                 -o /tmp/shortrestate.json "$BASE/api/admin/short-restate" || true
            jq -r '"  SHORT-RESTATE examined=\(.examined // "?") restated=\(.restated // "?") delta=$\(.delta_usd // "?") buckets=\(.buckets // {} | tostring)",
                   ((.neither_examples // [])[0:6][] | "  SHORT-NEITHER \(.slug) booked=$\(.booked) long=$\(.long) short=$\(.short)")' \
              /tmp/shortrestate.json 2>/dev/null || echo "  SHORT-RESTATE unreadable"
          fi

          # OVERSPEND: raw requested-vs-filled per fill. ratio > 1 means
          # filled_usd exceeded what we asked to spend, which an IOC buy
          # cannot do — so it names a real overspend or a broken number.
          jq -r '.fills_24h // [] | map(select((.ratio // 0) > 1.001)) |
                 "  OVERSPEND rows=\(length)"' \
            /tmp/live.json 2>/dev/null || true
          # NEWEST FIRST. The line below takes .[0:14] in whatever order
          # the endpoint returns, and every reading of it this morning
          # showed 08-24 rows while SIZING said 26 fills in 24h — so the
          # sample never contained the fills that matter: the ones placed
          # AFTER the proportional clamp went live at 04:16Z.
          #
          # The clamp has therefore never been verified on a real fill. It
          # was shipped once into dead code already; "it is deployed" is
          # not evidence it executed.
          #
          # ourX (size_vs_his) is the number that proves it: our clip
          # divided by the whale's notional. <= 1.0 means we did not
          # outbet him. Values like 17.77 and 72.23 are the old behaviour.
          jq -r '[.fills_24h // [] | .[] | select(.at != null)]
                 | sort_by(.at) | reverse | .[0:10][]
                 | "  NEWFILL \(.at) \(.whale) \(.status) $\(.fill_usd // 0) @\(.fill_px // "?") ratio \(.ratio // "?") ourX\(.size_vs_his // "?") his$\(.his_notional // "?") \(.intent // "?" | sub("ORDER_INTENT_";"")) \(.slug // "?")"' \
            /tmp/live.json 2>/dev/null || true
          # And the distribution, so one lucky row cannot read as proof.
          jq -r '[.fills_24h // [] | .[] | .size_vs_his // empty] as $x
                 | if ($x | length) == 0 then "  OURX no fills with a size_vs_his"
                   else "  OURX n=\($x | length) le1=\([$x[] | select(. <= 1.001)] | length) gt1=\([$x[] | select(. > 1.001)] | length) max=\($x | max) median=\(($x | sort)[($x | length) / 2 | floor])"
                   end' /tmp/live.json 2>/dev/null || true
          jq -r '.fills_24h // [] | .[0:14][] |
                 "  FILL \(.at) \(.whale) \(.status) req $\(.req_usd // "?")/\(.req_sh // "?")sh @\(.lim // "?") -> filled $\(.fill_usd // 0)/\(.fill_sh // "?")sh @\(.fill_px // "?") ratio \(.ratio // "?") intent=\(.intent // "?" | sub("ORDER_INTENT_";"")) his$\(.his_notional // "?") ourX\(.size_vs_his // "?") execs=\(.n_exec // "?") ordersOnMkt=\(.orders_on_mkt // "?") \(.slug // "?")"' \
            /tmp/live.json 2>/dev/null || true
          # THE FALSIFIER: group every 24h fill by intent and overspend.
          # "shorts pay the complement" requires shorts>0 clean=0. A
          # clean short refutes it; a long that overspends refutes it
          # differently. Either way this is the line that can prove me
          # wrong, which is why it exists.
          jq -r '.fills_24h // [] | group_by(.intent // "unknown")[] |
                 "  BYINTENT \(.[0].intent // "unknown" | sub("ORDER_INTENT_";"")) n=\(length) over=\([.[] | select((.ratio // 0) > 1.001)] | length) clean=\([.[] | select((.ratio // 0) <= 1.001)] | length)"' \
            /tmp/live.json 2>/dev/null || true
          # OVERSPEND RECEIPTS: the venue's own execution list for every
          # overspent row. Settles the owner's round-trip hypothesis
          # (2026-08-25) from stored data — ordersOnMkt=1 means the
          # market was only ever bought once, and exec_max_px vs the
          # limit says whether we were actually overcharged.
          curl -sS --max-time 45 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/receipts.json \
               "$BASE/api/admin/overspend-receipts?hours=48" || true
          jq -r '"  RECEIPTS n=\(.n // 0)"' /tmp/receipts.json 2>/dev/null || true
          jq -r '.rows[]? | "       HIS-TRADE side=\(.his_side // "?") outcome=\(.his_outcome // "?") price=\(.his_trade_price // "?") size=\(.his_size // "?")"' \
            /tmp/receipts.json 2>/dev/null || true
          # CASHING OUT? (owner 2026-08-25) If the whale routinely sells
          # before resolution, our hold-to-settlement copy is a
          # different strategy from his, and every settlement-based
          # number we report understates him.
          curl -sS --max-time 40 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/exits.json "$BASE/api/admin/whale-exits?days=7" || true
          jq -r '.whales[]? |
                 "  EXITS \(.whale): bought \(.assets_bought) assets $\(.bought_usd) | round_trips \(.round_trips) sold $\(.sold_usd) | exit_rate \(.exit_rate // "?")"' \
            /tmp/exits.json 2>/dev/null || true
          # ALL-TIME side census. exit_rate 0.0 over 7d could be a quiet
          # week; zero sells EVER is a detection gap. The per-source
          # split says which ingestion path is blind.
          curl -sS --max-time 40 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/sides.json "$BASE/api/admin/whale-side-census" || true
          jq -r '.whales[]? |
                 "  SIDES \(.whale): buys \(.buys) sells \(.sells) share \(.sell_share // "?") — \(.verdict) | \(.by_source | tostring | .[0:160])"' \
            /tmp/sides.json 2>/dev/null || true
          # SELL-TRUTH: ask the data API directly what sides IT reports
          # for each copy whale, bypassing our pipeline. Separates "we
          # drop sells" from "the source never had them" — the two need
          # completely different fixes.
          curl -sS --max-time 90 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/selltruth.json \
               "$BASE/api/admin/whale-sell-truth?limit=500" || true
          jq -r '.whales[]? |
                 "  SELLTRUTH \(.whale): n=\(.n // 0) sides=\(.sides // {} | tostring) — \(.verdict // .error // "?")"' \
            /tmp/selltruth.json 2>/dev/null || true
          jq -r '.whales[0]? | "  SELLTRUTH sample_keys=\(.sample_keys // [] | join(","))"' \
            /tmp/selltruth.json 2>/dev/null || true
          # POSITION-TRUTH: the whales we copy do not SELL — the API's
          # own trade feed agrees. They close by merging or redeeming,
          # neither of which is a trade. Positions are the only
          # observable that survives that.
          curl -sS --max-time 90 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/postruth.json \
               "$BASE/api/admin/whale-position-truth?top=100" || true
          jq -r '.whales[]? |
                 "  POSTRUTH \(.whale): positions \(.positions_returned // 0) compared \(.assets_compared // 0) hidden_exits \(.unexplained_exits // 0) — \(.verdict // .error // "?")"' \
            /tmp/postruth.json 2>/dev/null || true
          jq -r '.whales[0]? | "  POSTRUTH sample_keys=\(.sample_keys // [] | join(","))"' \
            /tmp/postruth.json 2>/dev/null || true
          # MAPGAP: why swisstony's whole book falls to fuzzy. His picks
          # are Yes/No on slugs whose trailing token names the team.
          # match_side refuses to bridge that by design (inversion
          # incident 2026-08-24) — so measure whether the slug names its
          # side UNIQUELY before touching that guard.
          curl -sS --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/mapgap.json \
               "$BASE/api/admin/mapgap?whale=swisstony&limit=12" || true
          jq -r '"  MAPGAP \(.whale): \(.verdict // "?") | NOT IN PREMAP \(.not_in_premap // 0)/\(.of // 0)"' /tmp/mapgap.json 2>/dev/null || true
          jq -r '.rows[]? | "  MAPGAP \(.slug) pick=\(.outcome // "?") suffix=\(.slug_suffix // "?") premap_rows=\(.premap_rows // 0) sides=\(.venue_sides // [] | tostring) — \(.verdict // .error_venue // "?")"' \
            /tmp/mapgap.json 2>/dev/null || true
          # RATIO: what copy ratio hits "play through the capital once a
          # day"? Computed against the flow we actually FILL, not the
          # flow that exists — the difference is ~100x and decides
          # whether the target is a sizing problem or a mapping one.
          curl -sS --max-time 40 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/ratio.json \
               "$BASE/api/admin/ratio-calibration?target_turnover_x=1" || true
          jq -r '"  RATIO capital $\(.capital // 0) target $\(.target_daily_deployment // 0)/day | fills \(.fills // 0) refused \(.refused // 0) rate \(.fill_rate // "?") | his flow filled $\(.his_flow_on_filled_per_day // 0)/day | we deploy $\(.we_deployed_per_day // 0)/day",
                 "  RATIO needed \(.ratio_needed // "?")  at fill multiples \(.ratio_at_fill_multiple // {} | tostring)",
                 "  RATIO verdict: \(.verdict // "?")"' \
            /tmp/ratio.json 2>/dev/null || true
          # TRUEEDGE RE-GRADED AT HIS OWN EXIT. Every whale number
          # served today settles at resolution, which books a
          # cash-out trader's WIN as a loss. The TRUEEDGE cuts were
          # made on that number. CUTCHECK is the line that says
          # whether we cut a profitable whale by accident.
          curl -sS --max-time 50 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/cashout.json \
               "$BASE/api/admin/true-edge-cashout?since_day=2026-08-01" || true
          jq -r '.whales[]? |
                 "  CUTCHECK \(.whale): settlement $\(.cf_settlement) -> cashout $\(.cf_cashout) (delta \(.delta)) exited \(.exited)/\(.detected) rate \(.exit_rate // "?") — \(.verdict)"' \
            /tmp/cashout.json 2>/dev/null || true
          # PRICE-TRUTH, server-side: the CI version printed "SKIP: no
          # credentials" (2026-08-25 00:57Z) because the runner holds no
          # PMUS keys. Only the deployed API can preview an order.
          curl -sS --max-time 40 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/ptruth.json \
               "$BASE/api/admin/price-truth?price=0.30&qty=10&family=aec-" || true
          # OVERSPEND BREAKER state — if this is tripped the copy sleeve
          # is stopped and only an admin clear restarts it.
          curl -sS --max-time 25 -H "X-Admin-Token: $ADMIN_TOKEN" \
               -o /tmp/osh.json "$BASE/api/admin/overspend-halt" || true
          jq -r '"  OSHALT tripped=\(.tripped // false) \(.record // "" | tostring | .[0:220])"' \
            /tmp/osh.json 2>/dev/null || true
          jq -r '"  PRICE-TRUTH market=\(.market // "?") family=\(.family // "?") ours=$\(.ours // "?") complement=$\(.complement // "?") err=\(.error // "none")",
                 (.legs // {} | to_entries[] |
                   "  PTRUTH \(.key): venue_cost=$\(.value.venue_cost // "?") ratio=\(.value.ratio_to_ours // "?") \(.value.verdict // .value.error // "?")")' \
            /tmp/ptruth.json 2>/dev/null || true
          jq -r '.rows[]? |
                 "  RCPT \(.placed_at) \(.whale) \(.slug) lim=\(.limit_price) req=$\(.requested_usd)/\(.requested_shares)sh filled=$\(.filled_usd)/\(.filled_shares)sh@\(.fill_price) ordersOnMkt=\(.orders_on_market) execs=\(.n_executions) maxPx=\(.exec_max_px // "none") pnl=\(.pnl // "?")",
                 "       VERDICT: \(.verdict)",
                 "       SIDE: \(.side_verdict // "?")",
                 "       venue_sides: \(.venue_sides // [] | tostring | .[0:220])",
                 (.executions[]? | "       exec \(.type // "?") \(.shares)sh @ \(.px // "?") ident=\(.ident // {} | tostring) keys=\(.keys // [] | join(","))")' \
            /tmp/receipts.json 2>/dev/null || true
          jq -r '"  enabled(api env): \(.enabled // .config.enabled // "?")  paused: \(.paused // "?")",
                 (.by_whale // [] | .[] | "  whale \(.whale): fills \(.fills) deployed $\(.deployed) settled \(.settled) pnl $\(.pnl)"),
                 (.orders // .summary // {} | to_entries[] | "  \(.key): \(.value)"),
                 (.recent // [] | .[0:12][] |
                   "  \(.placed_at // "?")  \(.whale // "?")  \(.status // "?")  limit \(.limit_price // "?")  $\(.filled_usd // 0)  \(.market_title // "?") / \(.outcome // "?")  \(.error // "" | .[0:300])")' \
             /tmp/live.json 2>/dev/null | head -25 || echo "  (unavailable)"

          echo ""
          echo "#   UNMAPPED FUNNEL (rejected copy rows: league x type x why) #"
          # Separates 'mapper gap we can fix' from 'the US venue does not
          # list it' — recent_7d is the live problem, the rest is frozen
          # history the sweep no longer retries.
          curl -sS --max-time 60 -o /tmp/unm.json "$BASE/api/copy-unmapped" || true
          jq -r '"  rows=\(.totals.rows // "?")  recent_7d=\(.totals.recent_7d // "?")"' \
             /tmp/unm.json 2>/dev/null || echo "  (endpoint not deployed yet)"
          # The number the owner asked for (2026-08-13): of the unmapped
          # rows, how many did the venue LIST (our bug, winnable) vs not
          # carry at all (unwinnable by code)?
          jq -r '.winnable // {} | "  WINNABLE listed_mapper_fail=\(.listed_mapper_fail // "?") (7d \(.listed_mapper_fail_7d // "?"))  venue_unlisted=\(.venue_unlisted // "?") (7d \(.venue_unlisted_7d // "?"))  undiagnosed=\(.undiagnosed // "?")"' \
             /tmp/unm.json 2>/dev/null || true
          # exact404 split (2026-08-30): how many venue_unlisted rows
          # carry an exact-lane 404 trail — candidate-grammar misses
          # masquerading as venue gaps. Beside, never replacing.
          jq -r '.winnable // {} | "  WINNABLE-X404 exact404=\(.exact404 // "?") (7d \(.exact404_7d // "?"))  of_unlisted=\(.exact404_unlisted // "?") (7d \(.exact404_unlisted_7d // "?"))"' \
             /tmp/unm.json 2>/dev/null || true
          # PER-WHALE WINNABLE SPLIT (owner order 2026-08-30: "we need
          # to be mapping and trading a larger percentage of his
          # trades"). The roster-wide 50/50 cannot answer a question
          # about ONE whale — only the listed_mapper_fail half is ours
          # to win, and its size differs completely between a whale on
          # US majors and one on world soccer.
          jq -r '.by_whale_winnable // [] | .[]
                 | "  WINWHALE \(.whale): missed=\(.n) (7d \(.n_7d)) "
                 + "OURS=\(.listed_mapper_fail) (7d \(.listed_mapper_fail_7d)) "
                 + "venue_gap=\(.venue_unlisted) undiag=\(.undiagnosed) "
                 + "x404=\(.exact404)"' \
             /tmp/unm.json 2>/dev/null | head -12 || true
          jq -r '.no_slug // {} | "  NOSLUG rows=\(.rows // "?")  catalog_has_token=\(.catalog_has_token // "?")  token_unknown=\(.token_unknown // "?")"' \
             /tmp/unm.json 2>/dev/null || echo "  (endpoint not deployed yet)"
          jq -r '.by_reason // [] | .[] | "  RSN \(.reason): \(.n)"' \
             /tmp/unm.json 2>/dev/null | head -5 || true
          jq -r '.by_market_type // [] | .[] | "  TYP \(.market_type): \(.n)"' \
             /tmp/unm.json 2>/dev/null | head -8 || true
          jq -r '.by_league // [] | .[] | "  LGE \(.league): \(.n) (7d \(.n_7d))  listed=\(.listed // "?") 0ev=\(.unlisted_0ev // "?") x404=\(.exact404 // "?")  \(.market_types // {} | to_entries[0:3] | map("\(.key):\(.value)") | join(" "))"' \
             /tmp/unm.json 2>/dev/null | head -20 || true

          echo ""
          echo "# TENNIS WEEK (venue ledgers — owner question 2026-08-14) #"
          curl -sS --max-time 280 -o /tmp/tw.json "$BASE/api/tennis-week" || true
          jq -r '"PM TENNIS WEEK: markets \(.markets // "?")  settled \(.settled // "?") (\(.won // "?")W-\(.lost // "?")L)  realized $\(.realized_total // "?")  settled_cost $\(.settled_cost // "?")  open \(.open // "?") ($\(.open_cost // "?"))"' \
             /tmp/tw.json 2>/dev/null || echo "  (tennis-week endpoint not deployed yet)"
          jq -r '.detail.kalshi_tennis_week // {} | "K TENNIS WEEK: settled \(.settled // "?") (\(.won // "?")W-\(.lost // "?")L)  realized $\(.realized_total // "?")  cost $\(.cost_total // "?")  err \(.error // "none")"' \
             /tmp/status.json 2>/dev/null || true
          # per-row PMT/KT tables removed 2026-08-15 — they grew past the
          # ~5k-line log cap and clipped the heartbeat sections; full row
          # data ships in the EXPORT BLOBS below.

          echo ""
          echo "# VENUE EXPORT (every trade, both accounts, verbatim) #"
          curl -sS --max-time 280 -o /tmp/px.json "$BASE/api/venue-export" || true
          jq -r '"PMX COUNT \(.count // "?") since \(.since // "?")  err \(.error // "none")"' /tmp/px.json 2>/dev/null || echo "  (venue-export not deployed yet)"
          jq -r '.detail.kalshi_export // {} | "KX COUNTS fills \(.fills // [] | length)  settlements \(.settlements // [] | length)  trunc \(.fills_truncated // "?")/\(.settle_truncated // "?")  err \(.error // .fills_error // .settle_error // "none")"' \
             /tmp/status.json 2>/dev/null || true
          # per-row PMX/KXF/KXS tables removed 2026-08-15 — same log-cap
          # reason as above; the blobs carry every row.

          echo ""
          echo "# EXPORT — ARTIFACT FIRST (2026-08-30)                       #"
          echo "#                                                            #"
          echo "# The gzip+base64 lines below are CORRUPT and always were.   #"
          echo "# The Actions log pipeline masks every occurrence of a       #"
          echo "# registered secret as '***'. A short secret value matches   #"
          echo "# random base64 every few KB, so the masker rewrites the     #"
          echo "# payload itself: measured on run 1393, PXRAWBLOB carried    #"
          echo "# 1,485 masked runs in 5.7MB and EVERY blob — PXBLOB,        #"
          echo "# RRBLOB, WHROSTER, WDBLOB — failed gzip decompression. The  #"
          echo "# masker even rewrote a segment of a public logo URL, which  #"
          echo "# is how short the matching secret must be.                  #"
          echo "#                                                            #"
          echo "# Artifacts are NOT masked and carry no line cap, so         #"
          echo "# /tmp/export is the real egress from here on. The echoes    #"
          echo "# stay for one run as a fallback, then come out.             #"
          mkdir -p /tmp/export
          _keep() {   # _keep <artifact-name> <file>
            [ -s "$2" ] || return 0
            cp "$2" "/tmp/export/$1" 2>/dev/null || return 0
            echo "  EXPORT $1 bytes=$(wc -c < "$2") sha=$(sha256sum "$2" | cut -c1-16)"
          }
          if [ -s /tmp/px.json ]; then
            _keep px.json /tmp/px.json
            echo "PXBLOB $(gzip -c /tmp/px.json | base64 -w0)"
          fi
          if [ -s /tmp/tr.json ]; then
            _keep tr.json /tmp/tr.json
            echo "TRBLOB $(jq -c '{sold_markets, summary}' /tmp/tr.json | gzip -c | base64 -w0)"
          fi
          jq -c '.detail.kalshi_export // empty' /tmp/status.json 2>/dev/null > /tmp/kx.json || true
          if [ -s /tmp/kx.json ]; then
            _keep kx.json /tmp/kx.json
            echo "KXBLOB $(gzip -c /tmp/kx.json | base64 -w0)"
          fi
          jq -c '.detail.kalshi_export_raw // empty' /tmp/status.json 2>/dev/null > /tmp/kxraw.json || true
          if [ -s /tmp/kxraw.json ]; then
            _keep kxraw.json /tmp/kxraw.json
            echo "KXRAWBLOB $(gzip -c /tmp/kxraw.json | base64 -w0)"
          fi
          # PM raw activities (verbatim venue rows) for the weekly report
          curl -sS --max-time 280 -o /tmp/pxraw.json \
            "$BASE/api/venue-export-raw?since=2026-08-10" || true
          if [ -s /tmp/pxraw.json ] && jq -e '.rows' /tmp/pxraw.json >/dev/null 2>&1; then
            # ARTIFACT ONLY — no fallback echo. This blob was 5.7MB of
            # base64 carrying 1,485 masked runs: not merely unusable but
            # actively harmful, since a single 5.7MB line crowds the log
            # budget that the readable diagnostics share.
            _keep pxraw.json /tmp/pxraw.json
            echo "  PXRAW rows=$(jq -r '.rows | length' /tmp/pxraw.json 2>/dev/null || echo '?')"
          else
            echo "PXRAWBLOB FAILED $(head -c 120 /tmp/pxraw.json 2>/dev/null)"
          fi
          # Category split (site accounting, ±$100 display cap applies) —
          # weekly management report needs the per-day sleeve/manual shape.
          curl -sS --max-time 30 -o /tmp/rr.json \
            "$BASE/api/report/range?from=2026-08-10&to=2026-08-17" || true
          if [ -s /tmp/rr.json ]; then
            _keep rr.json /tmp/rr.json
            echo "RRBLOB $(gzip -c /tmp/rr.json | base64 -w0)"
          fi
          # Whale week performance from the platform's own tracker (the
          # data-api activity feed caps at offset 5000 — ~16h for RN1 —
          # so the DB replay is the only complete 7-day source).
          curl -sS --max-time 30 -o /tmp/whales.json "$BASE/api/whales" || true
          if [ -s /tmp/whales.json ]; then
            jq -c '[.[] | {id, username, address, active}]' /tmp/whales.json \
              > /tmp/whroster.json 2>/dev/null || true
            _keep whroster.json /tmp/whroster.json
            echo "WHROSTER $(cat /tmp/whroster.json 2>/dev/null | gzip -c | base64 -w0)"
            echo '[]' > /tmp/wdays.json
            for id in $(jq -r '.[].id' /tmp/whales.json 2>/dev/null | head -8); do
              for d in 2026-08-10 2026-08-11 2026-08-12 2026-08-13 2026-08-14 2026-08-15 2026-08-16; do
                curl -sS --max-time 20 -o /tmp/wd.json "$BASE/api/whales/$id/day/$d" || continue
                jq -c --argjson id "$id" '. as $o | {id: $id, date: $o.date, pnl: $o.pnl,
                  stake: $o.stake, wins: $o.wins, losses: $o.losses,
                  settled: $o.settled_count, trades: $o.trades_placed,
                  volume: $o.volume_placed,
                  sports: [($o.sports // [])[] | {sport, pnl, stake, wins, losses,
                    top: ((.bets // [])[:3] | map({t: (.market_title // .event_title // ""), pnl}))}]}' \
                  /tmp/wd.json > /tmp/wd1.json 2>/dev/null || continue
                jq -c -s '.[0] + [.[1]]' /tmp/wdays.json /tmp/wd1.json > /tmp/wdays2.json \
                  && mv /tmp/wdays2.json /tmp/wdays.json
              done
            done
            _keep wdays.json /tmp/wdays.json
            echo "WDBLOB $(gzip -c /tmp/wdays.json | base64 -w0)"
            # Retry lane for the heavy histories that time out at 20s
            # (swisstony full ledger replay; RN1 busiest days).
            echo '[]' > /tmp/wretry.json
            for pair in "1:2026-08-10" "1:2026-08-11" "1:2026-08-12" "1:2026-08-13" \
                        "1:2026-08-14" "1:2026-08-15" "1:2026-08-16" \
                        "2:2026-08-10" "2:2026-08-12" "2:2026-08-13"; do
              id="${pair%%:*}"; d="${pair##*:}"
              for try in 1 2; do
                curl -sS --max-time 110 -o /tmp/wd.json "$BASE/api/whales/$id/day/$d" && break
                sleep 3
              done
              [ -s /tmp/wd.json ] || continue
              jq -c --argjson id "$id" '. as $o | {id: $id, date: $o.date, pnl: $o.pnl,
                stake: $o.stake, wins: $o.wins, losses: $o.losses,
                settled: $o.settled_count, trades: $o.trades_placed,
                volume: $o.volume_placed,
                sports: [($o.sports // [])[] | {sport, pnl, stake, wins, losses,
                  top: ((.bets // [])[:3] | map({t: (.market_title // .event_title // ""), pnl}))}]}' \
                /tmp/wd.json > /tmp/wd1.json 2>/dev/null || continue
              jq -c -s '.[0] + [.[1]]' /tmp/wretry.json /tmp/wd1.json > /tmp/wr2.json \
                && mv /tmp/wr2.json /tmp/wretry.json
              rm -f /tmp/wd.json
            done
            _keep wretry.json /tmp/wretry.json
            echo "WRETRYBLOB $(gzip -c /tmp/wretry.json | base64 -w0)"
          fi

          echo ""
          echo "#   MEMORY WATCH (rss_mb over 2 min — where does it die?)    #"
          for i in $(seq 1 24); do
            # A dead API must print DOWN, not exit the step (bash -e turns
            # a failed assignment-substitution into a job failure).
            hz=$(curl -sS --max-time 8 "$BASE/healthz" 2>/dev/null) && code=0 || code=$?
            ts=$(date -u +%H:%M:%S)
            if [ $code -eq 0 ] && echo "$hz" | jq -e .ok >/dev/null 2>&1; then
              echo "  $ts  $(echo "$hz" | jq -c '{rss_mb, db_ok, commit}')"
            else
              echo "  $ts  DOWN"
            fi
            sleep 5
          done

          echo ""
          echo "#   SERVICE HEARTBEATS (which worker is dead, and why)       #"
          curl -sS --max-time 60 -o /tmp/hb.json "$BASE/api/health/services" || true
          jq -r '.[] | "  \(.service): \(.status)  \(.beat_at)  \(.error // "")"' \
            /tmp/hb.json 2>/dev/null | head -15 || echo "  (endpoint not deployed yet)"
          # The underdog sweep's per-gate stats live in its heartbeat
          # detail — the one line that says WHERE entries are dying.
          echo "  underdog detail: $(jq -c '.[] | select(.service == "underdog") | .detail' /tmp/hb.json 2>/dev/null)"
          # Path A diagnosis (2026-08-10): events_seen=0 with a growing
          # last_event_age means the WS provider delivers nothing —
          # swap POLYGON_WS_URL; events without decodes means a roster
          # or decode mismatch — a code problem.
          echo "  chain detail: $(jq -c '.[] | select(.service == "chain_listener") | .detail' /tmp/hb.json 2>/dev/null)"
          # Enrichment health (the '(no slug)' bucket's supply line):
          # re_enriched should be >0 when a backlog exists, unenriched_1k
          # should trend DOWN after the dead-token fix, dead_tokens is
          # the permanently-unknowable set being skipped.
          echo "  metadata detail: $(jq -c '.[] | select(.service == "metadata") | .detail | {re_enriched, unenriched_1k, dead_tokens, active_sports_markets}' /tmp/hb.json 2>/dev/null)"

          echo ""
          echo "#   WHALE INGESTION RAW (shape + freshness, no jq guessing) #"
          echo "  -- /api/feed?limit=2 --"
          curl -sS --max-time 60 "$BASE/api/feed?limit=2" 2>&1 | head -c 700; echo
          echo "  -- /api/whales --"
          curl -sS --max-time 60 "$BASE/api/whales" 2>&1 | head -c 700; echo

          echo ""
          echo "#   WHALE INGESTION FRESHNESS (is the pipeline alive?)      #"
          # Zero copy probes in 30d means either no fresh detections or a
          # dead listener. The newest ingested trade timestamp settles it —
          # and says whether stored whale data exists to measure edge decay.
          curl -sS --max-time 60 -o /tmp/feed.json "$BASE/api/feed?limit=3" || true
          jq -r '(.trades // .items // .) | if type=="array" then
                   (.[0:3][] | "  \(.fill_ts // .ts // .detected_at // "?")  \(.whale_username // .username // "?")  \(.side // "?") $\(.notional // .size // "?")")
                 else "  (unexpected shape)" end' /tmp/feed.json 2>/dev/null \
            | head -5 || echo "  (unavailable)"
          curl -sS --max-time 60 "$BASE/api/whales" 2>/dev/null | \
            jq -r '(.whales // .) | if type=="array" then
                     "  roster: \(length) whales; newest activity: \([.[].last_trade_at // .[].last_seen // empty] | max // "?")"
                   else "  (unexpected shape)" end' 2>/dev/null \
            || echo "  (unavailable)"

          echo ""
          echo "#   KALSHI DESK BOARDS (owner report 2026-08-22: All=0)    #"
          for URL in "desk-feed?venue=kalshi&league=all" \
                     "desk-feed?venue=kalshi&league=tennis" \
                     "desk-games?venue=kalshi&league=all"; do
            CODE=$(curl -sS --max-time 60 -o /tmp/kb.json -w '%{http_code}' \
              -H "X-Admin-Token: $ADMIN_TOKEN" "$BASE/api/admin/$URL" || echo ERR)
            N=$(jq -r '(.cards // .games // []) | length' /tmp/kb.json 2>/dev/null || echo '?')
            ERR=$(jq -r '.detail // .error // empty' /tmp/kb.json 2>/dev/null | head -c 160)
            echo "  KDESKG $URL -> HTTP $CODE rows $N $ERR"
          done
          # The venue itself, from the runner (open internet): is the
          # sports series listing alive at all?
          KAPI=$(curl -sS --max-time 20 "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXATPMATCH&status=open&limit=5" | jq -r '.markets | length' 2>/dev/null || echo ERR)
          echo "  KDESKG venue-direct KXATPMATCH open rows: $KAPI"
          # Tennis-tab forensics: the venue's close times for those rows
          # (are they inside our 168h window?), and whether the venue
          # honors our min/max_close_ts param shape for this series.
          curl -sS --max-time 20 "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXATPMATCH&status=open&limit=5" | \
            jq -r '.markets[]? | "  KDESKG-T \(.ticker) close=\(.close_time // .close_ts // "?") status=\(.status // "?")"' 2>/dev/null | head -6
          NOWS=$(date +%s); MAXS=$((NOWS + 604800))
          KWIN=$(curl -sS --max-time 20 "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXATPMATCH&status=open&limit=1000&min_close_ts=$NOWS&max_close_ts=$MAXS" | jq -r '.markets | length' 2>/dev/null || echo ERR)
          echo "  KDESKG-T windowed(min/max_close_ts, 168h): $KWIN rows"

          echo ""
          echo "#   PMBOARD (owner report 2026-08-22: moneyline sides at   #"
          echo "#   31c/32c — complements must sum ~100c)                  #"
          # The platform's own game board for the reported match, then the
          # raw side rows: label, orderable slug, price. If both sides
          # carry ~the same price, the wrongness is in the venue payload
          # or our side extraction — the raw rows say which.
          GID=$(curl -sS --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" \
            "$BASE/api/admin/market-search?q=pegula" 2>/dev/null | \
            jq -r '.markets[0].event_slug // empty' 2>/dev/null)
          echo "  PMBOARD event: ${GID:-not-found-via-search}"
          for Q in "pegula" "swiatek"; do
            curl -sS --max-time 60 -H "X-Admin-Token: $ADMIN_TOKEN" \
              "$BASE/api/admin/market-search?q=$Q" 2>/dev/null | \
              jq -r '.markets[]? | .title as $t | .outcomes[]?
                     | "  PMBOARD \($t) :: \(.label // .outcome) ask=\(.ask) bid=\(.bid) asset=\((.asset // "")[0:12])"' \
              2>/dev/null | head -8
          done

          echo ""
          echo "#   SOCCER FORENSIC (work order 2026-08-21: soccer -6.2k   #"
          echo "#   on the venue account vs profitable soccer copy whales) #"
          curl -sS --max-time 90 -o /tmp/tr.json "$BASE/api/track-record?since=2026-08-01" || true
          echo "  -- venue-account P&L by sleeve x sport (capped record) --"
          jq -r '[.trades[]? | {sleeve: (.sleeve // "?"), sport: (.sport // "?"), pnl: (.pnl // 0)}]
                 | group_by([.sleeve, .sport]) | map({k: (.[0].sleeve + "/" + .[0].sport),
                     pnl: (map(.pnl) | add | . * 100 | round / 100), n: length})
                 | sort_by(.pnl) | .[:14][] | "  SOCFOR \(.k): \(.pnl) over \(.n)"' /tmp/tr.json \
            2>/dev/null || echo "  SOCFOR unavailable"
          curl -sS --max-time 60 "$BASE/api/copies-record" 2>/dev/null | \
            jq -r '.by_whale_sport[]? | select(.sport == "soccer")
                   | "  SOCFOR-COPY \(.whale)/soccer: pnl \(.pnl) staked \(.staked) (\(.wins)-\(.losses))"' \
            2>/dev/null || echo "  SOCFOR-COPY unavailable"

          echo ""
          echo "#   KCR-PROV: crypto-whale detection provenance            #"
          # The crypto leg refuses everything as stale (>90s). This says
          # WHY: per crypto whale, are trades arriving source=chain
          # (sub-second, fresh) or source=poll (3-6 min Data-API lag,
          # always stale at the 90s bar)? latency_s = detected_at - ts.
          # NOTE: /api/whales returns a BARE ARRAY; `.whales // .` errors
          # on arrays (jq `//` catches null/false, not index errors) and
          # printed a spurious NOT IN ROSTER on the first run of this step.
          curl -sS --max-time 60 -o /tmp/whales.json "$BASE/api/whales" || true
          jq -r 'if type=="array" then
                   "  KCR-PROV active roster: " + ([.[] | "\(.id):\(.username // .address[0:10])"] | join(" "))
                 else "  KCR-PROV roster: unexpected shape" end' \
            /tmp/whales.json 2>/dev/null || echo "  KCR-PROV roster: fetch failed"
          for W in 0xf705fa04 jnstrtprdctnmrkts; do
            WID=$(jq -r --arg w "$W" \
              '(if type=="array" then . else (.whales // []) end)
               | .[] | select((.username // "" | ascii_downcase) == $w) | .id' \
              /tmp/whales.json 2>/dev/null | head -1)
            if [ -z "$WID" ]; then
              echo "  KCR-PROV $W: NOT IN ROSTER (/api/whales has no such username)"
              continue
            fi
            curl -sS --max-time 60 "$BASE/api/feed?whale_id=$WID&limit=8" 2>/dev/null | \
              jq -r --arg w "$W" '. as $rows
                | if (type=="array" and length > 0) then
                    ($rows | map(select(.source=="chain")) | length) as $ch
                    | ($rows | map(select(.source=="poll")) | length) as $po
                    | "  KCR-PROV \($w) (id \(.[0].whale_id)): last \(length) rows — chain \($ch) / poll \($po)",
                      (.[0:4][] | "    \(.ts)  src=\(.source // "?")  lat=\(.latency_s // "?")s  \(.side) $\(.notional)")
                  else "  KCR-PROV \($w) (id ?): no trade rows in feed" end' \
              || echo "  KCR-PROV $W: feed fetch failed"
          done

          echo ""
          echo "###########################################################"
          echo "#                 EDGE DISTRIBUTION                       #"
          echo "###########################################################"
          jq -r '
            [.[] | select(.edge != null) | .edge] as $e
            | ($e | length) as $n
            | if $n == 0 then "no priced records"
              else
                "sample: \($n) priced outcomes",
                "positive edge:      \([$e[] | select(. > 0)] | length)",
                "  ...>= 2c (would clear a typical bar): \([$e[] | select(. >= 0.02)] | length)",
                "  ...>= 8c (implausible, mapping error): \([$e[] | select(. >= 0.08)] | length)",
                "negative edge:      \([$e[] | select(. <= 0)] | length)",
                "median:             \(($e | sort)[$n/2|floor])",
                "",
                "histogram (edge in cents):",
                ( [$e[] | (. * 100) | floor] | group_by(.) | sort_by(-length)
                  | .[:14][] | "  \(.[0])c : \(length)" )
              end' /tmp/fills.json 2>/dev/null || echo "(no fills payload)"

          echo ""
          echo "worst 6 (mapping suspects — a real edge is never this big):"
          jq -r 'sort_by(.edge) | .[:6][]
                 | "  \(.edge|tostring|.[0:7])  ask \(.limit_price)  fair \(.fair_value)  \(.outcome_id)"' \
             /tmp/fills.json 2>/dev/null || true
          echo "best 6:"
          jq -r 'sort_by(-.edge) | .[:6][]
                 | "  \(.edge|tostring|.[0:7])  ask \(.limit_price)  fair \(.fair_value)  \(.outcome_id)"' \
             /tmp/fills.json 2>/dev/null || true

          echo ""
          echo "###########################################################"
          echo "#                      VERDICT                            #"
          echo "###########################################################"
          jq -r '.detail.verdict // "(engine predates the verdict build)"' /tmp/status.json 2>/dev/null || true
          # Liveness first. A blank funnel reads identically whether the
          # engine is idle or dead; the heartbeat age is what separates them.
          jq -r '"heartbeat : \(.beat_at // "NONE — engine has not reported")"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '"cycle_s   : \(.detail.cycle_s // "?")",
                 "mode      : \(.detail.mode // "?")",
                 "logged    : \(.detail.logged // "?")",
                 "feed      : \(.detail.feed_events // "?") events",
                 "matched   : \(.detail.matched // "?")   tradeable: \(.detail.tradeable // "?")",
                 "books     : \(.detail.books_checked // "?")",
                 "studied   : \(.detail.studied // "?")",
                 "reclaimed : \(.detail.reclaimed // 0)",
                 "heartbeat : \(.beat_at // "?")"' /tmp/status.json 2>/dev/null || true
          echo "blockers  :"; jq -r '.detail.blockers // {} | to_entries[] | "  \(.key) x\(.value)"' /tmp/status.json 2>/dev/null || true
          echo "rejects   :"; jq -r '.detail.rejects  // {} | to_entries[] | "  \(.key) x\(.value)"' /tmp/status.json 2>/dev/null || true
          echo "gap       :"; jq -r '.detail.threshold_gap // {} | to_entries[] | "  \(.key) x\(.value)"' /tmp/status.json 2>/dev/null || true
          echo "budget    :"; jq -r '.detail.budget // {} | to_entries[] | "  \(.key)=\(.value)"' /tmp/status.json 2>/dev/null || true
          echo ""
          echo "###########################################################"
          echo "#   ENGINE OWN BOOKS (independent of the API deploy)       #"
          echo "###########################################################"
          jq -r '.detail.performance // {} | if .days then
                   "last \(.days)d, live only: \(.live_only)",
                   "fills \(.fills)   staked $\(.staked)   open $\(.open_cost)",
                   "settled \(.settled)  (W \(.wins) / L \(.losses))  win rate \(.win_rate // "n/a")",
                   "realized $\(.realized)   ROI \(.roi // "n/a — nothing settled")"
                 else "(engine predates the scorecard build)" end' /tmp/status.json 2>/dev/null || true
          jq -r '.detail.edge_drift // {} | if .n and .n > 0 then
                   "",
                   "ADVERSE SELECTION: \(.n) entries re-observed",
                   "  edge retention \(.retention)   (1.0 = edge was real, ~0 = we bought stale quotes)",
                   "  mean drift \(.mean_drift_c)c   held \(.held)/\(.n)"
                 else "", "adverse selection: nothing matured yet" end' /tmp/status.json 2>/dev/null || true
          # Per category — a blended drift number hides the one leg doing
          # the damage, which is the whole reason the split exists.
          jq -r '.detail.edge_drift.by_category // {} | to_entries[]
                 | "    \(.key): n=\(.value.n)  drift \(.value.mean_drift_c)c  retention \(.value.retention)"' \
             /tmp/status.json 2>/dev/null || true
          echo "drift surcharge now added to each bar:"
          jq -r '.detail.drift_penalty // {} | to_entries[]
                 | "    \(.key): +\((.value * 100))c"' /tmp/status.json 2>/dev/null \
             || echo "    (none — nothing measured yet)"
          echo "refreshed this cycle: $(jq -r '.detail.refreshed // 0' /tmp/status.json 2>/dev/null)"

          echo ""
          echo "###########################################################"
          echo "#   POSITIONS BY SIZE  (cap-breach detector)               #"
          echo "###########################################################"
          # This split is by COST, nothing else. It was previously labelled
          # "system vs manual", which asserted something the boundary cannot
          # know: every position over $5 was reported as hand-placed. On
          # 2026-08-02 all twenty of them were the engine's own runaway
          # entries, and the label hid the incident behind a plausible
          # explanation. The heuristic is also circular — it assumes the caps
          # held in order to decide who placed a trade.
          #
          # Read the over-cap cohort as a BREACH LIST. With per_market at
          # $1.50, anything above it is the engine entering a market it
          # already held.
          curl -sS --max-time 120 -o /tmp/acct.json "$BASE/api/pmus-account" || true
          jq -r '"boundary: cost <= $\(.system_max_cost)  (SIZE only — says nothing about who placed it)",
                 "",
                 (.system, .manual | "[\(if .cohort == "manual" then "OVER $5 — investigate" else "within $5" end)]  \(.positions) positions, $\(.staked) staked",
                   "   settled \(.settled)  (W \(.wins) / L \(.losses))  win rate \(.win_rate // "n/a")",
                   "   realized $\(.realized)   ROI \(.roi // "n/a")",
                   "   open \(.open) worth $\(.open_cost)", "")' /tmp/acct.json 2>/dev/null || true
          echo "OVER-CAP cohort in detail (cost > \$5 against a \$1.50 per-market cap):"
          jq -r '.manual_positions // [] | if length == 0 then "   (none)"
                 else .[] | "  \(if .settled then "settled" else "OPEN   " end)  cost $\(.cost)  realized \(.realized)  \(.market_slug)" end' \
             /tmp/acct.json 2>/dev/null || true
          echo ""
          echo "within-cap positions in detail:"
          jq -r '.system_positions // [] | .[]
                 | "  \(if .settled then "settled" else "OPEN   " end)  cost $\(.cost)  realized \(.realized)  \(.market_slug)"'              /tmp/acct.json 2>/dev/null || true

          echo ""
          echo "###########################################################"
          echo "#   METHODOLOGY DOCUMENT (generated from the ledger)       #"
          echo "###########################################################"
          # The engine renders this itself from config + its own ledger and
          # publishes it here. Every number in it is computed at generation
          # time, so it cannot drift from the system it describes the way a
          # hand-maintained document does.
          code=$(curl -sS --max-time 60 -o /tmp/meth.json \
                      -w '%{http_code}' "$BASE/api/engine/methodology" || true)
          if [ "$code" = "200" ]; then
            jq -r '"published: \(.updated_at)", "bytes: \(.markdown | length)",
                   "read it: '"$BASE"'/api/engine/methodology?format=md", "",
                   "── verdict ──",
                   (.markdown | split("\n") | map(select(startswith("> **"))) | .[0] // "(none)")' \
               /tmp/meth.json 2>/dev/null || true
          else
            echo "HTTP ${code:-000} — not published yet (the worker publishes"
            echo "on startup and at each day rollover; needs the deploy with"
            echo "edge.reporting to be live)"
          fi

          echo ""
          echo "MAPPING MISSES (the funnel's biggest single loss):"
          jq -r '.detail.unpriced_examples // {} | to_entries[]
                 | "  [\(.key)]", (.value | if type=="array" then .[] else . end
                   | "     \(.)")' /tmp/status.json 2>/dev/null || true

          # ── headline, printed LAST ─────────────────────────────────
          # Everything above is diagnosis; these six lines are the state.
          # The mapping-miss dump above runs to ~90 lines, which is enough
          # to push the numbers that matter out of a log tail — so they go
          # here, where a tail always reaches them.
          echo ""
          echo "###########################################################"
          echo "#                      HEADLINE                           #"
          echo "###########################################################"
          jq -r '"verdict   : \(.detail.verdict // "?")",
                 "mode      : \(.detail.mode // "?")   cycle \(.detail.cycle_s // "?")s   logged \(.detail.logged // "?")"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.edge_drift // {} | if .n and .n > 0 then
                   "drift     : n=\(.n)  retention \(.retention)  mean \(.mean_drift_c)c"
                 else "drift     : nothing matured yet" end' /tmp/status.json 2>/dev/null || true
          jq -r '.detail.edge_drift.by_category // {} | to_entries[]
                 | "   \(.key): n=\(.value.n)  \(.value.mean_drift_c)c  ret \(.value.retention)"' \
             /tmp/status.json 2>/dev/null || true
          # Free samples: staleness measured on outcomes we priced but did
          # not buy. A floor on the fill number, never a substitute for it,
          # but it keeps measuring when the bar is too high to trade.
          jq -r '.detail.price_drift // {} | if .n and .n > 0 then
                   "free      : n=\(.n)  mean \(.mean_drift_c)c  (staleness only, no selection)"
                 else "free      : no second looks yet" end' /tmp/status.json 2>/dev/null || true
          jq -r '.detail.price_drift.by_category // {} | to_entries[]
                 | "   \(.key): n=\(.value.n)  \(.value.mean_drift_c)c"' \
             /tmp/status.json 2>/dev/null || true
          # Reversion: does apparent edge give itself back in proportion to
          # how big the claim was? That is the winner's-curse test, and it
          # decides whether the flat surcharge or proportional shrinkage is
          # the correct instrument.
          jq -r '.detail.reversion // {} | if .keep != null then
                   "reversion : keep \(.keep)  (slope \(.slope), n=\(.n)) -> SHRINKAGE ACTIVE"
                 elif .n then "reversion : n=\(.n), not yet decidable (need n>=200 and spread)"
                 else "reversion : no samples" end' /tmp/status.json 2>/dev/null || true
          echo "surcharge :"
          jq -r '.detail.drift_penalty // {} | to_entries[]
                 | "   \(.key): +\(.value * 100 | .*100|round|./100)c"' /tmp/status.json 2>/dev/null || true
          jq -r '.detail.drift_penalty // {} | if length == 0 then
                   "   (none — below the observation floor)" else empty end' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.system | "system    : \(.settled) settled  W\(.wins)/L\(.losses)  realized $\(.realized)  ROI \(.roi // "n/a")",
                           "            open \(.open) worth $\(.open_cost)"' \
             /tmp/acct.json 2>/dev/null || true
          # What crossing the spread costs, against what we claimed to win.
          # net_c below zero means we were losing at the moment of entry,
          # whatever the model said about the price.
          jq -r '"heartbeat : \(.beat_at // "NONE — engine has not reported")"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.reconciled // {} | if .trades_seen then
                   "reconciled: \(.fills_added) fills restored, $\(.cost_restored) of cost the ledger had forgotten"
                 else empty end' /tmp/status.json 2>/dev/null || true
          echo "ARBITRAGE:"
          jq -r '"   books found: \(.detail.arb_found // 0)   profit booked $\(.detail.arb_profit // 0)"' \
             /tmp/status.json 2>/dev/null || true
          echo "OFFSET CLASSES (DD rollup — offsetting-position share):"
          jq -r '.detail.by_cat_performance.arb // {} | "   same-venue (partitions+covers): \(.settled // 0) settled  staked $\(.staked // 0)  realized $\(.realized // 0)"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '"   cover: candidates \(.detail.cover_candidates // 0)  locks_seen \(.detail.cover_locks_seen // [] | length)  title_refused \(.detail.cover_title_refused // 0)  dark \(.detail.cover_dark // 0)"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.cover_title_examples // [] | .[] | "   refused title: \(.)"' \
             /tmp/status.json 2>/dev/null || true
          echo "   cross-venue: frozen by policy (xv sleeve off)"
          jq -r '.detail.arb_status // {} | to_entries[] | "   \(.key): \(.value)"' \
             /tmp/status.json 2>/dev/null || true
          jq -r '.detail.arb_books // [] | .[] | "   \(.event): \(.legs) legs, cost $\(.cost), profit/set \(.profit_per_set), depth \(.depth_sets) sets"' \
             /tmp/status.json 2>/dev/null || true
          # The one state that means we are holding a position nobody chose.
          jq -r '.detail.arb_exposed // [] | .[] | "   !! EXPOSED \(.event) holding \(.holding)"' \
             /tmp/status.json 2>/dev/null || true
          # Owner 2026-08-12: "just have the copies running". The software
          # class ran for two days on an env var while the code default
          # said otherwise, and no probe line contradicted it. This one
          # does, straight from the engine's own gate.
          jq -r '"SOFTWARE CLASS: \(.detail.strategy_class // "unknown — engine has not posted a cycle yet")"' \
             /tmp/status.json 2>/dev/null || true
          echo "SPREAD COST (per fill, cents):"
          jq -r '.detail.spread_cost // {} | if length == 0 then "   (no book snapshots yet)"
                 else to_entries[] | "   \(.key): n=\(.value.n)  spread \(.value.spread_c)c  paid over mid \(.value.paid_over_mid_c)c  claimed edge \(.value.edge_c)c  NET \(.value.net_c)c" end' \
             /tmp/status.json 2>/dev/null || true
          # THE STEERING NUMBER. Profit per dollar of turnover, measured at
          # entry: (claimed edge x retention - paid over mid) / price. It
          # converges in hundreds of fills where settled P&L needs
          # thousands of resolutions; positive here and negative at
          # settlement means the MAP is wrong, not the economics.
          echo "ENTRY MARGIN (profit per $ of turnover, at entry):"
          jq -r '.detail.entry_margin // {} | if length == 0 then "   (no fills measured yet)"
                 else to_entries[] | "   \(.key): n=\(.value.n_fills)  gross \((.value.gross_margin * 100 * 100 | round) / 100)%  net \(if .value.net_margin != null then "\((.value.net_margin * 100 * 100 | round) / 100)%" else "unmeasured (retention n=\(.value.retention_n))" end)" end' \
             /tmp/status.json 2>/dev/null || true
          echo "settled by BAND (our own fills, not the inherited calibration):"
          jq -r '.detail.by_band // {} | if length == 0 then "   (nothing settled yet)"
                 else to_entries[] | "   \(.key): \(.value.settled) settled  $\(.value.realized)  ROI \(.value.roi // "n/a")" end' \
             /tmp/status.json 2>/dev/null || true
          echo "settled by CATEGORY (engine ledger, live only):"
          jq -r '.detail.by_cat_performance // {} | if length == 0 then
                   "   (nothing settled yet)"
                 else to_entries[] | "   \(.key): \(.value.settled) settled  W\(.value.wins)/L\(.value.losses)  staked $\(.value.staked)  realized $\(.value.realized)  ROI \(.value.roi // "n/a")" end' \
             /tmp/status.json 2>/dev/null || true
          echo "per day  (system cohort, settled only):"
          jq -r '.system_daily // [] | if length == 0 then "   (no settlements in window)"
                 else .[] | "   \(.day)  \(.settled) settled  W\(.wins)/L\(.losses)  staked $\(.staked)  realized $\(.realized)  ROI \(.roi // "n/a")" end' \
             /tmp/acct.json 2>/dev/null || true

      - name: Weekly report data (whale on-chain activity + branding, via runner)
        if: always()
        run: |
          # Management weekly report inputs (owner order 2026-08-17).
          # The runner has open internet; the analysis container does not,
          # so raw whale activity ships as gzip blobs like the exports.
          set +e
          D="https://data-api.polymarket.com/activity"
          CUT=$(date -u -d '15 days ago' +%s)
          crawl () {  # $1 name  $2 address
            # Pages accumulate as one JSON array; offset advances by the
            # ROWS ACTUALLY RETURNED (the server may cap below our ask —
            # advancing by the ask would silently skip rows).
            local out="/tmp/w_$1.json" n=0 off=0 rows cnt oldest first=1
            echo "[" > "$out"
            while [ $n -lt 60 ]; do
              rows=$(curl -sS --max-time 25 "$D?user=$2&limit=500&offset=$off")
              cnt=$(echo "$rows" | jq 'length' 2>/dev/null || echo 0)
              if [ -z "$cnt" ] || [ "$cnt" = "0" ] || [ "$cnt" = "null" ]; then break; fi
              if [ $first -eq 1 ]; then first=0; else echo "," >> "$out"; fi
              echo "$rows" | jq -c '.[]' | paste -sd, - >> "$out"
              oldest=$(echo "$rows" | jq '[.[].timestamp] | min' 2>/dev/null || echo 0)
              n=$((n+1)); off=$((off+cnt))
              if [ "$oldest" != "null" ] && [ "$oldest" -lt "$CUT" ]; then break; fi
              sleep 0.4
            done
            echo "]" >> "$out"
            echo "WHALE $1: pages=$n rows_offset=$off bytes=$(wc -c <"$out")"
          }
          crawl rn1        0x2005d16a84ceefa912d4e380cd32e7ff827875ea
          crawl swisstony  0x204f72f35326db932158cba6adff0b9a1da95e14
          crawl w2c33      0x2c335066fe58fe9237c3d3dc7b275c2a034a0563
          # Artifact egress (2026-08-30): these whale crawls are the
          # largest blobs in the run and the masker corrupts them like
          # every other. /tmp/export is uploaded by the artifact step.
          mkdir -p /tmp/export
          for w in rn1 swisstony w2c33; do
            if [ -s /tmp/w_$w.json ] && jq -e 'length' /tmp/w_$w.json >/dev/null 2>&1; then
              cp /tmp/w_$w.json /tmp/export/w_$w.json 2>/dev/null || true
              echo "  EXPORT w_$w.json bytes=$(wc -c < /tmp/w_$w.json) rows=$(jq -r 'length' /tmp/w_$w.json 2>/dev/null || echo '?')"
              echo "WBLOB_$w $(gzip -c /tmp/w_$w.json | base64 -w0)"
            else
              echo "WBLOB_$w FAILED"
            fi
          done
          # BettorToken branding: homepage + logo, best-effort.
          curl -sSL --max-time 30 -o /tmp/bt.html "https://www.bettortoken.com" \
            && echo "SITEHTML bytes=$(wc -c </tmp/bt.html)" || echo "SITEHTML FAILED"
          if [ -s /tmp/bt.html ]; then
            echo "BTHTMLBLOB $(gzip -c /tmp/bt.html | base64 -w0)"
            LOGO="/assets/bt-logo-mark.png /og/home.png $(grep -oE '(content|src|href)="[^"]*(logo|icon)[^"]*"' /tmp/bt.html \
                   | grep -oE 'https?://[^"]+|/[^"]+' | head -3)"
            i=0
            for u in $LOGO; do
              case "$u" in /*) u="https://www.bettortoken.com$u";; esac
              i=$((i+1))
              curl -sSL --max-time 20 -o /tmp/logo_$i "$u" \
                && echo "LOGOBLOB_$i url=$u type=$(file -b --mime-type /tmp/logo_$i) $(base64 -w0 </tmp/logo_$i | head -c 400000)" \
                || echo "LOGOBLOB_$i FAILED $u"
            done
          fi

      - name: Kalshi crypto strike shapes (below-band ground truth)
        if: always()
        run: |
          B="https://api.elections.kalshi.com/trade-api/v2"
          echo "###########################################################"
          echo "#   CRYPTO STRIKE SHAPES (does the ladder list below-bands?)"
          echo "###########################################################"
          # Audit 2026-08-21: the crypto copy leg refuses whale 'below X'
          # bets as unsupported. If these ladders list cap-only (less-
          # than) markets, buying YES on one is a LONG — an exact twin
          # for that whole flow. Evidence first, then the leg extends.
          for S in KXBTC KXBTCD KXETH KXETHD; do
            curl -sS --max-time 30 "$B/events?series_ticker=$S&status=open&with_nested_markets=true&limit=2" -o /tmp/ss.json || true
            jq -r --arg s "$S" '.events[]? | .event_ticker as $e |
                   .markets[]? | "  STRIKE \($s) \(.ticker) type=\(.strike_type // "none") floor=\(.floor_strike // "-") cap=\(.cap_strike // "-")"' \
               /tmp/ss.json 2>/dev/null | head -30 || true
          done

      - name: Kalshi series census (runner has open internet; the container does not)
        if: always()
        run: |
          B="https://api.elections.kalshi.com/trade-api/v2"
          echo "###########################################################"
          echo "#   KALSHI SERIES CENSUS (find the real sports tickers)    #"
          echo "###########################################################"
          # Sports series list — the authoritative answer to "what does
          # Kalshi actually call tennis/MLB/WNBA series".
          curl -sS --max-time 20 "$B/series?category=Sports&limit=200" \
            | jq -r '.series[]? | "\(.ticker)  \(.title)"' 2>/dev/null \
            | sort | head -80 || echo "(series list unavailable)"
          echo ""
          echo "-- tennis-ish series, with one sample event each --"
          for S in $(curl -sS --max-time 20 "$B/series?category=Sports&limit=200" \
                       | jq -r '.series[]?.ticker' 2>/dev/null \
                       | grep -iE "tennis|atp|wta|match" | head -25); do
            echo "== $S =="
            curl -sS --max-time 15 "$B/events?series_ticker=$S&status=open&with_nested_markets=true&limit=1" \
              | jq -r '.events[]? | {title, event_ticker, outcomes: [.markets[]? | {t: .ticker, name: (.yes_sub_title // .subtitle)}]}' \
              2>/dev/null | head -30 || true
          done
          echo ""
          echo "-- MLB + WNBA sample outcome names (mapper dialect check) --"
          for S in KXMLBGAME KXWNBAGAME; do
            echo "== $S =="
            curl -sS --max-time 15 "$B/events?series_ticker=$S&status=open&with_nested_markets=true&limit=2" \
              | jq -r '.events[]? | {title, event_ticker, outcomes: [.markets[]? | (.yes_sub_title // .subtitle)]}' \
              2>/dev/null | head -20 || true
          done

      - name: Crypto census — Kalshi BTC 15-min series (xv_crypto ground truth)
        if: always()
        run: |
          B="https://api.elections.kalshi.com/trade-api/v2"
          echo "###########################################################"
          echo "#   KALSHI BTC SERIES (discover, don't guess)              #"
          echo "###########################################################"
          # The scanner (edge/shadow/xv_crypto.py) resolves BTC series the
          # same way: list series by category, keep tickers containing BTC.
          # This step prints the venue's actual naming so tuning happens
          # against ground truth, never guesses like KXBTC15M.
          : > /tmp/btc_series.txt
          for CAT in Crypto Financials; do
            echo "-- /series?category=$CAT — tickers containing BTC --"
            curl -sS --max-time 20 "$B/series?category=$CAT&limit=200" \
              -o /tmp/series.json || true
            jq -r '.series[]? | "\(.ticker)  \(.title)  freq=\(.frequency // "?")"' \
              /tmp/series.json 2>/dev/null | grep -i btc | tee -a /tmp/btc_cat.txt \
              || echo "(none / unavailable)"
            jq -r '.series[]?.ticker' /tmp/series.json 2>/dev/null \
              | grep -i btc >> /tmp/btc_series.txt || true
            sleep 1
          done
          echo ""
          echo "-- 3 sample open events per BTC series (tickers/strikes/close_times) --"
          for S in $(sort -u /tmp/btc_series.txt | head -8); do
