          awk '/self_trade_prevention_type:/,0' /tmp/v2.md | head -c 4000; echo ""
          echo "-- CreateOrderV2Response schema --"
          awk '/CreateOrderV2Response:/,0' /tmp/v2.md | head -c 8000; echo ""
