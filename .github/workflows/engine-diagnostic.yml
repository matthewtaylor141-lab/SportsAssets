      - name: PMUS depth census (dollar depth at/near best ask, per cell)
        if: always()
        run: |
          pip install --quiet polymarket-us 2>/dev/null || pip install polymarket-us
          echo "###########################################################"
          echo "#   PMUS DEPTH CENSUS (owner ask 2026-08-20: per-cell     #"
          echo "#   clip proposal - how much book survives near best ask) #"
          echo "###########################################################"
          python - <<'PY'
          import re, time, statistics as st
          from polymarket_us import PolymarketUS

          pub = PolymarketUS()

          def sport_of(slug):
              s = (slug or "").lower()
              if "-mlb-" in s: return "baseball"
              if re.search(r'-(nfl|cfb|ncaaf)-', s): return "football"
              if re.search(r'-(atp|wta|itf\w*|chal)-', s): return "tennis"
              if re.search(r'-(wnba|nba|ncaab)-', s): return "basketball"
              if "-nhl-" in s: return "hockey"
              return "soccer"

          def type_of(slug):
              k = (slug or "").split("-", 1)[0]
              return {"atc": "moneyline", "aec": "moneyline",
                      "asc": "spread", "tsc": "total"}.get(k, "other")

          # Discovery mirrors edge/venues/polymarket_us.py: events.list
          # pages of 100; each market's own `slug` is the orderable id.
          slugs = []
          variant = None
          for v in ({"active": True, "closed": False}, {}):
              try:
                  r = pub.events.list({"limit": 100, **v}) or {}
                  if r.get("events"):
                      variant = v
                      break
              except Exception as e:
                  print("variant", v, "->", type(e).__name__, str(e)[:120])
          print("variant:", variant)
          offset = 0
          for _ in range(6):
              try:
                  r = pub.events.list({"limit": 100, "offset": offset,
                                       **(variant or {})}) or {}
              except Exception as e:
                  print("page failed:", type(e).__name__, str(e)[:120]); break
              evs = r.get("events") or []
              for ev in evs:
                  for m in (ev.get("markets") or []):
                      sl = m.get("slug") or ""
                      if m.get("closed") or type_of(sl) == "other":
                          continue
                      slugs.append(sl)
              if len(evs) < 100:
                  break
              offset += 100
          print("candidate markets:", len(slugs))

          # Book shape mirrors the adapter: payload under marketData/
          # book/top-level; levels are {"px": {"value": p}, "qty": q};
          # asks under offers/asks.
          def parse_asks(raw):
              body = raw or {}
              for key in ("marketData", "book"):
                  if isinstance(body.get(key), dict):
                      body = body[key]
              out = []
              for lvl in (body.get("offers") or body.get("asks") or []):
                  try:
                      p = float((lvl.get("px") or {}).get("value") or 0)
                      q = float(lvl.get("qty") or 0)
                  except (TypeError, ValueError, AttributeError):
                      continue
                  if 0 < p < 1 and q > 0:
                      out.append((p, q))
              return sorted(out)

          # Stratify: listings are dominated by far-out football
          # markets; cap each (sport, type) cell so baseball/tennis/
          # soccer — the cells actually trading — are always sampled.
          bucket, picked = {}, []
          for sl in slugs:
              k = (sport_of(sl), type_of(sl))
              if bucket.get(k, 0) < 25:
                  bucket[k] = bucket.get(k, 0) + 1
                  picked.append(sl)
          print("stratified sample:", len(picked), dict(
              (f"{a}|{b}", n) for (a, b), n in sorted(bucket.items())))
          probed, cells = 0, {}
          err = {}
          for sl in picked[:300]:
              try:
                  raw = pub.markets.book(sl) or {}
              except Exception as e:
                  err[type(e).__name__] = err.get(type(e).__name__, 0) + 1
                  continue
              lv = parse_asks(raw)
              if not lv:
                  continue
              best = lv[0][0]
              d0 = sum(p*q for p, q in lv if p <= best + 1e-9)
              d2 = sum(p*q for p, q in lv if p <= best + 0.02 + 1e-9)
              probed += 1
              c = cells.setdefault((sport_of(sl), type_of(sl)),
                                   {"d0": [], "d2": []})
              c["d0"].append(d0); c["d2"].append(d2)
              time.sleep(0.1)
          # Acceptance ladder (owner report ask): share of books whose
          # within-2c depth absorbs each stake size in full.
          LADDER = (75, 225, 450, 1000, 2000, 3000)
          for (sp, ty), c in sorted(cells.items()):
              xs = c["d2"]; n = len(xs)
              pct = " ".join(f"@{k}={round(100*sum(1 for x in xs if x >= k)/n)}%"
                             for k in LADDER)
              print(f"ACCEPT {sp}|{ty}  n={n}  {pct}")
          print("books probed:", probed, " errors:", err)
          if probed and probed < 25:
              print("WARNING: small sample - treat medians as indicative")

          def q(xs, k):
              if len(xs) >= 4:
                  return round(st.quantiles(xs, n=4)[k])
              return round(sorted(xs)[len(xs)//2])
          for (sp, ty), c in sorted(cells.items()):
              print(f"DEPTH {sp}|{ty}  n={len(c['d0'])}  "
                    f"bestask$ p25={q(c['d0'],0)} med={q(c['d0'],1)} p75={q(c['d0'],2)}  "
                    f"within2c$ p25={q(c['d2'],0)} med={q(c['d2'],1)} p75={q(c['d2'],2)}")
          PY

