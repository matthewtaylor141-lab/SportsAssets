      - name: BID GROUND TRUTH (what does this venue actually publish?)
        if: always()
        run: |
          pip install --quiet polymarket-us 2>/dev/null || pip install polymarket-us
          echo "###########################################################"
          echo "#   BIDGT: slug_bid returns None on every shared-id market #"
          echo "###########################################################"
          # ROUND 1 (run 1409) answered the SCHEMA and left the money
          # question open, so round 2 asks the money question directly.
          #
          # SETTLED by round 1: side objects carry NO bid — their keys
          # are identifier, long, price, team, tradable plus
          # housekeeping, nothing else. Both sides share ONE identifier,
          # so slug_bid's `next(s for s in sides if s.identifier !=
          # us_slug)` fallback is dead on arrival and the function
          # returns None on the whole family. markets.bbo and
          # markets.book DO exist, with bestBid/bestAsk nested as
          # {"value": ...} under marketData.
          #
          # STILL OPEN, and the reason no fix has shipped: bbo is keyed
          # by marketSlug with NO side dimension. On a two-sided market
          # sharing one identifier, is bestBid the bid for the LONG side
          # or the short one? Guess wrong and mirror_exit sets an IOC
          # sell FLOOR at the complement's price — accepting roughly 75%
          # below fair value on our own position. That is a worse
          # failure than the refusals it would fix.
          #
          # Round 1 could not answer it because every market it sampled
          # was MARKET_STATE_EXPIRED with null bids. So walk until we
          # find LIVE books, and print the attribution as a STATEMENT
          # rather than leaving three raw numbers to be interpreted
          # later: if bid <= long_price <= ask, bbo describes the long
          # side; if not, it does not.
          python - <<'PY'
          import json
          from datetime import datetime as _dt, timedelta as _td
          from datetime import timezone as _tz
          from polymarket_us import PolymarketUS

          # THE FILTER I USED IN ROUND 2 IS ONE THIS REPO ALREADY
          # DOCUMENTS AS BROKEN, which is why it returned
          # "0 live of 4800 scanned" and I briefly read that as an auth
          # problem. workers/premap.py:2266 has it in writing:
          #
          #   "the venue IGNORES the eventSlug filter on markets.list
          #    (every queried event got back the same generic page), and
          #    a bare {active: True} events.list leads with a stale
          #    historical catalog (2025 games on page 1)."
          #
          # So 4,800 "markets" was the same stale 2025 page over and
          # over — every one expired, every one with a null book. The
          # sweep solved this on 2026-08-21 and I did not reuse its
          # solution: bound the window by START TIME and read each
          # event's markets INLINE off the event row, no per-event call.
          pub = PolymarketUS()
          _now = _dt.now(_tz.utc)

          def _iso(d):
              return d.strftime("%Y-%m-%dT%H:%M:%SZ")

          window = {"active": True, "closed": False,
                    "startTimeMin": _iso(_now - _td(hours=6)),
                    "startTimeMax": _iso(_now + _td(hours=72))}
          shown, scanned = 0, 0
          for off in range(0, 200, 25):
              if shown >= 3:
                  break
              try:
                  resp = pub.events.list({**window, "limit": 25,
                                          "offset": off})
              except Exception as e:
                  print(f"BIDGT events.list ERR {type(e).__name__}")
                  break
              evs = list((resp.get("events") if isinstance(resp, dict)
                          else resp) or [])
              if not evs:
                  break
              for ev in evs:
                  if shown >= 3:
                      break
                  for m in (ev.get("markets") or []):
                      if shown >= 3:
                          break
                      if not isinstance(m, dict):
                          continue
                      slug = m.get("slug") or m.get("identifier")
                      if not slug:
                          continue
                      scanned += 1
                      try:
                          bbo = pub.markets.bbo(slug)
                      except Exception:
                          continue
                      md = (bbo or {}).get("marketData") or {}
                      bb, ba = md.get("bestBid"), md.get("bestAsk")
                      if bb is None and ba is None:
                          continue
                      print(f"BIDGT LIVE slug={slug!r} state={md.get('state')!r}")
                      print(f"BIDGT   bestBid={json.dumps(bb, default=str)}"
                            f" bestAsk={json.dumps(ba, default=str)}")
                      print(f"BIDGT   bidDepth={md.get('bidDepth')!r}"
                            f" askDepth={md.get('askDepth')!r}")
                      print("BIDGT   outcomes="
                            f"{json.dumps(m.get('outcomes'), default=str)[:140]}"
                            " outcomePrices="
                            f"{json.dumps(m.get('outcomePrices'), default=str)[:140]}")
                      for sd in (m.get("marketSides") or []):
                          if isinstance(sd, dict):
                              print(f"BIDGT   side long={sd.get('long')!r}"
                                    f" price={sd.get('price')!r}"
                                    f" tradable={sd.get('tradable')!r}")
                      try:
                          bkd = ((pub.markets.book(slug) or {})
                                 .get("marketData") or {})
                          print("BIDGT   book bids[:2]="
                                f"{json.dumps((bkd.get('bids') or [])[:2], default=str)}")
                          print("BIDGT   book offers[:2]="
                                f"{json.dumps((bkd.get('offers') or [])[:2], default=str)}")
                      except Exception as e:
                          print(f"BIDGT   book ERR {type(e).__name__}")
                      try:
                          _b = float((bb or {}).get("value"))
                          _a = float((ba or {}).get("value"))
                          _lp = next(float(sd.get("price"))
                                     for sd in (m.get("marketSides") or [])
                                     if isinstance(sd, dict) and sd.get("long"))
                          print(f"BIDGT   ATTRIB long_price={_lp} vs "
                                f"[{_b},{_a}] -> "
                                + ("bbo IS the long side"
                                   if _b <= _lp <= _a
                                   else "bbo is NOT the long side"))
                      except Exception as e:
                          print(f"BIDGT   ATTRIB undecidable ({type(e).__name__})")
                      shown += 1
          print(f"BIDGT done ({shown} live of {scanned} scanned)")
          PY

