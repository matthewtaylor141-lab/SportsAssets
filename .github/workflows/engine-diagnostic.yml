      - name: SPORTS-CHAIN receipts (why swisstony/hrh chain lane is silent)
        if: always()
        env:
          DEFAULT_BASE: https://sportsassets-api.onrender.com
          OVERRIDE: ${{ github.event.inputs.api_base }}
        run: |
          echo "###########################################################"
          echo "#  SPORTS-CHAIN: poll-only sports whales, receipt truth    #"
          echo "###########################################################"
          # Audit 2026-08-30: swisstony 0/10 recent rows on chain (was
          # 96k chain buys), homerunhazard 1/10 — their edge decays at
          # poll latency ($17.8k and $13.6k lat_cost in TRUEEDGE). The
          # A2 lane watches the v3 exchanges and topic d543adfd, so the
          # outage is one of: (a) his wallet never appears in the v3
          # fill event's owner topics (proxy/EOA mismatch), (b) his
          # fills are BUNDLES decode_fill_v3_receipt refuses
          # (len(token_ids)!=1), (c) a different unwatched emitter.
          # This prints, per recent poll-detected fill: every log's
          # emitter (watched?), topic0, owner topics, and the count of
          # distinct 1155 token ids — the three hypotheses answered by
          # receipts, not theory.
          BASE="${OVERRIDE:-$DEFAULT_BASE}"
          python3 - "$BASE" <<'PYEOF'
          import json, sys, urllib.request

          base = sys.argv[1]
          TARGETS = ("swisstony", "homerunhazard", "rn1")
          WATCHED = {"0x4bfb41d5b3570defd03c39a9a4d8de6bd8b8982e",
                     "0xc5d563a36ae78145c45a50134d48a1215220f80a",
                     "0xe2222d279d744050d28e00520010520000310f59",
                     "0xe111180000d2663c0091e4f400237545b87b996b"}
          FILL_V3 = ("0xd543adfd945773f1a62f74f0ee55a5e3b9b1a28262"
                     "980ba90b1a89f2ea84d8ee")
          T_SINGLE = ("0xc3d58168c5ae7397731d063d5bbf3d657854427343"
                      "f4c083240f7aacaa2d0f62")
          T_BATCH = ("0x4a39dc06d4c0dbc64b70af90fd698a233a518aa5d0"
                     "7e595d983b8c0526c8f7fb")
          RPCS = ["https://polygon-rpc.com", "https://1rpc.io/matic",
                  "https://polygon-bor-rpc.publicnode.com"]
          UA = {"user-agent": "curl/8.5.0", "accept": "application/json"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def rpc(method, params):
              body = json.dumps({"jsonrpc": "2.0", "id": 1,
                                 "method": method,
                                 "params": params}).encode()
              for u in RPCS:
                  try:
                      req = urllib.request.Request(
                          u, data=body,
                          headers={"content-type": "application/json",
                                   **UA})
                      with urllib.request.urlopen(req, timeout=25) as r:
                          out = json.load(r)
                      if out.get("result") is not None:
                          return out["result"]
                  except Exception as exc:
                      print(f"    (rpc {u} failed: {exc})")
              return None

          # the feed endpoint caps limit at 200 (le=200; the first run
          # of this step got a 422 asking for 400) — paginate instead
          rows = []
          before = None
          for _page in range(3):
              url = f"{base}/api/feed?limit=200"
              if before is not None:
                  url += f"&before_id={before}"
              try:
                  page = get(url)
              except Exception as exc:
                  print(f"  SPORTS-CHAIN feed fetch failed: {exc}")
                  break
              if isinstance(page, dict):
                  page = page.get("rows") or page.get("trades") or []
              if not page:
                  break
              rows.extend(page)
              before = page[-1].get("id")
              if before is None:
                  break
          per: dict[str, list] = {t: [] for t in TARGETS}
          for row in rows:
              u = str(row.get("whale_username") or "").lower()
              if u in per and len(per[u]) < 3 \
                      and str(row.get("tx_hash") or "").startswith("0x"):
                  # poll-detected rows are the ones chain MISSED
                  if str(row.get("source") or "") != "chain":
                      per[u].append(row)
          # roster wallets from the engine itself: the receipt verdicts
          # below are WALLET-FILTERED, which is what the A2/S1 bundle
          # refusal actually tests (receipt-wide id counts proved
          # nothing — a normal CTF match mints both complements)
          wallets: dict[str, str] = {}
          try:
              for w in get(f"{base}/api/whales") or []:
                  un = str(w.get("username") or "").lower()
                  if un in TARGETS and w.get("address"):
                      wallets[un] = str(w["address"]).lower()
          except Exception as exc:
              print(f"  SPORTS-CHAIN whales fetch failed: {exc}")
          print(f"  SPORTS-CHAIN wallets: "
                + " ".join(f"{k}={v}" for k, v in wallets.items()))
          USDC = "0x2791bca1f2de4661ed88a30c99a7a9449aa84174"
          for u, picked in per.items():
              if not picked:
                  print(f"  SPORTS-CHAIN {u}: no recent poll rows with "
                        f"a tx hash in the feed window")
              w_addr = wallets.get(u, "")
              w_topic = w_addr[2:].lower() if w_addr else None
              for row in picked:
                  tx = row["tx_hash"]
                  print(f"  SPORTS-CHAIN {u} tx {tx} "
                        f"({row.get('side')} ${row.get('notional')} "
                        f"src={row.get('source')})")
                  rec = rpc("eth_getTransactionReceipt", [tx])
                  if not rec:
                      print("    (no receipt from any RPC)")
                      continue
                  tids = set()
                  my_ids: set[int] = set()
                  my_sh_in = my_sh_out = 0
                  my_usdc_in = my_usdc_out = 0
                  my_batch = 0
                  my_events = []
                  n_batch = 0
                  for lg in rec.get("logs", []):
                      em = (lg.get("address") or "").lower()
                      tps = [str(t).lower() for t in
                             (lg.get("topics") or [])]
                      t0 = tps[0] if tps else ""
                      data = str(lg.get("data", "0x"))[2:]
                      addrs = [("0x" + t[-40:]) for t in tps[1:4]]
                      mine = bool(w_addr and w_addr in addrs)
                      if t0 == T_SINGLE and len(data) >= 128:
                          tid = int(data[0:64], 16)
                          val = int(data[64:128], 16)
                          tids.add(tid)
                          if mine:
                              my_ids.add(tid)
                              if len(addrs) >= 3 \
                                      and addrs[2] == w_addr:
                                  my_sh_in += val
                              elif len(addrs) >= 2 \
                                      and addrs[1] == w_addr:
                                  my_sh_out += val
                      elif t0 == T_BATCH and mine:
                          my_batch += 1
                          # ids[]/vals[] arrays: two offsets then two
                          # length-prefixed arrays of uint256
                          try:
                              o1 = int(data[0:64], 16) * 2
                              n1 = int(data[o1:o1 + 64], 16)
                              for i in range(min(n1, 32)):
                                  s = o1 + 64 + i * 64
                                  my_ids.add(int(data[s:s + 64], 16))
                          except Exception:
                              pass
                      elif t0 == T_BATCH:
                          n_batch += 1
                      elif em == USDC and t0.startswith("0xddf252ad") \
                              and len(tps) >= 3 and len(data) >= 64:
                          amt = int(data[0:64], 16)
                          if addrs and addrs[-1] == w_addr:
                              my_usdc_in += amt
                          elif addrs and addrs[0] == w_addr:
                              my_usdc_out += amt
                      elif t0 == FILL_V3 and mine:
                          words = [int(data[i:i + 64], 16)
                                   for i in range(0, min(len(data),
                                                         64 * 6), 64)]
                          my_events.append(words)
                  print(f"    RECEIPT-VERDICT wallet={w_addr[:12]} "
                        f"my_ids={sorted(my_ids)[:4]} "
                        f"n_my_ids={len(my_ids)} my_batch={my_batch} "
                        f"sh_in={my_sh_in} sh_out={my_sh_out} "
                        f"usdc_in={my_usdc_in} usdc_out={my_usdc_out} "
                        f"receipt_ids={len(tids)}")
                  for i, ws in enumerate(my_events):
                      # WORD1 PREMISE VERDICT (decoder panel 2026-08-30:
                      # the mint identity makes column-sum cross-foots
                      # vacuous — the only wallet-scoped disambiguator
                      # is word1==his token id, and THAT premise must
                      # be positively verified across many receipts
                      # before any decoder prices from it)
                      w1_is_T = (len(ws) > 1 and my_ids
                                 and ws[1] in my_ids)
                      px = (round(ws[2] / ws[3], 4)
                            if len(ws) > 3 and ws[3] else None)
                      w3_is_S = (len(ws) > 3
                                 and ws[3] in (my_sh_in, my_sh_out))
                      print(f"    MYFILL-EVENT {i}: words="
                            f"{[hex(x) for x in ws]} w1==T:{w1_is_T} "
                            f"w3==S:{w3_is_S} implied_px={px}")
                  # cross-foot: do the fill events' amount words sum to
                  # the wallet's standard legs? Exact agreement is the
                  # license for a per-fill bundle decoder; anything
                  # else keeps the refusal.
                  for wi in range(6):
                      s = sum(ws[wi] for ws in my_events
                              if len(ws) > wi)
                      if s and s in (my_sh_in, my_sh_out,
                                     my_usdc_in, my_usdc_out):
                          print(f"    CROSSFOOT word{wi} sum={s} == "
                                f"a wallet leg total — attributable")
          PYEOF

      - name: New exchange ABI (name the event behind topic d543adfd)
        if: always()
        run: |
          echo "###########################################################"
          echo "#   NEW EXCHANGE ABI (0xe2222d...0f59 event signatures)    #"
          echo "###########################################################"
          # Ground truth showed fills now emit from this contract with
          # topic0 0xd543adfd... — enumerate its ABI events, hash each
          # signature, and name the one that matches so the listener can
          # subscribe to and decode the REAL event.
          A="0xe2222d279d744050d28e00520010520000310f59"
          TX="0x2be95df880975cf37af78330c7c9b597aeff44d6338110c79cf11db46362e3d4"
          # 1) Sourcify (keyless) — ABI if the contract is verified there.
          curl -sS --max-time 25 \
            "https://repo.sourcify.dev/contracts/full_match/137/$A/metadata.json" \
            -o /tmp/meta.json 2>/dev/null || true
          echo "-- sourcify events (if verified) --"
          jq -r '.output.abi[]? | select(.type=="event")
                 | .name + "(" + ([.inputs[].type] | join(",")) + ")"' \
            /tmp/meta.json 2>/dev/null | head -20 || true
          # 2) Empirical: full raw logs of the fill event from the receipt —
          #    topics + data split into 32-byte words. The known RN1 fill
          #    values (asset id, size, price) name each word by inspection.
          for RPC in https://polygon-rpc.com https://1rpc.io/matic; do
            OUT=$(curl -sS --max-time 20 "$RPC" -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getTransactionReceipt\",\"params\":[\"$TX\"]}" 2>/dev/null) || true
            echo "$OUT" | jq -e '.result.logs' >/dev/null 2>&1 && break
          done
          echo "-- raw fill-event logs (topics + data words) --"
          echo "$OUT" | jq -r '.result.logs[]?
              | select(.topics[0] == "0xd543adfd945773f1a62f74f0ee55a5e3b9b1a28262980ba90b1a89f2ea84d8ee")
              | "LOG from \(.address)",
                (.topics | to_entries[] | "  topic\(.key)  \(.value)"),
                (.data[2:] | [scan(".{64}")] | to_entries[]
                 | "  word\(.key)   0x\(.value)")' 2>/dev/null || true
          true

