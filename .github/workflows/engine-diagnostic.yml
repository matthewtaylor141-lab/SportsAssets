              # 30d flow: TRADE + REDEEM cursor windows (proven method)
              flows = {}
              for typ in ("TRADE", "REDEEM"):
                  rows, end, seenk = [], NOW + 60, set()
                  for _ in range(24):
                      try:
                          b = get(f"{DATA}/activity?user={w}&type={typ}"
                                  f"&limit=500&start={T30}&end={end}", 25)
                      except Exception:
                          break
                      if not b:
                          break
                      fresh = 0
                      for r in b:
                          k = (r.get("transactionHash"),
                               r.get("conditionId"),
                               r.get("timestamp"), r.get("usdcSize"))
                          if k in seenk:
                              continue
                          seenk.add(k); rows.append(r); fresh += 1
                      tss = [int(r.get("timestamp") or 0) for r in b]
                      oldest = min(tss) if tss else T30
                      end = oldest if fresh else oldest - 1
                      if len(b) < 500 or end <= T30:
                          break
                      time.sleep(0.05)
                  flows[typ] = rows
              buys = [r for r in flows["TRADE"]
                      if (r.get("side") or "BUY").upper() == "BUY"]
              sells = [r for r in flows["TRADE"]
                       if (r.get("side") or "").upper() == "SELL"]
              staked = sum(float(r.get("usdcSize") or 0) for r in buys)
              sold = sum(float(r.get("usdcSize") or 0) for r in sells)
              payout = sum(float(r.get("usdcSize") or 0)
                           for r in flows["REDEEM"])
              wonm = {r.get("conditionId") for r in flows["REDEEM"]
                      if float(r.get("usdcSize") or 0) > 0}
              bym = {}
              ex = {}
              for r in buys:
                  c = category(r.get("slug"), r.get("title"))
                  m = bym.setdefault(c, {"buys": 0, "staked": 0.0})
                  m["buys"] += 1
                  m["staked"] = round(m["staked"]
                                      + float(r.get("usdcSize") or 0), 2)
                  s = r.get("slug") or r.get("title") or ""
                  b = ex.setdefault(c, {})
                  key = s[:60]
                  if len(b) < 8 and key not in b:
                      b[key] = round(float(r.get("usdcSize") or 0), 2)
              print("NSAUDIT " + json.dumps({"name": d["name"],
                  "wallet": w, "buys_30d": len(buys),
                  "sells_30d": len(sells),
                  "staked_30d": round(staked, 2),
                  "sold_30d": round(sold, 2),
                  "redeems_30d": len(flows["REDEEM"]),
                  "payout_30d": round(payout, 2),
                  "won_markets_30d": len(wonm),
                  "by_cat": bym,
                  "examples": ex}, separators=(",", ":")))
          PY

      - name: BTC 15-min OVER/UNDER census (365d, via runner)
        if: always()
        timeout-minutes: 8
        run: |
          echo "###########################################################"
          echo "#   KXBTC15M SETTLED CENSUS — over vs under                #"
          echo "###########################################################"
          B="https://api.elections.kalshi.com/trade-api/v2"
          MIN_TS=$(( $(date +%s) - 365*86400 ))
          CUR="" ; YES=0 ; NO=0 ; OTHER=0 ; PAGES=0
          EARLIEST="" ; LATEST=""
          while : ; do
            URL="$B/markets?series_ticker=KXBTC15M&status=settled&limit=1000&min_close_ts=$MIN_TS"
            [ -n "$CUR" ] && URL="$URL&cursor=$CUR"
            curl -sS --max-time 25 "$URL" -o /tmp/pg.json || break
            N=$(jq '.markets | length' /tmp/pg.json 2>/dev/null || echo 0)
            [ "$N" = "0" ] || [ -z "$N" ] && break
            Y=$(jq '[.markets[] | select(.result=="yes")] | length' /tmp/pg.json)
            X=$(jq '[.markets[] | select(.result=="no")] | length' /tmp/pg.json)
            O=$(( N - Y - X ))
            YES=$(( YES + Y )); NO=$(( NO + X )); OTHER=$(( OTHER + O ))
            PAGES=$(( PAGES + 1 ))
            PL=$(jq -r '.markets[-1].close_time // ""' /tmp/pg.json)
            PF=$(jq -r '.markets[0].close_time // ""' /tmp/pg.json)
            [ -z "$LATEST" ] && LATEST="$PF"
            EARLIEST="$PL"
            CUR=$(jq -r '.cursor // ""' /tmp/pg.json)
            echo "  page $PAGES: n=$N yes=$Y no=$X (running: $YES/$NO) tail_close=$PL"
            [ -z "$CUR" ] && break
            [ "$PAGES" -ge 60 ] && { echo "  (page cap hit)"; break; }
          done
          TOT=$(( YES + NO ))
          echo ""
          echo "BTCCENSUS pages=$PAGES settled_markets=$(( TOT + OTHER ))"
          echo "BTCCENSUS yes_over=$YES no_under=$NO other=$OTHER"
          if [ "$TOT" -gt 0 ]; then
            PY=$(awk "BEGIN{printf \"%.2f\", $YES*100/$TOT}")
            PN=$(awk "BEGIN{printf \"%.2f\", $NO*100/$TOT}")
            echo "BTCCENSUS pct_over=$PY pct_under=$PN"
          fi
          echo "BTCCENSUS window_earliest=$EARLIEST window_latest=$LATEST"

      # THE REAL EGRESS (2026-08-30). Every gzip+base64 export blob this
      # workflow has ever printed was corrupt: the Actions log masker
      # rewrites registered-secret occurrences to '***', a short secret
      # matches random base64 every few KB, and all four blobs sampled
      # from run 1393 failed gzip decompression. Artifact contents are
      # not masked and carry no line cap, so this is the channel the
      # analysis actually reads. if: always() because a probe step that
      # fails mid-run is exactly when the captured data matters most.
      - name: Upload export artifacts (unmasked — the log blobs are not)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-export
          path: /tmp/export
          if-no-files-found: warn
          retention-days: 14

  btc-calibration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: KXBTC15M taker calibration backtest (price band vs actual win rate)
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse, random

          B = "https://api.elections.kalshi.com/trade-api/v2"

          def get(path, **params):
              url = B + path + "?" + urllib.parse.urlencode(params)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=25) as r:
                          return json.load(r)
                  except Exception as e:
                      if attempt == 2:
                          raise
                      time.sleep(1.5)

          # 1) Every settled market + result (same pager as the census).
          settled, cur = [], ""
          min_ts = int(time.time()) - 365 * 86400
          while True:
              params = dict(series_ticker="KXBTC15M", status="settled",
                            limit=1000, min_close_ts=min_ts)
              if cur:
                  params["cursor"] = cur
              d = get("/markets", **params)
              ms = d.get("markets") or []
              if not ms:
                  break
              for m in ms:
                  if m.get("result") in ("yes", "no"):
                      settled.append((m["ticker"], m["result"]))
              cur = d.get("cursor") or ""
              if not cur:
                  break
          print(f"settled markets with result: {len(settled)}")

          # 2) Stratified sample across the whole window (every k-th).
          k = max(1, len(settled) // 700)
          sample = settled[::k]
          print(f"sampling {len(sample)} markets (every {k}th)")

          # 3) Pull executed trades per market; bucket taker buys by side+band.
          bands = {}   # (side, band_lo) -> [contracts, cost_c, win_contracts]
          got, empty = 0, 0
          for i, (tick, result) in enumerate(sample):
              try:
                  d = get("/markets/trades", ticker=tick, limit=1000)
              except Exception:
                  continue
              trades = d.get("trades") or []
              if not trades:
                  empty += 1
              got += 1
              if got == 1 and trades:
                  print("RAW TRADE SAMPLE:", json.dumps(trades[0])[:500])
              def _num(x):
                  try:
                      return float(x)
                  except (TypeError, ValueError):
                      return 0.0
              for t in trades:
                  side = str(t.get("taker_side") or t.get("side") or "").lower()
                  if side not in ("yes", "no"):
                      continue
                  # Real schema (raw sample 2026-08-06): yes/no_price_dollars
                  # as string dollars, count_fp as string count.
                  px = _num(t.get("yes_price_dollars") if side == "yes"
                            else t.get("no_price_dollars")) * 100
                  if px <= 0:
                      px = _num(t.get("yes_price") if side == "yes"
                                else t.get("no_price"))
                  cnt = int(_num(t.get("count_fp") or t.get("count")
                                 or t.get("quantity")))
                  if px <= 0 or px >= 100 or cnt <= 0:
                      continue
                  band = (int(px) // 5) * 5
                  keyb = (side, band)
                  b = bands.setdefault(keyb, [0, 0.0, 0])
                  b[0] += cnt
                  b[1] += px * cnt
                  if result == side:
                      b[2] += cnt
              if i % 50 == 0:
                  print(f"  ..{i}/{len(sample)} markets, {sum(v[0] for v in bands.values())} contracts")
              time.sleep(0.12)
          print(f"markets fetched: {got} (no-trades: {empty})")

          # 4) Calibration table: implied vs actual, fee-loaded net edge.
          print()
          print("CAL side band  contracts  avg_price_c  actual_win%  gross_edge_c  fee_c  net_edge_c  sigma")
          rows = []
          for (side, band), (cnt, cost, wins) in sorted(bands.items()):
              if cnt < 200:
                  continue
              avg_p = cost / cnt
              win = wins / cnt * 100
              gross = win - avg_p
              p = avg_p / 100
              fee = 7 * p * (1 - p)   # 0.07*p*(1-p) in cents
              net = gross - fee
              se = (p * (1 - p) / cnt) ** 0.5 * 100
              sig = gross / se if se else 0
              rows.append((net, side, band, cnt, avg_p, win, gross, fee, sig))
              print(f"CAL {side:>3} {band:>3}-{band+5:<3} {cnt:>9} {avg_p:>11.2f} {win:>11.2f} {gross:>12.2f} {fee:>6.2f} {net:>10.2f} {sig:>6.1f}")
          rows.sort(reverse=True)
          print()
          for net, side, band, cnt, avg_p, win, gross, fee, sig in rows[:5]:
              print(f"BEST {side} {band}-{band+5}c: net {net:+.2f}c/contract on {cnt} contracts (sigma {sig:.1f})")
          PY

  tennis-desk-census:
    # OWN JOB, like side-truth, and for the same reason: the probe step
    # emits megabytes and GitHub truncates the log after it. This one
    # answers a single question the container cannot ask (the network
    # policy blocks the venue; the runner has open internet).
    #
    # THE QUESTION (owner 2026-08-26): the Kalshi app shows tennis
    # SPREAD with alternate lines (5.5 / 2.5 / 1.5), Set Winner, Total
    # Games and Exact Match Score on a match our desk lists as a plain
    # two-outcome winner board. The desk browses KXATPMATCH and
    # KXWTAMATCH only, so if those derivatives live in their own series
    # the desk cannot see them by construction.
    #
    # The existing census answered a NARROWER question than it looked
    # like it did: `head -80` on the series list cut off before KXATP*,
    # and the tennis loop's `head -25` truncated so hard that
    # KXATPMATCH itself -- a series we KNOW exists -- was missing from
    # its own output. Reading that as 'tennis has no spread series'
    # would have been reading a truncation as a finding.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: TENNIS DESK CENSUS - every tennis series the venue lists
        if: always()
        run: |
          B="https://api.elections.kalshi.com/trade-api/v2"
          curl -sS --max-time 30 "$B/series?category=Sports&limit=1000" \
            -o /tmp/series.json || true
          echo "TDC-TOTAL $(jq -r '.series | length' /tmp/series.json 2>/dev/null)"
          echo ""
          echo "-- EVERY tennis-family series, untruncated --"
          jq -r '.series[]? | "\(.ticker)\t\(.title)"' /tmp/series.json 2>/dev/null \
            | grep -iE 'atp|wta|tennis|challenger' | sort \
            | awk -F'\t' '{printf "  TDC %s | %s\n", $1, $2}' || true
          echo ""
          echo "-- every series whose TITLE names a derivative we need --"
          jq -r '.series[]? | "\(.ticker)\t\(.title)"' /tmp/series.json 2>/dev/null \
            | grep -iE 'spread|total|handicap|games|set ' | sort \
            | awk -F'\t' '{printf "  TDCD %s | %s\n", $1, $2}' | head -60 || true
          echo ""
          echo "-- OPEN EVENTS per tennis series: does it have a live board? --"
          for S in $(jq -r '.series[]?.ticker' /tmp/series.json 2>/dev/null \
                       | grep -iE 'atp|wta|tennis|challenger' | sort); do
            N=$(curl -sS --max-time 15 \
                  "$B/events?series_ticker=$S&status=open&limit=200" \
                  | jq -r '.events | length' 2>/dev/null || echo '?')
            echo "  TDC-OPEN $S open_events=$N"
          done
          echo ""
          echo "-- STRIKE SHAPE: what an alternate line looks like on the wire --"
          echo "   (the desk needs the strike to build a ticket, and the"
          echo "    card builder keys on ticker parts -- so the exact"
          echo "    field names matter, not the shape I would guess)"
          for S in $(jq -r '.series[]?.ticker' /tmp/series.json 2>/dev/null \
                       | grep -iE 'atp|wta' | sort); do
            R=$(curl -sS --max-time 15 \
                  "$B/events?series_ticker=$S&status=open&with_nested_markets=true&limit=1")
            HAS=$(echo "$R" | jq -r '[.events[]?.markets[]?] | length' 2>/dev/null || echo 0)
            [ "$HAS" = "0" ] && continue
            echo "== $S =="
            echo "$R" | jq -c '.events[0] | {event_ticker, title,
              markets: [.markets[]? | {ticker, yes_sub_title, subtitle,
                strike_type, floor_strike, cap_strike, status,
                yes_ask, volume}]}' 2>/dev/null | head -4 || true
          done

  side-truth:
    # OWN JOB (2026-08-24): the probe step emits ~8MB, and GitHub's log
    # API truncates everything after it — the ground-truth answers this
    # build depends on were being cut off mid-run. A separate job keeps
    # this log small enough to always read in full.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: SIDE-TRUTH — is a tennis aec- slug a SIDE or a sideless parent?
        if: always()
        run: |
          pip install --quiet polymarket-us 2>/dev/null || pip install polymarket-us
          echo "###########################################################"
          echo "#   SIDE-TRUTH: the question the resume lever hangs on     #"
          echo "###########################################################"
          # Two different whale picks (Marko Topo, Miguel Damas) resolved
          # to the SAME slug aec-atp-martop-migdam-2026-08-24. Either the
          # venue's side identifiers legitimately differ and we are fine,
          # or that string is a SIDELESS PARENT and ordering it lets the
          # venue choose our side — the 2026-08-23 incident, exactly.
          # Ask the venue directly and print every side verbatim.
          python - <<'PY'
          from polymarket_us import PolymarketUS

          pub = PolymarketUS()
          SLUGS = ["aec-atp-martop-migdam-2026-08-24",
                   "aec-atp-zhizha-reisak-2026-08-24",
                   "aec-wta-eriand-marbol-2026-08-24"]
          for slug in SLUGS:
              try:
                  m = (pub.markets.retrieve_by_slug(slug) or {}).get("market") or {}
              except Exception as e:
                  print(f"SIDE-TRUTH {slug} -> ERR {type(e).__name__}: {str(e)[:100]}")
                  continue
              if not m.get("slug"):
                  print(f"SIDE-TRUTH {slug} -> NOT FOUND")
                  continue
              sides = m.get("marketSides") or []
              print(f"SIDE-TRUTH {slug}")
              print(f"  market.slug={m.get('slug')!r} question={str(m.get('question'))[:70]!r}")
              print(f"  outcome={str(m.get('outcome'))[:40]!r} closed={m.get('closed')} sides={len(sides)}")
              for i, s in enumerate(sides):
                  if isinstance(s, dict):
                      ident = s.get("identifier")
                      print(f"  side[{i}] identifier={str(ident)!r} "
                            f"description={str(s.get('description'))[:40]!r} "
                            f"SAME_AS_MARKET_SLUG={ident == m.get('slug')}")
                      # THE SIDE SELECTOR: both sides of an aec- market
                      # share one identifier, and CreateOrderParams has
                      # no side field — only intent (BUY_LONG vs
                      # BUY_SHORT). These fields are how a side is named.
                      print(f"    long={s.get('long')!r} "
                            f"marketSideType={s.get('marketSideType')!r} "
                            f"id={str(s.get('id'))[:24]!r} "
                            f"team={str(s.get('team'))[:24]!r}")
          # A market family whose sides DO carry distinct identifiers,
          # for contrast (soccer atc-): proves the split is per-family.
          print("SIDE-TRUTH --- contrast: a soccer moneyline board ---")
          try:
              evs = pub.events.list({"limit": 40, "active": True,
                                     "closed": False}) or {}
              evs = evs.get("events") if isinstance(evs, dict) else evs
              for ev in list(evs or []):
                  for m in (ev.get("markets") or []):
                      sides = [s for s in (m.get("marketSides") or [])
                               if isinstance(s, dict)]
                      if len(sides) < 2:
                          continue
                      idents = {s.get("identifier") for s in sides}
                      print(f"  {str(m.get('slug'))[:52]!r} sides={len(sides)} "
                            f"distinct_identifiers={len(idents)} "
                            f"longs={[s.get('long') for s in sides]} "
                            f"types={[str(s.get('marketSideType'))[-12:] for s in sides]}")
                      break
          except Exception as e:
              print(f"  contrast ERR {type(e).__name__}: {str(e)[:100]}")
          PY
