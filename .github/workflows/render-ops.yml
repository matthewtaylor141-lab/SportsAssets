# [R01] see .github/workflows/RENDER_OPS_NOTES.md
name: render-ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options:
          - services      # every service and database, with plan/status
          - events        # a service's recent events (deploys, crashes, OOM)
          - deploys       # a service's recent deploys with status and commit
          - logs          # a service's or database's log lines (arg = minutes back, or a text filter)
          - db            # the database's status, plan, version, disk
          - resume        # confirm=DO
          - suspend       # confirm=DO
          - restart       # confirm=DO
          - deploy        # confirm=DO: deploy the latest commit of the service's branch
          - deploy-api-commit # confirm=DO: arg = 40-hex sha; deploys ONLY sportsassets-api, by commit id. Cannot reach a worker.
          - api-branch-get    # read the branch and autoDeploy of the api and the worker
          - api-branch-set    # confirm=DO: arg = branch; repoints ONLY sportsassets-api
          - metrics       # a service's memory (MB) and CPU per instance over the last N minutes (arg, default 120)
          - sql           # arg = activity | tables | sizes | indexes | analyze (DO) | index053 (DO) | mirror-on (DO) | mirror-off (DO) | mirror-state | pause-on (DO) | pause-off (DO) | pause-state | mirror-preflight | mirror-rearm (DO) | mirror-register (DO) | mirror-frozen | obs-arm-incentive (DO) | obs-incentive | obs-incentive-journal | obs-incentive-markets | obs-incentive-rows[:OFFSET:LIMIT] | evidence-schema (DO) | evidence-inventory | evidence-drop (DO) | cohort-inventory | ingest-latency | train-extract-rn1 | train-extract-ferrari | predict-extract-rn1 | learn-schema (DO) | learn-v2 (DO) | exec-history | ferrari-residual | desk-audit | desk-funnel | desk-schema (DO) | learn-provisional (DO) | desk-live | desk-accounts | desk-recon | src-inventory | src-inventory | mgmt-seeds | learn-inventory | learn-drop (DO)
          - env-keys      # the service's env var KEYS (never values)
          - env-get       # arg = comma-separated OPERATOR FLAGS (LIVE_COPY_HALT, ...); values of flags only
          - env-set       # confirm=DO: arg = KEY=VALUE (value masked in the log; Render redeploys)
          - env-del       # confirm=DO: arg = KEY
          - rootdir-get   # the LIVE build config (rootDir, dockerfilePath) -- read-only
          - rootdir-sync  # confirm=DO: reconcile the live rootDir to what render.yaml declares
      service:
        description: 'Service or database name (sportsassets-api, sportsassets-workers, edge-shadow, sportsassets-db)'
        required: false
        default: 'sportsassets-api'
      arg:
        description: 'logs: minutes back (default 30) or a text filter; sql: which statement'
        required: false
        default: ''
      confirm:
        description: 'Type DO to allow a state-changing action'
        required: false
        default: ''
      render_key:
        description: 'Render API key (only if the RENDER_API_KEY secret is not set)'
        required: false
        default: ''

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          CONFIRM: ${{ inputs.confirm }}
          KEY_SECRET: ${{ secrets.RENDER_API_KEY }}
        run: |
          set +e
          set -u
          # [R02] see .github/workflows/RENDER_OPS_NOTES.md
          ARG="$(jq -r '.inputs.arg // empty' "$GITHUB_EVENT_PATH")"
          KEY_INPUT="$(jq -r '.inputs.render_key // empty' "$GITHUB_EVENT_PATH")"
          [ -n "$KEY_INPUT" ] && echo "::add-mask::$KEY_INPUT"
          if [ "$ACTION" = "env-set" ]; then
            _V="${ARG#*=}"; [ -n "$_V" ] && [ "$_V" != "$ARG" ] && echo "::add-mask::$_V"
          fi
          KEY="$KEY_SECRET"; [ -z "$KEY" ] && KEY="$KEY_INPUT"
          if [ -z "$KEY" ]; then echo "no Render key: set the RENDER_API_KEY secret or pass render_key"; exit 1; fi
          echo "::add-mask::$KEY"
          API=https://api.render.com/v1
          get()  { curl -sS --max-time 45 -H "Authorization: Bearer $KEY" -H "Accept: application/json" "$API$1"; }
          post() { local body="${2:-}"; [ -z "$body" ] && body='{}'
                   curl -sS --max-time 45 -o /tmp/post.json -w '%{http_code}' -X POST \
                        -H "Authorization: Bearer $KEY" -H "Accept: application/json" \
                        -H "Content-Type: application/json" -d "$body" "$API$1"; }
          svc_id() { get "/services?name=$1&limit=20" | jq -r --arg n "$1" '.[]? | select(.service.name==$n) | .service.id' 2>/dev/null | head -1; }
          pg_id()  { get "/postgres?name=$1&limit=20"  | jq -r --arg n "$1" '.[]? | select(.postgres.name==$n) | .postgres.id' 2>/dev/null | head -1; }
          need_confirm() { if [ "$CONFIRM" != "DO" ]; then echo "refused: $ACTION needs confirm=DO (got '$CONFIRM')"; exit 1; fi; }
          echo "action=$ACTION service=$SERVICE arg='$ARG' at $(date -u +%FT%TZ)"

          case "$ACTION" in
            rootdir-get)
              # [R03] see .github/workflows/RENDER_OPS_NOTES.md
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "== live build config for $SERVICE ($ID) =="
              get "/services/$ID" > /tmp/svc.json
              jq -r '.rootDir as $r
                     | .serviceDetails.envSpecificDetails as $e
                     | "LIVE_ROOT_DIR       = \($r // "(unset)")\nDOCKERFILE_PATH     = \($e.dockerfilePath // "(unset)")\nDOCKER_CONTEXT      = \($e.dockerContext // "(unset)")\nBRANCH              = \(.branch // "?")\nAUTO_DEPLOY         = \(.autoDeploy // "?")"' \
                 /tmp/svc.json || { echo "(service read not JSON)"; head -c 600 /tmp/svc.json; }
              ;;
            rootdir-sync)
              # [R04] see .github/workflows/RENDER_OPS_NOTES.md
              need_confirm
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              case "$SERVICE" in
                sportsassets-api|sportsassets-workers) ;;
                *) echo "refused: rootdir-sync is declared for the backend services only"; exit 1 ;;
              esac
              echo "== before =="
              get "/services/$ID" | jq -r '"LIVE_ROOT_DIR = \(.rootDir // "(unset)")  DOCKERFILE_PATH = \(.serviceDetails.envSpecificDetails.dockerfilePath // "(unset)")"'
              BODY='{"rootDir":".","serviceDetails":{"envSpecificDetails":{"dockerfilePath":"./backend/Dockerfile","dockerContext":"."}}}'
              CODE=$(curl -sS --max-time 45 -o /tmp/patch.json -w '%{http_code}' -X PATCH \
                     -H "Authorization: Bearer $KEY" -H "Accept: application/json" \
                     -H "Content-Type: application/json" -d "$BODY" "$API/services/$ID")
              echo "PATCH HTTP $CODE"; head -c 400 /tmp/patch.json 2>/dev/null; echo
              echo "== after =="
              get "/services/$ID" | jq -r '"LIVE_ROOT_DIR = \(.rootDir // "(unset)")  DOCKERFILE_PATH = \(.serviceDetails.envSpecificDetails.dockerfilePath // "(unset)")"'
              ;;
            services)
              echo "== services =="
              get "/services?limit=50" | jq -r '.[]? | .service | "\(.id)  \(.name)  \(.type)  suspended=\(.suspended)  plan=\(.serviceDetails.plan // "?")  branch=\(.branch // "?")  autoDeploy=\(.autoDeploy // "?")"' || echo "(services read failed)"
              echo "== databases =="
              get "/postgres?limit=20" | jq -r '.[]? | .postgres | "\(.id)  \(.name)  status=\(.status)  plan=\(.plan)  v=\(.version)  disk=\(.diskSizeGB // "?")GB  suspended=\(.suspended // "?")"' || echo "(postgres read failed)"
              ;;
            events)
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "== events for $SERVICE ($ID), newest first =="
              get "/services/$ID/events?limit=40" > /tmp/ev.json
              jq -r '.[]? | .event | "\(.timestamp)  \(.type)  \(.details | tostring | .[0:220])"' /tmp/ev.json || { echo "(events not JSON)"; head -c 600 /tmp/ev.json; }
              ;;
            deploys)
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "== deploys for $SERVICE ($ID), newest first =="
              get "/services/$ID/deploys?limit=12" > /tmp/dp.json
              jq -r '.[]? | .deploy | "\(.createdAt) -> \(.finishedAt // "(running)")  \(.status)  \(.commit.id[0:7])  \(.trigger // "")  | \((.commit.message // "") | split("\n")[0] | .[0:80])"' /tmp/dp.json || { echo "(deploys not JSON)"; head -c 600 /tmp/dp.json; }
              ;;
            metrics)
              # [R05] see .github/workflows/RENDER_OPS_NOTES.md
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              MIN=120; [[ "$ARG" =~ ^[0-9]+$ ]] && MIN="$ARG"
              START=$(date -u -d "-${MIN} minutes" +%FT%TZ); END=$(date -u +%FT%TZ)
              RES=60; [ "$MIN" -gt 360 ] && RES=300
              echo "== memory for $SERVICE ($ID) $START .. $END, ${RES}s steps, MB =="
              get "/metrics/memory?resource=$ID&startTime=$START&endTime=$END&resolutionSeconds=$RES" > /tmp/mem.json
              jq -r '.[]? | (.labels // [] | map(.value) | join(",")) as $l | .values[]? | "\(.timestamp)  \((.value / 1048576) | floor)  \($l)"' /tmp/mem.json || { echo "(memory not JSON)"; head -c 800 /tmp/mem.json; }
              echo "== cpu for $SERVICE ($ID), cores =="
              get "/metrics/cpu?resource=$ID&startTime=$START&endTime=$END&resolutionSeconds=$RES" > /tmp/cpu.json
              jq -r '.[]? | .values[]? | "\(.timestamp)  \(.value)"' /tmp/cpu.json || { echo "(cpu not JSON)"; head -c 800 /tmp/cpu.json; }
              ;;
            logs)
              ID=$(svc_id "$SERVICE"); KIND=service
              if [ -z "$ID" ]; then ID=$(pg_id "$SERVICE"); KIND=postgres; fi
              [ -z "$ID" ] && { echo "no service or database named $SERVICE"; exit 1; }
              if [ "$KIND" = service ]; then OWNER=$(get "/services/$ID" | jq -r '.ownerId // empty'); else OWNER=$(get "/postgres/$ID" | jq -r '.ownerId // empty'); fi
              [ -z "$OWNER" ] && { echo "could not read ownerId for $ID"; exit 1; }
              # [R06] see .github/workflows/RENDER_OPS_NOTES.md
              MIN=30; TEXT=""; START=""; END=""; DIR=backward
              if [[ "$ARG" =~ ^([0-9]{2}:[0-9]{2}:[0-9]{2})/([0-9]{2}:[0-9]{2}:[0-9]{2})(\ (.+))?$ ]]; then
                D=$(date -u +%F); START="${D}T${BASH_REMATCH[1]}Z"; END="${D}T${BASH_REMATCH[2]}Z"; DIR=forward
                TEXT="${BASH_REMATCH[4]:-}"
              elif [[ "$ARG" =~ ^[0-9]+$ ]]; then MIN="$ARG"
              elif [ -n "$ARG" ]; then TEXT="$ARG"; MIN=180; fi
              if [ -z "$END" ]; then END=$(date -u +%FT%TZ); START=$(date -u -d "-${MIN} minutes" +%FT%TZ); fi
              Q="/logs?ownerId=$OWNER&resource=$ID&startTime=$START&endTime=$END&limit=100&direction=$DIR"
              [ -n "$TEXT" ] && Q="$Q&text=$(printf '%s' "$TEXT" | jq -sRr @uri)"
              echo "== logs for $SERVICE ($ID) $START .. $END filter='$TEXT' (newest first, max 100) =="
              get "$Q" > /tmp/lg.json
              jq -r '.logs[]? | "\(.timestamp)  \(.message | .[0:400])"' /tmp/lg.json || { echo "(logs not JSON)"; head -c 800 /tmp/lg.json; }
              jq -r '"hasMore=\(.hasMore // "?")"' /tmp/lg.json 2>/dev/null || true
              ;;
            db)
              PG=$(pg_id "$SERVICE"); [ -z "$PG" ] && { echo "no database named $SERVICE"; exit 1; }
              get "/postgres/$PG" | jq '{id, name, status, plan, version, diskSizeGB, highAvailabilityEnabled, suspended, createdAt, updatedAt, expiresAt, ipAllowList}' || echo "(db read failed)"
              ;;
            resume|suspend|restart)
              need_confirm
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "$ACTION -> $SERVICE ($ID)"
              CODE=$(post "/services/$ID/$ACTION"); echo "HTTP $CODE"; head -c 400 /tmp/post.json; echo
              ;;
            deploy)
              need_confirm
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "deploy latest -> $SERVICE ($ID)"
              CODE=$(post "/services/$ID/deploys" '{"clearCache":"do_not_clear"}'); echo "HTTP $CODE"
              jq -r '"deploy \(.id // "?") status=\(.status // "?") commit=\(.commit.id // "?" | .[0:7])"' /tmp/post.json 2>/dev/null || head -c 400 /tmp/post.json
              ;;
            # [R82] API-ONLY RELEASE. See RENDER_OPS_NOTES.md.
            #
            # WHY THIS EXISTS AT ALL. `services` reports that
            # sportsassets-api AND sportsassets-workers both track the
            # branch claude/session-njaewf with autoDeploy=yes. Separate
            # services do NOT give isolation when they share an
            # auto-deploy branch: one push to that branch deploys the web
            # service and RESTARTS THE COLLECTOR, mid-window, losing the
            # connection epoch and writing a PROCESS_REPLACED gap. That
            # has already happened once in this run.
            #
            # A worker deploy has exactly three triggers:
            #   (a) a push to the branch it tracks;
            #   (b) a Blueprint sync, i.e. a render.yaml change on that
            #       branch;
            #   (c) an explicit API call naming the worker's service id.
            #
            # This action does none of them. It pushes nothing, changes
            # no render.yaml, and the service it calls is not a
            # parameter: the name is a literal below, the type is
            # asserted to be web_service, and a worker id cannot be
            # reached through it however `service` is set. `service` is
            # ignored entirely.
            #
            # arg = the 40-character commit to deploy. It need not be on
            # the branch the service tracks -- that is the point: the
            # release rides a commit id, not a push.
            deploy-api-commit)
              need_confirm
              [ "$SERVICE" = "sportsassets-api" ] || echo "note: service='$SERVICE' is IGNORED; this action only ever deploys sportsassets-api"
              case "$ARG" in
                [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) : ;;
                *) echo "refused: deploy-api-commit needs arg = a full 40-hex commit sha (got '$ARG')"; exit 1 ;;
              esac
              API_ID=$(svc_id "sportsassets-api")
              [ -z "$API_ID" ] && { echo "no service named sportsassets-api"; exit 1; }
              API_TYPE=$(get "/services/$API_ID" | jq -r '.type // "?"')
              API_NAME=$(get "/services/$API_ID" | jq -r '.name // "?"')
              if [ "$API_TYPE" != "web_service" ] || [ "$API_NAME" != "sportsassets-api" ]; then
                echo "refused: $API_ID resolves to name=$API_NAME type=$API_TYPE, not the web service"; exit 1
              fi
              WK_ID=$(svc_id "sportsassets-workers")
              echo "-- worker deploys BEFORE (must be unchanged after) --"
              get "/services/$WK_ID/deploys?limit=3" | jq -r '.[]? | .deploy | "  \(.id) \(.status) \(.commit.id // "?" | .[0:7]) \(.createdAt)"'
              echo "deploy commit $ARG -> sportsassets-api ($API_ID), web service, by commit id"
              CODE=$(post "/services/$API_ID/deploys" "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$ARG\"}"); echo "HTTP $CODE"
              jq -r '"deploy \(.id // "?") status=\(.status // "?") commit=\(.commit.id // "?" | .[0:7])"' /tmp/post.json 2>/dev/null || head -c 400 /tmp/post.json
              echo "-- worker deploys AFTER --"
              get "/services/$WK_ID/deploys?limit=3" | jq -r '.[]? | .deploy | "  \(.id) \(.status) \(.commit.id // "?" | .[0:7]) \(.createdAt)"'
              ;;
            # [R83] The API service's OWN tracked branch, read and set.
            # Pointing the web service at its own branch is what ends the
            # shared-branch coupling for good: after it, a command-centre
            # push can never reach the collector because the collector
            # does not watch that branch. Like the action above, the
            # service is a literal and a worker cannot be named.
            api-branch-get)
              API_ID=$(svc_id "sportsassets-api")
              get "/services/$API_ID" | jq -r '"sportsassets-api \(.id) branch=\(.branch // "?") autoDeploy=\(.autoDeploy // "?")"'
              WK_ID=$(svc_id "sportsassets-workers")
              get "/services/$WK_ID" | jq -r '"sportsassets-workers \(.id) branch=\(.branch // "?") autoDeploy=\(.autoDeploy // "?")"'
              ;;
            api-branch-set)
              need_confirm
              [ -n "$ARG" ] || { echo "refused: api-branch-set needs arg = the branch name"; exit 1; }
              API_ID=$(svc_id "sportsassets-api")
              API_TYPE=$(get "/services/$API_ID" | jq -r '.type // "?"')
              [ "$API_TYPE" = "web_service" ] || { echo "refused: sportsassets-api resolves to type=$API_TYPE"; exit 1; }
              WK_BEFORE=$(get "/services/$(svc_id sportsassets-workers)" | jq -r '.branch // "?"')
              echo "sportsassets-api branch -> $ARG (worker stays on $WK_BEFORE)"
              CODE=$(curl -sS --max-time 45 -o /tmp/post.json -w '%{http_code}' -X PATCH \
                     -H "Authorization: Bearer $KEY" -H "Accept: application/json" \
                     -H "Content-Type: application/json" -d "{\"branch\":\"$ARG\"}" "$API/services/$API_ID")
              echo "HTTP $CODE"
              get "/services/$API_ID" | jq -r '"now: sportsassets-api branch=\(.branch // "?") autoDeploy=\(.autoDeploy // "?")"'
              get "/services/$(svc_id sportsassets-workers)" | jq -r '"now: sportsassets-workers branch=\(.branch // "?") autoDeploy=\(.autoDeploy // "?")"'
              ;;
            sql)
              PG=$(pg_id "$SERVICE"); [ -z "$PG" ] && { echo "no database named $SERVICE"; exit 1; }
              case "$ARG" in
                src-inventory) SQL="SELECT 'trades (cohort fills, PM global)' src, count(*) rows, count(DISTINCT condition_id) subjects, min(ts)::date lo, max(ts)::date hi FROM trades UNION ALL SELECT 'bettor_state_observations (EV adapter, PMUS)', count(*), count(DISTINCT market_id), min(observed_at)::date, max(observed_at)::date FROM bettor_state_observations UNION ALL SELECT 'bettor_experimental_observations (X lane, PMUS)', count(*), count(DISTINCT symbol), min(observed_at)::date, max(observed_at)::date FROM bettor_experimental_observations UNION ALL SELECT 'price_path', count(*), 0, NULL, NULL FROM price_path UNION ALL SELECT 'mirror_books', count(*), count(DISTINCT condition_id), NULL, NULL FROM mirror_books UNION ALL SELECT 'live_orders (our order records)', count(*), 0, NULL, NULL FROM live_orders UNION ALL SELECT 'engine_fills (our executions)', count(*), 0, NULL, NULL FROM engine_fills UNION ALL SELECT 'shadow_executions', count(*), 0, NULL, NULL FROM shadow_executions UNION ALL SELECT 'markets resolved with payout', count(*), count(DISTINCT condition_id), NULL, NULL FROM markets WHERE resolved AND resolved_prices IS NOT NULL ORDER BY 1; SELECT 'state_obs' src, n_samples, count(*) subjects FROM (SELECT market_id, count(*) n_samples FROM bettor_state_observations WHERE market_id IS NOT NULL GROUP BY 1) a GROUP BY 1,2 ORDER BY 2 LIMIT 6; SELECT 'exp_obs' src, n_samples, count(*) subjects FROM (SELECT symbol, count(*) n_samples FROM bettor_experimental_observations GROUP BY 1) b GROUP BY 1,2 ORDER BY 2 DESC LIMIT 8;"; TO=240000 ;;
                mgmt-seeds) SQL="WITH t30 AS (SELECT whale_id, condition_id, outcome_index FROM trades WHERE ts > now() - interval '30 days' AND condition_id IS NOT NULL), g AS (SELECT t.whale_id, t.condition_id, count(*) n_trades, count(DISTINCT t.outcome_index) legs FROM t30 t WHERE EXISTS (SELECT 1 FROM markets m WHERE m.condition_id = t.condition_id AND m.resolved AND m.resolved_prices IS NOT NULL) GROUP BY 1,2) SELECT count(*) FILTER (WHERE n_trades >= 2) seed_candidates, count(*) FILTER (WHERE n_trades >= 2 AND legs >= 2) both_legs, count(*) FILTER (WHERE n_trades >= 3) with_3plus, count(*) all_pairs, sum(n_trades) trades_covered FROM g; SELECT resolved_prices::text payout, count(*) n FROM markets WHERE resolved AND resolved_prices IS NOT NULL GROUP BY 1 ORDER BY 2 DESC LIMIT 5;"; TO=240000 ;;
                activity) SQL="SELECT pid, state, wait_event_type, wait_event, now()-query_start AS age, left(query,90) AS q FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() ORDER BY query_start NULLS LAST;"; TO=30000 ;;
                tables)   SQL="SELECT relname, n_live_tup, n_dead_tup, seq_scan, idx_scan, last_analyze, last_autoanalyze, last_autovacuum FROM pg_stat_user_tables ORDER BY n_live_tup DESC LIMIT 30;"; TO=30000 ;;
                sizes)    SQL="SELECT relname, pg_size_pretty(pg_total_relation_size(relid)) AS total, pg_size_pretty(pg_relation_size(relid)) AS heap FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 20;"; TO=60000 ;;
                indexes)  SQL="SELECT i.relname AS tbl, i.indexrelname AS idx, i.idx_scan, pg_size_pretty(pg_relation_size(i.indexrelid)) AS size, ix.indisvalid FROM pg_stat_user_indexes i JOIN pg_index ix ON ix.indexrelid=i.indexrelid ORDER BY pg_relation_size(i.indexrelid) DESC LIMIT 40;"; TO=60000 ;;
                analyze)  need_confirm; SQL="ANALYZE VERBOSE;"; TO=1500000 ;;
                index053) need_confirm; SQL="CREATE INDEX CONCURRENTLY IF NOT EXISTS copy_probes_probe_at_idx ON copy_probes (probe_at);"; TO=2400000 ;;
                # [R07] see .github/workflows/RENDER_OPS_NOTES.md
                mirror-on)  need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('mirror_live', 'true'::jsonb) ON CONFLICT (key) DO UPDATE SET value = 'true'::jsonb; SELECT key, value FROM ingestion_state WHERE key LIKE 'mirror_%' ORDER BY key;"; TO=30000 ;;
                mirror-off) need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('mirror_live', 'false'::jsonb) ON CONFLICT (key) DO UPDATE SET value = 'false'::jsonb; SELECT key, value FROM ingestion_state WHERE key LIKE 'mirror_%' ORDER BY key;"; TO=30000 ;;
                mirror-state) SQL="SELECT key, value FROM ingestion_state WHERE key LIKE 'mirror_%' ORDER BY key;"; TO=30000 ;;
                # [R08] see .github/workflows/RENDER_OPS_NOTES.md
                pause-on)   need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('live_trading_paused', 'true'::jsonb) ON CONFLICT (key) DO UPDATE SET value = 'true'::jsonb; SELECT key, value, pg_typeof(value) AS type FROM ingestion_state WHERE key = 'live_trading_paused';"; TO=30000 ;;
                pause-off)  need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('live_trading_paused', 'false'::jsonb) ON CONFLICT (key) DO UPDATE SET value = 'false'::jsonb; SELECT key, value, pg_typeof(value) AS type FROM ingestion_state WHERE key = 'live_trading_paused';"; TO=30000 ;;
                pause-state) SQL="SELECT coalesce((SELECT value::text FROM ingestion_state WHERE key = 'live_trading_paused'), 'ROW ABSENT -- _is_paused() returns False -- NOT PAUSED') AS live_trading_paused;"; TO=30000 ;;
                # [R12] BETTOR observation stop control. NOT A TRADING SWITCH:
                # it governs one decision-only loop that holds no order path.
                # The loop re-reads this row every 30s and FAILS CLOSED, so
                # obs-stop takes effect without a deploy or a restart.
                obs-state) SQL="SELECT coalesce((SELECT value::text FROM ingestion_state WHERE key = 'bettor_live_observation'), 'ROW ABSENT -- absence is not permission -- NOT OBSERVING') AS bettor_live_observation;"; TO=30000 ;;
                obs-stop)  need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('bettor_live_observation', 'false'::jsonb) ON CONFLICT (key) DO UPDATE SET value = 'false'::jsonb; SELECT key, value FROM ingestion_state WHERE key = 'bettor_live_observation';"; TO=30000 ;;
                obs-run)   need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('bettor_live_observation', 'true'::jsonb) ON CONFLICT (key) DO UPDATE SET value = 'true'::jsonb; SELECT key, value FROM ingestion_state WHERE key = 'bettor_live_observation';"; TO=30000 ;;
                obs-rows)  SQL="SELECT 'journal' AS t, count(*) AS n, max(decided_at)::text AS newest FROM bettor_live_journal UNION ALL SELECT 'cursor', count(*), max(last_seen_at)::text FROM bettor_live_cursor UNION ALL SELECT 'ledger', count(*), max(saved_at)::text FROM bettor_live_ledger;"; TO=60000 ;;
                # [R13] The probe's LIFETIME budget: 40 distinct markets and a
                # 30-minute absolute deadline, held in the database so neither
                # resets when the supervisor restarts the loop. obs-arm opens
                # it; the loop decrements it and DISARMS the control at expiry.
                obs-budget) SQL="SELECT coalesce((SELECT jsonb_pretty(value) FROM ingestion_state WHERE key = 'bettor_live_probe_state'), 'ROW ABSENT -- a probe without a declared budget does not run') AS bettor_live_probe_state;"; TO=30000 ;;
                # [R15] READ-ONLY. How the last run ENDED, written by the
                # process that closed the socket. Stop latency was previously
                # argued from the ABSENCE of new journal rows, which a quiet
                # market produces just as well; this carries the positive
                # facts -- last frame, stop requested, socket closed -- so the
                # latency is a subtraction rather than an inference.
                obs-stop-receipt) SQL="SELECT coalesce((SELECT jsonb_pretty(value) FROM ingestion_state WHERE key = 'bettor_live_stop_receipt'), 'ROW ABSENT -- no run has ended under this build') AS bettor_live_stop_receipt;"; TO=30000 ;;
                # [R15] READ-ONLY LIVENESS, for deciding WHEN to issue
                # obs-stop. "Waking later and refusing does not substitute for
                # measuring stop latency during active work" -- so the stop is
                # issued on an OBSERVED condition rather than on a guess about
                # timing.
                #
                # THE TRIGGER IS THE SOCKET, NOT THE HTTP COUNTERS:
                #   journal_rows_last_60s > 0  and  journal_age_s < 60
                # Requiring the budget counters to be RISING as well would
                # make the stop test impossible once the acquisition
                # allowance is spent -- which it is, within the first few
                # minutes of a 40-market probe -- and would tempt an operator
                # into spending requests purely to manufacture a window.
                #
                # WHAT A FRESH ROW DOES AND DOES NOT ESTABLISH. It shows that
                # a frame was received, parsed and decided RECENTLY. It does
                # NOT show the socket is open at the instant of reading: the
                # connection could have dropped in between, and the worker
                # would reconnect (a new epoch) or sit disconnected while the
                # last rows still look fresh. So the row's OWN IDENTITY is
                # reported beside it -- newest_boot_id and newest_stream_epoch
                # -- and the operator must confirm they match the RUNNING
                # process and the ARMED probe before issuing the stop.
                # Whether the connection was in fact open is settled
                # RETROSPECTIVELY by obs-stop-receipt, which carries the
                # epoch, the frame count and the close verdict from the
                # process that did the closing.
                #
                # The counters are still reported, for the SEPARATE question
                # of whether acquisition happened to be active at stop time.
                # If it was, assert them unchanged at T+58 s; if it was not,
                # record acquisition cessation as NOT EXERCISED THIS RUN
                # rather than as a pass.
                #
                # NOTE ON COLUMNS, read from the deployed DDL rather than
                # assumed: bettor_live_journal.decided_at is TEXT (the
                # worker's own ISO stamp) and cannot be subtracted from now();
                # written_at is the TIMESTAMPTZ the database set, and is the
                # right clock for "is it writing right now". The JSONB column
                # is `record`, not `payload`.
                obs-live) SQL="SELECT 'journal_rows' AS what, count(*)::text AS v FROM bettor_live_journal UNION ALL SELECT 'journal_newest_written_at', coalesce(max(written_at)::text,'none') FROM bettor_live_journal UNION ALL SELECT 'journal_age_s', coalesce(round(extract(epoch FROM now() - max(written_at))::numeric, 1)::text, 'none') FROM bettor_live_journal UNION ALL SELECT 'journal_rows_last_60s', count(*)::text FROM bettor_live_journal WHERE written_at > now() - interval '60 seconds' UNION ALL SELECT 'observation_only_rows', count(*)::text FROM bettor_live_journal WHERE record->>'observation_basis' = 'OBSERVATION_ONLY' UNION ALL SELECT 'strategy_admitted_rows', count(*)::text FROM bettor_live_journal WHERE record->>'observation_basis' = 'STRATEGY_ADMITTED' UNION ALL SELECT 'distinct_markets_seen', count(DISTINCT market_id)::text FROM bettor_live_journal UNION ALL SELECT 'newest_boot_id', coalesce((SELECT boot_id FROM bettor_live_journal ORDER BY written_at DESC, id DESC LIMIT 1), 'none') UNION ALL SELECT 'newest_stream_epoch', coalesce((SELECT record->>'stream_epoch' FROM bettor_live_journal ORDER BY written_at DESC, id DESC LIMIT 1), 'none') UNION ALL SELECT 'armed_probe_id', coalesce((SELECT value->>'probe_id' FROM ingestion_state WHERE key = 'bettor_live_probe_state'), 'none') UNION ALL SELECT 'bbo_attempts_reserved', coalesce((SELECT value->>'bbo_attempts_reserved' FROM ingestion_state WHERE key = 'bettor_live_probe_state'), 'none') UNION ALL SELECT 'listing_attempts_reserved', coalesce((SELECT value->>'listing_attempts_reserved' FROM ingestion_state WHERE key = 'bettor_live_probe_state'), 'none') UNION ALL SELECT 'distinct_reserved', coalesce((SELECT value->>'distinct_reserved' FROM ingestion_state WHERE key = 'bettor_live_probe_state'), 'none') UNION ALL SELECT 'observation_control', coalesce((SELECT value::text FROM ingestion_state WHERE key = 'bettor_live_observation'), 'ROW ABSENT -- NOT OBSERVING');"; TO=30000 ;;
                # [R14] READ-ONLY schema metadata. On 2026-09-22 a reservation
                # UPDATE named ingestion_state.updated_at, a column that does
                # not exist, and every local fixture had CREATEd the table
                # itself with that column invented -- so nothing local could
                # contradict it. This case reads what PRODUCTION actually has,
                # plus the applied migration list, so the comparison is against
                # the deployed schema rather than against an assumption about
                # which migrations describe it.
                obs-schema) SQL="SELECT ordinal_position AS pos, column_name, data_type, is_nullable, coalesce(column_default,'-') AS dflt FROM information_schema.columns WHERE table_schema='public' AND table_name='ingestion_state' ORDER BY ordinal_position; SELECT count(*) AS applied, min(version) AS first, max(version) AS last FROM schema_migrations;"; TO=30000 ;;
                obs-arm)   need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('bettor_live_probe_state', jsonb_build_object('probe_id', gen_random_uuid()::text, 'started_at', to_char(now() AT TIME ZONE 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS+00:00'), 'deadline_at', to_char((now() + interval '30 minutes') AT TIME ZONE 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS+00:00'), 'max_distinct', 40, 'max_bbo_attempts', 160, 'max_listing_attempts', 18, 'distinct_reserved', 0, 'bbo_attempts_reserved', 0, 'listing_attempts_reserved', 0, 'slugs', '[]'::jsonb)) ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value; SELECT jsonb_pretty(value) FROM ingestion_state WHERE key = 'bettor_live_probe_state';"; TO=30000 ;;
                # [R77] INCENTIVE OBSERVATION ARM. Two differences from
                # obs-arm, and both matter.
                #
                # 1. It declares the EIGHT-REQUEST allowance as three
                #    sub-caps summing to eight, so the numbers approved
                #    are the numbers `reserve()` enforces.
                # 2. IT ZEROES THE GENERAL ACQUISITION CAPS. This is the
                #    structural half of the rollback guard. Removing
                #    BETTOR_INCENTIVE_MANIFEST returns main() to the
                #    general loop, and if the observation control were
                #    still true that loop would begin DISCOVERY -- six
                #    listing pages and up to 1,680 BBO reads. With
                #    max_distinct = 0 the budget reads BUDGET_EXHAUSTED
                #    before a client is ever constructed, so the general
                #    loop polls at one database read and issues NOTHING.
                #    Configuration removal is still not a stop; this is
                #    what makes a mistaken one harmless.
                #
                # The deadline is 26 hours: long enough for a 25-hour ET
                # date plus arming slack, and still a deadline.
                obs-arm-incentive) need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('bettor_live_probe_state', jsonb_build_object('probe_id', gen_random_uuid()::text, 'started_at', to_char(now() AT TIME ZONE 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS+00:00'), 'deadline_at', to_char((now() + interval '26 hours') AT TIME ZONE 'UTC','YYYY-MM-DD\"T\"HH24:MI:SS+00:00'), 'max_distinct', 0, 'max_bbo_attempts', 0, 'max_listing_attempts', 0, 'distinct_reserved', 0, 'bbo_attempts_reserved', 0, 'listing_attempts_reserved', 0, 'max_incentive_manifest', 4, 'max_incentive_recheck', 2, 'max_incentive_retry', 2, 'incentive_manifest_reserved', 0, 'incentive_recheck_reserved', 0, 'incentive_retry_reserved', 0, 'max_socket_connect', 20, 'max_socket_subscribe', 40, 'socket_connect_reserved', 0, 'socket_subscribe_reserved', 0, 'slugs', '[]'::jsonb)) ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value; SELECT jsonb_pretty(value) FROM ingestion_state WHERE key = 'bettor_live_probe_state';"; TO=30000 ;;
                # [R78] The incentive allowance, read-only: what the row
                # says was RESERVED, which is the authoritative count.
                obs-incentive) SQL="SELECT coalesce((SELECT value::text FROM ingestion_state WHERE key = 'bettor_live_observation'), 'ROW ABSENT -- NOT OBSERVING') AS control, (SELECT (value->>'incentive_manifest_reserved')::int FROM ingestion_state WHERE key = 'bettor_live_probe_state') AS manifest_used, (SELECT (value->>'incentive_recheck_reserved')::int FROM ingestion_state WHERE key = 'bettor_live_probe_state') AS recheck_used, (SELECT (value->>'incentive_retry_reserved')::int FROM ingestion_state WHERE key = 'bettor_live_probe_state') AS retry_used, (SELECT (COALESCE((value->>'incentive_manifest_reserved')::int,0) + COALESCE((value->>'incentive_recheck_reserved')::int,0) + COALESCE((value->>'incentive_retry_reserved')::int,0)) FROM ingestion_state WHERE key = 'bettor_live_probe_state') AS http_total_used, (SELECT (value->>'max_distinct')::int FROM ingestion_state WHERE key = 'bettor_live_probe_state') AS general_max_distinct, (SELECT (value->>'socket_connect_reserved')::int FROM ingestion_state WHERE key = 'bettor_live_probe_state') AS sock_connects, (SELECT (value->>'socket_subscribe_reserved')::int FROM ingestion_state WHERE key = 'bettor_live_probe_state') AS sock_subs, (SELECT value->>'deadline_at' FROM ingestion_state WHERE key = 'bettor_live_probe_state') AS deadline_at, (SELECT value->>'boots' FROM ingestion_state WHERE key = 'bettor_incentive_run') AS boots, (SELECT value->>'reconnects' FROM ingestion_state WHERE key = 'bettor_incentive_run') AS run_reconnects, (SELECT value->>'resubscribes' FROM ingestion_state WHERE key = 'bettor_incentive_run') AS run_resubscribes; SELECT CASE WHEN to_regclass('public.bettor_incentive_journal') IS NULL THEN 'no journal table yet -- no run has started' ELSE 'journal table present' END AS journal;"; TO=30000 ;;
                # [R79] The journal itself. SEPARATE from obs-incentive
                # because the table does not exist until the first run
                # creates it, and a status read that errors before the
                # run has started looks like a failure when it is not.
                obs-incentive-journal) SQL="SELECT kind, count(*) AS rows, min(to_timestamp(at))::timestamptz(0) AS first, max(to_timestamp(at))::timestamptz(0) AS last, count(DISTINCT boot_id) AS boots, count(DISTINCT run_id) AS runs FROM bettor_incentive_journal GROUP BY kind ORDER BY kind; SELECT boot_id, count(*) AS rows, min(to_timestamp(at))::timestamptz(0) AS first, max(to_timestamp(at))::timestamptz(0) AS last FROM bettor_incentive_journal GROUP BY boot_id ORDER BY 3; SELECT payload->>'why' AS gap_why, payload->>'from' AS gap_from, payload->>'to' AS gap_to, payload->>'duration_s' AS duration_s FROM bettor_incentive_journal WHERE kind = 'GAP' AND payload ? 'from' ORDER BY at DESC LIMIT 20;"; TO=30000 ;;
                # [R16] READ-ONLY PER-MARKET DEPTH. `obs-incentive-journal`
                # counts rows by KIND, which answers "is anything arriving"
                # and not "which of the twelve markets is arriving, and did
                # the frame carry a BOOK or just a heartbeat". Those are the
                # two facts the coverage report is made of, so they get their
                # own statement rather than being eyeballed from a total.
                #
                # frames_in_window is counted against the FIXED ET window
                # [2026-09-23T04:00:00Z, 2026-09-24T04:00:00Z) so that early
                # operational frames can never be folded into the measured
                # day. SELECT only.
                obs-incentive-markets) SQL="SELECT slug, count(*) AS frames, count(*) FILTER (WHERE jsonb_array_length(COALESCE(payload->'bids','[]'::jsonb)) > 0 OR jsonb_array_length(COALESCE(payload->'offers','[]'::jsonb)) > 0) AS with_depth, max(jsonb_array_length(COALESCE(payload->'bids','[]'::jsonb))) AS max_bid_levels, max(jsonb_array_length(COALESCE(payload->'offers','[]'::jsonb))) AS max_ask_levels, min(to_timestamp(at))::timestamptz(0) AS first, max(to_timestamp(at))::timestamptz(0) AS last FROM bettor_incentive_journal WHERE kind = 'LADDER' GROUP BY slug ORDER BY slug; SELECT count(DISTINCT slug) AS markets_receiving, count(DISTINCT slug) FILTER (WHERE jsonb_array_length(COALESCE(payload->'bids','[]'::jsonb)) > 0 OR jsonb_array_length(COALESCE(payload->'offers','[]'::jsonb)) > 0) AS markets_with_depth, count(*) AS frames_total, count(*) FILTER (WHERE at >= 1790136000 AND at < 1790222400) AS frames_in_window, count(*) FILTER (WHERE at < 1790136000) AS frames_before_window FROM bettor_incentive_journal WHERE kind = 'LADDER';"; TO=30000 ;;
                # [R80] THE ACTUAL ROWS, READ-ONLY, WITH THE BOOK BODIES
                # ELIDED AND THE REST LOSSLESSLY PACKED.
                #
                # Every figure the command centre displays is computed
                # from (boot_id, at, kind, epoch, slug) and, for a
                # ladder, from how many levels it carried and whether it
                # was that market's INITIAL_LADDER for the epoch. All of
                # that comes back. THE BIDS AND OFFERS DO NOT: no
                # displayed number is computed from a price, and pulling
                # thousands of order books through a workflow log would
                # be neither practical nor evidence of anything more.
                #
                # Four statements. A header naming the boot and slug
                # dictionaries, the time base and the totals; then the
                # non-ladder records with their payloads WHOLE, since
                # there are a handful of them and they carry the gaps,
                # the epochs and the close reasons; then the ladders as
                # one array of fixed-shape tuples, which is what keeps a
                # day of frames to a readable size; and last the control,
                # allowance and run rows, so the whole reading is ONE
                # instant rather than three reads stitched together.
                #
                # arg = obs-incentive-rows[:OFFSET:LIMIT] (ladders only).
                # SELECT only.
                obs-incentive-rows|obs-incentive-rows:*)
                  # `arg` already names the statement, so the page is
                  # appended to it. RANGE reaches SQL, so it is checked
                  # first and may hold nothing but digits and a colon.
                  RANGE="${ARG#obs-incentive-rows}"; RANGE="${RANGE#:}"
                  case "$RANGE" in
                    "") : ;;
                    *[!0-9:]*) echo "refused: obs-incentive-rows page must be OFFSET:LIMIT (digits and one colon), got '$RANGE'"; exit 1 ;;
                  esac
                  HEAD=200000; PFMT="unaligned"
                  SQL="SELECT jsonb_build_object('boots', (SELECT jsonb_agg(boot_id ORDER BY t) FROM (SELECT boot_id, min(at) AS t FROM bettor_incentive_journal GROUP BY boot_id) q), 'slugs', (SELECT jsonb_agg(DISTINCT slug) FROM bettor_incentive_journal WHERE slug IS NOT NULL), 'base_at', (SELECT min(at) FROM bettor_incentive_journal), 'read_at', extract(epoch FROM now()), 'rows_total', (SELECT count(*) FROM bettor_incentive_journal), 'ladders_total', (SELECT count(*) FROM bettor_incentive_journal WHERE kind = 'LADDER'), 'encoding', 'boots ordered by first record, slugs alphabetical. Each ladder is [boot_index, ms_since_base_at, epoch, slug_index, bid_levels, ask_levels, class]; class 0=absent 1=INITIAL_LADDER 2=UPDATE 3=other. BOOK BODIES ARE NOT INCLUDED.')::text AS header; SELECT jsonb_build_object('boot_id', boot_id, 'at', at, 'kind', kind, 'epoch', epoch, 'slug', slug, 'payload', payload)::text AS meta_row FROM bettor_incentive_journal WHERE kind <> 'LADDER' ORDER BY at, id; WITH base AS (SELECT min(at) AS m FROM bettor_incentive_journal), bi AS (SELECT boot_id, (row_number() OVER (ORDER BY min(at))) - 1 AS i FROM bettor_incentive_journal GROUP BY boot_id), si AS (SELECT slug, (row_number() OVER (ORDER BY slug)) - 1 AS i FROM bettor_incentive_journal WHERE slug IS NOT NULL GROUP BY slug), j AS (SELECT * FROM bettor_incentive_journal WHERE kind = 'LADDER' ORDER BY at, id OFFSET COALESCE(NULLIF(split_part('$RANGE', ':', 1), '')::int, 0) LIMIT COALESCE(NULLIF(split_part('$RANGE', ':', 2), '')::int, 200000)) SELECT jsonb_agg(jsonb_build_array(bi.i, round((j.at - base.m) * 1000)::bigint, j.epoch, si.i, jsonb_array_length(COALESCE(j.payload->'bids','[]'::jsonb)), jsonb_array_length(COALESCE(j.payload->'offers','[]'::jsonb)), CASE COALESCE(j.payload->>'ladder_class','') WHEN 'INITIAL_LADDER' THEN 1 WHEN 'UPDATE' THEN 2 WHEN '' THEN 0 ELSE 3 END) ORDER BY j.at, j.id)::text AS ladders FROM j CROSS JOIN base JOIN bi ON bi.boot_id = j.boot_id JOIN si ON si.slug = j.slug; SELECT jsonb_build_object('control', (SELECT value FROM ingestion_state WHERE key = 'bettor_live_observation'), 'probe', (SELECT value FROM ingestion_state WHERE key = 'bettor_live_probe_state'), 'run_row', (SELECT value FROM ingestion_state WHERE key = 'bettor_incentive_run'), 'state_read_at', extract(epoch FROM now()))::text AS state;"; TO=60000 ;;
                # [R84] THE EVIDENCE TABLE. Three statements, one per
                # step of the release, and each is separately runnable.
                #
                # evidence-schema (DO)  create it, then READ BACK the
                #                       columns and indexes. A CREATE
                #                       that returned no error is not
                #                       evidence the table is right;
                #                       the catalog is.
                # evidence-inventory    what is in it, by name and
                #                       version, without bodies.
                # evidence-drop (DO)    the rollback, and it REFUSES
                #                       while rows exist. Published
                #                       evidence is append-only and
                #                       superseded versions are kept on
                #                       purpose; a rollback that could
                #                       erase them would be a worse
                #                       outcome than the thing it undid.
                #                       The API needs no rollback of its
                #                       own here: with the table absent
                #                       it falls back to the working
                #                       tree and says so in provenance.
                evidence-schema) need_confirm; SQL="CREATE TABLE IF NOT EXISTS bettor_evidence_artifact (id BIGSERIAL PRIMARY KEY, name TEXT NOT NULL, kind TEXT NOT NULL, source_sha TEXT NOT NULL, content_type TEXT NOT NULL, digest TEXT NOT NULL, size_bytes INTEGER NOT NULL, body TEXT NOT NULL, published_at DOUBLE PRECISION NOT NULL, note TEXT, attestation JSONB, superseded_by BIGINT); CREATE INDEX IF NOT EXISTS bettor_evidence_artifact_name ON bettor_evidence_artifact (name, published_at DESC); CREATE UNIQUE INDEX IF NOT EXISTS bettor_evidence_artifact_ident ON bettor_evidence_artifact (name, digest); SELECT column_name, data_type, is_nullable FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'bettor_evidence_artifact' ORDER BY ordinal_position; SELECT indexname FROM pg_indexes WHERE tablename = 'bettor_evidence_artifact' ORDER BY indexname;"; TO=60000 ;;
                evidence-inventory) SQL="SELECT name, kind, source_sha, left(digest, 12) AS digest12, size_bytes, to_timestamp(published_at)::timestamptz(0) AS published, superseded_by, left(COALESCE(note,''), 60) AS note FROM bettor_evidence_artifact ORDER BY name, published_at; SELECT count(*) AS versions, count(DISTINCT name) AS artifacts, count(*) FILTER (WHERE superseded_by IS NULL) AS current_versions, pg_size_pretty(pg_total_relation_size('bettor_evidence_artifact')) AS size FROM bettor_evidence_artifact;"; TO=30000 ;;
                evidence-drop) need_confirm; SQL="DO \$\$ DECLARE n bigint; BEGIN IF to_regclass('public.bettor_evidence_artifact') IS NULL THEN RAISE NOTICE 'already absent'; RETURN; END IF; EXECUTE 'SELECT count(*) FROM bettor_evidence_artifact' INTO n; IF n > 0 THEN RAISE EXCEPTION 'refused: % published rows exist; evidence is append-only and is not dropped to roll back code', n; END IF; DROP TABLE bettor_evidence_artifact; END \$\$; SELECT CASE WHEN to_regclass('public.bettor_evidence_artifact') IS NULL THEN 'table absent' ELSE 'table still present' END AS state;"; TO=60000 ;;
                # [R85] COHORT TRAINING-DATA INVENTORY, READ-ONLY.
                # What is actually available to learn from: fills per
                # account, how many distinct markets and active days,
                # the buy/sell split, and the MEDIAN DETECTION LAG --
                # `ts` is when the fill happened, `detected_at` is when
                # our pipeline first saw it, and the gap between them
                # is the ceiling on how fast any model built from this
                # could ever have acted. SELECT only.
                cohort-inventory) SQL="SELECT w.username, count(*) AS fills, count(DISTINCT t.condition_id) AS markets, count(DISTINCT date_trunc('day', t.ts)) AS active_days, min(t.ts)::timestamptz(0) AS first_fill, max(t.ts)::timestamptz(0) AS last_fill, round(sum(t.size * t.price)::numeric, 0) AS gross_usd, count(*) FILTER (WHERE t.side = 'BUY') AS buys, count(*) FILTER (WHERE t.side = 'SELL') AS sells, count(*) FILTER (WHERE t.detected_at IS NOT NULL) AS with_detected_at, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM t.detected_at - t.ts))::numeric, 1) AS median_detect_lag_s, count(DISTINCT t.source) AS sources FROM trades t JOIN whales w ON w.id = t.whale_id GROUP BY w.username ORDER BY count(*) DESC LIMIT 40; SELECT count(*) AS trades_total, count(DISTINCT whale_id) AS whales, min(ts)::timestamptz(0) AS first, max(ts)::timestamptz(0) AS last, count(*) FILTER (WHERE ts > now() - interval '24 hours') AS last_24h, count(*) FILTER (WHERE ts > now() - interval '7 days') AS last_7d FROM trades; SELECT relname, n_live_tup FROM pg_stat_user_tables WHERE relname IN ('trades','shadow_decisions','shadow_positions','shadow_position_events','bettor_experimental_decisions','bettor_experimental_observations','bettor_state_observations','bettor_live_journal','markets','market_starts','price_path','trade_marks','mirror_shadow') ORDER BY n_live_tup DESC;"; TO=120000 ;;
                # [R86] FORWARD INGESTION LAG, SEPARATED FROM BACKFILL.
                # A LIFETIME median mixes two collection modes and is
                # not a latency ceiling: an account whose history was
                # imported months late reads as months slow forever,
                # however fast we see it now. This restricts the sample
                # to fills whose OWN time is inside the last 7 days --
                # which the ts index serves, and which no old backfill
                # can enter -- and reports median, p95, max and the lag
                # histogram PER SOURCE, because chain and poll are
                # different pipelines with different latencies.
                #
                # It also reports DETECTION GAPS. A dead poller and a
                # quiet cohort are identical in `trades`; the longest
                # stretch with nothing detected is what separates them.
                # SELECT only.
                ingest-latency) SQL="WITH f AS (SELECT t.whale_id, t.source, t.ts, t.detected_at, extract(epoch FROM t.detected_at - t.ts) AS lag_s FROM trades t WHERE t.ts >= now() - interval '7 days') SELECT w.username, f.source, count(*) AS fills, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY f.lag_s)::numeric, 1) AS median_lag_s, round(percentile_cont(0.95) WITHIN GROUP (ORDER BY f.lag_s)::numeric, 1) AS p95_lag_s, round(max(f.lag_s)::numeric, 1) AS max_lag_s, round(min(f.lag_s)::numeric, 1) AS min_lag_s, count(*) FILTER (WHERE f.lag_s < 60) AS under_60s, count(*) FILTER (WHERE f.lag_s >= 60 AND f.lag_s < 600) AS under_10m, count(*) FILTER (WHERE f.lag_s >= 600 AND f.lag_s < 86400) AS under_1d, count(*) FILTER (WHERE f.lag_s >= 86400) AS over_1d FROM f JOIN whales w ON w.id = f.whale_id GROUP BY w.username, f.source ORDER BY count(*) DESC LIMIT 60; WITH d AS (SELECT detected_at, lag(detected_at) OVER (ORDER BY detected_at) AS prev FROM trades WHERE ts >= now() - interval '7 days') SELECT round(extract(epoch FROM detected_at - prev)::numeric, 1) AS gap_s, prev::timestamptz(0) AS from_ts, detected_at::timestamptz(0) AS to_ts FROM d WHERE prev IS NOT NULL ORDER BY detected_at - prev DESC LIMIT 12; SELECT date_trunc('hour', ts) AS hour, count(*) AS fills, count(DISTINCT whale_id) AS accounts FROM trades WHERE ts >= now() - interval '48 hours' GROUP BY 1 ORDER BY 1 DESC LIMIT 48;"; TO=120000 ;;
                # [R87] THE TRAINING EXTRACT. READ-ONLY, ONE ACCOUNT.
                # ONE self-contained statement: a CTE does not survive
                # a `;`, and the first version referenced `f` from a
                # previous statement and failed on it.
                #
                # A DETERMINISTIC 1-IN-20 SAMPLE OF CONDITIONS. RN1's
                # ten days is 131,931 fills and 7 MB of log. Sampling
                # CONDITIONS rather than fills keeps whole markets
                # intact, which the event-grouping rule needs, and
                # hashtext makes the same sample come back every time.
                #
                # ALL THREE CLOCKS SURVIVE, as deltas: ts from the
                # window start, detected_at and venue_seen_at from ts.
                # The deltas are transport, not a latency claim -- the
                # reconstruction applies the clock rule.
                train-extract-rn1) HEAD=200000; PFMT="unaligned"
                  SQL="WITH w AS (SELECT id FROM whales WHERE username = 'RN1'), f AS (SELECT t.condition_id, t.outcome_index, t.side, t.price, t.size, extract(epoch FROM t.ts) AS ts, extract(epoch FROM t.detected_at) AS det, extract(epoch FROM t.venue_seen_at) AS vseen, t.source, t.id FROM trades t JOIN w ON w.id = t.whale_id WHERE t.ts >= now() - interval '10 days' AND t.condition_id IS NOT NULL AND abs(hashtext(t.condition_id)) % 20 = 0), b AS (SELECT min(ts) AS t0 FROM f), ci AS (SELECT condition_id, (row_number() OVER (ORDER BY condition_id)) - 1 AS i FROM f GROUP BY condition_id), si AS (SELECT source, (row_number() OVER (ORDER BY source)) - 1 AS i FROM f GROUP BY source) SELECT jsonb_build_object('account', 'RN1', 'window_days', 10, 'sample', '1 in 20 conditions by hashtext', 'read_at', extract(epoch FROM now()), 't0', (SELECT t0 FROM b), 'n', (SELECT count(*) FROM f), 'conditions', (SELECT count(*) FROM ci), 'by_source', (SELECT jsonb_object_agg(source, n) FROM (SELECT source, count(*) AS n FROM f GROUP BY source) q), 'sources', (SELECT jsonb_agg(source ORDER BY i) FROM si), 'encoding', 'each fill is [condition_index, outcome_index, is_sell, price_x10000, size_x100, ts_minus_t0, detected_minus_ts, venue_minus_ts_or_null, source_index]. Times in seconds. condition_index indexes the conditions array; source_index the sources array.', 'conditions_list', (SELECT jsonb_agg(condition_id ORDER BY i) FROM ci), 'fills', (SELECT jsonb_agg(jsonb_build_array(ci.i, f.outcome_index, CASE WHEN f.side = 'BUY' THEN 0 ELSE 1 END, round(f.price * 10000)::int, round(f.size * 100)::bigint, round((f.ts - (SELECT t0 FROM b))::numeric, 3), round((f.det - f.ts)::numeric, 3), CASE WHEN f.vseen IS NULL THEN NULL ELSE round((f.vseen - f.ts)::numeric, 3) END, si.i) ORDER BY f.ts, f.id) FROM f JOIN ci ON ci.condition_id = f.condition_id JOIN si ON si.source = f.source))::text AS extract;"; TO=120000 ;;
                train-extract-ferrari) HEAD=400000; PFMT="unaligned"
                  SQL="WITH w AS (SELECT id FROM whales WHERE lower(address) = '0xfe787d2da716d60e8acff57fb87eb13cd4d10319'), s AS (SELECT t.condition_id FROM trades t JOIN w ON w.id = t.whale_id WHERE t.ts >= now() - interval '60 days' AND t.condition_id IS NOT NULL AND t.outcome_index IN (0,1) AND abs(hashtext(t.condition_id)) % 20 = 0 GROUP BY t.condition_id), f AS (SELECT t.condition_id, t.outcome_index, t.side, t.price, t.size, extract(epoch FROM t.ts) AS ts, extract(epoch FROM t.detected_at) AS det, extract(epoch FROM t.venue_seen_at) AS vseen, t.source, t.id FROM trades t JOIN w ON w.id = t.whale_id JOIN s ON s.condition_id = t.condition_id WHERE t.ts >= now() - interval '60 days'), pri AS (SELECT t.condition_id, COALESCE(sum(t.size) FILTER (WHERE t.outcome_index = 0 AND t.side = 'BUY'), 0) AS q0, COALESCE(sum(t.size) FILTER (WHERE t.outcome_index = 1 AND t.side = 'BUY'), 0) AS q1, count(*) AS n FROM trades t JOIN w ON w.id = t.whale_id JOIN s ON s.condition_id = t.condition_id WHERE t.ts < now() - interval '60 days' GROUP BY t.condition_id), b AS (SELECT min(ts) AS t0 FROM f), ci AS (SELECT condition_id, (row_number() OVER (ORDER BY condition_id)) - 1 AS i FROM f GROUP BY condition_id), si AS (SELECT source, (row_number() OVER (ORDER BY source)) - 1 AS i FROM f GROUP BY source) SELECT jsonb_build_object('account', 'ferrariChampions2026', 'address', '0xfe787d2da716d60e8acff57fb87eb13cd4d10319', 'window_days', 60, 'sample', '1 in 20 conditions by hashtext, then ALL fills of each sampled condition inside the window. Whole markets are kept intact so the pair reconstruction is not cut in half by the sampler.', 'read_at', extract(epoch FROM now()), 't0', (SELECT t0 FROM b), 'n', (SELECT count(*) FROM f), 'conditions', (SELECT count(*) FROM ci), 'by_source', (SELECT jsonb_object_agg(source, n) FROM (SELECT source, count(*) AS n FROM f GROUP BY source) q), 'sources', (SELECT jsonb_agg(source ORDER BY i) FROM si), 'encoding', 'each fill is [condition_index, outcome_index, is_sell, price_x10000, size_x100, ts_minus_t0, detected_minus_ts, venue_minus_ts_or_null, source_index]. Times in seconds.', 'prior_inventory_encoding', 'each entry is [condition_index, qty_outcome0_x100, qty_outcome1_x100, fills] for fills STRICTLY BEFORE the window. A condition ABSENT from this array had no recorded Ferrari fill before the window; trades begins 2026-03-31, so absence is not proof of no position, only of no record.', 'prior_inventory', (SELECT jsonb_agg(jsonb_build_array(ci.i, round(pri.q0 * 100)::bigint, round(pri.q1 * 100)::bigint, pri.n) ORDER BY ci.i) FROM pri JOIN ci ON ci.condition_id = pri.condition_id), 'conditions_list', (SELECT jsonb_agg(condition_id ORDER BY i) FROM ci), 'fills', (SELECT jsonb_agg(jsonb_build_array(ci.i, f.outcome_index, CASE WHEN f.side = 'BUY' THEN 0 ELSE 1 END, round(f.price * 10000)::int, round(f.size * 100)::bigint, round((f.ts - (SELECT t0 FROM b))::numeric, 3), round((f.det - f.ts)::numeric, 3), CASE WHEN f.vseen IS NULL THEN NULL ELSE round((f.vseen - f.ts)::numeric, 3) END, si.i) ORDER BY f.ts, f.id) FROM f JOIN ci ON ci.condition_id = f.condition_id JOIN si ON si.source = f.source))::text AS extract;"; TO=180000 ;;
                ferrari-residual) SQL="WITH w AS (SELECT id FROM whales WHERE lower(address) = '0xfe787d2da716d60e8acff57fb87eb13cd4d10319'), c AS (SELECT DISTINCT t.condition_id FROM trades t JOIN w ON w.id = t.whale_id WHERE t.condition_id IS NOT NULL AND t.outcome_index IN (0,1)) SELECT count(*) AS ferrari_conditions, count(m.condition_id) AS in_markets_table, count(*) FILTER (WHERE m.resolved) AS resolved, count(*) FILTER (WHERE m.resolved AND m.resolved_prices IS NOT NULL) AS with_payouts, count(*) FILTER (WHERE m.condition_id IS NOT NULL AND NOT m.resolved) AS known_unresolved, count(*) FILTER (WHERE m.condition_id IS NULL) AS absent_from_markets FROM c LEFT JOIN markets m ON m.condition_id = c.condition_id; WITH w AS (SELECT id FROM whales WHERE lower(address) = '0xfe787d2da716d60e8acff57fb87eb13cd4d10319'), f AS (SELECT t.condition_id, t.outcome_index AS oi, t.size, t.price FROM trades t JOIN w ON w.id = t.whale_id WHERE t.side = 'BUY' AND t.outcome_index IN (0,1) AND t.condition_id IS NOT NULL), leg AS (SELECT condition_id, COALESCE(sum(size) FILTER (WHERE oi = 0), 0) AS q0, COALESCE(sum(size) FILTER (WHERE oi = 1), 0) AS q1, COALESCE(sum(size * price) FILTER (WHERE oi = 0), 0) AS c0, COALESCE(sum(size * price) FILTER (WHERE oi = 1), 0) AS c1 FROM f GROUP BY condition_id), r AS (SELECT leg.condition_id, LEAST(q0, q1) AS paired, CASE WHEN q0 >= q1 THEN 0 ELSE 1 END AS resid_leg, abs(q0 - q1) AS resid_qty, CASE WHEN q0 >= q1 THEN (CASE WHEN q0 > 0 THEN c0 / q0 ELSE 0 END) ELSE (CASE WHEN q1 > 0 THEN c1 / q1 ELSE 0 END) END AS resid_vwap, m.resolved, m.resolved_prices FROM leg LEFT JOIN markets m ON m.condition_id = leg.condition_id), p AS (SELECT condition_id, resid_qty, resid_vwap, resid_leg, resolved, CASE WHEN resolved AND resolved_prices IS NOT NULL THEN (resolved_prices ->> resid_leg)::numeric ELSE NULL END AS payout FROM r WHERE resid_qty > 0) SELECT count(*) AS residual_conditions, count(*) FILTER (WHERE payout IS NOT NULL) AS settled_known, count(*) FILTER (WHERE payout IS NULL) AS settlement_unknown, round(sum(resid_qty * resid_vwap)::numeric, 0) AS residual_cost_all, round(sum(resid_qty * resid_vwap) FILTER (WHERE payout IS NOT NULL)::numeric, 0) AS residual_cost_settled_known, round(sum(resid_qty * payout) FILTER (WHERE payout IS NOT NULL)::numeric, 0) AS residual_payout, round(sum(resid_qty * (payout - resid_vwap)) FILTER (WHERE payout IS NOT NULL)::numeric, 0) AS residual_pnl, count(*) FILTER (WHERE payout >= 0.5) AS residual_won, count(*) FILTER (WHERE payout < 0.5) AS residual_lost, round(avg(resid_vwap) FILTER (WHERE payout IS NOT NULL)::numeric, 4) AS mean_residual_vwap, round((sum(resid_qty * payout) FILTER (WHERE payout IS NOT NULL) / NULLIF(sum(resid_qty * resid_vwap) FILTER (WHERE payout IS NOT NULL), 0))::numeric, 4) AS payout_over_cost FROM p; WITH w AS (SELECT id FROM whales WHERE lower(address) = '0xfe787d2da716d60e8acff57fb87eb13cd4d10319'), e AS (SELECT t.condition_id, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN w ON w.id = t.whale_id WHERE t.condition_id IS NOT NULL GROUP BY t.condition_id) SELECT count(*) AS conditions_with_resolution, round(percentile_cont(0.05) WITHIN GROUP (ORDER BY extract(epoch FROM (m.resolved_at - e.first_ts)) / 3600.0)::numeric, 2) AS p05_hours, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (m.resolved_at - e.first_ts)) / 3600.0)::numeric, 2) AS median_hours, round(percentile_cont(0.95) WITHIN GROUP (ORDER BY extract(epoch FROM (m.resolved_at - e.first_ts)) / 3600.0)::numeric, 2) AS p95_hours, count(*) FILTER (WHERE m.resolved_at < e.first_ts) AS resolved_before_first_fill FROM e JOIN markets m ON m.condition_id = e.condition_id WHERE m.resolved AND m.resolved_at IS NOT NULL;"; TO=180000 ;;
                desk-audit) SQL="SELECT relname, n_live_tup AS est_rows, coalesce(extract(epoch FROM (now() - greatest(last_autoanalyze, last_analyze)))::int, -1) AS analyze_age_s FROM pg_stat_user_tables WHERE relname IN ('trades','markets','bettor_state_observations','bettor_state_mids','bettor_opportunities','bettor_experimental_decisions','bettor_experimental_positions','bettor_experimental_markouts','bettor_experimental_observations','shadow_decisions','shadow_executions','shadow_positions','shadow_position_events','shadow_market_states','shadow_policy_versions','mirror_orders','live_orders','bettor_live_ledger','bettor_live_journal','bettor_learn_model','bettor_learn_prediction','bettor_incentive_journal') ORDER BY relname; SELECT 'bettor_state_observations' AS src, count(*) AS n, max(observed_at)::timestamptz(0) AS newest, extract(epoch FROM (now() - max(observed_at)))::int AS age_s FROM bettor_state_observations UNION ALL SELECT 'shadow_decisions', count(*), max(decision_ts)::timestamptz(0), extract(epoch FROM (now() - max(decision_ts)))::int FROM shadow_decisions UNION ALL SELECT 'shadow_executions', count(*), max(created_at)::timestamptz(0), extract(epoch FROM (now() - max(created_at)))::int FROM shadow_executions UNION ALL SELECT 'shadow_positions', count(*), max(opened_at)::timestamptz(0), extract(epoch FROM (now() - max(opened_at)))::int FROM shadow_positions UNION ALL SELECT 'bettor_experimental_decisions', count(*), max(feature_asof)::timestamptz(0), extract(epoch FROM (now() - max(feature_asof)))::int FROM bettor_experimental_decisions UNION ALL SELECT 'bettor_experimental_positions', count(*), max(opened_at)::timestamptz(0), extract(epoch FROM (now() - max(opened_at)))::int FROM bettor_experimental_positions ORDER BY 1; SELECT policy_version, model_version, evidence_source, count(*) AS n, min(decision_ts)::timestamptz(0) AS first, max(decision_ts)::timestamptz(0) AS last FROM shadow_decisions GROUP BY 1,2,3 ORDER BY 6 DESC NULLS LAST LIMIT 20; SELECT execution_class, status, count(*) AS n, round(avg(shadow_filled_qty)::numeric,2) AS avg_filled, round(avg(unfilled_qty)::numeric,2) AS avg_unfilled, max(created_at)::timestamptz(0) AS last FROM shadow_executions GROUP BY 1,2 ORDER BY 3 DESC LIMIT 20; SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND (table_name LIKE '%order%' OR table_name LIKE '%learn%' OR table_name LIKE '%quote%') ORDER BY 1;"; TO=180000 ;;
                desk-funnel) SQL="SELECT lane, policy_version, proposed_action, count(*) AS n, max(decision_ts)::timestamptz(0) AS last FROM shadow_decisions WHERE decision_ts >= now() - interval '24 hours' GROUP BY 1,2,3 ORDER BY 4 DESC LIMIT 30; SELECT b.code, count(*) AS n FROM shadow_decisions d, LATERAL jsonb_array_elements(d.blockers) AS e(v), LATERAL (SELECT e.v ->> 'code' AS code) b WHERE d.decision_ts >= now() - interval '24 hours' AND jsonb_typeof(d.blockers) = 'array' GROUP BY 1 ORDER BY 2 DESC LIMIT 20; SELECT lane, count(*) AS decisions_24h, count(*) FILTER (WHERE proposed_action NOT IN ('NO_TRADE','NONE','') AND proposed_action IS NOT NULL) AS actionable, count(*) FILTER (WHERE p_fill IS NOT NULL) AS with_p_fill, count(*) FILTER (WHERE total_action_ev IS NOT NULL) AS with_ev, count(*) FILTER (WHERE jsonb_typeof(spread) IS NOT NULL) AS with_spread, count(*) FILTER (WHERE jsonb_typeof(available_depth) IS NOT NULL) AS with_depth, count(DISTINCT market_id) AS markets FROM shadow_decisions WHERE decision_ts >= now() - interval '24 hours' GROUP BY 1 ORDER BY 2 DESC; SELECT (SELECT count(*) FROM shadow_executions) AS executions, (SELECT count(*) FROM shadow_positions) AS positions, (SELECT count(*) FROM bettor_learn_model) AS models, (SELECT count(*) FROM bettor_learn_prediction) AS predictions, (SELECT count(*) FROM bettor_learn_prediction WHERE outcome IS NOT NULL) AS resolved_predictions;"; TO=120000 ;;
                desk-accounts) SQL="SELECT account_id, status, round(opening_balance,2) opening, opened_at::timestamptz(0), closed_at::timestamptz(0), note FROM bettor_desk_accounts ORDER BY opened_at; SELECT account_id, cursor_event_id, round(cash_usd,2) cash, round(starting_cash_usd,2) start, round(realized_pnl_usd,2) pnl, round(fees_usd,2) fees, updated_at::timestamptz(0) FROM bettor_desk_account_state; SELECT coalesce(account_id,'(UNASSIGNED)') acct, count(*) n, round(sum(cost_basis_usd),2) cost, count(*) FILTER (WHERE qty>0) open FROM bettor_desk_positions GROUP BY 1 ORDER BY 1; SELECT coalesce(account_id,'(UNASSIGNED)') acct, state, count(*) n FROM bettor_desk_orders GROUP BY 1,2 ORDER BY 1,2; SELECT coalesce(account_id,'(UNASSIGNED)') acct, count(*) n, max(at)::timestamptz(0) newest, bool_and(invariant_ok) all_ok FROM bettor_desk_ledger GROUP BY 1 ORDER BY 1; SELECT incident_id, pnl_reliability, measured->>'identity_drift_usd' drift, preserved_counts FROM bettor_desk_incidents; SELECT coalesce(account_id,'(UNASSIGNED)') acct, count(*) fills FROM bettor_desk_fills GROUP BY 1 ORDER BY 1; SELECT account_id, paused, accounting_status, accounting_detail->>'performance_qualification' perf_qual, paused_at::timestamptz(0), last_verified_at::timestamptz(0), left(pause_reason,70) reason FROM bettor_desk_accounts ORDER BY opened_at; SELECT pg_try_advisory_lock(7723901544120031) lock_was_free; SELECT pg_advisory_unlock_all() released; SELECT l.pid, l.classid, l.objid, l.granted, a.application_name, a.state, a.backend_start::timestamptz(0), extract(epoch FROM (now()-a.backend_start))::int backend_age_s FROM pg_locks l LEFT JOIN pg_stat_activity a USING (pid) WHERE l.locktype='advisory' ORDER BY l.pid; SELECT now()::timestamptz(0) server_now, (SELECT max(decided_at)::timestamptz(0) FROM bettor_desk_decisions) last_decision, (SELECT extract(epoch FROM (now()-max(decided_at)))::int FROM bettor_desk_decisions) decision_age_s, (SELECT max(updated_at)::timestamptz(0) FROM bettor_desk_orders) last_order, (SELECT max(updated_at)::timestamptz(0) FROM bettor_desk_positions) last_position, (SELECT max(at)::timestamptz(0) FROM bettor_desk_ledger) last_ledger, (SELECT extract(epoch FROM (now()-max(at)))::int FROM bettor_desk_ledger) ledger_age_s;"; TO=60000 ;;
                desk-recon) SQL="SELECT 'orders_without_decision' k, count(*) n FROM bettor_desk_orders o WHERE o.account_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM bettor_desk_decisions d WHERE d.desk_decision_id=o.desk_decision_id) UNION ALL SELECT 'fills_without_order', count(*) FROM bettor_desk_fills f WHERE f.account_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM bettor_desk_orders o WHERE o.order_id=f.order_id) UNION ALL SELECT 'orders_filled_qty_ne_fills', count(*) FROM (SELECT o.order_id, o.filled_qty::numeric fq, coalesce(sum(f.qty),0)::numeric sf FROM bettor_desk_orders o LEFT JOIN bettor_desk_fills f ON f.order_id=o.order_id WHERE o.account_id IS NOT NULL GROUP BY 1,2 HAVING abs(o.filled_qty::numeric-coalesce(sum(f.qty),0)::numeric)>0.000001) x UNION ALL SELECT 'positions_qty_ne_net_fills', count(*) FROM (SELECT p.condition_id, p.outcome_index, p.qty::numeric pq, coalesce((SELECT sum(CASE WHEN o.side='BUY' THEN f.qty ELSE -f.qty END) FROM bettor_desk_fills f JOIN bettor_desk_orders o ON o.order_id=f.order_id WHERE o.condition_id=p.condition_id AND o.outcome_index=p.outcome_index AND o.account_id=p.account_id),0)::numeric nf FROM bettor_desk_positions p WHERE p.account_id IS NOT NULL) z WHERE abs(pq-nf) > 0.000001 UNION ALL SELECT 'decisions', count(*) FROM bettor_desk_decisions WHERE account_id IS NOT NULL UNION ALL SELECT 'orders', count(*) FROM bettor_desk_orders WHERE account_id IS NOT NULL UNION ALL SELECT 'fills', count(*) FROM bettor_desk_fills WHERE account_id IS NOT NULL UNION ALL SELECT 'consumption', count(*) FROM bettor_desk_consumption WHERE account_id IS NOT NULL ORDER BY 1; SELECT CASE WHEN order_id LIKE '%trade:%' THEN 'EVENT_DERIVED' ELSE 'LEGACY_COUNTER' END shape, count(*) n, min(placed_at)::timestamptz(0) first, max(placed_at)::timestamptz(0) last FROM bettor_desk_orders WHERE account_id IS NOT NULL GROUP BY 1 ORDER BY 1; SELECT CASE WHEN desk_decision_id LIKE '%trade:%' THEN 'EVENT_DERIVED' ELSE 'LEGACY_COUNTER' END shape, count(*) n FROM bettor_desk_decisions WHERE account_id IS NOT NULL GROUP BY 1 ORDER BY 1; SELECT count(*) overdrawn FROM bettor_desk_consumption WHERE consumed_qty > available_qty; SELECT count(*) epochs, min(started_at)::timestamptz(0) first, max(started_at)::timestamptz(0) last FROM bettor_desk_epochs;"; TO=60000 ;;
                desk-live) SQL="SELECT 'decisions' k, count(*) n, max(decided_at)::timestamptz(0) newest, extract(epoch FROM (now()-max(decided_at)))::int age_s FROM bettor_desk_decisions UNION ALL SELECT 'orders', count(*), max(updated_at)::timestamptz(0), extract(epoch FROM (now()-max(updated_at)))::int FROM bettor_desk_orders UNION ALL SELECT 'positions', count(*), max(updated_at)::timestamptz(0), extract(epoch FROM (now()-max(updated_at)))::int FROM bettor_desk_positions UNION ALL SELECT 'ledger', count(*), max(at)::timestamptz(0), extract(epoch FROM (now()-max(at)))::int FROM bettor_desk_ledger ORDER BY 1; SELECT action, count(*) n, min(decided_at)::timestamptz(0) first, max(decided_at)::timestamptz(0) last FROM bettor_desk_decisions GROUP BY 1 ORDER BY 2 DESC; SELECT state, count(*) n FROM bettor_desk_orders GROUP BY 1 ORDER BY 2 DESC; SELECT desk_id, cursor_event_id, round(cash_usd,2) cash, updated_at::timestamptz(0) FROM bettor_desk_state; SELECT at::timestamptz(0), round(cash_usd,2) cash, round(inventory_cost,2) inv, round(realized_pnl_usd,2) pnl, open_orders, open_positions, invariant_ok FROM bettor_desk_ledger ORDER BY at DESC LIMIT 5;"; TO=60000 ;;
                learn-provisional) need_confirm; SQL="UPDATE bettor_learn_prediction SET outcome_source='NEGATIVE_PROVISIONAL_INTERVAL_COMPLETENESS_UNVERIFIED' WHERE outcome=0 AND outcome_source IS NULL; SELECT condition_id,decision_at,outcome,outcome_source,resolved_at FROM bettor_learn_prediction ORDER BY decision_at;"; TO=30000 ;;
                desk-schema) need_confirm; SQL="CREATE TABLE IF NOT EXISTS bettor_desk_state ( desk_id            TEXT PRIMARY KEY, boot_id            TEXT NOT NULL, policy_version     TEXT NOT NULL, model_version      TEXT NOT NULL, cursor_event_id    BIGINT, cash_usd           NUMERIC NOT NULL, starting_cash_usd  NUMERIC NOT NULL, halted             BOOLEAN NOT NULL DEFAULT FALSE, halt_reason        TEXT, started_at         TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at         TIMESTAMPTZ NOT NULL DEFAULT now() ); CREATE TABLE IF NOT EXISTS bettor_desk_decisions ( desk_decision_id   TEXT PRIMARY KEY, desk_id            TEXT NOT NULL, boot_id            TEXT NOT NULL, decided_at         TIMESTAMPTZ NOT NULL, feature_cutoff_at  TIMESTAMPTZ NOT NULL, source_decision_id TEXT, condition_id       TEXT, market_id          TEXT, outcome_index      INTEGER, action             TEXT NOT NULL, reason             TEXT NOT NULL, policy_version     TEXT NOT NULL, model_version      TEXT NOT NULL, proposed_side      TEXT, proposed_price     NUMERIC, proposed_qty       NUMERIC, proposed_expiry_s  INTEGER, inventory          JSONB NOT NULL DEFAULT '{}'::jsonb, ev                 JSONB NOT NULL DEFAULT '{}'::jsonb, risk               JSONB NOT NULL DEFAULT '{}'::jsonb, inputs             JSONB NOT NULL DEFAULT '{}'::jsonb, inputs_sha         TEXT NOT NULL, created_at         TIMESTAMPTZ NOT NULL DEFAULT now() ); CREATE INDEX IF NOT EXISTS bettor_desk_decisions_at_idx ON bettor_desk_decisions (decided_at DESC); CREATE INDEX IF NOT EXISTS bettor_desk_decisions_action_idx ON bettor_desk_decisions (action, decided_at DESC); CREATE UNIQUE INDEX IF NOT EXISTS bettor_desk_decisions_source_idx ON bettor_desk_decisions (desk_id, source_decision_id) WHERE source_decision_id IS NOT NULL; CREATE TABLE IF NOT EXISTS bettor_desk_orders ( order_id           TEXT PRIMARY KEY, desk_id            TEXT NOT NULL, boot_id            TEXT NOT NULL, desk_decision_id   TEXT NOT NULL REFERENCES bettor_desk_decisions (desk_decision_id) ON DELETE RESTRICT, condition_id       TEXT NOT NULL, market_id          TEXT, outcome_index      INTEGER NOT NULL, side               TEXT NOT NULL, intent             TEXT NOT NULL, limit_price        NUMERIC NOT NULL, qty                NUMERIC NOT NULL, filled_qty         NUMERIC NOT NULL DEFAULT 0, notional_committed NUMERIC NOT NULL, avg_fill_price     NUMERIC, fees_usd           NUMERIC NOT NULL DEFAULT 0, state              TEXT NOT NULL, state_reason       TEXT, placed_at          TIMESTAMPTZ, expires_at         TIMESTAMPTZ, terminal_at        TIMESTAMPTZ, created_at         TIMESTAMPTZ NOT NULL DEFAULT now(), updated_at         TIMESTAMPTZ NOT NULL DEFAULT now() ); CREATE INDEX IF NOT EXISTS bettor_desk_orders_open_idx ON bettor_desk_orders (condition_id, outcome_index) WHERE state IN ('RESTING', 'PARTIALLY_FILLED', 'CANCEL_PENDING'); CREATE INDEX IF NOT EXISTS bettor_desk_orders_created_idx ON bettor_desk_orders (created_at DESC); CREATE TABLE IF NOT EXISTS bettor_desk_order_events ( event_id      BIGSERIAL PRIMARY KEY, order_id      TEXT NOT NULL REFERENCES bettor_desk_orders (order_id) ON DELETE CASCADE, at            TIMESTAMPTZ NOT NULL, from_state    TEXT, to_state      TEXT NOT NULL, reason        TEXT, detail        JSONB NOT NULL DEFAULT '{}'::jsonb, created_at    TIMESTAMPTZ NOT NULL DEFAULT now() ); CREATE INDEX IF NOT EXISTS bettor_desk_order_events_order_idx ON bettor_desk_order_events (order_id, event_id); CREATE TABLE IF NOT EXISTS bettor_desk_fills ( fill_id        TEXT PRIMARY KEY, order_id       TEXT NOT NULL REFERENCES bettor_desk_orders (order_id) ON DELETE CASCADE, at             TIMESTAMPTZ NOT NULL, qty            NUMERIC NOT NULL, price          NUMERIC NOT NULL, fee_usd        NUMERIC NOT NULL, liquidity      TEXT NOT NULL, evidence_kind  TEXT NOT NULL, evidence_id    TEXT NOT NULL, evidence_ts    TIMESTAMPTZ NOT NULL, exec_model     TEXT NOT NULL, created_at     TIMESTAMPTZ NOT NULL DEFAULT now() ); CREATE INDEX IF NOT EXISTS bettor_desk_fills_order_idx ON bettor_desk_fills (order_id); CREATE INDEX IF NOT EXISTS bettor_desk_fills_at_idx ON bettor_desk_fills (at DESC); CREATE TABLE IF NOT EXISTS bettor_desk_consumption ( evidence_id    TEXT PRIMARY KEY, evidence_kind  TEXT NOT NULL, evidence_ts    TIMESTAMPTZ NOT NULL, condition_id   TEXT NOT NULL, outcome_index  INTEGER NOT NULL, price          NUMERIC NOT NULL, available_qty  NUMERIC NOT NULL, consumed_qty   NUMERIC NOT NULL DEFAULT 0, updated_at     TIMESTAMPTZ NOT NULL DEFAULT now(), CONSTRAINT bettor_desk_consumption_not_overdrawn CHECK (consumed_qty >= 0 AND consumed_qty <= available_qty) ); CREATE TABLE IF NOT EXISTS bettor_desk_positions ( desk_id           TEXT NOT NULL, condition_id      TEXT NOT NULL, outcome_index     INTEGER NOT NULL, qty               NUMERIC NOT NULL DEFAULT 0, cost_basis_usd    NUMERIC NOT NULL DEFAULT 0, realized_pnl_usd  NUMERIC NOT NULL DEFAULT 0, fees_usd          NUMERIC NOT NULL DEFAULT 0, opened_at         TIMESTAMPTZ, updated_at        TIMESTAMPTZ NOT NULL DEFAULT now(), settled           BOOLEAN NOT NULL DEFAULT FALSE, settled_payout    NUMERIC, settled_at        TIMESTAMPTZ, PRIMARY KEY (desk_id, condition_id, outcome_index) ); CREATE INDEX IF NOT EXISTS bettor_desk_positions_open_idx ON bettor_desk_positions (desk_id) WHERE qty > 0 AND NOT settled; CREATE TABLE IF NOT EXISTS bettor_desk_ledger ( snapshot_id       BIGSERIAL PRIMARY KEY, desk_id           TEXT NOT NULL, boot_id           TEXT NOT NULL, at                TIMESTAMPTZ NOT NULL, cash_usd          NUMERIC NOT NULL, committed_usd     NUMERIC NOT NULL, inventory_cost    NUMERIC NOT NULL, inventory_mark    NUMERIC, mark_basis        TEXT NOT NULL, realized_pnl_usd  NUMERIC NOT NULL, unrealized_pnl_usd NUMERIC, fees_usd          NUMERIC NOT NULL, open_orders       INTEGER NOT NULL, open_positions    INTEGER NOT NULL, invariant_ok      BOOLEAN NOT NULL, invariant_detail  JSONB NOT NULL DEFAULT '{}'::jsonb, created_at        TIMESTAMPTZ NOT NULL DEFAULT now() ); CREATE INDEX IF NOT EXISTS bettor_desk_ledger_at_idx ON bettor_desk_ledger (desk_id, at DESC); SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'bettor_desk%' ORDER BY 1;"; TO=60000 ;;
                # [R89] THE PROSPECTIVE EXTRACT. Same shape as the
                # training one, but SIX HOURS and no sampling -- because
                # a prospective prediction must be made on an entry
                # whose horizon has NOT yet closed, and sampling would
                # throw away most of the few that qualify. SELECT only.
                predict-extract-rn1) HEAD=200000; PFMT="unaligned"
                  SQL="WITH w AS (SELECT id FROM whales WHERE username = 'RN1'), f AS (SELECT t.condition_id, t.outcome_index, t.side, t.price, t.size, extract(epoch FROM t.ts) AS ts, extract(epoch FROM t.detected_at) AS det, extract(epoch FROM t.venue_seen_at) AS vseen, t.source, t.id FROM trades t JOIN w ON w.id = t.whale_id WHERE t.ts >= now() - interval '6 hours' AND t.condition_id IS NOT NULL), b AS (SELECT min(ts) AS t0 FROM f), ci AS (SELECT condition_id, (row_number() OVER (ORDER BY condition_id)) - 1 AS i FROM f GROUP BY condition_id), si AS (SELECT source, (row_number() OVER (ORDER BY source)) - 1 AS i FROM f GROUP BY source) SELECT jsonb_build_object('account','RN1','window_days',0.25,'sample','ALL conditions in the last 6 hours','read_at', extract(epoch FROM now()), 't0', (SELECT t0 FROM b), 'n', (SELECT count(*) FROM f), 'conditions', (SELECT count(*) FROM ci), 'by_source', (SELECT jsonb_object_agg(source,n) FROM (SELECT source,count(*) AS n FROM f GROUP BY source) q), 'sources', (SELECT jsonb_agg(source ORDER BY i) FROM si), 'encoding','same as train-extract-rn1', 'conditions_list', (SELECT jsonb_agg(condition_id ORDER BY i) FROM ci), 'fills', (SELECT jsonb_agg(jsonb_build_array(ci.i, f.outcome_index, CASE WHEN f.side='BUY' THEN 0 ELSE 1 END, round(f.price*10000)::int, round(f.size*100)::bigint, round((f.ts-(SELECT t0 FROM b))::numeric,3), round((f.det-f.ts)::numeric,3), CASE WHEN f.vseen IS NULL THEN NULL ELSE round((f.vseen-f.ts)::numeric,3) END, si.i) ORDER BY f.ts, f.id) FROM f JOIN ci ON ci.condition_id=f.condition_id JOIN si ON si.source=f.source))::text AS extract;"; TO=120000 ;;
                # [R90] THE FIRST MODEL AND ITS FIVE PROSPECTIVE
                # PREDICTIONS, written once. Both INSERTs carry ON
                # CONFLICT DO NOTHING, so re-running this changes
                # nothing -- a prediction is recorded once or not at
                # all, and the unique index refuses a second opinion
                # on the same decision.
                # [R91] THE TARGET-MISMATCH CORRECTION.
                # v1's five predictions were written 796-1361 s after
                # their entries, so they cannot be read as entry-time
