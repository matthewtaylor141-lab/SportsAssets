                tennis-witness=*) if [[ ! "$ARG" =~ ^tennis-witness=([0-9]{4}-[0-9]{2}-[0-9]{2})(:([a-z]+(,[a-z]+)*))?$ ]]; then echo "tennis-witness: arg must be tennis-witness=<YYYY-MM-DD>[:<surname>,<surname>...] (got '$ARG')"; exit 1; fi
                  TD="${BASH_REMATCH[1]}"; TN="${BASH_REMATCH[3]}"; TW="TRUE"
                  if [ -n "$TN" ]; then TW="(lower(event_title) LIKE '%$(printf '%s' "$TN" | sed "s/,/%' OR lower(event_title) LIKE '%/g")%')"; fi
                  SQL="SELECT identifier, left(event_title, 70) AS event_title, left(question, 90) AS question, side_norm, updated_at::timestamp(0) AS upd FROM us_premap WHERE identifier LIKE 'aec-%-$TD%' AND $TW ORDER BY identifier LIMIT 200; SELECT split_part(identifier, '-', 2) AS tour, count(*) AS n, count(DISTINCT event_title) AS matches, min(updated_at)::timestamp(0) AS oldest, max(updated_at)::timestamp(0) AS newest FROM us_premap WHERE identifier LIKE 'aec-%-$TD%' GROUP BY 1 ORDER BY 1;"; TO=30000 ;;
                premap-rows) SQL="SELECT identifier, side_norm, line, intent, question, event_keys FROM us_premap WHERE identifier LIKE 'atc-%' AND (identifier LIKE 'atc-sea-juv-mil-2026-09-06%' OR identifier LIKE 'atc-lal-esp-sev-2026-09-06%' OR identifier LIKE 'atc-els-kbk-tro-2026-09-06%' OR identifier LIKE 'atc-sea-bol-sas-2026-09-06%' OR identifier LIKE 'atc-lpa-ros-new-2026-09-06%') ORDER BY identifier, side_norm; SELECT t.market_slug AS his_slug, max(t.market_title) AS his_title, max(m.title) AS m_title, max(t.event_slug) AS his_event, max(m.event_title) AS m_event_title, max(t.outcome) AS outcome FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.market_slug IN ('sea-juv-mil-2026-09-06-juv', 'lal-esp-sev-2026-09-06-esp', 'nor-kbk-tro-2026-09-06-tro', 'sea-bol-sas-2026-09-06-sas', 'arg-ros-new-2026-09-06-new', 'fl1-olm-pfc-2026-09-06-olm', 'por-gui-cas-2026-09-06-gui') GROUP BY 1; SELECT split_part(identifier, '-', 2) AS lg, count(DISTINCT split_part(identifier, '-', 3) || '-' || split_part(identifier, '-', 4)) AS games FROM us_premap WHERE identifier LIKE 'atc-%-2026-09-06%' GROUP BY 1 ORDER BY 2 DESC LIMIT 40;"; TO=30000 ;;
                # THE DRIFT ON EVERY LIVE BOOK (2026-09-06, owner: "more volume"):
