D b.condition_id = r.condition_id ORDER BY (b.opened_at - interval '120 seconds' <= r.ts AND r.ts < COALESCE(b.closed_at, now())) DESC, b.id DESC LIMIT 1) ax ON true JOIN LATERAL (SELECT min(b.opened_at) AS first_open, max(b.closed_at) AS last_close, bool_or(b.closed_at IS NULL) AS any_live FROM mirror_books b WHERE b.whale = 'rn1' AND b.condition_id = r.condition_id) bw ON true WHERE (r.net_leg OR NOT r.has_net) AND (CASE WHEN r.asset = ax.long_asset THEN 1 WHEN r.asset = ax.other_asset THEN -1 ELSE 0 END) * (CASE WHEN r.side = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN ax.short THEN -1 ELSE 1 END) > 0), s AS (SELECT f.*, fa.name AS fa_name, fa.order_id AS fa_order, fa.book_id AS fa_book, COALESCE(fa.order_id, CASE WHEN COALESCE(x.e->>'order', '') <> '' AND NOT ((x.e->>'order') ~ '[^0-9]') THEN (x.e->>'order')::bigint END) AS aorder, x.e, x.seen_book FROM f LEFT JOIN fa ON fa.fill_id = f.id::text LEFT JOIN LATERAL (SELECT e, b.id AS seen_book FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), o AS (SELECT s.*, ord.id AS oid, ord.book_id AS obook, ord.state AS ostate, ord.tif, ord.reason, ord.filled, ord.qty, ord.placed_at, ord.decision, ord.side AS oside, ord.his_level, ord.bid_at_place, ord.ask_at_place FROM s LEFT JOIN LATERAL (SELECT o.* FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE (s.aorder IS NOT NULL AND o.id = s.aorder) OR (s.aorder IS NULL AND (s.e->>'order') IS NULL AND b.condition_id = s.condition_id AND o.kind IN ('increase', 'take') AND o.placed_at >= s.ts AND o.placed_at < s.ts + interval '120 seconds') ORDER BY o.placed_at LIMIT 1) ord ON true), g AS (SELECT o.*, COALESCE(o.obook, o.fa_book, o.seen_book) AS book, o.size * o.px AS usd, extract(epoch FROM (o.placed_at - o.ts)) AS lag_s, CASE WHEN o.his_level IS NULL THEN NULL WHEN o.oside = 'BUY_LONG' AND o.ask_at_place IS NOT NULL THEN round(((o.ask_at_place::numeric - floor(round((o.his_level * 100)::numeric, 6)) / 100) * 100)::numeric, 1) WHEN o.oside = 'SELL_LONG' AND o.bid_at_place IS NOT NULL THEN round(((ceil(round((o.his_level * 100)::numeric, 6)) / 100 - o.bid_at_place::numeric) * 100)::numeric, 1) END AS band_c, CASE WHEN m.resolved_prices IS NULL OR mt.outcome_index IS NULL THEN NULL WHEN o.short THEN 1 - (m.resolved_prices->>mt.outcome_index)::numeric ELSE (m.resolved_prices->>mt.outcome_index)::numeric END AS payoff, CASE WHEN o.oid IS NOT NULL AND o.filled >= o.qty THEN 'filled' WHEN o.oid IS NOT NULL AND o.filled > 0 THEN 'partial' WHEN o.oid IS NOT NULL AND o.tif = 'IOC' THEN 'missed_expired_ioc' WHEN o.oid IS NOT NULL AND o.ostate = 'cancelled' AND COALESCE(o.reason, '') LIKE '%replace%' THEN 'missed_replace' WHEN o.oid IS NOT NULL THEN 'missed_open' WHEN o.e IS NULL AND o.fa_name IS NULL THEN 'unseen' WHEN o.aorder IS NOT NULL OR (o.e->>'order') IS NOT NULL THEN 'order_row_unread' ELSE 'refused:' || COALESCE(o.fa_name, o.e->>'name', 'unnamed') END AS class FROM o JOIN markets m ON m.condition_id = o.condition_id LEFT JOIN market_tokens mt ON mt.token_id = o.long_asset), fc AS (SELECT x.fill_id, x.cause, x.fast FROM xmltable('/table/row' PASSING (CASE WHEN to_regclass('mirror_fill_answers') IS NULL OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'mirror_fill_answers' AND column_name = 'cause') THEN '<table/>'::xml ELSE query_to_xml('SELECT fill_id, cause, fast FROM mirror_fill_answers WHERE whale = ''rn1'' AND fill_ts >= extract(epoch FROM now() - interval ''25 hours'')', false, false, '') END) COLUMNS fill_id text PATH 'fill_id', cause text PATH 'cause', fast boolean PATH 'fast') x) SELECT COALESCE(fc.cause, 'unrecorded') AS cause, COALESCE(fc.fast::text, 'unrecorded') AS path, count(*) AS n, round(sum(usd)::numeric, 2) AS his_usd, count(payoff) AS n_resolved, round((sum((payoff - px) * size) / NULLIF(sum(CASE WHEN payoff IS NOT NULL THEN usd END), 0))::numeric, 4) AS roi, round((1.96 * stddev_samp((payoff - px) / NULLIF(px, 0)) / sqrt(NULLIF(count(payoff), 0)))::numeric, 4) AS ci95, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_med_s FROM g LEFT JOIN fc ON fc.fill_id = g.id::text WHERE g.class = 'refused:open_order_pending' GROUP BY 1, 2 ORDER BY 4 DESC;"; TO=120000 ;;
                # [R50] see .github/workflows/RENDER_OPS_NOTES.md
                on-target-why) SQL="WITH r AS (SELECT t.id, t.condition_id, t.ts, upper(t.side) AS side, t.asset, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.side, r.size, r.price, r.size * r.price AS usd, r.his_slug FROM r WHERE r.net_leg OR NOT r.has_net), s AS (SELECT f.*, x.e, x.book, x.opened_at, x.flow_base, x.last_plan, x.target_raw, x.ratio, x.his_net, x.ledger_net, x.target FROM f LEFT JOIN LATERAL (SELECT e, b.id AS book, b.opened_at, b.flow_base, b.last_plan, b.target_raw, b.ratio, b.his_net, b.ledger_net, b.target FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), c AS (SELECT s.*, (s.e->>'at')::float8 - extract(epoch FROM s.ts) AS lag_s, CASE WHEN s.ts < s.opened_at - interval '60 seconds' AND COALESCE(s.flow_base, 0) <> 0 THEN 'block' WHEN (s.last_plan->>'game_cap') IS NOT NULL OR (COALESCE(s.last_plan->>'game_room', '') <> '' AND NOT ((s.last_plan->>'game_room') ~ '[^0-9.eE+-]') AND (s.last_plan->>'game_room')::float8 <= 0) THEN 'game_cap' WHEN s.last_plan->'flow_hold' IS NOT NULL AND jsonb_typeof(s.last_plan->'flow_hold') <> 'null' THEN 'flow_hold' WHEN s.target_raw IS NOT NULL AND s.ratio IS NOT NULL AND s.his_net IS NOT NULL AND abs(s.target_raw) < s.ratio * abs(COALESCE(CASE WHEN COALESCE(s.last_plan->>'flow_net', '') <> '' AND NOT ((s.last_plan->>'flow_net') ~ '[^0-9.eE+-]') THEN (s.last_plan->>'flow_net')::float8 END, s.his_net - COALESCE(s.flow_base, 0))) - 0.5 THEN 'stale_snapshot' WHEN COALESCE(s.flow_base, 0) <> 0 AND s.target_raw IS NOT NULL AND s.ratio IS NOT NULL AND s.his_net IS NOT NULL AND abs(s.target_raw) < s.ratio * abs(s.his_net) - 0.5 THEN 'block_flow' ELSE 'unattributed' END AS cause FROM s WHERE s.e IS NOT NULL AND (s.e->>'order') IS NULL AND COALESCE(s.e->>'name', '') = 'on_target') SELECT COALESCE(cause, 'ALL') AS cause, count(*) AS fills, count(DISTINCT condition_id) AS markets, round(sum(usd)::numeric, 2) AS his_usd, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_p90_s FROM c GROUP BY ROLLUP (cause) ORDER BY 4 DESC; WITH r AS (SELECT t.id, t.condition_id, t.ts, upper(t.side) AS side, t.asset, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.side, r.size, r.price, r.size * r.price AS usd, r.his_slug FROM r WHERE r.net_leg OR NOT r.has_net), s AS (SELECT f.*, x.e, x.book, x.opened_at, x.flow_base, x.last_plan, x.target_raw, x.ratio, x.his_net, x.ledger_net, x.target FROM f LEFT JOIN LATERAL (SELECT e, b.id AS book, b.opened_at, b.flow_base, b.last_plan, b.target_raw, b.ratio, b.his_net, b.ledger_net, b.target FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), c AS (SELECT s.*, (s.e->>'at')::float8 - extract(epoch FROM s.ts) AS lag_s, CASE WHEN s.ts < s.opened_at - interval '60 seconds' AND COALESCE(s.flow_base, 0) <> 0 THEN 'block' WHEN (s.last_plan->>'game_cap') IS NOT NULL OR (COALESCE(s.last_plan->>'game_room', '') <> '' AND NOT ((s.last_plan->>'game_room') ~ '[^0-9.eE+-]') AND (s.last_plan->>'game_room')::float8 <= 0) THEN 'game_cap' WHEN s.last_plan->'flow_hold' IS NOT NULL AND jsonb_typeof(s.last_plan->'flow_hold') <> 'null' THEN 'flow_hold' WHEN s.target_raw IS NOT NULL AND s.ratio IS NOT NULL AND s.his_net IS NOT NULL AND abs(s.target_raw) < s.ratio * abs(COALESCE(CASE WHEN COALESCE(s.last_plan->>'flow_net', '') <> '' AND NOT ((s.last_plan->>'flow_net') ~ '[^0-9.eE+-]') THEN (s.last_plan->>'flow_net')::float8 END, s.his_net - COALESCE(s.flow_base, 0))) - 0.5 THEN 'stale_snapshot' WHEN COALESCE(s.flow_base, 0) <> 0 AND s.target_raw IS NOT NULL AND s.ratio IS NOT NULL AND s.his_net IS NOT NULL AND abs(s.target_raw) < s.ratio * abs(s.his_net) - 0.5 THEN 'block_flow' ELSE 'unattributed' END AS cause FROM s WHERE s.e IS NOT NULL AND (s.e->>'order') IS NULL AND COALESCE(s.e->>'name', '') = 'on_target') SELECT id, book, his_slug, ts::time(0) AS his_fill, side, round(size::numeric, 1) AS sh, price, round(usd::numeric, 2) AS his_usd, cause, round(lag_s::numeric, 0) AS lag_s, ledger_net AS held, target, round(his_net::numeric, 1) AS his_net, round(target_raw::numeric, 1) AS target_raw, ratio, round(flow_base::numeric, 1) AS flow_base, last_plan->>'flow_net' AS flow_net, opened_at::time(0) AS opened, last_plan->>'game_cap' AS game_cap, last_plan->>'game_room' AS game_room, left((last_plan->'flow_hold')::text, 60) AS flow_hold FROM c ORDER BY usd DESC LIMIT 30;"; TO=120000 ;;
                verify-day) SQL="WITH bk AS (SELECT b.* FROM mirror_books b WHERE b.opened_at >= date_trunc('day', now()) OR b.closed_at >= date_trunc('day', now()) OR b.state <> 'closed'), tr AS (SELECT t.id, t.whale_id, t.condition_id, t.asset, upper(t.side) AS side, t.size, t.price, t.ts, t.source, bool_or(t.source IN ('chain','s1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash,'')), 'row:'||t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IN (SELECT condition_id FROM bk)), his AS (SELECT * FROM tr WHERE source IN ('chain','s1') OR NOT has_net), ours AS (SELECT o.book_id, min(COALESCE(o.done_at, o.placed_at)) AS first_fill, max(COALESCE(o.done_at, o.placed_at)) AS last_fill, count(*) AS n_fills, sum(CASE WHEN o.side = 'BUY_LONG' THEN o.filled ELSE -o.filled END) AS net_filled, string_agg(left(o.side, 4) || ' ' || round(o.filled::numeric, 0) || '@' || round(o.avg_px::numeric, 3) || ' ' || to_char(COALESCE(o.done_at, o.placed_at), 'HH24:MI') || ' his' || COALESCE(round(o.his_level::numeric, 3)::text, '?'), ' | ' ORDER BY o.placed_at) AS fills FROM mirror_orders o WHERE o.filled > 0 GROUP BY o.book_id) SELECT b.id, left(b.us_market_slug, 40) AS slug, replace(b.intent, 'ORDER_INTENT_BUY_', '') AS intent, b.ratio, b.state, b.ledger_net AS held, round(b.avg_cost::numeric, 3) AS avg_cost, round(b.realized_pnl::numeric, 2) AS realized, round(b.settled_pnl::numeric, 2) AS settled, m.resolved_prices::text AS resolved, lt.outcome_index AS long_idx, left(lt.outcome, 16) AS long_outcome, round((SELECT COALESCE(sum((CASE WHEN h.asset = b.long_asset THEN 1 ELSE -1 END) * (CASE WHEN h.side = 'BUY' THEN 1 ELSE -1 END) * h.size), 0) FROM his h WHERE h.condition_id = b.condition_id AND (o.first_fill IS NULL OR h.ts <= o.first_fill))::numeric, 1) AS his_net_at_first, round((SELECT COALESCE(sum((CASE WHEN h.asset = b.long_asset THEN 1 ELSE -1 END) * (CASE WHEN h.side = 'BUY' THEN 1 ELSE -1 END) * h.size), 0) FROM his h WHERE h.condition_id = b.condition_id AND (o.last_fill IS NULL OR h.ts <= o.last_fill))::numeric, 1) AS his_net_at_last, round((SELECT COALESCE(sum((CASE WHEN h.asset = b.long_asset THEN 1 ELSE -1 END) * (CASE WHEN h.side = 'BUY' THEN 1 ELSE -1 END) * h.size), 0) FROM his h WHERE h.condition_id = b.condition_id)::numeric, 1) AS his_net_now, round((SELECT COALESCE(sum((CASE WHEN h.side = 'BUY' THEN 1 ELSE -1 END) * h.size * (COALESCE((m.resolved_prices->>mt2.outcome_index)::numeric, 0) - h.price)), 0) FROM his h JOIN market_tokens mt2 ON mt2.token_id = h.asset WHERE h.condition_id = b.condition_id AND m.resolved_prices IS NOT NULL)::numeric, 0) AS his_pnl_settled, (SELECT min(h.ts) FROM his h WHERE h.condition_id = b.condition_id)::time(0) AS his_first, o.first_fill::time(0) AS our_first, o.last_fill::time(0) AS our_last, o.n_fills, round(o.net_filled::numeric, 0) AS net_filled, left(o.fills, 150) AS fills FROM bk b LEFT JOIN markets m ON m.condition_id = b.condition_id LEFT JOIN market_tokens lt ON lt.token_id = b.long_asset LEFT JOIN ours o ON o.book_id = b.id ORDER BY b.id;"; TO=60000 ;;
                # [R51] see .github/workflows/RENDER_OPS_NOTES.md
                traded-day) SQL="SELECT 'today' AS what, count(*) AS filled_orders, count(DISTINCT o.book_id) AS books, round(sum(o.filled * COALESCE(o.avg_px, o.wire))::numeric, 2) AS traded_usd, round(sum(CASE WHEN o.side = 'BUY_LONG' THEN o.filled * COALESCE(o.avg_px, o.wire) ELSE 0 END)::numeric, 2) AS long_token_bought_usd, round(sum(CASE WHEN o.side = 'SELL_LONG' THEN o.filled * COALESCE(o.avg_px, o.wire) ELSE 0 END)::numeric, 2) AS long_token_sold_usd, round(sum(o.filled)::numeric, 1) AS shares, min(COALESCE(o.done_at, o.placed_at))::time(0) AS first_fill, max(COALESCE(o.done_at, o.placed_at))::time(0) AS last_fill FROM mirror_orders o WHERE o.whale = 'rn1' AND o.filled > 0 AND COALESCE(o.done_at, o.placed_at) >= date_trunc('day', now()); SELECT o.kind, o.side, count(*) AS n, round(sum(o.filled)::numeric, 1) AS shares, round(sum(o.filled * COALESCE(o.avg_px, o.wire))::numeric, 2) AS usd, round(avg(o.filled * COALESCE(o.avg_px, o.wire))::numeric, 2) AS avg_usd FROM mirror_orders o WHERE o.whale = 'rn1' AND o.filled > 0 AND COALESCE(o.done_at, o.placed_at) >= date_trunc('day', now()) GROUP BY 1, 2 ORDER BY 5 DESC, 1, 2; SELECT date_trunc('hour', COALESCE(o.done_at, o.placed_at))::time(0) AS hour, count(*) AS n, round(sum(o.filled)::numeric, 1) AS shares, round(sum(o.filled * COALESCE(o.avg_px, o.wire))::numeric, 2) AS usd FROM mirror_orders o WHERE o.whale = 'rn1' AND o.filled > 0 AND COALESCE(o.done_at, o.placed_at) >= date_trunc('day', now()) GROUP BY 1 ORDER BY 1;"; TO=30000 ;;
                # the same read over the last 48 hours (owner question 23:5xZ), by kind x side and by UTC day
                traded-48h) SQL="SELECT 'last_48h' AS what, count(*) AS filled_orders, count(DISTINCT o.book_id) AS books, round(sum(o.filled * COALESCE(o.avg_px, o.wire))::numeric, 2) AS traded_usd, round(sum(CASE WHEN o.side = 'BUY_LONG' THEN o.filled * COALESCE(o.avg_px, o.wire) ELSE 0 END)::numeric, 2) AS long_token_bought_usd, round(sum(CASE WHEN o.side = 'SELL_LONG' THEN o.filled * COALESCE(o.avg_px, o.wire) ELSE 0 END)::numeric, 2) AS long_token_sold_usd, round(sum(o.filled)::numeric, 1) AS shares, min(COALESCE(o.done_at, o.placed_at))::time(0) AS first_fill, max(COALESCE(o.done_at, o.placed_at))::time(0) AS last_fill FROM mirror_orders o WHERE o.whale = 'rn1' AND o.filled > 0 AND COALESCE(o.done_at, o.placed_at) >= now() - interval '48 hours'; SELECT o.kind, o.side, count(*) AS n, round(sum(o.filled)::numeric, 1) AS shares, round(sum(o.filled * COALESCE(o.avg_px, o.wire))::numeric, 2) AS usd, round(avg(o.filled * COALESCE(o.avg_px, o.wire))::numeric, 2) AS avg_usd FROM mirror_orders o WHERE o.whale = 'rn1' AND o.filled > 0 AND COALESCE(o.done_at, o.placed_at) >= now() - interval '48 hours' GROUP BY 1, 2 ORDER BY 5 DESC, 1, 2; SELECT date_trunc('day', COALESCE(o.done_at, o.placed_at))::date AS day, count(*) AS n, round(sum(o.filled)::numeric, 1) AS shares, round(sum(o.filled * COALESCE(o.avg_px, o.wire))::numeric, 2) AS usd FROM mirror_orders o WHERE o.whale = 'rn1' AND o.filled > 0 AND COALESCE(o.done_at, o.placed_at) >= now() - interval '48 hours' GROUP BY 1 ORDER BY 1;"; TO=30000 ;;
                # [R52] see .github/workflows/RENDER_OPS_NOTES.md
                tennis-witness=*) if [[ ! "$ARG" =~ ^tennis-witness=([0-9]{4}-[0-9]{2}-[0-9]{2})(:([a-z]+(,[a-z]+)*))?$ ]]; then echo "tennis-witness: arg must be tennis-witness=<YYYY-MM-DD>[:<surname>,<surname>...] (got '$ARG')"; exit 1; fi
                  TD="${BASH_REMATCH[1]}"; TN="${BASH_REMATCH[3]}"; TW="TRUE"
                  if [ -n "$TN" ]; then TW="(lower(event_title) LIKE '%$(printf '%s' "$TN" | sed "s/,/%' OR lower(event_title) LIKE '%/g")%')"; fi
