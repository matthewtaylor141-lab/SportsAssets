                # [R12] see .github/workflows/RENDER_OPS_NOTES.md
                loss-breaker) SQL="WITH r AS (SELECT x.at FROM (SELECT (value->>'at')::timestamptz AS at FROM ingestion_state WHERE key = 'mirror_loss_rearm' AND value->>'at' ~ '([+-][0-9]{2}:?[0-9]{2}|Z)$') x WHERE x.at <= now() + interval '300 seconds'), w AS (SELECT GREATEST(now() - interval '24 hours', LEAST(now(), COALESCE((SELECT at FROM r), now() - interval '24 hours'))) AS since) SELECT CASE WHEN g.k = 1 THEN 'sleeve 24h' ELSE 'since ' || to_char((SELECT since FROM w), 'HH24:MI:SS') END AS window, COALESCE(o.lane, '') AS lane, COALESCE(o.whale_username, '') AS whale, o.status, count(*) AS n, round(sum(o.pnl)::numeric, 2) AS pnl, min(o.settled_at)::time(0) AS first, max(o.settled_at)::time(0) AS last FROM (VALUES (1), (2)) g(k) JOIN live_orders o ON o.status IN ('settled', 'cashed_out') AND o.settled_at > CASE WHEN g.k = 1 THEN now() - interval '24 hours' ELSE (SELECT since FROM w) END GROUP BY 1, 2, 3, 4 ORDER BY 1, 2, 3, 4; SELECT o.id, o.lane, o.whale_username AS whale, o.status, o.settled_at::time(0) AS settled, round(o.pnl::numeric, 2) AS pnl, left(o.us_market_slug, 44) AS slug FROM live_orders o WHERE o.status IN ('settled', 'cashed_out') AND o.settled_at > now() - interval '24 hours' ORDER BY o.settled_at DESC LIMIT 40;"; TO=30000 ;;
                # [R13] see .github/workflows/RENDER_OPS_NOTES.md
                mirror-tick) SQL="SELECT h.service AS what, e.key, left(e.value::text, 8000) AS value FROM service_heartbeats h, jsonb_each(h.detail) e WHERE h.service IN ('mirror_live','mirror_shadow','chain_listener','poller') UNION ALL SELECT h.service, 'zz beat_at', h.beat_at::text || ' ' || h.status FROM service_heartbeats h WHERE h.service IN ('mirror_live','mirror_shadow','chain_listener','poller') UNION ALL SELECT 'zz book', b.us_market_slug, 'state=' || b.state || ' whale=' || b.whale || ' opened=' || b.opened_at::text || ' ' || left((to_jsonb(b) - 'us_market_slug' - 'state' - 'whale' - 'opened_at' - 'condition_id' - 'long_asset' - 'other_asset')::text, 260) FROM mirror_books b WHERE b.state <> 'closed' UNION ALL SELECT 'zz order', o.placed_at::text, left((to_jsonb(o) - 'placed_at' - 'receipt')::text, 280) FROM (SELECT * FROM mirror_orders ORDER BY placed_at DESC NULLS LAST LIMIT 8) o ORDER BY 1, 2;"; TO=30000 ;;
                # [R14] see .github/workflows/RENDER_OPS_NOTES.md
                tick-ring) SQL="WITH r AS (SELECT e FROM ingestion_state s, jsonb_array_elements(CASE WHEN jsonb_typeof(s.value->'ticks') = 'array' THEN s.value->'ticks' ELSE '[]'::jsonb END) e WHERE s.key = 'mirror_tick_ring' AND jsonb_typeof(e) = 'array' AND CASE WHEN jsonb_typeof(e) = 'array' THEN jsonb_array_length(e) ELSE 0 END >= 15 AND CASE WHEN jsonb_typeof(e->0) = 'number' THEN (e->>0)::numeric END BETWEEN 0 AND 4102444800 AND CASE WHEN jsonb_typeof(e->1) = 'number' THEN (e->>1)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->4) = 'number' THEN (e->>4)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->5) = 'number' THEN (e->>5)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->10) = 'number' THEN (e->>10)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->12) = 'number' THEN (e->>12)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->14) = 'number' THEN (e->>14)::numeric END BETWEEN -1e9 AND 1e9) SELECT date_trunc('hour', to_timestamp((e->>0)::float8))::time(0) AS hour, count(*) AS ticks, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (e->>1)::float8)::numeric, 1) AS tick_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY (e->>1)::float8)::numeric, 1) AS tick_p90_s, round(max((e->>1)::float8)::numeric, 1) AS tick_max_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (e->>5)::float8)::numeric, 1) AS cand_med_s, round(max((e->>5)::float8)::numeric, 1) AS cand_max_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (e->>4)::float8)::numeric, 1) AS books_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY (e->>12)::float8)::numeric, 1) AS fast_wait_p90_s, sum((e->>10)::float8)::int AS yields, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (e->>14)::float8)::numeric, 1) AS fast_prelude_med_s FROM r GROUP BY date_trunc('hour', to_timestamp((e->>0)::float8)) ORDER BY date_trunc('hour', to_timestamp((e->>0)::float8)) DESC LIMIT 48;"; TO=30000 ;;
                # [R15] see .github/workflows/RENDER_OPS_NOTES.md
                mirror-refusals) SQL="SELECT o.id, o.placed_at, o.side, o.intent, o.wire, o.qty, o.reason, left(o.receipt::text, 1500) AS receipt FROM mirror_orders o WHERE o.state = 'rejected' ORDER BY o.placed_at DESC LIMIT 4;"; TO=30000 ;;
                # [R16] see .github/workflows/RENDER_OPS_NOTES.md
                mirror-pnl) SQL="SELECT b.id, b.us_market_slug AS slug, b.state, b.intent, b.ratio, b.ledger_net AS held, round(b.avg_cost::numeric, 4) AS avg_cost, round((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN abs(b.ledger_net) * (1 - COALESCE(b.avg_cost, 1)) ELSE b.ledger_net * COALESCE(b.avg_cost, 0) END)::numeric, 2) AS open_cost, round(b.realized_pnl::numeric, 2) AS realized, round(b.settled_pnl::numeric, 2) AS settled, round(b.own_book_pnl::numeric, 2) AS own_book, b.opened_at::time(0) AS opened, b.closed_at::time(0) AS closed FROM mirror_books b WHERE b.opened_at >= date_trunc('day', now()) OR b.closed_at >= date_trunc('day', now()) OR b.state <> 'closed' ORDER BY b.id; SELECT 'today' AS what, count(*) AS books, round(sum(realized_pnl)::numeric, 2) AS realized, round(sum(settled_pnl)::numeric, 2) AS settled, round(sum(CASE WHEN state = 'closed' AND settled_pnl IS NOT NULL THEN settled_pnl ELSE realized_pnl END)::numeric, 2) AS day_pnl, round(sum(CASE WHEN state <> 'closed' THEN (CASE WHEN intent = 'ORDER_INTENT_BUY_SHORT' THEN abs(ledger_net) * (1 - COALESCE(avg_cost, 1)) ELSE ledger_net * COALESCE(avg_cost, 0) END) ELSE 0 END)::numeric, 2) AS open_cost, round(sum(peak_exposure_usd)::numeric, 2) AS peak_stake FROM mirror_books WHERE opened_at >= date_trunc('day', now()) OR closed_at >= date_trunc('day', now()) OR state <> 'closed'; SELECT 'fills today' AS what, count(*) AS n, round(sum(CASE WHEN side LIKE 'BUY%' THEN cash_usd ELSE 0 END)::numeric, 2) AS bought_usd, round(sum(CASE WHEN side LIKE 'SELL%' THEN cash_usd ELSE 0 END)::numeric, 2) AS sold_usd, round(sum(realized)::numeric, 2) AS realized FROM mirror_orders WHERE filled > 0 AND placed_at >= date_trunc('day', now());"; TO=30000 ;;
                # [R17] see .github/workflows/RENDER_OPS_NOTES.md
                his-recent) SQL="WITH his AS (SELECT t.condition_id, max(t.ts) AS last_ts, min(t.ts) AS first_ts, count(*) AS fills, round(sum(t.size)::numeric, 1) AS shares, round(sum(t.size * t.price)::numeric, 2) AS usd, max(COALESCE(t.market_slug, m.slug)) AS his_slug, max(COALESCE(t.outcome, mt.outcome)) AS outcome, round(avg(t.price)::numeric, 3) AS avg_px FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id LEFT JOIN market_tokens mt ON mt.token_id = t.asset WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '2 hours' GROUP BY t.condition_id), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, detail->>'explain' AS explain, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '3 hours' ORDER BY condition_id, at DESC) SELECT h.last_ts::time(0) AS last, h.fills, h.shares, h.usd, h.avg_px, left(h.his_slug, 40) AS his_slug, left(h.outcome, 14) AS outcome, sh.family, left(COALESCE(sh.us_market_slug, ''), 40) AS us_slug, left(COALESCE(sh.reason, '(never judged)'), 40) AS shadow_reason, left(COALESCE(sh.explain, ''), 260) AS explain, sh.at::time(0) AS judged, b.id AS book, b.state AS bstate, b.ledger_net AS held, (SELECT count(*) FROM mirror_orders o WHERE o.book_id = b.id) AS orders FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id LEFT JOIN mirror_books b ON b.condition_id = h.condition_id AND b.whale = 'rn1' ORDER BY h.last_ts DESC LIMIT 60; SELECT 'his 2h' AS what, count(*) AS markets, sum(fills) AS fills, round(sum(usd)::numeric, 0) AS usd FROM (SELECT t.condition_id, count(*) AS fills, sum(t.size * t.price) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '2 hours' GROUP BY t.condition_id) x;"; TO=30000 ;;
                # [R18] see .github/workflows/RENDER_OPS_NOTES.md
                mirror-why) SQL="WITH his AS (SELECT DISTINCT t.condition_id FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '2 hours'), sh AS (SELECT DISTINCT ON (s.condition_id) s.condition_id, s.at, s.us_market_slug, s.reason, s.his_net, s.target, s.ledger_net, s.venue_net, s.bid, s.ask, s.detail FROM mirror_shadow s JOIN his h ON h.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '3 hours' AND s.us_market_slug IS NOT NULL ORDER BY s.condition_id, s.at DESC) SELECT sh.at::time(0) AS judged, sh.us_market_slug AS us_slug, sh.reason, round(sh.his_net::numeric, 1) AS his_net, sh.target, sh.ledger_net AS ledger, sh.venue_net AS venue, sh.bid, sh.ask, left(sh.detail::text, 700) AS detail FROM sh LEFT JOIN mirror_books b ON b.condition_id = sh.condition_id AND b.whale = 'rn1' AND b.state <> 'closed' WHERE b.id IS NULL ORDER BY sh.at DESC LIMIT 30;"; TO=30000 ;;
                # [R19] see .github/workflows/RENDER_OPS_NOTES.md
                copy-lane) SQL="SELECT o.placed_at::time(0) AS at, o.whale_username AS whale, o.side, o.status, round(o.requested_usd::numeric, 2) AS req_usd, round(o.filled_shares::numeric, 1) AS filled, round(o.fill_price::numeric, 3) AS px, left(COALESCE(m.slug, o.condition_id), 34) AS his_market, left(COALESCE(o.raw->>'us_slug', o.raw->>'market_slug', o.raw->>'marketSlug', ''), 34) AS us_slug, left(COALESCE(o.error, ''), 90) AS error FROM live_orders o LEFT JOIN markets m ON m.condition_id = o.condition_id WHERE o.placed_at >= now() - interval '8 hours' ORDER BY o.placed_at DESC LIMIT 40; SELECT date_trunc('hour', placed_at)::time(0) AS hour, status, count(*) AS n, round(sum(requested_usd)::numeric, 0) AS req_usd, round(sum(filled_usd)::numeric, 0) AS filled_usd FROM live_orders WHERE placed_at >= now() - interval '8 hours' GROUP BY 1, 2 ORDER BY 1 DESC, 2;"; TO=30000 ;;
                # [R20] see .github/workflows/RENDER_OPS_NOTES.md
                c3-rows) SQL="SELECT split_part(identifier, '-', 1) AS prefix, count(*) AS rows, count(DISTINCT split_part(identifier, '-', 2)) AS leagues, min(identifier) AS example FROM us_premap WHERE identifier LIKE '%-2026-09-06%' GROUP BY 1 ORDER BY 2 DESC; SELECT t.market_slug AS his_slug, max(t.market_title) AS his_title, max(t.outcome) AS outcome, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '3 hours' AND (t.market_slug LIKE '%-spread-%' OR t.market_slug LIKE '%-btts' OR t.market_slug LIKE '%-draw' OR t.market_slug LIKE '%-exact-score-%' OR t.market_slug LIKE '%-total-%') GROUP BY 1 ORDER BY 5 DESC LIMIT 60; SELECT identifier, side_norm, line, intent, left(question, 110) AS question FROM us_premap WHERE identifier LIKE '%-2026-09-06%' AND (identifier LIKE '%-esp-sev-%' OR identifier LIKE '%-juv-mil-%' OR identifier LIKE '%-cru-cap-%' OR identifier LIKE '%-cre-fla-%' OR identifier LIKE '%-olm-pfc-%' OR identifier LIKE '%-int-san-%' OR identifier LIKE '%-cdh-csc-%') AND identifier NOT LIKE 'atc-%' AND identifier NOT LIKE 'asc-%' AND identifier NOT LIKE '%-g-%' AND identifier NOT LIKE '%-cor-%' AND identifier NOT LIKE '%-ftts-%' AND (identifier LIKE 'tsc-%' OR identifier LIKE '%-es-%' OR identifier LIKE '%-btts' OR identifier LIKE '%-ht-%' OR identifier LIKE '%-fh-%' OR identifier LIKE '%-tt-%' OR identifier LIKE '%-draw%') ORDER BY split_part(identifier, '-', 1) DESC, identifier, side_norm LIMIT 230;"; TO=30000 ;;
                # [R21] see .github/workflows/RENDER_OPS_NOTES.md
                c4-rows) SQL="SELECT split_part(identifier, '-', 1) AS prefix, count(*) AS rows, min(identifier) AS example, max(identifier) AS example2 FROM us_premap WHERE identifier LIKE '%-cfb-lou-miss-2026-09-06%' OR identifier LIKE '%-cfb-wisc-nd-2026-09-06%' GROUP BY 1 ORDER BY 1; SELECT identifier, side_norm, intent, line, left(question, 140) AS question FROM us_premap WHERE (identifier LIKE '%-cfb-lou-miss-2026-09-06%' OR identifier LIKE '%-cfb-wisc-nd-2026-09-06%' OR market_slug LIKE '%-cfb-lou-miss-2026-09-06%' OR market_slug LIKE '%-cfb-wisc-nd-2026-09-06%') AND identifier NOT LIKE 'asc-%' AND identifier NOT LIKE 'tsc-%' AND identifier NOT LIKE 'astatc-%' ORDER BY identifier, side_norm LIMIT 60; SELECT identifier, line, string_agg(side_norm || '=' || COALESCE(intent, '?'), ' | ' ORDER BY side_norm) AS sides, max(left(question, 130)) AS question FROM us_premap WHERE (identifier LIKE 'asc-cfb-lou-miss-2026-09-06%' OR identifier LIKE 'asc-cfb-wisc-nd-2026-09-06%') AND identifier NOT LIKE '%-1h-%' AND identifier NOT LIKE '%-2h-%' AND identifier NOT LIKE '%-1q-%' AND identifier NOT LIKE '%-2q-%' AND identifier NOT LIKE '%-3q-%' AND identifier NOT LIKE '%-4q-%' GROUP BY 1, 2 ORDER BY 1 LIMIT 110; SELECT t.market_slug AS his_slug, t.outcome, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, min(t.ts)::time(0) AS first_ts, max(t.ts)::time(0) AS last_ts, max(t.market_title) AS his_title, left(max(m.event_title), 40) AS event_title, max(t.outcome_index) AS oi FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND (t.market_slug LIKE 'cfb-lou-miss-2026-09-06%' OR t.market_slug LIKE 'cfb-wisc-nd-2026-09-06%') GROUP BY 1, 2 ORDER BY 1, 2 LIMIT 90;"; TO=30000 ;;
                c4-shadow) SQL="SELECT key, jsonb_typeof(value->'certified') AS certified_type, CASE WHEN jsonb_typeof(value->'certified') = 'object' THEN (SELECT string_agg(k, ' ') FROM jsonb_object_keys(value->'certified') k) ELSE NULL END AS certified_keys, value->'ok' AS ok, value->'unverified' AS unverified, value->'mismatch' AS mismatch, value->'tripped' AS tripped, left((value->'last')::text, 300) AS last FROM ingestion_state WHERE key = 'mirror_grammar_echo'; SELECT b.id, b.us_market_slug AS slug, b.state, b.map_source AS src, b.intent, b.ledger_net AS held, b.opened_at::time(0) AS opened, b.closed_at::time(0) AS closed, left(b.last_reason, 40) AS last_reason FROM mirror_books b WHERE b.us_market_slug LIKE '%cfb-lou-miss-2026-09-06%' OR b.us_market_slug LIKE '%cfb-wisc-nd-2026-09-06%' ORDER BY b.id LIMIT 60; SELECT DISTINCT ON (t.condition_id) t.market_slug AS his_slug, t.outcome AS first_outcome, t.ts::time(0) AS first_ts, t.market_title AS first_title, t.source FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND (t.market_slug LIKE 'cfb-lou-miss-2026-09-06-spread%' OR t.market_slug LIKE 'cfb-wisc-nd-2026-09-06-spread%') ORDER BY t.condition_id, t.ts, t.id LIMIT 40; SELECT DISTINCT ON (s.condition_id) s.at::time(0) AS judged, left(COALESCE(s.us_market_slug, s.detail->>'his_slug'), 44) AS slug, left(s.reason, 40) AS reason, s.ledger_net AS ledger, s.venue_net AS venue, left(s.detail::text, 600) AS detail FROM mirror_shadow s WHERE s.whale = 'rn1' AND s.at >= now() - interval '6 hours' AND (s.detail->>'his_slug' LIKE 'cfb-lou-miss-2026-09-06%' OR s.detail->>'his_slug' LIKE 'cfb-wisc-nd-2026-09-06%' OR s.us_market_slug LIKE 'aec-cfb-lou-miss-2026-09-06%' OR s.us_market_slug LIKE 'aec-cfb-wisc-nd-2026-09-06%') ORDER BY s.condition_id, s.at DESC LIMIT 40; SELECT o.placed_at::time(0) AS at, o.whale_username AS whale, o.side, o.status, round(o.filled_shares::numeric, 1) AS filled, round(o.fill_price::numeric, 3) AS px, left(COALESCE(m.slug, o.condition_id), 34) AS his_market, left(COALESCE(o.raw->>'us_slug', o.raw->>'market_slug', o.raw->>'marketSlug', ''), 40) AS us_slug, left(COALESCE(o.error, ''), 60) AS error FROM live_orders o LEFT JOIN markets m ON m.condition_id = o.condition_id WHERE m.slug IN ('cfb-lou-miss-2026-09-06', 'cfb-wisc-nd-2026-09-06') OR o.us_market_slug LIKE 'aec-cfb-%-2026-09-06%' OR COALESCE(o.raw->>'us_slug', o.raw->>'market_slug', o.raw->>'marketSlug', '') LIKE 'aec-cfb-%-2026-09-06%' ORDER BY o.placed_at DESC LIMIT 20;"; TO=30000 ;;
                # [R22] see .github/workflows/RENDER_OPS_NOTES.md
                cfb-his) SQL="WITH his AS (SELECT t.condition_id, t.market_slug, t.outcome, t.size * t.price AS usd, t.ts, t.market_title, t.outcome_index FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND t.market_slug LIKE 'cfb-%'), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, reason, detail->>'explain' AS explain, detail->>'title' AS judged_title FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '36 hours' ORDER BY condition_id, at DESC) SELECT h.market_slug AS his_slug, h.outcome, count(*) AS fills, round(sum(h.usd)::numeric, 0) AS usd, min(h.ts)::time(0) AS first_ts, max(h.ts)::time(0) AS last_ts, max(h.market_title) AS his_title, left(max(m.event_title), 40) AS event_title, max(h.outcome_index) AS oi, left(COALESCE(max(sh.explain), max(sh.reason), '(never judged)'), 44) AS verdict, max(sh.at)::time(0) AS judged, max(b.id) AS book FROM his h LEFT JOIN markets m ON m.condition_id = h.condition_id LEFT JOIN sh ON sh.condition_id = h.condition_id LEFT JOIN mirror_books b ON b.condition_id = h.condition_id AND b.whale = 'rn1' GROUP BY 1, 2 ORDER BY 1, 2 LIMIT 200; SELECT DISTINCT ON (t.condition_id) t.market_slug AS his_slug, t.outcome AS first_outcome, t.ts::time(0) AS first_ts, left(t.market_title, 40) AS first_title FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND t.market_slug LIKE 'cfb-%' ORDER BY t.condition_id, t.ts, t.id LIMIT 100; WITH his AS (SELECT t.condition_id, t.market_slug, t.size * t.price AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND t.market_slug LIKE 'cfb-%'), sh AS (SELECT DISTINCT ON (condition_id) condition_id, reason, detail->>'explain' AS explain, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '36 hours' ORDER BY condition_id, at DESC) SELECT COALESCE(sh.family, '?') AS family, CASE WHEN b.id IS NOT NULL THEN 'MIRRORED' ELSE left(COALESCE(sh.explain, sh.reason, '(never judged)'), 44) END AS why, count(DISTINCT h.condition_id) AS markets, round(sum(h.usd)::numeric, 0) AS usd, string_agg(DISTINCT left(h.market_slug, 44), ' ') AS slugs FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id LEFT JOIN mirror_books b ON b.condition_id = h.condition_id AND b.whale = 'rn1' GROUP BY 1, 2 ORDER BY sum(h.usd) DESC LIMIT 40;"; TO=30000 ;;
                cfb-venue) SQL="SELECT identifier, side_norm, intent, left(event_title, 40) AS v_event_title, left(question, 120) AS question FROM us_premap WHERE identifier LIKE 'aec-cfb-%' AND (identifier LIKE '%-2026-09-06' OR identifier LIKE '%-2026-09-07') ORDER BY identifier, side_norm LIMIT 120; WITH ev AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) || '-' || split_part(t.market_slug, '-', 2) || '-' || split_part(t.market_slug, '-', 3) || '-' || substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS ev FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND t.market_slug LIKE 'cfb-%') SELECT ev.ev, split_part(u.identifier, '-', 1) AS prefix, count(*) AS rows, left(string_agg(DISTINCT CASE WHEN split_part(u.identifier, '-', 1) IN ('tsc', 'asc') AND u.identifier !~ '-(1h|2h|1q|2q|3q|4q|fh|sh)-' THEN substr(u.identifier, position(ev.ev in u.identifier) + length(ev.ev) + 1) END, ' '), 400) AS full_game_tails FROM ev JOIN us_premap u ON u.identifier LIKE '%-' || ev.ev || '%' GROUP BY 1, 2 ORDER BY 1, 2 LIMIT 80; WITH ev AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) || '-' || split_part(t.market_slug, '-', 2) || '-' || split_part(t.market_slug, '-', 3) || '-' || substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS ev FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND t.market_slug LIKE 'cfb-%') SELECT ev.ev, string_agg(DISTINCT CASE WHEN u.identifier LIKE 'aec-%' THEN u.side_norm END, '/') AS aec_sides, max(CASE WHEN u.identifier LIKE 'aec-%' THEN left(u.event_title, 40) END) AS v_event_title, min(CASE WHEN u.identifier LIKE 'asc-%' AND u.identifier !~ '-(1h|2h|1q|2q|3q|4q)-' THEN left(u.question, 95) END) AS asc_question, min(CASE WHEN u.identifier LIKE 'asc-%-1h-%' THEN left(u.question, 95) END) AS asc_1h_question, left(string_agg(DISTINCT CASE WHEN u.identifier LIKE 'atc-%-winner-1h-%' THEN substr(u.identifier, position('winner-1h-' in u.identifier) + 10) || '=' || left(u.question, 44) END, ' | '), 300) AS atc_1h FROM ev JOIN us_premap u ON u.identifier LIKE '%-' || ev.ev || '%' GROUP BY 1 ORDER BY 1 LIMIT 40; SELECT key, jsonb_typeof(value->'certified') AS certified_type, CASE WHEN jsonb_typeof(value->'certified') = 'object' THEN (SELECT string_agg(k, ' ') FROM jsonb_object_keys(value->'certified') k) ELSE NULL END AS certified_keys, value->'ok' AS ok, value->'unverified' AS unverified, value->'mismatch' AS mismatch, value->'tripped' AS tripped, left((value->'last')::text, 300) AS last FROM ingestion_state WHERE key = 'mirror_grammar_echo';"; TO=30000 ;;
                # [R23] see .github/workflows/RENDER_OPS_NOTES.md
                nfl-rows) SQL="WITH his AS (SELECT t.condition_id, t.market_slug AS his_slug, max(t.market_title) AS his_title, max(m.event_title) AS event_title, string_agg(DISTINCT t.outcome, '/') AS outcomes, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, max(t.ts)::time(0) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND t.market_slug LIKE 'nfl-%' GROUP BY 1, 2), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, reason, us_market_slug, detail->>'family' AS family, left(detail->>'explain', 60) AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '31 hours' ORDER BY condition_id, at DESC) SELECT left(h.his_slug, 44) AS his_slug, left(h.his_title, 50) AS his_title, left(COALESCE(h.event_title, '(null)'), 34) AS event_title, left(h.outcomes, 20) AS outcomes, h.fills, h.usd, h.last_ts, sh.reason, sh.family, sh.explain, left(sh.us_market_slug, 30) AS us_slug, sh.at::time(0) AS judged FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id ORDER BY h.usd DESC LIMIT 60; SELECT split_part(identifier, '-', 2) AS lg, split_part(identifier, '-', 1) AS prefix, count(*) AS rows, min(identifier) AS sample_identifier, min(left(event_title, 50)) AS event_title FROM us_premap WHERE identifier ~ '-2026-09-1[0-5](-|$)' GROUP BY 1, 2 ORDER BY 3 DESC LIMIT 60; SELECT split_part(identifier, '-', 1) AS prefix, regexp_replace(regexp_replace(identifier, '^[a-z]+-nfl-[a-z0-9]+-[a-z0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-?', ''), '[0-9]+pt5', 'N', 'g') AS tail, count(*) AS rows, left(string_agg(DISTINCT side_norm, '/'), 60) AS sides, min(identifier) AS sample_identifier, min(left(question, 90)) AS question FROM us_premap WHERE identifier LIKE '%-nfl-%' AND identifier !~ '-(1h|2h|1q|2q|3q|4q)-' AND split_part(identifier, '-', 1) IN ('aec', 'asc', 'tsc', 'atc') GROUP BY 1, 2 ORDER BY 1, 2 LIMIT 60; SELECT identifier, side_norm, line, left(question, 100) AS question FROM us_premap WHERE identifier LIKE '%-nfl-ne-sea-%' AND identifier !~ '-(1h|2h|1q|2q|3q|4q)-' AND split_part(identifier, '-', 1) IN ('aec', 'asc', 'tsc') ORDER BY identifier, side_norm LIMIT 90; WITH ev AS (SELECT DISTINCT split_part(t.market_slug, '-', 2) AS a, split_part(t.market_slug, '-', 3) AS b, substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS d FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND t.market_slug LIKE 'nfl-%') SELECT ev.a || '-' || ev.b || '-' || COALESCE(ev.d, '?') AS his_event, split_part(u.identifier, '-', 1) AS prefix, split_part(u.identifier, '-', 2) AS lg, count(*) AS rows, min(u.identifier) AS sample_identifier, min(left(u.question, 80)) AS question FROM ev JOIN us_premap u ON (u.identifier LIKE '%-' || ev.a || '-' || ev.b || '-%' OR u.identifier LIKE '%-' || ev.b || '-' || ev.a || '-%') GROUP BY 1, 2, 3 ORDER BY 1, 2, 3 LIMIT 80;"; TO=60000 ;;
                # [R24] see .github/workflows/RENDER_OPS_NOTES.md
                nfl-team) SQL="SELECT identifier, side_norm, team_abbr, team_name, team_safe_name, team_id, team_league, sports_type, game_start, left(question, 60) AS question FROM us_premap WHERE identifier LIKE 'aec-nfl-%' ORDER BY identifier, side_norm LIMIT 120; SELECT identifier, side_norm, intent, line, team_abbr, team_name, team_safe_name, left(question, 110) AS question FROM us_premap WHERE identifier LIKE 'asc-nfl-%' AND identifier !~ '-(1h|2h|1q|2q|3q|4q)-' AND identifier LIKE '%-3pt5' ORDER BY identifier, side_norm LIMIT 80; SELECT DISTINCT team_abbr, team_name, team_safe_name, team_id, team_league FROM us_premap WHERE identifier LIKE 'aec-nfl-%' AND team_abbr IS NOT NULL ORDER BY 1 LIMIT 80; SELECT t.market_slug AS his_slug, max(t.market_title) AS his_title, string_agg(DISTINCT t.outcome, '/') AS outcomes, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, max(t.ts)::date AS last_day FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '14 days' AND t.market_slug LIKE 'nfl-%' AND t.market_slug LIKE '%spread%' GROUP BY 1 ORDER BY 5 DESC LIMIT 60; SELECT identifier, side_norm, intent, line, left(question, 110) AS question FROM us_premap WHERE identifier LIKE 'atc-nfl-ne-sea-%' ORDER BY identifier, side_norm LIMIT 40;"; TO=60000 ;;
                # [R25] see .github/workflows/RENDER_OPS_NOTES.md
                mirror-by-league) SQL="SELECT split_part(b.us_market_slug, '-', 2) AS lg, count(*) AS books, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_books, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, round((100 * sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) / NULLIF(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL), 0))::numeric, 2) AS roi_pct, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl > 0) AS won, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl < 0) AS lost, count(*) FILTER (WHERE b.intent = 'ORDER_INTENT_BUY_SHORT') AS shorts, round(sum(b.realized_pnl)::numeric, 2) AS realized_all FROM mirror_books b WHERE b.opened_at >= now() - interval '7 days' GROUP BY 1 ORDER BY staked DESC NULLS LAST LIMIT 40; SELECT split_part(b.us_market_slug, '-', 1) AS prefix, count(*) AS books, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, round((100 * sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) / NULLIF(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL), 0))::numeric, 2) AS roi_pct, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl > 0) AS won, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl < 0) AS lost FROM mirror_books b WHERE b.opened_at >= now() - interval '7 days' GROUP BY 1 ORDER BY staked DESC NULLS LAST LIMIT 20; SELECT w.what, count(*) AS books, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, round((100 * sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) / NULLIF(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL), 0))::numeric, 2) AS roi_pct, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl > 0) AS won, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl < 0) AS lost, round(sum(b.realized_pnl)::numeric, 2) AS realized_all FROM (VALUES ('24h', now() - interval '24 hours'), ('7d', now() - interval '7 days'), ('life', '2000-01-01'::timestamptz)) AS w(what, since) JOIN mirror_books b ON b.opened_at >= w.since GROUP BY 1 ORDER BY 1;"; TO=60000 ;;
                his-matched) SQL="WITH f AS (SELECT t.condition_id, max(t.market_slug) AS market_slug, split_part(max(t.market_slug), '-', 1) AS lg, max(t.sport) AS sport, t.outcome_index AS oi, sum(CASE WHEN t.side = 'BUY' THEN t.size ELSE 0 END) AS bought, sum(CASE WHEN t.side = 'BUY' THEN t.notional ELSE 0 END) AS cost, count(*) FILTER (WHERE t.side = 'SELL') AS sells FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '7 days' AND t.outcome_index IN (0, 1) GROUP BY t.condition_id, t.outcome_index), m AS (SELECT condition_id, max(market_slug) AS market_slug, max(lg) AS lg, max(sport) AS sport, sum(cost) AS cost, sum(sells) AS sells, COALESCE(max(CASE WHEN oi = 0 THEN bought END), 0) AS b0, COALESCE(max(CASE WHEN oi = 1 THEN bought END), 0) AS b1, max(CASE WHEN oi = 0 THEN cost / NULLIF(bought, 0) END) AS p0, max(CASE WHEN oi = 1 THEN cost / NULLIF(bought, 0) END) AS p1 FROM f GROUP BY condition_id), x AS (SELECT *, LEAST(b0, b1) AS pairs, LEAST(b0, b1) * (COALESCE(p0, 0) + COALESCE(p1, 0)) AS matched_cost FROM m) SELECT lg, count(*) AS markets, count(*) FILTER (WHERE pairs > 0) AS both_sides, round(sum(cost)::numeric, 0) AS cost, round(sum(matched_cost)::numeric, 0) AS matched_cost, round((100 * sum(matched_cost) / NULLIF(sum(cost), 0))::numeric, 1) AS matched_pct, round((sum(pairs * (p0 + p1)) / NULLIF(sum(pairs), 0))::numeric, 4) AS pair_cost, round((sum(cost) - sum(matched_cost))::numeric, 0) AS residual_cost, sum(sells) AS sells FROM x GROUP BY 1 ORDER BY cost DESC LIMIT 40; WITH f AS (SELECT t.condition_id, t.outcome_index AS oi, max(t.sport) AS sport, sum(CASE WHEN t.side = 'BUY' THEN t.size ELSE 0 END) AS bought, sum(CASE WHEN t.side = 'BUY' THEN t.notional ELSE 0 END) AS cost, count(*) FILTER (WHERE t.side = 'SELL') AS sells FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '7 days' AND t.outcome_index IN (0, 1) GROUP BY 1, 2), m AS (SELECT condition_id, max(sport) AS sport, sum(cost) AS cost, sum(sells) AS sells, COALESCE(max(CASE WHEN oi = 0 THEN bought END), 0) AS b0, COALESCE(max(CASE WHEN oi = 1 THEN bought END), 0) AS b1, max(CASE WHEN oi = 0 THEN cost / NULLIF(bought, 0) END) AS p0, max(CASE WHEN oi = 1 THEN cost / NULLIF(bought, 0) END) AS p1 FROM f GROUP BY condition_id), x AS (SELECT *, LEAST(b0, b1) AS pairs, LEAST(b0, b1) * (COALESCE(p0, 0) + COALESCE(p1, 0)) AS matched_cost FROM m) SELECT COALESCE(sport, 'all') AS sport, count(*) AS markets, count(*) FILTER (WHERE pairs > 0) AS both_sides, round(sum(cost)::numeric, 0) AS cost, round(sum(matched_cost)::numeric, 0) AS matched_cost, round((100 * sum(matched_cost) / NULLIF(sum(cost), 0))::numeric, 1) AS matched_pct, round((sum(pairs * (p0 + p1)) / NULLIF(sum(pairs), 0))::numeric, 4) AS pair_cost, sum(sells) AS sells FROM x GROUP BY ROLLUP (sport) ORDER BY cost DESC LIMIT 30; SELECT 'sells 7d' AS what, count(*) FILTER (WHERE t.side = 'SELL') AS sells, count(*) AS fills, round(sum(t.notional) FILTER (WHERE t.side = 'SELL')::numeric, 0) AS sold_usd, round(sum(t.notional)::numeric, 0) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '7 days';"; TO=90000 ;;
                # [R26] see .github/workflows/RENDER_OPS_NOTES.md
                two-legged) SQL="WITH f AS (SELECT 0.000::float8 AS fee), s AS (SELECT DISTINCT ON (condition_id) condition_id, at, detail, COALESCE(detail->>'his_sport', detail->>'sport', 'unclassified') AS sport FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '24 hours' AND COALESCE((detail->>'two_leg_both_sides')::boolean, false) ORDER BY condition_id, at DESC), m AS (SELECT s.sport, s.condition_id, f.fee, COALESCE((s.detail->>'two_leg_mapped')::boolean, false) AS mapped, (s.detail->>'two_leg_his_cost_usd')::float8 AS his_usd, (s.detail->>'two_leg_pair_cost')::float8 AS our_pc, (s.detail->>'two_leg_rest_pair_cost')::float8 AS rest_pc, (s.detail->>'two_leg_his_pair_cost')::float8 AS his_pc, (s.detail->>'two_leg_pair_edge')::float8 AS edge, COALESCE((s.detail->>'two_leg_pair_target')::int, 0) AS tgt, (s.detail->>'two_leg_matched_sh')::float8 AS his_matched, (s.detail->>'two_leg_residual_sh')::float8 AS his_resid, s.detail->>'two_leg_refusal' AS refusal, s.detail->>'two_leg_quote_src' AS qsrc FROM s CROSS JOIN f) SELECT COALESCE(sport, 'ALL') AS sport, count(*) AS both_sides_mkts, count(*) FILTER (WHERE mapped) AS mapped_mkts, round(sum(his_usd)::numeric, 0) AS his_usd, round(COALESCE(sum(his_usd) FILTER (WHERE mapped), 0)::numeric, 0) AS his_usd_mapped, round((100 * COALESCE(sum(his_usd) FILTER (WHERE mapped), 0) / NULLIF(sum(his_usd), 0))::numeric, 1) AS coverage_pct, count(*) FILTER (WHERE our_pc IS NOT NULL) AS priced, round(avg(our_pc)::numeric, 4) AS take_pair_cost, count(*) FILTER (WHERE our_pc + 2 * fee < 1.0) AS take_admissible, round(avg(rest_pc)::numeric, 4) AS rest_pair_cost, count(*) FILTER (WHERE rest_pc + 2 * fee < 1.0) AS rest_admissible, round((100 * count(*) FILTER (WHERE rest_pc + 2 * fee < 1.0) / NULLIF(count(*) FILTER (WHERE rest_pc IS NOT NULL), 0)::float8)::numeric, 1) AS rest_admissible_pct, round(avg(his_pc)::numeric, 4) AS his_pair_cost, round(avg(rest_pc - his_pc)::numeric, 4) AS rest_edge_avg, round(avg(edge)::numeric, 4) AS take_edge_avg, round(avg((1.0 - rest_pc) / 2.0)::numeric, 4) AS breakeven_fee_pc, round((sum(his_matched * (1.0 - rest_pc - 2 * fee)) FILTER (WHERE rest_pc + 2 * fee < 1.0))::numeric, 0) AS his_matched_profit_at_rest, sum(tgt) AS our_pairs, round((sum(tgt * (1.0 - rest_pc - 2 * fee)) FILTER (WHERE rest_pc + 2 * fee < 1.0))::numeric, 2) AS our_profit_at_rest, round(sum(his_resid)::numeric, 0) AS his_residual_sh_declined FROM m GROUP BY ROLLUP (sport) ORDER BY sum(his_usd) DESC NULLS LAST LIMIT 30; WITH r AS (SELECT COALESCE(detail->>'his_sport', detail->>'sport', 'unclassified') AS sport, (detail->>'two_leg_both_obtainable')::boolean AS both_ok, COALESCE((detail->>'two_leg_fill_long')::boolean, false) AS leg_long, COALESCE((detail->>'two_leg_fill_other')::boolean, false) AS leg_other, (detail->>'two_leg_rest_pair_cost')::float8 AS rest_pc, (detail->>'two_leg_his_pair_cost')::float8 AS his_pc, (detail->>'two_leg_touched_s_long')::int AS t_long, (detail->>'two_leg_touched_s_other')::int AS t_other FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '24 hours' AND detail ? 'two_leg_rest_long_px') SELECT COALESCE(sport, 'ALL') AS sport, count(*) AS rests, count(*) FILTER (WHERE both_ok IS NOT NULL) AS judged, count(*) FILTER (WHERE both_ok) AS both_obtainable, round((100 * count(*) FILTER (WHERE both_ok) / NULLIF(count(*) FILTER (WHERE both_ok IS NOT NULL), 0)::float8)::numeric, 1) AS both_pct, count(*) FILTER (WHERE leg_long AND NOT leg_other) AS long_leg_only, count(*) FILTER (WHERE leg_other AND NOT leg_long) AS other_leg_only, count(*) FILTER (WHERE NOT leg_long AND NOT leg_other) AS neither, round(avg(rest_pc)::numeric, 4) AS rest_pair_cost, round(avg(rest_pc) FILTER (WHERE both_ok)::numeric, 4) AS rest_pc_when_both, round(avg(his_pc) FILTER (WHERE both_ok)::numeric, 4) AS his_pc_when_both, round(avg(GREATEST(t_long, t_other)) FILTER (WHERE both_ok)::numeric, 0) AS both_wait_s FROM r GROUP BY ROLLUP (sport) ORDER BY count(*) DESC LIMIT 30; WITH f AS (SELECT 0.000::float8 AS fee), s AS (SELECT DISTINCT ON (condition_id) condition_id, at, detail, COALESCE(detail->>'his_sport', detail->>'sport', 'unclassified') AS sport FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '24 hours' AND COALESCE((detail->>'two_leg_both_sides')::boolean, false) ORDER BY condition_id, at DESC), m AS (SELECT s.sport, s.condition_id, f.fee, COALESCE((s.detail->>'two_leg_mapped')::boolean, false) AS mapped, (s.detail->>'two_leg_his_cost_usd')::float8 AS his_usd, (s.detail->>'two_leg_pair_cost')::float8 AS our_pc, (s.detail->>'two_leg_rest_pair_cost')::float8 AS rest_pc, (s.detail->>'two_leg_his_pair_cost')::float8 AS his_pc, (s.detail->>'two_leg_pair_edge')::float8 AS edge, COALESCE((s.detail->>'two_leg_pair_target')::int, 0) AS tgt, (s.detail->>'two_leg_matched_sh')::float8 AS his_matched, (s.detail->>'two_leg_residual_sh')::float8 AS his_resid, s.detail->>'two_leg_refusal' AS refusal, s.detail->>'two_leg_quote_src' AS qsrc FROM s CROSS JOIN f) SELECT COALESCE(sport, 'ALL') AS sport, CASE WHEN rest_pc IS NULL OR his_pc IS NULL THEN '9 unpriced' WHEN rest_pc - his_pc < -0.02 THEN '1 ours 2c+ better' WHEN rest_pc - his_pc < 0.0 THEN '2 ours better' WHEN rest_pc - his_pc < 0.02 THEN '3 within 2c' WHEN rest_pc - his_pc < 0.05 THEN '4 ours 2-5c worse' ELSE '5 ours 5c+ worse' END AS rest_edge_band, count(*) AS mkts, round(sum(his_usd)::numeric, 0) AS his_usd, round((100 * sum(his_usd) / NULLIF(sum(sum(his_usd)) OVER (PARTITION BY sport), 0))::numeric, 1) AS his_usd_pct, round(avg(rest_pc)::numeric, 4) AS rest_pair_cost, round(avg(his_pc)::numeric, 4) AS his_pair_cost, round(avg(our_pc)::numeric, 4) AS take_pair_cost FROM m GROUP BY ROLLUP (sport), 2 ORDER BY sport NULLS FIRST, 2 LIMIT 80; WITH f AS (SELECT 0.000::float8 AS fee), s AS (SELECT DISTINCT ON (condition_id) condition_id, at, detail, COALESCE(detail->>'his_sport', detail->>'sport', 'unclassified') AS sport FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '24 hours' AND COALESCE((detail->>'two_leg_both_sides')::boolean, false) ORDER BY condition_id, at DESC), m AS (SELECT s.sport, s.condition_id, f.fee, COALESCE((s.detail->>'two_leg_mapped')::boolean, false) AS mapped, (s.detail->>'two_leg_his_cost_usd')::float8 AS his_usd, (s.detail->>'two_leg_pair_cost')::float8 AS our_pc, (s.detail->>'two_leg_rest_pair_cost')::float8 AS rest_pc, (s.detail->>'two_leg_his_pair_cost')::float8 AS his_pc, (s.detail->>'two_leg_pair_edge')::float8 AS edge, COALESCE((s.detail->>'two_leg_pair_target')::int, 0) AS tgt, (s.detail->>'two_leg_matched_sh')::float8 AS his_matched, (s.detail->>'two_leg_residual_sh')::float8 AS his_resid, s.detail->>'two_leg_refusal' AS refusal, s.detail->>'two_leg_quote_src' AS qsrc FROM s CROSS JOIN f) SELECT COALESCE(refusal, CASE WHEN tgt > 0 THEN '(a pair)' ELSE '(none)' END) AS refusal, COALESCE(qsrc, '(unmapped)') AS quote_src, count(*) AS mkts, round(sum(his_usd)::numeric, 0) AS his_usd, round(avg(our_pc)::numeric, 4) AS take_pair_cost, round(avg(rest_pc)::numeric, 4) AS rest_pair_cost, round(avg(his_pc)::numeric, 4) AS his_pair_cost, sum(tgt) AS our_pairs FROM m GROUP BY 1, 2 ORDER BY sum(his_usd) DESC NULLS LAST LIMIT 30;"; TO=120000 ;;
                # [R27] see .github/workflows/RENDER_OPS_NOTES.md
                outcome-census) SQL="WITH his AS (SELECT t.condition_id, COALESCE(NULLIF(m.sport, 'unclassified'), NULLIF(t.sport, 'unclassified'), 'unclassified') AS sport, max(t.outcome_index) AS max_oi, count(DISTINCT t.outcome_index) AS n_idx, count(DISTINCT t.asset) AS n_assets, sum(t.size * t.price) AS usd, count(*) AS fills, max(t.market_slug) AS slug FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '7 days' AND t.condition_id IS NOT NULL GROUP BY 1, 2) SELECT COALESCE(sport, 'ALL') AS sport, count(*) AS markets, count(*) FILTER (WHERE max_oi >= 2) AS oi_ge_2, round(COALESCE(sum(usd) FILTER (WHERE max_oi >= 2), 0)::numeric, 0) AS usd_oi_ge_2, count(*) FILTER (WHERE n_assets > 2) AS over_2_tokens, round(COALESCE(sum(usd) FILTER (WHERE n_assets > 2), 0)::numeric, 0) AS usd_over_2_tokens, count(*) FILTER (WHERE n_idx = 1) AS one_side, count(*) FILTER (WHERE n_idx = 2) AS two_sides, round(sum(usd)::numeric, 0) AS usd, sum(fills) AS fills FROM his GROUP BY ROLLUP (sport) ORDER BY sum(usd) DESC LIMIT 30; WITH his AS (SELECT DISTINCT t.condition_id FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '7 days' AND t.condition_id IS NOT NULL), mt AS (SELECT k.condition_id, count(*) AS tokens, max(k.outcome_index) AS max_oi, string_agg(DISTINCT COALESCE(k.outcome, '(null)'), '/' ORDER BY COALESCE(k.outcome, '(null)')) AS outcomes FROM market_tokens k JOIN his ON his.condition_id = k.condition_id GROUP BY 1) SELECT tokens, max_oi, count(*) AS conditions, left(string_agg(DISTINCT outcomes, ' | '), 90) AS sample_outcomes FROM mt GROUP BY 1, 2 ORDER BY 1, 2 LIMIT 20; WITH his AS (SELECT t.condition_id, COALESCE(NULLIF(m.sport, 'unclassified'), NULLIF(t.sport, 'unclassified'), 'unclassified') AS sport, max(t.outcome_index) AS max_oi, count(DISTINCT t.asset) AS n_assets, sum(t.size * t.price) AS usd, max(t.market_slug) AS slug, max(left(t.market_title, 40)) AS title FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '7 days' AND t.condition_id IS NOT NULL GROUP BY 1, 2) SELECT left(slug, 40) AS slug, sport, max_oi, n_assets, round(usd::numeric, 0) AS usd, title FROM his WHERE max_oi >= 2 OR n_assets > 2 ORDER BY usd DESC LIMIT 30;"; TO=60000 ;;
                # [R28] see .github/workflows/RENDER_OPS_NOTES.md
