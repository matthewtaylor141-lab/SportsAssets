                paired-day) SQL="WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, round((sum(b.avg_cost * abs(b.ledger_net)) / NULLIF(sum(abs(b.ledger_net)), 0))::numeric, 4) AS our_avg FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)) t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND m.resolved_prices IS NOT NULL GROUP BY t.condition_id), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('open', 'increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, his.his_avg, bk.our_avg, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT * FROM pair ORDER BY abs(COALESCE(our_settled, 0)) DESC LIMIT 60; WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, round((sum(b.avg_cost * abs(b.ledger_net)) / NULLIF(sum(abs(b.ledger_net)), 0))::numeric, 4) AS our_avg FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, b