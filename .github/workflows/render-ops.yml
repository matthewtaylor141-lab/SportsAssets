                learn-v2) need_confirm; SQL="ALTER TABLE bettor_learn_prediction ADD COLUMN IF NOT EXISTS validity TEXT; ALTER TABLE bettor_learn_prediction ADD COLUMN IF NOT EXISTS validity_note TEXT; ALTER TABLE bettor_learn_prediction ADD COLUMN IF NOT EXISTS artifact_sha TEXT; ALTER TABLE bettor_learn_prediction ADD COLUMN IF NOT EXISTS written_at DOUBLE PRECISION; ALTER TABLE bettor_learn_model ADD COLUMN IF NOT EXISTS artifact_sha TEXT; UPDATE bettor_learn_prediction SET validity = 'INVALID_AS_ENTRY_TIME', written_at = 1790167515.0, validity_note = 'written 796-1361 s AFTER the entry (22-38% of the 1 h horizon already elapsed), so it cannot be read as an entry-time forecast of the whole hour. Features ARE entry-time and no qualifying complement had been seen in the extract through 12:43:28Z, but the write is 107 s after that cutoff, leaving a blind window. PRESERVED, not deleted. The target these rows actually answer is v2''s conditional one.' WHERE validity IS NULL AND model_id = (SELECT id FROM bettor_learn_model WHERE model_key='rn1_complement_1h' AND version=1); UPDATE bettor_learn_model SET status='SUPERSEDED_TARGET_MISMATCH' WHERE model_key='rn1_complement_1h' AND version=1; INSERT INTO bettor_learn_model (model_key, version, kind, target, horizon_s, kernel, dataset_sha, train_cutoff, calib_cutoff, code_sha, params, evaluation, status, trained_at, note, artifact_sha) VALUES ('rn1_complement_1h', 2, 'RIDGE_LOGISTIC', 'COMPLEMENT_FILL_IN_REMAINDER_GIVEN_SURVIVAL', 3600.0, 'BETTOR_LEARN_KERNEL_V1', '81b249a86f52423380ae4df8667355ec', 0, 0, '3e65990231d40fbf14c1534e77729166df36ff79', '{\"artifact\":{\"center\":[0.43913634085213044,0.24411328320801984,4.467655776693643,3.314914978799927,0.6215538847117794,1.8120300751879699,3.4434622044466088,2.7290178654476485,2.385140429402783,3.236016362894544,0.43107769423558895,0.5608636591478698,-0.5493939148100532,0.010236420906722362],\"coef\":[-0.16525510590175757,-0.2439736526227832,-0.8675846371132621,0.9011367477073621,0.02801304124281362,0.9349182981644228,-0.423774460529185,0.08240053943513503,0.3511386733980408,-0.5385064492044412,-0.1254425081076909,0.1652551059017541,-0.0230706600702276,-0.06430329929358003],\"converged\":true,\"features\":[\"entry_price\",\"entry_price_dist_from_half\",\"entry_size_log\",\"entry_notional_log\",\"is_outcome_one\",\"prior_fills_this_market\",\"prior_qty_same_leg_log\",\"prior_cost_same_leg_log\",\"seconds_since_prev_fill_this_market_log\",\"seconds_since_first_fill_this_market_log\",\"is_first_fill_in_market\",\"complement_price_if_symmetric\",\"hour_of_day_sin\",\"hour_of_day_cos\"],\"intercept\":-0.8721764996375061,\"kernel\":\"BETTOR_LEARN_KERNEL_V1\",\"kind\":\"RIDGE_LOGISTIC\",\"l2\":1.0,\"n_iter\":6,\"n_rows\":399,\"pos_rate\":0.3082706766917293,\"scale\":[0.29091435950991995,0.16954130628061054,2.175714809761159,2.184557239559855,0.4849996423828313,2.8979736484767935,3.4141226243125904,2.9236060825614647,2.739188641248827,3.2463103451827826,0.4952269336053085,0.29091435950992,0.5530513615375838,0.6262553261714657]},\"artifact_sha256\":\"81b249a86f52423380ae4df8667355ecda0757f08a6d775e4db0b7f1eae81f69\",\"coverage_exclusions\":[[1789924593.0,1789930561.0]],\"elapsed_s\":1117,\"estimator\":\"RIDGE_LOGISTIC\",\"exclusion_reason\":\"UNEXPLAINED DETECTION GAP 2026-09-19 17:16-18:56Z; no source-health record, cursor or reconnect log examined\",\"features\":[\"entry_price\",\"entry_price_dist_from_half\",\"entry_size_log\",\"entry_notional_log\",\"is_outcome_one\",\"prior_fills_this_market\",\"prior_qty_same_leg_log\",\"prior_cost_same_leg_log\",\"seconds_since_prev_fill_this_market_log\",\"seconds_since_first_fill_this_market_log\",\"is_first_fill_in_market\",\"complement_price_if_symmetric\",\"hour_of_day_sin\",\"hour_of_day_cos\"],\"horizon_s\":3600.0,\"l2\":1.0,\"scoring_rule\":\"predictions are scored by loading THIS artifact, never by refitting. A refit that reproduces a base rate does not establish identical coefficients.\"}'::jsonb, '{\"claim\":\"performance on ONE HISTORICAL SPLIT of a 10-day 1-in-20 condition sample of one account. EVAL had 65 decided rows across 23 conditions. Ridge was chosen AFTER comparing EVAL results, so that split served MODEL SELECTION and these numbers are not an unbiased estimate of future skill.\",\"conditional\":{\"base_log_loss\":0.7913199565838046,\"dropped_completed_early\":437,\"elapsed_s\":1117.0,\"eval_conditions\":23,\"eval_n\":65,\"eval_observed\":0.5230769230769231,\"n_rows\":749,\"ridge_auc\":0.7058823529411765,\"ridge_ece\":0.21303576719750367,\"ridge_log_loss\":0.7402143388030669,\"ridge_skill\":0.0645827485526399,\"tag\":\"CONDITIONAL, 1117s elapsed\",\"target\":\"COMPLEMENT_FILL_IN_REMAINDER_GIVEN_SURVIVAL\",\"train_base_rate\":0.3082706766917293},\"not_a_reason\":\"these coefficients describe an association in observed fills. They are not RN1''s reason for acting and no causal reading is offered.\",\"prior_inspection\":\"all rows at or before the CALIB boundary were inspected while this pipeline was built.\",\"unconditional_for_contrast\":{\"base_log_loss\":0.6160037935790971,\"dropped_completed_early\":0,\"elapsed_s\":0.0,\"eval_conditions\":31,\"eval_n\":114,\"eval_observed\":0.7280701754385965,\"n_rows\":1186,\"ridge_auc\":0.7252234745433346,\"ridge_ece\":0.08357393564827842,\"ridge_log_loss\":0.5172388281752892,\"ridge_skill\":0.16033174865687916,\"tag\":\"UNCONDITIONAL entry-time\",\"target\":\"COMPLEMENT_FILL_WITHIN_H\",\"train_base_rate\":0.6098591549295774}}'::jsonb, 'FROZEN', 1790168043.3803897, 'CONDITIONAL target: completion in the REMAINDER of the hour given no completion in the first 1117 s. FROZEN for prospective assessment -- ridge was selected on the EVAL split, so that split is spent.', '81b249a86f52423380ae4df8667355ecda0757f08a6d775e4db0b7f1eae81f69') ON CONFLICT (model_key, version) DO NOTHING; SELECT model_key, version, status, target, left(artifact_sha,16) AS artifact, to_timestamp(trained_at)::timestamptz(0) AS trained FROM bettor_learn_model ORDER BY version; SELECT m.version, p.validity, count(*) AS n, count(*) FILTER (WHERE p.outcome IS NULL) AS unmatured FROM bettor_learn_prediction p JOIN bettor_learn_model m ON m.id=p.model_id GROUP BY 1,2 ORDER BY 1,2;"; TO=60000 ;;
                # [R92] OUR OWN ORDER HISTORY. The EXECUTION side,
                # which the cohort model cannot speak to at all.
                # P_FILL is the probability OUR resting order fills, and
                # only our own admitted orders can measure it. This asks
                # what order history actually exists, by state, so the
                # execution baseline is built on what is there rather
                # than on what would be convenient. SELECT only.
                exec-history) SQL="SELECT 'live_orders' AS t, count(*) AS n, count(*) FILTER (WHERE status IS NOT NULL) AS with_status, min(placed_at)::timestamptz(0) AS first, max(placed_at)::timestamptz(0) AS last FROM live_orders; SELECT status, count(*) AS n FROM live_orders GROUP BY status ORDER BY 2 DESC LIMIT 15; SELECT 'mirror_orders' AS t, count(*) AS n, min(placed_at)::timestamptz(0) AS first, max(placed_at)::timestamptz(0) AS last FROM mirror_orders; SELECT state, count(*) AS n FROM mirror_orders GROUP BY state ORDER BY 2 DESC LIMIT 15; SELECT 'engine_fills' AS t, count(*) AS n FROM engine_fills; SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='live_orders' ORDER BY ordinal_position;"; TO=60000 ;;
                # [R93] FERRARI'S DECOMPOSITION, from the fills.
                # Identity FIRST: the wallet is
                # 0xfe787d2d... per 021_seed_dossier_promotions.sql,
                # and BETA48_STATE records that Ferrari is NOT 0x2c33,
                # which is a separate account -- so all three rows are
                # returned and the join keys on the WALLET, never the
                # username, whose casing differs between code and data.
                #
                # Then per condition: quantity and cost on each leg,
                # the PAIRED quantity (the lesser leg), the RESIDUAL
                # (the difference), and the pair price. A pair price
                # below 1.00 is a pair that clears; above it is a pair
                # that locks a loss, which is why pairing FREQUENTLY is
                # not the same as pairing PROFITABLY. SELECT only.
                # [R88] THE LEARNING TABLES. Migration, then a
                # CATALOG READ-BACK -- a CREATE that returned no error
                # is not evidence the table is right.
                #
                # bettor_learn_model holds a versioned, immutable model
                # with its dataset digest, BOTH cutoffs, the code sha
                # and its evaluation. bettor_learn_prediction holds a
                # prediction recorded BEFORE its outcome can exist:
                # `matures_at` is when the horizon closes, and outcome
                # is NULL until then. The unique index makes
                # re-predicting one decision impossible, which is what
                # stops a prospective record quietly becoming a
                # hindsight one.
                learn-schema) need_confirm; SQL="CREATE TABLE IF NOT EXISTS bettor_learn_model ( id BIGSERIAL PRIMARY KEY, model_key TEXT NOT NULL, version INTEGER NOT NULL, kind TEXT NOT NULL, target TEXT NOT NULL, horizon_s DOUBLE PRECISION NOT NULL, kernel TEXT NOT NULL, dataset_sha TEXT NOT NULL, train_cutoff DOUBLE PRECISION NOT NULL, calib_cutoff DOUBLE PRECISION NOT NULL, code_sha TEXT NOT NULL, params JSONB NOT NULL, evaluation JSONB NOT NULL, status TEXT NOT NULL, trained_at DOUBLE PRECISION NOT NULL, note TEXT, superseded_by BIGINT ); CREATE UNIQUE INDEX IF NOT EXISTS bettor_learn_model_kv ON bettor_learn_model (model_key, version); CREATE INDEX IF NOT EXISTS bettor_learn_model_active ON bettor_learn_model (model_key, status, trained_at DESC); CREATE TABLE IF NOT EXISTS bettor_learn_prediction ( id BIGSERIAL PRIMARY KEY, model_id BIGINT NOT NULL REFERENCES bettor_learn_model (id), subject TEXT NOT NULL, condition_id TEXT NOT NULL, outcome_index INTEGER NOT NULL, decision_at DOUBLE PRECISION NOT NULL, horizon_s DOUBLE PRECISION NOT NULL, matures_at DOUBLE PRECISION NOT NULL, p DOUBLE PRECISION NOT NULL, p_calibrated DOUBLE PRECISION, baseline_p DOUBLE PRECISION NOT NULL, features JSONB NOT NULL, input_sha TEXT NOT NULL, recorded_at DOUBLE PRECISION NOT NULL, outcome INTEGER, outcome_at DOUBLE PRECISION, outcome_source TEXT, resolved_at DOUBLE PRECISION ); CREATE UNIQUE INDEX IF NOT EXISTS bettor_learn_prediction_once ON bettor_learn_prediction (model_id, subject, condition_id, outcome_index, decision_at); CREATE INDEX IF NOT EXISTS bettor_learn_prediction_due ON bettor_learn_prediction (matures_at) WHERE outcome IS NULL; SELECT table_name, column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name IN ('bettor_learn_model','bettor_learn_prediction') ORDER BY table_name, ordinal_position; SELECT indexname FROM pg_indexes WHERE tablename IN ('bettor_learn_model','bettor_learn_prediction') ORDER BY indexname;"; TO=60000 ;;
                learn-inventory) SQL="SELECT model_key, version, kind, target, horizon_s, status, left(dataset_sha,12) AS dataset, left(code_sha,12) AS code, to_timestamp(train_cutoff)::timestamptz(0) AS train_cutoff, to_timestamp(trained_at)::timestamptz(0) AS trained, superseded_by FROM bettor_learn_model ORDER BY model_key, version; SELECT m.model_key, m.version, count(p.*) AS predictions, count(p.*) FILTER (WHERE p.outcome IS NOT NULL) AS matured, count(p.*) FILTER (WHERE p.outcome = 1) AS positives, min(to_timestamp(p.decision_at))::timestamptz(0) AS first_decision, max(to_timestamp(p.decision_at))::timestamptz(0) AS last_decision, min(to_timestamp(p.matures_at)) FILTER (WHERE p.outcome IS NULL)::timestamptz(0) AS next_matures FROM bettor_learn_model m LEFT JOIN bettor_learn_prediction p ON p.model_id = m.id GROUP BY m.model_key, m.version ORDER BY m.model_key, m.version;"; TO=60000 ;;
                learn-drop) need_confirm; SQL="DO \$\$ DECLARE n bigint; BEGIN IF to_regclass('public.bettor_learn_prediction') IS NULL THEN RAISE NOTICE 'absent'; RETURN; END IF; EXECUTE 'SELECT count(*) FROM bettor_learn_prediction' INTO n; IF n > 0 THEN RAISE EXCEPTION 'refused: % predictions exist. A prospective record is evidence and is not dropped to roll back code', n; END IF; DROP TABLE bettor_learn_prediction; DROP TABLE bettor_learn_model; END \$\$; SELECT CASE WHEN to_regclass('public.bettor_learn_model') IS NULL THEN 'absent' ELSE 'still present' END AS state;"; TO=60000 ;;
                # [R09] see .github/workflows/RENDER_OPS_NOTES.md
                mirror-preflight) SQL="SELECT what, value FROM (SELECT key AS what, left(value::text, 240) AS value FROM ingestion_state WHERE key IN ('mirror_live','mirror_live_whales','mirror_live_demoted','mirror_loss_stop','mapping_quarantine','premap_live','side_echo_last','live_trading_paused','copy_overspend_halt','live_verified_whales','live_clip_overrides','workers_boot','roster_auto_last') UNION ALL SELECT 'zz mirror_books live/24h', (SELECT count(*) FILTER (WHERE state <> 'closed') || '/' || count(*) FILTER (WHERE opened_at > now() - interval '24 hours') FROM mirror_books) UNION ALL SELECT 'zz mirror_orders by state', (SELECT COALESCE(string_agg(state || '=' || n, ' ' ORDER BY state), 'none') FROM (SELECT state, count(*) AS n FROM mirror_orders GROUP BY state) s) UNION ALL SELECT 'zz kalshi_claims rn1 24h', (SELECT count(*) FROM kalshi_claims WHERE lower(whale) = 'rn1' AND claimed_at > now() - interval '24 hours')::text UNION ALL SELECT 'zz live_orders 24h by status', (SELECT COALESCE(string_agg(status || '=' || n, ' ' ORDER BY status), 'none') FROM (SELECT status, count(*) AS n FROM live_orders WHERE placed_at > now() - interval '24 hours' GROUP BY status) s) UNION ALL SELECT 'zz live_orders last placed', (SELECT COALESCE(max(placed_at)::text, 'none') FROM live_orders)) t ORDER BY what;"; TO=30000 ;;
                # [R10] see .github/workflows/RENDER_OPS_NOTES.md
                mirror-rearm) need_confirm; SQL="WITH gone AS (DELETE FROM ingestion_state WHERE key = 'mirror_loss_stop' RETURNING value) INSERT INTO ingestion_state (key, value) VALUES ('mirror_loss_rearm', jsonb_build_object('at', now(), 'by', 'render-ops', 'prior', (SELECT value FROM gone))) ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value; SELECT key, value FROM ingestion_state WHERE key LIKE 'mirror_%' ORDER BY key;"; TO=30000 ;;
