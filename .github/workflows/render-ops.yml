now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM hf t JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE m.resolved_prices IS NOT NULL GROUP BY t.condition_id), axf AS (SELECT f.condition_id, f.ts, f.id, f.size, ax.short, (CASE WHEN f.asset = ax.long_asset THEN 1 WHEN f.asset = ax.other_asset THEN -1 END) * (CASE WHEN upper(f.side) = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN ax.short THEN -1 ELSE 1 END) * f.size AS sgn_sh, CASE WHEN ax.short THEN 1 - (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) ELSE (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) END AS px_leg FROM hf f JOIN ax ON ax.condition_id = f.condition_id WHERE f.asset = ax.long_asset OR f.asset = ax.other_asset), run AS (SELECT a.*, sum(a.sgn_sh) OVER (PARTITION BY a.condition_id ORDER BY a.ts, a.id) AS running FROM axf a), pk AS (SELECT DISTINCT ON (condition_id) condition_id, CASE WHEN running < 0 THEN -1 ELSE 1 END AS ps FROM run ORDER BY condition_id, abs(running) DESC, ts, id), net AS (SELECT r.condition_id, max(abs(r.running)) AS his_net_peak, sum((CASE WHEN pk.ps > 0 THEN r.px_leg ELSE 1 - r.px_leg END) * greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))) / NULLIF(sum(greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))), 0) AS his_vwap_adds FROM run r JOIN pk ON pk.condition_id = r.condition_id GROUP BY 1), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), oavg AS (SELECT b.condition_id, round((sum((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - o.avg_px ELSE o.avg_px END) * o.filled) / NULLIF(sum(o.filled), 0))::numeric, 4) AS avg_leg FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.filled > 0 AND o.avg_px IS NOT NULL AND ((b.intent <> 'ORDER_INTENT_BUY_SHORT' AND o.side = 'BUY_LONG') OR (b.intent = 'ORDER_INTENT_BUY_SHORT' AND o.side = 'SELL_LONG')) AND b.condition_id IN (SELECT condition_id FROM bk) GROUP BY 1), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, round(net.his_net_peak::numeric, 1) AS his_net_peak, round(net.his_vwap_adds::numeric, 4) AS his_vwap_adds, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds IS NOT NULL THEN round((net.his_net_peak * net.his_vwap_adds)::numeric, 2) END AS his_cost_net, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((his.pnl / (net.his_net_peak * net.his_vwap_adds))::numeric, 3) END AS his_roi_net, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / his.cost))::numeric, 2) END AS roi_ratio, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / (net.his_net_peak * net.his_vwap_adds)))::numeric, 2) END AS roi_ratio_net, CASE WHEN his.pnl <> 0 AND bk.settled IS NOT NULL THEN round((bk.settled / his.pnl)::numeric, 4) END AS pnl_ratio, round(COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0))::numeric, 1) AS our_peak_sh, CASE WHEN net.his_net_peak > 0 AND COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) > 0 THEN round((100 * COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) / net.his_net_peak)::numeric, 1) END AS share_frac_pct, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((100 * bk.staked / (net.his_net_peak * net.his_vwap_adds))::numeric, 1) END AS stake_frac_net_pct, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_gross_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN net ON net.condition_id = bk.condition_id LEFT JOIN oavg ON oavg.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT * FROM pair ORDER BY abs(COALESCE(our_settled, 0)) DESC LIMIT 60; WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, CASE WHEN bool_and(b.avg_cost IS NOT NULL OR COALESCE(b.peak_exposure_usd, 0) = 0) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) THEN max(b.peak_exposure_usd / NULLIF(CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - b.avg_cost ELSE b.avg_cost END, 0)) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) END AS peak_sh FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') AND b.opened_at >= '$PS'::timestamptz GROUP BY b.condition_id), ax AS (SELECT DISTINCT ON (b.condition_id) b.condition_id, b.long_asset, b.other_asset, (b.intent = 'ORDER_INTENT_BUY_SHORT') AS short FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') AND b.opened_at >= '$PS'::timestamptz ORDER BY b.condition_id, b.id), hf AS (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM hf t JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE m.resolved_prices IS NOT NULL GROUP BY t.condition_id), axf AS (SELECT f.condition_id, f.ts, f.id, f.size, ax.short, (CASE WHEN f.asset = ax.long_asset THEN 1 WHEN f.asset = ax.other_asset THEN -1 END) * (CASE WHEN upper(f.side) = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN ax.short THEN -1 ELSE 1 END) * f.size AS sgn_sh, CASE WHEN ax.short THEN 1 - (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) ELSE (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) END AS px_leg FROM hf f JOIN ax ON ax.condition_id = f.condition_id WHERE f.asset = ax.long_asset OR f.asset = ax.other_asset), run AS (SELECT a.*, sum(a.sgn_sh) OVER (PARTITION BY a.condition_id ORDER BY a.ts, a.id) AS running FROM axf a), pk AS (SELECT DISTINCT ON (condition_id) condition_id, CASE WHEN running < 0 THEN -1 ELSE 1 END AS ps FROM run ORDER BY condition_id, abs(running) DESC, ts, id), net AS (SELECT r.condition_id, max(abs(r.running)) AS his_net_peak, sum((CASE WHEN pk.ps > 0 THEN r.px_leg ELSE 1 - r.px_leg END) * greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))) / NULLIF(sum(greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))), 0) AS his_vwap_adds FROM run r JOIN pk ON pk.condition_id = r.condition_id GROUP BY 1), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), oavg AS (SELECT b.condition_id, round((sum((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - o.avg_px ELSE o.avg_px END) * o.filled) / NULLIF(sum(o.filled), 0))::numeric, 4) AS avg_leg FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.filled > 0 AND o.avg_px IS NOT NULL AND ((b.intent <> 'ORDER_INTENT_BUY_SHORT' AND o.side = 'BUY_LONG') OR (b.intent = 'ORDER_INTENT_BUY_SHORT' AND o.side = 'SELL_LONG')) AND b.condition_id IN (SELECT condition_id FROM bk) GROUP BY 1), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, round(net.his_net_peak::numeric, 1) AS his_net_peak, round(net.his_vwap_adds::numeric, 4) AS his_vwap_adds, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds IS NOT NULL THEN round((net.his_net_peak * net.his_vwap_adds)::numeric, 2) END AS his_cost_net, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((his.pnl / (net.his_net_peak * net.his_vwap_adds))::numeric, 3) END AS his_roi_net, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / his.cost))::numeric, 2) END AS roi_ratio, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / (net.his_net_peak * net.his_vwap_adds)))::numeric, 2) END AS roi_ratio_net, CASE WHEN his.pnl <> 0 AND bk.settled IS NOT NULL THEN round((bk.settled / his.pnl)::numeric, 4) END AS pnl_ratio, round(COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0))::numeric, 1) AS our_peak_sh, CASE WHEN net.his_net_peak > 0 AND COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) > 0 THEN round((100 * COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) / net.his_net_peak)::numeric, 1) END AS share_frac_pct, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((100 * bk.staked / (net.his_net_peak * net.his_vwap_adds))::numeric, 1) END AS stake_frac_net_pct, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_gross_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN net ON net.condition_id = bk.condition_id LEFT JOIN oavg ON oavg.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT t.*, format('PAIRED %s mkts (%s staked, %s zero-stake dropped) his_roi_net %s our_roi %s roi_ratio_net %sx gross his_roi %s roi_ratio %sx same %s/%s opposite %s share_frac_med %s%% stake_frac_net_med %s%% cents_over %sc lat_med %ss', t.markets, t.staked_mkts, t.zero_stake_mkts, t.his_roi_net, t.our_roi, t.roi_ratio_net, t.his_roi, t.roi_ratio, t.same_sign, t.markets, COALESCE(t.opposite, '-'), t.share_frac_med_pct, t.stake_frac_net_med_pct, t.cents_over_med, t.lat_med_s) AS line FROM (SELECT count(*) AS markets, count(*) FILTER (WHERE COALESCE(our_staked, 0) > 0) AS staked_mkts, count(*) FILTER (WHERE COALESCE(our_staked, 0) <= 0) AS zero_stake_mkts, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) <= 0)::numeric, 2) AS zero_stake_settled, round(sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost, round(sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost_net, round(sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_pnl, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi, CASE WHEN sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi_net, round(sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_staked, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_settled, CASE WHEN sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS our_roi, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round(((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)) / (sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)))::numeric, 2) END AS roi_ratio, CASE WHEN sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round(((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)) / (sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0)))::numeric, 2) END AS roi_ratio_net, CASE WHEN sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS pnl_ratio, count(*) FILTER (WHERE sign_agree = 'same') AS same_sign, count(*) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite_sign, string_agg(book::text || '(' || COALESCE(last_reason, '?') || ')', ',' ORDER BY abs(COALESCE(our_settled, 0)) DESC) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY share_frac_pct)::numeric, 1) AS share_frac_med_pct, round(min(share_frac_pct)::numeric, 1) AS share_frac_min_pct, round(max(share_frac_pct)::numeric, 1) AS share_frac_max_pct, count(share_frac_pct) AS share_frac_n, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY stake_frac_net_pct)::numeric, 1) AS stake_frac_net_med_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY frac_gross_pct)::numeric, 1) AS frac_gross_med_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY cents_over)::numeric, 1) AS cents_over_med, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lat_med_s)::numeric, 0) AS lat_med_s FROM pair) t;"; TO=120000 ;;
                # [R47] see .github/workflows/RENDER_OPS_NOTES.md
                latency-census) SQL="WITH fp AS (SELECT x.id, x.fast FROM xmltable('/table/row' PASSING (CASE WHEN NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'mirror_orders' AND column_name = 'fast') THEN '<table/>'::xml ELSE query_to_xml('SELECT id, fast FROM mirror_orders WHERE fast IS NOT NULL AND placed_at >= now() - interval ''6 hours''', false, false, '') END) COLUMNS id bigint PATH 'id', fast boolean PATH 'fast') x), o AS (SELECT o.id, o.book_id, o.kind, o.side, o.tif, o.state, o.filled, o.qty, o.placed_at, o.done_at, b.condition_id, left(b.us_market_slug, 30) AS slug, (SELECT max(t.ts) FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) AS his_ts, o.his_fill_id, COALESCE(fp.fast::text, 'unrecorded') AS path FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id LEFT JOIN fp ON fp.id = o.id WHERE o.placed_at >= now() - interval '6 hours' AND o.kind IN ('open', 'increase', 'reduce', 'take', 'flatten_paired', 'flatten_vanished')) SELECT date_trunc('hour', placed_at)::time(0) AS hour, kind, path, count(*) AS n, count(*) FILTER (WHERE filled > 0) AS filled, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (placed_at - his_ts)))::numeric, 0) AS his_to_order_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY extract(epoch FROM (placed_at - his_ts)))::numeric, 0) AS his_to_order_p90_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (done_at - placed_at))) FILTER (WHERE filled > 0 AND done_at IS NOT NULL)::numeric, 0) AS order_to_fill_med_s FROM o WHERE his_ts IS NOT NULL GROUP BY 1, 2, 3 ORDER BY 1 DESC, 2, 3; WITH fp AS (SELECT x.id, x.fast FROM xmltable('/table/row' PASSING (CASE WHEN NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'mirror_orders' AND column_name = 'fast') THEN '<table/>'::xml ELSE query_to_xml('SELECT id, fast FROM mirror_orders WHERE fast IS NOT NULL AND placed_at >= now() - interval ''6 hours''', false, false, '') END) COLUMNS id bigint PATH 'id', fast boolean PATH 'fast') x), o AS (SELECT o.id, o.book_id, o.kind, o.side, o.tif, o.state, o.filled, o.qty, o.placed_at, o.done_at, b.condition_id, left(b.us_market_slug, 30) AS slug, (SELECT max(t.ts) FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) AS his_ts, o.his_fill_id, COALESCE(fp.fast::text, 'unrecorded') AS path FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id LEFT JOIN fp ON fp.id = o.id WHERE o.placed_at >= now() - interval '6 hours' AND o.kind IN ('open', 'increase', 'reduce', 'take', 'flatten_paired', 'flatten_vanished')), pf AS (SELECT DISTINCT ON (o.book_id, o.his_fill_id) o.book_id, o.his_fill_id, o.kind, o.path, o.placed_at AS first_order, (SELECT t.ts FROM trades t WHERE t.id = CASE WHEN o.his_fill_id !~ '[^0-9]' AND length(o.his_fill_id) BETWEEN 1 AND 18 THEN o.his_fill_id::bigint END) AS fill_ts FROM o WHERE o.his_fill_id IS NOT NULL ORDER BY o.book_id, o.his_fill_id, o.placed_at, o.id) SELECT date_trunc('hour', first_order)::time(0) AS hour, kind, path, count(DISTINCT (book_id, his_fill_id)) AS fills, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (first_order - fill_ts)))::numeric, 0) AS his_to_first_order_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY extract(epoch FROM (first_order - fill_ts)))::numeric, 0) AS his_to_first_order_p90_s FROM pf WHERE fill_ts IS NOT NULL GROUP BY 1, 2, 3 ORDER BY 1 DESC, 2, 3; WITH fr AS (SELECT x.fill_id, x.fill_ts, x.book_id, x.rest_id, x.cause FROM xmltable('/table/row' PASSING (CASE WHEN to_regclass('mirror_fill_answers') IS NULL OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'mirror_fill_answers' AND column_name = 'rest_id') THEN '<table/>'::xml ELSE query_to_xml('SELECT fill_id, fill_ts, book_id, rest_id, cause FROM mirror_fill_answers WHERE whale = ''rn1'' AND rest_id IS NOT NULL AND fill_ts >= extract(epoch FROM now() - interval ''6 hours'')', false, false, '') END) COLUMNS fill_id text PATH 'fill_id', fill_ts float8 PATH 'fill_ts', book_id bigint PATH 'book_id', rest_id bigint PATH 'rest_id', cause text PATH 'cause') x), nx AS (SELECT o.id, o.book_id, LEAD(o.id) OVER (PARTITION BY o.book_id ORDER BY o.placed_at, o.id) AS next_id, LEAD(o.placed_at) OVER (PARTITION BY o.book_id ORDER BY o.placed_at, o.id) AS next_at FROM mirror_orders o WHERE o.placed_at >= now() - interval '12 hours' AND o.kind IN ('open', 'increase', 'reduce', 'take', 'flatten_paired', 'flatten_vanished')) SELECT COALESCE(fr.cause, 'unrecorded') AS cause, count(*) AS fills_behind_rest, count(nx.next_id) AS replaced, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (extract(epoch FROM nx.next_at) - fr.fill_ts)) FILTER (WHERE nx.next_id IS NOT NULL)::numeric, 0) AS keep_to_replace_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY (extract(epoch FROM nx.next_at) - fr.fill_ts)) FILTER (WHERE nx.next_id IS NOT NULL)::numeric, 0) AS keep_to_replace_p90_s FROM fr LEFT JOIN nx ON nx.id = fr.rest_id AND nx.book_id = fr.book_id GROUP BY 1 ORDER BY 1; WITH fp AS (SELECT x.id, x.fast FROM xmltable('/table/row' PASSING (CASE WHEN NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'mirror_orders' AND column_name = 'fast') THEN '<table/>'::xml ELSE query_to_xml('SELECT id, fast FROM mirror_orders WHERE fast IS NOT NULL AND placed_at >= now() - interval ''6 hours''', false, false, '') END) COLUMNS id bigint PATH 'id', fast boolean PATH 'fast') x), o AS (SELECT o.id, o.book_id, o.kind, o.side, o.tif, o.state, o.filled, o.qty, o.placed_at, o.done_at, b.condition_id, left(b.us_market_slug, 30) AS slug, (SELECT max(t.ts) FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) AS his_ts, o.his_fill_id, COALESCE(fp.fast::text, 'unrecorded') AS path FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id LEFT JOIN fp ON fp.id = o.id WHERE o.placed_at >= now() - interval '6 hours' AND o.kind IN ('open', 'increase', 'reduce', 'take', 'flatten_paired', 'flatten_vanished')) SELECT id, book_id AS book, slug, kind, path, side, tif, state, filled, qty, placed_at::time(0) AS placed, his_ts::time(0) AS his_fill, round(extract(epoch FROM (placed_at - his_ts))::numeric, 0) AS his_to_order_s, round(extract(epoch FROM (done_at - placed_at))::numeric, 0) AS order_to_done_s FROM o WHERE his_ts IS NOT NULL ORDER BY placed_at DESC LIMIT 40; SELECT date_trunc('hour', t.ts)::time(0) AS hour, count(*) AS his_fills, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (t.detected_at - t.ts)))::numeric, 0) AS ingest_lag_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY extract(epoch FROM (t.detected_at - t.ts)))::numeric, 0) AS ingest_lag_p90_s, string_agg(DISTINCT t.source, ',') AS sources FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '6 hours' AND t.detected_at IS NOT NULL GROUP BY 1 ORDER BY 1 DESC; WITH f AS (SELECT t.condition_id, t.ts, t.detected_at FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '6 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), fo AS (SELECT f.condition_id, f.ts, f.detected_at, (SELECT min(o.placed_at) FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.condition_id = f.condition_id AND o.placed_at >= f.ts AND o.placed_at < f.ts + interval '30 minutes' AND o.kind IN ('open', 'increase', 'take', 'reduce')) AS first_order FROM f) SELECT date_trunc('hour', ts)::time(0) AS hour, count(*) AS his_fills_on_our_markets, count(first_order) AS answered_in_30m, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (first_order - ts))) FILTER (WHERE first_order IS NOT NULL)::numeric, 0) AS fill_to_first_order_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY extract(epoch FROM (first_order - ts))) FILTER (WHERE first_order IS NOT NULL)::numeric, 0) AS fill_to_first_order_p90_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (detected_at - ts))) FILTER (WHERE detected_at IS NOT NULL)::numeric, 0) AS ingest_lag_med_s FROM fo GROUP BY 1 ORDER BY 1 DESC;"; TO=60000 ;;
                # [R48] see .github/workflows/RENDER_OPS_NOTES.md
                fills-answered) SQL="WITH r AS (SELECT t.id, t.condition_id, t.ts, t.detected_at, upper(t.side) AS side, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '6 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.detected_at, r.side, r.size, r.price, r.size * r.price AS usd, r.his_slug FROM r WHERE r.net_leg OR NOT r.has_net), s AS (SELECT f.*, x.e FROM f LEFT JOIN LATERAL (SELECT e FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), n AS (SELECT s.*, CASE WHEN s.e IS NULL THEN 'unseen' WHEN (s.e->>'order') IS NOT NULL THEN 'answered' ELSE COALESCE(s.e->>'name', 'unnamed') END AS name, CASE WHEN s.e IS NOT NULL THEN (s.e->>'at')::float8 - extract(epoch FROM s.ts) END AS lag_s FROM s) SELECT name, count(*) AS fills, round(sum(usd)::numeric, 2) AS his_usd, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_p90_s FROM n GROUP BY 1 ORDER BY 3 DESC; WITH r AS (SELECT t.id, t.condition_id, t.ts, t.detected_at, upper(t.side) AS side, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '6 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.detected_at, r.side, r.size, r.price, r.size * r.price AS usd, r.his_slug FROM r WHERE r.net_leg OR NOT r.has_net), s AS (SELECT f.*, x.e FROM f LEFT JOIN LATERAL (SELECT e FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), n AS (SELECT s.*, CASE WHEN s.e IS NULL THEN 'unseen' WHEN (s.e->>'order') IS NOT NULL THEN 'answered' ELSE COALESCE(s.e->>'name', 'unnamed') END AS name, CASE WHEN s.e IS NOT NULL THEN (s.e->>'at')::float8 - extract(epoch FROM s.ts) END AS lag_s FROM s) SELECT id, his_slug, ts::time(0) AS his_fill, detected_at::time(0) AS ingested, side, round(size::numeric, 1) AS sh, price, round(usd::numeric, 2) AS his_usd, name, round(lag_s::numeric, 0) AS lag_s FROM n WHERE name <> 'answered' ORDER BY his_usd DESC LIMIT 30;"; TO=60000 ;;
                close-rows) SQL="SELECT o.id, o.book_id AS book, left(o.us_market_slug, 40) AS slug, replace(b.intent, 'ORDER_INTENT_BUY_', '') AS book_intent, o.kind, o.side, o.tif, o.qty, o.state, o.venue_state, o.filled, round(o.avg_px::numeric, 3) AS avg_px, left(o.reason, 30) AS reason, o.placed_at::time(0) AS placed, o.done_at::time(0) AS done, o.order_id IS NOT NULL AS has_id, left(o.receipt::text, 160) AS receipt, b.state AS bstate, b.frozen_reason, b.ledger_net AS held FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE o.tif = 'CLOSE' OR o.kind IN ('flatten_paired', 'flatten_vanished') ORDER BY o.id DESC LIMIT 60; SELECT b.intent, o.tif, o.state, count(*) AS n, sum(o.filled) AS filled FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE o.kind IN ('flatten_paired', 'flatten_vanished', 'reduce') GROUP BY 1, 2, 3 ORDER BY 1, 2, 3;"; TO=30000 ;;
