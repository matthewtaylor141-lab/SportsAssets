# [R01] see .github/workflows/RENDER_OPS_NOTES.md
name: render-ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options:
          - services      # every service and database, with plan/status
          - events        # a service's recent events (deploys, crashes, OOM)
          - deploys       # a service's recent deploys with status and commit
          - logs          # a service's or database's log lines (arg = minutes back, or a text filter)
          - db            # the database's status, plan, version, disk
          - resume        # confirm=DO
          - suspend       # confirm=DO
          - restart       # confirm=DO
          - deploy        # confirm=DO: deploy the latest commit of the service's branch
          - deploy-api-commit # confirm=DO: arg = 40-hex sha; deploys ONLY sportsassets-api, by commit id. Cannot reach a worker.
          - api-branch-get    # read the branch and autoDeploy of the api and the worker
          - api-branch-set    # confirm=DO: arg = branch; repoints ONLY sportsassets-api
          - workers-branch-set    # confirm=DO: arg = branch; ONLY sportsassets-workers, autoDeploy=no
          - workers-commit-deploy # confirm=DO: arg = 40-hex sha; ONLY sportsassets-workers
          - metrics       # a service's memory (MB) and CPU per instance over the last N minutes (arg, default 120)
          - sql           # arg = activity | tables | sizes | indexes | analyze (DO) | index053 (DO) | mirror-on (DO) | mirror-off (DO) | mirror-state | pause-on (DO) | pause-off (DO) | pause-state | mirror-preflight | mirror-rearm (DO) | mirror-register (DO) | mirror-frozen | obs-arm-incentive (DO) | obs-incentive | obs-incentive-journal | obs-incentive-markets | obs-incentive-rows[:OFFSET:LIMIT] | evidence-schema (DO) | evidence-inventory | evidence-drop (DO) | cohort-inventory | ingest-latency | train-extract-rn1 | train-extract-ferrari | predict-extract-rn1 | learn-schema (DO) | learn-v2 (DO) | exec-history | ferrari-residual | desk-audit | desk-funnel | desk-schema (DO) | learn-provisional (DO) | desk-live | desk-accounts | desk-recon | learn-inventory | learn-drop (DO) | rn1x-tables | rn1x-on (DO) | rn1x-off (DO) | rn1x-learn-on (DO) | rn1x-learn-off (DO)
          - env-keys      # the service's env var KEYS (never values)
          - env-get       # arg = comma-separated OPERATOR FLAGS (LIVE_COPY_HALT, ...); values of flags only
          - env-set       # confirm=DO: arg = KEY=VALUE (value masked in the log; Render redeploys)
          - env-del       # confirm=DO: arg = KEY
          - rootdir-get   # the LIVE build config (rootDir, dockerfilePath) -- read-only
          - rootdir-sync  # confirm=DO: reconcile the live rootDir to what render.yaml declares
      service:
        description: 'Service or database name (sportsassets-api, sportsassets-workers, edge-shadow, sportsassets-db)'
        required: false
        default: 'sportsassets-api'
      arg:
        description: 'logs: minutes back (default 30) or a text filter; sql: which statement'
        required: false
        default: ''
      confirm:
        description: 'Type DO to allow a state-changing action'
        required: false
        default: ''
      render_key:
        description: 'Render API key (only if the RENDER_API_KEY secret is not set)'
        required: false
        default: ''

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the versioned step scripts
        # The script this job runs is the versioned file .github/render-ops/ops.sh
        # (moved out of this file, byte for byte, for size headroom: this file
        # had 1,601 bytes left under GitHub's 512,000-byte ceiling). Same commit
        # as this workflow file. No credential is persisted, and the checkout is
        # removed before the script runs, so the workspace is empty as before.
        uses: actions/checkout@v4
        with:
          path: .render-ops-src
          sparse-checkout: .github/render-ops
          persist-credentials: false
      - name: Run
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          CONFIRM: ${{ inputs.confirm }}
          KEY_SECRET: ${{ secrets.RENDER_API_KEY }}
        run: |
          # versioned step script: .github/render-ops/ops.sh
          install -D -m 0644 .render-ops-src/.github/render-ops/ops.sh "$RUNNER_TEMP/wfsteps/ops.sh"
          rm -rf .render-ops-src
          exec bash --noprofile --norc -eo pipefail "$RUNNER_TEMP/wfsteps/ops.sh"
