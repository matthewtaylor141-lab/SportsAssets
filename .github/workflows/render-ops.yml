                gap-soccer-venue) SQL="WITH ev AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS lg, split_part(t.market_slug, '-', 2) AS a, split_part(t.market_slug, '-', 3) AS b, split_part(t.market_slug, '-', 4) || '-' || split_part(t.market_slug, '-', 5) || '-' || split_part(t.market_slug, '-', 6) AS d FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('sea', 'lal', 'epl', 'bun', 'fl1', 'tur', 'swe', 'arg', 'scop', 'pol', 'sui', 'es2', 'itsb') AND t.market_slug ~ '^[a-z0-9]+-[a-z0-9]+-[a-z0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-'), u AS (SELECT identifier, split_part(identifier, '-', 1) AS kind, split_part(identifier, '-', 2) AS vlg, split_part(identifier, '-', 3) AS va, split_part(identifier, '-', 4) AS vb, split_part(identifier, '-', 5) || '-' || split_part(identifier, '-', 6) || '-' || split_part(identifier, '-', 7) AS vd, split_part(identifier, '-', 8) AS t8, split_part(identifier, '-', 9) AS t9, side_norm, intent, line, question, event_title, event_slug FROM us_premap WHERE (identifier LIKE '%-2026-09-06-%' OR identifier LIKE '%-2026-09-07-%') AND (identifier LIKE 'atc-%' OR identifier LIKE 'tsc-%' OR identifier LIKE 'asc-%' OR identifier LIKE 'astatc-%')) SELECT e.lg || '-' || e.a || '-' || e.b || '-' || e.d AS his_event, u.vlg || '-' || u.va || '-' || u.vb AS venue_event, concat((u.va = e.a)::int, (u.vb = e.b)::int, (u.va = e.b)::int, (u.vb = e.a)::int) AS share, left(max(u.event_title), 44) AS venue_event_title, count(*) FILTER (WHERE u.kind = 'atc' AND u.t8 IN (u.va, u.vb, 'draw')) AS atc_fg, string_agg(DISTINCT CASE WHEN u.kind = 'tsc' AND u.t9 = '' THEN u.t8 END, ',') AS tsc_lines, string_agg(DISTINCT CASE WHEN u.kind = 'asc' AND u.t8 IN ('neg', 'pos') THEN u.t8 || u.t9 || ':' || u.side_norm END, ',') AS asc_fg, bool_or(u.kind = 'astatc' AND u.t8 = 'btts') AS btts, max(CASE WHEN u.kind = 'atc' AND u.t8 = u.va THEN left(u.question, 120) END) AS q_a, max(CASE WHEN u.kind = 'atc' AND u.t8 = u.vb THEN left(u.question, 120) END) AS q_b FROM ev e JOIN u ON u.vd = e.d AND (u.va IN (e.a, e.b) OR u.vb IN (e.a, e.b)) GROUP BY 1, 2, 3 ORDER BY 1, 3 DESC LIMIT 110; SELECT e.lg || '-' || e.a || '-' || e.b || '-' || e.d AS his_event_unlisted FROM ev e WHERE NOT EXISTS (SELECT 1 FROM us_premap u2 WHERE u2.identifier LIKE ('%-' || e.d || '-%') AND (split_part(u2.identifier, '-', 3) IN (e.a, e.b) OR split_part(u2.identifier, '-', 4) IN (e.a, e.b))) ORDER BY 1 LIMIT 40;"; TO=60000 ;;
                # THE 'NO MARK: BOOK UNREADABLE' BUCKET (2026-09-07 13:5xZ, the coverage census:
                # $418k / 61 mapped markets in 24 h whose latest shadow verdict is 'no mark').
                # A no-mark row is one of three venue readings (mirror_shadow.py:1929-1979):
                # an empty book (a terminal state, or OPEN with no makers), a one-sided
                # book (a bid and no ask: the mark reads the ask only), or a read that
                # raised (bbo_error). The census keys the LATEST verdict, written ~20 min
                # after his last fill, so it says nothing about the market while he traded.
                # 1: the bucket by the venue's own state / sides / error on that latest row;
                # 2: per market, every shadow row in 30 h classified (two-sided OPEN reads,
                # one-sided, empty-open, terminal, halted-not-terminal, raised, no state) with
                # the first two-sided OPEN read vs his first/last fill and the game start;
                # 3: the verbatim rows of the six largest; 4: his fills by minute on those six;
                # 5: the live heartbeat's whole census (the mirror-tick preset cuts it at
                # 2400 chars) and the loss-stop key. Reads only, LIMITed.
                unread-rows) SQL="WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1') SELECT h.league, sh0.family, COALESCE(sh0.state, '(none)') AS state, (sh0.bid IS NOT NULL) AS has_bid, (sh0.ask IS NOT NULL) AS has_ask, COALESCE(sh0.bbo_error, '') AS bbo_error, count(*) AS markets, round(sum(h.usd)::numeric, 0) AS usd, round(avg(EXTRACT(EPOCH FROM (sh0.at - h.last_ts)) / 60.0)::numeric, 1) AS judged_min_after_his_last FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason = 'no mark: book unreadable' GROUP BY 1, 2, 3, 4, 5, 6 ORDER BY 8 DESC LIMIT 60; WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), tgt AS (SELECT h.*, sh0.family, sh0.us_market_slug FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason = 'no mark: book unreadable'), r AS (SELECT s.condition_id, s.at, s.reason, s.bid, s.ask, s.target, s.his_net, s.detail->>'state' AS state, s.detail->>'bbo_error' AS err, s.detail->>'snap_state' AS snap FROM mirror_shadow s JOIN tgt ON tgt.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours') SELECT left(tgt.his_slug, 34) AS his_slug, left(tgt.us_market_slug, 36) AS us_slug, tgt.fills, round(tgt.usd::numeric, 0) AS usd, tgt.first_ts::time(0) AS his_first, tgt.last_ts::time(0) AS his_last, mst.game_start::time(0) AS gstart, m.closed, (m.resolved_prices IS NOT NULL) AS resolved, count(r.at) AS n, min(r.at)::time(0) AS sh_first, max(r.at)::time(0) AS sh_last, left((array_agg(r.reason ORDER BY r.at))[1], 26) AS first_reason, count(*) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL) AS n_open2, min(r.at) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL)::time(0) AS open2_first, max(r.at) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL)::time(0) AS open2_last, count(*) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND (r.bid IS NULL) <> (r.ask IS NULL)) AS n_1side, count(*) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NULL AND r.ask IS NULL) AS n_open0, count(*) FILTER (WHERE r.state IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION')) AS n_term, min(r.at) FILTER (WHERE r.state IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION'))::time(0) AS term_first, count(*) FILTER (WHERE r.state IS NOT NULL AND r.state <> 'MARKET_STATE_OPEN' AND r.state NOT IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION')) AS n_halt, string_agg(DISTINCT r.state, ',') FILTER (WHERE r.state IS NOT NULL AND r.state <> 'MARKET_STATE_OPEN' AND r.state NOT IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION')) AS halt_states, count(*) FILTER (WHERE r.err IS NOT NULL) AS n_err, count(*) FILTER (WHERE r.state IS NULL AND r.err IS NULL) AS n_nostate, count(*) FILTER (WHERE r.at <= tgt.last_ts) AS n_during, count(*) FILTER (WHERE r.at <= tgt.last_ts AND r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL) AS n_during_open2 FROM tgt LEFT JOIN r ON r.condition_id = tgt.condition_id LEFT JOIN market_starts mst ON mst.condition_id = tgt.condition_id LEFT JOIN markets m ON m.condition_id = tgt.condition_id GROUP BY tgt.condition_id, tgt.his_slug, tgt.us_market_slug, tgt.fills, tgt.usd, tgt.first_ts, tgt.last_ts, mst.game_start, m.closed, m.resolved_prices ORDER BY tgt.usd DESC LIMIT 70; WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), tgt AS (SELECT h.*, sh0.family, sh0.us_market_slug FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason = 'no mark: book unreadable'), top AS (SELECT * FROM tgt ORDER BY usd DESC LIMIT 6) SELECT s.at::time(0) AS at, left(s.us_market_slug, 36) AS us_slug, left(s.reason, 40) AS reason, s.detail->>'state' AS state, s.bid, s.ask, s.detail->>'bbo_error' AS err, round(s.his_net::numeric, 1) AS his_net, s.target, s.detail->>'snap_state' AS snap, top.last_ts::time(0) AS his_last FROM mirror_shadow s JOIN top ON top.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours' ORDER BY top.usd DESC, s.at LIMIT 160; WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), tgt AS (SELECT h.*, sh0.family, sh0.us_market_slug FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason = 'no mark: book unreadable'), top AS (SELECT * FROM tgt ORDER BY usd DESC LIMIT 6) SELECT left(top.his_slug, 34) AS his_slug, date_trunc('minute', t.ts)::time(0) AS minute, count(*) AS fills, round(sum(t.size)::numeric, 0) AS shares, round(sum(t.size * t.price)::numeric, 0) AS usd, round(avg(t.price)::numeric, 3) AS avg_px, string_agg(DISTINCT upper(t.side), ',') AS sides FROM trades t JOIN whales w ON w.id = t.whale_id JOIN top ON top.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2 ORDER BY 1, 2 LIMIT 120; SELECT h.service, e.key, e.value FROM service_heartbeats h, jsonb_each_text(h.detail->'census') e WHERE h.service = 'mirror_live' AND e.value <> '0' ORDER BY 2; SELECT key, left(value::text, 300) AS value FROM ingestion_state WHERE key IN ('mirror_loss_stop', 'mirror_live', 'mirror_live_whales') ORDER BY key;"; TO=60000 ;;
                coverage-gap) SQL="WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, t.size * t.price AS usd, CASE WHEN m.resolved_prices IS NULL THEN 0 ELSE (CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price) END AS pnl, (m.resolved_prices IS NOT NULL) AS settled FROM trades t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours'), sh AS (SELECT DISTINCT ON (condition_id) condition_id, reason, detail->>'family' AS family, left(detail->>'explain', 60) AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1') SELECT h.league, COALESCE(sh.family, '?') AS family, CASE WHEN bk.condition_id IS NOT NULL THEN 'MIRRORED' ELSE left(COALESCE(sh.explain, sh.reason, '(never judged)'), 44) END AS why, count(DISTINCT h.condition_id) AS markets, round(sum(h.usd)::numeric, 0) AS usd, round(sum(h.pnl)::numeric, 0) AS his_settled_pnl, count(DISTINCT CASE WHEN h.settled THEN h.condition_id END) AS settled FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id GROUP BY 1, 2, 3 ORDER BY sum(h.usd) DESC LIMIT 120; SELECT CASE WHEN EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = t.condition_id AND b.whale = 'rn1') THEN 'MIRRORED' ELSE 'NOT' END AS bucket, count(DISTINCT t.condition_id) AS markets, round(sum(t.size * t.price)::numeric, 0) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' GROUP BY 1;"; TO=60000 ;;
                his-day) SQL="WITH his AS (SELECT t.condition_id, t.side, t.size, t.price, t.ts, COALESCE((m.resolved_prices->>mt.outcome_index)::numeric, NULL) AS rp, (m.resolved_prices IS NOT NULL) AS settled, EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = t.condition_id AND b.whale = 'rn1') AS ours FROM trades t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours') SELECT CASE WHEN ours THEN 'markets we mirror' ELSE 'markets we do not mirror' END AS bucket, settled, count(DISTINCT condition_id) AS markets, count(*) AS fills, round(sum(size * price)::numeric, 0) AS usd_traded, round(sum(CASE WHEN settled THEN (CASE WHEN upper(side) = 'BUY' THEN 1 ELSE -1 END) * size * (rp - price) ELSE 0 END)::numeric, 0) AS his_settled_pnl FROM his GROUP BY 1, 2 ORDER BY 1, 2; SELECT left(COALESCE(max(t.market_slug), ''), 44) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 0) AS his_pnl, EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = t.condition_id AND b.whale = 'rn1') AS ours FROM trades t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND m.resolved_prices IS NOT NULL GROUP BY t.condition_id ORDER BY abs(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))) DESC LIMIT 40;"; TO=60000 ;;
                # THE LEAGUES THE MAPPER DOES NOT RECOGNISE (2026-09-07 14:xxZ, the
                # coverage program's league-code bucket, ~$170k/24 h): por, itsb,
                # col1, nor, gre1, bel1, ere, den, tur2, bra3, sui, cs2 all read
                # no_key_intersection. Two reads, each under the 300-line cap.
                # league-census: every venue league code listed for Sep 5-7 with
                # its game count, the league NAME as the venue's own per-team
                # question states it, and one verbatim question -- so an alias is
                # read from the venue's words, never from a table.
                league-census) SQL="SELECT split_part(identifier, '-', 2) AS lg, count(DISTINCT split_part(identifier, '-', 3) || '-' || split_part(identifier, '-', 4) || '-' || substring(identifier from '[0-9]{4}-[0-9]{2}-[0-9]{2}')) AS games, min(substring(question from ' in the (.+) match scheduled')) AS league_phrase, min(left(question, 100)) AS example_question, max(updated_at)::time(0) AS upd FROM us_premap WHERE identifier LIKE 'atc-%' AND (identifier LIKE '%-2026-09-05-%' OR identifier LIKE '%-2026-09-06-%' OR identifier LIKE '%-2026-09-07-%') AND question ILIKE '%win against%' GROUP BY 1 ORDER BY 1 LIMIT 200; SELECT key, left(value::text, 200) AS value FROM ingestion_state WHERE key LIKE '%premap%' ORDER BY key LIMIT 6;"; TO=30000 ;;
                # league-rows: (1) his EVENTS in those leagues over 30 h -- markets,
                # dollars, families, his moneyline title (the C2/C5 title witness),
                # markets.event_title (the only matchup key a moneyline has), the
                # shadow's latest verdicts; (2) every venue row whose identifier
                # carries his slug minus its league code, under ANY venue code and
                # prefix (the identity that C2's alias arm and C3's _c3_code need);
                # (3) the venue's full-game atc rows for his team-code pair under
                # any code; (4) the venue's atc rows on his date whose question
                # names one of HIS clubs (his event title's sides, his moneyline
                # title's anchor; diacritics folded on both sides for the LOOKUP
                # only) -- the witness that certifies a league/club translation.
                league-rows) SQL="WITH his AS (SELECT t.condition_id, t.market_slug, t.market_title, t.outcome, t.size * t.price AS usd, t.ts, regexp_replace(t.market_slug, '^([a-z0-9]+-[a-z0-9]+-[a-z0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}).*$', '\\1') AS ev, (split_part(t.market_slug, '-', 8) = '' AND split_part(t.market_slug, '-', 7) IN (split_part(t.market_slug, '-', 2), split_part(t.market_slug, '-', 3))) AS is_ml FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'itsb', 'col1', 'nor', 'gre1', 'bel1', 'ere', 'den', 'tur2', 'bra3', 'sui', 'cs2')), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, left(detail->>'explain', 44) AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '36 hours' ORDER BY condition_id, at DESC) SELECT h.ev, count(DISTINCT h.market_slug) AS mkts, round(sum(h.usd)::numeric, 0) AS usd, max(h.ts)::time(0) AS last_ts, string_agg(DISTINCT regexp_replace(h.market_slug, '^' || h.ev || '-', ''), ',') AS tails, max(h.market_title) FILTER (WHERE h.is_ml) AS ml_title, max(left(m.event_title, 44)) AS m_event_title, max(left(m.title, 30)) FILTER (WHERE h.is_ml) AS m_title, string_agg(DISTINCT COALESCE(sh.explain, '(never judged)'), ' | ') AS verdicts, max(sh.at)::time(0) AS judged FROM his h LEFT JOIN markets m ON m.condition_id = h.condition_id LEFT JOIN sh ON sh.condition_id = h.condition_id GROUP BY h.ev ORDER BY sum(h.usd) DESC LIMIT 60; WITH he AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS his_lg, substring(t.market_slug from position('-' in t.market_slug) + 1) AS rest FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'itsb', 'col1', 'nor', 'gre1', 'bel1', 'ere', 'den', 'tur2', 'bra3', 'sui', 'cs2')) SELECT he.his_lg, u.identifier, u.side_norm, u.intent, u.line, left(u.question, 100) AS question, u.updated_at::time(0) AS upd FROM he JOIN us_premap u ON u.identifier LIKE ('%-' || he.rest) ORDER BY he.his_lg, u.identifier, u.side_norm LIMIT 70; WITH he AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS his_lg, split_part(t.market_slug, '-', 2) || '-' || split_part(t.market_slug, '-', 3) || '-' || substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS suffix FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'itsb', 'col1', 'nor', 'gre1', 'bel1', 'ere', 'den', 'tur2', 'bra3', 'sui', 'cs2') AND t.market_slug ~ '^[a-z0-9]+-[a-z0-9]+-[a-z0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-') SELECT he.his_lg, u.identifier, u.side_norm, u.intent, left(u.question, 100) AS question, left(u.event_title, 40) AS v_event_title FROM he JOIN us_premap u ON u.identifier LIKE ('atc-%-' || he.suffix || '-%') WHERE u.identifier NOT LIKE '%-fh-%' AND u.identifier NOT LIKE '%-sh-%' ORDER BY he.his_lg, u.identifier, u.side_norm LIMIT 60; WITH nm AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS his_lg, substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS d, lower(trim(v.n)) AS his_name FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id CROSS JOIN LATERAL (VALUES (split_part(m.event_title, ' vs. ', 1)), (split_part(m.event_title, ' vs. ', 2)), (substring(t.market_title from '^Will (.+) win on '))) v(n) WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'itsb', 'col1', 'nor', 'gre1', 'bel1', 'ere', 'den', 'tur2', 'bra3', 'sui', 'cs2') AND length(trim(COALESCE(v.n, ''))) >= 3) SELECT nm.his_lg, nm.d, nm.his_name, u.identifier, u.side_norm, left(u.question, 100) AS question FROM nm JOIN us_premap u ON u.identifier LIKE 'atc-%' AND u.identifier LIKE ('%-' || nm.d || '-%') AND translate(lower(u.question), 'áéíóúàèìòùâêîôûãõçñäöüøłđ', 'aeiouaeiouaeiouaocnaouold') LIKE ('%' || translate(nm.his_name, 'áéíóúàèìòùâêîôûãõçñäöüøłđ', 'aeiouaeiouaeiouaocnaouold') || '%') ORDER BY nm.his_lg, nm.d, nm.his_name, u.identifier, u.side_norm LIMIT 90;"; TO=60000 ;;
                # THE PREFIX-FILTER BUCKET (2026-09-07 14:xxZ, coverage program bucket
                # type_prefix_filter_emptied, ~$83k/24 h: bra/arg/pol/scop/itsb/den/sui
                # totals and the bra spreads). premap.resolve_explain reaches that step
                # only when the event IS on the board and no row carries the family
                # prefix (tsc-/asc-/astatc-). Four reads: (1) his 24 h totals/spreads in
                # those league codes with the shadow's latest verdict; (2) for each of
                # his events, the venue's prefix census on that game under ANY venue
                # league code (identifier carrying his <a>-<b>-<date>, aec rows included
                # -- the dated census above hides them); (3) the venue's all-dates
                # family census per league code, so a league the venue NEVER lists a
                # tsc-/asc- row for is read from the table; (4) dollars by league x family.
                prefix-rows) SQL="WITH his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, max(t.market_title) AS his_title, max(m.event_title) AS event_title, string_agg(DISTINCT t.outcome, '/') AS outcomes, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, max(t.ts)::time(0) AS last_ts, bool_or(m.resolved_prices IS NOT NULL) AS settled FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('bra', 'arg', 'pol', 'scop', 'itsb', 'den', 'sui') AND (t.market_slug LIKE '%-total-%' OR t.market_slug LIKE '%-spread-%') GROUP BY t.condition_id), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, left(detail->>'explain', 44) AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC) SELECT h.his_slug, left(h.his_title, 60) AS his_title, left(h.event_title, 36) AS event_title, left(h.outcomes, 20) AS outcomes, h.fills, h.usd, h.last_ts, COALESCE(sh.explain, '(never judged)') AS explain, sh.at::time(0) AS judged, h.settled FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id ORDER BY h.usd DESC LIMIT 90; WITH ev AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS lg, split_part(t.market_slug, '-', 2) || '-' || split_part(t.market_slug, '-', 3) || '-' || substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS game FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('bra', 'arg', 'pol', 'scop', 'itsb', 'den', 'sui') AND (t.market_slug LIKE '%-total-%' OR t.market_slug LIKE '%-spread-%')) SELECT e.lg AS his_lg, e.game, split_part(u.identifier, '-', 1) AS prefix, split_part(u.identifier, '-', 2) AS venue_lg, count(u.identifier) AS rows, min(u.identifier) AS example, max(u.identifier) AS example2 FROM ev e LEFT JOIN us_premap u ON u.identifier LIKE ('%-' || e.game || '%') GROUP BY 1, 2, 3, 4 ORDER BY 1, 2, 3 LIMIT 120; SELECT split_part(identifier, '-', 2) AS venue_lg, count(*) FILTER (WHERE identifier LIKE 'atc-%') AS atc, count(*) FILTER (WHERE identifier LIKE 'aec-%') AS aec, count(*) FILTER (WHERE identifier LIKE 'tsc-%') AS tsc, count(*) FILTER (WHERE identifier LIKE 'asc-%') AS asc, count(*) FILTER (WHERE identifier LIKE 'astatc-%') AS astatc, min(identifier) FILTER (WHERE identifier LIKE 'tsc-%') AS tsc_example, min(updated_at)::date AS oldest, max(updated_at)::time(0) AS upd FROM us_premap WHERE split_part(identifier, '-', 2) IN ('bra', 'lpa', 'ekst', 'scp', 'srb', 'den1', 'swsl', 'arg', 'pol', 'scop', 'itsb', 'den', 'sui', 'epl', 'sea', 'lal') GROUP BY 1 ORDER BY 1 LIMIT 40; SELECT split_part(t.market_slug, '-', 1) AS lg, CASE WHEN t.market_slug LIKE '%-spread-%' THEN 'spread' ELSE 'total' END AS family, count(DISTINCT t.condition_id) AS markets, round(sum(t.size * t.price)::numeric, 0) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('bra', 'arg', 'pol', 'scop', 'itsb', 'den', 'sui') AND (t.market_slug LIKE '%-total-%' OR t.market_slug LIKE '%-spread-%') GROUP BY 1, 2 ORDER BY 4 DESC;"; TO=60000 ;;
                close-rows) SQL="SELECT o.id, o.book_id AS book, left(o.us_market_slug, 40) AS slug, replace(b.intent, 'ORDER_INTENT_BUY_', '') AS book_intent, o.kind, o.side, o.tif, o.qty, o.state, o.venue_state, o.filled, round(o.avg_px::numeric, 3) AS avg_px, left(o.reason, 30) AS reason, o.placed_at::time(0) AS placed, o.done_at::time(0) AS done, o.order_id IS NOT NULL AS has_id, left(o.receipt::text, 160) AS receipt, b.state AS bstate, b.frozen_reason, b.ledger_net AS held FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE o.tif = 'CLOSE' OR o.kind IN ('flatten_paired', 'flatten_vanished') ORDER BY o.id DESC LIMIT 60; SELECT b.intent, o.tif, o.state, count(*) AS n, sum(o.filled) AS filled FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE o.kind IN ('flatten_paired', 'flatten_vanished', 'reduce') GROUP BY 1, 2, 3 ORDER BY 1, 2, 3;"; TO=30000 ;;
                verify-day) SQL="WITH bk AS (SELECT b.* FROM mirror_books b WHERE b.opened_at >= date_trunc('day', now()) OR b.closed_at >= date_trunc('day', now()) OR b.state <> 'closed'), tr AS (SELECT t.id, t.whale_id, t.condition_id, t.asset, upper(t.side) AS side, t.size, t.price, t.ts, t.source, bool_or(t.source IN ('chain','s1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash,'')), 'row:'||t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IN (SELECT condition_id FROM bk)), his AS (SELECT * FROM tr WHERE source IN ('chain','s1') OR NOT has_net), ours AS (SELECT o.book_id, min(COALESCE(o.done_at, o.placed_at)) AS first_fill, max(COALESCE(o.done_at, o.placed_at)) AS last_fill, count(*) AS n_fills, sum(CASE WHEN o.side = 'BUY_LONG' THEN o.filled ELSE -o.filled END) AS net_filled, string_agg(left(o.side, 4) || ' ' || round(o.filled::numeric, 0) || '@' || round(o.avg_px::numeric, 3) || ' ' || to_char(COALESCE(o.done_at, o.placed_at), 'HH24:MI') || ' his' || COALESCE(round(o.his_level::numeric, 3)::text, '?'), ' | ' ORDER BY o.placed_at) AS fills FROM mirror_orders o WHERE o.filled > 0 GROUP BY o.book_id) SELECT b.id, left(b.us_market_slug, 40) AS slug, replace(b.intent, 'ORDER_INTENT_BUY_', '') AS intent, b.ratio, b.state, b.ledger_net AS held, round(b.avg_cost::numeric, 3) AS avg_cost, round(b.realized_pnl::numeric, 2) AS realized, round(b.settled_pnl::numeric, 2) AS settled, m.resolved_prices::text AS resolved, lt.outcome_index AS long_idx, left(lt.outcome, 16) AS long_outcome, round((SELECT COALESCE(sum((CASE WHEN h.asset = b.long_asset THEN 1 ELSE -1 END) * (CASE WHEN h.side = 'BUY' THEN 1 ELSE -1 END) * h.size), 0) FROM his h WHERE h.condition_id = b.condition_id AND (o.first_fill IS NULL OR h.ts <= o.first_fill))::numeric, 1) AS his_net_at_first, round((SELECT COALESCE(sum((CASE WHEN h.asset = b.long_asset THEN 1 ELSE -1 END) * (CASE WHEN h.side = 'BUY' THEN 1 ELSE -1 END) * h.size), 0) FROM his h WHERE h.condition_id = b.condition_id AND (o.last_fill IS NULL OR h.ts <= o.last_fill))::numeric, 1) AS his_net_at_last, round((SELECT COALESCE(sum((CASE WHEN h.asset = b.long_asset THEN 1 ELSE -1 END) * (CASE WHEN h.side = 'BUY' THEN 1 ELSE -1 END) * h.size), 0) FROM his h WHERE h.condition_id = b.condition_id)::numeric, 1) AS his_net_now, round((SELECT COALESCE(sum((CASE WHEN h.side = 'BUY' THEN 1 ELSE -1 END) * h.size * (COALESCE((m.resolved_prices->>mt2.outcome_index)::numeric, 0) - h.price)), 0) FROM his h JOIN market_tokens mt2 ON mt2.token_id = h.asset WHERE h.condition_id = b.condition_id AND m.resolved_prices IS NOT NULL)::numeric, 0) AS his_pnl_settled, (SELECT min(h.ts) FROM his h WHERE h.condition_id = b.condition_id)::time(0) AS his_first, o.first_fill::time(0) AS our_first, o.last_fill::time(0) AS our_last, o.n_fills, round(o.net_filled::numeric, 0) AS net_filled, left(o.fills, 150) AS fills FROM bk b LEFT JOIN markets m ON m.condition_id = b.condition_id LEFT JOIN market_tokens lt ON lt.token_id = b.long_asset LEFT JOIN ours o ON o.book_id = b.id ORDER BY b.id;"; TO=60000 ;;
                premap-rows) SQL="SELECT identifier, side_norm, line, intent, question, event_keys FROM us_premap WHERE identifier LIKE 'atc-%' AND (identifier LIKE 'atc-sea-juv-mil-2026-09-06%' OR identifier LIKE 'atc-lal-esp-sev-2026-09-06%' OR identifier LIKE 'atc-els-kbk-tro-2026-09-06%' OR identifier LIKE 'atc-sea-bol-sas-2026-09-06%' OR identifier LIKE 'atc-lpa-ros-new-2026-09-06%') ORDER BY identifier, side_norm; SELECT t.market_slug AS his_slug, max(t.market_title) AS his_title, max(m.title) AS m_title, max(t.event_slug) AS his_event, max(m.event_title) AS m_event_title, max(t.outcome) AS outcome FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.market_slug IN ('sea-juv-mil-2026-09-06-juv', 'lal-esp-sev-2026-09-06-esp', 'nor-kbk-tro-2026-09-06-tro', 'sea-bol-sas-2026-09-06-sas', 'arg-ros-new-2026-09-06-new', 'fl1-olm-pfc-2026-09-06-olm', 'por-gui-cas-2026-09-06-gui') GROUP BY 1; SELECT split_part(identifier, '-', 2) AS lg, count(DISTINCT split_part(identifier, '-', 3) || '-' || split_part(identifier, '-', 4)) AS games FROM us_premap WHERE identifier LIKE 'atc-%-2026-09-06%' GROUP BY 1 ORDER BY 2 DESC LIMIT 40;"; TO=30000 ;;
                # THE DRIFT ON EVERY LIVE BOOK (2026-09-06, owner: "more volume"):
                # the shadow's newest reading per live book -- his fills-derived
                # long/other against the venue snapshot's long/other, the drift
                # the rule computed, and the snapshot's state and age -- so a
                # refused increase is read from the numbers.
                book-drift) SQL="SELECT b.id AS book, left(b.us_market_slug, 36) AS slug, b.ledger_net AS held, b.target, s.at::time(0) AS judged, round(s.his_long::numeric, 1) AS his_long, round(s.his_other::numeric, 1) AS his_other, round(s.snap_long::numeric, 1) AS snap_long, round(s.snap_other::numeric, 1) AS snap_other, round(s.his_net::numeric, 1) AS his_net, s.detail->>'drift' AS drift, s.detail->>'snap_state' AS snap_state, s.detail->>'snap_age_s' AS snap_age, s.detail->>'fills_since_snap' AS fills_since, left(s.reason, 36) AS reason, s.detail->>'state' AS mkt_state FROM mirror_books b LEFT JOIN LATERAL (SELECT * FROM mirror_shadow s WHERE s.condition_id = b.condition_id AND s.whale = b.whale ORDER BY s.at DESC LIMIT 1) s ON true WHERE b.state <> 'closed' ORDER BY b.id;"; TO=30000 ;;
                # THE DRIFT ON BOOK 16 (2026-09-06, owner: "more volume"): his fills
                # on the Kostyuk condition by source and side, the rows that share a
                # tx hash across sources (a fill counted twice), and the shadow's
                # history of fills-derived vs snapshot long/other on that condition.
                drift-16) SQL="SELECT t.source, t.side, t.outcome, count(*) AS n, round(sum(t.size)::numeric, 1) AS shares, min(t.ts)::time(0) AS first_ts, max(t.ts)::time(0) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) GROUP BY 1, 2, 3 ORDER BY 1, 2, 3; SELECT left(t.tx_hash, 18) AS tx, left(t.outcome, 8) AS outcome, t.side, count(*) AS n, string_agg(t.source || ':' || round(t.size::numeric, 1) || '@' || round(t.price::numeric, 3) || ' ' || t.ts::time(0) || ' key=' || left(t.dedupe_key, 40), ' | ' ORDER BY t.id) AS rows FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) GROUP BY 1, 2, 3 HAVING count(*) > 1 ORDER BY n DESC LIMIT 12; SELECT 'multi-row tx' AS what, count(*) AS tx_groups, sum(n - 1) AS extra_rows, round(sum(extra_sh)::numeric, 1) AS extra_shares FROM (SELECT t.tx_hash, t.asset, t.side, count(*) AS n, sum(t.size) - max(t.size) AS extra_sh FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) GROUP BY 1, 2, 3 HAVING count(*) > 1) x; SELECT 'same size+price+minute, both sources' AS what, count(*) AS pairs, round(sum(sz)::numeric, 1) AS shares FROM (SELECT t.asset, round(t.size::numeric, 2) AS sz, round(t.price::numeric, 3) AS px, date_trunc('minute', t.ts) AS m FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) GROUP BY 1, 2, 3, 4 HAVING count(DISTINCT t.source) = 2) y; SELECT 'rn1 today by source' AS what, source, count(*) AS n, round(sum(size)::numeric, 0) AS shares, round(sum(notional)::numeric, 0) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= date_trunc('day', now()) GROUP BY 1, 2; SELECT s.at::time(0) AS at, round(s.his_long::numeric, 0) AS his_long, round(s.his_other::numeric, 0) AS his_other, round(s.snap_long::numeric, 0) AS snap_long, round(s.snap_other::numeric, 0) AS snap_other, s.detail->>'drift' AS drift, s.detail->>'fills_since_snap' AS fills_since, s.detail->>'snap_age_s' AS snap_age, left(s.reason, 30) AS reason FROM mirror_shadow s WHERE s.whale = 'rn1' AND s.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) ORDER BY s.at DESC LIMIT 30;"; TO=30000 ;;
                # THE NEWEST BOOKS, SIDE-CHECKED (2026-09-06 19:42Z: four books opened
