                # back to the newest row; `judged` prints when that row was written. Reads only.
                # Since W2 / P2 (migration 054) the live lane persists the candidate's own
                # refusal: for a market with NO book `why` prefers the newest
                # mirror_candidate_refusals row at or before his last fill (else the newest),
                # printed `live:<refusal>`, over the shadow's verdict; `judged` is that row's
                # time when it decided. A database without 054 fails this preset until
                # migrate runs on the next boot (start.sh runs it before the API).
                coverage-gap) SQL="WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, t.ts, t.size * t.price AS usd, CASE WHEN m.resolved_prices IS NULL THEN 0 ELSE (CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price) END AS pnl, (m.resolved_prices IS NOT NULL) AS settled FROM trades t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours'), hl AS (SELECT condition_id, max(ts) AS last_ts FROM his GROUP BY 1), sh AS (SELECT DISTINCT ON (s.condition_id) s.condition_id, s.at, s.reason, s.detail->>'family' AS family, left(s.detail->>'explain', 60) AS explain FROM mirror_shadow s LEFT JOIN hl ON hl.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours' ORDER BY s.condition_id, (s.at <= hl.last_ts AND COALESCE(s.detail->>'state', '') NOT IN ('MARKET_STATE_EXPIRED', 'MARKET_STATE_CLOSED', 'MARKET_STATE_TERMINATED', 'MARKET_STATE_MATCH_AND_CLOSE_AUCTION')) DESC NULLS LAST, s.at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), cr AS (SELECT DISTINCT ON (r.condition_id) r.condition_id, r.refusal, r.at FROM mirror_candidate_refusals r LEFT JOIN hl ON hl.condition_id = r.condition_id WHERE r.whale = 'rn1' AND r.at >= now() - interval '30 hours' ORDER BY r.condition_id, (r.at <= hl.last_ts) DESC NULLS LAST, r.at DESC) SELECT h.league, COALESCE(sh.family, '?') AS family, CASE WHEN bk.condition_id IS NOT NULL THEN 'MIRRORED' WHEN cr.refusal IS NOT NULL THEN left('live:' || cr.refusal, 44) ELSE left(COALESCE(sh.explain, sh.reason, '(never judged)'), 44) END AS why, count(DISTINCT h.condition_id) AS markets, round(sum(h.usd)::numeric, 0) AS usd, round(sum(h.pnl)::numeric, 0) AS his_settled_pnl, count(DISTINCT CASE WHEN h.settled THEN h.condition_id END) AS settled, max(COALESCE(cr.at, sh.at))::time(0) AS judged FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id LEFT JOIN cr ON cr.condition_id = h.condition_id GROUP BY 1, 2, 3 ORDER BY sum(h.usd) DESC LIMIT 120; SELECT CASE WHEN EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = t.condition_id AND b.whale = 'rn1') THEN 'MIRRORED' ELSE 'NOT' END AS bucket, count(DISTINCT t.condition_id) AS markets, round(sum(t.size * t.price)::numeric, 0) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' GROUP BY 1;"; TO=60000 ;;
                # THE CANDIDATE'S OWN REFUSAL, LAST 24 H (W2 / P2, 2026-09-07; the table
                # mirror_candidate_refusals, migration 054: one row per (whale, market)
                # transition of the live lane's refusal name, re-stamped every 900 s).
                # 1: by the LATEST refusal per market, the markets and his dollars under
                # it, and the no-book part of both (a market that later opened a book
                # is counted, and told apart); 2: every name's rows and markets, with
                # the tick's wall time, candidate reads and his active conditions when
                # the rows were written (the walk's cap made visible); 3: the 40 largest
                # no-book markets by his dollars with their refusal path through the
                # day (name@HH:MM and the signed target where the row carries one).
                # Reads only, LIMITed.
                cand-refusals) SQL="WITH his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1), r AS (SELECT condition_id, refusal, at, target, his_net, ask, his_px, cand_reads, tick_s, active_conditions FROM mirror_candidate_refusals WHERE whale = 'rn1' AND at >= now() - interval '24 hours'), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), lastr AS (SELECT DISTINCT ON (condition_id) condition_id, refusal, at FROM r ORDER BY condition_id, at DESC) SELECT l.refusal, count(*) AS markets, round(sum(h.usd)::numeric, 0) AS usd, count(*) FILTER (WHERE bk.condition_id IS NULL) AS markets_no_book, round(COALESCE(sum(h.usd) FILTER (WHERE bk.condition_id IS NULL), 0)::numeric, 0) AS usd_no_book, min(l.at)::time(0) AS first, max(l.at)::time(0) AS last FROM lastr l JOIN his h ON h.condition_id = l.condition_id LEFT JOIN bk ON bk.condition_id = l.condition_id GROUP BY 1 ORDER BY 3 DESC LIMIT 60; SELECT refusal, count(*) AS rows, count(DISTINCT condition_id) AS markets, min(at)::time(0) AS first, max(at)::time(0) AS last, round(avg(tick_s)::numeric, 1) AS tick_s, round(avg(cand_reads)::numeric, 0) AS cand_reads, round(avg(active_conditions)::numeric, 0) AS active FROM mirror_candidate_refusals WHERE whale = 'rn1' AND at >= now() - interval '24 hours' GROUP BY 1 ORDER BY 2 DESC LIMIT 60; WITH his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1), r AS (SELECT condition_id, refusal, at, target, his_net, ask, his_px, cand_reads, tick_s, active_conditions FROM mirror_candidate_refusals WHERE whale = 'rn1' AND at >= now() - interval '24 hours'), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), top AS (SELECT h.* FROM his h LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL ORDER BY h.usd DESC LIMIT 40) SELECT left(top.his_slug, 34) AS his_slug, round(top.usd::numeric, 0) AS usd, top.first_ts::time(0) AS his_first, top.last_ts::time(0) AS his_last, count(r.at) AS rows, left(fv.at::text, 16) AS first_verdict, CASE WHEN fv.at IS NULL THEN NULL ELSE fv.at > top.last_ts END AS first_verdict_after_his_last, left(string_agg(r.refusal || '@' || to_char(r.at, 'HH24:MI') || COALESCE(' t' || r.target::text, ''), ' ' ORDER BY r.at), 200) AS path FROM top LEFT JOIN r ON r.condition_id = top.condition_id LEFT JOIN LATERAL (SELECT min(x.at) AS at FROM mirror_candidate_refusals x WHERE x.whale = 'rn1' AND x.condition_id = top.condition_id) fv ON true GROUP BY top.condition_id, top.his_slug, top.usd, top.first_ts, top.last_ts, fv.at ORDER BY top.usd DESC LIMIT 40; WITH his AS (SELECT t.condition_id, sum(t.size * t.price) AS usd, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), nb AS (SELECT h.condition_id, h.usd, h.last_ts, (SELECT min(r.at) FROM mirror_candidate_refusals r WHERE r.whale = 'rn1' AND r.condition_id = h.condition_id) AS first_at FROM his h LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL) SELECT CASE WHEN first_at IS NULL THEN 'no_verdict_in_24h' WHEN first_at > last_ts THEN 'first_verdict_after_his_last' ELSE 'verdict_while_he_traded' END AS dark_window, count(*) AS markets_no_book, round(sum(usd)::numeric, 0) AS usd, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (first_at - last_ts)))::numeric, 0) AS first_after_last_med_s FROM nb GROUP BY 1 ORDER BY 3 DESC;"; TO=60000 ;;
                # THE OPERATOR REGISTER (E5 / P1, 2026-09-07; migration 056). Book 77
                # (Shelton/Tsitsipas) read venue 1,128 / ledger 0 / manual 0 since
                # 2026-09-06 -- a lost placement response whose fill the venue reports
                # and the ledger never booked -- and froze on every tick. This dispatch
                # is the ONLY writer of mirror_registered_positions: the owner's dated,
                # named statement that the shares are outside the book. arg is
                # `<book_id>=<shares> <note>` (shares signed like the ledger, negative =
                # the short side; a note is required). The slug, asset and condition
                # come from the book's OWN row -- never typed -- and ONE statement
                # prints the venue's reading the worker last wrote (venue_net), the
                # ledger, the desk's manual shares and the register so far, then
                # INSERTs only when the figure equals venue - ledger - manual EXACTLY,
                # the book is frozen and was read inside 10 minutes, the figure carries
                # the book's own leg's sign (never a negative on a long book: the live
                # plan would then sell shares the venue does not hold), and no row
                # stands on the slug yet. The verdict column says registered or REFUSED
                # (a book id with no row is REFUSED too: E5 review L2).
                # The worker reads the signed sum per slug beside the manual shares
                # (mirror_live._SQL_REGISTERED_SHARES) and never writes here.
                mirror-register) need_confirm
                  if [[ ! "$ARG" =~ ^([0-9]+)=(-?[0-9]+(\.[0-9]+)?)\ (.+)$ ]]; then echo "mirror-register: arg must be <book_id>=<shares> <note> (got '$ARG')"; exit 1; fi
                  RB="${BASH_REMATCH[1]}"; RS="${BASH_REMATCH[2]}"; RN="${BASH_REMATCH[4]//\'/\'\'}"; RBY="${GITHUB_ACTOR:-render-ops}"
                  SQL="WITH b AS (SELECT b.id, b.whale, b.us_market_slug, b.condition_id, b.intent, b.state, b.frozen_reason, b.frozen_at, b.ledger_net, b.venue_net, b.updated_at, CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN b.other_asset ELSE b.long_asset END AS asset, (SELECT COALESCE(sum(filled_shares), 0) FROM live_orders WHERE us_market_slug = b.us_market_slug AND COALESCE(whale_username, '') = 'manual' AND status IN ('filled', 'exiting')) AS manual, (SELECT COALESCE(sum(shares), 0) FROM mirror_registered_positions r WHERE r.us_market_slug = b.us_market_slug) AS registered FROM mirror_books b WHERE b.id = $RB), ins AS (INSERT INTO mirror_registered_positions (whale, us_market_slug, condition_id, asset, shares, side, registered_by, note, source) SELECT b.whale, b.us_market_slug, b.condition_id, b.asset, $RS, CASE WHEN $RS < 0 THEN 'SHORT' ELSE 'LONG' END, '$RBY', '$RN', 'render-ops mirror-register book $RB' FROM b WHERE b.state = 'frozen' AND b.frozen_reason IN ('placement_lost', 'venue_ledger_disagree') AND b.venue_net IS NOT NULL AND b.updated_at > now() - interval '10 minutes' AND $RS <> 0 AND $RS = b.venue_net - b.ledger_net - b.manual AND b.registered = 0 AND (($RS > 0 AND b.intent <> 'ORDER_INTENT_BUY_SHORT') OR ($RS < 0 AND b.intent = 'ORDER_INTENT_BUY_SHORT')) RETURNING id, shares, side, registered_by, note) SELECT $RB AS book, left(b.us_market_slug, 44) AS slug, b.intent, b.state, b.frozen_reason, b.frozen_at::time(0) AS frozen, b.updated_at::time(0) AS venue_read_at, b.venue_net AS venue, b.ledger_net AS ledger, b.manual, b.registered AS registered_before, round((b.venue_net - b.ledger_net - b.manual)::numeric, 4) AS unexplained, $RS AS figure, CASE WHEN b.id IS NULL THEN 'REFUSED: no mirror_books row with id $RB' WHEN ins.id IS NOT NULL THEN 'registered #' || ins.id || ' ' || ins.side || ' ' || ins.shares || ' by ' || ins.registered_by || ': ' || ins.note ELSE 'REFUSED: the book must be frozen placement_lost or venue_ledger_disagree (the reasons the frozen exit follows), the figure must equal venue - ledger - manual exactly, be nonzero with the leg''s sign, on a frozen book read inside 10 minutes with no register row on the slug' END AS verdict FROM (SELECT 1) AS one LEFT JOIN b ON true LEFT JOIN ins ON true; SELECT id, whale, left(us_market_slug, 44) AS slug, shares, side, registered_at::time(0) AS at, registered_by, left(note, 80) AS note, source FROM mirror_registered_positions ORDER BY id DESC LIMIT 20;"; TO=30000 ;;
                # THE FROZEN BOOKS (E5 / P2, read-only): every frozen book with the
                # venue's reading the worker last wrote, the ledger, the desk's manual
                # shares, the register, his net and the target, when it froze, the
                # frozen exit's verdict off the last plan (frozen_exit: venue_own /
                # target / held-by-name or the act's word) and the last venue-sized
                # reduce order (reason frozen_reduce); then the register rows.
                mirror-frozen) SQL="SELECT b.id, left(b.us_market_slug, 40) AS slug, b.intent, b.frozen_reason, b.frozen_at::time(0) AS frozen, b.updated_at::time(0) AS read_at, b.ledger_net AS ledger, b.venue_net AS venue, (SELECT COALESCE(sum(filled_shares), 0) FROM live_orders WHERE us_market_slug = b.us_market_slug AND COALESCE(whale_username, '') = 'manual' AND status IN ('filled', 'exiting')) AS manual, (SELECT COALESCE(sum(shares), 0) FROM mirror_registered_positions r WHERE r.us_market_slug = b.us_market_slug) AS registered, round(b.his_net::numeric, 1) AS his_net, b.target, left(COALESCE((b.last_plan->'frozen_exit')::text, ''), 120) AS frozen_exit, (SELECT o.side || ' ' || o.qty || '@' || o.wire || ' ' || o.tif || ' ' || o.state || ' ' || o.placed_at::time(0) || ' filled=' || COALESCE(o.filled, 0) FROM mirror_orders o WHERE o.book_id = b.id AND o.reason LIKE 'frozen_reduce%' ORDER BY o.placed_at DESC LIMIT 1) AS last_reduce FROM mirror_books b WHERE b.state = 'frozen' ORDER BY b.frozen_at, b.id; SELECT id, whale, left(us_market_slug, 44) AS slug, shares, side, registered_at::time(0) AS at, registered_by, left(note, 80) AS note, source FROM mirror_registered_positions ORDER BY id DESC LIMIT 20;"; TO=30000 ;;
                # THE FROZEN BOOK IN FULL (2026-09-08): every frozen book's
                # own row (its last plan, its last reason, the freeze tick
                # count, the flow reference) with its market's closed /
                # resolved flags, then every order of a frozen book and every
                # non-terminal order anywhere -- for a book that stays frozen
                # after its order should have settled (book 455, order 2475)
                frozen-detail) SQL="SELECT b.id, left(b.us_market_slug, 40) AS slug, b.state, b.frozen_reason, b.last_reason, b.frozen_ticks AS fticks, b.frozen_at::time(0) AS frozen, b.updated_at::time(0) AS read_at, b.ledger_net AS ledger, b.venue_net AS venue, b.target, round(b.his_net::numeric, 1) AS his_net, round(b.flow_base::numeric, 1) AS flow_base, round(b.flow_last_net::numeric, 1) AS flow_last_net, m.closed AS m_closed, m.resolved AS m_resolved, left(b.last_plan::text, 1500) AS last_plan FROM mirror_books b LEFT JOIN markets m ON m.condition_id = b.condition_id WHERE b.state = 'frozen' ORDER BY b.id; SELECT o.id, o.book_id AS book, o.kind, o.side, o.tif, o.qty, o.wire, o.state, o.venue_state, o.filled, left(o.reason, 40) AS reason, o.placed_at::time(0) AS placed, o.done_at::time(0) AS done, left(o.order_id, 40) AS order_id, left(o.receipt::text, 400) AS receipt FROM mirror_orders o WHERE o.book_id IN (SELECT id FROM mirror_books WHERE state = 'frozen') OR o.state IN ('placing', 'open', 'unknown') ORDER BY o.id DESC LIMIT 40;"; TO=30000 ;;
                # THE CATALOGUE LAG (2026-09-08): a mirror book ends only when its
                # market's gamma row reads closed / resolved (step M) or the venue
                # settles its row; book 43's row (a 09-06 match) still read
                # closed=f resolved=f two days on. The resolution sweep chases
                # unresolved traded conditions 500 at a time with no order -- this
                # counts that backlog, shows the analytics beat, and lists every
                # open or frozen book with its row's flags and refresh time
                resolution-lag) SQL="SELECT count(DISTINCT t.condition_id) AS unresolved_traded FROM trades t LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE t.condition_id IS NOT NULL AND (m.condition_id IS NULL OR NOT m.resolved); SELECT count(DISTINCT t.condition_id) AS unresolved_traded_rn1 FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND (m.condition_id IS NULL OR NOT m.resolved); SELECT service, status, beat_at::time(0) AS beat, left(detail::text, 400) AS detail FROM service_heartbeats WHERE service IN ('analytics', 'metadata'); SELECT b.id, left(b.us_market_slug, 40) AS slug, b.state, b.frozen_reason, b.opened_at::time(0) AS opened, b.ledger_net AS ledger, left(b.condition_id, 14) AS cid, m.closed, m.resolved, m.updated_at::timestamp(0) AS m_updated FROM mirror_books b LEFT JOIN markets m ON m.condition_id = b.condition_id WHERE b.state <> 'closed' AND b.opened_at < now() - interval '12 hours' ORDER BY b.opened_at LIMIT 40;"; TO=30000 ;;
                # ONE BOOK IN FULL (2026-09-08): `book=<id>` -- the row with its
                # last plan, every order of it, our booked fills on its standing
                # row, and HIS fills on its condition (time, side, size, price)
                # -- for reading why a paired book landed on the other sign;
                # then (2026-09-08 14:1xZ, Martinez 529/534) the candidate
                # refusal rows on the book's own condition, newest first, so
                # a market that will not REOPEN after a close is read from
                # the live lane's own verdict (venue_already_holds on a
                # sub-share venue residual) and not inferred
                book=*) if [[ ! "$ARG" =~ ^book=([0-9]+)$ ]]; then echo "book: arg must be book=<id> (got '$ARG')"; exit 1; fi
                  BK="${BASH_REMATCH[1]}"
                  SQL="SELECT b.id, b.us_market_slug AS slug, b.condition_id, b.whale, b.intent, b.state, b.frozen_reason, b.last_reason, b.opened_at::timestamp(0) AS opened, b.closed_at::timestamp(0) AS closed, b.ledger_net AS ledger, b.venue_net AS venue, b.target, round(b.his_net::numeric, 1) AS his_net, round(b.avg_cost::numeric, 4) AS avg_cost, round(b.gross_buy_usd::numeric, 2) AS gross_buy, round(b.gross_sell_usd::numeric, 2) AS gross_sell, round(b.realized_pnl::numeric, 2) AS realized, round(b.settled_pnl::numeric, 2) AS settled, b.standing_row_id AS row, left(b.last_plan::text, 1200) AS last_plan FROM mirror_books b WHERE b.id = $BK; SELECT o.id, o.kind, o.side, o.tif, o.qty, o.wire, o.state, o.venue_state, o.filled, round(o.avg_px::numeric, 4) AS avg_px, left(o.reason, 40) AS reason, o.placed_at::time(0) AS placed, o.done_at::time(0) AS done FROM mirror_orders o WHERE o.book_id = $BK ORDER BY o.id; SELECT lo.id, lo.status, lo.side, round(lo.filled_shares::numeric, 2) AS shares, round(lo.fill_price::numeric, 4) AS fill_px, round(lo.filled_usd::numeric, 2) AS usd, round(lo.pnl::numeric, 2) AS pnl, lo.placed_at::timestamp(0) AS placed, lo.settled_at::timestamp(0) AS settled FROM live_orders lo WHERE lo.id = (SELECT standing_row_id FROM mirror_books WHERE id = $BK); SELECT t.ts::timestamp(0) AS his_ts, t.detected_at::timestamp(0) AS seen, t.side, round(t.size::numeric, 1) AS size, round(t.price::numeric, 4) AS px, round(t.notional::numeric, 2) AS usd, t.source, left(t.asset, 10) AS asset, CASE WHEN t.asset = b.long_asset THEN 'long' WHEN t.asset = b.other_asset THEN 'other' ELSE '?' END AS leg FROM trades t JOIN mirror_books b ON b.condition_id = t.condition_id JOIN whales w ON w.id = t.whale_id WHERE b.id = $BK AND lower(w.username) = lower(b.whale) ORDER BY t.ts LIMIT 80; SELECT r.at::timestamp(0) AS at, r.refusal, round(r.his_net::numeric, 1) AS his_net, r.target, r.mark, r.his_px, r.ask, r.books_live AS live, r.cand_reads AS reads, round(r.tick_s::numeric, 1) AS tick_s FROM mirror_candidate_refusals r JOIN mirror_books b ON b.condition_id = r.condition_id AND lower(r.whale) = lower(b.whale) WHERE b.id = $BK ORDER BY r.at DESC LIMIT 40; SELECT s.at::timestamp(0) AS judged, left(s.reason, 44) AS reason, round(s.his_net::numeric, 1) AS his_net, s.target, s.ledger_net AS ledger, s.venue_net AS venue, s.bid, s.ask, left(s.detail::text, 300) AS detail FROM mirror_shadow s JOIN mirror_books b ON b.condition_id = s.condition_id AND lower(s.whale) = lower(b.whale) WHERE b.id = $BK ORDER BY s.at DESC LIMIT 30; SELECT b2.id, b2.intent, b2.state, b2.frozen_reason, b2.last_reason, b2.opened_at::timestamp(0) AS opened, b2.closed_at::timestamp(0) AS closed, b2.ledger_net AS ledger, b2.venue_net AS venue, b2.target, round(b2.his_net::numeric, 1) AS his_net, round(b2.realized_pnl::numeric, 2) AS realized, round(b2.settled_pnl::numeric, 2) AS settled FROM mirror_books b2 JOIN mirror_books b ON b.condition_id = b2.condition_id AND lower(b2.whale) = lower(b.whale) WHERE b.id = $BK ORDER BY b2.id;"; TO=30000 ;;
                his-day) SQL="WITH his AS (SELECT t.condition_id, t.side, t.size, t.price, t.ts, COALESCE((m.resolved_prices->>mt.outcome_index)::numeric, NULL) AS rp, (m.resolved_prices IS NOT NULL) AS settled, EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = t.condition_id AND b.whale = 'rn1') AS ours FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '24 hours') SELECT CASE WHEN ours THEN 'markets we mirror' ELSE 'markets we do not mirror' END AS bucket, settled, count(DISTINCT condition_id) AS markets, count(*) AS fills, round(sum(size * price)::numeric, 0) AS usd_traded, round(sum(CASE WHEN settled THEN (CASE WHEN upper(side) = 'BUY' THEN 1 ELSE -1 END) * size * (rp - price) ELSE 0 END)::numeric, 0) AS his_settled_pnl FROM his GROUP BY 1, 2 ORDER BY 1, 2; SELECT left(COALESCE(max(t.market_slug), ''), 44) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 0) AS his_pnl, EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = t.condition_id AND b.whale = 'rn1') AS ours FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '24 hours' AND m.resolved_prices IS NOT NULL GROUP BY t.condition_id ORDER BY abs(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))) DESC LIMIT 40;"; TO=60000 ;;
                # THE LEAGUES THE MAPPER DOES NOT RECOGNISE (2026-09-07 14:xxZ, the
                # coverage program's league-code bucket, ~$170k/24 h): por, itsb,
                # col1, nor, gre1, bel1, ere, den, tur2, bra3, sui, cs2 all read
                # no_key_intersection. Two reads, each under the 300-line cap.
                # league-census: every venue league code listed for Sep 5-7 with
