                # whether the signs agree, and the book's last reason. Then the totals with
                # the fraction's median / min / max, cents_over's median and the latency
                # median. FILL lane 0b (2026-09-08), the target line: a market PAIRS ON ANY
                # SETTLED EPISODE (our stake and settled figure summed over the closed books
                # with settled_pnl; `episodes` / `settled_eps` beside them -- before, a market
                # with one live or unsettled episode was excluded whole, 58 mixed markets
                # holding +4,276.04 of our settled winners); the totals' dollar sums and ratios
                # run over the STAKED rows (our_staked > 0), the zero-stake rows counted as
                # zero_stake_mkts with their settled dollars beside (book 253: our_staked 0.00 /
                # settled +735.41 credited to the set); sign_agree still counts every row. The
                # pattern arm paired-day=<ISO> is this SQL with `b.opened_at >= that clock` on
                # the books window -- the set restricted to books opened after a deploy (the
                # bare label and the hourly stay the whole set). Read-only, LIMITed.
                paired-day) SQL="WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, round((sum(b.avg_cost * abs(b.ledger_net)) / NULLIF(sum(abs(b.ledger_net)), 0))::numeric, 4) AS our_avg FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower