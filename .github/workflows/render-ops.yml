                planned-unopened) SQL="WITH his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, us_market_slug, long_asset, other_asset, reason FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), tgt AS (SELECT h.*, sh0.us_market_slug AS us_slug, sh0.long_asset AS la0, sh0.other_asset AS oa0 FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id WHERE NOT EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = h.condition_id) AND h.usd > 0 ORDER BY h.usd DESC LIMIT 70), sla AS (SELECT s.condition_id, s.long_asset FROM mirror_shadow s JOIN tgt ON tgt.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours' AND s.long_asset IS NOT NULL ORDER BY s.at LIMIT 100000), lat AS (SELECT condition_id, min(long_asset) AS la FROM sla GROUP BY 1), tf AS (SELECT t.condition_id, min(t.ts) FILTER (WHERE t.asset = lat.la) AS first_long_fill, count(DISTINCT t.asset) AS n_assets, round(sum(t.size) FILTER (WHERE t.asset = lat.la AND upper(t.side) = 'BUY')::numeric, 0) AS long_buy_sh, round(sum(t.size) FILTER (WHERE t.asset <> lat.la AND upper(t.side) = 'BUY')::numeric, 0) AS other_buy_sh FROM trades t JOIN whales w ON w.id = t.whale_id JOIN lat ON lat.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' GROUP BY 1), dur AS (SELECT s.condition_id, count(*) AS n_dur, count(*) FILTER (WHERE s.long_asset IS NULL) AS n_la_null, min(s.at) FILTER (WHERE s.long_asset IS NOT NULL) AS la_first_set, count(*) FILTER (WHERE s.would_side IS NOT NULL) AS n_planned, count(*) FILTER (WHERE s.target < 0) AS n_tgt_neg, count(*) FILTER (WHERE s.target > 0) AS n_tgt_pos, mode() WITHIN GROUP (ORDER BY left(s.reason, 26)) AS reason_mode, min(s.reason) FILTER (WHERE s.would_side IS NOT NULL) AS a_planned_reason FROM mirror_shadow s JOIN tgt ON tgt.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= tgt.first_ts - interval '2 minutes' AND s.at <= tgt.last_ts GROUP BY 1), act AS (SELECT tgt.condition_id, (SELECT count(DISTINCT t2.condition_id) FROM trades t2 JOIN whales w2 ON w2.id = t2.whale_id WHERE lower(w2.username) = 'rn1' AND t2.ts >= tgt.first_ts - interval '6 hours' AND t2.ts <= tgt.first_ts) AS active_at_first FROM tgt) SELECT left(tgt.his_slug, 30) AS his_slug, left(tgt.us_slug, 34) AS us_slug, round(tgt.usd::numeric, 0) AS usd, tgt.first_ts::time(0) AS his_first, tgt.last_ts::time(0) AS his_last, tf.n_assets, tf.long_buy_sh, tf.other_buy_sh, tf.first_long_fill::time(0) AS first_long_fill, dur.n_dur, dur.n_la_null, dur.la_first_set::time(0) AS la_first_set, dur.n_planned, dur.n_tgt_neg, dur.n_tgt_pos, dur.reason_mode, (SELECT string_agg(p.side_norm || ':' || right(p.intent, 5), ' ' ORDER BY p.side_norm) FROM us_premap p WHERE p.identifier = tgt.us_slug) AS premap_sides, (SELECT string_agg(mt.outcome_index || '=' || left(mt.outcome, 8), ' ' ORDER BY mt.outcome_index) FROM market_tokens mt WHERE mt.condition_id = tgt.condition_id) AS tokens, (SELECT count(*) FROM live_orders lo WHERE lo.asset IN (tgt.la0, tgt.oa0)) AS n_live_orders, (SELECT count(*) FROM live_orders lo WHERE lo.us_market_slug = tgt.us_slug AND lo.placed_at >= now() - interval '48 hours') AS n_slug_orders, m.closed, (m.resolved_prices IS NOT NULL) AS resolved, act.active_at_first FROM tgt LEFT JOIN tf ON tf.condition_id = tgt.condition_id LEFT JOIN dur ON dur.condition_id = tgt.condition_id LEFT JOIN act ON act.condition_id = tgt.condition_id LEFT JOIN markets m ON m.condition_id = tgt.condition_id ORDER BY tgt.usd DESC LIMIT 70; SELECT date_trunc('hour', o.done_at) + (floor(extract(minute FROM o.done_at) / 30) * interval '30 minutes') AS half_hour, count(*) AS cancelled_under_stop, min(o.done_at)::time(0) AS first_at, max(o.done_at)::time(0) AS last_at, count(DISTINCT o.book_id) AS books FROM mirror_orders o WHERE o.reason = 'mirror_loss_stop' AND o.done_at >= now() - interval '48 hours' GROUP BY 1 ORDER BY 1 LIMIT 100; SELECT date_trunc('hour', b.opened_at) AS hour, count(*) AS books_opened, count(*) FILTER (WHERE b.intent = 'ORDER_INTENT_BUY_SHORT') AS short_books, count(*) FILTER (WHERE b.his_net < 0) AS his_net_neg, min(b.id) AS first_id, max(b.id) AS last_id FROM mirror_books b WHERE b.opened_at >= now() - interval '48 hours' GROUP BY 1 ORDER BY 1 LIMIT 60; WITH his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1), top AS (SELECT h.* FROM his h WHERE NOT EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = h.condition_id) AND h.his_slug NOT LIKE 'cfb-%' AND EXISTS (SELECT 1 FROM mirror_shadow s WHERE s.whale = 'rn1' AND s.condition_id = h.condition_id AND s.would_side IS NOT NULL AND s.at >= now() - interval '30 hours') ORDER BY h.usd DESC LIMIT 6), r AS (SELECT s.condition_id, s.at, s.reason, s.long_asset, s.other_asset, s.his_long, s.his_other, s.his_net, s.target, s.would_side, s.would_px, s.bid, s.ask, s.detail->>'his_paired_sh' AS paired, s.detail->>'map' AS map, row_number() OVER (PARTITION BY s.condition_id ORDER BY s.at) AS rn, count(*) OVER (PARTITION BY s.condition_id) AS n FROM mirror_shadow s JOIN top ON top.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= top.first_ts - interval '2 minutes' AND s.at <= top.last_ts + interval '2 minutes') SELECT left(top.his_slug, 28) AS his_slug, r.at::time(0) AS at, left(r.reason, 30) AS reason, (r.long_asset IS NULL) AS la_null, left(r.long_asset, 6) AS la, left(r.other_asset, 6) AS oa, round(r.his_long::numeric, 0) AS his_long, round(r.his_other::numeric, 0) AS his_other, round(r.his_net::numeric, 0) AS his_net, r.target, r.would_side, r.would_px, r.bid, r.ask, r.paired, r.map FROM r JOIN top ON top.condition_id = r.condition_id WHERE r.rn = 1 OR r.rn = r.n OR r.rn % 10 = 0 ORDER BY top.usd DESC, r.at LIMIT 150;"; TO=120000 ;;
                unread-rows) SQL="WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1') SELECT h.league, sh0.family, COALESCE(sh0.state, '(none)') AS state, (sh0.bid IS NOT NULL) AS has_bid, (sh0.ask IS NOT NULL) AS has_ask, COALESCE(sh0.bbo_error, '') AS bbo_error, count(*) AS markets, round(sum(h.usd)::numeric, 0) AS usd, round(avg(EXTRACT(EPOCH FROM (sh0.at - h.last_ts)) / 60.0)::numeric, 1) AS judged_min_after_his_last FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason LIKE 'no mark:%' GROUP BY 1, 2, 3, 4, 5, 6 ORDER BY 8 DESC LIMIT 60; WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), tgt AS (SELECT h.*, sh0.family, sh0.us_market_slug FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason LIKE 'no mark:%'), r AS (SELECT s.condition_id, s.at, s.reason, s.bid, s.ask, s.target, s.his_net, s.detail->>'state' AS state, s.detail->>'bbo_error' AS err, s.detail->>'snap_state' AS snap FROM mirror_shadow s JOIN tgt ON tgt.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours') SELECT left(tgt.his_slug, 34) AS his_slug, left(tgt.us_market_slug, 36) AS us_slug, tgt.fills, round(tgt.usd::numeric, 0) AS usd, tgt.first_ts::time(0) AS his_first, tgt.last_ts::time(0) AS his_last, mst.game_start::time(0) AS gstart, m.closed, (m.resolved_prices IS NOT NULL) AS resolved, count(r.at) AS n, min(r.at)::time(0) AS sh_first, max(r.at)::time(0) AS sh_last, left((array_agg(r.reason ORDER BY r.at))[1], 26) AS first_reason, count(*) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL) AS n_open2, min(r.at) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL)::time(0) AS open2_first, max(r.at) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL)::time(0) AS open2_last, count(*) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND (r.bid IS NULL) <> (r.ask IS NULL)) AS n_1side, count(*) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NULL AND r.ask IS NULL) AS n_open0, count(*) FILTER (WHERE r.state IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION')) AS n_term, min(r.at) FILTER (WHERE r.state IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION'))::time(0) AS term_first, count(*) FILTER (WHERE r.state IS NOT 