fter_his FROM oo JOIN hs ON hs.condition_id = oo.condition_id), ox AS (SELECT condition_id, min(placed_at) FILTER (WHERE after_his) AS our_exit_ts, count(*) FILTER (WHERE after_his) AS our_exit_placed, sum(filled) FILTER (WHERE after_his) AS our_exit_filled, sum(avg_px * filled) FILTER (WHERE after_his AND filled > 0 AND avg_px IS NOT NULL) / NULLIF(sum(filled) FILTER (WHERE after_his AND filled > 0 AND avg_px IS NOT NULL), 0) AS our_exit_px FROM ow GROUP BY condition_id), pair AS (SELECT bk.book, left(COALESCE(hp.his_slug, bk.slugs), 30) AS market, CASE WHEN bk.is_short THEN 'short' ELSE 'long' END AS side, round(hs.peak::numeric, 0) AS his_peak, hs.exit_from::time(0) AS his_exit_from, hs.exit_ts::time(0) AS his_exit_ts, round(hs.exit_px::numeric, 3) AS his_exit_px, round(hs.exit_usd::numeric, 2) AS his_exit_usd, CASE WHEN hs.peak > 0 THEN round((1 - COALESCE(hs.trough, hs.peak) / hs.peak)::numeric, 2) END AS his_reduced_pct, hp.his_pnl, round(op.our_peak::numeric, 0) AS our_peak, ox.our_exit_ts::time(0) AS our_exit_ts, round(ox.our_exit_px::numeric, 3) AS our_exit_px, round((ox.our_exit_filled / NULLIF(op.our_peak, 0))::numeric, 2) AS our_exit_filled_pct, round(extract(epoch FROM (ox.our_exit_ts - hs.exit_from))::numeric, 0) AS lag_s, round(((CASE WHEN bk.is_short THEN ox.our_exit_px - hs.exit_px ELSE hs.exit_px - ox.our_exit_px END) * 100)::numeric, 1) AS cents_vs_his, (COALESCE(ox.our_exit_filled, 0) = 0 AND bk.settled_ok) AS held_to_settlement, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN COALESCE(op.our_peak, 0) <= 0 THEN 'no_position' WHEN hs.condition_id IS NULL THEN 'his_net_unseen' WHEN hs.exit_ts IS NULL AND (1 - COALESCE(hs.trough, hs.peak) / hs.peak) >= 0.25 AND abs(COALESCE(ox.our_exit_filled, 0) / NULLIF(op.our_peak, 0) - (1 - COALESCE(hs.trough, hs.peak) / hs.peak)) <= 0.05 THEN 'we_matched_his_cut' WHEN hs.exit_ts IS NULL AND (1 - COALESCE(hs.trough, hs.peak) / hs.peak) >= 0.25 AN