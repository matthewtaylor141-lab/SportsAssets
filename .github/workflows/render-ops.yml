                books-new) SQL="SELECT b.id, b.us_market_slug AS slug, b.intent, b.map_source AS src, b.ratio, b.target, b.ledger_net AS held, round(b.his_net::numeric, 1) AS his_net, round(b.avg_cost::numeric, 3) AS avg_cost, b.opened_at::time(0) AS opened, b.state, left(b.long_asset, 14) AS long_asset, b.last_reason, left(b.last_plan::text, 260) AS last_plan, (SELECT string_agg(o.side || ' ' || o.qty || '@' || o.wire || ' ' || o.state, ' | ' ORDER BY o.placed_at) FROM mirror_orders o WHERE o.book_id = b.id) AS orders FROM mirror_books b WHERE b.id >= 23 ORDER BY b.id; SELECT b.id AS book, t.outcome, t.side, count(*) AS n, round(sum(t.size)::numeric, 1) AS shares, round(avg(t.price)::numeric, 3) AS avg_px, max(t.ts)::time(0) AS last_ts, max(t.market_slug) AS his_slug, (t.asset = b.long_asset) AS is_long_asset FROM mirror_books b JOIN trades t ON t.condition_id = b.condition_id JOIN whales w ON w.id = t.whale_id AND lower(w.username) = b.whale WHERE b.id >= 23 GROUP BY b.id, t.outcome, t.side, (t.asset = b.long_asset) ORDER BY b.id, 2; SELECT b.id AS book, u.identifier, u.side_norm, u.intent AS venue_intent, u.line, left(u.question, 90) AS question FROM mirror_books b JOIN us_premap u ON u.identifier = b.us_market_slug OR u.market_slug = b.us_market_slug WHERE b.id >= 23 ORDER BY b.id, u.side_norm;"; TO=30000 ;;
                # THE FAMILIES THE MAPPER HAS NO LANE FOR (2026-09-07 13:5xZ, coverage-gap census:
                # exact_score ~$112k, prop ~$88k, unknown ~$41k in RN1's last 24 h). nf-his: his
                # rows (30 h) on those families -- slug, HIS title, the stored event title (the
                # key the resolver builds from), outcome, dollars -- and the shadow's newest
                # verdict per market; then the digit-code slugs the parser refuses ('cu1',
                # 'riv1', 'cor1', 'her1' read unknown_market_type:unparsed). nf-venue: the
                # venue's rows for the same games -- every distinct SUFFIX shape the venue lists
                # on one Premier League event (does it list corners, player goals, team totals,
                # halves?), the first-half per-team rows with their questions, the exact-score
                # rows for the La Liga game he traded (val-bar vs the venue's val-fcb), and the
                # CS2 board (the astatc map rows' sides and questions, the codes it lists) --
                # so every lane below is proposed on the venue's own words, never a guess.
                nf-his) SQL="WITH his AS (SELECT t.condition_id, t.market_slug AS his_slug, max(t.market_title) AS his_title, max(m.event_title) AS event_title, string_agg(DISTINCT t.outcome, '/') AS outcomes, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, max(t.ts)::time(0) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND (t.market_slug LIKE '%-exact-score-%' OR t.market_slug LIKE '%-halftime-result-%' OR t.market_slug LIKE '%-team-total-%' OR t.market_slug LIKE '%-game_' OR t.market_slug LIKE '%-map%' OR t.market_slug LIKE '%-corner%' OR t.market_slug LIKE '%-card%' OR t.market_slug LIKE '%-player-%' OR t.market_slug LIKE '%scorer%' OR t.market_slug ~ '-[a-z]+[0-9]$') GROUP BY 1, 2), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, detail->>'family' AS family, left(detail->>'explain', 50) AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '31 hours' ORDER BY condition_id, at DESC) SELECT left(h.his_slug, 48) AS his_slug, left(h.his_title, 62) AS his_title, left(COALESCE(h.event_title, '(null)'), 36) AS event_title, left(h.outcomes, 14) AS outcomes, h.fills, h.usd, h.last_ts, sh.family, sh.explain, sh.at::time(0) AS judged FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id ORDER BY h.usd DESC LIMIT 90; SELECT split_part(t.market_slug, '-', 1) AS lg, CASE WHEN t.market_slug LIKE '%-exact-score-%' THEN 'exact_score' WHEN t.market_slug LIKE '%-halftime-result-%' THEN 'halftime_result' WHEN t.market_slug LIKE '%-team-total-%' THEN 'team_total' WHEN t.market_slug LIKE '%-game_' THEN 'game_n' WHEN t.market_slug ~ '-[a-z]+[0-9]$' THEN 'digit_code' ELSE 'other' END AS shape, count(DISTINCT t.condition_id) AS markets, round(sum(t.size * t.price)::numeric, 0) AS usd, count(DISTINCT m.event_title) AS n_event_titles, count(DISTINCT t.condition_id) FILTER (WHERE m.event_title IS NULL) AS no_event_title FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND (t.market_slug LIKE '%-exact-score-%' OR t.market_slug LIKE '%-halftime-result-%' OR t.market_slug LIKE '%-team-total-%' OR t.market_slug LIKE '%-game_' OR t.market_slug ~ '-[a-z]+[0-9]$') GROUP BY 1, 2 ORDER BY 4 DESC LIMIT 60;"; TO=60000 ;;
                nf-venue) SQL="SELECT split_part(identifier, '-', 1) AS prefix, regexp_replace(identifier, '^[a-z]+-epl-eve-mnu-2026-09-06-?', '') AS suffix, count(*) AS rows, string_agg(DISTINCT side_norm, '/') AS sides, max(line) AS line, max(left(question, 96)) AS question FROM us_premap WHERE identifier LIKE '%-epl-eve-mnu-2026-09-06%' AND identifier NOT LIKE '%-exact-score-%' AND identifier NOT LIKE '%-g-%' GROUP BY 1, 2 ORDER BY 1, 2 LIMIT 70; SELECT split_part(identifier, '-', 1) AS prefix, regexp_replace(regexp_replace(identifier, '^[a-z]+-epl-eve-mnu-2026-09-06-', ''), '-[a-z0-9]+-(gte?[0-9]+(pt5)?)$', '-<player>-\\1') AS shape, count(*) AS rows, min(left(question, 90)) AS question FROM us_premap WHERE identifier LIKE '%-epl-eve-mnu-2026-09-06-g-%' GROUP BY 1, 2 ORDER BY 2 LIMIT 12; SELECT identifier, side_norm, intent, line, left(question, 100) AS question FROM us_premap WHERE (identifier LIKE 'atc-epl-eve-mnu-2026-09-06-fh-%' OR identifier LIKE 'atc-epl-ars-cfc-2026-09-06-fh-%' OR identifier LIKE 'atc-lal-val-fcb-2026-09-06-exact-score-1-2' OR identifier LIKE 'atc-lal-val-fcb-2026-09-06-exact-score-2-1' OR identifier LIKE 'atc-lal-val-fcb-2026-09-06-val' OR identifier LIKE 'atc-lal-val-fcb-2026-09-06-fcb' OR identifier LIKE 'atc-lal-%-2026-09-06-mal%' OR identifier LIKE 'atc-lal-%-2026-09-06-lev%') ORDER BY identifier, side_norm LIMIT 40; SELECT split_part(identifier, '-', 3) || '-' || split_part(identifier, '-', 4) AS codes, string_agg(DISTINCT split_part(identifier, '-', 1), '/') AS prefixes, count(*) AS rows, max(event_title) AS event_title FROM us_premap WHERE identifier LIKE '%-cs2-%-2026-09-06%' GROUP BY 1 ORDER BY 1 LIMIT 40; SELECT identifier, side_norm, intent, line, left(question, 100) AS question FROM us_premap WHERE identifier LIKE 'astatc-cs2-%-2026-09-06-map%' AND (identifier LIKE '%-fnc-nip-%' OR identifier LIKE '%-hero-1win-%' OR identifier LIKE '%-1win-ast%') ORDER BY identifier, side_norm LIMIT 24; SELECT identifier, side_norm, intent, left(question, 100) AS question FROM us_premap WHERE identifier LIKE 'atc-pdc-%-2026-09-06-%' AND identifier NOT LIKE '%-fh-%' AND identifier NOT LIKE '%-sh-%' AND identifier NOT LIKE '%-exact-score-%' ORDER BY identifier, side_norm LIMIT 24;"; TO=60000 ;;
                *) echo "sql: arg must be one of activity|tables|sizes|indexes|analyze|index053|mirror-on|mirror-off|mirror-state|mirror-preflight|mirror-rearm|mirror-tick|mirror-refusals|mirror-pnl|his-recent|mirror-why|copy-lane|premap-rows|book-drift|drift-16|books-new|c4-rows|c4-shadow|gap-soccer-his|gap-soccer-venue|nf-his|nf-venue|c3-rows|cfb-his|cfb-venue|epl-rows|unread-rows|coverage-gap|his-day|league-census|league-rows|prefix-rows|close-rows|verify-day (got '$ARG')"; exit 1 ;;
              esac
              command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1; }
              get "/postgres/$PG/connection-info" > /tmp/ci.json
              EXT=$(jq -r '.externalConnectionString // empty' /tmp/ci.json); PW=$(jq -r '.password // empty' /tmp/ci.json)
              [ -n "$PW" ] && echo "::add-mask::$PW"; [ -n "$EXT" ] && echo "::add-mask::$EXT"
              [ -z "$EXT" ] && { echo "no external connection string returned; body: $(jq -c 'keys' /tmp/ci.json 2>/dev/null)"; exit 1; }
              echo "== $SERVICE ($PG): $SQL  (statement_timeout ${TO}ms) =="
              PGOPTIONS="-c statement_timeout=$TO" timeout $(( TO / 1000 + 60 )) psql "$EXT" -X -v ON_ERROR_STOP=1 -c "$SQL" 2>&1 | grep -v -F "$PW" | head -300
              echo "psql exit=${PIPESTATUS[0]}"
              ;;
            env-keys)
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "== env var keys on $SERVICE ($ID) =="
              get "/services/$ID/env-vars?limit=100" | jq -r '.[]? | .envVar | "  \(.key)  (\(.value | length) chars)"' || echo "(env read failed)"
              ;;
            env-get)
              # VALUES of the operator FLAGS only -- never a key, token, URL or
              # credential. The switches that decide whether money moves
              # (LIVE_COPY_HALT: 'on'/'1'/'true'/'yes'/'halt'/'stop' halt) must
              # be readable without a screenshot; everything else stays masked.
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              FLAGS=" LIVE_COPY_HALT LIVE_TRADING_ENABLED AI_TRADER_ENABLED COPY_PROBE_ENABLED LIVE_PREMAP LIVE_ALLOW_SHORT LIVE_VERIFIED_WHALES LIVE_PREMAP_WHALES WHALE_EXIT_MAX_SIBLINGS RETENTION API_INGESTION_FALLBACK LIVE_COPY_CONCURRENCY "
              get "/services/$ID/env-vars?limit=100" > /tmp/env.json
              for k in ${ARG//,/ }; do
                case "$FLAGS" in
                  *" $k "*) v=$(jq -r --arg k "$k" '.[]? | .envVar | select(.key==$k) | .value' /tmp/env.json | head -1)
                            if [ -n "$v" ]; then echo "  $k = '$v'"; else echo "  $k is not set on $SERVICE (code default applies)"; fi ;;
                  *) echo "  $k is not an operator flag; refusing to print it" ;;
                esac
              done
              ;;
            env-set)
              need_confirm
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              K="${ARG%%=*}"; V="${ARG#*=}"
              if [ -z "$K" ] || [ "$K" = "$ARG" ]; then echo "env-set: arg must be KEY=VALUE"; exit 1; fi
              echo "::add-mask::$V"
              echo "env-set $K on $SERVICE ($ID) (value: ${#V} chars, masked)"
              CODE=$(curl -sS --max-time 45 -o /tmp/post.json -w '%{http_code}' -X PUT \
                     -H "Authorization: Bearer $KEY" -H "Accept: application/json" -H "Content-Type: application/json" \
                     -d "{\"value\":$(printf '%s' "$V" | jq -Rs .)}" "$API/services/$ID/env-vars/$K")
              echo "HTTP $CODE"; jq -r '"  \(.key // "?") = (\((.value // "") | length) chars)"' /tmp/post.json 2>/dev/null || head -c 300 /tmp/post.json
              echo "(Render redeploys the service on an env change; read 'deploys' to follow it)"
              ;;
            env-del)
              need_confirm
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              [ -z "$ARG" ] && { echo "env-del: arg must be KEY"; exit 1; }
              echo "env-del $ARG on $SERVICE ($ID)"
              CODE=$(curl -sS --max-time 45 -o /tmp/post.json -w '%{http_code}' -X DELETE \
                     -H "Authorization: Bearer $KEY" -H "Accept: application/json" "$API/services/$ID/env-vars/$ARG")
              echo "HTTP $CODE"; head -c 300 /tmp/post.json 2>/dev/null; echo
              ;;
            *) echo "unknown action $ACTION"; exit 1 ;;
          esac
          exit 0
