le IS NULL) AS no_event_title FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND (t.market_slug LIKE '%-exact-score-%' OR t.market_slug LIKE '%-halftime-result-%' OR t.market_slug LIKE '%-team-total-%' OR t.market_slug LIKE '%-game_' OR t.market_slug ~ '-[a-z]+[0-9]$') GROUP BY 1, 2 ORDER BY 4 DESC LIMIT 60;"; TO=60000 ;;
