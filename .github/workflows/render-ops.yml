                premap-rows) SQL="SELECT identifier, side_norm, line, intent, question, event_keys FROM us_premap WHERE identifier LIKE 'atc-%' AND (identifier LIKE 'atc-sea-juv-mil-2026-09-06%' OR identifier LIKE 'atc-lal-esp-sev-2026-09-06%' OR identifier LIKE 'atc-els-kbk-tro-2026-09-06%' OR identifier LIKE 'atc-sea-bol-sas-2026-09-06%' OR identifier LIKE 'atc-lpa-ros-new-2026-09-06%') ORDER BY identifier, side_norm; SELECT t.market_slug AS his_slug, max(t.market_title) AS his_title, max(m.title) AS m_title, max(t.event_slug) AS his_event, max(m.event_title) AS m_event_title, max(t.outcome) AS outcome FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.market_slug IN ('sea-juv-mil-2026-09-06-juv', 'lal-esp-sev-2026-09-06-esp', 'nor-kbk-tro-2026-09-06-tro', 'sea-bol-sas-2026-09-06-sas', 'arg-ros-new-2026-09-06-new', 'fl1-olm-pfc-2026-09-06-olm', 'por-gui-cas-2026-09-06-gui') GROUP BY 1; SELECT split_part(identifier, '-', 2) AS lg, count(DISTINCT split_part(identifier, '-', 3) || '-' || split_part(identifier, '-', 4)) AS games FROM us_premap WHERE identifier LIKE 'atc-%-2026-09-06%' GROUP BY 1 ORDER BY 2 DESC LIMIT 40;"; TO=30000 ;;
                # [R53] see .github/workflows/RENDER_OPS_NOTES.md
                esports-chi-rows) SQL="WITH sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, left(detail->>'explain', 44) AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '36 hours' ORDER BY condition_id, at DESC) SELECT t.market_slug AS his_slug, max(t.market_title) AS his_title, max(m.event_title) AS m_event_title, left(max(m.title), 40) AS m_title, t.outcome, max(t.outcome_index) AS oi, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, min(t.ts)::time(0) AS first_ts, max(t.ts)::time(0) AS last_ts, COALESCE(max(sh.explain), '(never judged)') AS explain, max(sh.at)::time(0) AS judged FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id LEFT JOIN sh ON sh.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND (split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('chi1', 'col1', 'cs2') OR (split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('bra', 'arg') AND COALESCE(sh.explain, '') LIKE '%yn:no-row%')) GROUP BY t.market_slug, t.outcome ORDER BY 1, 5 LIMIT 40; SELECT identifier, side_norm, intent, line, left(question, 120) AS question, left(event_title, 44) AS v_event_title, updated_at::time(0) AS upd FROM us_premap WHERE (identifier LIKE 'atc-csl-%' OR identifier LIKE 'atc-pdc-%' OR identifier LIKE 'atc-lco-%') AND identifier ~ '2026-09-0[5-7]' AND identifier NOT LIKE '%-fh-%' AND identifier NOT LIKE '%-sh-%' AND identifier NOT LIKE '%-exact-score-%' ORDER BY identifier, side_norm LIMIT 40; WITH he AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS his_lg, t.market_slug AS his_slug, substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS d, lower(substring(t.market_title from '^Will (.+) win on ')) AS club FROM trades t JOIN whales w ON w.id = t.whale_id JOIN (SELECT DISTINCT ON (condition_id) condition_id, detail->>'explain' AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '36 hours' ORDER BY condition_id, at DESC) sh ON sh.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('chi1', 'col1', 'bra', 'arg') AND sh.explain LIKE '%yn:no-row%' AND t.market_title LIKE 'Will % win on %') SELECT he.his_lg, he.his_slug, he.club, u.identifier, u.side_norm, u.intent, u.line, left(u.question, 110) AS question FROM he JOIN us_premap u ON u.identifier LIKE 'atc-%' AND u.identifier LIKE ('%-' || he.d || '-%') AND u.identifier NOT LIKE '%-fh-%' AND u.identifier NOT LIKE '%-sh-%' AND he.club IS NOT NULL AND translate(lower(u.question), 'áéíóúàèìòùâêîôûãõçñäöüøłđ', 'aeiouaeiouaeiouaocnaouold') LIKE ('%' || translate(he.club, 'áéíóúàèìòùâêîôûãõçñäöüøłđ', 'aeiouaeiouaeiouaocnaouold') || '%') ORDER BY 1, 2, 4, 5 LIMIT 40; SELECT identifier, side_norm, intent, line, left(question, 120) AS question, left(event_title, 50) AS v_event_title FROM us_premap WHERE identifier LIKE 'aec-cs2-%' AND identifier ~ '2026-09-0[67]' ORDER BY identifier, side_norm LIMIT 30; SELECT identifier, side_norm, intent, line, signed, left(question, 120) AS question FROM us_premap WHERE identifier ~ '^(astatc|asc|tsc)-cs2-(fnc-nip|hero-1win|hero-eac|1win-astr|fokus|k27|sin|bbl|rustec|for)' AND identifier ~ '2026-09-0[67]' AND (identifier LIKE '%-map%' OR identifier LIKE '%-hcap-%' OR identifier LIKE '%-tot-%') ORDER BY identifier, side_norm LIMIT 120;"; TO=60000 ;;
                book-drift) SQL="SELECT b.id AS book, left(b.us_market_slug, 36) AS slug, b.ledger_net AS held, b.target, s.at::time(0) AS judged, round(s.his_long::numeric, 1) AS his_long, round(s.his_other::numeric, 1) AS his_other, round(s.snap_long::numeric, 1) AS snap_long, round(s.snap_other::numeric, 1) AS snap_other, round(s.his_net::numeric, 1) AS his_net, s.detail->>'drift' AS drift, s.detail->>'snap_state' AS snap_state, s.detail->>'snap_age_s' AS snap_age, s.detail->>'fills_since_snap' AS fills_since, left(s.reason, 36) AS reason, s.detail->>'state' AS mkt_state FROM mirror_books b LEFT JOIN LATERAL (SELECT * FROM mirror_shadow s WHERE s.condition_id = b.condition_id AND s.whale = b.whale ORDER BY s.at DESC LIMIT 1) s ON true WHERE b.state <> 'closed' ORDER BY b.id;"; TO=30000 ;;
                # [R54] see .github/workflows/RENDER_OPS_NOTES.md
                drift-16) SQL="SELECT t.source, t.side, t.outcome, count(*) AS n, round(sum(t.size)::numeric, 1) AS shares, min(t.ts)::time(0) AS first_ts, max(t.ts)::time(0) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) GROUP BY 1, 2, 3 ORDER BY 1, 2, 3; SELECT left(t.tx_hash, 18) AS tx, left(t.outcome, 8) AS outcome, t.side, count(*) AS n, string_agg(t.source || ':' || round(t.size::numeric, 1) || '@' || round(t.price::numeric, 3) || ' ' || t.ts::time(0) || ' key=' || left(t.dedupe_key, 40), ' | ' ORDER BY t.id) AS rows FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) GROUP BY 1, 2, 3 HAVING count(*) > 1 ORDER BY n DESC LIMIT 12; SELECT 'multi-row tx' AS what, count(*) AS tx_groups, sum(n - 1) AS extra_rows, round(sum(extra_sh)::numeric, 1) AS extra_shares FROM (SELECT t.tx_hash, t.asset, t.side, count(*) AS n, sum(t.size) - max(t.size) AS extra_sh FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) GROUP BY 1, 2, 3 HAVING count(*) > 1) x; SELECT 'same size+price+minute, both sources' AS what, count(*) AS pairs, round(sum(sz)::numeric, 1) AS shares FROM (SELECT t.asset, round(t.size::numeric, 2) AS sz, round(t.price::numeric, 3) AS px, date_trunc('minute', t.ts) AS m FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) GROUP BY 1, 2, 3, 4 HAVING count(DISTINCT t.source) = 2) y; SELECT 'rn1 today by source' AS what, source, count(*) AS n, round(sum(size)::numeric, 0) AS shares, round(sum(notional)::numeric, 0) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= date_trunc('day', now()) GROUP BY 1, 2; SELECT s.at::time(0) AS at, round(s.his_long::numeric, 0) AS his_long, round(s.his_other::numeric, 0) AS his_other, round(s.snap_long::numeric, 0) AS snap_long, round(s.snap_other::numeric, 0) AS snap_other, s.detail->>'drift' AS drift, s.detail->>'fills_since_snap' AS fills_since, s.detail->>'snap_age_s' AS snap_age, left(s.reason, 30) AS reason FROM mirror_shadow s WHERE s.whale = 'rn1' AND s.condition_id = (SELECT condition_id FROM mirror_books WHERE id = 16) ORDER BY s.at DESC LIMIT 30;"; TO=30000 ;;
                # [R55] see .github/workflows/RENDER_OPS_NOTES.md
                fills-vs-venue) SQL="WITH bk AS (SELECT DISTINCT ON (b.condition_id) b.condition_id, b.id AS book, b.long_asset, b.other_asset, b.state, left(b.us_market_slug, 36) AS slug, (b.last_plan->>'mkt_long')::float8 AS mkt_long, (b.last_plan->>'mkt_other')::float8 AS mkt_other, (b.last_plan->>'snap_net')::float8 AS snap_net, (b.last_plan->>'flow_net')::float8 AS flow_net, (b.last_plan->>'drift')::float8 AS drift, b.last_plan->>'drift_src' AS drift_src, COALESCE(to_timestamp((b.last_plan->>'at')::float8), now()) AS plan_ts FROM mirror_books b WHERE b.whale = 'rn1' ORDER BY b.condition_id, b.id DESC), r AS (SELECT t.id, t.condition_id, t.asset, upper(t.side) AS side, t.size::float8 AS size, t.price::float8 AS price, t.ts, COALESCE(t.source, '') AS source, t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text) AS tx_key, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' AND EXISTS (SELECT 1 FROM bk WHERE bk.condition_id = t.condition_id)), k AS (SELECT r.*, bool_or(r.net_leg) OVER w AS has_net_leg, COALESCE(sum(r.size) FILTER (WHERE NOT r.net_leg) OVER w, 0.0) AS match_sum, sum(r.size * r.price) FILTER (WHERE NOT r.net_leg) OVER w / NULLIF(sum(r.size) FILTER (WHERE NOT r.net_leg) OVER w, 0.0) AS match_vwap FROM r WINDOW w AS (PARTITION BY r.whale_id, r.tx_key, r.asset, r.side)), rep AS (SELECT m.id AS m_id, row_number() OVER (PARTITION BY n.id ORDER BY m.id) AS m_rank, row_number() OVER (PARTITION BY m.id ORDER BY n.id) AS n_rank FROM r m JOIN r n ON n.whale_id = m.whale_id AND n.tx_key = m.tx_key AND n.asset = m.asset AND n.side = m.side AND n.net_leg AND NOT m.net_leg AND (round(n.price::numeric, 2) = round(m.price::numeric, 2) OR abs(round(n.price::numeric, 3) - round(m.price::numeric, 3)) <= 0.005) AND abs(n.size - m.size) <= greatest(0.01, 0.001 * n.size)), c AS (SELECT k.*, (NOT k.net_leg AND k.has_net_leg) AS old_collapsed, COALESCE(NOT k.net_leg AND k.has_net_leg AND (EXISTS (SELECT 1 FROM (SELECT sum(n.size) AS leg_size, sum(n.size * n.price) / sum(n.size) AS leg_vwap FROM r n WHERE n.whale_id = k.whale_id AND n.tx_key = k.tx_key AND n.asset = k.asset AND n.side = k.side AND n.net_leg GROUP BY n.source) leg WHERE abs(k.match_sum - leg.leg_size) <= greatest(0.01, 0.001 * leg.leg_size) AND (round(k.match_vwap::numeric, 2) = round(leg.leg_vwap::numeric, 2) OR abs(round(k.match_vwap::numeric, 3) - round(leg.leg_vwap::numeric, 3)) <= 0.005)) OR EXISTS (SELECT 1 FROM rep WHERE rep.m_id = k.id AND rep.m_rank = rep.n_rank)), false) AS new_collapsed FROM k), j AS (SELECT c.*, bk.long_asset, bk.other_asset, bk.plan_ts, CASE WHEN c.side = 'BUY' THEN c.size ELSE -c.size END AS signed FROM c JOIN bk ON bk.condition_id = c.condition_id), per AS (SELECT j.condition_id, count(*) FILTER (WHERE j.source = 'chain') AS chain_rows, round(COALESCE(sum(j.size) FILTER (WHERE j.source = 'chain'), 0)::numeric, 1) AS chain_sh, count(*) FILTER (WHERE j.source = 's1') AS s1_rows, round(COALESCE(sum(j.size) FILTER (WHERE j.source = 's1'), 0)::numeric, 1) AS s1_sh, count(*) FILTER (WHERE NOT j.net_leg) AS poll_rows, round(COALESCE(sum(j.size) FILTER (WHERE NOT j.net_leg), 0)::numeric, 1) AS poll_sh, round(COALESCE(sum(j.size) FILTER (WHERE j.ts > j.plan_ts), 0)::numeric, 1) AS later_sh, round(COALESCE(sum(j.signed) FILTER (WHERE j.asset = j.long_asset AND NOT j.old_collapsed AND j.ts <= j.plan_ts), 0)::numeric, 1) AS old_long, round(COALESCE(sum(j.signed) FILTER (WHERE j.asset = j.other_asset AND NOT j.old_collapsed AND j.ts <= j.plan_ts), 0)::numeric, 1) AS old_other, round(COALESCE(sum(j.signed) FILTER (WHERE j.asset = j.long_asset AND NOT j.new_collapsed AND j.ts <= j.plan_ts), 0)::numeric, 1) AS new_long, round(COALESCE(sum(j.signed) FILTER (WHERE j.asset = j.other_asset AND NOT j.new_collapsed AND j.ts <= j.plan_ts), 0)::numeric, 1) AS new_other, round(COALESCE(sum(j.size) FILTER (WHERE j.old_collapsed), 0)::numeric, 1) AS old_dropped_sh, round(COALESCE(sum(j.size) FILTER (WHERE j.new_collapsed), 0)::numeric, 1) AS new_dropped_sh, round(COALESCE(sum(j.size * j.price) FILTER (WHERE j.old_collapsed AND NOT j.new_collapsed), 0)::numeric, 0) AS kept_usd FROM j GROUP BY 1) SELECT bk.book, bk.slug, bk.state, per.chain_rows, per.chain_sh, per.s1_rows, per.s1_sh, per.poll_rows, per.poll_sh, per.old_long, per.old_other, (per.old_long - per.old_other) AS old_net, per.new_long, per.new_other, (per.new_long - per.new_other) AS new_net, per.old_dropped_sh, per.new_dropped_sh, per.kept_usd, per.later_sh, round(bk.mkt_long::numeric, 1) AS mkt_long, round(bk.mkt_other::numeric, 1) AS mkt_other, round(COALESCE(bk.snap_net, bk.mkt_long - bk.mkt_other)::numeric, 1) AS snap_net, round(bk.flow_net::numeric, 1) AS flow_net, bk.drift, bk.drift_src, bk.plan_ts::time(0) AS plan_at, round(abs((per.old_long - per.old_other) - COALESCE(bk.snap_net, bk.mkt_long - bk.mkt_other))::numeric, 1) AS gap_old, round(abs((per.new_long - per.new_other) - COALESCE(bk.snap_net, bk.mkt_long - bk.mkt_other))::numeric, 1) AS gap_new FROM per JOIN bk ON bk.condition_id = per.condition_id ORDER BY gap_new DESC NULLS LAST, bk.book DESC LIMIT 60; WITH bk AS (SELECT DISTINCT ON (b.condition_id) b.condition_id, b.long_asset, b.other_asset, (b.last_plan->>'mkt_long')::float8 AS mkt_long, (b.last_plan->>'mkt_other')::float8 AS mkt_other, (b.last_plan->>'snap_net')::float8 AS snap_net, COALESCE(to_timestamp((b.last_plan->>'at')::float8), now()) AS plan_ts FROM mirror_books b WHERE b.whale = 'rn1' ORDER BY b.condition_id, b.id DESC), r AS (SELECT t.id, t.condition_id, t.asset, upper(t.side) AS side, t.size::float8 AS size, t.price::float8 AS price, t.ts, COALESCE(t.source, '') AS source, t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text) AS tx_key, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' AND EXISTS (SELECT 1 FROM bk WHERE bk.condition_id = t.condition_id)), k AS (SELECT r.*, bool_or(r.net_leg) OVER w AS has_net_leg, COALESCE(sum(r.size) FILTER (WHERE NOT r.net_leg) OVER w, 0.0) AS match_sum, sum(r.size * r.price) FILTER (WHERE NOT r.net_leg) OVER w / NULLIF(sum(r.size) FILTER (WHERE NOT r.net_leg) OVER w, 0.0) AS match_vwap FROM r WINDOW w AS (PARTITION BY r.whale_id, r.tx_key, r.asset, r.side)), rep AS (SELECT m.id AS m_id, row_number() OVER (PARTITION BY n.id ORDER BY m.id) AS m_rank, row_number() OVER (PARTITION BY m.id ORDER BY n.id) AS n_rank FROM r m JOIN r n ON n.whale_id = m.whale_id AND n.tx_key = m.tx_key AND n.asset = m.asset AND n.side = m.side AND n.net_leg AND NOT m.net_leg AND (round(n.price::numeric, 2) = round(m.price::numeric, 2) OR abs(round(n.price::numeric, 3) - round(m.price::numeric, 3)) <= 0.005) AND abs(n.size - m.size) <= greatest(0.01, 0.001 * n.size)), c AS (SELECT k.*, (NOT k.net_leg AND k.has_net_leg) AS old_collapsed, COALESCE(NOT k.net_leg AND k.has_net_leg AND (EXISTS (SELECT 1 FROM (SELECT sum(n.size) AS leg_size, sum(n.size * n.price) / sum(n.size) AS leg_vwap FROM r n WHERE n.whale_id = k.whale_id AND n.tx_key = k.tx_key AND n.asset = k.asset AND n.side = k.side AND n.net_leg GROUP BY n.source) leg WHERE abs(k.match_sum - leg.leg_size) <= greatest(0.01, 0.001 * leg.leg_size) AND (round(k.match_vwap::numeric, 2) = round(leg.leg_vwap::numeric, 2) OR abs(round(k.match_vwap::numeric, 3) - round(leg.leg_vwap::numeric, 3)) <= 0.005)) OR EXISTS (SELECT 1 FROM rep WHERE rep.m_id = k.id AND rep.m_rank = rep.n_rank)), false) AS new_collapsed FROM k), j AS (SELECT c.*, bk.long_asset, bk.other_asset, bk.plan_ts, COALESCE(bk.snap_net, bk.mkt_long - bk.mkt_other) AS venue_net, CASE WHEN c.side = 'BUY' THEN c.size ELSE -c.size END AS signed FROM c JOIN bk ON bk.condition_id = c.condition_id), per AS (SELECT j.condition_id, max(j.venue_net) AS venue_net, sum(j.size) AS raw_sh, sum(j.size) FILTER (WHERE j.old_collapsed) AS old_dropped, sum(j.size) FILTER (WHERE j.new_collapsed) AS new_dropped, sum(j.size * j.price) FILTER (WHERE j.old_collapsed AND NOT j.new_collapsed) AS kept_usd, COALESCE(sum(j.signed) FILTER (WHERE j.asset = j.long_asset AND NOT j.old_collapsed AND j.ts <= j.plan_ts), 0) - COALESCE(sum(j.signed) FILTER (WHERE j.asset = j.other_asset AND NOT j.old_collapsed AND j.ts <= j.plan_ts), 0) AS old_net, COALESCE(sum(j.signed) FILTER (WHERE j.asset = j.long_asset AND NOT j.new_collapsed AND j.ts <= j.plan_ts), 0) - COALESCE(sum(j.signed) FILTER (WHERE j.asset = j.other_asset AND NOT j.new_collapsed AND j.ts <= j.plan_ts), 0) AS new_net FROM j GROUP BY 1) SELECT count(*) AS markets, round(sum(raw_sh)::numeric, 1) AS raw_sh, round(COALESCE(sum(old_dropped), 0)::numeric, 1) AS old_dropped_sh, round(COALESCE(sum(new_dropped), 0)::numeric, 1) AS new_dropped_sh, round(COALESCE(sum(kept_usd), 0)::numeric, 0) AS kept_usd, count(*) FILTER (WHERE venue_net IS NOT NULL) AS with_venue, round(sum(abs(old_net - venue_net))::numeric, 1) AS gap_old_sh, round(sum(abs(new_net - venue_net))::numeric, 1) AS gap_new_sh, count(*) FILTER (WHERE abs(new_net - venue_net) < abs(old_net - venue_net)) AS new_closer, count(*) FILTER (WHERE abs(new_net - venue_net) > abs(old_net - venue_net)) AS old_closer FROM per;"; TO=60000 ;;
                # [R56] see .github/workflows/RENDER_OPS_NOTES.md
                books-new) SQL="SELECT b.id, b.us_market_slug AS slug, b.intent, b.map_source AS src, b.ratio, b.target, b.ledger_net AS held, round(b.his_net::numeric, 1) AS his_net, round(b.avg_cost::numeric, 3) AS avg_cost, b.opened_at::time(0) AS opened, b.state, left(b.long_asset, 14) AS long_asset, b.last_reason, left(b.last_plan::text, 260) AS last_plan, (SELECT string_agg(o.side || ' ' || o.qty || '@' || o.wire || ' ' || o.state, ' | ' ORDER BY o.placed_at) FROM mirror_orders o WHERE o.book_id = b.id) AS orders FROM mirror_books b WHERE b.id >= 23 ORDER BY b.id; SELECT b.id AS book, t.outcome, t.side, count(*) AS n, round(sum(t.size)::numeric, 1) AS shares, round(avg(t.price)::numeric, 3) AS avg_px, max(t.ts)::time(0) AS last_ts, max(t.market_slug) AS his_slug, (t.asset = b.long_asset) AS is_long_asset FROM mirror_books b JOIN trades t ON t.condition_id = b.condition_id JOIN whales w ON w.id = t.whale_id AND lower(w.username) = b.whale WHERE b.id >= 23 GROUP BY b.id, t.outcome, t.side, (t.asset = b.long_asset) ORDER BY b.id, 2; SELECT b.id AS book, u.identifier, u.side_norm, u.intent AS venue_intent, u.line, left(u.question, 90) AS question FROM mirror_books b JOIN us_premap u ON u.identifier = b.us_market_slug OR u.market_slug = b.us_market_slug WHERE b.id >= 23 ORDER BY b.id, u.side_norm;"; TO=30000 ;;
                # [R57] see .github/workflows/RENDER_OPS_NOTES.md
                flow-books) SQL="SELECT b.id, left(b.us_market_slug, 44) AS slug, b.intent, b.ratio, b.target, b.ledger_net AS held, round(b.his_net::numeric, 1) AS his_net, round(b.flow_base::numeric, 1) AS flow_base, round(b.flow_last_net::numeric, 1) AS flow_last_net, round(b.avg_cost::numeric, 3) AS avg_cost, b.opened_at::time(0) AS opened, b.state, b.last_reason, left((b.last_plan->'catchup')::text, 200) AS catchup, CASE WHEN (b.last_plan->'catchup'->>'mark') IS NULL OR (b.last_plan->'catchup'->>'vwap') IS NULL THEN 'unread' WHEN (b.intent = 'ORDER_INTENT_BUY_SHORT' AND (b.last_plan->'catchup'->>'mark')::float8 >= (b.last_plan->'catchup'->>'vwap')::float8) OR (b.intent <> 'ORDER_INTENT_BUY_SHORT' AND (b.last_plan->'catchup'->>'mark')::float8 <= (b.last_plan->'catchup'->>'vwap')::float8) THEN 'better' ELSE 'worse' END AS catchup_side, left((b.last_plan->'flow_reading')::text, 120) AS flow_reading, b.last_plan->>'flow_wait' AS flow_wait, b.last_plan->>'flow_net' AS flow_net FROM mirror_books b WHERE b.opened_at > now() - interval '6 hours' ORDER BY b.opened_at DESC LIMIT 60; SELECT (b.flow_base IS NOT NULL) AS has_block, COALESCE(b.last_plan->'catchup'->>'why', 'none') AS why, count(*) AS n, round(sum(b.flow_base)::numeric, 0) AS block_shares, round(sum(b.his_net)::numeric, 0) AS his_net, round(sum(b.ledger_net)::numeric, 0) AS held FROM mirror_books b WHERE b.opened_at > now() - interval '6 hours' GROUP BY 1, 2 ORDER BY 1, 2; SELECT CASE WHEN (b.last_plan->'catchup'->>'mark') IS NULL OR (b.last_plan->'catchup'->>'vwap') IS NULL THEN 'unread' WHEN (b.intent = 'ORDER_INTENT_BUY_SHORT' AND (b.last_plan->'catchup'->>'mark')::float8 >= (b.last_plan->'catchup'->>'vwap')::float8) OR (b.intent <> 'ORDER_INTENT_BUY_SHORT' AND (b.last_plan->'catchup'->>'mark')::float8 <= (b.last_plan->'catchup'->>'vwap')::float8) THEN 'better' ELSE 'worse' END AS catchup_side, COALESCE(b.last_plan->'catchup'->>'why', 'none') AS why, count(*) AS n, round(sum(abs(b.flow_base))::numeric, 0) AS block_shares, round(sum(abs(b.flow_base) * (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - (b.last_plan->'catchup'->>'vwap')::float8 ELSE (b.last_plan->'catchup'->>'vwap')::float8 END))::numeric, 0) AS block_usd_at_his_vwap, round(sum(abs(b.flow_base) * (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - (b.last_plan->'catchup'->>'vwap')::float8 ELSE (b.last_plan->'catchup'->>'vwap')::float8 END) * b.ratio)::numeric, 0) AS our_share_usd_uncapped, round(avg(((b.last_plan->'catchup'->>'mark')::float8 - (b.last_plan->'catchup'->>'vwap')::float8) * 100)::numeric, 1) AS mark_minus_vwap_avg_c FROM mirror_books b WHERE b.opened_at > now() - interval '6 hours' AND b.flow_base IS NOT NULL AND b.flow_base <> 0 GROUP BY 1, 2 ORDER BY 1, 2;"; TO=30000 ;;
                # [R58] see .github/workflows/RENDER_OPS_NOTES.md
                nf-his) SQL="WITH his AS (SELECT t.condition_id, t.market_slug AS his_slug, max(t.market_title) AS his_title, max(m.event_title) AS event_title, string_agg(DISTINCT t.outcome, '/') AS outcomes, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, max(t.ts)::time(0) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND (t.market_slug LIKE '%-exact-score-%' OR t.market_slug LIKE '%-halftime-result-%' OR t.market_slug LIKE '%-team-total-%' OR t.market_slug LIKE '%-game_' OR t.market_slug LIKE '%-map%' OR t.market_slug LIKE '%-corner%' OR t.market_slug LIKE '%-card%' OR t.market_slug LIKE '%-player-%' OR t.market_slug LIKE '%scorer%' OR t.market_slug ~ '-[a-z]+[0-9]$') GROUP BY 1, 2), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, detail->>'family' AS family, left(detail->>'explain', 50) AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '31 hours' ORDER BY condition_id, at DESC) SELECT left(h.his_slug, 48) AS his_slug, left(h.his_title, 62) AS his_title, left(COALESCE(h.event_title, '(null)'), 36) AS event_title, left(h.outcomes, 14) AS outcomes, h.fills, h.usd, h.last_ts, sh.family, sh.explain, sh.at::time(0) AS judged FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id ORDER BY h.usd DESC LIMIT 90; SELECT split_part(t.market_slug, '-', 1) AS lg, CASE WHEN t.market_slug LIKE '%-exact-score-%' THEN 'exact_score' WHEN t.market_slug LIKE '%-halftime-result-%' THEN 'halftime_result' WHEN t.market_slug LIKE '%-team-total-%' THEN 'team_total' WHEN t.market_slug LIKE '%-game_' THEN 'game_n' WHEN t.market_slug ~ '-[a-z]+[0-9]$' THEN 'digit_code' ELSE 'other' END AS shape, count(DISTINCT t.condition_id) AS markets, round(sum(t.size * t.price)::numeric, 0) AS usd, count(DISTINCT m.event_title) AS n_event_titles, count(DISTINCT t.condition_id) FILTER (WHERE m.event_title IS NULL) AS no_event_title FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND (t.market_slug LIKE '%-exact-score-%' OR t.market_slug LIKE '%-halftime-result-%' OR t.market_slug LIKE '%-team-total-%' OR t.market_slug LIKE '%-game_' OR t.market_slug ~ '-[a-z]+[0-9]$') GROUP BY 1, 2 ORDER BY 4 DESC LIMIT 60;"; TO=60000 ;;
                nf-venue) SQL="SELECT split_part(identifier, '-', 1) AS prefix, regexp_replace(identifier, '^[a-z]+-epl-eve-mnu-2026-09-06-?', '') AS suffix, count(*) AS rows, string_agg(DISTINCT side_norm, '/') AS sides, max(line) AS line, max(left(question, 96)) AS question FROM us_premap WHERE identifier LIKE '%-epl-eve-mnu-2026-09-06%' AND identifier NOT LIKE '%-exact-score-%' AND identifier NOT LIKE '%-g-%' GROUP BY 1, 2 ORDER BY 1, 2 LIMIT 70; SELECT split_part(identifier, '-', 1) AS prefix, regexp_replace(regexp_replace(identifier, '^[a-z]+-epl-eve-mnu-2026-09-06-', ''), '-[a-z0-9]+-(gte?[0-9]+(pt5)?)$', '-<player>-\\1') AS shape, count(*) AS rows, min(left(question, 90)) AS question FROM us_premap WHERE identifier LIKE '%-epl-eve-mnu-2026-09-06-g-%' GROUP BY 1, 2 ORDER BY 2 LIMIT 12; SELECT identifier, side_norm, intent, line, left(question, 100) AS question FROM us_premap WHERE (identifier LIKE 'atc-epl-eve-mnu-2026-09-06-fh-%' OR identifier LIKE 'atc-epl-ars-cfc-2026-09-06-fh-%' OR identifier LIKE 'atc-lal-val-fcb-2026-09-06-exact-score-1-2' OR identifier LIKE 'atc-lal-val-fcb-2026-09-06-exact-score-2-1' OR identifier LIKE 'atc-lal-val-fcb-2026-09-06-val' OR identifier LIKE 'atc-lal-val-fcb-2026-09-06-fcb' OR identifier LIKE 'atc-lal-%-2026-09-06-mal%' OR identifier LIKE 'atc-lal-%-2026-09-06-lev%') ORDER BY identifier, side_norm LIMIT 40; SELECT split_part(identifier, '-', 3) || '-' || split_part(identifier, '-', 4) AS codes, string_agg(DISTINCT split_part(identifier, '-', 1), '/') AS prefixes, count(*) AS rows, max(event_title) AS event_title FROM us_premap WHERE identifier LIKE '%-cs2-%-2026-09-06%' GROUP BY 1 ORDER BY 1 LIMIT 40; SELECT identifier, side_norm, intent, line, left(question, 100) AS question FROM us_premap WHERE identifier LIKE 'astatc-cs2-%-2026-09-06-map%' AND (identifier LIKE '%-fnc-nip-%' OR identifier LIKE '%-hero-1win-%' OR identifier LIKE '%-1win-ast%') ORDER BY identifier, side_norm LIMIT 24; SELECT identifier, side_norm, intent, left(question, 100) AS question FROM us_premap WHERE identifier LIKE 'atc-pdc-%-2026-09-06-%' AND identifier NOT LIKE '%-fh-%' AND identifier NOT LIKE '%-sh-%' AND identifier NOT LIKE '%-exact-score-%' ORDER BY identifier, side_norm LIMIT 24;"; TO=60000 ;;
