                data-audit) SQL="SELECT 'trades (whale fills, GLOBAL venue)' AS src, count(*) AS n_rows, min(ts)::date AS first_day, max(ts)::date AS last_day, (max(ts)::date - min(ts)::date) AS span_days, count(DISTINCT condition_id) AS markets FROM trades UNION ALL SELECT 'mirror_shadow (US bid/ask)', count(*), min(at)::date, max(at)::date, (max(at)::date - min(at)::date), count(DISTINCT condition_id) FROM mirror_shadow UNION ALL SELECT 'copy_probes (US ask + depth)', count(*), min(probe_at)::date, max(probe_at)::date, (max(probe_at)::date - min(probe_at)::date), count(DISTINCT asset) FROM copy_probes UNION ALL SELECT 'mirror_orders (our own fills)', count(*), min(placed_at)::date, max(placed_at)::date, (max(placed_at)::date - min(placed_at)::date), count(DISTINCT book_id) FROM mirror_orders UNION ALL SELECT 'mirror_books', count(*), min(opened_at)::date, max(opened_at)::date, (max(opened_at)::date - min(opened_at)::date), count(DISTINCT condition_id) FROM mirror_books UNION ALL SELECT 'trade_marks (global 5/10/60m)', count(*), min(fetched_at)::date, max(fetched_at)::date, (max(fetched_at)::date - min(fetched_at)::date), 0 FROM trade_marks UNION ALL SELECT 'price_path (post-fill ask)', count(*), min(sampled_at)::date, max(sampled_at)::date, (max(sampled_at)::date - min(sampled_at)::date), 0 FROM price_path ORDER BY 1; SELECT count(*) AS obs, count(*) FILTER (WHERE bid IS NOT NULL AND ask IS NOT NULL) AS obs_both_sides, count(*) FILTER (WHERE bid IS NOT NULL AND ask IS NOT NULL AND ask > bid) AS obs_sane_spread, count(DISTINCT condition_id) AS markets, count(DISTINCT us_market_slug) AS us_slugs, min(at)::date AS first_day, max(at)::date AS last_day, count(DISTINCT date_trunc('day', at)) AS days_with_data, round(avg(ask - bid)::numeric, 4) AS mean_spread, round((percentile_cont(0.5) WITHIN GROUP (ORDER BY ask - bid))::numeric, 4) AS median_spread FROM mirror_shadow; SELECT CASE WHEN n >= 500 THEN '5 500+' WHEN n >= 100 THEN '4 100-499' WHEN n >= 30 THEN '3 30-99' WHEN n >= 10 THEN '2 10-29' WHEN n >= 1 THEN '1 1-9' ELSE '0 none' END AS two_sided_obs_band, count(*) AS markets FROM (SELECT condition_id, count(*) FILTER (WHERE bid IS NOT NULL AND ask IS NOT NULL) AS n FROM mirror_shadow GROUP BY 1) q GROUP BY 1 ORDER BY 1; SELECT to_char(date_trunc('month', ts), 'YYYY-MM') AS month, count(*) AS trades, count(DISTINCT date_trunc('day', ts)) AS days_with_data, count(DISTINCT condition_id) AS markets FROM trades GROUP BY 1 ORDER BY 1; SELECT COALESCE(NULLIF(sport, ''), '(null)') AS sport, count(*) AS markets, count(*) FILTER (WHERE resolved) AS resolved, count(*) FILTER (WHERE closed) AS closed, min(updated_at)::date AS first_seen, max(updated_at)::date AS last_seen FROM markets GROUP BY 1 ORDER BY 2 DESC LIMIT 20;"; TO=240000 ;;
                hourly) SQL="SELECT '== mirror-tick' AS section; SELECT h.service AS what, e.key, left(e.value::text, 8000) AS value FROM service_heartbeats h, jsonb_each(h.detail) e WHERE h.service IN ('mirror_live','mirror_shadow','chain_listener','poller') UNION ALL SELECT h.service, 'zz beat_at', h.beat_at::text || ' ' || h.status FROM service_heartbeats h WHERE h.service IN ('mirror_live','mirror_shadow','chain_listener','poller') UNION ALL SELECT 'zz book', b.us_market_slug, 'state=' || b.state || ' whale=' || b.whale || ' opened=' || b.opened_at::text || ' ' || left((to_jsonb(b) - 'us_market_slug' - 'state' - 'whale' - 'opened_at' - 'condition_id' - 'long_asset' - 'other_asset')::text, 260) FROM mirror_books b WHERE b.state <> 'closed' UNION ALL SELECT 'zz order', o.placed_at::text, left((to_jsonb(o) - 'placed_at' - 'receipt')::text, 280) FROM (SELECT * FROM mirror_orders ORDER BY placed_at DESC NULLS LAST LIMIT 8) o ORDER BY 1, 2; SELECT '== tick-ring' AS section; WITH r AS (SELECT e FROM ingestion_state s, jsonb_array_elements(CASE WHEN jsonb_typeof(s.value->'ticks') = 'array' THEN s.value->'ticks' ELSE '[]'::jsonb END) e WHERE s.key = 'mirror_tick_ring' AND jsonb_typeof(e) = 'array' AND CASE WHEN jsonb_typeof(e) = 'array' THEN jsonb_array_length(e) ELSE 0 END >= 15 AND CASE WHEN jsonb_typeof(e->0) = 'number' THEN (e->>0)::numeric END BETWEEN 0 AND 4102444800 AND CASE WHEN jsonb_typeof(e->1) = 'number' THEN (e->>1)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->4) = 'number' THEN (e->>4)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->5) = 'number' THEN (e->>5)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->10) = 'number' THEN (e->>10)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->12) = 'number' THEN (e->>12)::numeric END BETWEEN -1e9 AND 1e9 AND CASE WHEN jsonb_typeof(e->14) = 'number' THEN (e->>14)::numeric END BETWEEN -1e9 AND 1e9) SELECT date_trunc('hour', to_timestamp((e->>0)::float8))::time(0) AS hour, count(*) AS ticks, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (e->>1)::float8)::numeric, 1) AS tick_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY (e->>1)::float8)::numeric, 1) AS tick_p90_s, round(max((e->>1)::float8)::numeric, 1) AS tick_max_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (e->>5)::float8)::numeric, 1) AS cand_med_s, round(max((e->>5)::float8)::numeric, 1) AS cand_max_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (e->>4)::float8)::numeric, 1) AS books_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY (e->>12)::float8)::numeric, 1) AS fast_wait_p90_s, sum((e->>10)::float8)::int AS yields, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (e->>14)::float8)::numeric, 1) AS fast_prelude_med_s FROM r GROUP BY date_trunc('hour', to_timestamp((e->>0)::float8)) ORDER BY date_trunc('hour', to_timestamp((e->>0)::float8)) DESC LIMIT 48; SELECT '== mirror-pnl' AS section; SELECT b.id, b.us_market_slug AS slug, b.state, b.intent, b.ratio, b.ledger_net AS held, round(b.avg_cost::numeric, 4) AS avg_cost, round((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN abs(b.ledger_net) * (1 - COALESCE(b.avg_cost, 1)) ELSE b.ledger_net * COALESCE(b.avg_cost, 0) END)::numeric, 2) AS open_cost, round(b.realized_pnl::numeric, 2) AS realized, round(b.settled_pnl::numeric, 2) AS settled, round(b.own_book_pnl::numeric, 2) AS own_book, b.opened_at::time(0) AS opened, b.closed_at::time(0) AS closed FROM mirror_books b WHERE b.opened_at >= date_trunc('day', now()) OR b.closed_at >= date_trunc('day', now()) OR b.state <> 'closed' ORDER BY b.id; SELECT 'today' AS what, count(*) AS books, round(sum(realized_pnl)::numeric, 2) AS realized, round(sum(settled_pnl)::numeric, 2) AS settled, round(sum(CASE WHEN state = 'closed' AND settled_pnl IS NOT NULL THEN settled_pnl ELSE realized_pnl END)::numeric, 2) AS day_pnl, round(sum(CASE WHEN state <> 'closed' THEN (CASE WHEN intent = 'ORDER_INTENT_BUY_SHORT' THEN abs(ledger_net) * (1 - COALESCE(avg_cost, 1)) ELSE ledger_net * COALESCE(avg_cost, 0) END) ELSE 0 END)::numeric, 2) AS open_cost, round(sum(peak_exposure_usd)::numeric, 2) AS peak_stake FROM mirror_books WHERE opened_at >= date_trunc('day', now()) OR closed_at >= date_trunc('day', now()) OR state <> 'closed'; SELECT 'fills today' AS what, count(*) AS n, round(sum(CASE WHEN side LIKE 'BUY%' THEN cash_usd ELSE 0 END)::numeric, 2) AS bought_usd, round(sum(CASE WHEN side LIKE 'SELL%' THEN cash_usd ELSE 0 END)::numeric, 2) AS sold_usd, round(sum(realized)::numeric, 2) AS realized FROM mirror_orders WHERE filled > 0 AND placed_at >= date_trunc('day', now()); SELECT '== paired-day' AS section; WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, round((sum(b.avg_cost * abs(b.ledger_net)) / NULLIF(sum(abs(b.ledger_net)), 0))::numeric, 4) AS our_avg FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)) t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND m.resolved_prices IS NOT NULL GROUP BY t.condition_id), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('open', 'increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, his.his_avg, bk.our_avg, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT * FROM pair ORDER BY abs(COALESCE(our_settled, 0)) DESC LIMIT 60; WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, round((sum(b.avg_cost * abs(b.ledger_net)) / NULLIF(sum(abs(b.ledger_net)), 0))::numeric, 4) AS our_avg FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)) t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND m.resolved_prices IS NOT NULL GROUP BY t.condition_id), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('open', 'increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, his.his_avg, bk.our_avg, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT count(*) AS markets, count(*) FILTER (WHERE COALESCE(our_staked, 0) > 0) AS staked_mkts, count(*) FILTER (WHERE COALESCE(our_staked, 0) <= 0) AS zero_stake_mkts, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) <= 0)::numeric, 2) AS zero_stake_settled, round(sum(his_usd) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_usd, round(sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost, round(sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_pnl, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi, round(sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_staked, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_settled, CASE WHEN sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS our_roi, count(*) FILTER (WHERE sign_agree = 'same') AS same_sign, count(*) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite_sign, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY frac_pct)::numeric, 1) AS frac_med_pct, round(min(frac_pct)::numeric, 1) AS frac_min_pct, round(max(frac_pct)::numeric, 1) AS frac_max_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY cents_over)::numeric, 1) AS cents_over_med, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lat_med_s)::numeric, 0) AS lat_med_s FROM pair; SELECT '== paired-ratio' AS section; WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, CASE WHEN bool_and(b.avg_cost IS NOT NULL OR COALESCE(b.peak_exposure_usd, 0) = 0) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) THEN max(b.peak_exposure_usd / NULLIF(CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - b.avg_cost ELSE b.avg_cost END, 0)) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) END AS peak_sh FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), ax AS (SELECT DISTINCT ON (b.condition_id) b.con