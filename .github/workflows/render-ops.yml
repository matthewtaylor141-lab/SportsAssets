                # THE PAIRED RATIO (PNL program lane M, 2026-09-08; owner ~11:50Z "I want to know
                # when he makes money we make money"): the paired-day set (the same bk / his
                # CTEs, verbatim) with his NET cost beside his gross. On the book's token axis
                # (long_asset / other_asset; a BUY_SHORT book mirrors) his running net is +BUY
                # long +SELL other -SELL long -BUY other; his_net_peak = max |running net| over
                # the window; his_vwap_adds = the size-weighted price of the ADDING fills on the
                # side the peak was reached on (the sign of the running net at the peak; a fill
                # adds what it moves |running| further out on that side, a reduce of the other
                # side adds nothing -- the fold of the review's HIGH-2, 2026-09-08: on a market
                # whose book flipped the first side's vwap priced the other side's peak) (mi.vwap_of,
                # E12b: a BUY of the long at p, a SELL of the other at 1 - p; the mirror image on
                # a short, printed as the short leg's price so peak x vwap is dollars on both);
                # his_cost_net = his_net_peak x his_vwap_adds; his_cost (gross, two-sided: 278
                # bought 21,896 USD gross for a 21,196 net) stays beside it, never instead.
                # share_frac = our peak shares / his_net_peak, our peak shares = the largest
                # book's peak_exposure_usd / its leg price (avg_cost on a long, 1 - avg_cost on a
                # BUY_SHORT: rules.book_buy peaks a short leg at leg x (1 - avg) -- HIGH-1; the
                # episodes of one market read as a peak like his_net_peak, never a sum; NULL
                # when a staked book's avg is unreadable, then our staked / the leg-priced
                # fill-weighted avg_px of our adding order rows); stake_frac_net = our_staked /
                # his_cost_net; roi_ratio = our_roi / his_roi (NULL when his_roi is 0) with
                # his_roi_net = his_pnl / his_cost_net and roi_ratio_net beside them (MEDIUM-3);
                # pnl_ratio = our_settled / his_pnl. A market with his_net_peak 0 or vwap
                # NULL prints NULL fractions, never 0, never a guess. The totals row names the
                # OPPOSITE books with their last reason and ends in the ONE line the hourly
                # reads: `PAIRED <n> mkts his_roi .. our_roi .. roi_ratio ..x same a/b opposite
                # <books> share_frac_med ..% stake_frac_net_med ..% cents_over ..c lat_med ..s`.
                # Frozen books pair only when closed with settled_pnl (as paired-day). FILL lane
                # 0b (2026-09-08; owner decision D3): the line LEADS WITH THE NET RATIO --
                # `PAIRED <n> mkts (<staked> staked, <k> zero-stake dropped) his_roi_net .. our_roi
                # .. roi_ratio_net ..x gross his_roi .. roi_ratio ..x same a/b ...` (1.81x net
                # against 4.54x gross on 2026-09-08's 114) -- pairs on any settled episode, drops
                # the zero-stake rows from the sums and ratios, and takes the pattern arm
                # paired-ratio=<ISO> (books opened at or after that clock), exactly as paired-day
                # above. Read-only.
                paired-ratio) SQL="WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, CASE WHEN bool_and(b.avg_cost IS NOT NULL OR COALESCE(b.peak_exposure_usd, 0) = 0) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) THEN max(b.peak_exposure_usd / NULLIF(CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - b.avg_cost ELSE b.avg_cost END, 0)) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) END AS peak_sh FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), ax AS (SELECT DISTINCT ON (b.condition_id) b.condition_id, b.long_asset, b.other_asset, (b.intent = 'ORDER_INTENT_BUY_SHORT') AS short FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') ORDER BY b.condition_id, b.id), hf AS (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM hf t JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE m.resolved_prices IS NOT NULL GROUP BY t.condition_id), axf AS (SELECT f.condition_id, f.ts, f.id, f.size, ax.short, (CASE WHEN f.asset = ax.long_asset THEN 1 WHEN f.asset = ax.other_asset THEN -1 END) * (CASE WHEN upper(f.side) = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN ax.short THEN -1 ELSE 1 END) * f.size AS sgn_sh, CASE WHEN ax.short THEN 1 - (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) ELSE (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) END AS px_leg FROM hf f JOIN ax ON ax.condition_id = f.condition_id WHERE f.asset = ax.long_asset OR f.asset = ax.other_asset), run AS (SELECT a.*, sum(a.sgn_sh) OVER (PARTITION BY a.condition_id ORDER BY a.ts, a.id) AS running FROM axf a), pk AS (SELECT DISTINCT ON (condition_id) condition_id, CASE WHEN running < 0 THEN -1 ELSE 1 END AS ps FROM run ORDER BY condition_id, abs(running) DESC, ts, id), net AS (SELECT r.condition_id, max(abs(r.running)) AS his_net_peak, sum((CASE WHEN pk.ps > 0 THEN r.px_leg ELSE 1 - r.px_leg END) * greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))) / NULLIF(sum(greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))), 0) AS his_vwap_adds FROM run r JOIN pk ON pk.condition_id = r.condition_id GROUP BY 1), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), oavg AS (SELECT b.condition_id, round((sum((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - o.avg_px ELSE o.avg_px END) * o.filled) / NULLIF(sum(o.filled), 0))::numeric, 4) AS avg_leg FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.filled > 0 AND o.avg_px IS NOT NULL AND ((b.intent <> 'ORDER_INTENT_BUY_SHORT' AND o.side = 'BUY_LONG') OR (b.intent = 'ORDER_INTENT_BUY_SHORT' AND o.side = 'SELL_LONG')) AND b.condition_id IN (SELECT condition_id FROM bk) GROUP BY 1), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, round(net.his_net_peak::numeric, 1) AS his_net_peak, round(net.his_vwap_adds::numeric, 4) AS his_vwap_adds, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds IS NOT NULL THEN round((net.his_net_peak * net.his_vwap_adds)::numeric, 2) END AS his_cost_net, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((his.pnl / (net.his_net_peak * net.his_vwap_adds))::numeric, 3) END AS his_roi_net, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / his.cost))::numeric, 2) END AS roi_ratio, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / (net.his_net_peak * net.his_vwap_adds)))::numeric, 2) END AS roi_ratio_net, CASE WHEN his.pnl <> 0 AND bk.settled IS NOT NULL THEN round((bk.settled / his.pnl)::numeric, 4) END AS pnl_ratio, round(COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0))::numeric, 1) AS our_peak_sh, CASE WHEN net.his_net_peak > 0 AND COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) > 0 THEN round((100 * COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) / net.his_net_peak)::numeric, 1) END AS share_frac_pct, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((100 * bk.staked / (net.his_net_peak * net.his_vwap_adds))::numeric, 1) END AS stake_frac_net_pct, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_gross_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN net ON net.condition_id = bk.condition_id LEFT JOIN oavg ON oavg.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT * FROM pair ORDER BY abs(COALESCE(our_settled, 0)) DESC LIMIT 60; WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, CASE WHEN bool_and(b.avg_cost IS NOT NULL OR COALESCE(b.peak_exposure_usd, 0) = 0) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) THEN max(b.peak_exposure_usd / NULLIF(CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - b.avg_cost ELSE b.avg_cost END, 0)) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) END AS peak_sh FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), ax AS (SELECT DISTINCT ON (b.condition_id) b.condition_id, b.long_asset, b.other_asset, (b.intent = 'ORDER_INTENT_BUY_SHORT') AS short FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') ORDER BY b.condition_id, b.id), hf AS (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM hf t JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE m.resolved_prices IS NOT NULL GROUP BY t.condition_id), axf AS (SELECT f.condition_id, f.ts, f.id, f.size, ax.short, (CASE WHEN f.asset = ax.long_asset THEN 1 WHEN f.asset = ax.other_asset THEN -1 END) * (CASE WHEN upper(f.side) = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN ax.short THEN -1 ELSE 1 END) * f.size AS sgn_sh, CASE WHEN ax.short THEN 1 - (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) ELSE (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) END AS px_leg FROM hf f JOIN ax ON ax.condition_id = f.condition_id WHERE f.asset = ax.long_asset OR f.asset = ax.other_asset), run AS (SELECT a.*, sum(a.sgn_sh) OVER (PARTITION BY a.condition_id ORDER BY a.ts, a.id) AS running FROM axf a), pk AS (SELECT DISTINCT ON (condition_id) condition_id, CASE WHEN running < 0 THEN -1 ELSE 1 END AS ps FROM run ORDER BY condition_id, abs(running) DESC, ts, id), net AS (SELECT r.condition_id, max(abs(r.running)) AS his_net_peak, sum((CASE WHEN pk.ps > 0 THEN r.px_leg ELSE 1 - r.px_leg END) * greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))) / NULLIF(sum(greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))), 0) AS his_vwap_adds FROM run r JOIN pk ON pk.condition_id = r.condition_id GROUP BY 1), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), oavg AS (SELECT b.condition_id, round((sum((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - o.avg_px ELSE o.avg_px END) * o.filled) / NULLIF(sum(o.filled), 0))::numeric, 4) AS avg_leg FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.filled > 0 AND o.avg_px IS NOT NULL AND ((b.intent <> 'ORDER_INTENT_BUY_SHORT' AND o.side = 'BUY_LONG') OR (b.intent = 'ORDER_INTENT_BUY_SHORT' AND o.side = 'SELL_LONG')) AND b.condition_id IN (SELECT condition_id FROM bk) GROUP BY 1), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, round(net.his_net_peak::numeric, 1) AS his_net_peak, round(net.his_vwap_adds::numeric, 4) AS his_vwap_adds, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds IS NOT NULL THEN round((net.his_net_peak * net.his_vwap_adds)::numeric, 2) END AS his_cost_net, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((his.pnl / (net.his_net_peak * net.his_vwap_adds))::numeric, 3) END AS his_roi_net, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / his.cost))::numeric, 2) END AS roi_ratio, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / (net.his_net_peak * net.his_vwap_adds)))::numeric, 2) END AS roi_ratio_net, CASE WHEN his.pnl <> 0 AND bk.settled IS NOT NULL THEN round((bk.settled / his.pnl)::numeric, 4) END AS pnl_ratio, round(COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0))::numeric, 1) AS our_peak_sh, CASE WHEN net.his_net_peak > 0 AND COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) > 0 THEN round((100 * COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) / net.his_net_peak)::numeric, 1) END AS share_frac_pct, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((100 * bk.staked / (net.his_net_peak * net.his_vwap_adds))::numeric, 1) END AS stake_frac_net_pct, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_gross_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN net ON net.condition_id = bk.condition_id LEFT JOIN oavg ON oavg.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT t.*, format('PAIRED %s mkts (%s staked, %s zero-stake dropped) his_roi_net %s our_roi %s roi_ratio_net %sx gross his_roi %s roi_ratio %sx same %s/%s opposite %s share_frac_med %s%% stake_frac_net_med %s%% cents_over %sc lat_med %ss', t.markets, t.staked_mkts, t.zero_stake_mkts, t.his_roi_net, t.our_roi, t.roi_ratio_net, t.his_roi, t.roi_ratio, t.same_sign, t.markets, COALESCE(t.opposite, '-'), t.share_frac_med_pct, t.stake_frac_net_med_pct, t.cents_over_med, t.lat_med_s) AS line FROM (SELECT count(*) AS markets, count(*) FILTER (WHERE COALESCE(our_staked, 0) > 0) AS staked_mkts, count(*) FILTER (WHERE COALESCE(our_staked, 0) <= 0) AS zero_stake_mkts, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) <= 0)::numeric, 2) AS zero_stake_settled, round(sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost, round(sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost_net, round(sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_pnl, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi, CASE WHEN sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi_net, round(sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_staked, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_settled, CASE WHEN sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS our_roi, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round(((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)) / (sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)))::numeric, 2) END AS roi_ratio, CASE WHEN sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round(((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)) / (sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0)))::numeric, 2) END AS roi_ratio_net, CASE WHEN sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS pnl_ratio, count(*) FILTER (WHERE sign_agree = 'same') AS same_sign, count(*) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite_sign, string_agg(book::text || '(' || COALESCE(last_reason, '?') || ')', ',' ORDER BY abs(COALESCE(our_settled, 0)) DESC) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY share_frac_pct)::numeric, 1) AS share_frac_med_pct, round(min(share_frac_pct)::numeric, 1) AS share_frac_min_pct, round(max(share_frac_pct)::numeric, 1) AS share_frac_max_pct, count(share_frac_pct) AS share_frac_n, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY stake_frac_net_pct)::numeric, 1) AS stake_frac_net_med_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY frac_gross_pct)::numeric, 1) AS frac_gross_med_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY cents_over)::numeric, 1) AS cents_over_med, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lat_med_s)::numeric, 0) AS lat_med_s FROM pair) t;"; TO=120000 ;;
                paired-ratio=*) if [[ ! "$ARG" =~ ^paired-ratio=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?Z)$ ]]; then echo "paired-ratio: arg must be paired-ratio=<YYYY-MM-DDTHH:MM[:SS]Z> (got '$ARG')"; exit 1; fi
