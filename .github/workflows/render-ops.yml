 > 0 AND o.avg_px IS NOT NULL AND ((b.intent <> 'ORDER_INTENT_BUY_SHORT' AND o.side = 'BUY_LONG') OR (b.intent = 'ORDER_INTENT_BUY_SHORT' AND o.side = 'SELL_LONG')) AND b.condition_id IN (SELECT condition_id FROM bk) GROUP BY 1), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, round(net.his_net_peak::numeric, 1) AS his_net_peak, round(net.his_vwap_adds::numeric, 4) AS his_vwap_adds, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds IS NOT NULL THEN round((net.his_net_peak * net.his_vwap_adds)::numeric, 2) END AS his_cost_net, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((his.pnl / (net.his_net_peak * net.his_vwap_adds))::numeric, 3) END AS his_roi_net, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / his.cost))::numeric, 2) END AS roi_ratio, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / (net.his_net_peak * net.his_vwap_adds)))::numeric, 2) END AS roi_ratio_net, CASE WHEN his.pnl <> 0 AND bk.settled IS NOT NULL THEN round((bk.settled / his.pnl)::numeric, 4) END AS pnl_ratio, round(COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0))::numeric, 1) AS our_peak_sh, CASE WHEN net.his_net_peak > 0 AND COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) > 0 THEN round((100 * COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) / net.his_net_peak)::numeric, 1) END AS share_frac_pct, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((100 * bk.staked / (net.his_net_peak * net.his_vwap_adds))::numeric, 1) END AS stake_frac_net_pct, CASE WHEN his.cost > 0 THEN round(100 * bk.st