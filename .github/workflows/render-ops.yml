                # median band_c of the rows -- brief question 3's read per fill; FILL lane 8
                # (2026-09-09) adds missed_replace to that WHERE word -- one word, here AND in
                # the hourly's copy -- so the largest class of the day (745 fills / $381,750.75
                # at 22:25Z, h2225 996) prints its cause rows, missed_replace x {replace_cent,
                # replace_qty, replace_side, ttl, replace_unread}, instead of the 77-row proxy
                # the filled / partial rows carried; the word printed is whatever the row
                # carries (COALESCE(decision, 'unrecorded')), so a word a later lane writes
                # prints the day it is written; 4: the same per
                # book (LIMIT 60);
                # 5: band_c over every entry order row of 24 h = (ask_at_place - floor-cent of
                # his_level) x 100 on a BUY_LONG, (ceil-cent of his_level - bid_at_place) x 100
                # on a SELL_LONG (the columns mirror_live writes at placement; his cent rounded
                # in numeric before the floor / ceil -- HIGH-3: float8 floor(0.29 x 100) is 28,
                # so a rest AT his cent read a cent wide), the share at or
                # through, inside +1c and inside +2c -- the band's reachable share BEFORE lane 8
                # -- and the fill rate inside vs outside 1c; 6: the entry fill rate by hour and
                # kind (latency-census's rows, entries only, plus replaced and IOC misses).
                # Nothing here is a guess: a fill no plan recorded reads `unseen`. Read-only.
                fills-missed) SQL="WITH fa AS (SELECT x.fill_id, x.name, x.order_id, x.book_id FROM xmltable('/table/row' PASSING (CASE WHEN to_regclass('mirror_fill_answers') IS NULL THEN '<table/>'::xml ELSE query_to_xml('SELECT fill_id, name, order_id, book_id FROM mirror_fill_answers WHERE whale = ''rn1'' AND fill_ts >= extract(epoch FROM now() - interval ''25 hours'')', false, false, '') END) COLUMNS fill_id text PATH 'fill_id', name text PATH 'name', order_id bigint PATH 'order_id', book_id bigint PATH 'book_id') x), r AS (SELECT t.id, t.condition_id, t.ts, upper(t.side) AS side, t.asset, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.side, r.size, r.his_slug, ax.short, ax.long_asset, CASE WHEN ax.in_window THEN 'in_book' WHEN r.ts < bw.first_open - interval '120 seconds' THEN 'before_open' WHEN NOT bw.any_live AND r.ts >= bw.last_close THEN 'after_close' ELSE 'no_book' END AS state, CASE WHEN ax.short THEN 1 - (CASE WHEN r.asset = ax.long_asset THEN r.price ELSE 1 - r.price END) ELSE (CASE WHEN r.asset = ax.long_asset THEN r.price ELSE 1 - r.price END) END AS px FROM r JOIN LATERAL (SELECT b.long_asset, b.other_asset, (b.intent = 'ORDER_INTENT_BUY_SHORT') AS short, (b.opened_at - interval '120 seconds' <= r.ts AND r.ts < COALESCE(b.closed_at, now())) AS in_window FROM mirror_books b WHERE b.whale = 'rn1' AND b.condition_id = r.condition_id ORDER BY (b.opened_at - interval '120 seconds' <= r.ts AND r.ts < COALESCE(b.closed_at, now())) DESC, b.id DESC LIMIT 1) ax ON true JOIN LATERAL (SELECT min(b.opened_at) AS first_open, max(b.closed_at) AS last_close, bool_or(b.closed_at IS NULL) AS any_live FROM mirror_books b WHERE b.whale = 'rn1' AND b.condition_id = r.condition_id) bw ON true WHERE (r.net_leg OR NOT r.has_net) AND (CASE WHEN r.asset = ax.long_asset THEN 1 WHEN r.asset = ax.other_asset THEN -1 ELSE 0 END) * (CASE WHEN r.side = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN ax.short THEN -1 ELSE 1 END) > 0), s AS (SELECT f.*, fa.name AS fa_name, fa.order_id AS fa_order, fa.book_id AS fa_book, COALESCE(fa.order_id, CASE WHEN COALESCE(x.e->>'order', '') <> '' AND NOT ((x.e->>'order') ~ '[^0-9]') THEN (x.e->>'order')::bigint END) AS aorder, x.e, x.seen_book FROM f LEFT JOIN fa ON fa.fill_id = f.id::text LEFT JOIN LATERAL (SELECT e, b.id AS seen_book FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), o AS (SELECT s.*, ord.id AS oid, ord.book_id AS obook, ord.state AS ostate, ord.tif, ord.reason, ord.filled, ord.qty, ord.placed_at, ord.decision, ord.side AS oside, ord.his_level, ord.bid_at_place, ord.ask_at_place FROM s LEFT JOIN LATERAL (SELECT o.* FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE (s.aorder IS NOT NULL AND o.id = s.aorder) OR (s.aorder IS NULL AND (s.e->>'order') IS NULL AND b.condition_id = s.condition_id AND o.kind IN ('increase', 'take') AND o.placed_at >= s.ts AND o.placed_at < s.ts + interval '120 seconds') ORDER BY o.placed_at LIMIT 1) ord ON true), g AS (SELECT o.*, COALESCE(o.obook, o.fa_book, o.seen_book) AS book, o.size * o.px AS usd, extract(epoch FROM (o.placed_at - o.ts)) AS lag_s, CASE WHEN o.his_level IS NULL THEN NULL WHEN o.oside = 'BUY_LONG' AND o.ask_at_place IS NOT NULL THEN round(((o.ask_at_place::numeric - floor(round((o.his_level * 100)::numeric, 6)) / 