st > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((his.pnl / (net.his_net_peak * net.his_vwap_adds))::numeric, 3) END AS his_roi_net, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / his.cost))::numeric, 2) END AS roi_ratio, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / (net.his_net_peak * net.his_vwap_adds)))::numeric, 2) END AS roi_ratio_net, CASE WHEN his.pnl <> 0 AND bk.settled IS NOT NULL THEN round((bk.settled / his.pnl)::numeric, 4) END AS pnl_ratio, round(COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0))::numeric, 1) AS our_peak_sh, CASE WHEN net.his_net_peak > 0 AND COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) > 0 THEN round((100 * COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) / net.his_net_peak)::numeric, 1) END AS share_frac_pct, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((100 * bk.staked / (net.his_net_peak * net.his_vwap_adds))::numeric, 1) END AS stake_frac_net_pct, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_gross_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN net ON net.condition_id = bk.condition_id LEFT JOIN oavg ON oavg.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT t.*, format('PAIRED %s mkts (%s staked, %s zero-stake dropped) his_roi_net %s our_roi %s roi_ratio_net %sx gross his_roi %s roi_ratio %sx same %s/%s opposite %s share_frac_med %s%% stake_frac_net_med %s%% cents_over %sc lat_med %ss', t.markets, t.staked_mkts, t.zero_stake_mkts, t.his_roi_net, t.our_roi, t.roi_ratio_net, t.his_roi, t.roi_ratio, t.same_sign, t.markets, COALESCE(t.opposite, '-'), t.share_frac_med_pct, t.stake_frac_net_med_pct, t.cents_over_med, t.lat_med_s) AS line FROM (SELECT count(*) AS markets, count(*) FILTER (WHERE COALESCE(our_staked, 0) > 0) AS staked_mkts, count(*) FILTER (WHERE COALESCE(our_staked, 0) <= 0) AS zero_stake_mkts, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) <= 0)::numeric, 2) AS zero_stake_settled, round(sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost, round(sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost_net, round(sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_pnl, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi, CASE WHEN sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi_net, round(sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_staked, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_settled, CASE WHEN sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS our_roi, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round(((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)) / (sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)))::numeric, 2) END AS roi_ratio, CASE WHEN sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round(((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)) / (sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0)))::numeric, 2) END AS roi_ratio_net, CASE WHEN sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS pnl_ratio, count(*) FILTER (WHERE sign_agree = 'same') AS same_sign, count(*) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite_sign, string_agg(book::text || '(' || COALESCE(last_reason, '?') || ')', ',' ORDER BY abs(COALESCE(our_settled, 0)) DESC) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY share_frac_pct)::numeric, 1) AS share_frac_med_pct, round(min(share_frac_pct)::numeric, 1) AS share_frac_min_pct, round(max(share_frac_pct)::numeric, 1) AS share_frac_max_pct, count(share_frac_pct) AS share_frac_n, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY stake_frac_net_pct)::numeric, 1) AS stake_frac_net_med_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY frac_gross_pct)::numeric, 1) AS frac_gross_med_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY cents_over)::numeric, 1) AS cents_over_med, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lat_med_s)::numeric, 0) AS lat_med_s FROM pair) t;"; TO=120000 ;;
                # THE LATENCY CENSUS (owner 2026-09-07 22:4xZ, "latency must be flawless and
                # exceptional"): every mirror order of the last 6 h with the LATEST fill of his
                # on the same market at or before the order -- his fill to our order (median
                # and p90) and our order to our fill (median), by hour and kind; then the last
                # 40 orders one by one. Read-only, LIMITed. Nothing here is the wake's own
                # clock: the stamp is his fill's venue/block time.
                latency-census) SQL="WITH o AS (SELECT o.id, o.book_id, o.kind, o.side, o.tif, o.state, o.filled, o.qty, o.placed_at, o.done_at, b.condition_id, left(b.us_market_slug, 30) AS slug, (SELECT max(t.ts) FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) AS his_ts FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE o.placed_at >= now() - interval '6 hours' AND o.kind IN ('open', 'increase', 'reduce', 'take', 'flatten_paired', 'flatten_vanished')) SELECT date_trunc('hour', placed_at)::time(0) AS hour, kind, count(*) AS n, count(*) FILTER (WHERE filled > 0) AS filled, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (placed_at - his_ts)))::numeric, 0) AS his_to_order_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY extract(epoch FROM (placed_at - his_ts)))::numeric, 0) AS his_to_order_p90_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (done_at - placed_at))) FILTER (WHERE filled > 0 AND done_at IS NOT NULL)::numeric, 0) AS order_to_fill_med_s FROM o WHERE his_ts IS NOT NULL GROUP BY 1, 2 ORDER BY 1 DESC, 2; WITH o AS (SELECT o.id, o.book_id, o.kind, o.side, o.tif, o.state, o.filled, o.qty, o.placed_at, o.done_at, b.condition_id, left(b.us_market_slug, 30) AS slug, (SELECT max(t.ts) FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) AS his_ts FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE o.placed_at >= now() - interval '6 hours' AND o.kind IN ('open', 'increase', 'reduce', 'take', 'flatten_paired', 'flatten_vanished')) SELECT id, book_id AS book, slug, kind, side, tif, state, filled, qty, placed_at::time(0) AS placed, his_ts::time(0) AS his_fill, round(extract(epoch FROM (placed_at - his_ts))::numeric, 0) AS his_to_order_s, round(extract(epoch FROM (done_at - placed_at))::numeric, 0) AS order_to_done_s FROM o WHERE his_ts IS NOT NULL ORDER BY placed_at DESC LIMIT 40; SELECT date_trunc('hour', t.ts)::time(0) AS hour, count(*) AS his_fills, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (t.detected_at - t.ts)))::numeric, 0) AS ingest_lag_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY extract(epoch FROM (t.detected_at - t.ts)))::numeric, 0) AS ingest_lag_p90_s, string_agg(DISTINCT t.source, ',') AS sources FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '6 hours' AND t.detected_at IS NOT NULL GROUP BY 1 ORDER BY 1 DESC; WITH f AS (SELECT t.condition_id, t.ts, t.detected_at FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '6 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), fo AS (SELECT f.condition_id, f.ts, f.detected_at, (SELECT min(o.placed_at) FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.condition_id = f.condition_id AND o.placed_at >= f.ts AND o.placed_at < f.ts + interval '30 minutes' AND o.kind IN ('open', 'increase', 'take', 'reduce')) AS first_order FROM f) SELECT date_trunc('hour', ts)::time(0) AS hour, count(*) AS his_fills_on_our_markets, count(first_order) AS answered_in_30m, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (first_order - ts))) FILTER (WHERE first_order IS NOT NULL)::numeric, 0) AS fill_to_first_order_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY extract(epoch FROM (first_order - ts))) FILTER (WHERE first_order IS NOT NULL)::numeric, 0) AS fill_to_first_order_p90_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (detected_at - ts))) FILTER (WHERE detected_at IS NOT NULL)::numeric, 0) AS ingest_lag_med_s FROM fo GROUP BY 1 ORDER BY 1 DESC;"; TO=60000 ;;
                # THE FILLS ANSWERED (E9, 2026-09-07; owner 22:4xZ "latency must be flawless
                # and exceptional"): every fill of his of the last 6 h on a market that has
                # (or had) a mirror book, joined to the book's last_plan->'his_fills_seen'
                # entry for it -- ONE row per fill, written by the tick that first planned
                # with it: our order's row id, or the refusal name (mirror_live, the
                # paragraph over FAST_TICK_MAX). By name (answered = an order went out that
                # tick; unseen = no plan has held the fill yet), with the count, his dollars
                # and the seconds from his fill to the tick that answered or named it
                # (median, p90); then the top 30 unanswered by his dollars, one by one.
                # His rows are collapsed chain-first the way the mirror's own read
                # collapses them (D1: a per-match poll row whose (tx, asset, side) has
                # a chain / s1 row is that row's split, never a second fill) -- the plan
                # lists the net-leg row's id, so an uncollapsed census would file every
                # poll duplicate as 'unseen' with its dollars. The window runs over his
                # 6 h of rows on mirrored markets only. Read-only, LIMITed.
                fills-answered) SQL="WITH r AS (SELECT t.id, t.condition_id, t.ts, t.detected_at, upper(t.side) AS side, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '6 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.detected_at, r.side, r.size, r.price, r.size * r.price AS usd, r.his_slug FROM r WHERE r.net_leg OR NOT r.has_net), s AS (SELECT f.*, x.e FROM f LEFT JOIN LATERAL (SELECT e FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), n AS (SELECT s.*, CASE WHEN s.e IS NULL THEN 'unseen' WHEN (s.e->>'order') IS NOT NULL THEN 'answered' ELSE COALESCE(s.e->>'name', 'unnamed') END AS name, CASE WHEN s.e IS NOT NULL THEN (s.e->>'at')::float8 - extract(epoch FROM s.ts) END AS lag_s FROM s) SELECT name, count(*) AS fills, round(sum(usd)::numeric, 2) AS his_usd, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_p90_s FROM n GROUP BY 1 ORDER BY 3 DESC; WITH r AS (SELECT t.id, t.condition_id, t.ts, t.detected_at, upper(t.side) AS side, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '6 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.detected_at, r.side, r.size, r.price, r.size * r.price AS usd, r.his_slug FROM r WHERE r.net_leg OR NOT r.has_net), s AS (SELECT f.*, x.e FROM f LEFT JOIN LATERAL (SELECT e FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), n AS (SELECT s.*, CASE WHEN s.e IS NULL THEN 'unseen' WHEN (s.e->>'order') IS NOT NULL THEN 'answered' ELSE COALESCE(s.e->>'name', 'unnamed') END AS name, CASE WHEN s.e IS NOT NULL THEN (s.e->>'at')::float8 - extract(epoch FROM s.ts) END AS lag_s FROM s) SELECT id, his_slug, ts::time(0) AS his_fill, detected_at::time(0) AS ingested, side, round(size::numeric, 1) AS sh, price, round(usd::numeric, 2) AS his_usd, name, round(lag_s::numeric, 0) AS lag_s FROM n WHERE name <> 'answered' ORDER BY his_usd DESC LIMIT 30;"; TO=60000 ;;
                close-rows) SQL="SELECT o.id, o.book_id AS book, left(o.us_market_slug, 40) AS slug, replace(b.intent, 'ORDER_INTENT_BUY_', '') AS book_intent, o.kind, o.side, o.tif, o.qty, o.state, o.venue_state, o.filled, round(o.avg_px::numeric, 3) AS avg_px, left(o.reason, 30) AS reason, o.placed_at::time(0) AS placed, o.done_at::time(0) AS done, o.order_id IS NOT NULL AS has_id, left(o.receipt::text, 160) AS receipt, b.state AS bstate, b.frozen_reason, b.ledger_net AS held FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE o.tif = 'CLOSE' OR o.kind IN ('flatten_paired', 'flatten_vanished') ORDER BY o.id DESC LIMIT 60; SELECT b.intent, o.tif, o.state, count(*) AS n, sum(o.filled) AS filled FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE o.kind IN ('flatten_paired', 'flatten_vanished', 'reduce') GROUP BY 1, 2, 3 ORDER BY 1, 2, 3;"; TO=30000 ;;
                # THE MIRROR'S OWN FILLED-VS-MISSED (lane M, 2026-09-08). The FVM and PRICEFID
                # lines of the probe exclude lane='mirror' (api/app.py:2671, price_fidelity.py
                # :181), so none of the mirror's entries were scored. 1: his ADDING fills on our
                # markets (24 h, chain/s1 collapsed as fills-answered; adding on the token axis
                # of the book whose window holds the fill -- opened_at less the 120 s a fill is
                # answered within, to closed_at; the later book when two hold it, else the
                # latest (the fold of MEDIUM-2, 2026-09-08: the latest book's axis dropped the
                # fill the first book of a flipped market filled) -- a short mirrored) joined to
                # our first entry order within 120 s -- by the plan's his_fills_seen[].order when
                # the entry carries one, else the first increase/take placed in [ts, ts + 120 s)
                # (FILL lane 4, 2026-09-08: the per-fill record mirror_fill_answers, migration 060,
                # is read FIRST -- its order_id, then the plan's, then the window; its name, then the
