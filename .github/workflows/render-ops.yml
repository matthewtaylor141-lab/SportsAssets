) OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM hf t JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE m.resolved_prices IS NOT NULL GROUP BY t.condition_id), axf AS (SELECT f.condition_id, f.ts, f.id, f.size, ax.short, (CASE WHEN f.asset = ax.long_asset THEN 1 WHEN f.asset = ax.other_asset THEN -1 END) * (CASE WHEN upper(f.side) = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN ax.short THEN -1 ELSE 1 END) * f.size AS sgn_sh, CASE WHEN ax.short THEN 1 - (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) ELSE (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price END) END AS px_leg FROM hf f JOIN ax ON ax.condition_id = f.condition_id WHERE f.asset = ax.long_asset OR f.asset = ax.other_asset), run AS (SELECT a.*, sum(a.sgn_sh) OVER (PARTITION BY a.condition_id ORDER BY a.ts, a.id) AS running FROM axf a), pk AS (SELECT DISTINCT ON (condition_id) condition_id, CASE WHEN running < 0 THEN -1 ELSE 1 END AS ps FROM run ORDER BY condition_id, abs(running) DESC, ts, id), net AS (SELECT r.condition_id, max(abs(r.running)) AS his_net_peak, sum((CASE WHEN pk.ps > 0 THEN r.px_leg ELSE 1 - r.px_leg END) * greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))) / NULLIF(sum(greatest(0, greatest(pk.ps *