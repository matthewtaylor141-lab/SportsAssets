ning - r.sgn_sh), 0))) / NULLIF(sum(greatest(0, greatest(pk.ps * r.running, 0) - greatest(pk.ps * (r.running - r.sgn_sh), 0))), 0) AS his_vwap_adds FROM run r JOIN pk ON pk.condition_id = r.condition_id GROUP BY 1), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), oavg AS (SELECT b.condition_id, round((sum((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - o.avg_px ELSE o.avg_px END) * o.filled) / NULLIF(sum(o.filled), 0))::numeric, 4) AS avg_leg FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.filled > 0 AND o.avg_px IS NOT NULL AND ((b.intent <> 'ORDER_INTENT_BUY_SHORT' AND o.side = 'BUY_LONG') OR (b.intent = 'ORDER_INTENT_BUY_SHORT' AND o.side = 'SELL_LONG')) AND b.condition_id IN (SELECT condition_id FROM bk) GROUP BY 1), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, round(net.his_net_peak::numeric, 1) AS his_net_peak, round(net.his_vwap_adds::numeric, 4) AS his_vwap_adds, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds IS NOT NULL THEN round((net.his_net_peak * net.his_vwap_adds)::numeric, 2) END AS his_cost_net, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3