t.side) = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN t.asset = bk.long_asset THEN 1 WHEN t.asset = bk.other_asset OR bk.other_asset IS NULL THEN -1 ELSE 0 END) * (CASE WHEN bk.is_short THEN -1 ELSE 1 END) * t.size AS leg, (CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price) AS pnl FROM (SELECT d.* FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)) t JOIN bk ON bk.condition_id = t.condition_id LEFT JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id), hn AS (SELECT h.*, sum(h.leg) OVER (PARTITION BY h.condition_id ORDER BY h.ts, h.id) AS net_after FROM h), hp AS (SELECT condition_id, max(market_slug) AS his_slug, round(sum(pnl)::numeric, 2) AS his_pnl FROM h GROUP BY condition_id), pk AS (SELECT DISTINCT ON (condition_id) condition_id, ts AS peak_ts, id AS peak_id, net_after AS peak FROM hn WHERE net_after > 0 ORDER BY condition_id, net_after DESC, ts, id), hr AS (SELECT hn.id, hn.condition_id, hn.ts, hn.size, hn.eff_px, hn.net_after, hn.net_after <= 0.10 * pk.peak AS out, hn.leg < 0 AS reducing FROM hn JOIN pk ON pk.condition_id = hn.condition_id WHERE (hn.ts, hn.id) > (pk.peak_ts, pk.peak_id)), hx AS (SELECT DISTINCT ON (condition_id) condition_id, ts AS exit_ts, id AS exit_id FROM hr WHERE out ORDER BY condition_id, ts, id), hs AS (SELECT pk.condition_id, pk.peak, pk.peak_ts, hx.exit_ts, min(hr.net_after) AS trough, min(hr.ts) FILTER (WHERE hr.reducing) AS exit_from, sum(hr.size * hr.eff_px) FILTER (WHERE hr.reducing AND (hr.ts, hr.id) <= (hx.exit_ts, hx.exit_id)) / NULLIF(sum(hr.size) FILTER (WHERE hr.reducing AND (hr.ts, hr.id) <= (hx.exit_ts, hx.exit_id)), 0) AS exit_px, sum(hr.size * (CASE WHEN bk.is_short THEN 1 - hr.eff_px ELSE hr.eff_px END)) FILTER (WHERE hr.reducing AND (hr.ts, hr.id) <= (hx.exit_ts, hx.exit_id)) AS exit_usd FROM pk JOIN bk ON bk.condition_id = pk.condition_id LEFT JOIN hx ON hx.condition_id = pk.condition_id LEFT JOIN hr ON hr.condition_id = pk.condition_id GROUP BY pk.condition_id, pk.peak, pk.peak_ts, hx.exit_ts, hx.exit_id, bk.is_short), oo AS (SELECT o.id, b.condition_id, o.filled, o.avg_px, o.placed_at, (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN o.side = 'BUY_LONG' ELSE o.side = 'SELL_LONG' END) AS reducing FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND b.state = 'closed' AND b.closed_at >= now() - interval '24 hours'), op AS (SELECT condition_id, max(run) AS our_peak FROM (SELECT condition_id, sum(CASE WHEN reducing THEN -filled ELSE filled END) OVER (PARTITION BY condition_id ORDER BY placed_at, id) AS run FROM oo) x GROUP BY condition_id), ow AS (SELECT oo.*, (oo.reducing AND oo.placed_at >= hs.exit_from - interval '10 seconds') AS after_his FROM oo JOIN hs ON hs.condition_id = oo.condition_id), ox AS (SELECT condition_id, min(placed_at) FILTER (WHERE after_his) AS our_exit_ts, count(*) FILTER (WHERE after_his) AS our_exit_placed, sum(filled) FILTER (WHERE after_his) AS our_exit_filled, sum(avg_px * filled) FILTER (WHERE after_his AND filled > 0 AND avg_px IS NOT NULL) / NULLIF(sum(filled) FILTER (WHERE after_his AND filled > 0 AND avg_px IS NOT NULL), 0) AS our_exit_px FROM ow GROUP BY condition_id), pair AS (SELECT bk.book, left(COALESCE(hp.his_slug, bk.slugs), 30) AS market, CASE WHEN bk.is_short THEN 'short' ELSE 'long' END AS side, round(hs.peak::numeric, 0) AS his_peak, hs.exit_from::time(0) AS his_exit_from, hs.exit_ts::time(0) AS his_exit_ts, round(hs.exit_px::numeric, 3) AS his_exit_px, round(hs.exit_usd::numeric, 2) AS his_exit_usd, CASE WHEN hs.peak > 0 THEN round((1 - COALESCE(hs.trough, hs.peak) / hs.peak)::numeric, 2) END AS his_reduced_pct, hp.his_pnl, round(op.our_peak::numeric, 0) AS our_peak, ox.our_exit_ts::time(0) AS our_exit_ts, round(ox.our_exit_px::numeric, 3) AS our_exit_px, round((ox.our_exit_filled / NULLIF(op.our_peak, 0))::numeric, 2) AS our_exit_filled_pct, round(extract(epoch FROM (ox.our_exit_ts - hs.exit_from))::numeric, 0) AS lag_s, round(((CASE WHEN bk.is_short THEN ox.our_exit_px - hs.exit_px ELSE hs.exit_px - ox.our_exit_px END) * 100)::numeric, 1) AS cents_vs_his, (COALESCE(ox.our_exit_filled, 0) = 0 AND bk.settled_ok) AS held_to_settlement, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN COALESCE(op.our_peak, 0) <= 0 THEN 'no_position' WHEN hs.condition_id IS NULL THEN 'his_net_unseen' WHEN hs.exit_ts IS NULL AND (1 - COALESCE(hs.trough, hs.peak) / hs.peak) >= 0.25 AND abs(COALESCE(ox.our_exit_filled, 0) / NULLIF(op.our_peak, 0) - (1 - COALESCE(hs.trough, hs.peak) / hs.peak)) <= 0.05 THEN 'we_matched_his_cut' WHEN hs.exit_ts IS NULL AND (1 - COALESCE(hs.trough, hs.peak) / hs.peak) >= 0.25 AND COALESCE(ox.our_exit_filled, 0) / NULLIF(op.our_peak, 0) < 0.5 THEN 'he_reduced_we_held' WHEN hs.exit_ts IS NULL THEN 'no_exit_by_him' WHEN ox.our_exit_filled / NULLIF(op.our_peak, 0) >= 0.8 THEN 'exited_with_him' WHEN ox.our_exit_filled > 0 THEN 'partial_exit' WHEN ox.our_exit_placed > 0 THEN 'exit_placed_unfilled' ELSE 'no_exit_order' END AS verdict, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason FROM bk LEFT JOIN hp ON hp.condition_id = bk.condition_id LEFT JOIN hs ON hs.condition_id = bk.condition_id LEFT JOIN op ON op.condition_id = bk.condition_id LEFT JOIN ox ON ox.condition_id = bk.condition_id), v AS (SELECT pair.*, CASE WHEN verdict IN ('partial_exit', 'exit_placed_unfilled', 'no_exit_order', 'he_reduced_we_held') AND our_settled < 0 THEN -our_settled END AS stuck_after_his_exit_usd FROM pair) SELECT count(*) AS books, count(his_exit_ts) AS his_exits, count(*) FILTER (WHERE verdict = 'exited_with_him') AS with_him, count(*) FILTER (WHERE verdict = 'partial_exit') AS partial, count(*) FILTER (WHERE verdict = 'exit_placed_unfilled') AS unfilled, count(*) FILTER (WHERE verdict = 'no_exit_order') AS no_order, count(*) FILTER (WHERE verdict = 'no_exit_by_him') AS he_held, count(*) FILTER (WHERE verdict = 'he_reduced_we_held') AS reduced_we_held, round(sum(stuck_after_his_exit_usd) FILTER (WHERE verdict = 'he_reduced_we_held')::numeric, 2) AS reduced_we_held_stuck_usd, count(*) FILTER (WHERE verdict = 'we_matched_his_cut') AS matched_cut_n, count(*) FILTER (WHERE verdict IN ('no_position', 'his_net_unseen')) AS unmeasured, round(sum(stuck_after_his_exit_usd)::numeric, 2) AS stuck_usd, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lag_s) FILTER (WHERE verdict = 'exited_with_him')::numeric, 0) AS lag_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY lag_s) FILTER (WHERE verdict = 'exited_with_him')::numeric, 0) AS lag_p90_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY cents_vs_his)::numeric, 1) AS cents_vs_his_med FROM v;"; TO=60000 ;;
                # [R60] see .github/workflows/RENDER_OPS_NOTES.md
                take-band) SQL="WITH e AS (SELECT o.id, CASE WHEN o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') THEN 'rest_replaced' ELSE COALESCE(o.decision, 'unrecorded') END AS decision, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, o.filled, o.wire, o.qty, o.tif, o.ask_at_send, CASE WHEN o.his_level IS NULL OR o.ask_at_place IS NULL THEN NULL ELSE round(((o.ask_at_place::numeric - floor(round((o.his_level * 100)::numeric, 6)) / 100) * 100)::numeric, 0) END AS band_c, CASE WHEN o.his_level IS NULL THEN NULL ELSE round(((o.wire::numeric - floor(round((o.his_level * 100)::numeric, 6)) / 100) * 100)::numeric, 1) END AS paid_c, CASE WHEN m.resolved_prices IS NULL OR mt.outcome_index IS NULL THEN NULL ELSE (m.resolved_prices->>mt.outcome_index)::numeric END AS payoff FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id LEFT JOIN market_tokens mt ON mt.token_id = b.long_asset LEFT JOIN markets m ON m.condition_id = b.condition_id WHERE b.whale = 'rn1' AND b.intent = 'ORDER_INTENT_BUY_LONG' AND o.side = 'BUY_LONG' AND o.kind IN ('increase', 'take') AND o.placed_at >= now() - interval '24 hours'), x AS (SELECT e.*, CASE WHEN band_c IS NULL THEN 'unread' WHEN band_c <= 0 THEN '<=0' WHEN band_c = 1 THEN '1' WHEN band_c = 2 THEN '2' ELSE '3+' END AS bucket FROM e) SELECT COALESCE(decision, 'ALL') AS decision, COALESCE(bucket, 'ALL') AS bucket, count(*) AS n, count(*) FILTER (WHERE filled > 0) AS filled_n, sum(count(*) FILTER (WHERE replaced)) OVER (PARTITION BY regexp_replace(decision, '_replaced$', ''), bucket) AS replaced_n, round(100.0 * count(*) FILTER (WHERE filled > 0) / count(*), 1) AS fill_pct, round(sum(filled * wire)::numeric, 2) AS our_usd, count(*) FILTER (WHERE filled > 0 AND payoff IS NOT NULL) AS n_resolved, round((sum(filled * (payoff - wire)) FILTER (WHERE filled > 0 AND payoff IS NOT NULL) / NULLIF(sum(filled * wire) FILTER (WHERE filled > 0 AND payoff IS NOT NULL), 0))::numeric, 4) AS roi, round((1.96 * stddev_samp((payoff - wire) / NULLIF(wire, 0)) FILTER (WHERE filled > 0 AND payoff IS NOT NULL) / sqrt(NULLIF(count(*) FILTER (WHERE filled > 0 AND payoff IS NOT NULL), 0)))::numeric, 4) AS ci95, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY paid_c) FILTER (WHERE filled > 0)::numeric, 1) AS paid_med_c, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (ask_at_send - wire) * 100) FILTER (WHERE tif = 'IOC' AND ask_at_send IS NOT NULL)::numeric, 1) AS send_ask_over_wire_med_c FROM x GROUP BY ROLLUP (decision, bucket) ORDER BY 1, 2; WITH e AS (SELECT o.id, o.book_id, CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 'short' ELSE 'long' END AS side, o.decision, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, o.qty, o.filled, o.placed_at, o.done_at, CASE WHEN o.his_level IS NULL THEN NULL ELSE floor(round((o.his_level * 100)::numeric, 6)) END AS his_cent, round(o.wire::numeric, 4) AS wire_c FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.kind IN ('increase', 'take') AND (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN o.side = 'SELL_LONG' ELSE o.side = 'BUY_LONG' END) AND o.placed_at >= now() - interval '24 hours'), n AS (SELECT e.*, LEAD(his_cent) OVER w AS nx_cent, LEAD(wire_c) OVER w AS nx_wire, LEAD(qty) OVER w AS nx_qty, LEAD(placed_at) OVER w AS nx_placed FROM e WINDOW w AS (PARTITION BY book_id ORDER BY placed_at, id)), z AS (SELECT side, date_trunc('hour', placed_at)::time(0) AS hour, CASE WHEN nx_placed IS NULL OR his_cent IS NULL OR nx_cent IS NULL OR wire_c IS NULL OR nx_wire IS NULL THEN 'unread' WHEN his_cent = nx_cent AND wire_c <> nx_wire THEN 'touch_moved' WHEN his_cent = nx_cent AND wire_c = nx_wire AND nx_qty = qty THEN 'same_quote' WHEN his_cent = nx_cent AND wire_c = nx_wire AND nx_qty > qty AND (nx_qty - qty) < 0.10 * greatest(qty - filled, 0) THEN 'qty_regrow' ELSE 'other' END AS pair, (decision = 'replace_unread' AND done_at - placed_at < interval '45 seconds' AND filled = 0) AS future_clock, extract(epoch FROM (done_at - placed_at)) AS done_s FROM n WHERE replaced) SELECT COALESCE(side, 'ALL') AS side, COALESCE(hour::text, 'ALL') AS hour, count(*) AS replaced, count(*) FILTER (WHERE pair = 'touch_moved') AS touch_moved, count(*) FILTER (WHERE pair = 'same_quote') AS same_quote, count(*) FILTER (WHERE future_clock) AS future_clock, count(*) FILTER (WHERE pair = 'qty_regrow') AS qty_regrow, count(*) FILTER (WHERE pair = 'other') AS other, count(*) FILTER (WHERE pair = 'unread') AS unread, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY done_s)::numeric, 0) AS done_med_s FROM z GROUP BY ROLLUP (side, hour) ORDER BY 1, 2 DESC; WITH s AS (SELECT o.id, CASE WHEN o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') THEN 'rest_replaced' ELSE COALESCE(o.decision, 'unrecorded') END AS decision, o.filled, o.wire, o.tif, CASE WHEN o.his_level IS NULL OR o.bid_at_place IS NULL THEN NULL ELSE round(((ceil(round((o.his_level * 100)::numeric, 6)) / 100 - o.bid_at_place::numeric) * 100)::numeric, 0) END AS band_c, CASE WHEN o.his_level IS NULL THEN NULL ELSE round(((ceil(round((o.his_level * 100)::numeric, 6)) / 100 - o.wire::numeric) * 100)::numeric, 1) END AS given_c, CASE WHEN m.resolved_prices IS NULL OR mt.outcome_index IS NULL THEN NULL ELSE (m.resolved_prices->>mt.outcome_index)::numeric END AS payoff FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id LEFT JOIN market_tokens mt ON mt.token_id = b.long_asset LEFT JOIN markets m ON m.condition_id = b.condition_id WHERE b.whale = 'rn1' AND b.intent = 'ORDER_INTENT_BUY_SHORT' AND o.side = 'SELL_LONG' AND o.kind IN ('increase', 'take') AND o.placed_at >= now() - interval '24 hours'), y AS (SELECT s.*, CASE WHEN band_c IS NULL THEN 'unread' WHEN band_c <= 0 THEN '<=0' WHEN band_c = 1 THEN '1' WHEN band_c = 2 THEN '2' ELSE '3+' END AS bucket FROM s) SELECT 'short' AS side, COALESCE(decision, 'ALL') AS decision, COALESCE(bucket, 'ALL') AS bucket, count(*) AS n, count(*) FILTER (WHERE filled > 0) AS filled_n, round(100.0 * count(*) FILTER (WHERE filled > 0) / NULLIF(count(*), 0), 1) AS fill_pct, round(sum(filled * (1 - wire))::numeric, 2) AS our_usd, count(*) FILTER (WHERE filled > 0 AND payoff IS NOT NULL) AS n_resolved, round((sum(filled * (wire - payoff)) FILTER (WHERE filled > 0 AND payoff IS NOT NULL) / NULLIF(sum(filled * (1 - wire)) FILTER (WHERE filled > 0 AND payoff IS NOT NULL), 0))::numeric, 4) AS roi, round((1.96 * stddev_samp((wire - payoff) / NULLIF(1 - wire, 0)) FILTER (WHERE filled > 0 AND payoff IS NOT NULL) / sqrt(NULLIF(count(*) FILTER (WHERE filled > 0 AND payoff IS NOT NULL), 0)))::numeric, 4) AS ci95, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY given_c) FILTER (WHERE filled > 0)::numeric, 1) AS given_med_c FROM y GROUP BY ROLLUP (decision, bucket) ORDER BY 2, 3;"; TO=60000 ;;
                # [R61] see .github/workflows/RENDER_OPS_NOTES.md
                maker-rests) SQL="WITH e AS (SELECT o.id, o.book_id, round(o.wire::numeric, 4) AS wire, o.qty, o.filled, o.state, o.taker_at_placement, o.placed_at, o.done_at, o.his_level, o.bid_at_place, o.ask_at_place, o.side, CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 'short' ELSE 'long' END AS side_w, CASE WHEN o.kind = 'increase' THEN 'add' ELSE 'reduce' END AS leg, CASE WHEN o.his_level IS NULL THEN 'unpriced' WHEN o.side = 'BUY_LONG' AND round(o.wire::numeric, 4) = floor(round((o.his_level * 100)::numeric, 6)) / 100 THEN 'his_cent' WHEN o.side = 'SELL_LONG' AND round(o.wire::numeric, 4) = ceil(round((o.his_level * 100)::numeric, 6)) / 100 THEN 'his_cent' ELSE 'touch' END AS clause, CASE WHEN m.resolved_prices IS NULL OR mt.outcome_index IS NULL THEN NULL ELSE (m.resolved_prices->>mt.outcome_index)::numeric END AS payoff FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id LEFT JOIN market_tokens mt ON mt.token_id = b.long_asset LEFT JOIN markets m ON m.condition_id = b.condition_id WHERE b.whale = 'rn1' AND o.post_only IS TRUE AND o.tif IN ('GTC', 'GTD') AND o.placed_at >= now() - interval '24 hours'), x AS (SELECT e.*, CASE WHEN side_w = 'short' AND side = 'SELL_LONG' THEN 1 - wire ELSE wire END AS cost_px, CASE WHEN his_level IS NULL THEN NULL WHEN side = 'BUY_LONG' THEN round(((wire - floor(round((his_level * 100)::numeric, 6)) / 100) * 100)::numeric, 1) ELSE round(((ceil(round((his_level * 100)::numeric, 6)) / 100 - wire) * 100)::numeric, 1) END AS from_his_c, CASE WHEN side = 'BUY_LONG' AND ask_at_place IS NOT NULL THEN round(((ask_at_place::numeric - wire) * 100)::numeric, 1) WHEN side = 'SELL_LONG' AND bid_at_place IS NOT NULL THEN round(((wire - bid_at_place::numeric) * 100)::numeric, 1) ELSE NULL END AS from_touch_c, extract(epoch FROM (done_at - placed_at)) AS ttf_s FROM e) SELECT COALESCE(side_w, 'ALL') AS side, COALESCE(leg, 'ALL') AS leg, COALESCE(clause, 'ALL') AS clause, count(*) AS rests, count(*) FILTER (WHERE state = 'open') AS standing, count(*) FILTER (WHERE filled > 0) AS filled_n, count(*) FILTER (WHERE filled >= qty) AS filled_whole, round(100.0 * count(*) FILTER (WHERE filled > 0) / NULLIF(count(*), 0), 1) AS fill_pct, round(sum(filled * cost_px)::numeric, 2) AS filled_usd, round(100.0 * count(*) FILTER (WHERE filled > 0 AND taker_at_placement IS NOT TRUE) / NULLIF(count(*) FILTER (WHERE filled > 0), 0), 1) AS maker_fill_pct, count(*) FILTER (WHERE taker_at_placement IS TRUE) AS crossed_at_create, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY from_his_c)::numeric, 1) AS from_his_c_med, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY from_touch_c)::numeric, 1) AS from_touch_c_med, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY ttf_s) FILTER (WHERE filled > 0)::numeric, 0) AS ttf_med_s, round(sum(greatest(qty - filled, 0) * cost_px)::numeric, 2) AS unfilled_usd, count(*) FILTER (WHERE leg = 'add' AND filled > 0 AND payoff IS NOT NULL) AS n_resolved, round((sum(CASE WHEN side = 'BUY_LONG' THEN filled * (payoff - wire) ELSE filled * (wire - payoff) END) FILTER (WHERE leg = 'add' AND filled > 0 AND payoff IS NOT NULL) / NULLIF(sum(filled * cost_px) FILTER (WHERE leg = 'add' AND filled > 0 AND payoff IS NOT NULL), 0))::numeric, 4) AS roi, round((1.96 * stddev_samp(CASE WHEN side = 'BUY_LONG' THEN (payoff - wire) / NULLIF(wire, 0) ELSE (wire - payoff) / NULLIF(cost_px, 0) END) FILTER (WHERE leg = 'add' AND filled > 0 AND payoff IS NOT NULL) / sqrt(NULLIF(count(*) FILTER (WHERE leg = 'add' AND filled > 0 AND payoff IS NOT NULL), 0)))::numeric, 4) AS ci95 FROM x GROUP BY ROLLUP (side_w, leg, clause) ORDER BY 1, 2, 3; WITH e AS (SELECT o.id, o.book_id, o.state, o.reason, o.qty, o.filled, o.placed_at, o.done_at, CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 'short' ELSE 'long' END AS side_w, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, CASE WHEN o.his_level IS NULL THEN NULL ELSE floor(round((o.his_level * 100)::numeric, 6)) END AS his_cent, round(o.wire::numeric, 4) AS wire_c, b.last_plan->>'hold' AS hold FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.placed_at >= now() - interval '24 hours'), n AS (SELECT e.*, LEAD(wire_c) OVER w AS nx_wire, LEAD(his_cent) OVER w AS nx_cent, LEAD(qty) OVER w AS nx_qty, LEAD(placed_at) OVER w AS nx_placed FROM e WINDOW w AS (PARTITION BY book_id ORDER BY placed_at, id)), z AS (SELECT side_w, book_id, date_trunc('hour', placed_at)::time(0) AS hour, replaced, hold, CASE WHEN nx_placed IS NULL OR his_cent IS NULL OR nx_cent IS NULL OR wire_c IS NULL OR nx_wire IS NULL THEN 'unread' WHEN his_cent = nx_cent AND wire_c <> nx_wire THEN 'touch_moved' WHEN his_cent = nx_cent AND wire_c = nx_wire AND nx_qty = qty THEN 'same_quote' WHEN his_cent = nx_cent AND wire_c = nx_wire AND nx_qty > qty AND (nx_qty - qty) < 0.10 * greatest(qty - filled, 0) THEN 'qty_regrow' ELSE 'other' END AS pair, (state = 'rejected' AND reason LIKE 'post_only_rejected:%') AS rejected, (state = 'rejected' AND reason LIKE '%:cross') AS rejected_cross, (state = 'rejected' AND nx_placed IS NOT NULL AND nx_placed - placed_at < interval '90 seconds' AND wire_c IS DISTINCT FROM nx_wire) AS repriced FROM n) SELECT COALESCE(side_w, 'ALL') AS side, COALESCE(hour::text, 'ALL') AS hour, count(*) AS rows_n, count(*) FILTER (WHERE replaced) AS replaced, count(*) FILTER (WHERE replaced AND pair = 'touch_moved') AS touch_moved, count(*) FILTER (WHERE replaced AND pair = 'same_quote') AS same_quote, count(*) FILTER (WHERE replaced AND pair = 'qty_regrow') AS qty_regrow, count(*) FILTER (WHERE replaced AND pair = 'other') AS other, count(*) FILTER (WHERE rejected) AS rejected, count(*) FILTER (WHERE rejected_cross) AS rejected_cross, count(*) FILTER (WHERE repriced) AS repriced, count(DISTINCT book_id) FILTER (WHERE hold = 'post_only_backoff') AS held_backoff FROM z GROUP BY ROLLUP (side_w, hour) ORDER BY 1, 2 DESC"; TO=60000 ;;
                # [R62] see .github/workflows/RENDER_OPS_NOTES.md
                exits-band) SQL="WITH x AS (SELECT o.id, o.book_id, CASE WHEN o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') THEN CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 'cover_replaced' ELSE 'exit_rest_replaced' END ELSE o.decision END AS decision, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, o.side, o.qty, o.filled, o.his_level, o.placed_at, o.done_at, b.settled_pnl, CASE WHEN o.his_level IS NULL THEN NULL WHEN o.side = 'SELL_LONG' AND o.bid_at_place IS NOT NULL THEN round(((o.his_level - o.bid_at_place) * 100)::numeric, 0) WHEN o.side = 'BUY_LONG' AND o.ask_at_place IS NOT NULL THEN round(((o.ask_at_place - o.his_level) * 100)::numeric, 0) END AS band_c FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.placed_at >= now() - interval '24 hours' AND (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN o.side = 'BUY_LONG' ELSE o.side = 'SELL_LONG' END) AND o.decision IN ('exit_rest', 'take', 'cover', 'exit_take_in_band', 'cover_in_band', 'replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread')), y AS (SELECT x.*, CASE WHEN band_c IS NULL THEN 'unread' WHEN band_c <= 0 THEN '<=0' WHEN band_c = 1 THEN '1' WHEN band_c = 2 THEN '2' WHEN band_c <= 5 THEN '3-5' ELSE '>5' END AS bucket, extract(epoch FROM (done_at - placed_at)) AS done_s FROM x) SELECT COALESCE(decision, 'ALL') AS decision, COALESCE(bucket, 'ALL') AS bucket, count(*) AS n, count(*) FILTER (WHERE filled > 0) AS filled_any, count(*) FILTER (WHERE filled >= qty) AS filled_whole, sum(count(*) FILTER (WHERE replaced)) OVER (PARTITION BY regexp_replace(decision, '_replaced$', ''), bucket) AS replaced_n, round(sum(greatest(qty - filled, 0))::numeric, 1) AS shares_unfilled, round(sum(greatest(qty - filled, 0) * his_level)::numeric, 2) AS usd_unfilled, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY done_s)::numeric, 0) AS done_med_s FROM y GROUP BY ROLLUP (decision, bucket) ORDER BY 1, 2; WITH x AS (SELECT o.id, o.book_id, CASE WHEN o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') THEN CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 'cover_replaced' ELSE 'exit_rest_replaced' END ELSE o.decision END AS decision, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, o.side, o.qty, o.filled, o.his_level, o.placed_at, o.done_at, b.settled_pnl, CASE WHEN o.his_level IS NULL THEN NULL WHEN o.side = 'SELL_LONG' AND o.bid_at_place IS NOT NULL THEN round(((o.his_level - o.bid_at_place) * 100)::numeric, 0) WHEN o.side = 'BUY_LONG' AND o.ask_at_place IS NOT NULL THEN round(((o.ask_at_place - o.his_level) * 100)::numeric, 0) END AS band_c FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.placed_at >= now() - interval '24 hours' AND (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN o.side = 'BUY_LONG' ELSE o.side = 'SELL_LONG' END) AND o.decision IN ('exit_rest', 'take', 'cover', 'exit_take_in_band', 'cover_in_band', 'replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread')), y AS (SELECT x.*, CASE WHEN band_c IS NULL THEN 'unread' WHEN band_c <= 0 THEN '<=0' WHEN band_c = 1 THEN '1' WHEN band_c = 2 THEN '2' WHEN band_c <= 5 THEN '3-5' ELSE '>5' END AS bucket, extract(epoch FROM (done_at - placed_at)) AS done_s FROM x), bb AS (SELECT book_id, decision, bucket, bool_or(filled > 0) AS any_filled, max(settled_pnl) AS settled FROM y GROUP BY 1, 2, 3) SELECT COALESCE(decision, 'ALL') AS decision, COALESCE(bucket, 'ALL') AS bucket, count(*) AS books, count(*) FILTER (WHERE any_filled) AS books_filled, round(sum(settled) FILTER (WHERE any_filled)::numeric, 2) AS settled_when_filled, count(*) FILTER (WHERE NOT any_filled) AS books_unfilled, round(sum(settled) FILTER (WHERE NOT any_filled)::numeric, 2) AS settled_when_unfilled FROM bb GROUP BY ROLLUP (decision, bucket) ORDER BY 1, 2; WITH i AS (SELECT o.id, o.book_id, o.qty, o.filled, o.placed_at, CASE WHEN o.filled >= o.qty THEN 'whole' WHEN o.filled > 0 THEN 'partial' ELSE 'zero' END AS ioc_fill FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND b.intent = 'ORDER_INTENT_BUY_LONG' AND o.side = 'SELL_LONG' AND o.tif = 'IOC' AND o.placed_at >= now() - interval '24 hours'), r AS (SELECT i.*, x.id AS rest_id, x.qty AS rest_qty, x.filled AS rest_filled, extract(epoch FROM (x.placed_at - i.placed_at)) AS rest_lag_s FROM i LEFT JOIN LATERAL (SELECT o.id, o.qty, o.filled, o.placed_at FROM mirror_orders o WHERE o.book_id = i.book_id AND o.side = 'SELL_LONG' AND o.tif <> 'IOC' AND o.decision IN ('exit_rest', 'replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AND o.placed_at > i.placed_at AND o.placed_at <= i.placed_at + interval '15 seconds' ORDER BY o.placed_at, o.id LIMIT 1) x ON true) SELECT COALESCE(ioc_fill, 'ALL') AS ioc_fill, count(*) AS iocs, round(sum(qty)::numeric, 1) AS ioc_shares, round(sum(filled)::numeric, 1) AS ioc_filled_sh, count(rest_id) AS rested_15s, count(*) FILTER (WHERE rest_filled > 0) AS rest_filled_any, round(sum(rest_qty)::numeric, 1) AS rest_shares, round(sum(rest_filled)::numeric, 1) AS rest_filled_sh, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY rest_lag_s)::numeric, 1) AS rest_lag_med_s FROM r GROUP BY ROLLUP (ioc_fill) ORDER BY 1;"; TO=60000 ;;
