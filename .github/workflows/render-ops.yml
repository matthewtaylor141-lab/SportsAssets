running - r.sgn_sh), 0))), 0) AS his_vwap_adds FROM run r JOIN pk ON pk.condition_id = r.condition_id GROUP BY 1), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), oavg AS (SELECT b.condition_id, round((sum((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - o.avg_px ELSE o.avg_px END) * o.filled) / NULLIF(sum(o.filled), 0))::numeric, 4) AS avg_leg FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.filled > 0 AND o.avg_px IS NOT NULL AND ((b.intent <> 'ORDER_INTENT_BUY_SHORT' AND o.side = 'BUY_LONG') OR (b.intent = 'ORDER_INTENT_BUY_SHORT' AND o.side = 'SELL_LONG')) AND b.condition_id IN (SELECT condition_id FROM bk) GROUP BY 1), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, round(net.his_net_peak::numeric, 1) AS his_net_peak, round(net.his_vwap_adds::numeric, 4) AS his_vwap_adds, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds IS NOT NULL THEN round((net.his_net_peak * net.his_vwap_adds)::numeric, 2) END AS his_cost_net, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((his.pnl / (net.his_net_peak * net.his_vwap_adds))::numeric, 3) END AS his_roi_net, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / his.cost))::numeric, 2) END AS roi_ratio, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 AND his.pnl <> 0 AND bk.staked > 0 THEN round(((bk.settled / bk.staked) / (his.pnl / (net.his_net_peak * net.his_vwap_adds)))::numeric, 2) END AS roi_ratio_net, CASE WHEN his.pnl <> 0 AND bk.settled IS NOT NULL THEN round((bk.settled / his.pnl)::numeric, 4) END AS pnl_ratio, round(COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0))::numeric, 1) AS our_peak_sh, CASE WHEN net.his_net_peak > 0 AND COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) > 0 THEN round((100 * COALESCE(bk.peak_sh, bk.staked / NULLIF(oavg.avg_leg, 0)) / net.his_net_peak)::numeric, 1) END AS share_frac_pct, CASE WHEN net.his_net_peak > 0 AND net.his_vwap_adds > 0 THEN round((100 * bk.staked / (net.his_net_peak * net.his_vwap_adds))::numeric, 1) END AS stake_frac_net_pct, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_gross_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN net ON net.condition_id = bk.condition_id LEFT JOIN oavg ON oavg.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT t.*, format('PAIRED %s mkts (%s staked, %s zero-stake dropped) his_roi_net %s our_roi %s roi_ratio_net %sx gross his_roi %s roi_ratio %sx same %s/%s opposite %s share_frac_med %s%% stake_frac_net_med %s%% cents_over %sc lat_med %ss', t.markets, t.staked_mkts, t.zero_stake_mkts, t.his_roi_net, t.our_roi, t.roi_ratio_net, t.his_roi, t.roi_ratio, t.same_sign, t.markets, COALESCE(t.opposite, '-'), t.share_frac_med_pct, t.stake_frac_net_med_pct, t.cents_over_med, t.lat_med_s) AS line FROM (SELECT count(*) AS markets, count(*) FILTER (WHERE COALESCE(our_staked, 0) > 0) AS staked_mkts, count(*) FILTER (WHERE COALESCE(our_staked, 0) <= 0) AS zero_stake_mkts, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) <= 0)::numeric, 2) AS zero_stake_settled, round(sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost, round(sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost_net, round(sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_pnl, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi, CASE WHEN sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi_net, round(sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_staked, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_settled, CASE WHEN sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS our_roi, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round(((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)) / (sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)))::numeric, 2) END AS roi_ratio, CASE WHEN sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 AND sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round(((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)) / (sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost_net) FILTER (WHERE COALESCE(our_staked, 0) > 0)))::numeric, 2) END AS roi_ratio_net, CASE WHEN sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) <> 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS pnl_ratio, count(*) FILTER (WHERE sign_agree = 'same') AS same_sign, count(*) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite_sign, string_agg(book::text || '(' || COALESCE(last_reason, '?') || ')', ',' ORDER BY abs(COALESCE(our_settled, 0)) DESC) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY share_frac_pct)::numeric, 1) AS share_frac_med_pct, round(min(share_frac_pct)::numeric, 1) AS share_frac_min_pct, round(max(share_frac_pct)::numeric, 1) AS share_frac_max_pct, count(share_frac_pct) AS share_frac_n, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY stake_frac_net_pct)::numeric, 1) AS stake_frac_net_med_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY frac_gross_pct)::numeric, 1) AS frac_gross_med_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY cents_over)::numeric, 1) AS cents_over_med, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lat_med_s)::numeric, 0) AS lat_med_s FROM pair) t;"; TO=120000 ;;
                paired-ratio=*) if [[ ! "$ARG" =~ ^paired-ratio=([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?Z)$ ]]; then echo "paired-ratio: arg must be paired-ratio=<YYYY-MM-DDTHH:MM[:SS]Z> (got '$ARG')"; exit 1; fi
