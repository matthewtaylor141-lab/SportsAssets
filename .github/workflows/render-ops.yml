t.side) = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN t.asset = bk.long_asset THEN 1 WHEN t.asset = bk.other_asset OR bk.other_asset IS NULL THEN -1 ELSE 0 END) * (CASE WHEN bk.is_short THEN -1 ELSE 1 END) * t.size AS leg, (CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price) AS pnl FROM (SELECT d.* FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)) t JOIN bk ON bk.condition_id = t.condition_id LEFT JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id), hn AS (SELECT h.*, sum(h.leg) OVER (PARTITION BY h.condition_id ORDER BY h.ts, h.id) AS net_after FROM h), hp AS (SELECT condition_id, max(market_slug) AS his_slug, round(sum(pnl)::numeric, 2) AS his_pnl FROM h GROUP BY condition_id), pk AS (SELECT DISTINCT ON (condition_id) condition_id, ts AS peak_ts, id AS peak_id, net_after AS peak FROM hn WHERE net_after > 0 ORDER BY condition_id, net_after DESC, ts, id), hr AS (SELECT hn.id, hn.condition_id, hn.ts, hn.size, hn.eff_px, hn.net_after, hn.net_after <= 0.10 * pk.peak AS out, hn.leg < 0 AS reducing FROM hn JOIN pk ON pk.condition_id = hn.condition_id WHERE (hn.ts, hn.id) > (pk.peak_ts, pk.peak_id)), hx AS (SELECT DISTINCT ON (condition_id) condition_id, ts AS exit_ts, id AS exit_id FROM hr WHERE out ORDER BY condition_id, ts, id), hs AS (SELECT pk.condition_id, pk.peak, pk.peak_ts, hx.exit_ts, min(hr.net_after) AS trough, min(hr.ts) FILTER (WHERE hr.reducing) AS exit_from, sum(hr.size * hr.eff_px) FILTER (WHERE hr.reducing AND (hr.ts, hr.id) <= (hx.exit_ts, hx.exit_id)) / NULLIF(sum(hr.size) FILTER (WHERE hr.reducing AND (hr.ts, hr.id) <= (hx.exit_ts, hx.exit_id)), 0) AS exit_px, sum(hr.size * (CASE WHEN bk.is_short THEN 1 - hr.eff_px ELSE hr.eff_px END)) FILTER (WHERE hr.reducing AND (hr.ts, hr.id) <= (hx.exit_ts, hx.exit_id)) AS exit_usd FROM pk JOIN bk ON bk.condition_id = pk.condition_id LEFT JOIN hx ON hx.condition_id = pk.condition_id LEFT JOIN hr ON hr.condition_id = pk.condition_id GROUP BY pk.condition_id, pk.peak, pk.peak_ts, hx.exit_ts, hx.exit_id, bk.is_short), oo AS (SELECT o.id, b.condition_id, o.filled, o.avg_px, o.placed_at, (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN o.side = 'BUY_LONG' ELSE o.side = 'SELL_LONG' END) AS reducing FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND b.state = 'closed' AND b.closed_at >= now() - interval '24 hours'), op AS (SELECT condition_id, max(run) AS our_peak FROM (SELECT condition_id, sum(CASE WHEN reducing THEN -filled ELSE filled END) OVER (PARTITION BY condition_id ORDER BY placed_at, id) AS run FROM oo) x GROUP BY condition_id), ow AS (SELECT oo.*, (oo.reducing AND oo.placed_at >= hs.exit_from - interval '10 seconds') AS after_his FROM oo JOIN hs ON hs.condition_id = oo.condition_id), ox AS (SELECT condition_id, min(placed_at) FILTER (WHERE after_his) AS our_exit_ts, count(*) FILTER (WHERE after_his) AS our_exit_placed, sum(filled) FILTER (WHERE after_his) AS our_exit_filled, sum(avg_px * filled) FILTER (WHERE after_his AND filled > 0 AND avg_px IS NOT NULL) / NULLIF(sum(filled) FILTER (WHERE after_his AND filled > 0 AND avg_px IS NOT NULL), 0) AS our_exit_px FROM ow GROUP BY condition_id), pair AS (SELECT bk.book, left(COALESCE(hp.his_slug, bk.slugs), 30) AS market, CASE WHEN bk.is_short THEN 'short' ELSE 'long' END AS side, round(hs.peak::numeric, 0) AS his_peak, hs.exit_from::time(0) AS his_exit_from, hs.exit_ts::time(0) AS his_exit_ts, round(hs.exit_px::numeric, 3) AS his_exit_px, round(hs.exit_usd::numeric, 2) AS his_exit_usd, CASE WHEN hs.peak > 0 THEN round((1 - COALESCE(hs.trough, hs.peak) / hs.peak)::numeric, 2) END AS his_reduced_pct, hp.his_pnl, round(op.our_peak::numeric, 0) AS our_peak, ox.our_exit_ts::time(0) AS our_exit_ts, round(ox.our_exit_px::numeric, 3) AS our_exit_px, round((ox.our_exit_filled / NULLIF(op.our_peak, 0))::numeric, 2) AS our_exit_filled_pct, round(extract(epoch FROM (ox.our_exit_ts - hs.exit_from))::numeric, 0) AS lag_s, round(((CASE WHEN bk.is_short THEN ox.our_exit_px - hs.exit_px ELSE hs.exit_px - ox.our_exit_px END) * 100)::numeric, 1) AS cents_vs_his, (COALESCE(ox.our_exit_filled, 0) = 0 AND bk.settled_ok) AS held_to_settlement, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN COALESCE(op.our_peak, 0) <= 0 THEN 'no_position' WHEN hs.condition_id IS NULL THEN 'his_net_unseen' WHEN hs.exit_ts IS NULL AND (1 - COALESCE(hs.trough, hs.peak) / hs.peak) >= 0.25 AND abs(COALESCE(ox.our_exit_filled, 0) / NULLIF(op.our_peak, 0) - (1 - COALESCE(hs.trough, hs.peak) / hs.peak)) <= 0.05 THEN 'we_matched_his_cut' WHEN hs.exit_ts IS NULL AND (1 - COALESCE(hs.trough, hs.peak) / hs.peak) >= 0.25 AND COALESCE(ox.our_exit_filled, 0) / NULLIF(op.our_peak, 0) < 0.5 THEN 'he_reduced_we_held' WHEN hs.exit_ts IS NULL THEN 'no_exit_by_him' WHEN ox.our_exit_filled / NULLIF(op.our_peak, 0) >= 0.8 THEN 'exited_with_him' WHEN ox.our_exit_filled > 0 THEN 'partial_exit' WHEN ox.our_exit_placed > 0 THEN 'exit_placed_unfilled' ELSE 'no_exit_order' END AS verdict, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason FROM bk LEFT JOIN hp ON hp.condition_id = bk.condition_id LEFT JOIN hs ON hs.condition_id = bk.condition_id LEFT JOIN op ON op.condition_id = bk.condition_id LEFT JOIN ox ON ox.condition_id = bk.condition_id), v AS (SELECT pair.*, CASE WHEN verdict IN ('partial_exit', 'exit_placed_unfilled', 'no_exit_order', 'he_reduced_we_held') AND our_settled < 0 THEN -our_settled END AS stuck_after_his_exit_usd FROM pair) SELECT count(*) AS books, count(his_exit_ts) AS his_exits, count(*) FILTER (WHERE verdict = 'exited_with_him') AS with_him, count(*) FILTER (WHERE verdict = 'partial_exit') AS partial, count(*) FILTER (WHERE verdict = 'exit_placed_unfilled') AS unfilled, count(*) FILTER (WHERE verdict = 'no_exit_order') AS no_order, count(*) FILTER (WHERE verdict = 'no_exit_by_him') AS he_held, count(*) FILTER (WHERE verdict = 'he_reduced_we_held') AS reduced_we_held, round(sum(stuck_after_his_exit_usd) FILTER (WHERE verdict = 'he_reduced_we_held')::numeric, 2) AS reduced_we_held_stuck_usd, count(*) FILTER (WHERE verdict = 'we_matched_his_cut') AS matched_cut_n, count(*) FILTER (WHERE verdict IN ('no_position', 'his_net_unseen')) AS unmeasured, round(sum(stuck_after_his_exit_usd)::numeric, 2) AS stuck_usd, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lag_s) FILTER (WHERE verdict = 'exited_with_him')::numeric, 0) AS lag_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY lag_s) FILTER (WHERE verdict = 'exited_with_him')::numeric, 0) AS lag_p90_s, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY cents_vs_his)::numeric, 1) AS cents_vs_his_med FROM v;"; TO=60000 ;;
                # REST VS TAKE, BY DECISION AND BAND (FILL lane 0b item 1, 2026-09-08; brief
                # question 3: is the adverse selection at the rest?). Every entry order row of
                # the last 24 h on a LONG book (kind increase / take, side BUY_LONG) graded at
                # OUR price against the long token's resolved price: per (decision, band bucket)
                # with decision the 059 word that placed the row (rest / take; take_in_band once
                # the entry band lands; 'unrecorded' on a row older than 059) and band_c =
                # (ask_at_place - floor-cent of his_level) x 100 at placement (his cent rounded
                # in numeric before the floor, HIGH-3's lesson) bucketed <=0 / 1 / 2 / 3+ /
                # unread: n, filled_n, fill_pct, our_usd = sum(filled x wire), n_resolved (filled
                # rows on resolved markets), roi = sum(filled x (payoff - wire)) / sum(filled x
                # wire) over them, ci95 = 1.96 x stddev of the per-row roi / sqrt(n_resolved),
                # paid_med_c = the median of (wire - floor-cent of his_level) x 100 over the
                # filled rows (the cents paid over his cent: 0 today by construction, 1 and never
                # 2 once the band lands), send_ask_over_wire_med_c = the median of (ask_at_send
                # - wire) x 100 over IOC rows (the re-read's ask against the wire). ROLLUP rows
                # read ALL. The per-fill classes split by decision are fills-missed's third
                # statement, beside this in the hourly. Read-only.
                # FILL lane 8 (2026-09-09; h2225 1212: the rest row read 278 / 111 filled /
                # 140 replaced, one fill_pct over both). (a) THE SPLIT: a replaced rest prints
                # under its own word `rest_replaced` (the cause words fold to it, not to
                # 'rest'), so n / filled_n / fill_pct / roi read per side; `replaced_n` STAYS
                # on the `rest` row -- a window sum over the base word and bucket, so the rest
                # row and its rest_replaced sibling both read the bucket's replaced count and
                # ALL reads the total, as before. (b) A SECOND STATEMENT, the replaced entry
                # rows of 24 h (both intents: BUY_LONG on a long book, SELL_LONG on a short --
                # the exits-paired reducing clause's mirror image; kind increase / take) each
                # paired with the NEXT entry row of the SAME book (LEAD over PARTITION BY
                # book_id ORDER BY placed_at, id): touch_moved = the same his cent (floor-cent
                # of his_level, numeric-rounded) and a different wire (the bid stepped under a
                # standing his cent -- the rest chased it); same_quote = the same cent, wire
                # and qty (the clock's shape: 4731 / 4732 at 22:44Z, tick_2245 393-394);
                # qty_regrow = the same cent and wire, LEAD(qty) > qty with the growth under
                # 10 % of the leaves (qty - filled); other = his cent moved or a resize outside
                # that (816's 1,403 -> 752 after a 631.85 fill, h2225 872-882); unread = no
                # next row, or his_level / wire NULL on either side -- never a guess. Beside
                # them future_clock = decision 'replace_unread' AND done_at - placed_at < 45 s
                # AND filled = 0 (a proxy for the clock until the row can say more; it
                # overlaps the pair words), and the replaced rows' done_at - placed_at median.
                # By side (long / short, from b.intent) and hour, ROLLUP (side, hour): the
                # side's ALL row is the long-book touch_moved share lane 12 is gated on. Rows
                # bounded at 2 x 24 + 3 in the hourly. Read-only.
                take-band) SQL="WITH e AS (SELECT o.id, CASE WHEN o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') THEN 'rest_replaced' ELSE COALESCE(o.decision, 'unrecorded') END AS decision, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, o.filled, o.wire, o.qty, o.tif, o.ask_at_send, CASE WHEN o.his_level IS NULL OR o.ask_at_place IS NULL THEN NULL ELSE round(((o.ask_at_place::numeric - floor(round((o.his_level * 100)::numeric, 6)) / 100) * 100)::numeric, 0) END AS band_c, CASE WHEN o.his_level IS NULL THEN NULL ELSE round(((o.wire::numeric - floor(round((o.his_level * 100)::numeric, 6)) / 100) * 100)::numeric, 1) END AS paid_c, CASE WHEN m.resolved_prices IS NULL OR mt.outcome_index IS NULL THEN NULL ELSE (m.resolved_prices->>mt.outcome_index)::numeric END AS payoff FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id LEFT JOIN market_tokens mt ON mt.token_id = b.long_asset LEFT JOIN markets m ON m.condition_id = b.condition_id WHERE b.whale = 'rn1' AND b.intent = 'ORDER_INTENT_BUY_LONG' AND o.side = 'BUY_LONG' AND o.kind IN ('increase', 'take') AND o.placed_at >= now() - interval '24 hours'), x AS (SELECT e.*, CASE WHEN band_c IS NULL THEN 'unread' WHEN band_c <= 0 THEN '<=0' WHEN band_c = 1 THEN '1' WHEN band_c = 2 THEN '2' ELSE '3+' END AS bucket FROM e) SELECT COALESCE(decision, 'ALL') AS decision, COALESCE(bucket, 'ALL') AS bucket, count(*) AS n, count(*) FILTER (WHERE filled > 0) AS filled_n, sum(count(*) FILTER (WHERE replaced)) OVER (PARTITION BY regexp_replace(decision, '_replaced$', ''), bucket) AS replaced_n, round(100.0 * count(*) FILTER (WHERE filled > 0) / count(*), 1) AS fill_pct, round(sum(filled * wire)::numeric, 2) AS our_usd, count(*) FILTER (WHERE filled > 0 AND payoff IS NOT NULL) AS n_resolved, round((sum(filled * (payoff - wire)) FILTER (WHERE filled > 0 AND payoff IS NOT NULL) / NULLIF(sum(filled * wire) FILTER (WHERE filled > 0 AND payoff IS NOT NULL), 0))::numeric, 4) AS roi, round((1.96 * stddev_samp((payoff - wire) / NULLIF(wire, 0)) FILTER (WHERE filled > 0 AND payoff IS NOT NULL) / sqrt(NULLIF(count(*) FILTER (WHERE filled > 0 AND payoff IS NOT NULL), 0)))::numeric, 4) AS ci95, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY paid_c) FILTER (WHERE filled > 0)::numeric, 1) AS paid_med_c, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY (ask_at_send - wire) * 100) FILTER (WHERE tif = 'IOC' AND ask_at_send IS NOT NULL)::numeric, 1) AS send_ask_over_wire_med_c FROM x GROUP BY ROLLUP (decision, bucket) ORDER BY 1, 2; WITH e AS (SELECT o.id, o.book_id, CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 'short' ELSE 'long' END AS side, o.decision, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, o.qty, o.filled, o.placed_at, o.done_at, CASE WHEN o.his_level IS NULL THEN NULL ELSE floor(round((o.his_level * 100)::numeric, 6)) END AS his_cent, round(o.wire::numeric, 4) AS wire_c FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.kind IN ('increase', 'take') AND (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN o.side = 'SELL_LONG' ELSE o.side = 'BUY_LONG' END) AND o.placed_at >= now() - interval '24 hours'), n AS (SELECT e.*, LEAD(his_cent) OVER w AS nx_cent, LEAD(wire_c) OVER w AS nx_wire, LEAD(qty) OVER w AS nx_qty, LEAD(placed_at) OVER w AS nx_placed FROM e WINDOW w AS (PARTITION BY book_id ORDER BY placed_at, id)), z AS (SELECT side, date_trunc('hour', placed_at)::time(0) AS hour, CASE WHEN nx_placed IS NULL OR his_cent IS NULL OR nx_cent IS NULL OR wire_c IS NULL OR nx_wire IS NULL THEN 'unread' WHEN his_cent = nx_cent AND wire_c <> nx_wire THEN 'touch_moved' WHEN his_cent = nx_cent AND wire_c = nx_wire AND nx_qty = qty THEN 'same_quote' WHEN his_cent = nx_cent AND wire_c = nx_wire AND nx_qty > qty AND (nx_qty - qty) < 0.10 * greatest(qty - filled, 0) THEN 'qty_regrow' ELSE 'other' END AS pair, (decision = 'replace_unread' AND done_at - placed_at < interval '45 seconds' AND filled = 0) AS future_clock, extract(epoch FROM (done_at - placed_at)) AS done_s FROM n WHERE replaced) SELECT COALESCE(side, 'ALL') AS side, COALESCE(hour::text, 'ALL') AS hour, count(*) AS replaced, count(*) FILTER (WHERE pair = 'touch_moved') AS touch_moved, count(*) FILTER (WHERE pair = 'same_quote') AS same_quote, count(*) FILTER (WHERE future_clock) AS future_clock, count(*) FILTER (WHERE pair = 'qty_regrow') AS qty_regrow, count(*) FILTER (WHERE pair = 'other') AS other, count(*) FILTER (WHERE pair = 'unread') AS unread, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY done_s)::numeric, 0) AS done_med_s FROM z GROUP BY ROLLUP (side, hour) ORDER BY 1, 2 DESC;"; TO=60000 ;;
                # THE EXIT BAND (FILL lane 0b item 2, 2026-09-08; R5's unread A8: was the bid
                # within 1c or 2c of his price at the held exit ticks?). Every REDUCING order
                # row of the last 24 h (the exits-paired clause: BUY_LONG on a BUY_SHORT book,
                # SELL_LONG on a long) whose 059 decision is exit_rest / take / cover (and
                # exit_take_in_band / cover_in_band once lane 3 lands), with band_c = (his_level
                # - bid_at_place) x 100 on a SELL_LONG and (ask_at_place - his_level) x 100 on a
                # cover -- how many cents past his price the touch sat when the row went out --
                # bucketed <=0 / 1 / 2 / 3-5 / >5 / unread. 1: per (decision, bucket) n,
                # filled_any, filled_whole, shares_unfilled = sum(qty - filled), usd_unfilled =
                # that at his_level, done_med_s = the median seconds from placed_at to done_at;
                # 2: per (decision, bucket) the BOOKS whose rows in it filled anything against
                # the books whose rows never did, with mirror_books.settled_pnl summed on each
                # side (settled_when_filled / settled_when_unfilled: the fill-when-right read on
                # the exit side). ROLLUP rows read ALL. The row records the re-read's ask only
                # (059 ask_at_send); a SELL IOC's send-time bid lives on the plan. Read-only.
                # FILL lane 8 (2026-09-09). (a) THE SPLIT, as take-band's: a replaced exit
                # rest prints under `exit_rest_replaced` (a short book's under
                # `cover_replaced`), never a cause word of its own; `replaced_n` stays on the
                # exit_rest / cover row through the same window sum (the rest row and its
                # replaced sibling both read the bucket's replaced count). Both statements.
                # (b) THE PER-IOC SAME-TICK REST LINE lane 0b promised (docs section 46's
                # live proof; not in exitsband_2304): a THIRD statement over every exit IOC
                # of 24 h on a LONG book (SELL_LONG, tif IOC, whatever its word) by how it
                # filled -- whole / partial / zero -- and, for each, the exit_rest row on the
                # SAME book placed within 15 s after it (its decision 'exit_rest', or a cause
                # word once a replace overwrote it -- the HIGH-1 lesson; a row with no word is
                # not counted): iocs, ioc_shares, ioc_filled_sh, rested_15s, rest_filled_any,
                # rest_shares, rest_filled_sh, rest_lag_med_s, with ALL. Before lane 1 that
                # count was 0 by construction; it is the one read that prices lane 1's
                # $246.20 bound. Read-only.
                exits-band) SQL="WITH x AS (SELECT o.id, o.book_id, CASE WHEN o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') THEN CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 'cover_replaced' ELSE 'exit_rest_replaced' END ELSE o.decision END AS decision, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, o.side, o.qty, o.filled, o.his_level, o.placed_at, o.done_at, b.settled_pnl, CASE WHEN o.his_level IS NULL THEN NULL WHEN o.side = 'SELL_LONG' AND o.bid_at_place IS NOT NULL THEN round(((o.his_level - o.bid_at_place) * 100)::numeric, 0) WHEN o.side = 'BUY_LONG' AND o.ask_at_place IS NOT NULL THEN round(((o.ask_at_place - o.his_level) * 100)::numeric, 0) END AS band_c FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.placed_at >= now() - interval '24 hours' AND (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN o.side = 'BUY_LONG' ELSE o.side = 'SELL_LONG' END) AND o.decision IN ('exit_rest', 'take', 'cover', 'exit_take_in_band', 'cover_in_band', 'replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread')), y AS (SELECT x.*, CASE WHEN band_c IS NULL THEN 'unread' WHEN band_c <= 0 THEN '<=0' WHEN band_c = 1 THEN '1' WHEN band_c = 2 THEN '2' WHEN band_c <= 5 THEN '3-5' ELSE '>5' END AS bucket, extract(epoch FROM (done_at - placed_at)) AS done_s FROM x) SELECT COALESCE(decision, 'ALL') AS decision, COALESCE(bucket, 'ALL') AS bucket, count(*) AS n, count(*) FILTER (WHERE filled > 0) AS filled_any, count(*) FILTER (WHERE filled >= qty) AS filled_whole, sum(count(*) FILTER (WHERE replaced)) OVER (PARTITION BY regexp_replace(decision, '_replaced$', ''), bucket) AS replaced_n, round(sum(greatest(qty - filled, 0))::numeric, 1) AS shares_unfilled, round(sum(greatest(qty - filled, 0) * his_level)::numeric, 2) AS usd_unfilled, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY done_s)::numeric, 0) AS done_med_s FROM y GROUP BY ROLLUP (decision, bucket) ORDER BY 1, 2; WITH x AS (SELECT o.id, o.book_id, CASE WHEN o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') THEN CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 'cover_replaced' ELSE 'exit_rest_replaced' END ELSE o.decision END AS decision, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, o.side, o.qty, o.filled, o.his_level, o.placed_at, o.done_at, b.settled_pnl, CASE WHEN o.his_level IS NULL THEN NULL WHEN o.side = 'SELL_LONG' AND o.bid_at_place IS NOT NULL THEN round(((o.his_level - o.bid_at_place) * 100)::numeric, 0) WHEN o.side = 'BUY_LONG' AND o.ask_at_place IS NOT NULL THEN round(((o.ask_at_place - o.his_level) * 100)::numeric, 0) END AS band_c FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.placed_at >= now() - interval '24 hours' AND (CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN o.side = 'BUY_LONG' ELSE o.side = 'SELL_LONG' END) AND o.decision IN ('exit_rest', 'take', 'cover', 'exit_take_in_band', 'cover_in_band', 'replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread')), y AS (SELECT x.*, CASE WHEN band_c IS NULL THEN 'unread' WHEN band_c <= 0 THEN '<=0' WHEN band_c = 1 THEN '1' WHEN band_c = 2 THEN '2' WHEN band_c <= 5 THEN '3-5' ELSE '>5' END AS bucket, extract(epoch FROM (done_at - placed_at)) AS done_s FROM x), bb AS (SELECT book_id, decision, bucket, bool_or(filled > 0) AS any_filled, max(settled_pnl) AS settled FROM y GROUP BY 1, 2, 3) SELECT COALESCE(decision, 'ALL') AS decision, COALESCE(bucket, 'ALL') AS bucket, count(*) AS books, count(*) FILTER (WHERE any_filled) AS books_filled, round(sum(settled) FILTER (WHERE any_filled)::numeric, 2) AS settled_when_filled, count(*) FILTER (WHERE NOT any_filled) AS books_unfilled, round(sum(settled) FILTER (WHERE NOT any_filled)::numeric, 2) AS settled_when_unfilled FROM bb GROUP BY ROLLUP (decision, bucket) ORDER BY 1, 2; WITH i AS (SELECT o.id, o.book_id, o.qty, o.filled, o.placed_at, CASE WHEN o.filled >= o.qty THEN 'whole' WHEN o.filled > 0 THEN 'partial' ELSE 'zero' END AS ioc_fill FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND b.intent = 'ORDER_INTENT_BUY_LONG' AND o.side = 'SELL_LONG' AND o.tif = 'IOC' AND o.placed_at >= now() - interval '24 hours'), r AS (SELECT i.*, x.id AS rest_id, x.qty AS rest_qty, x.filled AS rest_filled, extract(epoch FROM (x.placed_at - i.placed_at)) AS rest_lag_s FROM i LEFT JOIN LATERAL (SELECT o.id, o.qty, o.filled, o.placed_at FROM mirror_orders o WHERE o.book_id = i.book_id AND o.side = 'SELL_LONG' AND o.tif <> 'IOC' AND o.decision IN ('exit_rest', 'replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AND o.placed_at > i.placed_at AND o.placed_at <= i.placed_at + interval '15 seconds' ORDER BY o.placed_at, o.id LIMIT 1) x ON true) SELECT COALESCE(ioc_fill, 'ALL') AS ioc_fill, count(*) AS iocs, round(sum(qty)::numeric, 1) AS ioc_shares, round(sum(filled)::numeric, 1) AS ioc_filled_sh, count(rest_id) AS rested_15s, count(*) FILTER (WHERE rest_filled > 0) AS rest_filled_any, round(sum(rest_qty)::numeric, 1) AS rest_shares, round(sum(rest_filled)::numeric, 1) AS rest_filled_sh, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY rest_lag_s)::numeric, 1) AS rest_lag_med_s FROM r GROUP BY ROLLUP (ioc_fill) ORDER BY 1;"; TO=60000 ;;
                # CLOSED WHILE HE TRADED (FILL lane 0b item 5, 2026-09-08; R4's $73,475.58 on
                # books 309 / 338 / 630, whose closes were sign flips -- post_booksnew_1707 385,
                # verify_1750 359). Per book closed in the last 24 h by the MIRROR'S OWN close
                # (the plan's close reads cashed_out / cancelled, or last_reason reads
                # closed_cashed_out / closed_cancelled -- the plan write of the same tick can
                # overwrite last_reason with the plan's reason, so both are read; never the
                # settle's `closed: standing row *` nor venue_market_ended): opened / closed,
                # last_plan close / sign_flip / turn / reopen_refused (the last two written by
                # lane 5, NULL before it), his net at the close (last_plan net), his fills AFTER
                # closed_at on the condition (48 h rows collapsed chain-first: n, usd, shares,
                # his P&L on them at his price where the market resolved, his last fill), his
                # net now on the book's axis (long minus other over the 48 h rows), the next
                # book on the condition (id, opened, lag_s, state, settled), and the reopen path
                # after the close from mirror_candidate_refusals (refusals, the first name,
                # name@HH:MM ... left 200). Then the totals (books, with_later_fills, later_usd,
                # later_sh, later_pnl_at_his_px, reopened_n, refused_only_n, no_verdict_n,
                # sign_flips) and the books by FIRST refusal name. Read-only, LIMITed.
                closed-while-he-traded) SQL="WITH cb AS (SELECT b.id AS book, b.condition_id, left(b.us_market_slug, 36) AS slug, b.intent, b.long_asset, b.other_asset, b.opened_at, b.closed_at, b.last_plan->>'close' AS close, b.last_plan->'sign_flip' AS sign_flip, b.last_plan->'turn' AS turn, b.last_plan->'reopen_refused' AS reopen_refused, (b.last_plan->>'net')::float8 AS his_net_at_close, b.last_reason FROM mirror_books b WHERE b.whale = 'rn1' AND b.state = 'closed' AND b.closed_at >= now() - interval '24 hours' AND (b.last_reason IN ('closed_cashed_out', 'closed_cancelled') OR b.last_plan->>'close' IN ('cashed_out', 'cancelled'))), r AS (SELECT d.id, d.condition_id, d.ts, upper(d.side) AS side, d.asset, d.size, d.price FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours' AND t.condition_id IN (SELECT condition_id FROM cb)) d WHERE d.source IN ('chain', 's1') OR NOT d.has_net), lf AS (SELECT cb.book, count(*) AS later_n, round(sum(r.size * r.price)::numeric, 2) AS later_usd, round(sum(r.size)::numeric, 1) AS later_sh, round(sum(CASE WHEN m.resolved_prices IS NULL OR mt.outcome_index IS NULL THEN NULL ELSE (CASE WHEN r.side = 'BUY' THEN 1 ELSE -1 END) * r.size * ((m.resolved_prices->>mt.outcome_index)::numeric - r.price) END)::numeric, 2) AS later_pnl, max(r.ts) AS his_last FROM cb JOIN r ON r.condition_id = cb.condition_id AND r.ts > cb.closed_at LEFT JOIN market_tokens mt ON mt.token_id = r.asset LEFT JOIN markets m ON m.condition_id = r.condition_id GROUP BY cb.book), nn AS (SELECT cb.book, round(sum((CASE WHEN r.side = 'BUY' THEN 1 ELSE -1 END) * r.size * (CASE WHEN r.asset = cb.long_asset THEN 1 WHEN r.asset = cb.other_asset THEN -1 ELSE 0 END))::numeric, 1) AS his_net_now FROM cb JOIN r ON r.condition_id = cb.condition_id GROUP BY cb.book), nb AS (SELECT cb.book, n.id AS next_book, n.opened_at AS next_opened, n.state AS next_state, n.settled_pnl AS next_settled FROM cb LEFT JOIN LATERAL (SELECT b2.id, b2.opened_at, b2.state, b2.settled_pnl FROM mirror_books b2 WHERE b2.whale = 'rn1' AND b2.condition_id = cb.condition_id AND b2.opened_at > cb.closed_at ORDER BY b2.opened_at LIMIT 1) n ON true), rp AS (SELECT cb.book, count(x.at) AS refusals, (array_agg(x.refusal ORDER BY x.at))[1] AS first_refusal, left(string_agg(x.refusal || '@' || to_char(x.at, 'HH24:MI'), ' ' ORDER BY x.at), 200) AS path FROM cb LEFT JOIN mirror_candidate_refusals x ON x.whale = 'rn1' AND x.condition_id = cb.condition_id AND x.at > cb.closed_at GROUP BY cb.book), v AS (SELECT cb.book, cb.slug, cb.intent, cb.opened_at, cb.closed_at, cb.close, cb.sign_flip, cb.turn, cb.his_net_at_close, COALESCE(lf.later_n, 0) AS later_n, lf.later_usd, lf.later_sh, lf.later_pnl, lf.his_last, nn.his_net_now, nb.next_book, nb.next_opened, nb.next_state, nb.next_settled, rp.refusals, rp.first_refusal, rp.path, cb.reopen_refused, cb.last_reason FROM cb LEFT JOIN lf ON lf.book = cb.book LEFT JOIN nn ON nn.book = cb.book LEFT JOIN nb ON nb.book = cb.book LEFT JOIN rp ON rp.book = cb.book) SELECT book, slug, intent, opened_at::time(0) AS opened, closed_at::time(0) AS closed, close, sign_flip, turn, round(his_net_at_close::numeric, 1) AS his_net_at_close, later_n, later_usd, later_sh, later_pnl, his_last::time(0) AS his_last, his_net_now, next_book, next_opened::time(0) AS next_opened, round(extract(epoch FROM (next_opened - closed_at))::numeric, 0) AS reopen_lag_s, next_state, next_settled, refusals, first_refusal, path, left(reopen_refused::text, 80) AS reopen_refused, last_reason FROM v ORDER BY later_usd DESC NULLS LAST, book LIMIT 60; WITH cb AS (SELECT b.id AS book, b.condition_id, left(b.us_market_slug, 36) AS slug, b.intent, b.long_asset, b.other_asset, b.opened_at, b.closed_at, b.last_plan->>'close' AS close, b.last_plan->'sign_flip' AS sign_flip, b.last_plan->'turn' AS turn, b.last_plan->'reopen_refused' AS reopen_refused, (b.last_plan->>'net')::float8 AS his_net_at_close, b.last_reason FROM mirror_books b WHERE b.whale = 'rn1' AND b.state = 'closed' AND b.closed_at >= now() - interval '24 hours' AND (b.last_reason IN ('closed_cashed_out', 'closed_cancelled') OR b.last_plan->>'close' IN ('cashed_out', 'cancelled'))), r AS (SELECT d.id, d.condition_id, d.ts, upper(d.side) AS side, d.asset, d.size, d.price FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours' AND t.condition_id IN (SELECT condition_id FROM cb)) d WHERE d.source IN ('chain', 's1') OR NOT d.has_net), lf AS (SELECT cb.book, count(*) AS later_n, round(sum(r.size * r.price)::numeric, 2) AS later_usd, round(sum(r.size)::numeric, 1) AS later_sh, round(sum(CASE WHEN m.resolved_prices IS NULL OR mt.outcome_index IS NULL THEN NULL ELSE (CASE WHEN r.side = 'BUY' THEN 1 ELSE -1 END) * r.size * ((m.resolved_prices->>mt.outcome_index)::numeric - r.price) END)::numeric, 2) AS later_pnl, max(r.ts) AS his_last FROM cb JOIN r ON r.condition_id = cb.condition_id AND r.ts > cb.closed_at LEFT JOIN market_tokens mt ON mt.token_id = r.asset LEFT JOIN markets m ON m.condition_id = r.condition_id GROUP BY cb.book), nn AS (SELECT cb.book, round(sum((CASE WHEN r.side = 'BUY' THEN 1 ELSE -1 END) * r.size * (CASE WHEN r.asset = cb.long_asset THEN 1 WHEN r.asset = cb.other_asset THEN -1 ELSE 0 END))::numeric, 1) AS his_net_now FROM cb JOIN r ON r.condition_id = cb.condition_id GROUP BY cb.book), nb AS (SELECT cb.book, n.id AS next_book, n.opened_at AS next_opened, n.state AS next_state, n.settled_pnl AS next_settled FROM cb LEFT JOIN LATERAL (SELECT b2.id, b2.opened_at, b2.state, b2.settled_pnl FROM mirror_books b2 WHERE b2.whale = 'rn1' AND b2.condition_id = cb.condition_id AND b2.opened_at > cb.closed_at ORDER BY b2.opened_at LIMIT 1) n ON true), rp AS (SELECT cb.book, count(x.at) AS refusals, (array_agg(x.refusal ORDER BY x.at))[1] AS first_refusal, left(string_agg(x.refusal || '@' || to_char(x.at, 'HH24:MI'), ' ' ORDER BY x.at), 200) AS path FROM cb LEFT JOIN mirror_candidate_refusals x ON x.whale = 'rn1' AND x.condition_id = cb.condition_id AND x.at > cb.closed_at GROUP BY cb.book), v AS (SELECT cb.book, cb.slug, cb.intent, cb.opened_at, cb.closed_at, cb.close, cb.sign_flip, cb.turn, cb.his_net_at_close, COALESCE(lf.later_n, 0) AS later_n, lf.later_usd, lf.later_sh, lf.later_pnl, lf.his_last, nn.his_net_now, nb.next_book, nb.next_opened, nb.next_state, nb.next_settled, rp.refusals, rp.first_refusal, rp.path, cb.reopen_refused, cb.last_reason FROM cb LEFT JOIN lf ON lf.book = cb.book LEFT JOIN nn ON nn.book = cb.book LEFT JOIN nb ON nb.book = cb.book LEFT JOIN rp ON rp.book = cb.book) SELECT count(*) AS books, count(*) FILTER (WHERE later_n > 0) AS with_later_fills, round(sum(later_usd)::numeric, 2) AS later_usd, round(sum(later_sh)::numeric, 1) AS later_sh, round(sum(later_pnl)::numeric, 2) AS later_pnl_at_his_px, count(next_book) AS reopened_n, count(*) FILTER (WHERE next_book IS NULL AND refusals > 0) AS refused_only_n, count(*) FILTER (WHERE next_book IS NULL AND COALESCE(refusals, 0) = 0) AS no_verdict_n, count(*) FILTER (WHERE sign_flip = 'true'::jsonb) AS sign_flips FROM v; WITH cb AS (SELECT b.id AS book, b.condition_id, left(b.us_market_slug, 36) AS slug, b.intent, b.long_asset, b.other_asset, b.opened_at, b.closed_at, b.last_plan->>'close' AS close, b.last_plan->'sign_flip' AS sign_flip, b.last_plan->'turn' AS turn, b.last_plan->'reopen_refused' AS reopen_refused, (b.last_plan->>'net')::float8 AS his_net_at_close, b.last_reason FROM mirror_books b WHERE b.whale = 'rn1' AND b.state = 'closed' AND b.closed_at >= now() - interval '24 hours' AND (b.last_reason IN ('closed_cashed_out', 'closed_cancelled') OR b.last_plan->>'close' IN ('cashed_out', 'cancelled'))), r AS (SELECT d.id, d.condition_id, d.ts, upper(d.side) AS side, d.asset, d.size, d.price FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours' AND t.condition_id IN (SELECT condition_id FROM cb)) d WHERE d.source IN ('chain', 's1') OR NOT d.has_net), lf AS (SELECT cb.book, count(*) AS later_n, round(sum(r.size * r.price)::numeric, 2) AS later_usd, round(sum(r.size)::numeric, 1) AS later_sh, round(sum(CASE WHEN m.resolved_prices IS NULL OR mt.outcome_index IS NULL THEN NULL ELSE (CASE WHEN r.side = 'BUY' THEN 1 ELSE -1 END) * r.size * ((m.resolved_prices->>mt.outcome_index)::numeric - r.price) END)::numeric, 2) AS later_pnl, max(r.ts) AS his_last FROM cb JOIN r ON r.condition_id = cb.condition_id AND r.ts > cb.closed_at LEFT JOIN market_tokens mt ON mt.token_id = r.asset LEFT JOIN markets m ON m.condition_id = r.condition_id GROUP BY cb.book), nn AS (SELECT cb.book, round(sum((CASE WHEN r.side = 'BUY' THEN 1 ELSE -1 END) * r.size * (CASE WHEN r.asset = cb.long_asset THEN 1 WHEN r.asset = cb.other_asset THEN -1 ELSE 0 END))::numeric, 1) AS his_net_now FROM cb JOIN r ON r.condition_id = cb.condition_id GROUP BY cb.book), nb AS (SELECT cb.book, n.id AS next_book, n.opened_at AS next_opened, n.state AS next_state, n.settled_pnl AS next_settled FROM cb LEFT JOIN LATERAL (SELECT b2.id, b2.opened_at, b2.state, b2.settled_pnl FROM mirror_books b2 WHERE b2.whale = 'rn1' AND b2.condition_id = cb.condition_id AND b2.opened_at > cb.closed_at ORDER BY b2.opened_at LIMIT 1) n ON true), rp AS (SELECT cb.book, count(x.at) AS refusals, (array_agg(x.refusal ORDER BY x.at))[1] AS first_refusal, left(string_agg(x.refusal || '@' || to_char(x.at, 'HH24:MI'), ' ' ORDER BY x.at), 200) AS path FROM cb LEFT JOIN mirror_candidate_refusals x ON x.whale = 'rn1' AND x.condition_id = cb.condition_id AND x.at > cb.closed_at GROUP BY cb.book), v AS (SELECT cb.book, cb.slug, cb.intent, cb.opened_at, cb.closed_at, cb.close, cb.sign_flip, cb.turn, cb.his_net_at_close, COALESCE(lf.later_n, 0) AS later_n, lf.later_usd, lf.later_sh, lf.later_pnl, lf.his_last, nn.his_net_now, nb.next_book, nb.next_opened, nb.next_state, nb.next_settled, rp.refusals, rp.first_refusal, rp.path, cb.reopen_refused, cb.last_reason FROM cb LEFT JOIN lf ON lf.book = cb.book LEFT JOIN nn ON nn.book = cb.book LEFT JOIN nb ON nb.book = cb.book LEFT JOIN rp ON rp.book = cb.book) SELECT COALESCE(first_refusal, 'none') AS first_refusal, count(*) AS books, count(*) FILTER (WHERE later_n > 0) AS with_later_fills, round(sum(later_usd)::numeric, 2) AS later_usd, count(next_book) AS reopened_n FROM v GROUP BY 1 ORDER BY 4 DESC NULLS LAST, 1;"; TO=60000 ;;
                # THE PER-FILL RECORD'S HEALTH LINE (FILL lane 4, 2026-09-08; migration 060,
                # mirror_fill_answers: one durable row per fill of his the mirror held, the name
                # the tick gave it and the order it placed, written once, never lost to the plan
                # list's 20-entry bound or the book's close). Per market with a book: the newest
                # book (id, slug, state), his fills held in 24 h (chain/s1 collapsed as fills-missed
                # reads them), the rows written in 24 h, how many carry an order, the names (name=n,
                # left 120), the oldest fill written vs the oldest the plan's list still keeps and
                # the plan's fills_hwm; then the table's totals. Dispatched with service
                # sportsassets-db. Against a database without the table it fails by name (this
                # preset IS the table's measurement; fills-missed's own read is guarded so the
                # hourly survives). Read-only, LIMITed.
                fill-answers) SQL="WITH w AS (SELECT condition_id, name, count(*) AS n, count(order_id) AS with_order, min(fill_ts) AS oldest, max(fill_ts) AS newest FROM mirror_fill_answers WHERE whale = 'rn1' AND at >= extract(epoch FROM now() - interval '24 hours') GROUP BY 1, 2), a AS (SELECT condition_id, sum(n) AS written, sum(with_order) AS with_order, min(oldest) AS oldest_written, max(newest) AS newest_written, string_agg(name || '=' || n, ' ' ORDER BY n DESC, name) AS names FROM w GROUP BY 1), h AS (SELECT d.condition_id, count(*) AS held, min(d.ts) AS oldest_fill FROM (SELECT t.id, t.condition_id, t.ts, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales wh ON wh.id = t.whale_id WHERE lower(wh.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')) d WHERE (d.net_leg OR NOT d.has_net) GROUP BY 1), b AS (SELECT DISTINCT ON (condition_id) condition_id, id AS book, left(us_market_slug, 36) AS slug, state, (SELECT min((e->>'ts')::float8) FROM jsonb_array_elements(CASE WHEN jsonb_typeof(last_plan->'his_fills_seen') = 'array' THEN last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE NOT ((e->>'ts') ~ '[^0-9.]')) AS plan_oldest_kept, CASE WHEN NOT ((last_plan->>'fills_hwm') ~ '[^0-9.]') THEN (last_plan->>'fills_hwm')::float8 END AS fills_hwm FROM mirror_books WHERE whale = 'rn1' ORDER BY condition_id, id DESC) SELECT b.book, b.slug, b.state, COALESCE(h.held, 0) AS held_24h, COALESCE(a.written, 0) AS written, COALESCE(a.with_order, 0) AS with_order, left(a.names, 120) AS names, to_timestamp(a.oldest_written)::time(0) AS oldest_written, to_timestamp(b.plan_oldest_kept)::time(0) AS plan_oldest_kept, to_timestamp(b.fills_hwm)::time(0) AS fills_hwm FROM b LEFT JOIN h ON h.condition_id = b.condition_id LEFT JOIN a ON a.condition_id = b.condition_id WHERE COALESCE(h.held, 0) > 0 OR COALESCE(a.written, 0) > 0 ORDER BY 4 DESC, 1 DESC LIMIT 60; SELECT count(*) AS rows_24h, count(DISTINCT condition_id) AS markets, count(order_id) AS with_order, count(DISTINCT name) AS names, to_timestamp(min(at))::time(0) AS first_at, to_timestamp(max(at))::time(0) AS last_at FROM mirror_fill_answers WHERE whale = 'rn1' AND at >= extract(epoch FROM now() - interval '24 hours');"; TO=60000 ;;
                # THE HOURLY, IN ONE RUN (2026-09-08; eight since lane M, nine since FILL lane 0b's
                # take-band): the read-only presets the
                # hourly status reads -- mirror-tick, mirror-pnl, paired-day, paired-ratio (lane M),
                # latency-census, fills-answered, fills-missed, take-band (FILL lane 0b, beside
                # fills-missed so the rest-vs-take read rides the first hourly after the deploy),
                # on-target-why (lane M) -- run one after the other in ONE job, each under a
                # '== name' section marker, so the hour's numbers come from one log instead
                # of nine dispatches. The text below is the nine presets' own SQL joined;
                # test_render_ops_hourly pins that it equals them, so a preset edit that
                # forgets this line fails there. Still nine since FILL lane 8 (2026-09-09):
                # fills-missed's (class, decision) WHERE word carries missed_replace here as
                # in the standalone case, and take-band carries its two statements (the
                # replaced-rows pairs table is bounded at 2 x 24 + 3 rows). Read-only, LIMITed.
                hourly) SQL="SELECT '== mirror-tick' AS section; SELECT h.service AS what, e.key, left(e.value::text, 2400) AS value FROM service_heartbeats h, jsonb_each(h.detail) e WHERE h.service IN ('mirror_live','mirror_shadow') UNION ALL SELECT h.service, 'zz beat_at', h.beat_at::text || ' ' || h.status FROM service_heartbeats h WHERE h.service IN ('mirror_live','mirror_shadow') UNION ALL SELECT 'zz book', b.us_market_slug, 'state=' || b.state || ' whale=' || b.whale || ' opened=' || b.opened_at::text || ' ' || left((to_jsonb(b) - 'us_market_slug' - 'state' - 'whale' - 'opened_at' - 'condition_id' - 'long_asset' - 'other_asset')::text, 260) FROM mirror_books b WHERE b.state <> 'closed' UNION ALL SELECT 'zz order', o.placed_at::text, left((to_jsonb(o) - 'placed_at' - 'receipt')::text, 280) FROM (SELECT * FROM mirror_orders ORDER BY placed_at DESC NULLS LAST LIMIT 8) o ORDER BY 1, 2; SELECT '== mirror-pnl' AS section; SELECT b.id, b.us_market_slug AS slug, b.state, b.intent, b.ratio, b.ledger_net AS held, round(b.avg_cost::numeric, 4) AS avg_cost, round((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN abs(b.ledger_net) * (1 - COALESCE(b.avg_cost, 1)) ELSE b.ledger_net * COALESCE(b.avg_cost, 0) END)::numeric, 2) AS open_cost, round(b.realized_pnl::numeric, 2) AS realized, round(b.settled_pnl::numeric, 2) AS settled, round(b.own_book_pnl::numeric, 2) AS own_book, b.opened_at::time(0) AS opened, b.closed_at::time(0) AS closed FROM mirror_books b WHERE b.opened_at >= date_trunc('day', now()) OR b.closed_at >= date_trunc('day', now()) OR b.state <> 'closed' ORDER BY b.id; SELECT 'today' AS what, count(*) AS books, round(sum(realized_pnl)::numeric, 2) AS realized, round(sum(settled_pnl)::numeric, 2) AS settled, round(sum(CASE WHEN state = 'closed' AND settled_pnl IS NOT NULL THEN settled_pnl ELSE realized_pnl END)::numeric, 2) AS day_pnl, round(sum(CASE WHEN state <> 'closed' THEN (CASE WHEN intent = 'ORDER_INTENT_BUY_SHORT' THEN abs(ledger_net) * (1 - COALESCE(avg_cost, 1)) ELSE ledger_net * COALESCE(avg_cost, 0) END) ELSE 0 END)::numeric, 2) AS open_cost, round(sum(peak_exposure_usd)::numeric, 2) AS peak_stake FROM mirror_books WHERE opened_at >= date_trunc('day', now()) OR closed_at >= date_trunc('day', now()) OR state <> 'closed'; SELECT 'fills today' AS what, count(*) AS n, round(sum(CASE WHEN side LIKE 'BUY%' THEN cash_usd ELSE 0 END)::numeric, 2) AS bought_usd, round(sum(CASE WHEN side LIKE 'SELL%' THEN cash_usd ELSE 0 END)::numeric, 2) AS sold_usd, round(sum(realized)::numeric, 2) AS realized FROM mirror_orders WHERE filled > 0 AND placed_at >= date_trunc('day', now()); SELECT '== paired-day' AS section; WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, round((sum(b.avg_cost * abs(b.ledger_net)) / NULLIF(sum(abs(b.ledger_net)), 0))::numeric, 4) AS our_avg FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)) t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND m.resolved_prices IS NOT NULL GROUP BY t.condition_id), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('open', 'increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, his.his_avg, bk.our_avg, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT * FROM pair ORDER BY abs(COALESCE(our_settled, 0)) DESC LIMIT 60; WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, round((sum(b.avg_cost * abs(b.ledger_net)) / NULLIF(sum(abs(b.ledger_net)), 0))::numeric, 4) AS our_avg FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)) t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND m.resolved_prices IS NOT NULL GROUP BY t.condition_id), lat AS (SELECT b.condition_id, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.placed_at - h.ts)))::numeric, 0) AS lat_med_s, round((sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN (o.avg_px - o.his_level) * o.filled ELSE 0 END) * 100 / NULLIF(sum(CASE WHEN o.filled > 0 AND o.avg_px IS NOT NULL AND o.his_level IS NOT NULL THEN o.filled ELSE 0 END), 0))::numeric, 1) AS c_over_ord FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id JOIN LATERAL (SELECT max(t.ts) AS ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id = b.condition_id AND t.ts <= o.placed_at) h ON h.ts IS NOT NULL WHERE o.kind IN ('open', 'increase', 'take') AND o.placed_at >= now() - interval '24 hours' GROUP BY b.condition_id), pair AS (SELECT bk.book, left(COALESCE(his.his_slug, bk.slugs), 30) AS market, his.usd AS his_usd, his.cost AS his_cost, his.pnl AS his_pnl, CASE WHEN his.cost > 0 THEN round(his.pnl / his.cost, 3) END AS his_roi, bk.staked AS our_staked, bk.settled AS our_settled, CASE WHEN bk.staked > 0 THEN round(bk.settled / bk.staked, 3) END AS our_roi, CASE WHEN his.cost > 0 THEN round(100 * bk.staked / his.cost, 1) END AS frac_pct, CASE WHEN his.cost > 0 THEN round(100 * LEAST(0.10, 2500.0 / his.cost), 1) END AS target_pct, his.his_avg, bk.our_avg, lat.c_over_ord AS cents_over, lat.lat_med_s, CASE WHEN his.pnl IS NULL OR bk.settled IS NULL THEN NULL WHEN sign(his.pnl) = sign(bk.settled) THEN 'same' ELSE 'OPPOSITE' END AS sign_agree, bk.opened::time(0) AS opened, COALESCE(bk.frozen_reason, bk.last_reason) AS last_reason, bk.episodes, bk.settled_eps FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN lat ON lat.condition_id = bk.condition_id WHERE bk.paired) SELECT count(*) AS markets, count(*) FILTER (WHERE COALESCE(our_staked, 0) > 0) AS staked_mkts, count(*) FILTER (WHERE COALESCE(our_staked, 0) <= 0) AS zero_stake_mkts, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) <= 0)::numeric, 2) AS zero_stake_settled, round(sum(his_usd) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_usd, round(sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_cost, round(sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS his_pnl, CASE WHEN sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(his_pnl) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(his_cost) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS his_roi, round(sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_staked, round(sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0)::numeric, 2) AS our_settled, CASE WHEN sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0) > 0 THEN round((sum(our_settled) FILTER (WHERE COALESCE(our_staked, 0) > 0) / sum(our_staked) FILTER (WHERE COALESCE(our_staked, 0) > 0))::numeric, 4) END AS our_roi, count(*) FILTER (WHERE sign_agree = 'same') AS same_sign, count(*) FILTER (WHERE sign_agree = 'OPPOSITE') AS opposite_sign, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY frac_pct)::numeric, 1) AS frac_med_pct, round(min(frac_pct)::numeric, 1) AS frac_min_pct, round(max(frac_pct)::numeric, 1) AS frac_max_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY cents_over)::numeric, 1) AS cents_over_med, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lat_med_s)::numeric, 0) AS lat_med_s FROM pair; SELECT '== paired-ratio' AS section; WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, round(sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS staked, round(sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL)::numeric, 2) AS settled, bool_or(b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS paired, count(*) AS episodes, count(*) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled_eps, min(b.opened_at) AS opened, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason, CASE WHEN bool_and(b.avg_cost IS NOT NULL OR COALESCE(b.peak_exposure_usd, 0) = 0) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) THEN max(b.peak_exposure_usd / NULLIF(CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 1 - b.avg_cost ELSE b.avg_cost END, 0)) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) END AS peak_sh FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') GROUP BY b.condition_id), ax AS (SELECT DISTINCT ON (b.condition_id) b.condition_id, b.long_asset, b.other_asset, (b.intent = 'ORDER_INTENT_BUY_SHORT') AS short FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '24 hours' OR b.closed_at >= now() - interval '24 hours') ORDER BY b.condition_id, b.id), hf AS (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)), his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 2) AS usd, round(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END)::numeric, 2) AS cost, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 2) AS pnl, round((sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price ELSE 0 END) / NULLIF(sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size ELSE 0 END), 0))::numeric, 4) AS his_avg, min(t.ts) AS his_first FROM hf t JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE m.resolved_prices IS NOT NULL GROUP BY t.condition_id), axf AS (SELECT f.condition_id, f.ts, f.id, f.size, ax.short, (CASE WHEN f.asset = ax.long_asset THEN 1 WHEN f.asset = ax.other_asset THEN -1 END) * (CASE WHEN upper(f.side) = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN ax.short THEN -1 ELSE 1 END) * f.size AS sgn_sh, CASE WHEN ax.short THEN 1 - (CASE WHEN f.asset = ax.long_asset THEN f.price ELSE 1 - f.price 