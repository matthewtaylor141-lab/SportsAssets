 AND COALESCE(s.e->>'name', '') = 'on_target') SELECT COALESCE(cause, 'ALL') AS cause, count(*) AS fills, count(DISTINCT condition_id) AS markets, round(sum(usd)::numeric, 2) AS his_usd, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_p90_s FROM c GROUP BY ROLLUP (cause) ORDER BY 4 DESC; WITH r AS (SELECT t.id, t.condition_id, t.ts, upper(t.side) AS side, t.asset, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.side, r.size, r.price, r.size * r.price AS usd, r.his_slug FROM r WHERE r.net_leg OR NOT r.has_net), s AS (SELECT f.*, x.e, x.book, x.opened_at, x.flow_base, x.last_plan, x.target_raw, x.ratio, x.his_net, x.ledger_net, x.target FROM f LEFT JOIN LATERAL (SELECT e, b.id AS book, b.opened_at, b.flow_base, b.last_plan, b.target_raw, b.ratio, b.his_net, b.ledger_net, b.target FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), c AS (SELECT s.*, (s.e->>'at')::float8 - extract(epoch FROM s.ts) AS lag_s, CASE WHEN s.ts < s.opened_at - interval '60 seconds' AND COALESCE(s.flow_base, 0) <> 0 THEN 'block' WHEN (s.last_plan->>'game_cap') IS NOT NULL OR (COALESCE(s.last_plan->>'game_room', '') <> '' AND NOT ((s.last_plan->>'game_room') ~ '[^0-