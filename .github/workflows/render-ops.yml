led > 0 AND payoff IS NOT NULL), 0)))::numeric, 4) AS ci95 FROM x GROUP BY ROLLUP (side_w, leg, clause) ORDER BY 1, 2, 3; WITH e AS (SELECT o.id, o.book_id, o.state, o.reason, o.qty, o.filled, o.placed_at, o.done_at, CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN 'short' ELSE 'long' END AS side_w, o.decision IN ('replace_cent', 'replace_qty', 'replace_side', 'ttl', 'replace_unread') AS replaced, CASE WHEN o.his_level IS NULL THEN NULL ELSE floor(round((o.his_level * 100)::numeric, 6)) END AS his_cent, round(o.wire::numeric, 4) AS wire_c, b.last_plan->>'hold' AS hold FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.whale = 'rn1' AND o.placed_at >= now() - interval '24 hours'), n AS (SELECT e.*, LEAD(wire_c) OVER w AS nx_wire, LEAD(his_cent) OVER w AS nx_cent, LEAD(qty) OVER w AS nx_qty, LEAD(placed_at) OVER w AS nx_placed FROM e WINDOW w AS (PARTITION BY book_id ORDER BY placed_at, id)), z AS (SELECT side_w, book_id, date_trunc('hour', placed_at)::time(0) AS hour, replaced, hold, CASE WHEN nx_placed IS NULL OR his_cent IS NULL OR nx_cent IS NULL OR wire_c IS NULL OR nx_wire IS NULL THEN 'unread' WHEN his_cent = nx_cent AND wire_c <> nx_wire THEN 'touch_moved' WHEN his_cent = nx_cent AND wire_c = nx_wire AND nx_qty = qty THEN 'same_quote' WHEN his_cent = nx_cent AND wire_c = nx_wire AND nx_qty > qty AND (nx_qty - qty) < 0.10 * greatest(qty - filled, 0) THEN 'qty_regrow' ELSE 'other' END AS pair, (state = 'rejected' AND reason LIKE 'post_only_rejected:%') AS rejected, (state = 'rejected' AND reason LIKE '%:cross') AS rejected_cross, (state = 'rejected' AND nx_placed IS NOT NULL AND nx_placed - placed_at < interval '90 seconds' AND wire_c IS DISTINCT FROM nx_wire) AS repriced FROM n) SELECT COALESCE(side_w, 'ALL') AS side, COALESCE(hour::text, 'ALL') AS hour, count(*) AS rows_n, count(*) FILTER (WHERE replaced) AS replaced, count(*) FILTER (WHERE replaced AND pair = 'touch_moved') AS touch_moved, count(*) FILTER (WHERE replaced AND pair = 'same_quote') AS same_quote, count(*) FILTER (WHERE replaced AND pair = 'qty_regrow') AS qty_regrow, count(*) FILTER (WHERE replaced AND pair = 'other') AS other, count(*) FILTER (WHERE rejected) AS rejected, count(*) FILTER (WHERE rejected_cross) AS rejected_cross, count(*) FILTER (WHERE repriced) AS repriced, count(DISTINCT book_id) FILTER (WHERE hold = 'post_only_backoff') AS held_backoff FROM z GROUP BY ROLLUP (side_w, hour) ORDER BY 1, 2 DESC; SELECT '== on-target-why' AS section; WITH r AS (SELECT t.id, t.condition_id, t.ts, upper(t.side) AS side, t.asset, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.side, r.size, r.price, r.size * r.price AS usd, r.his_slug FROM r WHERE r.net_leg OR NOT r.has_net), s AS (SELECT f.*, x.e, x.book, x.opened_at, x.flow_base, x.last_plan, x.target_raw, x.ratio, x.his_net, x.ledger_net, x.target FROM f LEFT JOIN LATERAL (SELECT e, b.id AS book, b.opened_at, b.flow_base, b.last_plan, b.target_raw, b.ratio, b.his_net, b.ledger_net, b.target FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), c AS (SELECT s.*, (s.e->>'at')::float8 - extract(epoch FROM s.ts) AS lag_s, CASE WHEN s.ts < s.opened_at - interval '60 seconds' AND COALESCE(s.flow_base, 0) <> 0 THEN 'block' WHEN (s.last_plan->>'game_cap') IS NOT NULL OR (COALESCE(s.last_plan->>'game_room', '') <> '' AND NOT ((s.last_plan->>'game_room') ~ '[^0-9.eE+-]') AND (s.last_plan->>'game_room')::float8 <= 0) THEN 'game_cap' WHEN s.last_plan->'flow_hold' IS NOT NULL AND jsonb_typeof(s.last_plan->'flow_hold') <> 'null' THEN 'flow_hold' WHEN s.target_raw IS NOT NULL AND s.ratio IS NOT NULL AND s.his_net IS NOT NULL AND abs(s.target_raw) < s.ratio * abs(COALESCE(CASE WHEN COALESCE(s.last_plan->>'flow_net', '') <> '' AND NOT ((s.last_plan->>'flow_net') ~ '[^0-9.eE+-]') THEN (s.last_plan->>'flow_net')::float8 END, s.his_net - COALESCE(s.flow_base, 0))) - 0.5 THEN 'stale_snapshot' WHEN COALESCE(s.flow_base, 0) <> 0 AND s.target_raw IS NOT NULL AND s.ratio IS NOT NULL AND s.his_net IS NOT NULL AND abs(s.target_raw) < s.ratio * abs(s.his_net) - 0.5 THEN 'block_flow' ELSE 'unattributed' END AS cause FROM s WHERE s.e IS NOT NULL AND (s.e->>'order') IS NULL AND COALESCE(s.e->>'name', '') = 'on_target') SELECT COALESCE(cause, 'ALL') AS cause, count(*) AS fills, count(DISTINCT condition_id) AS markets, round(sum(usd)::numeric, 2) AS his_usd, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_med_s, round(percentile_cont(0.9) WITHIN GROUP (ORDER BY lag_s)::numeric, 0) AS lag_p90_s FROM c GROUP BY ROLLUP (cause) ORDER BY 4 DESC; WITH r AS (SELECT t.id, t.condition_id, t.ts, upper(t.side) AS side, t.asset, t.size, t.price, left(t.market_slug, 30) AS his_slug, COALESCE(t.source, '') IN ('chain', 's1') AS net_leg, bool_or(COALESCE(t.source, '') IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND t.condition_id IN (SELECT condition_id FROM mirror_books WHERE whale = 'rn1')), f AS (SELECT r.id, r.condition_id, r.ts, r.side, r.size, r.price, r.size * r.price AS usd, r.his_slug FROM r WHERE r.net_leg OR NOT r.has_net), s AS (SELECT f.*, x.e, x.book, x.opened_at, x.flow_base, x.last_plan, x.target_raw, x.ratio, x.his_net, x.ledger_net, x.target FROM f LEFT JOIN LATERAL (SELECT e, b.id AS book, b.opened_at, b.flow_base, b.last_plan, b.target_raw, b.ratio, b.his_net, b.ledger_net, b.target FROM mirror_books b, jsonb_array_elements(CASE WHEN jsonb_typeof(b.last_plan->'his_fills_seen') = 'array' THEN b.last_plan->'his_fills_seen' ELSE '[]'::jsonb END) e WHERE b.condition_id = f.condition_id AND b.whale = 'rn1' AND e->>'id' = f.id::text ORDER BY b.updated_at DESC LIMIT 1) x ON true), c AS (SELECT s.*, (s.e->>'at')::float8 - extract(epoch FROM s.ts) AS lag_s, CASE WHEN s.ts < s.opened_at - interval '60 seconds' AND COALESCE(s.flow_base, 0) <> 0 THEN 'block' WHEN (s.last_plan->>'game_cap') IS NOT NULL OR (COALESCE(s.last_plan->>'game_room', '') <> '' AND NOT ((s.last_plan->>'game_room') ~ '[^0-9.eE+-]') AND (s.last_plan->>'game_room')::float8 <= 0) THEN 'game_cap' WHEN s.last_plan->'flow_hold' IS NOT NULL AND jsonb_typeof(s.last_plan->'flow_hold') <> 'null' THEN 'flow_hold' WHEN s.target_raw IS NOT NULL AND s.ratio IS NOT NULL AND s.his_net IS NOT NULL AND abs(s.target_raw) < s.ratio * abs(COALESCE(CASE WHEN COALESCE(s.last_plan->>'flow_net', '') <> '' AND NOT ((s.last_plan->>'flow_net') ~ '[^0-9.eE+-]') THEN (s.last_plan->>'flow_net')::float8 END, s.his_net - COALESCE(s.flow_base, 0))) - 0.5 THEN 'stale_snapshot' WHEN COALESCE(s.flow_base, 0) <> 0 AND s.target_raw IS NOT NULL AND s.ratio IS NOT NULL AND s.his_net IS NOT NULL AND abs(s.target_raw) < s.ratio * abs(s.his_net) - 0.5 THEN 'block_flow' ELSE 'unattributed' END AS cause FROM s WHERE s.e IS NOT NULL AND (s.e->>'order') IS NULL AND COALESCE(s.e->>'name', '') = 'on_target') SELECT id, book, his_slug, ts::time(0) AS his_fill, side, round(size::numeric, 1) AS sh, price, round(usd::numeric, 2) AS his_usd, cause, round(lag_s::numeric, 0) AS lag_s, ledger_net AS held, target, round(his_net::numeric, 1) AS his_net, round(target_raw::numeric, 1) AS target_raw, ratio, round(flow_base::numeric, 1) AS flow_base, last_plan->>'flow_net' AS flow_net, opened_at::time(0) AS opened, last_plan->>'game_cap' AS game_cap, last_plan->>'game_room' AS game_room, left((last_plan->'flow_hold')::text, 60) AS flow_hold FROM c ORDER BY usd DESC LIMIT 30;"; TO=120000; HEAD=1500 ;;
