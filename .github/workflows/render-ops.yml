                sleeve-48h) SQL="WITH k AS (SELECT b.*, COALESCE(NULLIF(m.sport, 'unclassified'), '(unmapped)') AS sport, (CASE WHEN b.state = 'closed' AND b.settled_pnl IS NOT NULL THEN b.settled_pnl ELSE b.realized_pnl END) AS pnl FROM mirror_books b LEFT JOIN markets m ON m.condition_id = b.condition_id WHERE (b.opened_at >= now() - interval '48 hours' OR b.closed_at >= now() - interval '48 hours') AND lower(COALESCE(b.us_market_slug, '')) NOT LIKE 'aec-nfl-ne-sea-2026-09-09%') SELECT COALESCE(sport, 'ALL SPORTS') AS sport, count(*) AS books, count(*) FILTER (WHERE state = 'closed') AS closed, count(*) FILTER (WHERE state <> 'closed') AS still_open, round(sum(peak_exposure_usd)::numeric, 2) AS staked, round(sum(pnl)::numeric, 2) AS pnl, round((100 * sum(pnl) / NULLIF(sum(peak_exposure_usd), 0))::numeric, 2) AS roi_pct, count(*) FILTER (WHERE pnl > 0) AS won, count(*) FILTER (WHERE pnl < 0) AS lost, count(*) FILTER (WHERE pnl = 0 OR pnl IS NULL) AS flat, count(*) FILTER (WHERE intent = 'ORDER_INTENT_BUY_SHORT') AS shorts FROM k GROUP BY ROLLUP (sport) ORDER BY sum(pnl) ASC NULLS FIRST; WITH k AS (SELECT b.*, COALESCE(NULLIF(m.sport, 'unclassified'), '(unmapped)') AS sport, (CASE WHEN b.state = 'closed' AND b.settled_pnl IS NOT NULL THEN b.settled_pnl ELSE b.realized_pnl END) AS pnl FROM mirror_books b LEFT JOIN markets m ON m.condition_id = b.condition_id WHERE (b.opened_at >= now() - interval '48 hours' OR b.closed_at >= now() - interval '48 hours') AND lower(COALESCE(b.us_market_slug, '')) NOT LIKE 'aec-nfl-ne-sea-2026-09-09%') SELECT sport, id, left(COALESCE(us_market_slug, '(none)'), 40) AS slug, CASE WHEN intent = 'ORDER_INTENT_BUY_SHORT' THEN 'SHORT' ELSE 'LONG' END AS side, state, round(ledger_net::numeric, 1) AS held, round(avg_cost::numeric, 4) AS avg_cost, round(peak_exposure_usd::numeric, 2) AS staked, round(realized_pnl::numeric, 2) AS realized, round(settled_pnl::numeric, 2) AS settled, round(pnl::numeric, 2) AS pnl, opened_at::timestamp(0) AS opened, closed_at::timestamp(0) AS closed FROM k ORDER BY sport, pnl ASC NULLS LAST LIMIT 500; SELECT 'zz E32 zero-share book carrying a settlement: book ' || id::text AS what, left(COALESCE(us_market_slug, ''), 44) || '  settled=' || round(settled_pnl::numeric, 2)::text AS value FROM mirror_books WHERE (opened_at >= now() - interval '48 hours' OR closed_at >= now() - interval '48 hours') AND COALESCE(ledger_net, 0) = 0 AND settled_pnl IS NOT NULL AND abs(settled_pnl) > 1 UNION ALL SELECT 'zz hand-position books (EXCLUDED from every figure above)', count(*)::text FROM mirror_books WHERE lower(COALESCE(us_market_slug, '')) LIKE 'aec-nfl-ne-sea-2026-09-09%' UNION ALL SELECT 'zz books in window with no sport on markets', count(*)::text FROM mirror_books b LEFT JOIN markets m ON m.condition_id = b.condition_id WHERE (b.opened_at >= now() - interval '48 hours' OR b.closed_at >= now() - interval '48 hours') AND COALESCE(NULLIF(m.sport, 'unclassified'), '') = '' UNION ALL SELECT 'zz books still open (pnl is realized so far, not final)', count(*)::text FROM mirror_books WHERE state <> 'closed' UNION ALL SELECT 'zz ' || key, left(value::text, 40) FROM ingestion_state WHERE key = 'mirror_live' ORDER BY 1;"; TO=120000; HEAD=1500 ;;
                sleeve-vs-him-48h) SQL="WITH bk AS (SELECT b.condition_id, sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS staked, sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled, count(*) AS episodes FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '48 hours' OR b.closed_at >= now() - interval '48 hours') AND lower(COALESCE(b.us_market_slug, '')) NOT LIKE 'aec-nfl-ne-sea-2026-09-09%' AND NOT (COALESCE(b.ledger_net, 0) = 0 AND b.settled_pnl IS NOT NULL) GROUP BY 1 HAVING sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) > 0), hf AS (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '96 hours' AND t.condition_id IN (SELECT condition_id FROM bk)) d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net)), his AS (SELECT t.condition_id, sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END) AS cost, sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price)) AS pnl FROM hf t JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE m.resolved_prices IS NOT NULL GROUP BY 1), j AS (SELECT COALESCE(NULLIF(m.sport, 'unclassified'), '(unmapped)') AS sport, bk.condition_id, bk.staked AS our_staked, bk.settled AS our_pnl, his.cost AS his_cost, his.pnl AS his_pnl FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN markets m ON m.condition_id = bk.condition_id WHERE his.cost > 0) SELECT COALESCE(sport, 'ALL SPORTS') AS sport, count(*) AS markets, round(sum(his_cost)::numeric, 2) AS his_cost, round(sum(his_pnl)::numeric, 2) AS his_pnl, round((100 * sum(his_pnl) / NULLIF(sum(his_cost), 0))::numeric, 2) AS his_roi_pct, round(sum(our_staked)::numeric, 2) AS our_staked, round(sum(our_pnl)::numeric, 2) AS our_pnl, round((100 * sum(our_pnl) / NULLIF(sum(our_staked), 0))::numeric, 2) AS our_roi_pct, round((100 * sum(our_staked) / NULLIF(sum(his_cost), 0))::numeric, 2) AS stake_pct_of_his, CASE WHEN sum(his_pnl) <> 0 AND sum(his_cost) > 0 AND sum(our_staked) > 0 THEN round((100 * (sum(our_pnl) / sum(our_staked)) / (sum(his_pnl) / sum(his_cost)))::numeric, 1) END AS our_roi_pct_of_his, count(*) FILTER (WHERE sign(our_pnl) = sign(his_pnl) AND his_pnl <> 0) AS same_direction, count(*) FILTER (WHERE sign(our_pnl) = -sign(his_pnl) AND his_pnl <> 0 AND our_pnl <> 0) AS opposite_direction FROM j GROUP BY ROLLUP (sport) ORDER BY sum(his_cost) DESC NULLS LAST; WITH bk AS (SELECT b.condition_id, sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS staked, sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled, count(*) AS episodes FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '48 hours' OR b.closed_at >= now() - interval '48 hours') AND lower(COALESCE(b.us_market_slug, '')) NOT LIKE 'aec-nfl-ne-sea-2026-09-09%' AND NOT (COALESCE(b.ledger_net, 0) = 0 AND b.settled_pnl IS NOT NULL) GROUP BY 1 HAVING sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) > 0), hf AS (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '96 hours' AND t.condition_id IN (SELECT condition_id FROM bk)) d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net)), his AS (SELECT t.condition_id, sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END) AS cost, sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price)) AS pnl FROM hf t JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE m.resolved_prices IS NOT NULL GROUP BY 1), j AS (SELECT COALESCE(NULLIF(m.sport, 'unclassified'), '(unmapped)') AS sport, bk.condition_id, bk.staked AS our_staked, bk.settled AS our_pnl, his.cost AS his_cost, his.pnl AS his_pnl FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN markets m ON m.condition_id = bk.condition_id WHERE his.cost > 0) SELECT sport, count(*) AS markets, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY 100 * our_staked / NULLIF(his_cost, 0))::numeric, 2) AS med_stake_pct_of_his, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY 100 * our_pnl / NULLIF(our_staked, 0))::numeric, 2) AS med_our_roi_pct, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY 100 * his_pnl / NULLIF(his_cost, 0))::numeric, 2) AS med_his_roi_pct, round(sum(CASE WHEN his_pnl > 0 THEN our_pnl ELSE 0 END)::numeric, 2) AS our_pnl_when_he_won, round(sum(CASE WHEN his_pnl > 0 THEN his_pnl ELSE 0 END)::numeric, 2) AS his_pnl_when_he_won, round(sum(CASE WHEN his_pnl < 0 THEN our_pnl ELSE 0 END)::numeric, 2) AS our_pnl_when_he_lost, round(sum(CASE WHEN his_pnl < 0 THEN his_pnl ELSE 0 END)::numeric, 2) AS his_pnl_when_he_lost FROM j GROUP BY sport ORDER BY sum(his_cost) DESC NULLS LAST; WITH bk AS (SELECT b.condition_id, sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS staked, sum(b.settled_pnl) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) AS settled, count(*) AS episodes FROM mirror_books b WHERE b.whale = 'rn1' AND (b.opened_at >= now() - interval '48 hours' OR b.closed_at >= now() - interval '48 hours') AND lower(COALESCE(b.us_market_slug, '')) NOT LIKE 'aec-nfl-ne-sea-2026-09-09%' AND NOT (COALESCE(b.ledger_net, 0) = 0 AND b.settled_pnl IS NOT NULL) GROUP BY 1 HAVING sum(b.peak_exposure_usd) FILTER (WHERE b.state = 'closed' AND b.settled_pnl IS NOT NULL) > 0), hf AS (SELECT d.*, sum((CASE WHEN upper(d.side) = 'BUY' THEN 1 ELSE -1 END) * d.size) OVER (PARTITION BY d.condition_id ORDER BY d.ts, d.id) AS net_after FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '96 hours' AND t.condition_id IN (SELECT condition_id FROM bk)) d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net)), his AS (SELECT t.condition_id, sum(CASE WHEN upper(t.side) = 'BUY' THEN t.size * t.price WHEN t.net_after < 0 THEN LEAST(t.size, -t.net_after) * (1 - t.price) ELSE 0 END) AS cost, sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price)) AS pnl FROM hf t JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE m.resolved_prices IS NOT NULL GROUP BY 1), j AS (SELECT COALESCE(NULLIF(m.sport, 'unclassified'), '(unmapped)') AS sport, bk.condition_id, bk.staked AS our_staked, bk.settled AS our_pnl, his.cost AS his_cost, his.pnl AS his_pnl FROM bk JOIN his ON his.condition_id = bk.condition_id LEFT JOIN markets m ON m.condition_id = bk.condition_id WHERE his.cost > 0) SELECT j.sport, left(COALESCE(mm.slug, j.condition_id), 38) AS market, round(his_cost::numeric, 2) AS his_cost, round(his_pnl::numeric, 2) AS his_pnl, round((100 * his_pnl / NULLIF(his_cost, 0))::numeric, 1) AS his_roi_pct, round(our_staked::numeric, 2) AS our_staked, round(our_pnl::numeric, 2) AS our_pnl, round((100 * our_pnl / NULLIF(our_staked, 0))::numeric, 1) AS our_roi_pct, CASE WHEN his_pnl <> 0 THEN round((100 * (our_pnl / NULLIF(our_staked, 0)) / (his_pnl / NULLIF(his_cost, 0)))::numeric, 0) END AS our_pct_of_his FROM j LEFT JOIN markets mm ON mm.condition_id = j.condition_id ORDER BY j.sport, our_pnl ASC LIMIT 250;"; TO=180000; HEAD=1500 ;;
                rests-and-fees) SQL="SELECT b.us_market_slug AS slug, o.id, o.side, o.kind, o.post_only, round(o.filled::numeric, 2) AS filled, round(COALESCE(o.avg_px, o.wire)::numeric, 4) AS px, left(COALESCE(o.state, ''), 12) AS state, o.placed_at::timestamp(0) AS placed, o.done_at::timestamp(0) AS done FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.us_market_slug IN ('asc-lib-pal-lqu-2026-09-09-neg-1pt5', 'tsc-lib-pal-lqu-2026-09-09-3pt5', 'atc-lib-pal-lqu-2026-09-09-pal', 'atc-lib-pal-lqu-2026-09-09-draw', 'atc-lib-pal-lqu-2026-09-09-lqu', 'tsc-lib-pal-lqu-2026-09-09-1pt5', 'tsc-lib-pal-lqu-2026-09-09-2pt5', 'tsc-sud-sfa-cam-2026-09-09-2pt5', 'tsc-sud-sfa-cam-2026-09-09-1pt5', 'tsc-sud-sfa-cam-2026-09-09-3pt5', 'aec-wta-leojea-julpar-2026-09-09') ORDER BY b.us_market_slug, o.placed_at LIMIT 200; SELECT b.us_market_slug AS slug, count(*) FILTER (WHERE o.filled > 0) AS filled_orders, bool_and(o.post_only) FILTER (WHERE o.filled > 0) AS every_fill_was_a_rest, bool_or(o.post_only) FILTER (WHERE o.filled > 0) AS any_fill_was_a_rest, round(sum(o.filled)::numeric, 2) AS shares FROM mirror_orders o JOIN mirror_books b ON b.id = o.book_id WHERE b.us_market_slug IN ('asc-lib-pal-lqu-2026-09-09-neg-1pt5', 'tsc-lib-pal-lqu-2026-09-09-3pt5', 'atc-lib-pal-lqu-2026-09-09-pal', 'atc-lib-pal-lqu-2026-09-09-draw', 'atc-lib-pal-lqu-2026-09-09-lqu', 'tsc-lib-pal-lqu-2026-09-09-1pt5', 'tsc-lib-pal-lqu-2026-09-09-2pt5', 'tsc-sud-sfa-cam-2026-09-09-2pt5', 'tsc-sud-sfa-cam-2026-09-09-1pt5', 'tsc-sud-sfa-cam-2026-09-09-3pt5', 'aec-wta-leojea-julpar-2026-09-09') GROUP BY 1 ORDER BY 1; SELECT o.post_only, o.side, count(*) AS orders, count(*) FILTER (WHERE o.filled > 0) AS with_a_fill, round((100.0 * count(*) FILTER (WHERE o.filled > 0) / NULLIF(count(*), 0))::numeric, 1) AS pct_filled, round(sum(o.filled)::numeric, 0) AS shares, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch FROM (o.done_at - o.placed_at)))::numeric, 0) AS med_secs_to_done FROM mirror_orders o WHERE o.whale = 'rn1' AND o.placed_at >= now() - interval '7 days' GROUP BY 1, 2 ORDER BY 1, 2;"; TO=120000; HEAD=1500 ;;
                round-trips) SQL="WITH e AS (SELECT b.id, COALESCE(NULLIF(b.frozen_reason, ''), '') AS fr, b.peak_exposure_usd AS staked, sum(o.filled) FILTER (WHERE ((b.intent = 'ORDER_INTENT_BUY_SHORT') = (o.side = 'SELL_LONG'))) AS op, sum(o.filled) FILTER (WHERE NOT ((b.intent = 'ORDER_INTENT_BUY_SHORT') = (o.side = 'SELL_LONG'))) AS cl, count(*) FILTER (WHERE o.kind IN ('reduce', 'flatten_paired', 'flatten_vanished')) AS n_close, count(*) FILTER (WHERE o.kind IN ('reduce', 'flatten_paired', 'flatten_vanished') AND o.filled > 0) AS n_filled, count(*) FILTER (WHERE o.kind IN ('reduce', 'flatten_paired', 'flatten_vanished') AND o.state = 'rejected') AS n_rej, count(*) FILTER (WHERE o.kind IN ('reduce', 'flatten_paired', 'flatten_vanished') AND o.state IN ('unknown', 'lost')) AS n_lost, left(string_agg(DISTINCT CASE WHEN o.kind IN ('reduce', 'flatten_paired', 'flatten_vanished') AND o.state IN ('rejected', 'unknown', 'lost') THEN NULLIF(o.reason, '') END, ','), 70) AS why_failed FROM mirror_books b JOIN mirror_orders o ON o.book_id = b.id WHERE b.whale = 'rn1' AND b.opened_at >= now() - interval '7 days' AND lower(COALESCE(b.us_market_slug, '')) NOT LIKE 'aec-nfl-ne-sea-2026-09-09%' GROUP BY 1, 2, 3), f AS (SELECT *, LEAST(COALESCE(cl, 0) / NULLIF(op, 0), 1.0) AS d FROM e WHERE op > 0) SELECT CASE WHEN d >= 0.95 THEN '1 CLOSED by trading' WHEN n_close = 0 THEN '2 NEVER TRIED: no closing order was placed' WHEN n_rej > 0 OR n_lost > 0 THEN '3 OURS: a closing order was rejected, lost or unknown' WHEN fr <> '' THEN '4 OURS: the book was frozen' WHEN n_filled = 0 THEN '5 MARKET: closes placed, not one filled' ELSE '6 MARKET: closes filled only in part' END AS why, count(*) AS episodes, round((100.0 * count(*) / sum(count(*)) OVER ())::numeric, 1) AS pct_eps, round(sum(staked)::numeric, 0) AS staked, round((100.0 * sum(staked) / sum(sum(staked)) OVER ())::numeric, 1) AS pct_staked, round(avg(n_close)::numeric, 1) AS avg_tries, left(string_agg(DISTINCT NULLIF(fr, ''), ','), 46) AS frozen, left(string_agg(DISTINCT why_failed, ','), 70) AS order_reasons FROM f GROUP BY 1 ORDER BY 1;"; TO=120000; HEAD=1500 ;;
