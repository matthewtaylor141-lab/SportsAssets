# Render operations from the Actions tab (2026-09-05, the disk-full outage).
#
# The recovery ran on screenshots: this session cannot reach Render's API
# or dashboard (egress policy), and the owner has no terminal. Every read
# of a service's events, deploys and logs, and every resume / redeploy /
# database maintenance step, went through a person. This job is the
# bridge: one dispatch = one read or one guarded action, printed in full.
#
# THE KEY. Prefer the RENDER_API_KEY repository secret. Until it exists,
# the key may be passed as the `render_key` input; it is masked before
# anything else runs, so it never appears in the log. Rotate the key in
# Render (Account Settings -> API Keys) when this incident is over.
#
# FAIL CLOSED. Reads print what came back or say the read failed; nothing
# is inferred from silence. Every state-changing action (resume, suspend,
# restart, deploy, the two maintenance statements) requires confirm=DO and
# prints the resolved service id and name BEFORE it acts. The `sql` action
# runs ONLY the statements named here -- there is no free-text SQL.
name: render-ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options:
          - services      # every service and database, with plan/status
          - events        # a service's recent events (deploys, crashes, OOM)
          - deploys       # a service's recent deploys with status and commit
          - logs          # a service's or database's log lines (arg = minutes back, or a text filter)
          - db            # the database's status, plan, version, disk
          - resume        # confirm=DO
          - suspend       # confirm=DO
          - restart       # confirm=DO
          - deploy        # confirm=DO: deploy the latest commit of the service's branch
          - metrics       # a service's memory (MB) and CPU per instance over the last N minutes (arg, default 120)
          - sql           # arg = activity | tables | sizes | indexes | analyze (DO) | index053 (DO) | mirror-on (DO) | mirror-off (DO) | mirror-state | mirror-preflight | mirror-rearm (DO)
          - env-keys      # the service's env var KEYS (never values)
          - env-get       # arg = comma-separated OPERATOR FLAGS (LIVE_COPY_HALT, ...); values of flags only
          - env-set       # confirm=DO: arg = KEY=VALUE (value masked in the log; Render redeploys)
          - env-del       # confirm=DO: arg = KEY
      service:
        description: 'Service or database name (sportsassets-api, sportsassets-workers, edge-shadow, sportsassets-db)'
        required: false
        default: 'sportsassets-api'
      arg:
        description: 'logs: minutes back (default 30) or a text filter; sql: which statement'
        required: false
        default: ''
      confirm:
        description: 'Type DO to allow a state-changing action'
        required: false
        default: ''
      render_key:
        description: 'Render API key (only if the RENDER_API_KEY secret is not set)'
        required: false
        default: ''

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          ARG: ${{ inputs.arg }}
          CONFIRM: ${{ inputs.confirm }}
          KEY_SECRET: ${{ secrets.RENDER_API_KEY }}
          KEY_INPUT: ${{ inputs.render_key }}
        run: |
          set +e
          set -u
          KEY="$KEY_SECRET"; [ -z "$KEY" ] && KEY="$KEY_INPUT"
          if [ -z "$KEY" ]; then echo "no Render key: set the RENDER_API_KEY secret or pass render_key"; exit 1; fi
          echo "::add-mask::$KEY"
          API=https://api.render.com/v1
          get()  { curl -sS --max-time 45 -H "Authorization: Bearer $KEY" -H "Accept: application/json" "$API$1"; }
          post() { local body="${2:-}"; [ -z "$body" ] && body='{}'
                   curl -sS --max-time 45 -o /tmp/post.json -w '%{http_code}' -X POST \
                        -H "Authorization: Bearer $KEY" -H "Accept: application/json" \
                        -H "Content-Type: application/json" -d "$body" "$API$1"; }
          svc_id() { get "/services?name=$1&limit=20" | jq -r --arg n "$1" '.[]? | select(.service.name==$n) | .service.id' 2>/dev/null | head -1; }
          pg_id()  { get "/postgres?name=$1&limit=20"  | jq -r --arg n "$1" '.[]? | select(.postgres.name==$n) | .postgres.id' 2>/dev/null | head -1; }
          need_confirm() { if [ "$CONFIRM" != "DO" ]; then echo "refused: $ACTION needs confirm=DO (got '$CONFIRM')"; exit 1; fi; }
          echo "action=$ACTION service=$SERVICE arg='$ARG' at $(date -u +%FT%TZ)"

          case "$ACTION" in
            services)
              echo "== services =="
              get "/services?limit=50" | jq -r '.[]? | .service | "\(.id)  \(.name)  \(.type)  suspended=\(.suspended)  plan=\(.serviceDetails.plan // "?")  branch=\(.branch // "?")  autoDeploy=\(.autoDeploy // "?")"' || echo "(services read failed)"
              echo "== databases =="
              get "/postgres?limit=20" | jq -r '.[]? | .postgres | "\(.id)  \(.name)  status=\(.status)  plan=\(.plan)  v=\(.version)  disk=\(.diskSizeGB // "?")GB  suspended=\(.suspended // "?")"' || echo "(postgres read failed)"
              ;;
            events)
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "== events for $SERVICE ($ID), newest first =="
              get "/services/$ID/events?limit=40" > /tmp/ev.json
              jq -r '.[]? | .event | "\(.timestamp)  \(.type)  \(.details | tostring | .[0:220])"' /tmp/ev.json || { echo "(events not JSON)"; head -c 600 /tmp/ev.json; }
              ;;
            deploys)
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "== deploys for $SERVICE ($ID), newest first =="
              get "/services/$ID/deploys?limit=12" > /tmp/dp.json
              jq -r '.[]? | .deploy | "\(.createdAt) -> \(.finishedAt // "(running)")  \(.status)  \(.commit.id[0:7])  \(.trigger // "")  | \((.commit.message // "") | split("\n")[0] | .[0:80])"' /tmp/dp.json || { echo "(deploys not JSON)"; head -c 600 /tmp/dp.json; }
              ;;
            metrics)
              # Render's metrics API, one point per step: memory in bytes
              # and CPU in cores per instance. Added 2026-09-05 when the
              # workers were OOM-killed thirteen times in four hours and
              # the log lines before each kill were only the steady-state
              # mix -- the log could not say whether RSS ramps or spikes.
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              MIN=120; [[ "$ARG" =~ ^[0-9]+$ ]] && MIN="$ARG"
              START=$(date -u -d "-${MIN} minutes" +%FT%TZ); END=$(date -u +%FT%TZ)
              RES=60; [ "$MIN" -gt 360 ] && RES=300
              echo "== memory for $SERVICE ($ID) $START .. $END, ${RES}s steps, MB =="
              get "/metrics/memory?resource=$ID&startTime=$START&endTime=$END&resolutionSeconds=$RES" > /tmp/mem.json
              jq -r '.[]? | (.labels // [] | map(.value) | join(",")) as $l | .values[]? | "\(.timestamp)  \((.value / 1048576) | floor)  \($l)"' /tmp/mem.json || { echo "(memory not JSON)"; head -c 800 /tmp/mem.json; }
              echo "== cpu for $SERVICE ($ID), cores =="
              get "/metrics/cpu?resource=$ID&startTime=$START&endTime=$END&resolutionSeconds=$RES" > /tmp/cpu.json
              jq -r '.[]? | .values[]? | "\(.timestamp)  \(.value)"' /tmp/cpu.json || { echo "(cpu not JSON)"; head -c 800 /tmp/cpu.json; }
              ;;
            logs)
              ID=$(svc_id "$SERVICE"); KIND=service
              if [ -z "$ID" ]; then ID=$(pg_id "$SERVICE"); KIND=postgres; fi
              [ -z "$ID" ] && { echo "no service or database named $SERVICE"; exit 1; }
              if [ "$KIND" = service ]; then OWNER=$(get "/services/$ID" | jq -r '.ownerId // empty'); else OWNER=$(get "/postgres/$ID" | jq -r '.ownerId // empty'); fi
              [ -z "$OWNER" ] && { echo "could not read ownerId for $ID"; exit 1; }
              # arg: minutes back (default 30) | a text filter over the last 3 h |
              # a UTC window today "HH:MM:SS/HH:MM:SS" (printed oldest first, so
              # the lines around a crash read in order), optionally followed by
              # a space and a text filter.
              MIN=30; TEXT=""; START=""; END=""; DIR=backward
              if [[ "$ARG" =~ ^([0-9]{2}:[0-9]{2}:[0-9]{2})/([0-9]{2}:[0-9]{2}:[0-9]{2})(\ (.+))?$ ]]; then
                D=$(date -u +%F); START="${D}T${BASH_REMATCH[1]}Z"; END="${D}T${BASH_REMATCH[2]}Z"; DIR=forward
                TEXT="${BASH_REMATCH[4]:-}"
              elif [[ "$ARG" =~ ^[0-9]+$ ]]; then MIN="$ARG"
              elif [ -n "$ARG" ]; then TEXT="$ARG"; MIN=180; fi
              if [ -z "$END" ]; then END=$(date -u +%FT%TZ); START=$(date -u -d "-${MIN} minutes" +%FT%TZ); fi
              Q="/logs?ownerId=$OWNER&resource=$ID&startTime=$START&endTime=$END&limit=100&direction=$DIR"
              [ -n "$TEXT" ] && Q="$Q&text=$(printf '%s' "$TEXT" | jq -sRr @uri)"
              echo "== logs for $SERVICE ($ID) $START .. $END filter='$TEXT' (newest first, max 100) =="
              get "$Q" > /tmp/lg.json
              jq -r '.logs[]? | "\(.timestamp)  \(.message | .[0:400])"' /tmp/lg.json || { echo "(logs not JSON)"; head -c 800 /tmp/lg.json; }
              jq -r '"hasMore=\(.hasMore // "?")"' /tmp/lg.json 2>/dev/null || true
              ;;
            db)
              PG=$(pg_id "$SERVICE"); [ -z "$PG" ] && { echo "no database named $SERVICE"; exit 1; }
              get "/postgres/$PG" | jq '{id, name, status, plan, version, diskSizeGB, highAvailabilityEnabled, suspended, createdAt, updatedAt, expiresAt, ipAllowList}' || echo "(db read failed)"
              ;;
            resume|suspend|restart)
              need_confirm
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "$ACTION -> $SERVICE ($ID)"
              CODE=$(post "/services/$ID/$ACTION"); echo "HTTP $CODE"; head -c 400 /tmp/post.json; echo
              ;;
            deploy)
              need_confirm
              ID=$(svc_id "$SERVICE"); [ -z "$ID" ] && { echo "no service named $SERVICE"; exit 1; }
              echo "deploy latest -> $SERVICE ($ID)"
              CODE=$(post "/services/$ID/deploys" '{"clearCache":"do_not_clear"}'); echo "HTTP $CODE"
              jq -r '"deploy \(.id // "?") status=\(.status // "?") commit=\(.commit.id // "?" | .[0:7])"' /tmp/post.json 2>/dev/null || head -c 400 /tmp/post.json
              ;;
            sql)
              PG=$(pg_id "$SERVICE"); [ -z "$PG" ] && { echo "no database named $SERVICE"; exit 1; }
              case "$ARG" in
                activity) SQL="SELECT pid, state, wait_event_type, wait_event, now()-query_start AS age, left(query,90) AS q FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() ORDER BY query_start NULLS LAST;"; TO=30000 ;;
                tables)   SQL="SELECT relname, n_live_tup, n_dead_tup, seq_scan, idx_scan, last_analyze, last_autoanalyze, last_autovacuum FROM pg_stat_user_tables ORDER BY n_live_tup DESC LIMIT 30;"; TO=30000 ;;
                sizes)    SQL="SELECT relname, pg_size_pretty(pg_total_relation_size(relid)) AS total, pg_size_pretty(pg_relation_size(relid)) AS heap FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 20;"; TO=60000 ;;
                indexes)  SQL="SELECT i.relname AS tbl, i.indexrelname AS idx, i.idx_scan, pg_size_pretty(pg_relation_size(i.indexrelid)) AS size, ix.indisvalid FROM pg_stat_user_indexes i JOIN pg_index ix ON ix.indexrelid=i.indexrelid ORDER BY pg_relation_size(i.indexrelid) DESC LIMIT 40;"; TO=60000 ;;
                analyze)  need_confirm; SQL="ANALYZE VERBOSE;"; TO=1500000 ;;
                index053) need_confirm; SQL="CREATE INDEX CONCURRENTLY IF NOT EXISTS copy_probes_probe_at_idx ON copy_probes (probe_at);"; TO=2400000 ;;
                # THE MIRROR'S INCREASE SWITCH (owner order 2026-09-05, "switch on
                # the mirror system 100% and turn off the entry system"). The P1
                # reconciler (workers/mirror_live.py, step 0) increases a book
                # only when ingestion_state 'mirror_live' reads EXACTLY JSON true;
                # false, absent, malformed or unreadable is exits-only. The env
                # PMUS_MIRROR=on plus PMUS_MIRROR_WHALES decide the mode and the
                # allowlist (env-set above); this row is the second key. No admin
                # endpoint writes it yet (P1 step 10), so it is an auditable
                # confirm=DO action here: every flip is a dated run in the
                # Actions log. mirror-state prints every mirror key so the flip
                # is read back from the row the worker reads, not assumed.
                mirror-on)  need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('mirror_live', 'true'::jsonb) ON CONFLICT (key) DO UPDATE SET value = 'true'::jsonb; SELECT key, value FROM ingestion_state WHERE key LIKE 'mirror_%' ORDER BY key;"; TO=30000 ;;
                mirror-off) need_confirm; SQL="INSERT INTO ingestion_state (key, value) VALUES ('mirror_live', 'false'::jsonb) ON CONFLICT (key) DO UPDATE SET value = 'false'::jsonb; SELECT key, value FROM ingestion_state WHERE key LIKE 'mirror_%' ORDER BY key;"; TO=30000 ;;
                mirror-state) SQL="SELECT key, value FROM ingestion_state WHERE key LIKE 'mirror_%' ORDER BY key;"; TO=30000 ;;
                # THE PRE-FLIGHT READ (2026-09-05). The pre-flight review of
                # the switch named the rows the first ON tick reads before a
                # dollar moves: the mapping quarantine, the premap gate, the
                # side-echo counter behind first_fill_gate, the loss stop,
                # the pause and overspend halts, the roster and clips -- and
                # the counts that show whether any lane is still placing.
                # One statement, one row per fact, so the flip is decided
                # from what the worker will read and not from memory.
                mirror-preflight) SQL="SELECT what, value FROM (SELECT key AS what, left(value::text, 240) AS value FROM ingestion_state WHERE key IN ('mirror_live','mirror_live_whales','mirror_live_demoted','mirror_loss_stop','mapping_quarantine','premap_live','side_echo_last','live_trading_paused','copy_overspend_halt','live_verified_whales','live_clip_overrides','workers_boot','roster_auto_last') UNION ALL SELECT 'zz mirror_books live/24h', (SELECT count(*) FILTER (WHERE state <> 'closed') || '/' || count(*) FILTER (WHERE opened_at > now() - interval '24 hours') FROM mirror_books) UNION ALL SELECT 'zz mirror_orders by state', (SELECT COALESCE(string_agg(state || '=' || n, ' ' ORDER BY state), 'none') FROM (SELECT state, count(*) AS n FROM mirror_orders GROUP BY state) s) UNION ALL SELECT 'zz kalshi_claims rn1 24h', (SELECT count(*) FROM kalshi_claims WHERE lower(whale) = 'rn1' AND claimed_at > now() - interval '24 hours')::text UNION ALL SELECT 'zz live_orders 24h by status', (SELECT COALESCE(string_agg(status || '=' || n, ' ' ORDER BY status), 'none') FROM (SELECT status, count(*) AS n FROM live_orders WHERE placed_at > now() - interval '24 hours' GROUP BY status) s) UNION ALL SELECT 'zz live_orders last placed', (SELECT COALESCE(max(placed_at)::text, 'none') FROM live_orders)) t ORDER BY what;"; TO=30000 ;;
                # The loss stop's only re-arm: nothing in the worker deletes
                # 'mirror_loss_stop' once it trips (pre-flight 2026-09-05),
                # so the operator does it here, on the record.
                mirror-rearm) need_confirm; SQL="DELETE FROM ingestion_state WHERE key = 'mirror_loss_stop'; SELECT key, value FROM ingestion_state WHERE key LIKE 'mirror_%' ORDER BY key;"; TO=30000 ;;
                # THE LAST TICK, WHOLE (2026-09-06). The worker logs its mode
                # line with the full stats dict, but the logs action above
                # keeps 400 characters of a message and the census that says
                # WHY a tick placed nothing sits past that cut. The same dict
                # is the mirror_live heartbeat's detail, so this prints it one
                # key per row, plus the shadow's, plus the live books and the
                # newest orders -- the tick as the worker recorded it.
                mirror-tick) SQL="SELECT h.service AS what, e.key, left(e.value::text, 2400) AS value FROM service_heartbeats h, jsonb_each(h.detail) e WHERE h.service IN ('mirror_live','mirror_shadow') UNION ALL SELECT h.service, 'zz beat_at', h.beat_at::text || ' ' || h.status FROM service_heartbeats h WHERE h.service IN ('mirror_live','mirror_shadow') UNION ALL SELECT 'zz book', b.us_market_slug, 'state=' || b.state || ' whale=' || b.whale || ' opened=' || b.opened_at::text || ' ' || left((to_jsonb(b) - 'us_market_slug' - 'state' - 'whale' - 'opened_at' - 'condition_id' - 'long_asset' - 'other_asset')::text, 260) FROM mirror_books b WHERE b.state <> 'closed' UNION ALL SELECT 'zz order', o.placed_at::text, left((to_jsonb(o) - 'placed_at' - 'receipt')::text, 280) FROM (SELECT * FROM mirror_orders ORDER BY placed_at DESC NULLS LAST LIMIT 8) o ORDER BY 1, 2;"; TO=30000 ;;
                # THE REFUSAL RECEIPTS (2026-09-06). A place_refused row keeps
                # the adapter's raw (expected cost, the venue's preview order)
                # in receipt; this prints the newest refused rows whole so a
                # money guard is changed on the venue's numbers, never a guess.
                mirror-refusals) SQL="SELECT o.id, o.placed_at, o.side, o.intent, o.wire, o.qty, o.reason, left(o.receipt::text, 1500) AS receipt FROM mirror_orders o WHERE o.state = 'rejected' ORDER BY o.placed_at DESC LIMIT 4;"; TO=30000 ;;
                # THE MIRROR'S P&L TODAY (2026-09-06, owner question). Realized
                # is every sale booked on a mirror book (partials included,
                # mirror_books.realized_pnl), settled is the standing row's
                # settlement copied onto the book, open is the cost basis still
                # held (ledger_net x avg_cost on a long; |ledger_net| x (1 - avg_cost),
                # the collateral, on a short: avg_cost is the CONTRACT price). By book, then the day's totals;
                # UTC day boundaries, and every figure is what the tables hold.
                # E3 (2026-09-06 23:10Z): settled is the venue's WHOLE-position figure and already holds the
                # realized part, so realized + settled counts a settled book's sales twice. The totals row's
                # day_pnl is the one true number, the loss stop's rule: settled over the closed-settled books,
                # realized over every other book (open, and closes cashed out / cancelled with settled NULL).
                mirror-pnl) SQL="SELECT b.id, b.us_market_slug AS slug, b.state, b.intent, b.ratio, b.ledger_net AS held, round(b.avg_cost::numeric, 4) AS avg_cost, round((CASE WHEN b.intent = 'ORDER_INTENT_BUY_SHORT' THEN abs(b.ledger_net) * (1 - COALESCE(b.avg_cost, 1)) ELSE b.ledger_net * COALESCE(b.avg_cost, 0) END)::numeric, 2) AS open_cost, round(b.realized_pnl::numeric, 2) AS realized, round(b.settled_pnl::numeric, 2) AS settled, round(b.own_book_pnl::numeric, 2) AS own_book, b.opened_at::time(0) AS opened, b.closed_at::time(0) AS closed FROM mirror_books b WHERE b.opened_at >= date_trunc('day', now()) OR b.closed_at >= date_trunc('day', now()) OR b.state <> 'closed' ORDER BY b.id; SELECT 'today' AS what, count(*) AS books, round(sum(realized_pnl)::numeric, 2) AS realized, round(sum(settled_pnl)::numeric, 2) AS settled, round(sum(CASE WHEN state = 'closed' AND settled_pnl IS NOT NULL THEN settled_pnl ELSE realized_pnl END)::numeric, 2) AS day_pnl, round(sum(CASE WHEN state <> 'closed' THEN (CASE WHEN intent = 'ORDER_INTENT_BUY_SHORT' THEN abs(ledger_net) * (1 - COALESCE(avg_cost, 1)) ELSE ledger_net * COALESCE(avg_cost, 0) END) ELSE 0 END)::numeric, 2) AS open_cost, round(sum(peak_exposure_usd)::numeric, 2) AS peak_stake FROM mirror_books WHERE opened_at >= date_trunc('day', now()) OR closed_at >= date_trunc('day', now()) OR state <> 'closed'; SELECT 'fills today' AS what, count(*) AS n, round(sum(CASE WHEN side LIKE 'BUY%' THEN cash_usd ELSE 0 END)::numeric, 2) AS bought_usd, round(sum(CASE WHEN side LIKE 'SELL%' THEN cash_usd ELSE 0 END)::numeric, 2) AS sold_usd, round(sum(realized)::numeric, 2) AS realized FROM mirror_orders WHERE filled > 0 AND placed_at >= date_trunc('day', now());"; TO=30000 ;;
                # HIS LAST TWO HOURS AGAINST OURS (2026-09-06, owner: "I don't
                # see trades firing"). One row per market he filled in the
                # last 2 h, newest first: his fills, shares and dollars, the
                # shadow's latest verdict on it (reason + the resolver's
                # explain when unmapped, the US slug when mapped), and the
                # live book on that condition with its state and what it
                # holds. Every miss is named from the tables, never guessed.
                his-recent) SQL="WITH his AS (SELECT t.condition_id, max(t.ts) AS last_ts, min(t.ts) AS first_ts, count(*) AS fills, round(sum(t.size)::numeric, 1) AS shares, round(sum(t.size * t.price)::numeric, 2) AS usd, max(COALESCE(t.market_slug, m.slug)) AS his_slug, max(COALESCE(t.outcome, mt.outcome)) AS outcome, round(avg(t.price)::numeric, 3) AS avg_px FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id LEFT JOIN market_tokens mt ON mt.token_id = t.asset WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '2 hours' GROUP BY t.condition_id), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, detail->>'explain' AS explain, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '3 hours' ORDER BY condition_id, at DESC) SELECT h.last_ts::time(0) AS last, h.fills, h.shares, h.usd, h.avg_px, left(h.his_slug, 40) AS his_slug, left(h.outcome, 14) AS outcome, sh.family, left(COALESCE(sh.us_market_slug, ''), 40) AS us_slug, left(COALESCE(sh.reason, '(never judged)'), 40) AS shadow_reason, left(COALESCE(sh.explain, ''), 260) AS explain, sh.at::time(0) AS judged, b.id AS book, b.state AS bstate, b.ledger_net AS held, (SELECT count(*) FROM mirror_orders o WHERE o.book_id = b.id) AS orders FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id LEFT JOIN mirror_books b ON b.condition_id = h.condition_id AND b.whale = 'rn1' ORDER BY h.last_ts DESC LIMIT 60; SELECT 'his 2h' AS what, count(*) AS markets, sum(fills) AS fills, round(sum(usd)::numeric, 0) AS usd FROM (SELECT t.condition_id, count(*) AS fills, sum(t.size * t.price) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '2 hours' GROUP BY t.condition_id) x;"; TO=30000 ;;
                # WHY A MAPPED MARKET HAS NO BOOK (2026-09-06, owner: "we need
                # more volume"). For every market he filled in the last 2 h that
                # the shadow MAPPED to a US slug and that has no live book: the
                # shadow's newest verdict with its whole detail (venue vs ledger
                # on a freeze, the drift, the snapshot state), so the refusal is
                # read from the row and not inferred from a truncated census.
                mirror-why) SQL="WITH his AS (SELECT DISTINCT t.condition_id FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '2 hours'), sh AS (SELECT DISTINCT ON (s.condition_id) s.condition_id, s.at, s.us_market_slug, s.reason, s.his_net, s.target, s.ledger_net, s.venue_net, s.bid, s.ask, s.detail FROM mirror_shadow s JOIN his h ON h.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '3 hours' AND s.us_market_slug IS NOT NULL ORDER BY s.condition_id, s.at DESC) SELECT sh.at::time(0) AS judged, sh.us_market_slug AS us_slug, sh.reason, round(sh.his_net::numeric, 1) AS his_net, sh.target, sh.ledger_net AS ledger, sh.venue_net AS venue, sh.bid, sh.ask, left(sh.detail::text, 700) AS detail FROM sh LEFT JOIN mirror_books b ON b.condition_id = sh.condition_id AND b.whale = 'rn1' AND b.state <> 'closed' WHERE b.id IS NULL ORDER BY sh.at DESC LIMIT 30;"; TO=30000 ;;
                # THE COPY LANE TODAY (2026-09-06): every live_orders row of the
                # last 8 h -- the lane that competes with the mirror for a slug
                # (admission refuses `venue_already_holds` / `legacy_row` on a
                # slug another lane holds). Newest first, then by status per hour.
