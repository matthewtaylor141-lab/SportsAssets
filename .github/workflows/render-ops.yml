                exits-paired) SQL="WITH bk AS (SELECT b.condition_id, min(b.id) AS book, string_agg(DISTINCT left(b.us_market_slug, 36), ',') AS slugs, min(b.long_asset) AS long_asset, min(b.other_asset) AS other_asset, bool_and(b.intent = 'ORDER_INTENT_BUY_SHORT') AS is_short, round(sum(b.peak_exposure_usd)::numeric, 2) AS staked, round(sum(b.settled_pnl)::numeric, 2) AS settled, bool_and(b.settled_pnl IS NOT NULL) AS settled_ok, max(b.closed_at) AS closed_at, max(left(b.last_reason, 28)) AS last_reason, max(b.frozen_reason) AS frozen_reason FROM mirror_books b WHERE b.whale = 'rn1' AND b.state = 'closed' AND b.closed_at >= now() - interval '24 hours' GROUP BY b.condition_id), h AS (SELECT t.id, t.condition_id, t.ts, t.size, t.market_slug, (CASE WHEN t.asset = bk.long_asset THEN t.price ELSE 1 - t.price END) AS eff_px, (CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * (CASE WHEN t.asset = bk.long_asset THEN 1 WHEN t.asset = bk.other_asset OR bk.other_asset IS NULL THEN -1 ELSE 0 END) * (CASE WHEN bk.is_short THEN -1 ELSE 1 END) * t.size AS leg, (CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price) AS pnl FROM (SELECT d.* FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') d WHERE (d.source IN ('chain', 's1') OR NOT d.has_net) AND d.condition_id IN (SELECT condition_id FROM bk)) t JOIN bk ON bk.condition_id = t.condition_id LEFT JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id), hn AS (SELECT h.*, sum(h.leg) OVER (PARTITION BY h.condition_id ORDER BY h.ts, h.id) AS net_after FROM h), hp AS (SELECT condition_id, max(market_slug) AS his_slug, round(sum(pnl)::numeric, 2) AS his_pnl FROM h