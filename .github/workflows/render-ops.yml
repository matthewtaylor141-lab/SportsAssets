                league-census) SQL="SELECT split_part(identifier, '-', 2) AS lg, count(DISTINCT split_part(identifier, '-', 3) || '-' || split_part(identifier, '-', 4) || '-' || substring(identifier from '[0-9]{4}-[0-9]{2}-[0-9]{2}')) AS games, min(substring(question from ' in the (.+) match scheduled')) AS league_phrase, min(left(question, 100)) AS example_question, max(updated_at)::time(0) AS upd FROM us_premap WHERE identifier LIKE 'atc-%' AND (identifier LIKE '%-2026-09-05-%' OR identifier LIKE '%-2026-09-06-%' OR identifier LIKE '%-2026-09-07-%') AND question ILIKE '%win against%' GROUP BY 1 ORDER BY 1 LIMIT 200; SELECT key, left(value::text, 200) AS value FROM ingestion_state WHERE key LIKE '%premap%' ORDER BY key LIMIT 6;"; TO=30000 ;;
                # league-rows: (1) his EVENTS in those leagues over 30 h -- markets,
