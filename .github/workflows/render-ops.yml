                  SQL="SELECT b.id, b.us_market_slug AS slug, b.condition_id, b.whale, b.intent, b.state, b.frozen_reason, b.last_reason, b.opened_at::timestamp(0) AS opened, b.closed_at::timestamp(0) AS closed, b.ledger_net AS ledger, b.venue_net AS venue, b.target, round(b.his_net::numeric, 1) AS his_net, round(b.avg_cost::numeric, 4) AS avg_cost, round(b.gross_buy_usd::numeric, 2) AS gross_buy, round(b.gross_sell_usd::numeric, 2) AS gross_sell, round(b.realized_pnl::numeric, 2) AS realized, round(b.settled_pnl::numeric, 2) AS settled, b.standing_row_id AS row, left(COALESCE((b.last_plan->'hand')::text, ''), 160) AS hand, left(b.last_plan::text, 1200) AS last_plan FROM mirror_books b WHERE b.id = $BK; SELECT o.id, o.kind, o.side, o.tif, o.qty, o.wire, o.state, o.venue_state, o.filled, round(o.avg_px::numeric, 4) AS avg_px, left(o.reason, 40) AS reason, o.placed_at::time(0) AS placed, o.done_at::time(0) AS done FROM mirror_orders o WHERE o.book_id = $BK ORDER BY o.id; SELECT lo.id, lo.status, lo.side, round(lo.filled_shares::numeric, 2) AS shares, round(lo.fill_price::numeric, 4) AS fill_px, round(lo.filled_usd::numeric, 2) AS usd, round(lo.pnl::numeric, 2) AS pnl, lo.placed_at::timestamp(0) AS placed, lo.settled_at::timestamp(0) AS settled FROM live_orders lo WHERE lo.id = (SELECT standing_row_id FROM mirror_books WHERE id = $BK); SELECT t.ts::timestamp(0) AS his_ts, t.detected_at::timestamp(0) AS seen, t.side, round(t.size::numeric, 1) AS size, round(t.price::numeric, 4) AS px, round(t.notional::numeric, 2) AS usd, t.source, left(t.asset, 10) AS asset, CASE WHEN t.asset = b.long_asset THEN 'long' WHEN t.asset = b.other_asset THEN 'other' ELSE '?' END AS leg FROM trades t JOIN mirror_books b ON b.condition_id = t.condition_id JOIN whales w ON w.id = t.whale_id WHERE b.id = $BK AND lower(w.username) = lower(b.whale) ORDER BY t.ts LIMIT 80; SELECT r.at::timestamp(0) AS at, r.refusal, round(r.his_net::numeric, 1) AS his_net, r.target, r.mark, r.his_px, r.ask, r.books_live AS live, r.cand_reads AS reads, round(r.tick_s::numeric, 1) AS tick_s FROM mirror_candidate_refusals r JOIN mirror_books b ON b.condition_id = r.condition_id AND lower(r.whale) = lower(b.whale) WHERE b.id = $BK ORDER BY r.at DESC LIMIT 40; SELECT s.at::timestamp(0) AS judged, left(s.reason, 44) AS reason, round(s.his_net::numeric, 1) AS his_net, s.target, s.ledger_net AS ledger, s.venue_net AS venue, s.bid, s.ask, left(s.detail::text, 300) AS detail FROM mirror_shadow s JOIN mirror_books b ON b.condition_id = s.condition_id AND lower(s.whale) = lower(b.whale) WHERE b.id = $BK ORDER BY s.at DESC LIMIT 30; SELECT b2.id, b2.intent, b2.state, b2.frozen_reason, b2.last_reason, b2.opened_at::timestamp(0) AS opened, b2.closed_at::timestamp(0) AS closed, b2.ledger_net AS ledger, b2.venue_net AS venue, b2.target, round(b2.his_net::numeric, 1) AS his_net, round(b2.realized_pnl::numeric, 2) AS realized, round(b2.settled_pnl::numeric, 2) AS settled FROM mirror_books b2 JOIN mirror_books b ON b.condition_id = b2.condition_id AND lower(b2.whale) = lower(b.whale) WHERE b.id = $BK ORDER BY b2.id;"; TO=30000 ;;
                his-day) SQL="WITH his AS (SELECT t.condition_id, t.side, t.size, t.price, t.ts, COALESCE((m.resolved_prices->>mt.outcome_index)::numeric, NULL) AS rp, (m.resolved_prices IS NOT NULL) AS settled, EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = t.condition_id AND b.whale = 'rn1') AS ours FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '24 hours') SELECT CASE WHEN ours THEN 'markets we mirror' ELSE 'markets we do not mirror' END AS bucket, settled, count(DISTINCT condition_id) AS markets, count(*) AS fills, round(sum(size * price)::numeric, 0) AS usd_traded, round(sum(CASE WHEN settled THEN (CASE WHEN upper(side) = 'BUY' THEN 1 ELSE -1 END) * size * (rp - price) ELSE 0 END)::numeric, 0) AS his_settled_pnl FROM his GROUP BY 1, 2 ORDER BY 1, 2; SELECT left(COALESCE(max(t.market_slug), ''), 44) AS his_slug, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, round(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))::numeric, 0) AS his_pnl, EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = t.condition_id AND b.whale = 'rn1') AS ours FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '24 hours' AND m.resolved_prices IS NOT NULL GROUP BY t.condition_id ORDER BY abs(sum((CASE WHEN upper(t.side) = 'BUY' THEN 1 ELSE -1 END) * t.size * ((m.resolved_prices->>mt.outcome_index)::numeric - t.price))) DESC LIMIT 40;"; TO=60000 ;;
                # [R40] see .github/workflows/RENDER_OPS_NOTES.md
                his-board) SQL="WITH his AS (SELECT t.condition_id, t.side, t.size, t.price, t.ts, t.market_slug, (m.resolved_prices->>mt.outcome_index)::numeric AS rp, (m.resolved_prices IS NOT NULL) AS settled FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '24 hours'), hl AS (SELECT condition_id, max(ts) AS last_ts FROM his GROUP BY 1), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), cr AS (SELECT DISTINCT ON (r.condition_id) r.condition_id, r.refusal FROM mirror_candidate_refusals r LEFT JOIN hl ON hl.condition_id = r.condition_id WHERE r.whale = 'rn1' AND r.at >= now() - interval '30 hours' ORDER BY r.condition_id, (r.at <= hl.last_ts) DESC NULLS LAST, r.at DESC), sh AS (SELECT DISTINCT ON (s.condition_id) s.condition_id, s.reason, left(s.detail->>'explain', 40) AS explain FROM mirror_shadow s LEFT JOIN hl ON hl.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours' ORDER BY s.condition_id, (s.at <= hl.last_ts) DESC NULLS LAST, s.at DESC), x AS (SELECT h.condition_id, h.size, h.price, h.settled, split_part(COALESCE(h.market_slug, ''), '-', 1) AS league, CASE WHEN bk.condition_id IS NOT NULL THEN 'MIRRORED' WHEN cr.refusal = 'unmapped' THEN 'unmapped (no US contract bound)' WHEN cr.refusal IS NOT NULL THEN 'US board, refused: ' || cr.refusal ELSE 'never judged live: ' || COALESCE(sh.explain, sh.reason, '?') END AS bucket, (CASE WHEN upper(h.side) = 'BUY' THEN 1 ELSE -1 END) * h.size * (h.rp - h.price) AS pnl FROM his h LEFT JOIN bk ON bk.condition_id = h.condition_id LEFT JOIN cr ON cr.condition_id = h.condition_id LEFT JOIN sh ON sh.condition_id = h.condition_id) SELECT COALESCE(bucket, 'ALL') AS bucket, count(DISTINCT condition_id) AS markets, count(*) AS fills, round(sum(size * price)::numeric, 0) AS usd, count(DISTINCT CASE WHEN settled THEN condition_id END) AS settled_mkts, round(sum(CASE WHEN settled THEN size * price ELSE 0 END)::numeric, 0) AS usd_settled, round(sum(CASE WHEN settled THEN pnl ELSE 0 END)::numeric, 0) AS his_settled_pnl FROM x GROUP BY ROLLUP (bucket) ORDER BY bucket IS NULL, 4 DESC LIMIT 40; WITH his AS (SELECT t.condition_id, t.side, t.size, t.price, t.ts, t.market_slug, (m.resolved_prices->>mt.outcome_index)::numeric AS rp, (m.resolved_prices IS NOT NULL) AS settled FROM (SELECT t.*, bool_or(t.source IN ('chain', 's1')) OVER (PARTITION BY t.whale_id, COALESCE(lower(NULLIF(t.tx_hash, '')), 'row:' || t.id::text), t.asset, upper(t.side)) AS has_net FROM trades t WHERE t.whale_id IN (SELECT id FROM whales WHERE lower(username) = 'rn1') AND t.ts >= now() - interval '48 hours') t JOIN whales w ON w.id = t.whale_id JOIN market_tokens mt ON mt.token_id = t.asset LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND (t.source IN ('chain', 's1') OR NOT t.has_net) AND t.ts >= now() - interval '24 hours'), hl AS (SELECT condition_id, max(ts) AS last_ts FROM his GROUP BY 1), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), cr AS (SELECT DISTINCT ON (r.condition_id) r.condition_id, r.refusal FROM mirror_candidate_refusals r LEFT JOIN hl ON hl.condition_id = r.condition_id WHERE r.whale = 'rn1' AND r.at >= now() - interval '30 hours' ORDER BY r.condition_id, (r.at <= hl.last_ts) DESC NULLS LAST, r.at DESC), sh AS (SELECT DISTINCT ON (s.condition_id) s.condition_id, s.reason, left(s.detail->>'explain', 40) AS explain FROM mirror_shadow s LEFT JOIN hl ON hl.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours' ORDER BY s.condition_id, (s.at <= hl.last_ts) DESC NULLS LAST, s.at DESC), x AS (SELECT h.condition_id, h.size, h.price, h.settled, split_part(COALESCE(h.market_slug, ''), '-', 1) AS league, CASE WHEN bk.condition_id IS NOT NULL THEN 'MIRRORED' WHEN cr.refusal = 'unmapped' THEN 'unmapped (no US contract bound)' WHEN cr.refusal IS NOT NULL THEN 'US board, refused: ' || cr.refusal ELSE 'never judged live: ' || COALESCE(sh.explain, sh.reason, '?') END AS bucket, (CASE WHEN upper(h.side) = 'BUY' THEN 1 ELSE -1 END) * h.size * (h.rp - h.price) AS pnl FROM his h LEFT JOIN bk ON bk.condition_id = h.condition_id LEFT JOIN cr ON cr.condition_id = h.condition_id LEFT JOIN sh ON sh.condition_id = h.condition_id) SELECT league, COALESCE(bucket, 'ALL') AS bucket, count(DISTINCT condition_id) AS markets, count(*) AS fills, round(sum(size * price)::numeric, 0) AS usd, count(DISTINCT CASE WHEN settled THEN condition_id END) AS settled_mkts, round(sum(CASE WHEN settled THEN size * price ELSE 0 END)::numeric, 0) AS usd_settled, round(sum(CASE WHEN settled THEN pnl ELSE 0 END)::numeric, 0) AS his_settled_pnl FROM x WHERE bucket LIKE 'unmapped%' OR bucket = 'MIRRORED' GROUP BY league, ROLLUP (bucket) ORDER BY league, bucket IS NULL, 4 DESC LIMIT 80;"; TO=60000 ;;
                # [R41] see .github/workflows/RENDER_OPS_NOTES.md
                league-census) SQL="SELECT split_part(identifier, '-', 2) AS lg, count(DISTINCT split_part(identifier, '-', 3) || '-' || split_part(identifier, '-', 4) || '-' || substring(identifier from '[0-9]{4}-[0-9]{2}-[0-9]{2}')) AS games, min(substring(question from ' in the (.+) match scheduled')) AS league_phrase, min(left(question, 100)) AS example_question, max(updated_at)::time(0) AS upd FROM us_premap WHERE identifier LIKE 'atc-%' AND (identifier LIKE '%-2026-09-05-%' OR identifier LIKE '%-2026-09-06-%' OR identifier LIKE '%-2026-09-07-%') AND question ILIKE '%win against%' GROUP BY 1 ORDER BY 1 LIMIT 200; SELECT key, left(value::text, 200) AS value FROM ingestion_state WHERE key LIKE '%premap%' ORDER BY key LIMIT 6;"; TO=30000 ;;
                # [R42] see .github/workflows/RENDER_OPS_NOTES.md
                league-rows) SQL="WITH his AS (SELECT t.condition_id, t.market_slug, t.market_title, t.outcome, t.size * t.price AS usd, t.ts, regexp_replace(t.market_slug, '^([a-z0-9]+-[a-z0-9]+-[a-z0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}).*$', '\\1') AS ev, (split_part(t.market_slug, '-', 8) = '' AND split_part(t.market_slug, '-', 7) IN (split_part(t.market_slug, '-', 2), split_part(t.market_slug, '-', 3))) AS is_ml FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'itsb', 'col1', 'nor', 'gre1', 'bel1', 'ere', 'den', 'tur2', 'bra3', 'sui', 'cs2')), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, left(detail->>'explain', 44) AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '36 hours' ORDER BY condition_id, at DESC) SELECT h.ev, count(DISTINCT h.market_slug) AS mkts, round(sum(h.usd)::numeric, 0) AS usd, max(h.ts)::time(0) AS last_ts, string_agg(DISTINCT regexp_replace(h.market_slug, '^' || h.ev || '-', ''), ',') AS tails, max(h.market_title) FILTER (WHERE h.is_ml) AS ml_title, max(left(m.event_title, 44)) AS m_event_title, max(left(m.title, 30)) FILTER (WHERE h.is_ml) AS m_title, string_agg(DISTINCT COALESCE(sh.explain, '(never judged)'), ' | ') AS verdicts, max(sh.at)::time(0) AS judged FROM his h LEFT JOIN markets m ON m.condition_id = h.condition_id LEFT JOIN sh ON sh.condition_id = h.condition_id GROUP BY h.ev ORDER BY sum(h.usd) DESC LIMIT 60; WITH he AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS his_lg, substring(t.market_slug from position('-' in t.market_slug) + 1) AS rest FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'itsb', 'col1', 'nor', 'gre1', 'bel1', 'ere', 'den', 'tur2', 'bra3', 'sui', 'cs2')) SELECT he.his_lg, u.identifier, u.side_norm, u.intent, u.line, left(u.question, 100) AS question, u.updated_at::time(0) AS upd FROM he JOIN us_premap u ON u.identifier LIKE ('%-' || he.rest) ORDER BY he.his_lg, u.identifier, u.side_norm LIMIT 70; WITH he AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS his_lg, split_part(t.market_slug, '-', 2) || '-' || split_part(t.market_slug, '-', 3) || '-' || substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS suffix FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'itsb', 'col1', 'nor', 'gre1', 'bel1', 'ere', 'den', 'tur2', 'bra3', 'sui', 'cs2') AND t.market_slug ~ '^[a-z0-9]+-[a-z0-9]+-[a-z0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-') SELECT he.his_lg, u.identifier, u.side_norm, u.intent, left(u.question, 100) AS question, left(u.event_title, 40) AS v_event_title FROM he JOIN us_premap u ON u.identifier LIKE ('atc-%-' || he.suffix || '-%') WHERE u.identifier NOT LIKE '%-fh-%' AND u.identifier NOT LIKE '%-sh-%' ORDER BY he.his_lg, u.identifier, u.side_norm LIMIT 60; WITH nm AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS his_lg, substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS d, lower(trim(v.n)) AS his_name FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id CROSS JOIN LATERAL (VALUES (split_part(m.event_title, ' vs. ', 1)), (split_part(m.event_title, ' vs. ', 2)), (substring(t.market_title from '^Will (.+) win on '))) v(n) WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'itsb', 'col1', 'nor', 'gre1', 'bel1', 'ere', 'den', 'tur2', 'bra3', 'sui', 'cs2') AND length(trim(COALESCE(v.n, ''))) >= 3) SELECT nm.his_lg, nm.d, nm.his_name, u.identifier, u.side_norm, left(u.question, 100) AS question FROM nm JOIN us_premap u ON u.identifier LIKE 'atc-%' AND u.identifier LIKE ('%-' || nm.d || '-%') AND translate(lower(u.question), 'áéíóúàèìòùâêîôûãõçñäöüøłđ', 'aeiouaeiouaeiouaocnaouold') LIKE ('%' || translate(nm.his_name, 'áéíóúàèìòùâêîôûãõçñäöüøłđ', 'aeiouaeiouaeiouaocnaouold') || '%') ORDER BY nm.his_lg, nm.d, nm.his_name, u.identifier, u.side_norm LIMIT 90;"; TO=60000 ;;
                # [R43] see .github/workflows/RENDER_OPS_NOTES.md
                league-rows-por) SQL="SELECT m.slug, m.event_title, left(m.title, 44) AS title FROM markets m WHERE m.event_slug IN (SELECT DISTINCT t.event_slug FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'col1', 'nor', 'sui', 'itsb', 'den')) AND split_part(m.slug, '-', 8) = '' AND split_part(m.slug, '-', 7) IN (split_part(m.slug, '-', 2), split_part(m.slug, '-', 3), 'draw') ORDER BY m.slug LIMIT 60; SELECT identifier, side_norm, intent, left(question, 105) AS question, left(event_title, 44) AS v_event_title, updated_at::time(0) AS upd FROM us_premap WHERE identifier LIKE 'atc-%' AND split_part(identifier, '-', 2) IN ('ligpor', 'tsl', 'els', 'swsl') AND (identifier LIKE '%-2026-09-05-%' OR identifier LIKE '%-2026-09-06-%' OR identifier LIKE '%-2026-09-07-%') AND side_norm = 'yes' ORDER BY identifier LIMIT 90; WITH nm AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS his_lg, substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS d, lower(trim(v.n)) AS his_name FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id CROSS JOIN LATERAL (VALUES (split_part(m.event_title, ' vs. ', 1)), (split_part(split_part(m.event_title, ' vs. ', 2), ' - ', 1)), (substring(t.market_title from '^Will (.+) win on '))) v(n) WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '30 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('por', 'nor', 'sui', 'tur2', 'gre1', 'bel1', 'ere', 'bra3') AND length(trim(COALESCE(v.n, ''))) >= 3) SELECT nm.his_lg, nm.d, nm.his_name, u.identifier, u.side_norm, left(u.question, 100) AS question FROM nm JOIN us_premap u ON u.identifier LIKE 'atc-%' AND u.side_norm = 'yes' AND (u.identifier LIKE ('%-' || nm.d || '-%') OR u.identifier LIKE '%-2026-09-05-%' OR u.identifier LIKE '%-2026-09-07-%') AND translate(lower(u.question), 'áéíóúàèìòùâêîôûãõçñäöüøłđ', 'aeiouaeiouaeiouaocnaouold') LIKE ('%' || translate(nm.his_name, 'áéíóúàèìòùâêîôûãõçñäöüøłđ', 'aeiouaeiouaeiouaocnaouold') || '%') ORDER BY nm.his_lg, nm.d, nm.his_name, u.identifier LIMIT 120;"; TO=60000 ;;
                # [R44] see .github/workflows/RENDER_OPS_NOTES.md
                prefix-rows) SQL="WITH his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, max(t.market_title) AS his_title, max(m.event_title) AS event_title, string_agg(DISTINCT t.outcome, '/') AS outcomes, count(*) AS fills, round(sum(t.size * t.price)::numeric, 0) AS usd, max(t.ts)::time(0) AS last_ts, bool_or(m.resolved_prices IS NOT NULL) AS settled FROM trades t JOIN whales w ON w.id = t.whale_id LEFT JOIN markets m ON m.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('bra', 'arg', 'pol', 'scop', 'itsb', 'den', 'sui') AND (t.market_slug LIKE '%-total-%' OR t.market_slug LIKE '%-spread-%') GROUP BY t.condition_id), sh AS (SELECT DISTINCT ON (condition_id) condition_id, at, left(detail->>'explain', 44) AS explain FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC) SELECT h.his_slug, left(h.his_title, 60) AS his_title, left(h.event_title, 36) AS event_title, left(h.outcomes, 20) AS outcomes, h.fills, h.usd, h.last_ts, COALESCE(sh.explain, '(never judged)') AS explain, sh.at::time(0) AS judged, h.settled FROM his h LEFT JOIN sh ON sh.condition_id = h.condition_id ORDER BY h.usd DESC LIMIT 90; WITH ev AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS lg, split_part(t.market_slug, '-', 2) || '-' || split_part(t.market_slug, '-', 3) || '-' || substring(t.market_slug from '[0-9]{4}-[0-9]{2}-[0-9]{2}') AS game FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('bra', 'arg', 'pol', 'scop', 'itsb', 'den', 'sui') AND (t.market_slug LIKE '%-total-%' OR t.market_slug LIKE '%-spread-%')) SELECT e.lg AS his_lg, e.game, split_part(u.identifier, '-', 1) AS prefix, split_part(u.identifier, '-', 2) AS venue_lg, count(u.identifier) AS rows, min(u.identifier) AS example, max(u.identifier) AS example2 FROM ev e LEFT JOIN us_premap u ON u.identifier LIKE ('%-' || e.game || '%') GROUP BY 1, 2, 3, 4 ORDER BY 1, 2, 3 LIMIT 120; SELECT split_part(identifier, '-', 2) AS venue_lg, count(*) FILTER (WHERE identifier LIKE 'atc-%') AS atc, count(*) FILTER (WHERE identifier LIKE 'aec-%') AS aec, count(*) FILTER (WHERE identifier LIKE 'tsc-%') AS tsc, count(*) FILTER (WHERE identifier LIKE 'asc-%') AS asc, count(*) FILTER (WHERE identifier LIKE 'astatc-%') AS astatc, min(identifier) FILTER (WHERE identifier LIKE 'tsc-%') AS tsc_example, min(updated_at)::date AS oldest, max(updated_at)::time(0) AS upd FROM us_premap WHERE split_part(identifier, '-', 2) IN ('bra', 'lpa', 'ekst', 'scp', 'srb', 'den1', 'swsl', 'arg', 'pol', 'scop', 'itsb', 'den', 'sui', 'epl', 'sea', 'lal') GROUP BY 1 ORDER BY 1 LIMIT 40; SELECT split_part(t.market_slug, '-', 1) AS lg, CASE WHEN t.market_slug LIKE '%-spread-%' THEN 'spread' ELSE 'total' END AS family, count(DISTINCT t.condition_id) AS markets, round(sum(t.size * t.price)::numeric, 0) AS usd FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('bra', 'arg', 'pol', 'scop', 'itsb', 'den', 'sui') AND (t.market_slug LIKE '%-total-%' OR t.market_slug LIKE '%-spread-%') GROUP BY 1, 2 ORDER BY 4 DESC;"; TO=60000 ;;
