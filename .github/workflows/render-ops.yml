                # least one of his team codes: share = (va=a)(vb=b)(va=b)(vb=a) as four digits (1100 =
                # both codes his, identity / C2 alias; 1000 or 0100 = one code differs, the C5 case;
                # 0011 = his order reversed), the venue's stored event title (the lookup key C5 needs),
                # the full-game per-team atc rows count, the tsc lines, the full-game asc rows with the
                # side_norm the sweep wrote (digits = the pre-C3 rows), whether a btts row exists, and
                # the two per-team questions verbatim (the P4 witness). Then his events the venue
                # lists under NO code sharing either team code on that date.
                gap-soccer-venue) SQL="WITH ev AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS lg, split_part(t.market_slug, '-', 2) AS a, split_part(t.market_slug, '-', 3) AS b, split_part(t.market_slug, '-', 4) || '-' || split_part(t.market_slug, '-', 5) || '-' || split_part(t.market_slug, '-', 6) AS d FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('sea', 'lal', 'epl', 'bun', 'fl1', 'tur', 'swe', 'arg', 'scop', 'pol', 'sui', 'es2', 'itsb') AND t.market_slug ~ '^[a-z0-9]+-[a-z0-9]+-[a-z0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-'), u AS (SELECT identifier, split_part(identifier, '-', 1) AS kind, split_part(identifier, '-', 2) AS vlg, split_part(identifier, '-', 3) AS va, split_part(identifier, '-', 4) AS vb, split_part(identifier, '-', 5) || '-' || split_part(identifier, '-', 6) || '-' || split_part(identifier, '-', 7) AS vd, split_part(identifier, '-', 8) AS t8, split_part(identifier, '-', 9) AS t9, side_norm, intent, line, question, event_title, event_slug FROM us_premap WHERE (identifier LIKE '%-2026-09-06-%' OR identifier LIKE '%-2026-09-07-%') AND (identifier LIKE 'atc-%' OR identifier LIKE 'tsc-%' OR identifier LIKE 'asc-%' OR identifier LIKE 'astatc-%')) SELECT e.lg || '-' || e.a || '-' || e.b || '-' || e.d AS his_event, u.vlg || '-' || u.va || '-' || u.vb AS venue_event, concat((u.va = e.a)::int, (u.vb = e.b)::int, (u.va = e.b)::int, (u.vb = e.a)::int) AS share, left(max(u.event_title), 44) AS venue_event_title, count(*) FILTER (WHERE u.kind = 'atc' AND u.t8 IN (u.va, u.vb, 'draw')) AS atc_fg, string_agg(DISTINCT CASE WHEN u.kind = 'tsc' AND u.t9 = '' THEN u.t8 END, ',') AS tsc_lines, string_agg(DISTINCT CASE WHEN u.kind = 'asc' AND u.t8 IN ('neg', 'pos') THEN u.t8 || u.t9 || ':' || u.side_norm END, ',') AS asc_fg, bool_or(u.kind = 'astatc' AND u.t8 = 'btts') AS btts, max(CASE WHEN u.kind = 'atc' AND u.t8 = u.va THEN left(u.question, 120) END) AS q_a, max(CASE WHEN u.kind = 'atc' AND u.t8 = u.vb THEN left(u.question, 120) END) AS q_b FROM ev e JOIN u ON u.vd = e.d AND (u.va IN (e.a, e.b) OR u.vb IN (e.a, e.b)) GROUP BY 1, 2, 3 ORDER BY 1, 3 DESC LIMIT 110; WITH ev AS (SELECT DISTINCT split_part(t.market_slug, '-', 1) AS lg, split_part(t.market_slug, '-', 2) AS a, split_part(t.market_slug, '-', 3) AS b, split_part(t.market_slug, '-', 4) || '-' || split_part(t.market_slug, '-', 5) || '-' || split_part(t.market_slug, '-', 6) AS d FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' AND split_part(COALESCE(t.market_slug, ''), '-', 1) IN ('sea', 'lal', 'epl', 'bun', 'fl1', 'tur', 'swe', 'arg', 'scop', 'pol', 'sui', 'es2', 'itsb') AND t.market_slug ~ '^[a-z0-9]+-[a-z0-9]+-[a-z0-9]+-[0-9]{4}-[0-9]{2}-[0-9]{2}-') SELECT e.lg || '-' || e.a || '-' || e.b || '-' || e.d AS his_event_unlisted FROM ev e WHERE NOT EXISTS (SELECT 1 FROM us_premap u2 WHERE u2.identifier LIKE ('%-' || e.d || '-%') AND (split_part(u2.identifier, '-', 3) IN (e.a, e.b) OR split_part(u2.identifier, '-', 4) IN (e.a, e.b))) ORDER BY 1 LIMIT 40;"; TO=60000 ;;
                # THE 'NO MARK: BOOK UNREADABLE' BUCKET (2026-09-07 13:5xZ, the coverage census:
                # $418k / 61 mapped markets in 24 h whose latest shadow verdict is 'no mark').
                # A no-mark row is one of three venue readings (mirror_shadow.py:1929-1979):
                # an empty book (a terminal state, or OPEN with no makers), a one-sided
                # book (a bid and no ask: the mark reads the ask only), or a read that
                # raised (bbo_error). The census keys the LATEST verdict, written ~20 min
                # after his last fill, so it says nothing about the market while he traded.
                # Since W1 / R1 the shadow names the reading itself ('no mark: venue state
                # <STATE>', 'no mark: bid only <px>', 'no mark: empty open book', 'no mark:
                # read failed <Exc>', 'no mark: no state, empty'): every read here keys the
                # PREFIX 'no mark:' so the older 'book unreadable' rows still match.
                # 1: the bucket by the venue's own state / sides / error on that latest row;
                # 2: per market, every shadow row in 30 h classified (two-sided OPEN reads,
                # one-sided, empty-open, terminal, halted-not-terminal, raised, no state) with
                # the first two-sided OPEN read vs his first/last fill and the game start;
                # 3: the verbatim rows of the six largest; 4: his fills by minute on those six;
                # 5: the live heartbeat's whole census (the mirror-tick preset cuts it at
                # 2400 chars) and the loss-stop key. Reads only, LIMITed.
                # PLANNED-UNOPENED (2026-09-07, the 'planned_unopened' investigator): the
                # markets the shadow planned a leg on (would_side set, two-sided OPEN book)
                # while he traded, on which the LIVE lane opened no book of any state. The
                # lane's per-candidate refusal is not persisted, so this reads the nearest
                # evidence. 1: per market -- his window and dollars, which of his two
                # tokens the shadow named long/other, WHEN his first fill on the venue's
                # long-side token landed (before it the fills sit only on the short-side
                # token and map_market hands the live lane long_asset=None: the silent
                # `if not la: return` at mirror_live._tick_candidate), the count of during-
                # window shadow rows with long_asset NULL vs set, the reasons over the
                # window, the venue's us_premap sides/intents for the identifier, the token
                # catalogue, our live_orders on his tokens (the ledger lane and the
                # slug_recent_copy/legacy_row referees), and how many of his conditions
                # were active (6 h lookback) at his first fill (the newest-first walk's
                # MAX_MARKETS_PER_TICK=40 candidate cap). 2: every loss-stop trip the
                # order rows remember (reason mirror_loss_stop, by half hour) beside the
                # books opened per hour (when the lane was opening books at all). 3: the
                # shadow's rows through his window on the six largest, one in ten plus the
                # first and last, with long_asset, his_long/his_other, target, would_side.
                # Reads only, LIMITed.
                planned-unopened) SQL="WITH his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, us_market_slug, long_asset, other_asset, reason FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), tgt AS (SELECT h.*, sh0.us_market_slug AS us_slug, sh0.long_asset AS la0, sh0.other_asset AS oa0 FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id WHERE NOT EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = h.condition_id) AND h.usd > 0 ORDER BY h.usd DESC LIMIT 70), sla AS (SELECT s.condition_id, s.long_asset FROM mirror_shadow s JOIN tgt ON tgt.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours' AND s.long_asset IS NOT NULL ORDER BY s.at LIMIT 100000), lat AS (SELECT condition_id, min(long_asset) AS la FROM sla GROUP BY 1), tf AS (SELECT t.condition_id, min(t.ts) FILTER (WHERE t.asset = lat.la) AS first_long_fill, count(DISTINCT t.asset) AS n_assets, round(sum(t.size) FILTER (WHERE t.asset = lat.la AND upper(t.side) = 'BUY')::numeric, 0) AS long_buy_sh, round(sum(t.size) FILTER (WHERE t.asset <> lat.la AND upper(t.side) = 'BUY')::numeric, 0) AS other_buy_sh FROM trades t JOIN whales w ON w.id = t.whale_id JOIN lat ON lat.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' GROUP BY 1), dur AS (SELECT s.condition_id, count(*) AS n_dur, count(*) FILTER (WHERE s.long_asset IS NULL) AS n_la_null, min(s.at) FILTER (WHERE s.long_asset IS NOT NULL) AS la_first_set, count(*) FILTER (WHERE s.would_side IS NOT NULL) AS n_planned, count(*) FILTER (WHERE s.target < 0) AS n_tgt_neg, count(*) FILTER (WHERE s.target > 0) AS n_tgt_pos, mode() WITHIN GROUP (ORDER BY left(s.reason, 26)) AS reason_mode, min(s.reason) FILTER (WHERE s.would_side IS NOT NULL) AS a_planned_reason FROM mirror_shadow s JOIN tgt ON tgt.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= tgt.first_ts - interval '2 minutes' AND s.at <= tgt.last_ts GROUP BY 1), act AS (SELECT tgt.condition_id, (SELECT count(DISTINCT t2.condition_id) FROM trades t2 JOIN whales w2 ON w2.id = t2.whale_id WHERE lower(w2.username) = 'rn1' AND t2.ts >= tgt.first_ts - interval '6 hours' AND t2.ts <= tgt.first_ts) AS active_at_first FROM tgt) SELECT left(tgt.his_slug, 30) AS his_slug, left(tgt.us_slug, 34) AS us_slug, round(tgt.usd::numeric, 0) AS usd, tgt.first_ts::time(0) AS his_first, tgt.last_ts::time(0) AS his_last, tf.n_assets, tf.long_buy_sh, tf.other_buy_sh, tf.first_long_fill::time(0) AS first_long_fill, dur.n_dur, dur.n_la_null, dur.la_first_set::time(0) AS la_first_set, dur.n_planned, dur.n_tgt_neg, dur.n_tgt_pos, dur.reason_mode, (SELECT string_agg(p.side_norm || ':' || right(p.intent, 5), ' ' ORDER BY p.side_norm) FROM us_premap p WHERE p.identifier = tgt.us_slug) AS premap_sides, (SELECT string_agg(mt.outcome_index || '=' || left(mt.outcome, 8), ' ' ORDER BY mt.outcome_index) FROM market_tokens mt WHERE mt.condition_id = tgt.condition_id) AS tokens, (SELECT count(*) FROM live_orders lo WHERE lo.asset IN (tgt.la0, tgt.oa0)) AS n_live_orders, (SELECT count(*) FROM live_orders lo WHERE lo.us_market_slug = tgt.us_slug AND lo.placed_at >= now() - interval '48 hours') AS n_slug_orders, m.closed, (m.resolved_prices IS NOT NULL) AS resolved, act.active_at_first FROM tgt LEFT JOIN tf ON tf.condition_id = tgt.condition_id LEFT JOIN dur ON dur.condition_id = tgt.condition_id LEFT JOIN act ON act.condition_id = tgt.condition_id LEFT JOIN markets m ON m.condition_id = tgt.condition_id ORDER BY tgt.usd DESC LIMIT 70; SELECT date_trunc('hour', o.done_at) + (floor(extract(minute FROM o.done_at) / 30) * interval '30 minutes') AS half_hour, count(*) AS cancelled_under_stop, min(o.done_at)::time(0) AS first_at, max(o.done_at)::time(0) AS last_at, count(DISTINCT o.book_id) AS books FROM mirror_orders o WHERE o.reason = 'mirror_loss_stop' AND o.done_at >= now() - interval '48 hours' GROUP BY 1 ORDER BY 1 LIMIT 100; SELECT date_trunc('hour', b.opened_at) AS hour, count(*) AS books_opened, count(*) FILTER (WHERE b.intent = 'ORDER_INTENT_BUY_SHORT') AS short_books, count(*) FILTER (WHERE b.his_net < 0) AS his_net_neg, min(b.id) AS first_id, max(b.id) AS last_id FROM mirror_books b WHERE b.opened_at >= now() - interval '48 hours' GROUP BY 1 ORDER BY 1 LIMIT 60; WITH his AS (SELECT t.condition_id, max(t.market_slug) AS his_slug, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1), top AS (SELECT h.* FROM his h WHERE NOT EXISTS (SELECT 1 FROM mirror_books b WHERE b.condition_id = h.condition_id) AND h.his_slug NOT LIKE 'cfb-%' AND EXISTS (SELECT 1 FROM mirror_shadow s WHERE s.whale = 'rn1' AND s.condition_id = h.condition_id AND s.would_side IS NOT NULL AND s.at >= now() - interval '30 hours') ORDER BY h.usd DESC LIMIT 6), r AS (SELECT s.condition_id, s.at, s.reason, s.long_asset, s.other_asset, s.his_long, s.his_other, s.his_net, s.target, s.would_side, s.would_px, s.bid, s.ask, s.detail->>'his_paired_sh' AS paired, s.detail->>'map' AS map, row_number() OVER (PARTITION BY s.condition_id ORDER BY s.at) AS rn, count(*) OVER (PARTITION BY s.condition_id) AS n FROM mirror_shadow s JOIN top ON top.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= top.first_ts - interval '2 minutes' AND s.at <= top.last_ts + interval '2 minutes') SELECT left(top.his_slug, 28) AS his_slug, r.at::time(0) AS at, left(r.reason, 30) AS reason, (r.long_asset IS NULL) AS la_null, left(r.long_asset, 6) AS la, left(r.other_asset, 6) AS oa, round(r.his_long::numeric, 0) AS his_long, round(r.his_other::numeric, 0) AS his_other, round(r.his_net::numeric, 0) AS his_net, r.target, r.would_side, r.would_px, r.bid, r.ask, r.paired, r.map FROM r JOIN top ON top.condition_id = r.condition_id WHERE r.rn = 1 OR r.rn = r.n OR r.rn % 10 = 0 ORDER BY top.usd DESC, r.at LIMIT 150;"; TO=120000 ;;
                unread-rows) SQL="WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1') SELECT h.league, sh0.family, COALESCE(sh0.state, '(none)') AS state, (sh0.bid IS NOT NULL) AS has_bid, (sh0.ask IS NOT NULL) AS has_ask, COALESCE(sh0.bbo_error, '') AS bbo_error, count(*) AS markets, round(sum(h.usd)::numeric, 0) AS usd, round(avg(EXTRACT(EPOCH FROM (sh0.at - h.last_ts)) / 60.0)::numeric, 1) AS judged_min_after_his_last FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason LIKE 'no mark:%' GROUP BY 1, 2, 3, 4, 5, 6 ORDER BY 8 DESC LIMIT 60; WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), tgt AS (SELECT h.*, sh0.family, sh0.us_market_slug FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason LIKE 'no mark:%'), r AS (SELECT s.condition_id, s.at, s.reason, s.bid, s.ask, s.target, s.his_net, s.detail->>'state' AS state, s.detail->>'bbo_error' AS err, s.detail->>'snap_state' AS snap FROM mirror_shadow s JOIN tgt ON tgt.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours') SELECT left(tgt.his_slug, 34) AS his_slug, left(tgt.us_market_slug, 36) AS us_slug, tgt.fills, round(tgt.usd::numeric, 0) AS usd, tgt.first_ts::time(0) AS his_first, tgt.last_ts::time(0) AS his_last, mst.game_start::time(0) AS gstart, m.closed, (m.resolved_prices IS NOT NULL) AS resolved, count(r.at) AS n, min(r.at)::time(0) AS sh_first, max(r.at)::time(0) AS sh_last, left((array_agg(r.reason ORDER BY r.at))[1], 26) AS first_reason, count(*) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL) AS n_open2, min(r.at) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL)::time(0) AS open2_first, max(r.at) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL)::time(0) AS open2_last, count(*) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND (r.bid IS NULL) <> (r.ask IS NULL)) AS n_1side, count(*) FILTER (WHERE r.state = 'MARKET_STATE_OPEN' AND r.bid IS NULL AND r.ask IS NULL) AS n_open0, count(*) FILTER (WHERE r.state IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION')) AS n_term, min(r.at) FILTER (WHERE r.state IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION'))::time(0) AS term_first, count(*) FILTER (WHERE r.state IS NOT NULL AND r.state <> 'MARKET_STATE_OPEN' AND r.state NOT IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION')) AS n_halt, string_agg(DISTINCT r.state, ',') FILTER (WHERE r.state IS NOT NULL AND r.state <> 'MARKET_STATE_OPEN' AND r.state NOT IN ('MARKET_STATE_EXPIRED','MARKET_STATE_CLOSED','MARKET_STATE_TERMINATED','MARKET_STATE_MATCH_AND_CLOSE_AUCTION')) AS halt_states, count(*) FILTER (WHERE r.err IS NOT NULL) AS n_err, count(*) FILTER (WHERE r.state IS NULL AND r.err IS NULL) AS n_nostate, count(*) FILTER (WHERE r.at <= tgt.last_ts) AS n_during, count(*) FILTER (WHERE r.at <= tgt.last_ts AND r.state = 'MARKET_STATE_OPEN' AND r.bid IS NOT NULL AND r.ask IS NOT NULL) AS n_during_open2 FROM tgt LEFT JOIN r ON r.condition_id = tgt.condition_id LEFT JOIN market_starts mst ON mst.condition_id = tgt.condition_id LEFT JOIN markets m ON m.condition_id = tgt.condition_id GROUP BY tgt.condition_id, tgt.his_slug, tgt.us_market_slug, tgt.fills, tgt.usd, tgt.first_ts, tgt.last_ts, mst.game_start, m.closed, m.resolved_prices ORDER BY tgt.usd DESC LIMIT 70; WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), tgt AS (SELECT h.*, sh0.family, sh0.us_market_slug FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason LIKE 'no mark:%'), top AS (SELECT * FROM tgt ORDER BY usd DESC LIMIT 6) SELECT s.at::time(0) AS at, left(s.us_market_slug, 36) AS us_slug, left(s.reason, 40) AS reason, s.detail->>'state' AS state, s.bid, s.ask, s.detail->>'bbo_error' AS err, round(s.his_net::numeric, 1) AS his_net, s.target, s.detail->>'snap_state' AS snap, top.last_ts::time(0) AS his_last FROM mirror_shadow s JOIN top ON top.condition_id = s.condition_id WHERE s.whale = 'rn1' AND s.at >= now() - interval '30 hours' ORDER BY top.usd DESC, s.at LIMIT 160; WITH his AS (SELECT t.condition_id, split_part(COALESCE(t.market_slug, ''), '-', 1) AS league, max(t.market_slug) AS his_slug, count(*) AS fills, sum(t.size * t.price) AS usd, min(t.ts) AS first_ts, max(t.ts) AS last_ts FROM trades t JOIN whales w ON w.id = t.whale_id WHERE lower(w.username) = 'rn1' AND t.condition_id IS NOT NULL AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2), sh0 AS (SELECT DISTINCT ON (condition_id) condition_id, at, us_market_slug, reason, bid, ask, detail->>'state' AS state, detail->>'bbo_error' AS bbo_error, detail->>'family' AS family FROM mirror_shadow WHERE whale = 'rn1' AND at >= now() - interval '30 hours' ORDER BY condition_id, at DESC), bk AS (SELECT DISTINCT condition_id FROM mirror_books WHERE whale = 'rn1'), tgt AS (SELECT h.*, sh0.family, sh0.us_market_slug FROM his h JOIN sh0 ON sh0.condition_id = h.condition_id LEFT JOIN bk ON bk.condition_id = h.condition_id WHERE bk.condition_id IS NULL AND sh0.reason LIKE 'no mark:%'), top AS (SELECT * FROM tgt ORDER BY usd DESC LIMIT 6) SELECT left(top.his_slug, 34) AS his_slug, date_trunc('minute', t.ts)::time(0) AS minute, count(*) AS fills, round(sum(t.size)::numeric, 0) AS shares, round(sum(t.size * t.price)::numeric, 0) AS usd, round(avg(t.price)::numeric, 3) AS avg_px, string_agg(DISTINCT upper(t.side), ',') AS sides FROM trades t JOIN whales w ON w.id = t.whale_id JOIN top ON top.condition_id = t.condition_id WHERE lower(w.username) = 'rn1' AND t.ts >= now() - interval '24 hours' GROUP BY 1, 2 ORDER BY 1, 2 LIMIT 120; SELECT h.service, e.key, e.value FROM service_heartbeats h, jsonb_each_text(h.detail->'census') e WHERE h.service = 'mirror_live' AND e.value <> '0' ORDER BY 2; SELECT key, left(value::text, 300) AS value FROM ingestion_state WHERE key IN ('mirror_loss_stop', 'mirror_live', 'mirror_live_whales') ORDER BY key;"; TO=60000 ;;
                # THE COVERAGE CENSUS KEYS THE VERDICT AT HIS LAST FILL (W1 / R3, 2026-09-07).
                # `sh` was the NEWEST shadow row per market, written 44-83 min after his
                # last fill on a market the venue had expired, so $385k of two-sided OPEN
                # markets printed under 'no mark' (gap_book_unreadable.md section 0). Now:
                # per market, the newest row at or before his last fill in the window whose
