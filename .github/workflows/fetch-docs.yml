name: fetch-docs

# READ-ONLY. Fetches one public documentation page from the GitHub runner
# (which has open internet; the desk's session container does not) and
# prints it as text so the desk can read a venue's public docs. No
# secrets, no repository writes, no venue credentials, no deploy.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "public https URL to fetch (docs pages only)"
        required: true
        type: string
      # A DCM's settlement rules live in its rulebook, which is a PDF, so an
      # HTML-only reader cannot read the one document that matters most. The
      # filter keeps a 200-page rulebook usable: without it the extract is
      # truncated to the first pages and the settlement section is never
      # reached.
      filter:
        description: "optional grep -E pattern; prints matching lines with context instead of the head"
        required: false
        type: string
      context:
        description: "lines of context around each filter match (default 4)"
        required: false
        default: "4"
        type: string

concurrency:
  group: fetch-docs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch
        env:
          URL: ${{ inputs.url }}
          FILTER: ${{ inputs.filter }}
          CTX: ${{ inputs.context }}
        run: |
          set -euo pipefail
          case "$URL" in
            https://*) ;;
            *) echo "refused: https only (got '$URL')"; exit 1 ;;
          esac
          echo "== fetch $URL at $(date -u +%FT%TZ) =="
          curl -sSL --max-time 60 -A "sportsassets-docs-reader" "$URL" -o /tmp/page.html
          echo "== bytes: $(wc -c < /tmp/page.html) =="
          echo "== sha256: $(sha256sum /tmp/page.html | cut -d' ' -f1) =="
          # PDF BRANCH. Detected by magic bytes, not by the URL's extension:
          # the rulebook is served from a path with no .pdf suffix.
          if head -c 5 /tmp/page.html | grep -q '%PDF'; then
            echo "== content: PDF =="
            sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
            pdftotext -layout /tmp/page.html /tmp/page.txt
            echo "== pages: $(pdfinfo /tmp/page.html 2>/dev/null | awk '/^Pages/{print $2}') =="
            echo "== chars: $(wc -c < /tmp/page.txt) =="
            if [ -n "${FILTER:-}" ]; then
              echo "== FILTERED on /$FILTER/ with ${CTX:-4} lines of context =="
              grep -nEi -C "${CTX:-4}" -- "$FILTER" /tmp/page.txt | head -c 200000 || \
                echo "(no line matched)"
            else
              echo "== TEXT (head) =="
              head -c 60000 /tmp/page.txt
            fi
            exit 0
          fi
          # ZIP BRANCH. The venue publishes its gRPC .proto definitions as a
          # zip (the "Download Proto Files" link on
          # /streaming-endpoints/proto-reference), and an HTML reader turns a
          # zip into noise. Detected by magic bytes. Lists every entry with
          # its sha256, then prints the TEXT of the .proto entries whose path
          # matches the filter (all .proto entries when no filter is given).
          # Nothing is executed; nothing is extracted beyond reading in memory.
          if head -c 2 /tmp/page.html | grep -q 'PK'; then
            echo "== content: ZIP =="
            python3 - <<'PY'
          import hashlib, os, re, zipfile
          z = zipfile.ZipFile('/tmp/page.html')
          flt = os.environ.get('FILTER') or ''
          print("== ENTRIES ==")
          for i in z.infolist():
              b = z.read(i.filename) if not i.is_dir() else b''
              print("%-90s %8d %s" % (i.filename, i.file_size,
                                       hashlib.sha256(b).hexdigest()))
          for i in z.infolist():
              n = i.filename
              if i.is_dir() or not n.endswith('.proto'):
                  continue
              if flt and not re.search(flt, n):
                  continue
              b = z.read(n)
              print("== FILE %s sha256=%s bytes=%d ==" % (
                  n, hashlib.sha256(b).hexdigest(), len(b)))
              print(b.decode('utf-8', errors='replace'))
              print("== END FILE %s ==" % n)
          PY
            exit 0
          fi
          echo "== content: HTML =="
          python3 - <<'PY'
          import html, re
          s = open('/tmp/page.html', encoding='utf-8', errors='ignore').read()
          s = re.sub(r'(?is)<(script|style|noscript)[^>]*>.*?</\1>', ' ', s)
          links = re.findall(r'href="([^"]+)"', s)
          s = re.sub(r'(?i)<br\s*/?>|</p>|</div>|</li>|</h[1-6]>|</tr>|</pre>', '\n', s)
          s = re.sub(r'<[^>]+>', ' ', s)
          s = html.unescape(s)
          s = re.sub(r'[ \t]+', ' ', s)
          s = re.sub(r'\n\s*\n+', '\n', s)
          print("== TEXT ==")
          print(s[:60000])
          print("== LINKS ==")
          for l in sorted(set(links))[:400]:
              print(l)
          PY
