name: fetch-docs

# Fetches one public documentation page from the GitHub runner (which has
# open internet; the desk's session container does not) and prints it as
# text so the desk can read a venue's public docs. No secrets, no venue
# credentials, no deploy.
#
# ONE REPOSITORY WRITE, AND ONLY ONE. The `#stream` mode appends the
# filtered Time & Sales rows to an ORPHAN branch, `claude/tape-data`,
# under `tape/`. Nothing else is ever written, no other branch is ever
# pushed to, and the orphan branch carries no code -- so there is
# nothing on it any service could deploy.
#
# WHY A BRANCH AND NOT AN ARTIFACT. Workflow artifacts and raw job logs
# are both served from *.blob.core.windows.net, and this organization's
# egress policy answers CONNECT to that host with 403. An artifact the
# analysis container cannot open is not a retrieval. api.github.com and
# git-over-https to github.com both work, so the rows travel by branch.
# The previous header said "no repository writes"; that is no longer
# true and saying so would be the kind of check that cannot fail.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "public https URL to fetch (docs pages only)"
        required: true
        type: string

# CONCURRENCY IS PER-URL, NOT GLOBAL.
#
# A single `group: fetch-docs` meant that dispatching eight
# files in quick succession CANCELLED four of them: with
# cancel-in-progress false GitHub keeps one running and one
# pending, and each new arrival evicts the previous pending
# run. Four cancelled runs is not four retrieved files, and a
# cancelled run must never be mistaken for an empty one.
concurrency:
  group: fetch-docs-${{ inputs.url }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # ONLY to push tape/ to claude/tape-data
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          # A URL FRAGMENT SELECTS A MODE, and it is never sent to the
          # server. This job's ONE input is `url`, and its input schema
          # is fixed by the copy of this file on the default branch --
          # so a new input cannot be added without touching production.
          # A fragment rides along inside the existing input.
          #
          #   ...-schema.json#op=/v1/order/preview   extract that
          #                                          operation and every
          #                                          schema it $refs
          #   ...20260913-time-and-sales.csv#stream  stream, filter to
          #                                          our markets, emit an
          #                                          artifact
          URL_NOFRAG="${URL%%#*}"
          FRAG=""
          case "$URL" in *"#"*) FRAG="${URL#*#}" ;; esac
          export FRAG URL_NOFRAG
          case "$URL_NOFRAG" in
            https://*) ;;
            *) echo "refused: https only (got '$URL_NOFRAG')"; exit 1 ;;
          esac
          echo "== fetch $URL_NOFRAG at $(date -u +%FT%TZ) == frag='$FRAG'"
          mkdir -p out
          if [ "$FRAG" = "stream" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/timesales_stream.py"
            exit 0
          fi
          curl -sSL --max-time 300 -A "sportsassets-docs-reader" "$URL_NOFRAG" -o /tmp/page.html
          echo "== bytes: $(wc -c < /tmp/page.html) =="
          if [ -n "$FRAG" ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/schema_extract.py"
          fi
          python3 - <<'PY'
          import html, re
          s = open('/tmp/page.html', encoding='utf-8', errors='ignore').read()
          # SCRIPT SOURCES AND IN-SCRIPT URLS, captured BEFORE the
          # scripts are stripped. A JS-rendered index -- the Time &
          # Sales file list is one -- keeps its real data URLs inside a
          # bundle or an inline fetch(), and stripping scripts first
          # threw exactly those away. Still read-only, still one page.
          scripts = re.findall(r'<script[^>]+src="([^"]+)"', s)
          inline = re.findall(
              r'(?is)<script(?![^>]*\ssrc=)[^>]*>(.*?)</script>', s)
          urlish = re.compile(
              r'["\'`]([^"\'`\s<>]*(?:\.json|\.csv|/api/|/reports?/)'
              r'[^"\'`\s<>]*)["\'`]')
          inline_urls = []
          for blk in inline:
              inline_urls += urlish.findall(blk)
          s = re.sub(r'(?is)<(script|style|noscript)[^>]*>.*?</\1>', ' ', s)
          links = re.findall(r'href="([^"]+)"', s)
          s = re.sub(r'(?i)<br\s*/?>|</p>|</div>|</li>|</h[1-6]>|</tr>|</pre>', '\n', s)
          s = re.sub(r'<[^>]+>', ' ', s)
          s = html.unescape(s)
          s = re.sub(r'[ \t]+', ' ', s)
          s = re.sub(r'\n\s*\n+', '\n', s)
          print("== TEXT ==")
          print(s[:60000])
          print("== SCRIPTS ==")
          for l in sorted(set(scripts))[:100]:
              print(l)
          print("== IN-SCRIPT URLS ==")
          for l in sorted(set(inline_urls))[:200]:
              print(l)
          print("== LINKS ==")
          for l in sorted(set(links))[:400]:
              print(l)
          PY

      - name: Publish the filtered tape to the orphan data branch
        if: success()
        env:
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          case "$URL" in *"#stream") ;; *) echo "not stream mode; nothing to publish"; exit 0 ;; esac
          if ! ls out/*.filtered.csv.gz >/dev/null 2>&1; then
            echo "REFUSED: stream mode produced no filtered file"; exit 1
          fi
          NAME="$(basename "$(ls out/*.filtered.csv.gz | head -1)")"
          git config user.email "actions@github.com"
          git config user.name "fetch-docs tape"
          # The tape lives on an ORPHAN branch so it shares no history
          # with any code branch and cannot be deployed by anything.
          stage() {
            mkdir -p tape
            cp out/*.filtered.csv.gz out/*.report.json tape/
            git add -A tape
            git commit -q -m "tape: ${NAME}" || true
          }
          # Concurrent dispatches race on one branch; each writes its own
          # filenames, so re-basing onto whatever landed first is safe.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if git fetch --depth 1 origin claude/tape-data 2>/dev/null; then
              git checkout -qf -B tape FETCH_HEAD
            else
              git checkout -q --orphan tape
              git rm -rq --cached . 2>/dev/null || true
            fi
            stage
            if git push -q origin tape:claude/tape-data 2>&1; then
              echo "pushed ${NAME} on attempt ${attempt}"; ok=1; break
            fi
            echo "push attempt ${attempt} lost the race; retrying"
            sleep $(( attempt * 5 ))
          done
          [ "$ok" = "1" ] || { echo "FAILED: could not publish ${NAME}"; exit 1; }

      - name: Upload artifacts when a mode produced them
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-docs-out
          path: out/
          if-no-files-found: ignore
          retention-days: 7
