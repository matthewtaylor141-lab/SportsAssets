# COMMAND DEPLOYMENT ACCEPTANCE TEST, run from OUTSIDE.
#
# Owner directive 2026-09-19, section 17: "Before reporting complete,
# verify the PRODUCTION URL, not localhost."
#
# The build container has no egress to bettortoken.com or to the API
# host -- every request returns connect_rejected at the proxy -- so a
# claim that production works could not be made from there without
# guessing. This runner can reach both, so the verification happens
# here and its output is the evidence.
#
# IT READS ONLY, WITH TWO OPT-IN EXCEPTIONS. Every request below is a GET
# of a public asset or a probe of an API route -- except two steps, both
# off by default:
#   * `arm_external`, which when explicitly set to on/off POSTs the
#     external-valuation shadow's control row -- a shadow experiment's
#     arm/stop, which places no order;
#   * `seed_acceptance`, which when set to `on` POSTs the
#     acceptance-position route and writes ONE rn1x_positions row on a
#     covered market, labelled ACCEPTANCE_SYNTHETIC_MODELLED_ENTRY, so the
#     position manager can be demonstrated on inventory whose inputs
#     exist. It submits no order and moves no capital.
# Both are called out here rather than left to be discovered, because a
# header comment that says "nothing is posted" while something posts is
# worse than no comment at all.
#
# A 401 FROM THE API IS A PASS, NOT A FAILURE. It is the proof that the
# shadow routes are behind the COMMAND session rather than open to the
# internet, which is the single most important thing to confirm about a
# newly published data contract.

name: command-verify

on:
  workflow_dispatch:
    inputs:
      host:
        description: "COMMAND host to verify"
        required: false
        default: "command.bettortoken.com"
      base:
        description: >-
          Path prefix the COMMAND assets sit under on this host.
          EMPTY for command.bettortoken.com, where the netlify host
          rule already rewrites the whole site into /command/ -- asking
          there for /command/shadow.js asks for /command/command/shadow.js
          and correctly 404s. Use /command for www.bettortoken.com.
        required: false
        default: ""
      api:
        description: "API origin behind the proxy"
        required: false
        default: "https://sportsassets-api.onrender.com"
      book_protocol:
        description: >-
          on|blank. `on` reads the venue's DOCUMENTED public endpoints directly
          from the runner -- the Markets WebSocket documentation page and
          GET https://gateway.polymarket.us/v1/markets/{slug}/book -- and prints
          the raw response headers, the payload's own field names, and a
          conditional revalidation exchange. It needs NO deployment: these are
          public reads, and waiting for a backend release to inspect public
          response headers was a dependency I invented. Production integration
          still needs its own gated deploy; this only settles what the protocol
          provides. Read-only, no credential, no account.
        required: false
        default: ""
      book_protocol_slugs:
        description: >-
          Comma-separated venue market slugs for the book read. Blank lists
          markets from the public catalogue first and takes the first few.
        required: false
        default: ""
      credential_capability:
        description: >-
          on|blank. `on` reads the venue's PUBLISHED AUTHENTICATION AND API-KEY
          documentation and reports, verbatim, what provisioning choices and
          permission scopes it actually describes. This exists because I asserted
          that a READ-ONLY key option exists and cited the retail authentication
          page as the support. That page describes API-key authentication; it does
          NOT thereby establish that a read-only scope is offered, and those are
          different claims. So the question is settled by reading the pages and
          printing what they say -- including "this page does not answer it".
          Read-only, NO CREDENTIAL IS SENT, no account is touched, and order
          authority is NEVER tested by sending an order.
        required: false
        default: ""
      fee_docs:
        description: >-
          on|blank. `on` retrieves the venue's OFFICIAL published fee
          documentation and prints the rounding rule, the cumulative
          taker-fill treatment, the effective date and the execution-report
          units VERBATIM. This runner has egress the build container does
          not: docs.polymarket.us returns CONNECT 403 through the agent
          proxy, which is why the rounding question could not be settled in
          source and why tie vectors alone were recorded instead of a policy.
          Read-only, and it touches no account.
        required: false
        default: ""
      arm_external:
        description: >-
          POST the external-valuation shadow's control row (on|off), then
          read the odds probe, the refusal census, the clock audit and one
          valuation trace. Blank does nothing. Shadow only: the experiment
          it gates submits no orders.
        required: false
        default: ""
      seed_acceptance:
        description: >-
          on|blank. `on` POSTs the acceptance-position route, which writes
          ONE rn1x_positions row on a covered market -- separately labelled,
          shadow only, provenance ACCEPTANCE_SYNTHETIC_MODELLED_ENTRY -- so
          the position manager can be demonstrated on inventory whose inputs
          exist. It submits NO order and moves no capital.
        required: false
        default: ""
      wait_s:
        description: "Seconds to wait for the deploy to settle before probing"
        required: false
        default: "0"
      capture_terms:
        description: >-
          on|blank. `on` runs the SEPARATE capture-terms job, which retrieves
          the bookmaker's published settlement-rules pages and prints the
          applicable sections VERBATIM. Read-only: no credential, no service,
          no database. It is a separate JOB so its log can be read on its own
          rather than competing with the acceptance step for a readable
          window.
        required: false
        default: ""
      terms_url:
        description: "an additional rules URL to retrieve verbatim"
        required: false
        default: ""
      fixture_date:
        description: "YYYY-MM-DD for the fixture-metadata shape probe"
        required: false
        default: ""
      acceptance_condition:
        description: "condition_id of the acceptance fixture to acquire scope for"
        required: false
        default: ""
      operator_action:
        description: 'OPERATOR CONTROL ACCESS: status (read-only) | rotate (needs operator_confirm=DO). Blank skips the job.'
        required: false
        default: ''
      operator_confirm:
        description: 'Type DO to allow operator_action=rotate to write the service environment'
        required: false
        default: ''
      operator_service:
        description: 'Render service holding the API (operator_action only)'
        required: false
        default: 'sportsassets-api'
      operator_commit:
        description: 'operator_action=rotate: the 40-hex SHA to deploy after writing the env var. REQUIRED, because an env change makes Render auto-deploy the service''s TRACKED branch -- which is the protected default branch, not the reviewed build.'
        required: false
        default: ''
      expect_commit:
        description: >-
          funded_readback only: the 7-or-40-hex SHA this readback expects the
          API to be SERVING. Blank prints the serving commit without judging
          it; a value fails the job on any other build, so a readback cannot
          be attributed to a deploy that did not land.
        required: false
        default: ""
      clock_probe:
        description: >-
          Comma-separated venue slugs (max 6). Runs the SEPARATE venue-clock job:
          it reads each contract TWICE through the admin probe and prints whether
          `marketData.transactTime` advanced with our request, stood still, and
          whether the book content changed. It exists to ESTABLISH what that
          stamp means, because the lane's dominant refusal (VENUE_QUOTE_STALE)
          is computed from it and the semantics are recorded as unestablished.
          Read-only: it places no order and writes nothing.
        required: false
        default: ""
      clock_probe_gap_s:
        description: "seconds between the two reads of each contract (1-60)"
        required: false
        default: "12"
      pg18_migrations:
        description: >-
          on|blank. `on` runs the SEPARATE funded-pg18 job: it applies the
          repository's migrations to a PostgreSQL 18 service container with the
          SAME runner production uses, asserts the funded migrations applied,
          and runs the funded test suite against that database. It exists
          because the release gate's database is PostgreSQL 16 and production is
          18, which is exactly how migration 126 passed a green gate and rolled
          back in production. No secrets, no network, nothing deployed.
        required: false
        default: ""
      funded_readback:
        description: >-
          on|blank. `on` runs the SEPARATE funded-readback job, which reads
          the SERVING build back and prints, from the running process: every
          submission switch and its value, the funded command-centre section
          in full, the last COMPLETED scheduled cycle with its actual
          blockers, and the separately labelled demonstration books. Every
          call is a GET behind the command role. It arms nothing, writes
          nothing and submits nothing.
        required: false
        default: ""
      entry_run:
        description: >-
          Set to DO to run the AUTONOMOUS ENTRY lane against current
          production markets and print every input behind each candidate.
          It creates no order at any venue.
        required: false
        default: ""

# ONE VENUE-TOUCHING WORKFLOW AT A TIME, ACROSS THE WHOLE REPOSITORY.
#
# WHY THIS APPEARED, AND THE AUDIT CAUGHT IT RATHER THAN A REVIEW. Adding the
# `book-protocol` job made this workflow NAME THE VENUE HOST
# (gateway.polymarket.us), which puts it in the set of workflows that can reach
# the venue -- and every member of that set must share ONE concurrency group so
# two runs cannot read the venue at once. `venue_domain.workflow_groups` scans
# for exactly this, and `test_the_venue_domain_audit_passes_honestly` failed the
# moment the job landed.
#
# I ADDED A READ-ONLY JOB AND SILENTLY LEFT A CONCURRENCY DOMAIN. The job is
# read-only, which bounds the consequence and does not make it correct: the point
# of the group is that the venue sees one reader from us at a time, and
# "read-only" is not "free".
#
# `cancel-in-progress: false` because a queued run must WAIT, not displace a run
# already talking to the venue.
concurrency:
  group: pmus-public-read-global
  cancel-in-progress: false

jobs:
  verify:
    # A FUNDED READBACK IS NOT A REASON TO RE-RUN THE WHOLE ACCEPTANCE SUITE.
    # This job is twenty-six steps, spends the odds and venue budgets, and
    # drives the shadow lane's cycles. A dispatch whose only purpose is to
    # read the serving build back must not do any of that, so it skips here.
    if: ${{ inputs.funded_readback == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Settle
        run: sleep "${{ inputs.wait_s }}"

      - name: Reachability and build identity
        id: reach
        run: |
          HOST="${{ inputs.host }}"
          BAD=""
          echo "## COMMAND production acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          B="${{ inputs.base }}"
          for path in "/" "$B/" "$B/index.html" \
                      "$B/shadow.js" "$B/shadow.css" \
                      "$B/app.js" "$B/core.js"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 25 \
                   "https://$HOST$path" || echo 000)
            size=$(wc -c < /tmp/body 2>/dev/null || echo 0)
            printf '%-28s %s  %s bytes\n' "$path" "$code" "$size" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            # Fail HERE on a missing asset, not three steps later as a
            # confusing grep miss against the body of an error page.
            [ "$code" = "200" ] || BAD="$BAD $path($code)"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          [ -z "$BAD" ] || { echo "NOT SERVED:$BAD"; exit 1; }

      - name: The SHADOW environment is actually published
        run: |
          HOST="${{ inputs.host }}"
          B="${{ inputs.base }}"
          curl -s --max-time 25 "https://$HOST$B/index.html" > /tmp/index
          curl -s --max-time 25 "https://$HOST$B/shadow.js" > /tmp/shadow
          curl -s --max-time 25 "https://$HOST$B/app.js" > /tmp/app
          {
            echo "### Published assets"
            echo '```'
            grep -c 'shadow.js' /tmp/index | sed 's/^/index references shadow.js: /'
            grep -c 'shadow.css' /tmp/index | sed 's/^/index references shadow.css: /'
            grep -c "BTShadow" /tmp/shadow | sed 's/^/shadow.js defines BTShadow: /'
            grep -c "api/command/shadow/" /tmp/shadow \
              | sed 's/^/shadow.js shadow endpoints: /'
            grep -c "\['shadow','Shadow'\]" /tmp/app \
              | sed 's/^/app.js SHADOW nav entry: /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Hard failures: the page must carry the module and the module
          # must carry the disclosure. A deploy that published an old
          # bundle is worse than a failed one, because it looks fine.
          grep -q 'src="shadow.js"' /tmp/index
          grep -q 'BTShadow' /tmp/shadow
          grep -q 'SHADOW TRADING' /tmp/shadow
          grep -q 'NO REAL CAPITAL' /tmp/shadow
          grep -q "\['shadow','Shadow'\]" /tmp/app

      - name: Every expected tab is published (RELEASE ACCEPTANCE)
        run: |
          # THIS FAILS. The earlier version only REPORTED, on the
          # argument that the API and the bundle deploy on different
          # triggers so a hard failure would block an API release on a
          # frontend deploy it does not depend on.
          #
          # That argument was wrong about what this job is for. This is
          # the RELEASE ACCEPTANCE test -- the thing that decides
          # whether the release reached the person who has to use it.
          # A deployed API whose tab is unpublished is an unfinished
          # release, and a probe that prints "ABSENT" in green lets it
          # pass. The skew between the two deploy routes is a reason to
          # fail loudly, not a reason to excuse the gap.
          EXPECTED="overview decisions positions execution pairing
                    comparison audit accounting performance experimental
                    desk learning"
          MISSING=""
          for t in $EXPECTED; do
            grep -q "\['$t'," /tmp/shadow \
              || MISSING="$MISSING $t"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::TABS ABSENT FROM THE PUBLISHED BUNDLE:$MISSING"
            echo "The API may already serve their routes. The release is"
            echo "NOT complete until the bundle management loads carries"
            echo "them. Publish the frontend, then re-run."
            {
              echo "### RELEASE NOT ACCEPTED"
              echo "Tabs absent from the published bundle:\`$MISSING\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "all expected tabs published" >> "$GITHUB_STEP_SUMMARY"

      - name: Tab inventory
        run: |
          {
            echo "### Tabs in the published bundle"
            echo '```'
            printf 'published shadow.js: %s bytes\n' "$(wc -c < /tmp/shadow)"
            for t in overview decisions positions execution pairing \
                     comparison audit accounting performance \
                     experimental desk learning; do
              if grep -q "\['$t'," /tmp/shadow || \
                 grep -q "\['$t'\]" /tmp/shadow; then
                printf '  %-14s PUBLISHED\n' "$t"
              else
                printf '  %-14s ABSENT FROM THE PUBLISHED BUNDLE\n' "$t"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Echo to the log too, so it is readable without the summary.
          grep -o "\['[a-z]*', *'[^']*'\]" /tmp/shadow | head -20 || true

      - name: Existing COMMAND navigation is intact
        run: |
          for view in command portfolio orders decisions risk models \
                      reports audit investor; do
            grep -q "\['$view'," /tmp/app || { echo "MISSING VIEW: $view"; exit 1; }
          done
          echo "all nine pre-existing COMMAND views still routed" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: No credential reaches the browser
        run: |
          # The published bundle must contain no venue credential, no
          # database URL and no bearer token. This is the check that
          # would catch a config file accidentally shipped to the CDN.
          FAIL=0
          for f in /tmp/shadow /tmp/app /tmp/index; do
            for pat in 'PMX_' 'PRIVATE_KEY' 'BEGIN .*PRIVATE KEY' \
                       'postgres://' 'postgresql://' 'Bearer ey' \
                       'client_secret' 'DATABASE_URL'; do
              if grep -Eq "$pat" "$f"; then
                echo "CREDENTIAL-SHAPED STRING '$pat' in $f"; FAIL=1
              fi
            done
          done
          curl -s --max-time 25 \
            "https://${{ inputs.host }}${{ inputs.base }}/config.js" \
            > /tmp/config || true
          grep -Eq 'PMX_|PRIVATE_KEY|postgres://|client_secret' /tmp/config \
            && { echo "CREDENTIAL IN config.js"; FAIL=1; }
          [ "$FAIL" = 0 ] && echo "no credential-shaped string in the bundle" \
            >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      - name: No order action exists in the browser
        run: |
          FAIL=0
          for pat in 'createOrder' 'placeOrder' 'submitOrder' 'cancelOrder' \
                     "method: *['\"]POST"; do
            grep -Eq "$pat" /tmp/shadow && { echo "ORDER PATH '$pat'"; FAIL=1; }
          done
          [ "$FAIL" = 0 ] && echo "no order or mutation path in shadow.js" \
            >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      - name: The shadow API is behind the COMMAND session
        run: |
          API="${{ inputs.api }}"
          HOST="${{ inputs.host }}"
          {
            echo "### Shadow API, unauthenticated (401 is the PASS)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          FAIL=0
          for route in summary decisions positions executions equity \
                       comparison health "trades/none"; do
            direct=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                     "$API/api/command/shadow/$route" || echo 000)
            proxied=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                      "https://$HOST/api/command/shadow/$route" || echo 000)
            printf '%-16s api=%s  proxied=%s\n' "$route" "$direct" "$proxied" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            # 401 is correct. 200 would mean the ledger is public, which
            # is the one outcome that must fail this job loudly.
            [ "$direct" = "200" ] && { echo "OPEN ROUTE: $route"; FAIL=1; }
            [ "$proxied" = "200" ] && { echo "OPEN VIA PROXY: $route"; FAIL=1; }
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      # POOL OCCUPANCY AND HEARTBEAT ADVANCE, UNDER ORDINARY LOAD.
      #
      # Acceptance run 27 failed on a heartbeat that timed out acquiring a
      # pooled connection, and the one measurement that would have settled
      # WHY was never taken: how full the pool was while it happened. The
      # four rn1x loops hold four of ten connections permanently, which
      # explains reduced capacity and does NOT by itself establish what
      # saturated the other six.
      #
      # /healthz already publishes db.pool_stats() as `.pool`. TWO SAMPLES
      # ARE OBSERVATIONS, NOT A DIAGNOSIS. `size == max` with `idle == 0`
      # is consistent with saturation and does not prove it caused any
      # particular failure; correlating that needs acquisition WAIT times,
      # query errors and request durations, which is why every call below
      # records its own duration and why the service log is read alongside
      # this step rather than in place of it. In particular `idle > 0`
      # beside `db_ok false` does NOT by itself establish a slow database:
      # idle connections can coexist with a failure on a different leg,
      # and an inference from those two fields alone is exactly the kind
      # of unsupported attribution this run is meant to stop making.
      - name: Service health under ordinary command load
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -u
          H="X-Admin-Token: ${ADMIN_TOKEN:-}"
          say () { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          { echo "### SERVICE HEALTH UNDER LOAD"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

          pool () {
            curl -s --max-time 30 "$API/healthz" \
              | jq -c '{pool: .pool, db_ok: .db_ok}' 2>/dev/null \
              || echo '{"pool":"unreadable"}'
          }
          say "pool BEFORE  $(pool)"

          # The writer's heartbeat, and the standby's, before the load.
          before=$(curl -s --max-time 45 -H "$H" \
                   "$API/api/command/rn1x/statuses" \
                   | jq -r '(.statuses.prospective_rn1_management.heartbeat.at
                             // "none")|tostring' 2>/dev/null || echo none)
          say "writer heartbeat BEFORE  $before"

          # ORDINARY COMMAND-CENTRE REQUESTS, not a synthetic hammer: the
          # same authenticated reads the console makes, twelve of them, two
          # at a time, while every loop is cycling.
          # 200 AND A VALID PAYLOAD, NOTHING ELSE.
          #
          # The first version of this accepted 200|401|403, which is a
          # check that cannot fail on authentication: a token that stopped
          # working would have read as "healthy". These are AUTHENTICATED
          # management reads, so 401 or 403 is a FAILURE of authenticated
          # access. That unauthenticated callers are rejected is a
          # different property and is already tested separately, in "The
          # shadow API is behind the COMMAND session", where 401 is the
          # pass.
          #
          # A 200 carrying HTML or a parse error is also a failure -- that
          # is precisely how the SPA fallback masqueraded as a ledger -- so
          # the body must parse as JSON and be non-empty. Request duration
          # is recorded per call, because a pool snapshot on its own cannot
          # correlate a failure with how long acquisition actually waited.
          FAIL=0
          for i in 1 2 3 4; do
            for r in shadow/summary shadow/positions rn1x/statuses; do
              out=$(curl -s -o /tmp/lb.json \
                    -w '%{http_code} %{time_total}' --max-time 45 \
                    -H "$H" "$API/api/command/$r" || echo "000 0")
              c=${out%% *}; t=${out##* }
              kind=$(jq -r 'if type=="object" then "object"
                            elif type=="array" then "array"
                            else "scalar" end' /tmp/lb.json 2>/dev/null \
                     || echo "unparseable")
              bytes=$(wc -c < /tmp/lb.json 2>/dev/null || echo 0)
              printf 'load%-2s %-18s http=%s  %ss  payload=%s %sB\n' \
                "$i" "$r" "$c" "$t" "$kind" "$bytes" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              if [ "$c" != "200" ]; then
                echo "AUTHENTICATED READ FAILED: $r -> $c" \
                  | tee -a "$GITHUB_STEP_SUMMARY"; FAIL=1
              elif [ "$kind" = "unparseable" ] || [ "${bytes:-0}" -lt 2 ]; then
                echo "200 WITH NO VALID PAYLOAD: $r ($kind, ${bytes}B)" \
                  | tee -a "$GITHUB_STEP_SUMMARY"; FAIL=1
              fi
            done
          done
          say "pool AFTER   $(pool)"

          # HEARTBEAT ADVANCE, JUDGED AGAINST ITS ACTUAL CADENCE.
          #
          # rn1x_shadow sleeps TICK_S=20 s after a cycle that did work and
          # IDLE_S=120 s after one that did not. A 45 s window is therefore
          # SHORTER than the idle cadence, and "no change in 45 s" is a
          # perfectly correct idle loop -- reading it as stale telemetry
          # would manufacture a failure. The window is 150 s, past one full
          # idle period.
          #
          # Three things are reported SEPARATELY because they are three
          # different facts: which PROCESS wrote the record (writer
          # identity + build), WHEN it reported (beat_at), and WHICH CYCLE
          # it is reporting (state and the lane's own counters). A record
          # can be fresh and describe a cycle that did nothing, and it can
          # be stale while the loop is still working.
          sleep 150
          curl -s --max-time 45 -H "$H" "$API/api/command/rn1x/statuses" \
            > /tmp/hb2.json || true
          after=$(jq -r '(.statuses.prospective_rn1_management.heartbeat.at
                          // "none")|tostring' /tmp/hb2.json 2>/dev/null \
                  || echo none)
          say "writer heartbeat AFTER   $after   (window 150 s; TICK_S=20, IDLE_S=120)"
          jq -r '"hb_process\t"   + ((.statuses.external_valuation.last_cycle.writer // "none")|tostring),
                 "hb_reported_at\t"+ ((.statuses.external_valuation.last_cycle.at // "none")|tostring),
                 "hb_cycle_state\t"+ ((.statuses.external_valuation.last_cycle.state // "none")|tostring),
                 "hb_cycle_markets\t" + ((.statuses.external_valuation.last_cycle.markets_considered // "none")|tostring)' \
            /tmp/hb2.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$before" = "$after" ]; then
            say "heartbeat UNCHANGED across 150 s -- inspect hb_* above: a"
            say "  fresh record describing an idle cycle and a stale record"
            say "  are different findings and this line does not decide"
          else
            say "heartbeat advanced across 150 s: the beat is persisting"
          fi

          # The standby must be its own record, never the writer's row.
          curl -s --max-time 45 -H "$H" "$API/api/command/rn1x/statuses" \
            | jq -r '"ext_last_cycle_state\t"
                     + ((.statuses.external_valuation.last_cycle.state // "none")|tostring),
                     "ext_standby_state\t"
                     + ((.statuses.external_valuation.standby.state // "none")|tostring)' \
            2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      - name: The proxy does not serve HTML for an API path
        run: |
          # The netlify rule order is load-bearing: if /api/command/*
          # fell through to the SPA catch-all, COMMAND would parse a page
          # of HTML as its ledger and render a confident nothing.
          body=$(curl -s --max-time 30 \
                 "https://${{ inputs.host }}/api/command/shadow/summary" \
                 | head -c 200)
          echo "$body" | grep -qi '<!doctype html' && {
            echo "THE API PATH IS SERVING THE SPA"; exit 1; }
          echo "api path is proxied, not swallowed by the SPA catch-all" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: The previously failing portfolio read, and version skew
        run: |
          API="${{ inputs.api }}"
          HOST="${{ inputs.host }}"
          FAIL=0
          {
            echo "### Release compatibility"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # THE SCREENSHOT BLOCKER, probed directly. It reported
          # "FEED UNAVAILABLE - Negative quantity refused. No portfolio
          # data loaded" beside "No shadow position yet" -- a failed
          # read presented as an empty portfolio. Unauthenticated we
          # cannot see the body, but we CAN prove the route exists and
          # answers with the session challenge rather than a 404 or a
          # 500, which is what a removed or crashing route would give.
          for r in "shadow/positions" "desk/live" "desk/correction" \
                   "learning/overview"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                   "$API/api/command/$r" || echo 000)
            printf '%-22s %s\n' "$r" "$code" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            # 401 = present and guarded. 404 = the frontend would call a
            # route that does not exist, which is the version skew this
            # step exists to catch. 5xx = the read is broken.
            case "$code" in
              401) ;;
              *) echo "::error::$r answered $code (expected 401)"; FAIL=1 ;;
            esac
          done

          # EVERY ROUTE THE PUBLISHED BUNDLE CALLS MUST EXIST ON THE API.
          # This is the frontend/backend compatibility check: the bundle
          # is the client, so the bundle's own call list is the contract.
          for ns in shadow desk learning; do
            grep -o "'/api/command/' + (ns || 'shadow') + '/'" /tmp/shadow \
              >/dev/null || true
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      - name: Freshness — the bundle and the API agree on what exists
        run: |
          # A published tab whose API route 404s is exactly as broken as
          # an API route with no tab, and it fails the same way here.
          FAIL=0
          if grep -q "\['learning'," /tmp/shadow; then
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                   "${{ inputs.api }}/api/command/learning/overview" \
                   || echo 000)
            [ "$code" = "401" ] || {
              echo "::error::the Learning tab is published but its API route answered $code"
              FAIL=1; }
          fi
          if grep -q "\['desk'," /tmp/shadow; then
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                   "${{ inputs.api }}/api/command/desk/overview" || echo 000)
            [ "$code" = "401" ] || {
              echo "::error::the Desk tab is published but its API route answered $code"
              FAIL=1; }
          fi
          [ "$FAIL" = 0 ] && echo "bundle and API agree on every published tab" \
            >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      - name: RN1X — the shadow surface is published, and it is guarded
        run: |
          # THE FOUR DISTINCTIONS THE TAB EXISTS TO KEEP APART are
          # historical replay, prospective operation, controlled tests and
          # unavailable functions. This step cannot read them: doing that
          # needs a manager session, and this job deliberately mints none.
          # What it CAN establish, from outside, is the half that a
          # session would otherwise hide -- that each route is SERVED and
          # SESSION-GATED, and that the published bundle and the API agree
          # on which routes exist.
          #
          # 401 = published and guarded. 404 = the tab calls a route that
          # is not there. 200 = the shadow ledger is public, which is the
          # one outcome that must fail loudly.
          API="${{ inputs.api }}"
          HOST="${{ inputs.host }}"
          FAIL=0
          {
            echo "### RN1X command surface (401 is the PASS)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "rn1x/overview" "rn1x/positions" "rn1x/statuses" \
                   "rn1x/learning" "rn1x/trace/none"; do
            direct=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                     "$API/api/command/$r" || echo 000)
            proxied=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                      "https://$HOST/api/command/$r" || echo 000)
            printf '%-20s api=%s  proxied=%s\n' "$r" "$direct" "$proxied" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$direct" = "200" ] && {
              echo "::error::OPEN ROUTE: $r is served without a session"
              FAIL=1; }
            [ "$proxied" = "200" ] && {
              echo "::error::OPEN VIA PROXY: $r"; FAIL=1; }
            case "$direct" in
              401) ;;
              *) echo "::error::$r answered $direct (expected 401)"
                 FAIL=1 ;;
            esac
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # The published bundle is the client, so its own contents are
          # the contract for what the manager is shown.
          if grep -q "\['rn1x'," /tmp/shadow; then
            echo "bundle publishes the RN1X tab" >> "$GITHUB_STEP_SUMMARY"
            for token in "data-rn1x-pos" "historical_replay" \
                         "prospective_rn1_management" \
                         "independent_ev_entries" \
                         "pairing" "second_half_loss_exit" \
                         "accounting_health" "learning_evaluation"; do
              grep -q "$token" /tmp/shadow || {
                echo "::error::the bundle is missing $token, so a status or the trace click path is not published"
                FAIL=1; }
            done
            # A LIVE badge that does not say what is live is the defect
            # this check exists for.
            grep -q "ARMED" /tmp/shadow || {
              echo "::error::the bundle has no ARMED state, so a not-yet-producing lane would read as LIVE or STOPPED"
              FAIL=1; }
          else
            echo "::error::the RN1X tab is not in the published bundle"
            FAIL=1
          fi
          exit $FAIL

      - name: RN1X — the AUTHENTICATED read, against the persisted records
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # THE HALF THE UNAUTHENTICATED PROBE CANNOT SEE. `require_command`
          # accepts X-Admin-Token as well as the COMMAND cookie, and the
          # repository secret is the same one pair-probe already uses
          # against this API. COMMAND is READ-ONLY for every role -- there
          # is no write path behind this header -- so this mints no
          # session, moves no credential and changes nothing.
          set +e
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "SKIPPED: no ADMIN_TOKEN secret, so the authenticated read is not available from here" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          API="${{ inputs.api }}"
          H="X-Admin-Token: $ADMIN_TOKEN"
          FAIL=0
          {
            echo "### RN1X, read with a COMMAND role"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          code=$(curl -s -o /tmp/st.json -w '%{http_code}' --max-time 45 \
                 -H "$H" "$API/api/command/rn1x/statuses" || echo 000)
          echo "statuses HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then
            echo "the token is not accepted by this service; the authenticated read is unavailable" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # EVERY BADGE MUST NAME ITS SUBJECT. A LIVE that does not say
          # what is live is the defect the seven statuses exist to fix.
          jq -r '.statuses | to_entries[]
                 | "\(.key)\t\(.value.badge)\t\(.value.what // "NO WHAT")"' \
            /tmp/st.json | tee -a "$GITHUB_STEP_SUMMARY"
          # EVERY key the service returns, not a hand-copied seven. A tile
          # added without a badge or without a `what` is exactly the defect
          # this check exists for, and a fixed list cannot see a new one.
          for k in $(jq -r '.statuses | keys[]' /tmp/st.json); do
            # THE VOCABULARY, READ OUT OF command_rn1x.py RATHER THAN
            # ASSUMED. I got this wrong twice: first asking for `state`
            # (the key is `badge`), then allowing only LIVE/ARMED/STOPPED.
            # The real set is wider, and the extra values are the whole
            # point -- BLOCKED is a path that exists and refuses,
            # UNAVAILABLE is a function with no input, OK/EMPTY/CHECK is
            # the ledger's own health. Collapsing those into STOPPED would
            # have erased the distinction the seven statuses exist for.
            jq -e --arg k "$k" '.statuses[$k].badge as $b
                                | ["LIVE","ARMED","STOPPED","BLOCKED",
                                   "UNAVAILABLE","OK","EMPTY","CHECK"]
                                | index($b) != null' \
              /tmp/st.json >/dev/null \
              || { echo "::error::status $k has an unknown badge (not one of LIVE/ARMED/STOPPED/BLOCKED/UNAVAILABLE/OK/EMPTY/CHECK)"
                   FAIL=1; }
            jq -e --arg k "$k" '.statuses[$k].what | strings | length > 0' \
              /tmp/st.json >/dev/null \
              || { echo "::error::status $k has no what, so its badge names nothing"
                   FAIL=1; }
          done

          # ONE COMPLETE TRACE, followed from the list to the stages.
          code=$(curl -s -o /tmp/pos.json -w '%{http_code}' --max-time 45 \
                 -H "$H" "$API/api/command/rn1x/positions" || echo 000)
          echo "positions HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          # PREFER A PROSPECTIVE POSITION when one exists. Relying on
          # ORDER BY decision_ts DESC to surface it would make this
          # verification depend on a sort rather than on the lane it is
          # meant to be about, and the two lanes are the whole point.
          PID=$(jq -r '((.positions // [])
                        | map(select(.position_id
                              | test("_PROSPECTIVE")))
                        | .[0].position_id)
                       // (.positions // [])[0].position_id // empty' \
                /tmp/pos.json)
          case "$PID" in
            *_PROSPECTIVE*) echo "tracing a PROSPECTIVE position" ;;
            "") : ;;
            *) echo "no prospective position yet; tracing a historical one" ;;
          esac | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$PID" ]; then
            echo "no position to trace yet" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            code=$(curl -s -o /tmp/tr.json -w '%{http_code}' --max-time 45 \
                   -H "$H" "$API/api/command/rn1x/trace/$PID" || echo 000)
            echo "trace HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
            # The counts are the comparison against the persisted records:
            # these are read back from rn1x_positions/decisions/orders/
            # fills/outcomes by the same query the manager's click runs.
            jq -r '"experiment\t" + (.position.experiment_id // "?"),
                   "source_ts\t"   + (.position.source_ts   // "?" | tostring),
                   "detected_ts\t" + (.position.detected_ts // "?" | tostring),
                   "decision_ts\t" + (.position.decision_ts // "?" | tostring),
                   "decisions\t"   + ((.decisions // []) | length | tostring),
                   "orders\t"      + ((.orders    // []) | length | tostring),
                   "fills\t"       + ((.fills     // []) | length | tostring),
                   "outcome\t"     + ((.outcome != null) | tostring)' \
              /tmp/tr.json | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] || {
              echo "::error::the trace for $PID answered $code"; FAIL=1; }
            jq -e '.position.source_ts and .position.detected_ts
                   and .position.decision_ts' /tmp/tr.json >/dev/null \
              || { echo "::error::the trace is missing one of the three clocks"
                   FAIL=1; }
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      # ── THE SHADOW POSITION MANAGER, ON THE DEPLOYED BUILD ────────
      #
      # Two arms now manage the same assigned inventory: the FROZEN
      # $0.91/second-half-16% benchmark and SHADOW_CHALLENGER_HOLD_RANKED_V1,
      # which ranks every action INCLUDING hold from a labelled external
      # probability. This step reads them APART, because summing them
      # would count one position twice and attribute one arm's outcome to
      # the other.
      #
      # AND IT COUNTS THE BLIND CYCLES SEPARATELY. A decision with no
      # inputs leaves the position unchanged exactly as a deliberate hold
      # does, and reporting them together is the single most flattering
      # error available here.
      - name: RN1X — the two arms, and what each one actually decided
        if: ${{ !cancelled() }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -u
          API="${{ inputs.api }}"; FAIL=0
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          echo "### Arms: champion vs challenger" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "SKIPPED: no ADMIN_TOKEN, the authenticated read is not available here" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          H="X-Admin-Token: $ADMIN_TOKEN"
          code=$(curl -s -o /tmp/ov.json -w '%{http_code}' --max-time 60 \
                 -H "$H" "$API/api/command/rn1x/overview" || echo 000)
          echo "overview HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          # AN AUTHENTICATED READ MUST RETURN ITS EXPECTED STATUS AND A
          # VALID PAYLOAD. A 401/403 is a FAILURE of authenticated access,
          # not a pass; unauthorized-rejection is a separate check above.
          [ "$code" = "200" ] || { echo "::error::authenticated overview answered $code"; FAIL=1; }
          jq -e '.arms' /tmp/ov.json >/dev/null 2>&1 \
            || { echo "::error::the overview carries no arms panel: the deployed build predates it"
                 FAIL=1; }
          jq -r '"champion\t"   + (.arms.champion.policy_id   // "?"),
                 "challenger\t" + (.arms.challenger.policy_id // "?"),
                 (.arms.rows // [])[]
                   | if type == "object" then
                       "arm\t" + (.policy // "?")
                       + "  pos=" + ((.positions // 0) | tostring)
                       + "  dec=" + ((.decisions // 0) | tostring)
                       + "  selected=" + ((.selected // 0) | tostring)
                       + "  held_by_choice=" + ((.held_by_choice // 0) | tostring)
                       + "  BLIND=" + ((.blind // 0) | tostring)
                       + "  with_inputs=" + ((.with_inputs // 0) | tostring)
                       + "  unreconciled=" + ((.unreconciled // 0) | tostring)
                     else . end' \
            /tmp/ov.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '"operating_states:", ((.operating_states // [])[]
                   | "  " + (.state // "?") + "\t" + ((.n // 0) | tostring))' \
            /tmp/ov.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "-- the challenger lane's own state --" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -s --max-time 45 -H "$H" "$API/api/command/rn1x/statuses" \
            | jq -r '(.rn1x_shadow // .shadow // {}) as $s
                     | "lane_C\t" + (($s.detail.lanes.C // {}) | tostring
                                      | .[0:400])' \
            2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          # ONE CHALLENGER POSITION, TRACED. The whole decision is on the
          # row from migration 109, so this prints the fields the
          # directive asks to be visible rather than only the selection.
          # THE FILTER IS SERVER-SIDE ON PURPOSE. Newest-first across every
          # experiment, the historical lane's hundreds of rows push the one
          # challenger position off a 50-row page -- which run 37 read as
          # "no challenger position exists" while the row was in the table.
          PID=$(curl -s --max-time 45 -H "$H" \
                "$API/api/command/rn1x/positions?policy=CHALLENGER&limit=200" \
                | jq -r '[(.positions // . // [])[]
                          | select((.policy // "") | test("CHALLENGER"))]
                         | .[0].position_id // empty' 2>/dev/null)
          if [ -z "$PID" ]; then
            echo "no challenger position yet -- the lane has produced none" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            code=$(curl -s -o /tmp/ctr.json -w '%{http_code}' --max-time 60 \
                   -H "$H" "$API/api/command/rn1x/trace/$PID" || echo 000)
            echo "challenger trace $PID HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] || { echo "::error::challenger trace answered $code"; FAIL=1; }
            jq -r '(.decisions // [])[0] // {} as $d
                   | "policy_version\t"  + ($d.policy_version  // "?")
                   , "governing_rule\t"  + ($d.governing_rule  // "?")
                   , "operating_state\t" + ($d.operating_state // "?")
                   , "selected\t"        + (($d.selected_action // "NULL") | tostring)
                                          + " x " + (($d.selected_qty // "-") | tostring)
                   , "deliberate_hold\t" + (($d.is_a_deliberate_hold // "?") | tostring)
                   , "input_available\t" + (($d.input_available // "?") | tostring)
                   , "hold_value_usd\t"  + (($d.hold_value_usd // "-") | tostring)
                   , "hold_basis\t"      + ($d.hold_value_basis // "?")
                   , "reconciles\t"      + (($d.accounting_reconciles // "?") | tostring)
                   , "reason\t"          + (($d.selection_reason // "") | .[0:200])' \
              /tmp/ctr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
            jq -r '"hold_states:", ((.decision_semantics.by_operating_state // {})
                                    | to_entries[] | "  " + .key + "\t" + (.value|tostring)),
                   "blind\t" + ((.decision_semantics.decisions_taken_blind // 0) | tostring)' \
              /tmp/ctr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      # ── THE SUPPORTED-SPORT DEMONSTRATION, ON A LABELLED POSITION ──
      #
      # WHY IT EXISTS. The only open challenger position is an ATP tennis
      # fixture, and tennis is not in the provider set: its chain stops at
      # the provider link, which the step below reports as the coverage fact
      # it is. Repeated blind decisions on that position are NOT the exit
      # policy operating, and waiting for an RN1 fill to land on a covered
      # fixture is waiting on a coincidence.
      #
      # WHAT THIS DOES. Asks the DEPLOYED build to seed ONE separately
      # labelled position on a CURRENT covered venue contract at the
      # CONTEMPORANEOUS executable price with its fee stated, then waits for
      # the SAME production management lifecycle -- the deployed challenger
      # loop, not this runner -- to decide it across two distinct cycles, and
      # accepts it only on those decisions' OWN stored evidence.
      #
      # WHAT IT IS NOT: not RN1-derived, not an executed order, not funded,
      # and not part of any benchmark result. Its policy, provenance,
      # entry_kind and source_account say so ON THE ROW and are printed
      # below rather than asserted in prose, and the arms table -- grouped by
      # policy -- shows it as its own line. THE ROUTE SUBMITS NO ORDER.
      #
      # IT IS THE SECOND OF THE TWO WRITES THIS WORKFLOW CAN MAKE, opt-in
      # through `seed_acceptance: on` and named in the header.
      #
      # IT ALSO OWNS THE TWO SHARED JQ PROGRAMS -- the trace normaliser and
      # the acceptance checker -- which it writes to files that the step
      # below reads, so the two steps cannot drift apart.
      - name: RN1X — the ACCEPTANCE position, managed by the production lifecycle
        if: ${{ !cancelled() }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -u
          API="${{ inputs.api }}"; WANT="${{ inputs.seed_acceptance }}"; FAIL=0
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          say () { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          {
            echo "### The acceptance position, driven by the production lifecycle"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # ── THE TRACE NORMALISER. The jsonb columns can arrive as strings
          # depending on the driver's codec, and a jq path into a string
          # silently yields null -- which would make every check vacuous.
          NORM='def j: if type == "string" then (fromjson? // {})
                     else (. // {}) end;
              {seed_qty: (.position.seed_qty // null),
               seed_price: (.position.seed_price // null),
               policy: (.position.policy // "?"),
               outcome_index: (.position.outcome_index // null),
               decisions: [(.decisions // [])[]
                 | {id: .decision_id, ts: (.decision_ts | tostring),
                    action: (.selected_action // "NULL"),
                    qty: (.selected_qty // null),
                    hold: (.hold_value_usd // null),
                    state: (.operating_state // "?"),
                    eligibility: (.eligibility // "?"),
                    reason: (.selection_reason // ""),
                    reconciles: (.accounting_reconciles),
                    pays: ((.payout_identity | j).row_payout_event),
                    chain: (.input_chain | j),
                    alt: (.alternatives | j), inv: (.resulting_inventory | j),
                    fr: (.input_freshness | j)}]}'
          printf '%s' "$NORM" > /tmp/norm.jq
          # ── ACCEPTANCE, FROM THE DECISION'S OWN STORED EVIDENCE ───
          #
          # Two priced HOLDs are NOT sufficient. A diagnostic pull taken after
          # the fact cannot establish what a decision knew, so every requirement
          # below is read off the DECISION ROW: the chain it recorded, the
          # freshness it measured, the ladder it saw, the inventory it ranked,
          # the alternatives it scored, and whether its accounting reconciled.
          #
          # A MISSING-BOOK HOLD DOES NOT SATISFY THIS. It is a legitimate
          # decision and it is not a demonstration of the manager.
          ACC='[(.decisions // [])[] | . as $d
           | (($d.chain // {}).chain // []) as $ch
           | (($ch | map(select(.link == "1_HELD_EXPOSURE")) | first) // {}) as $l1
           | (($ch | map(select(.link == "2_VENUE_CONTRACT")) | first) // {}) as $l2
           | (($ch | map(select(.link == "5_EXIT_LADDER")) | first) // {}) as $l5
           | (($ch | map(select(.link == "4b_SETTLEMENT_COMPATIBILITY"))
               | first) // {}) as $l4b
           | (($d.alt.hold_input.terminal_rule // {})) as $tr
           | (($d.alt.ranked // []) | map(select(.action == "DIRECT_EXIT"))
              | first // {}) as $ex
           | {id: $d.id, ts: $d.ts, action: $d.action, qty: $d.qty, hold: $d.hold,
              missing: ([
                (if ($l1.ok == true) and (($d.pays // null) != null)
                    and (($l1.basis // null) != null)
                 then empty else "HELD_EXPOSURE_MAPPING" end),
                (if ($l2.ok == true) and ($l2.agrees_with_tokens == true)
                    and (($l2.us_market_slug // null) != null)
                    and (($l2.intent // null) != null)
                 then empty else "VENUE_CONTRACT_AND_INTENT" end),
                (if (($d.fr.age_from_observation_s // null) != null)
                    and (($d.fr.bound_s // null) != null)
                    and (($d.fr.age_from_observation_s) <= ($d.fr.bound_s))
                 then empty else "FRESH_PROBABILITY" end),
                (if ($l5.ok == true) and (($l5.exit_price // 0) > 0)
                    and (($l5.size_at_best // 0) > 0)
                 then empty else "EXIT_LADDER_AND_DEPTH" end),
                (if (($ex.qty // 0) > 0) and (($ex.value_usd // null) != null)
                 then empty else "PRICED_EXECUTABLE_EXIT_ALTERNATIVE" end),
                (if (($d.inv.residual_qty // null) != null)
                    and (($d.inv.residual_qty) > 0)
                    and (($d.alt.hold_input.qty_valued // null) != null)
                    and ((($d.inv.residual_qty) - ($d.alt.hold_input.qty_valued))
                         | fabs < 0.000001)
                 then empty else "RESIDUAL_INVENTORY_AGREES" end),
                (if (($d.alt.ranked // []) | length) > 0
                    and (($d.action // "NULL") != "NULL")
                    and (($d.qty // null) != null)
                    and ((($d.reason // "") | length) > 0)
                 then empty else "RANKED_ALTERNATIVES_AND_SELECTION" end),
                (if $d.reconciles == true then empty
                 else "RECONCILED_ACCOUNTING" end),
                (if ($d.hold // null) != null then empty else "PRICED_HOLD" end),
                # ── SETTLEMENT EVIDENCE, FROM THE STORED INPUTS ──
                #
                # The hold value is p x qty realised AT SETTLEMENT, so
                # whether the priced event and the paid event coincide
                # under overtime, void and draw is a condition on the
                # number that was ranked -- not a HOLD_TO_SETTLEMENT-only
                # concern. First: was the evidence RECORDED at all.
                # The per-condition CONDITION -> PAYOUT table has to be
                # there too: a verdict without it is a conclusion with no
                # working, and a shared word like void is not a payout.
                (if (($l4b.link // null) != null)
                    and (($l4b.book_rule // null) != null)
                    and (($tr.asked // false) == true)
                    and (($tr.book_rule // null) != null)
                    and (($l4b.compatibility // null) != null)
                    and ((($l4b.terms_verdict // null) != null)
                         or (($l4b.unstated_conditions // null) != null))
                 then empty else "SETTLEMENT_EVIDENCE_RECORDED" end),
                # Second: is compatibility ESTABLISHED. Unresolved or
                # CONFLICTING terminal rules cannot pass as a complete,
                # verified HOLD-versus-exit comparison; the value stays
                # computed and is reported as CONDITIONAL instead.
                # INCOMPATIBLE is not a weaker UNKNOWN: it also removes
                # the probability from the selector, so such a row loses
                # PRICED_HOLD above as well and cannot read as a complete
                # comparison with one footnote.
                (if ($l4b.ok == true) and ($tr.established == true)
                    and (($tr.conflicts // false) == false)
                    and (($l4b.disqualifies_selection // false) == false)
                    and ((($tr.mismatched_conditions // []) | length) == 0)
                    and ((($tr.unmet // []) | length) == 0)
                 then empty
                 else "SETTLEMENT_COMPATIBILITY_ESTABLISHED" end)
              ])}]'
          printf '%s' "$ACC" > /tmp/acc.jq
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            say "SKIPPED: no ADMIN_TOKEN, the authenticated route is not available here"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          H="X-Admin-Token: $ADMIN_TOKEN"
          if [ "$WANT" != "on" ]; then
            say "NOT REQUESTED: seed_acceptance is '${WANT:-}', so nothing was"
            say "written and no demonstration was attempted. Dispatch with"
            say "seed_acceptance=on to run it."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          say "-- seeding ONE acceptance position on a covered exposure --"
          code=$(curl -s -o /tmp/seed.json -w '%{http_code}' --max-time 180 \
                 -X POST -H "$H" "$API/api/admin/rn1x-acceptance-position" || echo 000)
          say "seed HTTP $code"
          [ "$code" = "200" ] || { echo "::error::the acceptance seed route answered $code"; FAIL=1; }
          jq -r '"created\t"        + ((.created // false)|tostring),
                 "position_id\t"    + ((.position_id // "-")|tostring),
                 "policy\t"         + ((.policy // "-")|tostring),
                 "provenance\t"     + ((.provenance // "-")|tostring),
                 "is_not\t"         + ((.is_not // [])|tostring),
                 "submits_orders\t" + ((.submits_orders)|tostring)
                                     + "   funded=" + ((.funded)|tostring),
                 "sport\t"          + ((.sport // "-")|tostring) + "  "
                                     + ((.title // "")[0:60]),
                 "venue_contract\t" + ((.us_market_slug // "-")|tostring)
                                     + "  " + ((.intent // "-")|tostring),
                 "payout_event\t"   + ((.payout_event // "-")|tostring),
                 "entry\t"          + ((.entry // {})|tostring),
                 "inputs_at_entry\t" + ((.inputs_at_entry // {})|tostring),
                 "source_trade_id\t" + ((.source_trade_id // "-")|tostring)
                                     + "  " + ((.source_trade_id_is // "")|tostring),
                 "covered_labels\t" + ((.covered_sport_labels // [])|tostring),
                 "candidates\t"     + ((.candidates_examined // 0)|tostring)
                                     + " of cap " + ((.candidate_cap // "-")|tostring)
                                     + ", with a known venue contract "
                                     + ((.candidates_with_a_known_venue_contract // 0)|tostring)
                                     + ", deferred " + ((.deferred_budget // 0)|tostring),
                 "pool_blocker\t"   + ((.pool_blocker // "none")|tostring),
                 ((.pool // [])[]
                   | "  pool " + ((.sport)|tostring) + "  open="
                     + ((.open_markets)|tostring) + "  both_tokens="
                     + ((.with_both_tokens)|tostring) + "  venue_contract="
                     + ((.with_venue_contract)|tostring)),
                 "refusals\t"       + ((.refusals // {})|tostring),
                 ((.considered // [])[]
                   | "  considered " + ((.slug // "?")|tostring) + "  "
                     + ((. | del(.slug) | tostring)[0:300]))' \
            /tmp/seed.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 600 /tmp/seed.json
          APID=$(jq -r '.position_id // empty' /tmp/seed.json 2>/dev/null)
          if [ -z "$APID" ]; then
            echo "::error::no acceptance position exists: no covered market could supply a complete entry. The refusals above name the link that stopped each candidate -- repair that link rather than widening a limit."
            say "NOT DEMONSTRATED -- no covered exposure could be entered"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          # ── WAIT FOR THE DEPLOYED LOOP, NOT FOR THIS RUNNER ────────
          #
          # Nothing here decides anything. It polls the PERSISTED trace until
          # the deployed challenger loop has produced two complete decisions
          # at two distinct instants, or the poll budget runs out -- and a
          # budget that runs out is a failure, not a pass.
          TRIES=26; NAP=30; COMPLETE=0; DISTINCT=0; NDEC=0; i=0
          while [ "$i" -lt "$TRIES" ]; do
            i=$((i+1))
            code=$(curl -s -o /tmp/amg.json -w '%{http_code}' --max-time 60 \
                   -H "$H" "$API/api/command/rn1x/trace/$APID" || echo 000)
            if [ "$code" = "200" ]; then
              jq -f /tmp/norm.jq /tmp/amg.json > /tmp/amgn.json 2>/dev/null \
                || echo '{}' > /tmp/amgn.json
              if jq -f /tmp/acc.jq /tmp/amgn.json > /tmp/aacc.json 2>/dev/null; then
                COMPLETE=$(jq '[.[] | select((.missing | length) == 0)] | length' /tmp/aacc.json)
                DISTINCT=$(jq '[.[] | select((.missing | length) == 0) | .ts] | unique | length' /tmp/aacc.json)
                NDEC=$(jq '(.decisions // []) | length' /tmp/amgn.json)
                say "poll $i/$TRIES  decisions=$NDEC  complete=$COMPLETE  distinct_instants=$DISTINCT"
              else
                say "poll $i/$TRIES  the trace could not be evaluated yet"
              fi
            else
              say "poll $i/$TRIES  trace HTTP $code"
            fi
            if [ "$COMPLETE" -ge 2 ] && [ "$DISTINCT" -ge 2 ]; then break; fi
            if [ "$i" -lt "$TRIES" ]; then sleep "$NAP"; fi
          done
          # ── THE PROVENANCE, OFF THE ROW THE MANAGER DECIDED ───────
          say "-- provenance, read back off the persisted position --"
          jq -r '"position_id\t" + ((.position.position_id // "-")|tostring),
                 "policy\t"      + ((.position.policy // "-")|tostring),
                 "provenance\t"  + ((.position.provenance // "NULL")|tostring),
                 "entry_kind\t"  + ((.position.entry_kind // "-")|tostring),
                 "source_account\t" + ((.position.source_account // "-")|tostring),
                 "source_trade_id\t" + ((.position.source_trade_id // "-")|tostring),
                 "entry\t"       + ((.position.seed_qty // "-")|tostring) + " @ "
                                  + ((.position.seed_price // "-")|tostring)
                                  + "  basis " + ((.position.seed_basis_usd // "-")|tostring),
                 "entry_kind_why\t" + ((.position.entry_kind_why // "-")|tostring)' \
            /tmp/amg.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          # ── EVERY DECISION THE PRODUCTION LIFECYCLE TOOK ON IT ────
          jq -r '"decisions\t" + ((.decisions | length)|tostring)
                   + "  distinct_ts=" + (([.decisions[].ts] | unique | length)|tostring),
                 (.decisions[] | . as $d
                   | "  " + .id[-22:] + "  " + .ts[0:19]
                     + "  " + .action + " x " + ((.qty // "-")|tostring)
                     + "  hold=" + ((.hold // "-")|tostring)
                     + "  resid=" + ((.inv.residual_qty // "-")|tostring)
                     + "  " + .state,
                     "      freshness age=" + ((.fr.age_from_observation_s // "-")|tostring)
                     + " bound=" + ((.fr.bound_s // "-")|tostring)
                     + " from=" + ((.fr.bound_source // "-")|tostring),
                     "      payout_event=" + ((.pays // "-")|tostring)
                     + "  reconciles=" + ((.reconciles // "-")|tostring)
                     + "  eligibility=" + (.eligibility),
                     "      terminal_rule established="
                     + (((.alt.hold_input.terminal_rule // {}).established // "-")|tostring)
                     + " book_rule="
                     + (((.alt.hold_input.terminal_rule // {}).book_rule // "-")|tostring)
                     + " attested="
                     + (((.alt.hold_input.terminal_rule // {}).attested // [])|tostring)
                     + " unmet="
                     + (((.alt.hold_input.terminal_rule // {}).unmet // [])|tostring)
                     + " conflicts="
                     + (((.alt.hold_input.terminal_rule // {}).conflicts // "-")|tostring)
                     + "  hold_value_is_conditional="
                     + ((.alt.hold_input.value_is_conditional // "-")|tostring),
                     ((($d.chain.chain // [])[])
                       | "      link " + (.link) + (if .ok then "  OK" else "  FAILED" end)
                         + "  " + ((. | del(.link, .ok) | tostring)[0:240])),
                     (if ((.alt.ranked // []) | length) == 0
                      then "      ranked: NONE -- every action refused"
                      else ((.alt.ranked // [])[]
                            | "      ranked " + (.action // "?")
                              + " x " + ((.qty // "-")|tostring)
                              + " = " + ((.value_usd // "-")|tostring))
                      end),
                     "      selected " + .action + " because " + ((.reason // "")[0:160]))' \
            /tmp/amgn.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '.[] | "  " + (.id[-22:]) + "  " + (.ts[0:19])
                 + (if (.missing | length) == 0 then "  COMPLETE"
                    else "  INCOMPLETE " + ((.missing)|tostring) end)' \
            /tmp/aacc.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          # ── AND THAT IT IS NOT IN THE BENCHMARK'S NUMBERS ─────────
          #
          # The arms read groups by (experiment, policy), so the acceptance
          # policy is its OWN line and no benchmark total can absorb it. This
          # prints the lines rather than claiming the separation.
          say "-- the arms table, grouped by policy --"
          curl -s --max-time 60 -H "$H" "$API/api/command/rn1x/overview" \
            | jq -r '((.arms.rows // [])[]
                      | "  " + (.policy // "?") + "\tpositions="
                        + ((.positions // 0)|tostring) + " decisions="
                        + ((.decisions // 0)|tostring) + " blind="
                        + ((.blind // 0)|tostring) + " with_inputs="
                        + ((.with_inputs // 0)|tostring))' \
            2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          IDS=$(jq -r '[.[] | select((.missing | length) == 0) | .id] | join("  ")' \
                /tmp/aacc.json 2>/dev/null || echo "")
          # ── CONDITIONAL IS ITS OWN VERDICT, never folded into complete ──
          #
          # A row whose ONLY gap is settlement COMPATIBILITY has every other
          # input: the exposure mapping, a fresh probability, a usable
          # ladder, the residual, a priced exit it was compared against,
          # reconciled accounting -- and a hold value that is conditional on
          # terminal rules nobody has established. That is a CONDITIONAL
          # comparison and it is reported as one. It is NOT a complete,
          # verified HOLD-versus-exit comparison and it must not be counted
          # as one.
          COND=$(jq '[.[] | select(.missing == ["SETTLEMENT_COMPATIBILITY_ESTABLISHED"])] | length' /tmp/aacc.json 2>/dev/null || echo 0)
          CONDD=$(jq '[.[] | select(.missing == ["SETTLEMENT_COMPATIBILITY_ESTABLISHED"]) | .ts] | unique | length' /tmp/aacc.json 2>/dev/null || echo 0)
          CONDIDS=$(jq -r '[.[] | select(.missing == ["SETTLEMENT_COMPATIBILITY_ESTABLISHED"]) | .id] | join("  ")' /tmp/aacc.json 2>/dev/null || echo "")
          say "complete\t$COMPLETE   distinct_instants\t$DISTINCT   of $NDEC decisions"
          say "conditional_on_settlement\t$COND at $CONDD distinct instants"
          if [ "$COMPLETE" -lt 2 ] && [ "$COND" -ge 2 ] && [ "$CONDD" -ge 2 ]; then
            say "COMPLETE EXCEPT SETTLEMENT COMPATIBILITY -- a CONDITIONAL"
            say "comparison on the acceptance position $APID:"
            say "  $CONDIDS"
            say "each of these carries its own verified held-exposure"
            say "mapping, a probability inside its own 30 s bound, a usable"
            say "exit ladder with depth, the current residual, ranked"
            say "alternatives with a selected action and quantity, and"
            say "reconciled accounting. The HOLD value is p x qty realised"
            say "AT SETTLEMENT and the terminal rules above are NOT"
            say "established, so it is CONDITIONAL on them. This is NOT a"
            say "complete, verified HOLD-versus-exit comparison and is not"
            say "counted as one."
          fi
          if [ "$COMPLETE" -ge 2 ] && [ "$DISTINCT" -ge 2 ]; then
            say "ACCEPTANCE MET on the acceptance position $APID:"
            say "  $IDS"
            say "each decision carrying its own verified held-exposure mapping,"
            say "a probability inside its own 30 s bound, a matching payout"
            say "identity, a usable exit ladder with depth, the current"
            say "residual, ranked alternatives with a selected action and"
            say "quantity, and reconciled accounting -- taken by the deployed"
            say "challenger loop, on a position labelled"
            say "ACCEPTANCE_SYNTHETIC_MODELLED_ENTRY: not RN1-derived, not"
            say "filled, not funded, and not in any benchmark result"
          else
            echo "::error::the acceptance position was NOT driven to two COMPLETE decisions: $COMPLETE complete at $DISTINCT distinct instants (need 2 and 2), with $COND conditional on settlement compatibility, of $NDEC decisions. The INCOMPLETE lines name what each one lacked and the per-link lines name where its chain stopped. A conditional comparison is reported above and is NOT acceptance."
            say "NOT DEMONSTRATED as a COMPLETE comparison on the acceptance position"
            FAIL=1
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      # ── THE SAME POSITION, MANAGED ACROSS SUCCESSIVE CYCLES ────────
      #
      # The directive asks for an authenticated production trace of ONE
      # position managed over more than one cycle, with the CURRENT
      # inventory and CORRECTLY SIZED alternatives. Step 17 prints the
      # first decision only, which cannot show either. This reads every
      # decision on the row and then ASSERTS the structural invariant the
      # fifth defect broke, against production data:
      #
      #   HOLD is valued on the inventory being ranked -- qty_valued ==
      #   residual_qty -- no candidate is sized above the residual, and
      #   no decision carries a quantity_mismatch.
      #
      # A deployed build with the seed-sized hold value FAILS this step
      # the moment a position has taken a partial fill. It is deliberately
      # an assertion and not a printout: a printed number nobody compares
      # is how the defect survived a release.
      # ITS OWN STEP, BECAUSE A `run:` BLOCK IS CAPPED AT 21,000 CHARS.
      # Adding the named subjects pushed the successive-cycles body to
      # 26,265 and GitHub refused to parse the workflow at all. Splitting
      # it is the fix, and it also separates choosing the subject from
      # judging it, which is the distinction this whole change is about.
      - name: RN1X — choose the management subject, and drive the loop
        if: ${{ !cancelled() }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # VIA env, NOT INLINE. A `run:` body containing
          # `${{ }}` compiles to ONE expression capped at
          # 21,000 chars; this body is near it. Through
          # `env:` the script stays a literal.
          API_URL: ${{ inputs.api }}
        run: |
          set -u
          API="${API_URL:?}"
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          say () { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          {
            echo "### The management subject, named"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            say "SKIPPED: no ADMIN_TOKEN"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          H="X-Admin-Token: $ADMIN_TOKEN"
          # ── THE SUBJECTS, NAMED. THIS IS THE DEFECT BEING FIXED ──────
          #
          # WHAT THIS STEP USED TO DO. It took the newest position whose policy
          # matched CHALLENGER and judged that, whatever it was. The acceptance
          # policy is ACCEPTANCE_SHADOW_MANAGER_DEMO_V1 and does not match, so
          # the subject was always the challenger position -- which is an ATP
          # TENNIS holding, and tennis is not in the provider's sport set at
          # all. The gate was therefore being applied to inventory whose inputs
          # cannot exist, and I reported the failure as though it were about the
          # acceptance position. A check that does not say which subject it
          # judged is not a check.
          #
          # THREE SUBJECTS NOW, EACH WITH ITS OWN ROLE:
          #
          #   ACCEPTANCE   a position on a COVERED, CURRENT fixture. THE GATE.
          #                Seeded by the existing labelled, unfunded harness.
          #   UNSUPPORTED  the tennis position. Kept VISIBLE with its honest
          #                refusal, and never the gate: an uncoverable sport is
          #                a coverage fact, not a management failure.
          #   ARIZONA      read by EXACT IDENTITY, reported, never the gate.
          #
          # The gate itself is unchanged: two COMPLETE decisions at two DISTINCT
          # instants, on one position, off its own stored evidence.
          curl -s -o /tmp/pos.json --max-time 45 -H "$H" \
            "$API/api/command/rn1x/positions?limit=200" \
            || echo '{}' > /tmp/pos.json
          ARIZONA="RN1X_SHADOW_CHALLENGER_HOLD_RANKED_V1:ACCEPTANCE_SHADOW_MANAGER_DEMO_V1:-105276210"
          
          # 1 · THE ACCEPTANCE SUBJECT. Ask the harness for a position on a
          #     usable fixture. `fresh_if_stale` makes adoption conditional on
          #     the harness's OWN candidate predicate, so a finished fixture is
          #     declined by name instead of adopted and reported as ready.
          : > /tmp/acc_seed.json
          SC=$(curl -s -o /tmp/acc_seed.json -w '%{http_code}' --max-time 180 \
              -X POST -H "$H" -H 'Content-Type: application/json' \
              --data '{"fresh_if_stale": true}' \
              "$API/api/admin/rn1x-acceptance-position" || echo 000)
          say "acceptance harness HTTP $SC"
          head -c 1200 /tmp/acc_seed.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          ACC=$(jq -r '.position_id // empty' /tmp/acc_seed.json 2>/dev/null)
          ACC_STATE=$(jq -r 'if .created then "CREATED"
                             elif .adopted then "ADOPTED"
                             else ("REFUSED:" + ((.refusal // "UNKNOWN")|tostring))
                             end' /tmp/acc_seed.json 2>/dev/null || echo UNKNOWN)
          say "acceptance subject  $ACC_STATE  $ACC"
          # THE DECLINE, IF ANY, PRINTED IN FULL -- it is the evidence that the
          # old unconditional adoption was returning an unusable subject.
          jq -c '.stale_adoption_declined // empty' /tmp/acc_seed.json 2>/dev/null \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          
          # 2 · THE UNSUPPORTED SUBJECT, kept visible and never the gate.
          UNSUP=$(jq -r '[(.positions // [])[]
                    | select(((.policy // "") | test("CHALLENGER"))
                             and ((.policy // "") | test("ACCEPTANCE") | not))]
                   | .[0].position_id // empty' /tmp/pos.json 2>/dev/null)
          
          # 3 · THE GATE'S SUBJECT. The acceptance position when there is one;
          #     otherwise NONE, and the step says so rather than silently
          #     substituting the unsupported one, which is what it used to do.
          if [ -n "$ACC" ]; then PID="$ACC"; SUBJECT=ACCEPTANCE
          else PID=""; SUBJECT=NONE; fi
          say "gate subject        $SUBJECT  ${PID:-none}"
          say "visible, not gated  UNSUPPORTED ${UNSUP:-none}"
          say "visible, not gated  ARIZONA     $ARIZONA"
          # ── THE TWO VISIBLE-BUT-NOT-GATED SUBJECTS, REPORTED FIRST ───
          #
          # They are reported BEFORE the gate so that a gate failure can never
          # be mistaken for an absence of evidence about them, and so that the
          # tennis position's refusal stays on the record under its own name
          # rather than as the gate's verdict.
          vis () {  # $1 = label, $2 = position id
            [ -n "$2" ] || { say "  $1  (none)"; return 0; }
            jq -r --arg p "$2" --arg L "$1" '[(.positions // [])[]
                | select(.position_id == $p)] | .[0] // {}
                | "  " + $L
                  + "  policy=" + ((.policy // "-")|tostring)
                  + "  terminal=" + (if has("terminally_settled")
                                      then (.terminally_settled|tostring)
                                      else "unknown" end)
                  + "  open_to_mgmt=" + (if has("open_to_management")
                                          then (.open_to_management|tostring)
                                          else "unknown" end)
                  + "  residual=" + ((.residual_qty // "-")|tostring)
                  + "  decisions=" + ((.decisions // 0)|tostring)' \
              /tmp/pos.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
            code=$(curl -s -o /tmp/vis.json -w '%{http_code}' --max-time 90 \
                   -H "$H" "$API/api/command/rn1x/input-chain/$2" || echo 000)
            jq -r --arg L "$1" 'def n(x): if x == null then "-" else (x|tostring) end;
                "    " + $L + "  first_failing_link "
                  + n(((.first_failing_link // {}) | if type == "object"
                       then .link else null end))
                  + "  sport " + n(.fixture.sport // (.provider_sport_labels|tostring))
                  + "  supported_alts "
                  + n((.supported_open_challenger_positions // []) | length)' \
              /tmp/vis.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          }
          say "-- visible, NOT gated --"
          vis UNSUPPORTED "$UNSUP"
          vis ARIZONA     "$ARIZONA"
          say ""
          
          # ── DRIVE THE DEPLOYED RECURRING LOOP ────────────────────────
          #
          # THE SAME FUNCTION THE WORKER'S OWN SCHEDULE CALLS.
          # /api/admin/rn1x-run-management invokes
          # `rn1x_shadow.run_continuing_management`, which is what the loop runs
          # on its 900 s cadence. This changes WHEN a cycle runs, not what it
          # does: every decision below is written by `manage_open_positions`
          # under the same policy with the same stored evidence.
          #
          # THE SPACING IS THE POINT. Two decisions inside one second are two
          # decisions at ONE instant, which the gate correctly will not accept,
          # so the cycles are separated and the gate still requires two DISTINCT
          # instants. That requirement is not relaxed anywhere.
          if [ -n "$ACC" ]; then
            BEFORE_N=$(curl -s --max-time 45 -H "$H" \
                "$API/api/command/rn1x/trace/$ACC" \
              | jq '(.decisions // []) | length' 2>/dev/null || echo 0)
            say "acceptance decisions before  ${BEFORE_N:-0}"
            : > /tmp/mgmt.json
            MC=$(curl -s -o /tmp/mgmt.json -w '%{http_code}' --max-time 300 \
                -X POST -H "$H" -H 'Content-Type: application/json' \
                --data '{"cycles": 3, "spacing_s": 20}' \
                "$API/api/admin/rn1x-run-management" || echo 000)
          say "recurring management HTTP $MC"
          jq -c 'del(.runs[]?.result.challenger.results, .runs[]?.result.entry_lane.results)' /tmp/mgmt.json 2>&1 \
              | head -c 1500 | tee -a "$GITHUB_STEP_SUMMARY" || true
            say ""
            jq -r '"drives  " + ((.drives // "-")|tostring),
                   "runs    " + (((.runs // []) | length)|tostring),
                   ((.runs // [])[] | "  cycle " + ((.cycle)|tostring)
                      + "  " + ((.error // "ok")|tostring))' \
              /tmp/mgmt.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
          
          
          # THE HANDOFF. A step's shell variables do not survive into the next
          # step, so the three subjects and the harness outcome are exported
          # explicitly. `/tmp/pos.json` and `/tmp/acc_seed.json` persist on the
          # runner and stay the authoritative copies.
          { echo "GATE_PID=$PID"
            echo "GATE_SUBJECT=$SUBJECT"
            echo "UNSUP_PID=$UNSUP"
            echo "ARIZONA_PID=$ARIZONA"
            echo "ACC_SEED_HTTP=$SC"
            echo "ACC_SEED_STATE=$ACC_STATE"
          } >> "$GITHUB_ENV"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: RN1X — the SAME position across successive cycles
        if: ${{ !cancelled() }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # VIA env, NOT INLINE. A `run:` body containing
          # `${{ }}` compiles to ONE expression capped at
          # 21,000 chars; this body is near it. Through
          # `env:` the script stays a literal.
          API_URL: ${{ inputs.api }}
        run: |
          set -u
          API="${API_URL:?}"; FAIL=0
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          say () { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          {
            echo "### One position, successive cycles, sized alternatives"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            say "SKIPPED: no ADMIN_TOKEN, the authenticated read is not available here"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          H="X-Admin-Token: $ADMIN_TOKEN"
          # THE FILTER IS SERVER-SIDE ON PURPOSE. Newest-first across every
          # experiment, the historical lane's hundreds of rows push the one
          # challenger position off a 50-row page -- which run 37 read as
          # "no challenger position exists" while the row was in the table.
          # ── THE GATE, ON THE SUBJECT THE PREVIOUS STEP NAMED ─────────
          #
          # The subject is read from the environment the chooser exported, so this
          # step cannot quietly pick a different one -- which is exactly the
          # failure being fixed.
          PID="${GATE_PID:-}"
          UNSUP="${UNSUP_PID:-}"
          ARIZONA="${ARIZONA_PID:-}"
          SC="${ACC_SEED_HTTP:-000}"
          ACC_STATE="${ACC_SEED_STATE:-UNKNOWN}"
          say "gate subject  ${GATE_SUBJECT:-NONE}  ${PID:-none}"
          if [ -z "$PID" ]; then
            # THE SUBSTITUTION THAT USED TO HAPPEN SILENTLY. With no acceptance
            # subject this step previously fell through to the unsupported
            # position and gated on that. It now FAILS, because 'the harness
            # could not give me a subject on a covered current fixture' is a
            # real blocker and must not read as a pass or as a skip.
            echo "::error::NO ACCEPTANCE SUBJECT on a covered, current fixture (harness HTTP $SC, state $ACC_STATE). The unsupported position above is NOT a substitute: its sport is not in the provider set, so no priced hold is obtainable for it and gating on it measures coverage, not management."
            say "NO SUPPORTED ACCEPTANCE SUBJECT -- NOT_DEMONSTRATED"
            say "The unsupported position keeps its own honest refusal above."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          # ── THIS STEP NOW WRITES ITS OWN EVIDENCE ──────────────────
          # It has failed since before the settlement release and I could
          # not say WHICH of its three assertions tripped: the job log is
          # long enough that this step's lines fall outside any tail I can
          # retrieve, and the log archive is blocked by egress policy. So
          # the PID, each HTTP code and the head of each response go into a
          # small file that is uploaded as an artifact and echoed at the
          # end of the job. An assertion whose failure cannot be read is
          # not a check, it is a rumour.
          : > /tmp/s19.txt
          s19 () { printf '%s\n' "$*" >> /tmp/s19.txt; }
          s19 "step19 at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          s19 "PID=$PID"
          code=$(curl -s -o /tmp/mg.json -w '%{http_code}' --max-time 60 \
                 -H "$H" "$API/api/command/rn1x/trace/$PID" || echo 000)
          say "trace $PID HTTP $code"
          s19 "trace_http=$code"
          s19 "trace_head=$(head -c 300 /tmp/mg.json 2>/dev/null | tr -d '\n')"
          [ "$code" = "200" ] || { echo "::error::the trace answered $code"; FAIL=1; }
          # NORMALISE. The jsonb columns can arrive as strings depending on
          # the driver's codec, and a jq path into a string silently
          # yields null -- which would make every check below vacuous.
          jq -f /tmp/norm.jq \
            /tmp/mg.json > /tmp/mgn.json 2>/dev/null || echo '{}' > /tmp/mgn.json
          jq -r '"position\t" + (.policy) + "  outcome_index="
                   + ((.outcome_index // "?")|tostring)
                   + "  seed " + ((.seed_qty // "?")|tostring) + " @ "
                   + ((.seed_price // "?")|tostring),
                 "decisions\t" + ((.decisions | length)|tostring)
                   + "  distinct_ts=" + (([.decisions[].ts] | unique | length)|tostring),
                 (.decisions[] | . as $d
                   | "  " + .id[-22:] + "  " + .ts[0:19]
                     + "  " + .action + " x " + ((.qty // "-")|tostring)
                     + "  hold=" + ((.hold // "-")|tostring)
                     + "  resid=" + ((.inv.residual_qty // "-")|tostring)
                     + "  realized=" + ((.inv.realized_pnl_usd // "-")|tostring)
                     + "  " + .state,
                     "      valued_on qty=" + ((.alt.hold_input.qty_valued // "-")|tostring)
                     + " basis_per=" + ((.alt.hold_input.basis_per_contract_valued // "-")|tostring)
                     + " ev_basis=" + ((.alt.hold_input.ev_hold_basis // "-")|tostring)
                     + " mismatch=" + ((.alt.hold_input.quantity_mismatch // "none")|tostring),
                     "      freshness age=" + ((.fr.age_from_observation_s // "-")|tostring)
                     + " bound=" + ((.fr.bound_s // "-")|tostring)
                     + " from=" + ((.fr.bound_source // "-")|tostring),
                     "      eligibility=" + .eligibility,
                     (if ((.alt.ranked // []) | length) == 0
                      then "      ranked: NONE -- every action refused"
                      else ((.alt.ranked // [])[]
                            | "      ranked " + (.action // "?")
                              + " x " + ((.qty // "-")|tostring)
                              + " = " + ((.value_usd // "-")|tostring))
                      end))' /tmp/mgn.json 2>/dev/null \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          # THE ASSERTION. Only decisions that actually priced a hold can
          # be checked; one that refused for a missing input has no
          # quantity to disagree with, and is reported above as such.
          jq -r '[(.decisions // [])[] | select(.hold != null) | . as $d
                  | {id: .id,
                     qv: (.alt.hold_input.qty_valued),
                     resid: (.inv.residual_qty),
                     mm: (.alt.hold_input.quantity_mismatch),
                     over: [((.alt.ranked // [])[]
                             | select((.qty // 0)
                                      > (($d.inv.residual_qty) // 0) + 0.000001))]}]
                 | .[] | select((.qv == null) or (.resid == null)
                                or ((.qv - .resid) | fabs > 0.000001)
                                or (.mm != null) or ((.over | length) > 0))
                 | "VIOLATION\t" + .id + "\tqty_valued=" + ((.qv // "null")|tostring)
                   + " residual=" + ((.resid // "null")|tostring)
                   + " mismatch=" + ((.mm // "none")|tostring)
                   + " oversized=" + ((.over | length)|tostring)' \
            /tmp/mgn.json > /tmp/viol.txt 2>/dev/null || true
          PRICED=$(jq '[(.decisions // [])[] | select(.hold != null)] | length' \
                   /tmp/mgn.json 2>/dev/null || echo 0)
          NDEC=$(jq '(.decisions // []) | length' /tmp/mgn.json 2>/dev/null || echo 0)
          say "priced_holds\t$PRICED of $NDEC decisions"
          s19 "priced_holds=$PRICED of $NDEC"
          s19 "violation_head=$(head -c 300 /tmp/viol.txt 2>/dev/null | tr -d '\n')"
          s19 "fail_before_input_chain=$FAIL"
          if [ -s /tmp/viol.txt ]; then
            cat /tmp/viol.txt | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::a hold was valued on a quantity other than the inventory ranked"
            FAIL=1
          elif [ "$PRICED" = "0" ]; then
            say "NO PRICED HOLD IN PRODUCTION YET -- the invariant is not"
            say "contradicted, and it is also not demonstrated on live rows."
            say "This is reported as unfinished, not as a pass."
          else
            say "INVARIANT HOLDS on $PRICED priced decision(s): HOLD valued on"
            say "the residual, no candidate sized above it, no mismatch"
          fi
          # ── THE INPUT CHAIN, LINK BY LINK ──────────────────────────
          #
          # A blind decision records EV_HOLD_NOT_IDENTIFIED, which is a
          # symptom. This asks the deployed build to walk the same chain a
          # management decision walks and report the FIRST failing link
          # with its identifiers and timestamps, so a missing fixture, an
          # uncovered sport, a stale quote and an unreadable book are
          # never again the same line.
          say "-- the input chain for this position --"
          code=$(curl -s -o /tmp/ch.json -w '%{http_code}' --max-time 90 \
                 -H "$H" "$API/api/command/rn1x/input-chain/$PID" || echo 000)
          say "input-chain HTTP $code"
          s19 "input_chain_http=$code"
          s19 "input_chain_head=$(head -c 500 /tmp/ch.json 2>/dev/null | tr -d '\n')"
          if [ "$code" != "200" ]; then
            echo "::error::the input-chain read answered $code"; FAIL=1
          fi
          s19 "FAIL=$FAIL"
          say "-- step19 evidence (also /tmp/s19.txt) --"
          cat /tmp/s19.txt | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '"inputs_complete\t" + ((.inputs_complete // false)|tostring),
                 "market\t"          + ((.chain[0].outcome // "-")|tostring),
                 "entry_lane_rows\t" + ((.entry_lane_valuations.rows // 0)|tostring)
                                      + " priced=" + ((.entry_lane_valuations.priced // 0)|tostring)
                                      + " eligible=" + ((.entry_lane_valuations.eligible // 0)|tostring)
                                      + " newest_age_s=" + ((.entry_lane_valuations.newest_age_s // "-")|tostring),
                 "cadence_vs_rule\t" + ((.entry_lane_cadence_s // "-")|tostring)
                                      + " s writer vs " + ((.odds_rule_s // "-")|tostring) + " s rule",
                 ((.decision_census // [])[]
                   | "  census " + ((.n)|tostring) + " decisions  priced="
                     + ((.priced)|tostring) + "  basis=" + ((.ev_basis // "-")|tostring)
                     + "  first_failing_link=" + ((.first_failing_link // "-")|tostring)),
                 "provider_labels\t" + ((.provider_sport_labels // [])|tostring),
                 "supported_alternatives\t"
                   + ((.supported_open_challenger_positions // []) | length | tostring)
                   + (if ((.supported_open_challenger_positions // []) | length) == 0
                      then "  NONE -- no open challenger position exists in a covered sport"
                      else "" end),
                 ((.supported_open_challenger_positions // [])[]
                   | "  supported_alt " + (.position_id[-24:]) + "  " + ((.sport)|tostring)
                     + "  " + ((.title // "")[0:40])),
                 "residual\t"        + ((.inventory.residual_qty // "-")|tostring),
                 "payout_event\t"    + ((.payout_event // "-")|tostring),
                 "us_market_slug\t"  + ((.us_market_slug // "-")|tostring),
                 "held_intent\t"     + ((.held_intent // "-")|tostring),
                 "probability\t"     + ((.probability // "-")|tostring),
                 "exit_price\t"      + ((.exit_price // "-")|tostring)
                                      + " x " + ((.exit_size // "-")|tostring),
                 "odds_request\t"    + ((.odds_request // {})|tostring),
                 "provider_ages\t"   + ((.provider_quote_ages_s // "none")|tostring),
                 "fixture\t"         + ((.fixture // "unknown")|tostring),
                 "venue_resolution\t" + ((.venue_resolution // "not_read")|tostring),
                 "settlement\t"      + ((.settlement // "not_reached")|tostring),
                 "clocks\t"          + ((.clocks // {})|tostring),
                 ((.chain // [])[]
                   | "  " + (.link)
                     + (if .ok then "  OK    " else "  FAILED " end)
                     + ((. | del(.link, .ok) | tostring)[0:400])),
                 "first_failing_link\t"
                   + (((.first_failing_link // {}).link) // "none")
                   + "  " + (((.first_failing_link // {}).refusal) // "")' \
            /tmp/ch.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 400 /tmp/ch.json
          # ── ACCEPTANCE, FROM THE DECISION'S OWN STORED EVIDENCE ───
          #
          # Two priced HOLDs are NOT sufficient. A diagnostic pull taken after
          # the fact cannot establish what a decision knew, so every requirement
          # below is read off the DECISION ROW: the chain it recorded, the
          # freshness it measured, the ladder it saw, the inventory it ranked,
          # the alternatives it scored, and whether its accounting reconciled.
          #
          # A MISSING-BOOK HOLD DOES NOT SATISFY THIS. It is a legitimate
          # decision and it is not a demonstration of the manager.
          # THE SHARED ACCEPTANCE PROGRAM, written by the step above.
          # One definition, two steps: a second copy here is a second
          # thing to forget to update.
          ACC=$(cat /tmp/acc.jq 2>/dev/null || true)
          if [ -z "$ACC" ]; then
            echo "::error::the shared acceptance program was not written"
            say "ACCEPTANCE PROGRAM MISSING -- not evaluated"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if ! jq -e "$ACC" /tmp/mgn.json > /tmp/acc.json; then
            # MALFORMED ACCEPTANCE DATA IS A FAILURE, never a skip: a trace this
            # checker cannot read is a trace nobody can accept.
            echo "::error::the acceptance checker could not read the trace"
            say "ACCEPTANCE DATA MALFORMED -- it could not be evaluated"
            head -c 400 /tmp/mgn.json | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          # THE DUMP IS CAPPED, and the cap is stated. A position that has
          # been re-decided 120 times printed 120 identical INCOMPLETE
          # lines, which pushed every EARLIER step out of any readable
          # window -- so the one part of the log a reader needs most, the
          # acceptance step above, became unreadable because this step was
          # verbose. Every COMPLETE row is always printed; the INCOMPLETE
          # ones are summarised by their missing-set and only the most
          # recent few are shown in full.
          jq -r '[.[] | select((.missing | length) == 0)] | .[] | "  " + (.id[-22:]) + "  " + (.ts[0:19]) + "  COMPLETE"' /tmp/acc.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '[.[] | select((.missing | length) > 0)] | group_by(.missing|tostring) | .[] | "  INCOMPLETE x" + ((length)|tostring) + "  " + (.[0].missing|tostring) + "  (first " + (.[0].ts[0:19]) + ", last " + (.[-1].ts[0:19]) + ")"' /tmp/acc.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '[.[] | select((.missing | length) > 0)] | .[-3:] | .[] | "  " + (.id[-22:]) + "  " + (.ts[0:19]) + "  INCOMPLETE " + ((.missing)|tostring)' /tmp/acc.json | tee -a "$GITHUB_STEP_SUMMARY"
          COMPLETE=$(jq '[.[] | select((.missing | length) == 0)] | length' /tmp/acc.json)
          DISTINCT=$(jq '[.[] | select((.missing | length) == 0) | .ts] | unique | length' /tmp/acc.json)
          IDS=$(jq -r '[.[] | select((.missing | length) == 0) | .id] | join("  ")' /tmp/acc.json)
          say "priced_holds\t$PRICED of $NDEC decisions"
          say "complete\t$COMPLETE   distinct_instants\t$DISTINCT"
          # ── WHICH QUESTION THIS POSITION IS ENTITLED TO BE ASKED ────
          #
          # THE DEFECT THIS FIXES, AND IT WAS IN THE CHECK, NOT THE CODE. This
          # step demanded two complete priced HOLD decisions at two distinct
          # instants, unconditionally. The acceptance position's fixture is
          # OVER: the odds provider stops carrying a finished game, the input
          # chain records `first_failing_link 3_PROVIDER_FIXTURE`, and no
          # EV_HOLD can be identified for it again. So that demand was
          # unsatisfiable for this position on every future run, and the step
          # failed for a reason that had nothing to do with the manager. I
          # reported it as pre-existing, which is true and is not a defence:
          # an assertion that cannot be satisfied is not evidence of anything.
          #
          # A POSITION WHOSE TERMINAL PATH IS SETTLEMENT IS VERIFIED BY ITS
          # EXCLUSION FROM MANAGEMENT, not by continued management of a
          # contract that no longer exists. Terminality is read from the SAME
          # predicate the scheduled manager uses -- `open_to_management` is
          # computed from `bettor_rn1x_store.NOT_TERMINALLY_SETTLED` itself,
          # not from a second copy written here -- so 'it has left recurring
          # management' is a fact about the manager's own query.
          # `// "unknown"` IS WRONG HERE AND I USED IT FIRST. In jq `//` takes
          # the right side when the left is false OR null, so a correctly
          # EXCLUDED position -- open_to_management false, which is the passing
          # state -- read back as "unknown", and a build with no such field read
          # back as "false", which is the failing state. The two cases the
          # branch below has to tell apart were the two `//` conflates. This is
          # the fifth time a jq subtlety has corrupted a report in this file, so
          # ABSENCE IS TESTED WITH `has`, and the extractor is written once.
          fld () {
            jq -r --arg p "$PID" --arg k "$1" '[(.positions // [])[]
                | select(.position_id == $p)] | .[0] // {}
                | if has($k) and (.[$k] != null) then (.[$k]|tostring)
                  else "unknown" end' /tmp/pos.json 2>/dev/null || echo unknown
          }
          TERM=$(fld terminally_settled)
          OPENM=$(fld open_to_management)
          BASIS=$(fld outcome_basis)
          RESID=$(fld residual_qty)
          NETU=$(fld net_usd)
          say "terminal      $TERM  open_to_management=$OPENM  basis=$BASIS"
          say "              residual=$RESID  net_usd=$NETU"
          s19 "terminal=$TERM open_to_management=$OPENM basis=$BASIS"
          s19 "residual=$RESID net_usd=$NETU"
          if [ "$TERM" = "unknown" ]; then
            # THE READ THAT DECIDES WHICH QUESTION TO ASK MUST ITSELF BE
            # READABLE. A build that does not report terminality cannot be
            # judged either way, and silently falling back to the old demand
            # would reproduce the unsatisfiable failure under a new name.
            echo "::error::the positions read did not report terminality, so neither acceptance question can be evaluated against this build"
            say "TERMINALITY NOT REPORTED -- NOT EVALUATED"
            FAIL=1
          elif [ "$TERM" = "true" ]; then
            say "THIS POSITION IS TERMINALLY SETTLED, so the question is
          TERMINAL EXCLUSION, not continued management."
            TFAIL=0
            case "$BASIS" in
              VENUE_AUTHORITATIVE_SETTLEMENT_OF_THE_HELD_CONTRACT|VENUE_CONFIRMED_VOID_STAKES_RETURNED)
                say "  basis            OK    $BASIS" ;;
              *) echo "::error::terminal was reported but the basis is $BASIS, which is not one of the venue-authoritative bases"
                 TFAIL=1 ;;
            esac
            if [ "$OPENM" = "false" ]; then
              say "  left_management   OK    the manager's own predicate no longer
          selects it"
            else
              echo "::error::a terminally settled position is still open to management (open_to_management=$OPENM)"
              TFAIL=1
            fi
            # EXPOSURE RELEASED. A settled contract holds nothing, and a
            # non-zero residual beside a terminal basis is a contradiction
            # between two records of the same position.
            if [ "$RESID" = "0" ] || [ "$RESID" = "0.0" ]; then
              say "  exposure          OK    residual 0"
            else
              echo "::error::terminal basis with residual $RESID -- the exposure was not released"
              TFAIL=1
            fi
            if [ "$NETU" = "unknown" ]; then
              echo "::error::terminal basis with no recorded net P&L -- the accounting was not written"
              TFAIL=1
            else
              say "  accounting        OK    net_usd $NETU recorded"
            fi
            if [ "$TFAIL" = "0" ]; then
              say "TERMINAL EXCLUSION VERIFIED: settled on a venue-authoritative
          basis, excluded from the manager's own open-position predicate,
          exposure released and accounting recorded. Continued hold
          valuation is NOT required of a finished contract."
            else
              say "TERMINAL EXCLUSION NOT VERIFIED"
              FAIL=1
            fi
            # AND THE MANAGEMENT DEMONSTRATION IS REPORTED, NOT CLAIMED. A
            # terminal position passing exclusion does not demonstrate the
            # manager on live rows, and this says so rather than letting the
            # pass above read as though it had.
            if [ "$COMPLETE" -ge 2 ] && [ "$DISTINCT" -ge 2 ]; then
              say "and it ALSO carries $COMPLETE complete priced decisions at"
              say "$DISTINCT distinct instants: $IDS"
            else
              say "THE RECURRING-MANAGEMENT DEMONSTRATION REMAINS SEPARATE AND"
              say "IS NOT MET BY THIS POSITION: $COMPLETE complete at $DISTINCT"
              say "instants. It needs an OPEN position in a covered sport, which"
              say "is a different position, and is reported as unfinished."
            fi
          elif [ "$COMPLETE" -ge 2 ] && [ "$DISTINCT" -ge 2 ]; then
            say "ACCEPTANCE MET on the SAME position:"
            say "  $IDS"
            say "each with a verified held-exposure mapping, a probability inside"
            say "its own bound, a usable exit ladder with depth, the current"
            say "residual, ranked alternatives with a selected action and"
            say "quantity, and reconciled accounting"
          else
            echo "::error::acceptance NOT met: $COMPLETE complete decisions at $DISTINCT distinct instants (need 2 and 2); priced_holds=$PRICED of $NDEC. The position is NOT terminally settled, so continued management is the right question for it. The INCOMPLETE lines above name what each one lacks and the input chain names the link that stopped it."
            say "ACCEPTANCE NOT MET -- NOT_DEMONSTRATED"
            FAIL=1
          fi
          s19 "FAIL_after_acceptance=$FAIL"
          # THE EVIDENCE FILE IS ECHOED AGAIN HERE, AT THE END. The earlier
          # copy was printed before the acceptance verdict existed, so the
          # summary held a file that stopped short of the thing a reader wants
          # most. The uploaded artifact is this complete version.
          say "-- step19 evidence, final --"
          cat /tmp/s19.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $FAIL

      - name: Mobile viewport is declared
        run: |
          grep -q 'name="viewport"' /tmp/index
          echo "viewport meta present (mobile layout served the same bundle)" \
            >> "$GITHUB_STEP_SUMMARY"

      # ── THE EXTERNAL-VALUATION SHADOW: arm, run, and read it back ──
      #
      # THE ONE STEP HERE THAT WRITES. It flips a shadow experiment's
      # control row and then reads production back. The experiment it
      # gates places no order: its only writer is `external_valuations`,
      # whose order_submitted column CHECKs FALSE, and every venue
      # submission authorizes at the venue boundary independently.
      #
      # The evidence it collects is the whole of item 5: the running
      # process actually retrieving odds, the refusal census with counts,
      # the clock audit's split between rows that can and cannot support a
      # prospective claim, and one complete valuation trace.
      # `!cancelled()` ON PURPOSE. Run 27 aborted at an earlier proxy check
      # and skipped this step, so one bounded run produced a health failure
      # and NO trading evidence at all -- and the next run had to spend the
      # provider budget again to get it. Trading acceptance now attempts
      # even when a preceding check failed, because the refusals it reports
      # are exactly what the failure needs interpreting against. The job
      # still fails: this does not turn a red run green.
      - name: External valuation — arm, cycle, and read production back
        if: ${{ !cancelled() && github.event.inputs.arm_external != '' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
          WANT: ${{ github.event.inputs.arm_external }}
        run: |
          set -u
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::error::ADMIN_TOKEN is not set"; exit 1; fi
          case "$WANT" in on|off) : ;;
            *) echo "::error::arm_external must be on or off"; exit 1 ;; esac
          H="X-Admin-Token: $ADMIN_TOKEN"
          say () { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          {
            echo "### EXTERNAL VALUATION SHADOW ($WANT)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 1 · CAN THE RUNNING PROCESS RETRIEVE ODDS? The credential was
          # provisioned onto this service; that is not the same as the
          # process being able to use it.
          code=$(curl -s -o /tmp/pr.json -w '%{http_code}' --max-time 60 \
                 -H "$H" "$API/api/command/rn1x/external/probe" || echo 000)
          say "probe HTTP $code"
          jq -r '"credential_present\t" + ((.credential.present)|tostring),
                 "retrieved\t"         + ((.retrieved)|tostring),
                 "http_status\t"       + ((.http_status // "?")|tostring),
                 "sport\t"             + (.sport // "?"),
                 "events\t"            + ((.events // 0)|tostring),
                 "with_pinnacle_h2h\t" + ((.events_with_pinnacle_h2h // 0)|tostring),
                 "quote_age_s\t"       + ((.quote_age_s // "none")|tostring),
                 "credits_used\t"      + ((.credits_used_total // "?")|tostring),
                 "credits_left\t"      + ((.credits_remaining // "?")|tostring),
                 "key_value_returned\t"+ ((.key_value_returned)|tostring)' \
            /tmp/pr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || \
            head -c 300 /tmp/pr.json

          # 2 · ARM (or STOP) the control row.
          code=$(curl -s -o /tmp/arm.json -w '%{http_code}' --max-time 45 \
                 -X POST -H "$H" \
                 "$API/api/admin/ext-pinnacle-shadow/$WANT" || echo 000)
          say "arm($WANT) HTTP $code"
          jq -c . /tmp/arm.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 200 /tmp/arm.json
          [ "$code" = "200" ] || { echo "::error::the arm was refused"; }

          # 3 · Let the loop notice. Its idle poll is 60 s, so two of
          # those plus slack is enough for a cycle to have run.
          [ "$WANT" = "on" ] && sleep 150

          # 4 · THE REFUSAL CENSUS. When nothing clears, this IS the
          # deliverable, so it is read with counts rather than asserted.
          code=$(curl -s -o /tmp/cs.json -w '%{http_code}' --max-time 60 \
                 -H "$H" "$API/api/command/rn1x/external/census" || echo 000)
          say "census HTTP $code"
          jq -r '"evaluated\t"  + ((.summary.evaluated  // 0)|tostring),
                 "admissible\t" + ((.summary.admissible // 0)|tostring),
                 "refused\t"    + ((.summary.refused    // 0)|tostring),
                 "priced\t"     + ((.summary.priced     // 0)|tostring),
                 "settled\t"    + ((.summary.settled    // 0)|tostring),
                 "first_at\t"   + ((.summary.first_at   // "none")|tostring),
                 "last_at\t"    + ((.summary.last_at    // "none")|tostring),
                 "-- refusals --",
                 (.refusals // {} | to_entries[]
                    | "  \(.key)\t\(.value)")' \
            /tmp/cs.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 400 /tmp/cs.json

          # 5 · THE CLOCK AUDIT. Which positions can support a
          # prospective claim, and which were backdated and cannot.
          code=$(curl -s -o /tmp/ca.json -w '%{http_code}' --max-time 60 \
                 -H "$H" "$API/api/command/rn1x/clock-audit" || echo 000)
          say "clock-audit HTTP $code"
          jq -r '"badge\t"      + (.badge // "?"),
                 "positions\t"  + ((.positions_total // 0)|tostring),
                 "prospective_ok\t" + ((.can_support_a_prospective_claim // 0)|tostring),
                 "backdated\t"  + ((.backdated_and_cannot // 0)|tostring),
                 "-- by basis --",
                 (.rows // [] | .[]
                    | "  \(.experiment_id)\t\(.decision_basis)\t\(.positions)")' \
            /tmp/ca.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 400 /tmp/ca.json

          # 5b · ARM THE FITTING LOOP and read its tile, plus the two
          # book tiles. Separate from the comparator on purpose.
          code=$(curl -s -o /tmp/mf.json -w '%{http_code}' --max-time 45 \
                 -X POST -H "$H" \
                 "$API/api/admin/rn1x-model-fit/$WANT" || echo 000)
          say "model-fit arm($WANT) HTTP $code"
          jq -c . /tmp/mf.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 200 /tmp/mf.json
          [ "$WANT" = "on" ] && sleep 150

          code=$(curl -s -o /tmp/st2.json -w '%{http_code}' --max-time 60 \
                 -H "$H" "$API/api/command/rn1x/statuses" || echo 000)
          say "statuses HTTP $code"
          jq -r '.statuses | to_entries[]
                 | "\(.key)\t\(.value.badge)\t\((.value.why // "")[0:78])"' \
            /tmp/st2.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 300 /tmp/st2.json
          echo "-- model fitting, in detail --" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.statuses.model_fitting
                 | "target\t"        + (.target // "?"),
                   "armed\t"         + ((.armed)|tostring),
                   "predictions\t"   + ((.predictions // 0)|tostring),
                   "joined\t"        + ((.joined_outcomes // 0)|tostring),
                   "promotes\t"      + ((.promotes_a_winner)|tostring),
                   "not_settlement\t"+ ((.this_is_not_a_settlement_forecast)|tostring),
                   "last_cycle\t"    + ((.last_cycle // "none")|tostring)' \
            /tmp/st2.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          # 5a · THE EXTERNAL LOOP'S OWN CYCLE TALLY. The census above
          # counts only candidates that were SCORED, and most of this
          # loop's refusals fire before scoring, so a cycle can refuse
          # everything and leave the census empty. Run 21 did exactly that
          # -- `evaluated 0` with four named refusals accounting for all 46
          # events -- and this is the read that says why.
          echo "-- external: last cycle, ALL refusals --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.statuses.external_valuation.last_cycle
                 | if . == null then "no cycle heartbeat yet"
                   else "state\t"      + ((.state // "?")|tostring),
                        "evaluated\t"  + ((.evaluated // 0)|tostring),
                        "written\t"    + ((.written // 0)|tostring),
                        "markets\t"    + ((.markets_considered // 0)|tostring),
                        "elapsed_s\t"  + ((.elapsed_s // 0)|tostring),
                        (.refusals // {} | to_entries[]
                           | "  \(.key)\t\(.value)"),
                        ((.venue_errors // [])
                           | if length == 0
                             then "  (no venue diagnostic this cycle)"
                             else (.[] | "  venue_error\t" + tostring)
                             end)
                   end' /tmp/st2.json 2>/dev/null \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo "-- order book + P&L --" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '"orders_total\t"  + ((.statuses.order_book_state.orders_total // 0)|tostring),
                 "settled_total\t" + ((.statuses.shadow_pnl.settled_total // 0)|tostring),
                 "unrealised\t"    + ((.statuses.shadow_pnl.unrealised // "?")|tostring)' \
            /tmp/st2.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          # SINGLE-WRITER OWNERSHIP, read from the server rather than
          # claimed in a comment. Two of the four loops did not hold the
          # lock the checklist credited them with.
          echo "-- writer ownership (pg_locks) --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.statuses.writer_ownership
                 | "badge\t"   + ((.badge // "?")|tostring),
                   "holding\t" + ((.loops_holding_their_lock // 0)|tostring),
                   "doubled\t" + ((.more_than_one_holder // [])|tostring),
                   (.held // {} | to_entries[]
                      | "  \(.key)\t\(.value)")' \
            /tmp/st2.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          # THE VENUE READ, ON DEMAND -- the refusal run 22 could not
          # explain, asked directly instead of waiting for a cycle.
          echo "-- venue read probe (the loop's own reader) --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # `candidates`, `error` and the per-row `exception` are printed
          # because run 26 printed NONE of them: the probe raised a
          # TypeError in our own code, the handler put it in a field this
          # read ignored, and `attempted 1 / ok 0 / results []` was taken
          # as a venue refusal. A crash in the probe must be legible AS a
          # crash in the probe.
          jq -r '.venue_read_probe
                 | "candidates\t" + ((.candidates // 0)|tostring),
                   "attempted\t" + ((.attempted // 0)|tostring),
                   "ok\t"        + ((.ok // 0)|tostring),
                   "probe_error\t" + ((.error // "-")|tostring)
                                  + " " + ((.error_detail // "")|tostring),
                   "probe_refusal\t" + ((.refusal // "-")|tostring),
                   "verdict\t"   + ((.verdict // "?")|tostring),
                   ((.results // [])[]
                      | "  " + ((.us_market_slug // "?")|tostring)
                        + "\t" + ((.ok)|tostring)
                        + "\t" + ((.refusal // "-")|tostring)
                        + "\t" + ("exc=" + ((.exception // "-")|tostring)
                                  + " " + ((.detail // "")|tostring))
                        + "\t" + (((.diagnostic // {}) | "stage=" +
                            ((.stage // "-")|tostring) + " code=" +
                            ((.code // "-")|tostring) + " status=" +
                            ((.status // "-")|tostring) + " exc=" +
                            ((.exception // "-")|tostring) + " detail=" +
                            ((.detail // "-")|tostring)))
                        + "\t" + ("ask=" + ((.ask // "-")|tostring)
                                  + " depth=" + ((.depth // "-")|tostring)))' \
            /tmp/pr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

          # THE PROSPECTIVE LANE, split: a running loop is not evidence.
          echo "-- prospective lane: process vs evidence --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.statuses.prospective_rn1_management
                 | "badge\t"            + ((.badge // "?")|tostring),
                   "positions\t"        + ((.positions // 0)|tostring),
                   "runtime_decision\t" + ((.with_observed_runtime_decision // 0)|tostring),
                   "legacy_backdated\t" + ((.legacy_backdated_and_reclassified // 0)|tostring),
                   "newest_decision\t"  + ((.newest_decision_ts // "none")|tostring),
                   "by_basis\t"         + ((.by_decision_basis // {})|tostring),
                   "why_none\t"         + ((.why_none_qualify // "-")|tostring),
                   "flow\t"             + ((.last_cycle_prospective.flow // {})|tostring),
                   "accounted\t"        + ((.last_cycle_prospective.every_candidate_accounted)|tostring),
                   "last_cycle\t"       + ((.last_cycle_prospective.refusals // {})|tostring)' \
            /tmp/st2.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

          # PREDICTION MATURITY -- whether 0 joined is waiting or a defect.
          echo "-- prediction maturity --" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.statuses.model_fitting.maturity
                 | "earliest_prediction\t" + ((.earliest_prediction_at // "none")|tostring),
                   "earliest_maturity\t"   + ((.earliest_maturity_at // "none")|tostring),
                   "next_maturity\t"       + ((.next_maturity_at // "none")|tostring),
                   "matured_not_joined\t"  + ((.matured_but_not_joined // 0)|tostring),
                   "eval_floor\t"          + ((.evaluation_floor // "?")|tostring)' \
            /tmp/st2.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

          # WHAT CODE THE ACTIVE WRITERS ARE RUNNING, from the writers.
          echo "-- active writer code identity --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '"external\t" + ((.statuses.external_valuation.last_cycle.writer // "none")|tostring),
                 "model\t"    + ((.statuses.model_fitting.last_cycle.writer // "none")|tostring),
                 # THE STANDBY, AS ITS OWN LINE. It used to be written
                 # into last_cycle above, so every read returned the
                 # empty cycle of the process that writes nothing.
                 "external_standby\t" + ((.statuses.external_valuation.standby.state // "none")|tostring),
                 "model_standby\t"    + ((.statuses.model_fitting.standby.state // "none")|tostring)' \
            /tmp/st2.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

          # THE PROGRESS PROVIDER: connected, or the named reason not.
          # THE LEARNING EVALUATION, IN FULL. The tile reports counts;
          # this is the measurement, including a baseline that was fixed
          # before the outcomes rather than computed from them.
          echo "-- learning evaluation (the measurement) --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/ev.json -w '%{http_code}' --max-time 90 \
                 -H "$H" "$API/api/command/rn1x/model-evaluation" || echo 000)
          say "model-evaluation HTTP $code"
          jq -r 'if .ok != true then
                   "refusal\t" + ((.refusal // .error // "?")|tostring)
                   + "  n=" + ((.n // 0)|tostring)
                   + "  floor=" + ((.floor // "?")|tostring)
                 else
                   "target\t"       + ((.target // "?")|tostring),
                   "n_rows\t"       + ((.n // 0)|tostring),
                   "unique_cond\t"  + ((.clustering.unique_conditions // 0)|tostring),
                   "largest_clust\t"+ ((.clustering.largest_cluster // 0)|tostring),
                   "versions\t"     + ((.model_versions // [])|tostring),
                   "first_pred\t"   + ((.predicted_at_first // "?")|tostring),
                   "last_pred\t"    + ((.predicted_at_last // "?")|tostring),
                   "log_loss\t"     + ((.log_loss // "?")|tostring),
                   "brier\t"        + ((.brier // "?")|tostring),
                   "obs_rate\t"     + ((.observed_outcome_rate // "?")|tostring),
                   "prior_rows\t"   + ((.baseline.rows_with_a_stored_prior // 0)|tostring),
                   "prior_missing\t"+ ((.baseline.rows_without // 0)|tostring),
                   "base_logloss\t" + ((.baseline.baseline_log_loss // "UNAVAILABLE")|tostring),
                   "delta_ll\t"     + ((.baseline.delta_log_loss_model_minus_baseline // "UNAVAILABLE")|tostring),
                   "oos_verified\t" + ((.out_of_sample_check.verified_label_evidence_postdates_prediction // 0)|tostring),
                   "oos_violations\t"+ ((.out_of_sample_check.n_violations // 0)|tostring),
                   "is_oos\t"       + ((.is_out_of_sample)|tostring)
                 end' /tmp/ev.json 2>/dev/null \
            | tee -a "$GITHUB_STEP_SUMMARY" || head -c 300 /tmp/ev.json

          # THE OBSERVATION DELIVERABLE: the captured terms against the
          # ladders the collector actually persisted, with the
          # hypothetical share kept apart from earned rewards.
          echo "-- incentive: observed programme ladders --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/os.json -w '%{http_code}' --max-time 120 \
                 -H "$H" "$API/api/command/incentive/observed-share" \
                 || echo 000)
          say "observed-share HTTP $code"
          jq -r 'if .ok != true then
                   "refusal\t" + ((.refusal // .error // "?")|tostring)
                 else
                   "programme_ids\t"  + ((.programme_ids // [])|tostring),
                   "matched\t"        + ((.matched_markets // [])|length|tostring),
                   "not_observed\t"   + ((.programme_markets_not_observed // [])|length|tostring),
                   "outside_prog\t"   + ((.observed_markets_not_in_programme // [])|length|tostring),
                   "earned_usd\t"     + ((.earned_rewards_usd)|tostring),
                   ((.results // [])[] | "  " + ((.market // "?")[27:40])
                      + "\toff=" + ((.offset_ticks // 0)|tostring)
                      + "\tsnaps=" + ((.snapshots // 0)|tostring)
                      + "\tuptime=" + ((.qualifying_uptime // 0)|tostring)
                      + "\tshare=" + ((.mean_share // 0)|tostring)
                      + "\thypoth$=" + ((.reward_gross_usd // 0)|tostring)
                      # WHY A ZERO IS ZERO. Run 26 returned uptime 0.0 on
                      # all 12 programme markets with 400 snapshots each,
                      # and the printed fields could not tell "no levels
                      # were parsed out of the payload" (an adapter
                      # defect) from "the book never qualified even with
                      # our clip inserted" (a finding). These three
                      # separate them, and they were in the response all
                      # along.
                      + "\tno_book=" + ((.side_snapshots_with_no_book // 0)|tostring)
                      + "\tbid_q=" + ((.bid_qualifying // 0)|tostring)
                      + "\task_q=" + ((.ask_qualifying // 0)|tostring))
                 end' /tmp/os.json 2>/dev/null \
            | tee -a "$GITHUB_STEP_SUMMARY" || head -c 300 /tmp/os.json

          echo "-- the venue's own event payload (progress?) --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.second_half_exit.venue_event_probe
                 | "events\t"      + ((.events_seen // 0)|tostring),
                   "carries_period\t" + ((.carries_observed_period)|tostring),
                   "progress_keys\t"  + ((.progress_like_keys // [])|tostring),
                   "verdict\t"     + ((.verdict // "?")|tostring)' \
            /tmp/pr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo "-- progress provider integration --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.second_half_exit.provider_integration
                 | "provider\t"  + ((.provider // "none")|tostring),
                   "connected\t" + ((.connected)|tostring),
                   "refusal\t"   + ((.refusal // "-")|tostring),
                   "adapters\t"  + ((.adapters_available // [])|tostring),
                   "unblocks\t"  + ((.would_unblock // [])|tostring)' \
            /tmp/pr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo "-- the second-half blocker, measured --" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.progress_probe
                 | "scores_http\t"       + ((.status // "?")|tostring),
                   "events\t"            + ((.events // 0)|tostring),
                   "in_play\t"           + ((.in_play_with_scores // 0)|tostring),
                   "progress_fields\t"   + ((.progress_fields_present // [])|tostring),
                   "carries_period\t"    + ((.carries_observed_period)|tostring),
                   "verdict\t"           + ((.verdict // "?")|tostring)' \
            /tmp/pr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '.second_half_exit
                 | "rule_written_for\t"  + ((.sports_with_a_written_rule // [])|tostring),
                   "feed_connected\t"    + ((.sports_with_a_connected_feed // [])|tostring),
                   "missing\t"           + ((.missing_capability // "?")|tostring)' \
            /tmp/pr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

          # 6 · ONE COMPLETE VALUATION TRACE, if any row exists. Every
          # field the directive lists, on one row, from production.
          RID=$(jq -r '.summary.evaluated // 0' /tmp/cs.json 2>/dev/null)
          if [ "${RID:-0}" != "0" ] && [ "${RID:-0}" != "null" ]; then
            code=$(curl -s -o /tmp/lst.json -w '%{http_code}' --max-time 60 \
                   -H "$H" "$API/api/command/rn1x/statuses" || echo 000)
            ID=$(jq -r '.statuses.external_valuation.last_id // empty' \
                 /tmp/lst.json 2>/dev/null)
            if [ -z "$ID" ]; then ID=1; fi
            code=$(curl -s -o /tmp/et.json -w '%{http_code}' --max-time 60 \
                   -H "$H" "$API/api/command/rn1x/external/trace/$ID" \
                   || echo 000)
            say "external trace($ID) HTTP $code"
            jq -r '.valuation
                   | "condition_id\t"  + ((.condition_id // "?")|tostring),
                     "selection\t"     + ((.contract_selection // "?")|tostring),
                     "event_key\t"     + ((.event_key // "?")|tostring),
                     "period\t"        + ((.period // "?")|tostring),
                     "settlement\t"    + ((.settlement_rule // "?")|tostring),
                     "devig_method\t"  + ((.devig_method // "?")|tostring),
                     "raw_odds\t"      + ((.raw_odds // {})|tostring),
                     "observed_at\t"   + ((.observed_at // "?")|tostring),
                     "received_at\t"   + ((.received_at // "?")|tostring),
                     "age_s\t"         + ((.age_s // "?")|tostring),
                     "outcome_books\t" + ((.outcome_books // "?")|tostring),
                     "probability\t"   + ((.probability // "null")|tostring),
                     "exec_price\t"    + ((.executable_price // "null")|tostring),
                     "cost\t"          + ((.cost_per_contract // "null")|tostring),
                     "edge\t"          + ((.estimated_edge_per_contract // "null")|tostring),
                     "decision\t"      + ((.decision // "?")|tostring),
                     "admissible\t"    + ((.admissible)|tostring),
                     "refusals\t"      + ((.refusals // [])|tostring),
                     "outcome_known\t" + ((.outcome_known)|tostring),
                     "order_submitted\t" + ((.order_submitted)|tostring)' \
              /tmp/et.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
              || head -c 500 /tmp/et.json
          else
            say "no valuation rows yet -- the census above says why"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── THE ACCEPTANCE POSITION, READ DIRECTLY AND UNFILTERED ────────
      #
      # THE DEFECT THIS EXISTS FOR, AND IT WAS A REPORTING DEFECT OF MINE.
      # The continuing-management read asks for `policy=CHALLENGER` and the
      # supported-alternatives query filters `policy LIKE '%CHALLENGER%'`.
      # The acceptance position's POLICY is ACCEPTANCE_SHADOW_MANAGER_DEMO_V1
      # -- the substring CHALLENGER appears only in its position_id's
      # experiment prefix -- so BOTH reads exclude it by construction. An
      # empty challenger list is therefore no evidence at all about whether
      # the acceptance position exists, and reading it as "absent" is
      # reading unavailable evidence as a finding.
      #
      # So this step asks the two questions directly: the exact position_id
      # by name, and the acceptance POLICY on its own. It runs `always()`
      # because the steps above can fail, and their failure is exactly when
      # this answer matters most.
      - name: RN1X — the ACCEPTANCE position, read by id and by its own policy
        if: always()
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # THE MISSING ENV THAT KILLED THIS STEP ON EVERY RUN. The body
          # does `API="${API_URL:?}"` under `set -u`, and this block never
          # passed API_URL -- so the step died on line 9 with
          # `API_URL: parameter null or not set` and reported a red X
          # without performing a single read. A step that never ran is not
          # a finding about the position it was meant to read.
          API_URL: ${{ inputs.api }}
        run: |
          set -uo pipefail
          # THE API ORIGIN, NOT THE PROXIED HOST. netlify.toml proxies ONLY
          # /api/command/*, so an /api/admin/* call sent to the COMMAND host
          # falls through to the SPA catch-all and returns the site's
          # page-not-found HTML as a 404. Every other step here uses
          # inputs.api for exactly that reason; these two did not, which is
          # why the acquisition POST 404'd while the /api/command reads in the
          # same step succeeded.
          API="${API_URL:?}"
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            say "SKIPPED: no ADMIN_TOKEN"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          H="X-Admin-Token: $ADMIN_TOKEN"
          # THE SELECTED SUBJECT, NOT A HARDCODED ID. `GATE_PID` is what step
          # 19 chose and exported; the literal is the Arizona fallback for a
          # run where no subject was chosen. THE DEFECT THIS FIXES: with the
          # id hardcoded, this step watched ARIZONA while the gate judged
          # HOUSTON, and I read "no new decision" off the wrong position.
          PID="${GATE_PID:-RN1X_SHADOW_CHALLENGER_HOLD_RANKED_V1:ACCEPTANCE_SHADOW_MANAGER_DEMO_V1:-105276210}"
          say "subject_id	$PID"
          say "subject_source	$([ -n "${GATE_PID:-}" ] && echo "step19 GATE_PID" || echo "FALLBACK literal")"

          # A NON-200 IS AN UNAVAILABLE READ, NOT A FINDING. The first
          # version of this step printed "THAT EXACT ID IS NOT PRESENT" off
          # the body of a 401, which is the very error the step exists to
          # correct. Every conclusion below is now gated on the status.
          ok200() { [ "$1" = "200" ]; }
          say "-- every position under the ACCEPTANCE policy, unfiltered by CHALLENGER --"
          PC=$(curl -s --max-time 60 -H "$H" \
            "$API/api/command/rn1x/positions?policy=ACCEPTANCE&limit=200" \
            -o /tmp/apos.json -w '%{http_code}')
          say "http\t$PC"
          if ! ok200 "$PC"; then
            say "UNAVAILABLE: the positions read returned $PC, so it says"
            say "NOTHING about whether an acceptance position exists."
            head -c 200 /tmp/apos.json | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          jq -r '"policy_filter\t" + ((.policy_filter // "-")|tostring),
                 "rows\t" + ((.positions // [] | length)|tostring),
                 ((.positions // [])[] | "  " + (.position_id // "?")
                   + "\n    policy        " + ((.policy // "-")|tostring)
                   + "\n    provenance    " + ((.provenance // "-")|tostring)
                   + "\n    entry_kind    " + ((.entry_kind // "-")|tostring)
                   + "\n    source_account " + ((.source_account // "-")|tostring)
                   + "\n    source_trade_id " + ((.source_trade_id // "-")|tostring)
                   + "\n    condition      " + ((.condition_id // "-")|tostring)
                   + "  outcome_index " + ((.outcome_index // "-")|tostring)
                   + "\n    seed_qty      " + ((.seed_qty // "-")|tostring)
                   + "  seed_price " + ((.seed_price // "-")|tostring)
                   + "  basis_usd " + ((.seed_basis_usd // "-")|tostring)
                   + "\n    residual_qty  " + ((.residual_qty // "OPEN_NO_OUTCOME_ROW")|tostring)
                   + "  settled_at " + ((.settled_at // "-")|tostring)
                   + "\n    decisions     " + ((.decisions // "-")|tostring)
                   + "  orders " + ((.orders // "-")|tostring)
                   + "  decision_ts " + ((.decision_ts // "-")|tostring))' \
            /tmp/apos.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 500 /tmp/apos.json

          say ""
          say "-- the PREVIOUSLY REPORTED position, read by id --"
          say "id\t$PID"
          TC=$(curl -s --max-time 60 -H "$H" \
            "$API/api/command/rn1x/trace/$PID" \
            -o /tmp/atr.json -w '%{http_code}')
          say "http\t$TC"
          if ! ok200 "$TC"; then
            say "UNAVAILABLE: the trace read returned $TC. That is NOT"
            say "evidence that the id is absent."
            head -c 200 /tmp/atr.json | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          jq -r '"found\t" + ((.found // false)|tostring),
                 "position\t" + ((.position // {} | tojson)[0:600]),
                 "decisions\t" + ((.decisions // [] | length)|tostring),
                 ((.decisions // [])[] | "  " + (.decision_id // "?")
                   + "  " + ((.decision_ts // "-")|tostring)[0:19]
                   + "  " + ((.selected_action // "-")|tostring)
                   + " x " + ((.selected_qty // "-")|tostring)
                   + "  hold " + ((.hold_value_usd // "-")|tostring)
                   + "  state " + ((.operating_state // "-")|tostring))' \
            /tmp/atr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 800 /tmp/atr.json
          if ! jq -e '.found == true' /tmp/atr.json >/dev/null 2>&1; then
            say "THAT EXACT ID IS NOT PRESENT ON A 200 RESPONSE. This is a"
            say "DIRECT read of the id"
            say "and is therefore evidence about it, unlike an empty"
            say "CHALLENGER-filtered list. Reconcile against the run that"
            say "reported it before concluding anything was lost."
          fi

          say ""
          say "-- the DATABASE-LEVEL uniqueness backstop --"
          OC=$(curl -s --max-time 60 -H "$H" \
            "$API/api/command/rn1x/overview" -o /tmp/aov.json -w '%{http_code}')
          say "http\t$OC"
          jq -r '(.schema_guards // {}) | "index\t" + ((.acceptance_unique_index // "-")|tostring),
                 "present\t" + ((.present // false)|tostring),
                 "read\t" + ((.read // false)|tostring),
                 "duplicate_groups\t" + ((.duplicate_groups // [] | length)|tostring),
                 "blocked_by_duplicates\t" + ((.blocked_by_existing_duplicates // false)|tostring),
                 "error\t" + ((.error // "-")|tostring)' \
            /tmp/aov.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 400 /tmp/aov.json
          if ! ok200 "$OC"; then
            say "UNAVAILABLE: the overview read returned $OC, so the index's"
            say "presence is UNKNOWN -- not absent."
          elif ! jq -e 'has("schema_guards")' /tmp/aov.json >/dev/null 2>&1; then
            say "THE DEPLOYED API DOES NOT REPORT schema_guards YET, so the"
            say "index's presence is UNKNOWN from here -- not absent. It is"
            say "reported once this release is live."
          elif jq -e '(.schema_guards.present // false) != true' /tmp/aov.json >/dev/null 2>&1; then
            say "THE INDEX IS NOT PRESENT. Migration 114 skips it when"
            say "duplicate groups already exist, so an absent index is either"
            say "a data problem named above or a migration that has not run."
            say "The advisory lock in the seeder still serialises the write."
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── ACQUIRE THE SCOPE EVIDENCE, THEN READ TWO EVIDENCED CYCLES ────
      #
      # THE OPERATING PATH, not another refusal. The settlement scope guard
      # needs the competition phase and the game format, and the quote-context
      # rule needs an ACTUAL event state; the league publishes all three per
      # game. The runner retrieves the schedule (its egress permits the host;
      # the API service's may not), POSTs it to the acquisition route, and the
      # route parses, binds it to the fixture and persists ONE row with its
      # source and retrieval time. Then the DEPLOYED loop is left to decide,
      # and its decisions are read back with their own stored evidence.
      #
      # It writes one fixture_metadata row. No order, no position, no capital.
      # THE STEP-19 EVIDENCE, SEPARATELY RETRIEVABLE. `if: always()` so a
      # failing assertion still publishes the reason it failed -- which is
      # the whole point of writing it to a file.
      - name: Step 19 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step19-evidence
          path: /tmp/s19.txt
          if-no-files-found: warn
          retention-days: 14

      - name: RN1X — acquire fixture scope evidence, then two evidenced cycles
        if: always()
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COND: ${{ inputs.acceptance_condition }}
          FDATE: ${{ inputs.fixture_date }}
        run: |
          set -uo pipefail
          # THE API ORIGIN, NOT THE PROXIED HOST. netlify.toml proxies ONLY
          # /api/command/*, so an /api/admin/* call sent to the COMMAND host
          # falls through to the SPA catch-all and returns the site's
          # page-not-found HTML as a 404. Every other step here uses
          # inputs.api for exactly that reason; these two did not, which is
          # why the acquisition POST 404'd while the /api/command reads in the
          # same step succeeded.
          API="${{ inputs.api }}"
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            say "SKIPPED: no ADMIN_TOKEN"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          H="X-Admin-Token: $ADMIN_TOKEN"
          # THE SELECTED SUBJECT, NOT A HARDCODED ID. `GATE_PID` is what step
          # 19 chose and exported; the literal is the Arizona fallback for a
          # run where no subject was chosen. THE DEFECT THIS FIXES: with the
          # id hardcoded, this step watched ARIZONA while the gate judged
          # HOUSTON, and I read "no new decision" off the wrong position.
          PID="${GATE_PID:-RN1X_SHADOW_CHALLENGER_HOLD_RANKED_V1:ACCEPTANCE_SHADOW_MANAGER_DEMO_V1:-105276210}"
          say "subject_id	$PID"
          say "subject_source	$([ -n "${GATE_PID:-}" ] && echo "step19 GATE_PID" || echo "FALLBACK literal")"
          # THE SUBJECT'S OWN CONDITION AND ITS OWN DATE, NOT ARIZONA'S.
          #
          # THE DEFECT THIS FIXES, measured in run 66. `CID` defaulted to the
          # ARIZONA condition and `D` to TODAY, while the subject was
          # HOUSTON. So this step handed the acquisition route Arizona's
          # teams on Houston's date, got
          # `NO_FIXTURE_MATCHED: no game on 2026-09-25 pairs away 'Arizona
          # Diamondbacks' with home 'Colorado Rockies'`, and printed
          # "ACQUISITION DID NOT PERSIST" -- which reads as a statement about
          # the SUBJECT'S scope and is nothing of the kind. Fixing the id in
          # step 19 was not enough while the condition stayed hardcoded here.
          #
          # Both now come from the subject itself: the condition from its own
          # input-chain row, the official date from the trailing date on the
          # venue slug the position is bound to. An override still wins, and a
          # value that could not be resolved is REFUSED rather than replaced
          # by today's date.
          curl -s --max-time 60 -H "$H" \
            "$API/api/command/rn1x/input-chain/$PID" -o /tmp/subj.json || true
          SUBJ_CID=$(jq -r '.position.condition_id // empty' /tmp/subj.json \
                       2>/dev/null || true)
          # THE SLUG IS NOT ON THE input-chain POSITION BLOCK. Measured in
          # run 67: that block carries position_id, policy, condition_id,
          # outcome_index, provenance, entry_kind, source_account, seed_qty,
          # seed_price and decision_ts -- and no venue identity at all. So
          # `subject_slug` read `-`, the date could not be derived, and the
          # step refused. The TRACE read does carry it (the settlement sweep
          # prints `slug aec-mlb-hou-ath-2026-09-25` off the same record), so
          # the slug is taken from there, matched on the venue's own shape
          # rather than on a field name that may move.
          curl -s --max-time 60 -H "$H" \
            "$API/api/command/rn1x/trace/$PID" -o /tmp/subjtr.json || true
          SUBJ_SLUG=$(grep -oE '"aec-[a-z0-9-]+-[0-9]{4}-[0-9]{2}-[0-9]{2}"' \
                        /tmp/subjtr.json 2>/dev/null \
                        | head -1 | tr -d '"' || true)
          if [ -z "${SUBJ_SLUG:-}" ]; then
            SUBJ_SLUG=$(jq -r '[.. | objects | .venue_market_slug? // empty]
                                | map(select(. != null)) | .[0] // empty' \
                          /tmp/subj.json 2>/dev/null || true)
          fi
          SUBJ_DATE=$(printf '%s' "${SUBJ_SLUG:-}" \
                        | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true)
          CID="${COND:-$SUBJ_CID}"
          D="${FDATE:-$SUBJ_DATE}"
          say "condition	${CID:--}   from	$([ -n "${COND:-}" ] && echo override || echo "the subject's input-chain")"
          say "subject_slug	${SUBJ_SLUG:--}   from	the subject's trace"
          say "fixture_date	${D:--}   from	$([ -n "${FDATE:-}" ] && echo override || echo "the slug's trailing date")"
          # AN UNRESOLVABLE FIXTURE SKIPS THE ACQUISITION AND NOTHING ELSE.
          #
          # MY OWN DEFECT, IN RUN 67: this refusal `exit 0`-ed the whole
          # step, so Houston's decisions were never read back either -- and
          # the decision readback does not depend on the acquisition at all.
          # A refusal about one input must not suppress an independent read.
          ACQUIRE=1
          if [ -z "${CID:-}" ] || [ -z "${D:-}" ]; then
            ACQUIRE=0
            say "ACQUISITION SKIPPED: the subject's own condition or official"
            say "date could not be resolved, and acquiring ANOTHER fixture's"
            say "scope would say nothing about this subject. The decision"
            say "readback below is independent and still runs."
          fi
          if [ "$ACQUIRE" = "1" ]; then

          # 1 · retrieve the league schedule HERE, where egress permits it
          U="https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=$D"
          AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SC=$(curl -sS -L --max-time 60 -o /tmp/sched.json -w '%{http_code}' "$U" || echo 000)
          say "schedule_http\t$SC  retrieved_at\t$AT  bytes\t$(wc -c < /tmp/sched.json 2>/dev/null || echo 0)"
          if [ "$SC" != "200" ]; then
            say "THE LEAGUE HOST IS UNREACHABLE FROM HERE TOO. That is the exact"
            say "access dependency: nothing downstream can establish the phase"
            say "or the format without it."
            say "The decision readback below does not depend on it and runs."
          else

          # 2 · hand it to the acquisition route, which parses and persists
          jq -n --arg c "$CID" --arg u "$U" --arg at "$AT" --arg d "$D" \
             --slurpfile p /tmp/sched.json \
             '{condition_id:$c, source_url:$u, retrieved_at:$at,
               official_date:$d, payload:$p[0]}' > /tmp/acq.json
          AC=$(curl -sS --max-time 90 -X POST -H "$H" \
                 -H 'Content-Type: application/json' \
                 --data @/tmp/acq.json \
                 "$API/api/admin/rn1x-fixture-metadata" \
                 -o /tmp/acqr.json -w '%{http_code}')
          say "acquire_http\t$AC"
          jq -r '"ok\t" + ((.ok // false)|tostring),
                 "refusal\t" + ((.refusal // "-")|tostring),
                 "why\t" + ((.why // "-")|tostring)[0:240],
                 "game_pk\t" + ((.game_pk // "-")|tostring),
                 "phase\t" + ((.phase // "-")|tostring)
                   + "  (" + ((.game_type_raw // "-")|tostring) + ")",
                 "game_format\t" + ((.game_format // "-")|tostring)
                   + "  innings " + ((.scheduled_innings // "-")|tostring),
                 "play_has_begun\t" + ((.play_has_begun // "-")|tostring)
                   + "  state " + ((.event_state_raw // "-")|tostring),
                 "start_evidence\t" + ((.start_evidence // "-")|tostring),
                 "binding\t" + ((.away // "-")|tostring) + " at "
                   + ((.home // "-")|tostring) + " on "
                   + ((.official_date // "-")|tostring),
                 "source\t" + ((.source // "-")|tostring),
                 "retrieved_at\t" + ((.retrieved_at // "-")|tostring),
                 "refusals\t" + ((.refusals // [])|tostring)' \
            /tmp/acqr.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 400 /tmp/acqr.json
          if ! jq -e '.ok == true' /tmp/acqr.json >/dev/null 2>&1; then
            say "ACQUISITION DID NOT PERSIST. The refusal above is the blocker;"
            say "the decisions below cannot carry scope evidence FROM THIS"
            say "acquisition -- the manager's own acquisition is reported per"
            say "decision on the fixt_acq / fixt_row lines."
          fi
          fi
          fi

          # 3 · let the DEPLOYED loop decide, then read its evidence back
          #     INDEPENDENT of everything above: the manager acquires its own
          #     subject's fixture, so these decisions are the authority on
          #     whether that worked, and they are read whether or not the
          #     manual acquisition in 1-2 ran at all.
          BEFORE=$(curl -s --max-time 60 -H "$H" \
            "$API/api/command/rn1x/trace/$PID" | jq '(.decisions // []) | length')
          say "decisions_before\t$BEFORE"
          TRIES=22; NAP=30
          for i in $(seq 1 $TRIES); do
            sleep $NAP
            curl -s --max-time 60 -H "$H" "$API/api/command/rn1x/trace/$PID" \
              -o /tmp/tr.json -w '' || true
            N=$(jq '(.decisions // []) | length' /tmp/tr.json 2>/dev/null || echo 0)
            say "poll $i/$TRIES  decisions=$N"
            [ "${N:-0}" -ge $((BEFORE + 2)) ] && break
          done

          say "-- the NEW decisions, with their own stored evidence --"
          # ONE FIELD PER LINE, from a jq program in a single-quoted string
          # written to a file -- the pattern the acceptance program here
          # already uses. The previous version interpolated one long string
          # inline, errored, and fell through to dumping raw JSON, which
          # printed the page header instead of the evidence. A REPORTING
          # fault must never be able to read as a finding, so a jq failure
          # below is announced as one.
          # THE CHAIN MAY ARRIVE AS A JSON STRING, not an object. It did:
          # jq exited 5 on `Cannot index string with "chain"` and the
          # evidence print stopped after five lines, mid-decision --
          # which reads like a finding about the decision rather than a
          # type mismatch in the reader. Parsed if it is a string,
          # treated as absent if it is neither.
          DEC='def ic: if (.input_chain|type) == "object" then .input_chain
            elif (.input_chain|type) == "string"
            then (try (.input_chain|fromjson) catch {}) else {} end;
          def l4b: (ic.chain // [])
            | (if type == "array" then . else [] end)
            | map(select((type == "object")
                  and (.link == "4b_SETTLEMENT_COMPATIBILITY"))) | (.[0] // {});
          def s(x): (x // "-") | tostring;
          def obj(x): if (x|type) == "object" then x
            elif (x|type) == "string" then (try (x|fromjson) catch {})
            else {} end;
          .decisions // [] | .[($B|tonumber):] | .[] |
            "  " + s(.decision_id),
            "      ts           " + s(.decision_ts),
            "      action       " + s(.selected_action) + " x " + s(.selected_qty),
            "      state        " + s(.operating_state),
            "      hold_usd     " + s(.hold_value_usd),
            "      reconciles   " + s(.accounting_reconciles),
            "      compat       " + s(l4b.compatibility),
            "      quote_ctx    " + s(l4b.quote_context),
            "      terms        " + s(l4b.terms_verdict),
            "      book_held    " + s(l4b.book_terms_held),
            "      fixt_acq     " + (((ic.fixture_acquisition // null)
                | if type == "object" then
                    ((.refusal // .error // .why
                      // (.persisted | tostring)) | tostring)
                  else "-" end) | .[0:160]),
            "      fixt_row     " + (((ic.fixture_metadata // null)
                | if type == "object" then
                    ("read=" + ((.read // false) | tostring)
                     + "  phase=" + ((.phase // "-") | tostring)
                     + "  fmt=" + ((.game_format // "-") | tostring)
                     + "  begun=" + (if .play_has_begun == null then "-"
                                     else (.play_has_begun | tostring) end)
                     + "  at=" + ((.retrieved_at // "-") | tostring))
                  else "-" end) | .[0:200]),
            "      unstated     " + ((l4b.unstated_conditions // []) | length | tostring),
            "      mismatched   " + ((l4b.mismatched_conditions // []) | tostring),
            "      first_fail   " + s(((ic.first_failing_link // {})
                                       | if type == "object" then .link
                                         else null end)),
            "      ranked       " + ((((obj(.alternatives).ranked // [])
                | if type == "array" then . else [] end)
                | map(s(.action) + "=" + s(.value_usd)) | join("  ")) | tostring),
            "      reason       " + (s(.selection_reason) | .[0:200])'
          printf '%s\n' "$DEC" > /tmp/dec.jq
          # `|| true`: a jq failure here is a REPORTING fault and it is
          # announced as one below. Letting it become the step's exit code
          # made the whole run fail and truncated the evidence after five
          # lines, which reads like a finding about the decisions.
          jq -r --arg B "${BEFORE:-0}" -f /tmp/dec.jq /tmp/tr.json \
            2>/tmp/jqerr | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ -s /tmp/jqerr ]; then
            say "THE EVIDENCE PRINT FAILED. That is a REPORTING fault, not a"
            say "finding about the decisions:"
            head -c 300 /tmp/jqerr | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # THE MANAGEMENT RECORD, LAST, SO IT IS AT THE TAIL.
      #
      # WHY THIS EXISTS AND IT IS NOT DECORATION. The step-19/20 verdict is
      # produced in the middle of a ~1400-line job log, and the only
      # programmatic way I can read a finished job is its TAIL. So the
      # verdict was retrievable by a human in the browser and not by me,
      # which is how I ended up reporting around it instead of from it. This
      # re-prints the SAME evidence file the artifact carries -- it computes
      # nothing and can reach no new conclusion.
      - name: The management record, in one block
        if: always()
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_URL: ${{ inputs.api }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### THE MANAGEMENT RECORD (step 19/20 evidence, verbatim)" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # ── EVERY ACCEPTANCE-POLICY POSITION, BY EXACT ID ────────────
          #
          # THE CONFUSION THIS ENDS, AND I CAUSED IT. The identity repair is
          # hardcoded to the ARIZONA position while the settlement sweep and
          # the step-19 gate act on whichever position the acceptance
          # harness most recently adopted. Two different ids under one
          # policy, reported as though they were one holding. Both are read
          # here, by id, through the same authenticated route -- so
          # "examined" and "excluded" are statements about named rows.
          A="${API_URL:-https://sportsassets-api.onrender.com}"
          if [ -n "${ADMIN_TOKEN:-}" ]; then
            for P in "${ARIZONA_PID:-}" "${GATE_PID:-}"; do
              [ -n "$P" ] || continue
              say ""
              say "-- position $P"
              C=$(curl -sS --max-time 60 -o /tmp/pid.json -w '%{http_code}' \
                    -H "X-Admin-Token: $ADMIN_TOKEN" \
                    "$A/api/command/rn1x/input-chain/$P" || echo 000)
              say "   input-chain HTTP $C"
              jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
                .position as $p
                | "   found " + n(.found)
                    + "  policy " + n($p.policy)
                    + "  provenance " + n($p.provenance),
                  "   condition " + n($p.condition_id)
                    + "  outcome_index " + n($p.outcome_index),
                  "   qty " + n($p.qty) + "  filled " + n($p.filled_qty)
                    + "  residual " + n($p.residual_qty)
                    + "  basis " + n($p.cost_basis_usd),
                  "   terminal " + n(.terminal)
                    + "  open_to_management " + n(.open_to_management)
                    + "  settled " + n($p.settled)
                    + "  net " + n($p.net_usd),
                  "   venue_identity " + n($p.venue_identity // $p.identity)' \
                /tmp/pid.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
              say "   raw head:"
              jq -c '{found, terminal, open_to_management, position}' \
                /tmp/pid.json 2>&1 | head -c 1200 \
                | tee -a "$GITHUB_STEP_SUMMARY" || true
              say ""
            done
          else
            say "NO ADMIN_TOKEN -- the per-id reconciliation is absent, not empty"
          fi
          if [ -s /tmp/s19.txt ]; then
            # THE WHOLE FILE IF IT FITS, TAIL IF NOT, and which one is said.
            B=$(wc -c < /tmp/s19.txt)
            say "-- /tmp/s19.txt, $B bytes --"
            [ "$B" -gt 6000 ] && say "(tail 6000 bytes; the artifact has all)"
            tail -c 6000 /tmp/s19.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            say "MISSING /tmp/s19.txt -- the management steps did not reach"
            say "the point of writing evidence. That is not a verdict."
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── THE BOOKMAKER'S PUBLISHED TERMS, RETRIEVED VERBATIM ────────────
  #
  # WHY IT IS A JOB AND NOT A STEP. Its log has to be readable on its own:
  # the verify job prints a long acceptance trace, and a capture buried
  # inside it competes for the same window -- which is exactly how run 39's
  # acceptance step became unreadable. A separate job has a separate log.
  #
  # WHY IT EXISTS AT ALL. The development container's egress policy denies
  # pinnacle.com, support.pinnacle.com and archive.org, so the terms could
  # not be captured there, and `admit_book_terms` refuses a term that does
  # not carry the publisher's own words, a URL and a retrieval time. A
  # search-engine summary is not a citation.
  #
  # IT IS READ-ONLY. No credential, no deployment, no database write.
  capture-terms:
    if: inputs.capture_terms == 'on'
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve and print the published terms
        env:
          EXTRA: ${{ inputs.terms_url }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          say "retrieved_at\t$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          say "reader\tgithub-actions runner, ubuntu-latest"
          say "note\tthe text below is the PUBLISHER'S OWN WORDS as served to this runner. Nothing here is summarised."

          URLS="https://www.pinnacle.com/en/future/betting-rules
          https://support.pinnacle.com/hc/en-us/articles/47846444668177-How-bets-are-graded-at-Pinnacle"
          # SEVERAL EXTRAS IN ONE RUN, comma separated.
          #
          # WHY THIS CHANGED. The binding blocker on the entry lane is the
          # VENUE side of the settlement comparison, not the bookmaker's:
          # VOID_ABANDONMENT_RULE_NOT_ESTABLISHED is carried by all 464
          # candidates evaluated in 24 hours, Pinnacle's baseball h2h terms
          # ARE captured, and `compare` returns COMPATIBLE only when every
          # applicable condition is stated by BOTH sides. Seven conditions
          # apply to a money line; the only venue prose we hold is the
          # listing's 380-character `description`, which states one.
          #
          # Finding out whether the venue publishes a per-condition document
          # means trying several candidate URLs, and one-at-a-time meant one
          # dispatch per guess. A 404 is a real answer to "does the venue
          # publish this" and is recorded as one, so asking for ten answers
          # at once is the same evidence, cheaper.
          if [ -n "${EXTRA:-}" ]; then
            for U in ${EXTRA//,/ }; do URLS="$URLS
          $U"; done
          fi

          i=0
          printf '%s\n' "$URLS" | while read -r U; do
            U=$(printf '%s' "$U" | tr -d '[:space:]')
            [ -z "$U" ] && continue
            i=$((i+1))
            say ""
            say "================================================================"
            say "SOURCE $i\t$U"
            CODE=$(curl -sS -L --max-time 90 \
                     -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125 Safari/537.36" \
                     -H "Accept: text/html,application/xhtml+xml" \
                     -H "Accept-Language: en-US,en;q=0.9" \
                     -o "/tmp/src$i.html" -w '%{http_code}' "$U" 2>/tmp/err$i || echo "000")
            say "http\t$CODE  bytes\t$(wc -c < "/tmp/src$i.html" 2>/dev/null || echo 0)"
            if [ "$CODE" != "200" ]; then
              say "RETRIEVAL FAILED -- nothing is captured from this source"
              head -c 300 "/tmp/err$i" 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            python3 - "/tmp/src$i.html" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import html
          import re
          import sys

          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()

          # A SITEMAP IS AN INDEX, NOT A DOCUMENT, so it is read as one.
          # Running the prose extractor over 618 <loc> elements printed
          # URL fragments with two lines of context each and told me
          # nothing about which page holds the grading rules. This branch
          # enumerates every location, counts them, and lists the ones
          # whose PATH could plausibly carry settlement terms -- which is
          # the next thing to fetch, and is all an index can establish. It
          # asserts nothing about what those pages say.
          if re.search(r"(?i)<(urlset|sitemapindex)\b", raw):
              locs = re.findall(r"(?is)<loc>\s*(.*?)\s*</loc>", raw)
              print("SITEMAP\tlocations %d" % len(locs))
              # TIGHT FIRST, BROAD ONLY AS A COUNT. My first filter included
              # `market`, `contract` and `sport`, which matched 309 of 618
              # paths -- the whole institutional API reference -- and the
              # printed window was all `institutional/*` ops pages. A list
              # that long is not a lead. So the SETTLEMENT vocabulary is
              # matched on its own and printed in full, and the broad words
              # are reported as a number.
              TIGHT = re.compile(
                  r"(?i)(settle|resolut|resolv|grade|grading|void|refund|"
                  r"cancel|abandon|suspend|postpon|innings?|baseball|mlb|"
                  r"\brules?\b|faqs?|terms|glossar)")
              BROAD = re.compile(r"(?i)(market|contract|sport)")
              hits = [u for u in locs if TIGHT.search(u)]
              broad = [u for u in locs if BROAD.search(u)
                       and not TIGHT.search(u)]
              print("SETTLEMENT_VOCAB_PATHS\t%d of %d" % (len(hits),
                                                          len(locs)))
              for u in hits[:120]:
                  print("  | " + u[:200])
              if len(hits) > 120:
                  print("  ... %d more" % (len(hits) - 120))
              print("BROAD_ONLY_PATHS\t%d (market/contract/sport, no "
                    "settlement word -- counted, not printed)" % len(broad))
              # WHERE THE 618 ACTUALLY LIVE, so an absent rules section is
              # visible as an absence rather than inferred from a filter.
              segs = {}
              for u in locs:
                  p = re.sub(r"^https?://[^/]+/?", "", u).split("/")
                  segs[p[0] or "(root)"] = segs.get(p[0] or "(root)", 0) + 1
              print("TOP_LEVEL_SECTIONS\t" + ", ".join(
                  "%s=%d" % kv for kv in sorted(segs.items(),
                                                key=lambda kv: -kv[1])))
              print("WHAT_THIS_ESTABLISHES\tthese pages EXIST. Not one word "
                    "of their content is read here, and no settlement "
                    "condition is answered by a URL.")
              raise SystemExit(0)

          # A SPA SHELL IS NOT THE RULES. If the served document carries no
          # prose, say that instead of printing an empty section and calling
          # it a capture.
          body = re.sub(r"(?is)<(script|style|noscript|svg)\b.*?</\1>", " ", raw)
          # Keep block boundaries so sentences do not run together.
          body = re.sub(r"(?i)</(p|div|li|h[1-6]|tr|br|section)\s*>", "\n", body)
          body = re.sub(r"(?i)<br\s*/?>", "\n", body)
          text = html.unescape(re.sub(r"(?s)<[^>]+>", " ", body))
          lines = [re.sub(r"[ \t\xa0]+", " ", ln).strip()
                   for ln in text.splitlines()]
          lines = [ln for ln in lines if len(ln) > 1]

          print("TEXT_LINES\t%d" % len(lines))
          words = sum(len(ln.split()) for ln in lines)
          print("TEXT_WORDS\t%d" % words)
          if words < 200:
              print("LIKELY_CLIENT_RENDERED -- the served document carries "
                    "almost no prose, so the rules are NOT in this response. "
                    "Nothing is captured from it.")
              for ln in lines[:40]:
                  print("  | " + ln[:200])
              raise SystemExit(0)

          # THE BASEBALL SECTION, AND ITS NEIGHBOURS. The hierarchy and the
          # general/void clauses matter as much as the sport section, so a
          # window around every hit is printed rather than one keyword line.
          # CONTENT WORDS AND PATH WORDS, because a sitemap is a list of
          # URLs and none of the content vocabulary appears in one.
          #
          # WHY THIS WAS WIDENED. docs.polymarket.us/sitemap.xml answers 200
          # with 618 enumerated URLs, and robots.txt states
          # `Content-Signal: ai-train=yes, search=yes, ai-input=yes` -- so
          # the documentation IS published and IS readable, and my earlier
          # "the venue does not publish this" was wrong. The old filter
          # matched 25 of those 618 lines, all order-entry pages, because it
          # only knew content vocabulary. Finding the settlement pages needs
          # the path words too.
          # SOCCER TERMS TOO, and their absence was a real gap.
          #
          # This extractor is how our OWN side of the settlement comparison
          # gets established affirmatively, and its vocabulary was
          # baseball-only. So the bookmaker's soccer grading section was
          # never captured, `BOOK_TERMS` has no soccer entry, and every
          # soccer comparison could only return UNKNOWN -- which is NOT the
          # same as incompatible, and must not be reported as though it
          # were. These words are what the publisher uses for the soccer
          # conditions that apply to a 3-way money line.
          KEYS = re.compile(
              r"(?i)\b(baseball|innings?|money\s*line|moneyline|graded|"
              r"grading|void|refund|no\s+action|suspend\w*|postpon\w*|"
              r"abandon\w*|cancel\w*|official\s+game|rule\s+hierarchy|"
              r"order\s+of\s+precedence|precedence|live\b|pre-?game|"
              r"playoff|extra\s+innings|listed\s+pitcher|resumed?|"
              r"settle\w*|resolv\w*|resolut\w*|rules?|faqs?|terms|"
              r"glossar\w*|sports?|mlb|contract\w*|"
              r"soccer|football|full[\s-]?time|90\s*minutes?|"
              r"regulation\s+time|stoppage|injury\s+time|extra\s+time|"
              r"penalt\w*|shoot[\s-]?out|draw|aggregate|replay\w*|"
              r"neutral\s+venue|behind\s+closed\s+doors|"
              r"venue\s+change|fixture)\b")
          hits = [n for n, ln in enumerate(lines) if KEYS.search(ln)]
          keep = set()
          for n in hits:
              keep.update(range(max(0, n - 2), min(len(lines), n + 3)))
          out, last = [], -10
          for n in sorted(keep):
              if n != last + 1:
                  out.append("  ...")
              out.append("  %5d | %s" % (n, lines[n]))
              last = n
          print("MATCHED_LINES\t%d of %d" % (len(keep), len(lines)))
          # Bounded so one verbose page cannot bury the other source.
          CAP = 700
          for ln in out[:CAP]:
              print(ln)
          if len(out) > CAP:
              print("  ... TRUNCATED at %d printed lines of %d matched. "
                    "Re-run with a narrower source to see the rest."
                    % (CAP, len(out)))
          PY
          done
          say ""
          say "END OF CAPTURE -- nothing was written, no service was touched"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── AUTHORITATIVE FIXTURE METADATA, SHAPE FIRST ─────────────────
      #
      # The scope guard needs the COMPETITION PHASE and the GAME FORMAT per
      # fixture. Neither is on `markets`, and both are published per game by
      # the league's own Stats API. This step retrieves one date and prints
      # the FIELD NAMES and one whole game object, so the parser is written
      # against the served payload rather than from recollection -- and so
      # the access dependency is demonstrated rather than asserted.
      #
      # Read-only, no credential, nothing written.
      - name: Authoritative fixture metadata — the served shape
        if: always()
        env:
          DATE: ${{ inputs.fixture_date }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          D="${DATE:-2026-09-24}"
          U="https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=$D"
          say "retrieved_at\t$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          say "source\t$U"
          CODE=$(curl -sS -L --max-time 60 -o /tmp/mlb.json -w '%{http_code}' "$U" || echo 000)
          say "http\t$CODE  bytes\t$(wc -c < /tmp/mlb.json 2>/dev/null || echo 0)"
          if [ "$CODE" != "200" ]; then
            say "RETRIEVAL FAILED -- the access dependency is this host"
            head -c 300 /tmp/mlb.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          say "totalGames\t$(jq -r '.totalGames // "-"' /tmp/mlb.json)"
          say "-- the field names on one game, as served --"
          jq -r '[.dates[0].games[0] | paths(scalars) | join(".")] | unique | .[]' \
            /tmp/mlb.json 2>/dev/null | head -60 | tee -a "$GITHUB_STEP_SUMMARY"
          say "-- the fields the scope guard needs, for every game that day --"
          jq -r '.dates[].games[] | "  gamePk=" + (.gamePk|tostring)
                 + "  gameType=" + ((.gameType // "-")|tostring)
                 + "  scheduledInnings=" + ((.scheduledInnings // "-")|tostring)
                 + "  doubleHeader=" + ((.doubleHeader // "-")|tostring)
                 + "  gameNumber=" + ((.gameNumber // "-")|tostring)
                 + "  officialDate=" + ((.officialDate // "-")|tostring)
                 + "  gameDate=" + ((.gameDate // "-")|tostring)
                 + "  status=" + ((.status.detailedState // "-")|tostring)
                 + "  away=" + ((.teams.away.team.name // "-")|tostring)
                 + "  home=" + ((.teams.home.team.name // "-")|tostring)' \
            /tmp/mlb.json 2>/dev/null | head -40 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  entry-run:
    # ITS OWN JOB, gated on its own input. Appended to
    # `capture-terms` it inherited that job's `if`, so a dispatch
    # asking for an entry run and not a terms capture would have
    # skipped it silently -- which reads exactly like a cycle that
    # found nothing.
    if: inputs.entry_run == 'DO'
    runs-on: ubuntu-latest
    steps:
      - name: Autonomous entry — arm the UNFUNDED research lane
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          A="${API:-https://sportsassets-api.onrender.com}"
          say "## the UNFUNDED research-shadow lane"
          say "It waives exactly MODEL_TRUST_DRIFT. Freshness, the settlement"
          say "condition-to-payout comparison, the declared support, every"
          say "exposure rail and positive net edge ALL still block, so this"
          say "cannot make an entry happen -- only stop being the reason one"
          say "did not. It has no path to capital."
          say ""
          C=$(curl -sS --max-time 45 -o /tmp/arm.json -w '%{http_code}' \
                -X POST -H "X-Admin-Token: $ADMIN_TOKEN" \
                -H 'Content-Type: application/json' \
                -d '{"confirm":"ARM"}' \
                "$A/api/admin/rn1x-arm-research-shadow" || echo 000)
          say "arm HTTP $C"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            "  action                 " + n(.action),
            "  wrote                  " + n(.wrote),
            "  control_key            " + n(.control_key),
            "  authorised             " + n(.authorised.authorised),
            "  why                    " + n(.authorised.why),
            "  calibration_rows       " + n(.calibration_rows)
              + "   still_unmeasured " + n(.calibration_still_unmeasured),
            "  waivable               " + n(.describe.waivable),
            "  never_waivable         " + n(.describe.never_waivable)' \
            /tmp/arm.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || {
              say "ARM REPORT DID NOT RENDER -- raw:"
              jq -r 'tojson | .[0:1200]' /tmp/arm.json 2>&1 \
                | tee -a "$GITHUB_STEP_SUMMARY" || true; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Autonomous entry — run the scheduled lane and print every input
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          # `pipefail`, AND IT MATTERS HERE. `jq ... | tee -a` takes tee's
          # exit status, so when jq stopped on a type error after the first
          # candidate the `||` branch never fired and the error was never
          # printed: ONE candidate's evidence appeared out of twenty-five
          # and the report looked complete.
          # THE ADMIN ROUTES LIVE ON THE API ORIGIN, not on the proxied
          # host: netlify.toml proxies only /api/command/*. Addressing the
          # proxy returned 404 on every admin POST in run 39, and the tell
          # was that the /api/command reads in the same step returned 200.
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "::error::ADMIN_TOKEN unset"; exit 1; }
          H="X-Admin-Token: $ADMIN_TOKEN"
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### AUTONOMOUS ENTRY LANE, AGAINST PRODUCTION MARKETS" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # 1 · WHICH BUILD IS ANSWERING. Every conclusion below is about
          # the deployed identity, so it is read first and printed.
          C=$(curl -s -o /tmp/hz.json -w '%{http_code}' --max-time 45 \
              "$API/api/health" || echo 000)
          say "health HTTP $C"
          # NO ROUTE PUBLISHES THE DEPLOYED COMMIT, so none is claimed here
          # -- /api/health returned 404 and the old line printed
          # "commit ?", which is honest but pointless. The deployed SHA is
          # read from render-ops; what is image-derived and printed below
          # is the lane's own limits sha and versions.

          # 2 · ARM the control row and let one cycle run.
          # 90s, NOT 45. Run 75's arm POST timed out at 45s on the first
          # request after a redeploy; `/tmp/ar.json` was then absent, the
          # `head` that reports the body exited 1 under `set -uo pipefail`,
          # and THE WHOLE STEP DIED -- taking the per-candidate stage
          # census, the settlement coverage and the holdings block with
          # it. A read that fails must report and continue: the cycle runs
          # on the loop's own schedule and does not need this POST.
          C=$(curl -s -o /tmp/ar.json -w '%{http_code}' --max-time 90 \
              -X POST -H "$H" "$API/api/admin/ext-pinnacle-shadow/on" \
              || echo 000)
          say "arm HTTP $C"
          jq -c . /tmp/ar.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 200 /tmp/ar.json 2>/dev/null || true
          # 2b · THE ARM IS CONFIRMED FROM THE CONTROL STATE, NOT FROM A
          #      STATUS CODE. Making the report above non-fatal is right,
          #      and on its own it introduces a worse failure: a timed-out
          #      or retried arm would be passed over in silence and the
          #      cycle read afterwards presented as the armed lane's
          #      output. `armed_requested` is what was asked for;
          #      `armed_confirmed` is what the table says afterwards; and
          #      `effectively_armed` is the conjunction the loop itself
          #      requires -- the control row AND the environment flag.
          #      UNCONFIRMED IS NOT ARMED AND IT IS NOT UNARMED EITHER.
          AC=$(curl -s -o /tmp/arm_state.json -w '%{http_code}' --max-time 60 \
                 -H "$H" "$API/api/admin/ext-pinnacle-shadow" || echo 000)
          say "arm-state HTTP $AC"
          ARMED=UNCONFIRMED
          if [ "$AC" = "200" ]; then
            ARMED=$(jq -r '
              if .effectively_armed == true then "ARMED_CONFIRMED"
              elif .armed_confirmed == null then "UNCONFIRMED"
              elif .armed_confirmed == false then "NOT_ARMED_CONTROL_ROW_FALSE"
              elif .env_flag_set == false then "NOT_ARMED_ENV_FLAG_UNSET"
              else "UNCONFIRMED" end' /tmp/arm_state.json 2>/dev/null \
              || echo UNCONFIRMED)
            jq -c '{control_row_present, control_row_raw, armed_confirmed,
                    env_flag_set, effectively_armed}' /tmp/arm_state.json \
              2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
          say "ARM VERDICT  $ARMED"
          echo "ARM_VERDICT=$ARMED" >> "$GITHUB_ENV"
          case "$ARMED" in
            ARMED_CONFIRMED) : ;;
            *) say "" ;
               say "  THE ARM IS NOT CONFIRMED ($ARMED). Everything below" ;
               say "  is still READ and still REPORTED -- the loop cycles" ;
               say "  on its own schedule -- but it must NOT be described" ;
               say "  as the armed lane's output, and an empty funnel here" ;
               say "  says nothing about the market." ;;
          esac
          sleep 180

          # 3 · EVERY INPUT BEHIND EVERY CANDIDATE. Written to a file and
          # run as a program: an interpolated one-liner failed once and
          # fell through to a raw dump of the page header.
          C=$(curl -s -o /tmp/ee.json -w '%{http_code}' --max-time 90 \
              -H "$H" "$API/api/command/rn1x/external/entry-evidence?hours=6&limit=25" \
              || echo 000)
          say "entry-evidence HTTP $C"
          if [ "$C" != "200" ]; then
            say "THE READ DID NOT RETURN 200 -- no conclusion follows"
            head -c 400 /tmp/ee.json 2>/dev/null \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          cat > /tmp/ee.jq <<'JQ'
          def n(x): if x == null then "-" else (x|tostring) end;
          "experiment\t" + n(.experiment_id),
          "policy\t" + n(.policy),
          "candidates\t" + n(.candidates|length),
          "inventory_rows\t" + n(.inventory|length),
          "calibration_measured\t" + n(.source_calibration.measured),
          "calibration_why\t" + n(.source_calibration.why // .source_calibration.metric),
          "limits_sha\t" + n(.risk_declaration.limitsSha),
          "",
          "== CANDIDATES ==",
          (.candidates[] |
            "-- " + n(.condition_id) + "  " + n(.us_market_slug),
            "   selection\t"    + n(.contract_selection) + "  pays_on " + n(.payout_event),
            "   probability\t"  + n(.probability) + "  age_s " + n(.age_s)
                                 + "  books " + n(.outcome_books),
            "   price\t"        + n(.executable_price) + "  cost/contract " + n(.cost_per_contract)
                                 + "  edge/contract " + n(.estimated_edge_per_contract),
            "   size\t"         + n(.proposed_size) + "  decision " + n(.decision)
                                 + "  admissible " + n(.admissible),
            "   p_fill\t"       + n(.execution_estimate.p_fill)
                                 + "  basis " + n(.execution_estimate.basis)
                                 + "  forecast " + n(.execution_estimate.is_forecast),
            "   walk\t"         + "levels " + n(.execution_estimate.levels_consumed)
                                 + "  vwap " + n(.execution_estimate.vwap)
                                 + "  best " + n(.execution_estimate.best_acquisition_price)
                                 + "  break_even " + n(.execution_estimate.break_even_limit),
            "   notional\t"     + "intended " + n(.execution_estimate.sizing.intendedNotionalUsd)
                                 + "  executed " + n(.execution_estimate.sizing.executedEntryNotionalUsd)
                                 + "  unfilled " + n(.execution_estimate.sizing.unfilledNotionalUsd)
                                 + "  " + n(.execution_estimate.sizing.status),
            "   settlement\t"   + n(.settlement_comparison.compatibility)
                                 + "  ctx " + n(.settlement_comparison.quote_context)
                                 + "  phase " + n(.settlement_comparison.scope_phase)
                                 + "  fmt " + n(.settlement_comparison.scope_game_format)
                                 + "  rules_read " + n(.settlement_comparison.venue_rules_read),
            "   fixture\t"      + n(.settlement_comparison.fixture_source)
                                 + "  gamePk " + n(.settlement_comparison.fixture_game_pk)
                                 + "  at " + n(.settlement_comparison.fixture_retrieved_at),
            "   risk\t"         + "permitted " + n(.risk_verdict.permitted)
                                 + "  rails_failed " + n(.risk_verdict.railsNotPassed)
                                 + "  gates_failed " + n(.risk_verdict.gatesNotPassed),
            "   waiver\t"       + "authorised " + n(.risk_verdict.research_waiver.authorised)
                                 + "  waived " + n(.risk_verdict.research_waiver.waived)
                                 + "  why_not " + n(.risk_verdict.research_waiver.refusals),
            "   exposure\t"     + n(.exposure_observed.observed),
            "   REFUSALS\t"     + ((.refusals // []) | join(", ")),
            ""),
          "== INVENTORY THIS LANE HOLDS ==",
          (if (.inventory|length) == 0 then "  none" else
            (.inventory[] |
              "  " + n(.position_id),
              "    qty " + n(.qty) + " @ " + n(.price)
                + "  basis " + n(.cost_basis_usd) + "  fees " + n(.fees_usd)
                + "  filled " + n(.filled_qty),
              "    decisions " + n(.decisions) + "  orders " + n(.orders)
                + "  outcomes " + n(.outcomes)
                + "  provenance " + n(.provenance)) end)
          JQ
          sed -i 's/^          //' /tmp/ee.jq
          jq -r -f /tmp/ee.jq /tmp/ee.json 2>/tmp/ee.err \
            | tee -a "$GITHUB_STEP_SUMMARY" \
            || { say "THE REPORT FAILED TO RENDER -- this is a reporting"
                 say "fault, not a finding. jq said:"
                 head -c 300 /tmp/ee.err | tee -a "$GITHUB_STEP_SUMMARY"; }

          # 4 · THE CALIBRATION MEASUREMENT, RUN. The join reads back what
          # happened; the evaluator scores the recorded point-in-time
          # probabilities. A shortfall is the expected first answer and is
          # NOT written -- the row is what the gate reads.
          # THE JOIN IS PACED, SO THE CLIENT MUST WAIT FOR IT. Each
          # unjoined valuation costs one paced venue read; at the default
          # limit of sixty that can exceed any 180 s budget, and it did --
          # curl gave up and the step printed `HTTP 000000` with no file to
          # read. A smaller batch per run and a client timeout that matches
          # what the work can take. Collection is incremental by design:
          # the next cycle joins the next batch.
          : > /tmp/cal.json
          C=$(curl -s -o /tmp/cal.json -w '%{http_code}' --max-time 600 \
              -X POST -H "$H" -H 'Content-Type: application/json' \
              --data '{"days": 90, "join_limit": 12}' \
              "$API/api/admin/external-source-calibration" || echo 000)
          say ""
          say "calibration HTTP $C"
          if [ "$C" = "200" ]; then
            cat > /tmp/cal.jq <<'JQ'
          def n(x): if x == null then "-" else (x|tostring) end;
          "verdict\t"          + n(.verdict),
          "gate_opens\t"       + n(.gate_opens),
          "-- the declaration, fixed before any data was read --",
          "  evaluator\t"      + n(.measurement.version)
                                + "  supersedes " + n(.measurement.supersedes),
          "  metric\t"         + n(.acceptance.metric)
                                + "  ceiling " + n(.acceptance.conditions.brier_at_or_below_ceiling)
                                + "  ceiling_is " + n(.acceptance.the_ceiling_is),
          "  reference\t"      + n(.acceptance.reference_only.constant_half_brier)
                                + " = " + n(.acceptance.reference_only.what_it_is),
          "  min_fixtures\t"   + n(.acceptance.conditions.min_independent_fixtures),
          "  calib_bound\t"    + n(.acceptance.conditions.calibration_error_at_or_below),
          "  baseline\t"       + n(.acceptance.baseline.fitted_on)
                                + "  uses_eval_outcomes "
                                + n(.acceptance.baseline.fitted_using_evaluation_outcomes),
          "  scope\t"          + n(.scope.source_version) + " / "
                                + n(.scope.source_method) + " / "
                                + n(.scope.market) + " / "
                                + n(.scope.families)
                                + "  unit " + n(.scope.independent_unit),
          "-- the outcome join --",
          "  examined\t"       + n(.outcome_join.examined)
                                + "  resolved " + n(.outcome_join.resolved)
                                + "  void " + n(.outcome_join.void)
                                + "  pending " + n(.outcome_join.pending)
                                + "  unreadable " + n(.outcome_join.unreadable)
                                + "  unmatched " + n(.outcome_join.unmatched),
          "  not_settled\t"    + "named_winner " + n(.outcome_join.named_winner)
                                + "  inferred " + n(.outcome_join.inferred)
                                + "  unparseable " + n(.outcome_join.unparseable)
                                + "  side_unknown " + n(.outcome_join.side_unknown),
          "  by_status\t"      + n(.outcome_join.by_status),
          "  by_class\t"       + n(.outcome_join.by_class),
          "-- the measurement --",
          "  rows_in_scope\t"  + n(.measurement.rows_in_scope)
                                + "  out_of_scope " + n(.measurement.rows_out_of_scope),
          "  fixtures\t"       + n(.measurement.unique_fixtures)
                                + "  payout_statements " + n(.measurement.payout_statements_in_scope)
                                + "  collapsed " + n(.measurement.observations_collapsed),
          "  counts\t"         + n(.measurement.outcome_counts),
          "  resolved_fix\t"   + n(.measurement.resolved_fixtures),
          "  split\t"          + "fit " + n(.measurement.baseline_split.fit_fixtures)
                                + "  eval " + n(.measurement.baseline_split.evaluation_fixtures)
                                + "  total_required "
                                + n(.measurement.baseline_split.total_resolved_fixtures_required),
          "  baseline_p\t"     + n(.measurement.baseline.probability)
                                + "  baseline_brier "
                                + n(.measurement.baseline_comparison.baseline_brier)
                                + "  improvement "
                                + n(.measurement.baseline_comparison.paired_mean_improvement)
                                + "  ci [" + n(.measurement.baseline_comparison.ci_low)
                                + ", " + n(.measurement.baseline_comparison.ci_high) + "]",
          "  scored\t"         + n(.measurement.scored_events),
          "  score\t"          + n(.measurement.score)
                                + "  se " + n(.measurement.uncertainty.brier_standard_error)
                                + "  provisional " + n(.measurement.score_is_provisional),
          "  calibration\t"    + "ece " + n(.measurement.calibration.expected_calibration_error)
                                + "  worst_bin " + n(.measurement.calibration.worst_bin_gap),
          "  decomposition\t"  + n(.measurement.predictive_score.decomposition),
          "  profitability\t"  + "measured_here "
                                + n(.measurement.trading_profitability.measured_here),
          "  checks_failed\t"  + n(.measurement.conditions_failed),
          "  shortfall\t"      + n(.measurement.shortfall_events)
                                + "  total_fixtures "
                                + n(.measurement.shortfall_resolved_fixtures_total),
          "  written\t"        + n(.measurement.written),
          "  inputs_sha\t"     + n(.measurement.inputs_sha),
          "  why\t"            + n(.measurement.why)
          JQ
            sed -i 's/^          //' /tmp/cal.jq
            jq -r -f /tmp/cal.jq /tmp/cal.json 2>/tmp/cal.err \
              | tee -a "$GITHUB_STEP_SUMMARY" \
              || { say "THE CALIBRATION REPORT FAILED TO RENDER -- a"
                   say "reporting fault, not a finding:"
                   head -c 300 /tmp/cal.err | tee -a "$GITHUB_STEP_SUMMARY"; }
          else
            say "THE CALIBRATION RUN DID NOT RETURN 200 -- no conclusion"
            head -c 300 /tmp/cal.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # 4b · SETTLEMENT FROM THE VENUE'S OWN RESOLUTION.
          # Every open shadow position -- the entry lane's AND the
          # acceptance position -- is asked of the venue. The answer is
          # either completed accounting or the EXACT pending/unreadable
          # state, never "probably not settled yet". An MLB feed reporting
          # "Final" is not part of this read, and no bookmaker quote is
          # needed: a finished contract's value is the settlement price.
          : > /tmp/st.json
          C=$(curl -s -o /tmp/st.json -w '%{http_code}' --max-time 300 \
              -X POST -H "$H" -H 'Content-Type: application/json' \
              --data '{"limit": 25}' \
              "$API/api/admin/rn1x-settle-open-positions" || echo 000)
          say ""
          say "## settlement from the venue (HTTP $C)"
          # THE RAW PAYLOAD, UNCONDITIONALLY, BEFORE ANY FORMATTING.
          # THIS IS THE THIRD TIME a jq type mismatch has hidden a 200
          # response from me -- `input_chain`, then `alternatives`, now
          # this: `Cannot index string with string "why"`. Each time the
          # sweep RAN and I could not say what it returned. A report that
          # can fail must never be the only copy of the evidence.
          # THE SETTLEMENT OBJECT AND EVERY RESULT, DUMPED COMPACT AND
          # UNFORMATTED. The 1800-byte head landed inside `consumer` and
          # never reached `settlement`, so the one thing I needed was the
          # one thing not printed -- my fourth pass over this reporting
          # path. These two lines index NOTHING, so no type can break
          # them, and they are the authoritative copy of the evidence.
          say "-- settlement, compact --"
          jq -c '.settlement | del(.results)' /tmp/st.json 2>&1 \
            | head -c 1200 | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "-- each result object, one per line --"
          jq -c '.settlement.results[]?' /tmp/st.json 2>&1 \
            | head -c 3000 | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "-- types, so a mismatch names itself --"
          jq -r '"root " + (type)
                 + "  settlement " + (.settlement|type)
                 + "  results " + ((.settlement.results // null)|type)
                 + "  results[0] " + (((.settlement.results // [])[0]
                                        // null)|type)' \
            /tmp/st.json 2>&1 | head -3 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$C" = "200" ]; then
            cat > /tmp/st.jq <<'JQ'
          def n(x): if x == null then "-" else (x|tostring) end;
          "needs_odds\t"       + n(.consumer.requires_fresh_bookmaker_odds),
          "submits\t"          + n(.consumer.submits_orders),
          "examined\t"         + n(.settlement.examined)
                                + "  settled " + n(.settlement.settled)
                                + "  void " + n(.settlement.void)
                                + "  already " + n(.settlement.already)
                                + "  unresolved " + n(.settlement.unresolved)
                                + "  errors " + n(.settlement.errors),
          "by_status\t"        + n(.settlement.by_status),
          "experiments\t"      + n(.settlement.experiments),
          "policies\t"         + n(.settlement.policies),
          "-- one line per open position --",
          # PARENTHESISED, AND THAT WAS THE WHOLE BUG. `|` binds LOOSER
          # than `,` in jq, so without these parentheses the entire comma
          # sequence above was piped into the formatter -- the literal
          # string "needs_odds\t..." had `.position_id` applied to it, and
          # jq reported the error against the last field it tried, `why`.
          # Reproduced locally against the real payload before this edit.
          ((.settlement.results // [])[]
            | "  " + n(.position_id)
              + "\n     slug " + n(.us_market_slug)
              + "  venue " + n(.venue_status) + "/" + n(.venue_class)
              + "  read " + n(.settlement_read)
              + "\n     side " + n(.side_map)
              + "  own_decision " + n(.identity_is_the_own_decision)
              + "\n     STATUS " + n(.status) + "  written " + n(.written)
              + "\n     net " + n(.accounting.net_usd)
              + "  cash " + n(.accounting.realized_cash_usd)
              + "  residual " + n(.accounting.residual_qty)
              + "\n     why " + n(.why))
          JQ
            sed -i 's/^          //' /tmp/st.jq
            jq -r -f /tmp/st.jq /tmp/st.json 2>/tmp/st.err \
              | tee -a "$GITHUB_STEP_SUMMARY" \
              || { say "THE SETTLEMENT REPORT FAILED TO RENDER -- a"
                   say "reporting fault, not a finding:"
                   head -c 300 /tmp/st.err | tee -a "$GITHUB_STEP_SUMMARY"; }
          else
            say "THE SETTLEMENT SWEEP DID NOT RETURN 200 -- no conclusion"
            head -c 400 /tmp/st.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # 5 · THE CENSUS BESIDE IT, so a cycle in which nothing was even
          # a candidate is distinguishable from one in which everything
          # refused.
          C=$(curl -s -o /tmp/cx.json -w '%{http_code}' --max-time 60 \
              -H "$H" "$API/api/command/rn1x/external/census?hours=6" || echo 000)
          say ""
          say "census HTTP $C"
          # THE REFUSAL TOTALS, THEN WHERE EACH CANDIDATE ACTUALLY STOPPED.
          #
          # WHY THE SECOND BLOCK EXISTS, AND IT CORRECTS A CLAIM OF MINE. I
          # reported that every candidate lacked profitable depth. Missing
          # walk/VWAP fields do not establish that: a candidate refused at
          # PROBABILITY, FRESHNESS, IDENTITY or SETTLEMENT SCOPE never reached
          # execution estimation at all, so it has no walk because it was never
          # priced -- not because the book was thin. `stages` attributes each
          # refused candidate to its EARLIEST failing stage and counts the
          # negative-edge cases with and without a walk separately.
          jq -r '"evaluated\t"  + ((.summary.evaluated  // 0)|tostring),
                 "admissible\t" + ((.summary.admissible // 0)|tostring),
                 "refused\t"    + ((.summary.refused    // 0)|tostring),
                 "-- refusals --",
                 (.refusals // {} | to_entries[] | "  \(.key)\t\(.value)")' \
            /tmp/cx.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" \
            || head -c 300 /tmp/cx.json
          say ""
          # THE WINDOW'S OWN TOTALS FIRST. `evaluated` above is ALL TIME and the
          # stage counts are windowed; printing them adjacent with no label made
          # 63 + 15 = 78 look like it had lost 308 rows against an all-time 386.
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
                 "all_time_evaluated  " + n(.summary.evaluated)
                   + "  (" + n(.summary_window) + ")",
                 "in_window           " + n(.summary_in_window.evaluated)
                   + " evaluated  " + n(.summary_in_window.admissible)
                   + " admissible  " + n(.summary_in_window.refused) + " refused",
                 "reconciles          " + n(.stages.reconciles_with_window)
                   + "  every refused candidate in the window lands in one stage"' \
            /tmp/cx.json 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- stage attribution, raw --"
          jq -c '.stages' /tmp/cx.json 2>&1 | head -c 1500 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
                 if (.stages.computed == false) then
                   "stages\tNOT COMPUTED: " + n(.stages.error)
                 else
                   "reached_execution_estimate\t"
                     + n(.stages.reached_execution_estimate)
                     + "  walk_took_levels " + n(.stages.walk_took_levels),
                   "negative_edge_WITH_a_walk\t"
                     + n(.stages.negative_edge_with_a_walk),
                   "negative_edge_WITHOUT_a_walk\t"
                     + n(.stages.negative_edge_without_a_walk),
                   "-- first failing stage, per candidate --",
                   ((.stages.by_first_stage // {}) | to_entries[]
                     | "  " + .key + "\t" + n(.value))
                 end' /tmp/cx.json 2>/dev/null \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ITS OWN STEP, AND THAT IS A GITHUB LIMIT NOT A PREFERENCE. A
      # single `run:` block is compiled as one expression and capped at
      # 21,000 characters; the entry-run body reached 25,979 and the
      # workflow stopped parsing entirely. Splitting is the fix. `/tmp`
      # persists across steps on one runner, so the artifact upload below
      # still collects /tmp/vp.json.
      - name: Autonomous entry — repair the legacy identity
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "::error::ADMIN_TOKEN unset"; exit 1; }
          H="X-Admin-Token: $ADMIN_TOKEN"
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 4a-bis · THE LEGACY POSITION'S IDENTITY, RE-ESTABLISHED FIRST.
          #
          # THE PRODUCTION REFUSAL THIS ADDRESSES, verbatim from the previous
          # run: THE_ONLY_AVAILABLE_IDENTITY_DESCRIBES_A_DIFFERENT_OUTCOME --
          # the acceptance position holds 'Arizona Diamondbacks', the two
          # recorded identities for its condition describe ['Colorado Rockies',
          # 'None'], and the consumer refused rather than borrow the other
          # side's slug. That refusal is CORRECT and it occurs BEFORE the venue
          # is asked anything, so venue settlement stayed untested for this
          # position.
          #
          # The repair re-derives the binding from `premap.resolve` -- asked for
          # the outcome the GLOBAL CATALOGUE lists at this position's own index
          # -- cross-checks it five ways, and writes only NULL identity columns.
          # It never reads `external_valuations`, never touches provenance and
          # never reseeds: the position stays synthetic, modelled and unfunded.
          # It runs HERE, immediately before the sweep, so the repair and the
          # readback are one run against one build.
          # WHICH POSITION, AND IT IS NO LONGER A LITERAL. THE DEFECT THIS
          # FIXES: this step was pinned to the ARIZONA id while the gate and
          # the settlement sweep act on whichever acceptance position was
          # most recently adopted -- Houston today. So the audited repair ran
          # against a position nobody was judging, and the one being judged
          # kept the binding that refused. The subject is now RESOLVED from
          # the newest row under the acceptance policy, and Arizona is
          # repaired too rather than instead.
          ARIZONA_PID="RN1X_SHADOW_CHALLENGER_HOLD_RANKED_V1:ACCEPTANCE_SHADOW_MANAGER_DEMO_V1:-105276210"
          : > /tmp/accpos.json
          CP=$(curl -s -o /tmp/accpos.json -w '%{http_code}' --max-time 60 \
              -H "$H" "$API/api/command/rn1x/positions?limit=50&policy=ACCEPTANCE_SHADOW_MANAGER_DEMO_V1" \
              || echo 000)
          SUBJ=$(jq -r '(.positions // [])[0].position_id // ""' \
                 /tmp/accpos.json 2>/dev/null || echo "")
          say ""
          say "## the acceptance positions, newest first (HTTP $CP)"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            (.positions // [])[] | "  " + n(.position_id)
              + "  policy " + n(.policy)
              + "  opened " + n(.opened_at // .created_at)
              + "  qty " + n(.qty) + "  filled " + n(.filled_qty)' \
            /tmp/accpos.json 2>&1 | head -20 \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          say "  selected_subject\t${SUBJ:-<none>}"
          say "  arizona\t$ARIZONA_PID"
          say ""
          say "## the audited repair, on the SELECTED SUBJECT then Arizona"
          # A FUNCTION, NOT A LOOP INSIDE A YAML BLOCK. Two calls, two file
          # pairs, so the recap can print both instead of whichever ran last.
          repair () {   # $1 = position id, $2 = file suffix
            local P="$1" SFX="$2"
            [ -n "$P" ] || { say "  (no id for suffix '$SFX')"; return 0; }
            say ""
            say "  position\t$P"
            : > "/tmp/rep0$SFX.json"
            local D W
            D=$(curl -s -o "/tmp/rep0$SFX.json" -w '%{http_code}' --max-time 120 \
                -X POST -H "$H" -H 'Content-Type: application/json' \
                --data "$(jq -nc --arg p "$P" '{position_id:$p,dry_run:true}')" \
                "$API/api/admin/rn1x-repair-position-identity" || echo 000)
            say "  -- dry run (HTTP $D), raw --"
            head -c 2000 "/tmp/rep0$SFX.json" | tee -a "$GITHUB_STEP_SUMMARY"
            say ""
            : > "/tmp/rep$SFX.json"
            W=$(curl -s -o "/tmp/rep$SFX.json" -w '%{http_code}' --max-time 120 \
                -X POST -H "$H" -H 'Content-Type: application/json' \
                --data "$(jq -nc --arg p "$P" '{position_id:$p}')" \
                "$API/api/admin/rn1x-repair-position-identity" || echo 000)
            say "  -- write (HTTP $W), raw --"
            head -c 2500 "/tmp/rep$SFX.json" | tee -a "$GITHUB_STEP_SUMMARY"
            say ""
            # THE HELD EXPOSURE AND THE VENUE BINDING, VERIFIED INDEPENDENTLY
            # of the repair's own answer: the trace's own view of what this
            # position holds, read through a different route.
            : > "/tmp/tr$SFX.json"
            local T
            T=$(curl -s -o "/tmp/tr$SFX.json" -w '%{http_code}' --max-time 90 \
                -H "$H" "$API/api/command/rn1x/trace/$P" || echo 000)
            say "  -- trace (HTTP $T): the last two decisions and the holding --"
            jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
              "    qty " + n(.position.qty) + "  filled " + n(.position.filled_qty)
                + "  residual " + n(.position.residual_qty)
                + "  basis " + n(.position.cost_basis_usd),
              "    outcome_index " + n(.position.outcome_index)
                + "  payout_event " + n(.position.payout_event)
                + "  slug " + n(.position.venue_market_slug),
              "    decisions " + n((.decisions // []) | length)
                + "  orders " + n((.orders // []) | length)
                + "  fills " + n((.fills // []) | length)
                + "  outcomes " + n((.outcomes // []) | length),
              (((.decisions // []) | sort_by(.decision_ts) | reverse
                 | .[0:2])[]
                | "    decision " + n(.decision_id // .id)
                  + "  at " + n(.decision_ts)
                  + "  action " + n(.action)
                  + "  version " + n(.engine_version // .version)
                  + "  policy " + n(.policy)
                  + "  settlement " + n(.settlement_qualified
                                        // .settlement_compatibility)
                  + "  complete " + n(.evidence_complete // .complete)),
              "    outcome rows " + n([(.outcomes // [])[]
                | {status: (.status // .settlement_read), net: .net_usd}])' \
              "/tmp/tr$SFX.json" 2>&1 | head -30 \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          }
          repair "${SUBJ:-}" ""
          [ "${SUBJ:-}" = "$ARIZONA_PID" ] || repair "$ARIZONA_PID" "_az"
          
          if [ -s /tmp/rep.json ] || [ -s /tmp/rep_az.json ]; then
            cat > /tmp/rep.jq <<'JQ'
          def n(x): if x == null then "-" else (x|tostring) end;
          "ok\t"            + n(.repair.ok)
                              + "  written " + n(.repair.written)
                              + "  refusal " + n(.repair.refusal),
          "why\t"           + n(.repair.why),
          "held_outcome\t"  + n(.repair.held_outcome)
                              + "  token " + n(.repair.held_token_id)
                              + "  index " + n(.repair.outcome_index),
          "catalogue\t"     + n(.repair.catalogue),
          "resolver\t"      + n(.repair.resolver),
          "identity\t"      + n(.repair.identity),
          "provenance\t"    + n(.repair.provenance)
                              + "  reseeds " + n(.repair.reseeds)
                              + "  reads_valuations "
                              + n(.repair.reads_external_valuations),
          "-- the cross-checks, each with its own verdict --",
          ((.repair.cross_checks // {}) | to_entries[]
            | "  " + .key + "\t" + n(.value.passed) + "\t" + n(.value.why))
          JQ
            sed -i 's/^  //' /tmp/rep.jq
            for F in /tmp/rep.json /tmp/rep_az.json; do
              [ -s "$F" ] || continue
              say "-- formatted: $F --"
              jq -r -f /tmp/rep.jq "$F" 2>/tmp/rep.err \
                | tee -a "$GITHUB_STEP_SUMMARY" || true
            done
            # A jq FAULT IS ANNOUNCED AS ONE. The loop above swallows a
            # failure per file so one bad payload cannot hide the other, so
            # the error file is checked here instead.
            if [ -s /tmp/rep.err ]; then
              say "A REPAIR REPORT FAILED TO RENDER -- a reporting fault,"
              say "not a finding. The raw payloads are above. jq said:"
              head -c 300 /tmp/rep.err | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            say "NEITHER REPAIR CALL LEFT A RESPONSE -- no identity was"
            say "written and the sweep below will refuse as it did before."
          fi
          
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Autonomous entry — what the venue actually returned
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "::error::ADMIN_TOKEN unset"; exit 1; }
          H="X-Admin-Token: $ADMIN_TOKEN"
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 4a-ter · WHAT THE VENUE ACTUALLY RETURNED, BEFORE WE INTERPRET IT.
          #
          # `CLOSED_BUT_NO_REPORTED_OR_CONVERGED_OUTCOME` and
          # `NO_SETTLEMENT_PRICE_IN_RESPONSE` are OUR PARSER'S verdicts. I
          # reported them as the venue's refusal, which is a different claim.
          # This captures the raw redacted payload from both surfaces -- the
          # settlement endpoint and the market listing -- with the FIELD TYPES,
          # for Arizona and for a calibration fixture the outcome join itself
          # recorded as unreadable. Read-only; nothing is written.
          #
          # The types are the half that decides it: `_converged_winner` requires
          # `outcomePrices` to be a list, so a venue delivering it as a
          # JSON-encoded STRING would produce exactly this symptom while the
          # prices sat there unread. The probe names that case as OUR gap, and an
          # absent field as the payload's. It infers no payout from `closed`,
          # `resolved` or `settledAt`.
          : > /tmp/vp.json
          # THE SLUGS THE LANE ACTUALLY EVALUATED, PER SPORT -- not two
          # hardcoded baseball literals.
          #
          # WHY THIS CHANGED. The prose read is the only affirmative
          # establishment of the VENUE's side, and it was pinned to two MLB
          # slugs. So the other supported sport's payout rules were never
          # read at all, and "no compatible pair" rested on a comparison
          # that had only ever been run on baseball. Up to two distinct
          # slugs per sport_family are taken from the candidates the lane
          # just evaluated; the baseball literals remain only as the
          # fallback for a window with no candidates.
          jq -r '[(.candidates // [])[]
                  | {f: (.sport_family // "UNLABELLED"),
                     s: .us_market_slug}
                  | select(.s != null)]
                 | group_by(.f) | map(.[0:2]) | flatten
                 | map(.s) | unique | .[0:6] | @json' \
            /tmp/ee.json > /tmp/slugs.json 2>/dev/null || true
          if ! jq -e 'length > 0' /tmp/slugs.json >/dev/null 2>&1; then
            printf '%s\n' '["aec-mlb-az-col-2026-09-24","aec-mlb-cle-kc-2026-09-25"]' \
              > /tmp/slugs.json
            say "NO CANDIDATE SLUGS IN THE WINDOW -- falling back to the two"
            say "baseball literals. The prose below is then evidence about"
            say "those two contracts only."
          fi
          say "prose slugs  $(cat /tmp/slugs.json)"
          jq -n --slurpfile s /tmp/slugs.json \
             '{slugs: $s[0], calibration_unreadable: 1}' > /tmp/vpreq.json
          VC=$(curl -s -o /tmp/vp.json -w '%{http_code}' --max-time 180 \
              -X POST -H "$H" -H 'Content-Type: application/json' \
              --data @/tmp/vpreq.json \
              "$API/api/admin/venue-settlement-probe" || echo 000)
          say ""
          say "## what the venue returned (HTTP $VC)"
          # THE RAW PAYLOAD FIRST, UNCONDITIONALLY. This is the artifact the
          # investigation turns on; no formatter gets to lose it.
          # `head -c` KILLED THIS STEP AND I WROTE IT. Under `set -uo pipefail`,
          # `head` closing the pipe early sends jq SIGPIPE, pipefail takes jq's
          # non-zero status, and `-e` ends the step -- exit code 2, right after
          # the raw dump, losing every formatted line that followed. The raw
          # evidence survived only because it printed first, which is the one
          # thing that went right. Truncation now happens INSIDE jq, so nothing
          # closes a pipe on it.
          say "-- raw, per slug --"
          jq -r '.probes[]? | tojson | .[0:6000]' /tmp/vp.json 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- which fixtures were picked --"
          jq -r '.calibration_picks | tojson | .[0:600]' /tmp/vp.json 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          if [ "$VC" = "200" ]; then
            jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
              (.probes // [])[]
                | "slug            " + n(.slug),
                  "  retrieved_at  " + n(.retrieved_at),
                  "  terminal      " + n(.terminal_reading)
                    + "  authoritative_payout " + n(.authoritative_payout_present),
                  "  why           " + n(.why),
                  "  settlement    " + n(.settlement.endpoint)
                    + "  err " + n(.settlement.error)
                    + "  keys " + n(.settlement.top_level_keys),
                  "  listing       matched " + n(.listing.matched)
                    + "  err " + n(.listing.error),
                  "  outcomePrices " + n(.listing.payout_candidates.outcomePrices.shape),
                  "  outcomes      " + n(.listing.payout_candidates.outcomes.shape),
                  "  marketSides   " + n(.listing.payout_candidates.marketSides.shape),
                  "  status        " + n(.listing.payout_candidates.status.value)
                    + "  closed " + n(.listing.payout_candidates.closed.value),
                  "  void          " + n(.listing.void_evidence.declared)
                    + "  field " + n(.listing.void_evidence.field),
                  "  reader        " + n(.reader_verdict.status)
                    + "  " + n(.reader_verdict.error),
                  "  PARSER_GAP    " + n(.parser_gap.found)
                    + "  " + n(.parser_gap.why),
                  "  values        " + n(.listing.raw_subset),
                  "  PROSE FIELD   " + n(.settlement_terms.field)
                    + "  chars " + n(.settlement_terms.chars)
                    + "  truncated " + n(.settlement_terms.truncated)
                    + "  fields " + n(.settlement_terms.fields_present),
                  "  prose VERBATIM " + n(.settlement_terms.text),
                  "  STATED        " + n(.settlement_terms.stated),
                  "  NOT STATED    " + n(.settlement_terms.not_stated),
                  "  contradicted  " + n(.settlement_terms.contradicted)
                    + "  sentences " + n(.settlement_terms.sentences),
                  "  unused        " + n(.settlement_terms.unused_evidence)' \
              /tmp/vp.json 2>/tmp/vp.err | tee -a "$GITHUB_STEP_SUMMARY" \
              || { say "THE PROBE REPORT FAILED TO RENDER -- the raw payload is"
                   say "above and is the authoritative copy:"
                   head -c 300 /tmp/vp.err | tee -a "$GITHUB_STEP_SUMMARY"; }
          else
            say "THE VENUE PROBE DID NOT RETURN 200 -- no conclusion about"
            say "whether the gap is ours or the payload's."
          fi
          
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # THE RAW PAYLOADS, SEPARATELY RETRIEVABLE. Every formatted report
      # above can fail on a jq type it did not expect -- that has now
      # happened four times, and each time the run's evidence existed only
      # inside the formatter that dropped it. These files are the
      # unformatted answers the API gave, uploaded whatever the step's
      # outcome, so a reporting fault can never again cost a run's result.
      - name: Autonomous entry — the P&L, per lane and per provenance
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          A="${API:-https://sportsassets-api.onrender.com}"
          # THE SHADOW P&L, THROUGH THE SAME AUTHENTICATED READ THE COMMAND
          # CENTRE USES. Not a second query: if this and the page disagree
          # one of them is wrong and nobody could tell which.
          C=$(curl -sS --max-time 60 -o /tmp/pnl.json -w '%{http_code}' \
                -H "X-Admin-Token: $ADMIN_TOKEN" \
                "$A/api/command/rn1x/statuses" || echo 000)
          say "## reconciled shadow P&L (HTTP $C)"
          # `.statuses.shadow_pnl`, AND THE MISSING PREFIX WAS THE WHOLE
          # BUG. The route returns {scope, label, statuses:{...}} and
          # `shadow_pnl` is a key of `statuses`, not of the response. The
          # first version of this step indexed `.shadow_pnl` and so printed
          # `mark_basis -` with no lane lines at all -- a null path, not an
          # empty P&L. The raw dump is now the P&L OBJECT rather than a
          # 7000-character prefix of the whole payload, which is what
          # stopped the earlier run's evidence from reaching the log.
          jq -r '.statuses.shadow_pnl | tojson | .[0:6000]' /tmp/pnl.json \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- per lane --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            .statuses.shadow_pnl as $P
            | $P.unrealised_basis as $b
            | "mark_basis " + n($b),
              ($P.lanes // {} | to_entries[]
                | "lane " + .key
                  + "  settled " + n(.value.settled_positions)
                  + "  open " + n(.value.open_positions)
                  + "  realised " + n(.value.net_usd)
                  + "  fees " + n(.value.fees_usd)
                  + "  basis " + n(.value.open_inventory_at_cost_usd)
                  + "  unrealised " + n(.value.unrealised.unrealised_usd)
                  + "  total " + n(.value.total_pnl_usd)
                  + " (" + n(.value.total_pnl_status) + ")",
                "    marked " + n(.value.unrealised.marked_positions)
                  + "  unmarked " + n(.value.unrealised.unmarked_positions)
                  + "  blockers " + n(.value.unrealised.unmarked_by_blocker),
                "    provenance " + n(.value.unrealised.by_provenance))' \
            /tmp/pnl.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # THE OPERATING RESULT, IN ONE BLOCK AT THE END.
      #
      # Every number here was already printed by an earlier step; this
      # re-reads the SAME files and states them together. It exists because
      # the answer to "what did the run do" was spread over four steps and
      # ~1200 log lines, and a reader (including me, through the API) could
      # retrieve only the tail. Nothing is computed here that is not in
      # /tmp; if a file is missing, the line says so rather than printing a
      # zero that would read as a measurement.
      - name: Autonomous entry — the operating result, in one block
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### THE OPERATING RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in arm ee cx pnl rep0 rep st vp; do
            [ -s "/tmp/$f.json" ] || say "MISSING /tmp/$f.json -- the lines it feeds are absent, not zero"
          done
          say "-- 0a · the legacy identity, BEFORE (dry run, wrote nothing) --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            .repair as $r
            | "  held_outcome " + n($r.held_outcome)
              + "  index " + n($r.outcome_index)
              + "  token " + n($r.held_token_id),
              "  identity_as_read " + n($r.identity_before // $r.identity),
              "  catalogue " + n($r.catalogue),
              "  resolver  " + n($r.resolver),
              "  ok " + n($r.ok) + "  written " + n($r.written)
                + "  refusal " + n($r.refusal),
              "  why " + n($r.why)' \
            /tmp/rep0.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- 0b · the legacy identity, AFTER (the write) --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            .repair as $r
            | "  ok " + n($r.ok) + "  written " + n($r.written)
              + "  refusal " + n($r.refusal),
              "  identity " + n($r.identity),
              "  derivation catalogue=" + n($r.catalogue)
                + "  resolver=" + n($r.resolver),
              "  provenance " + n($r.provenance)
                + "  reseeds " + n($r.reseeds)
                + "  reads_valuations " + n($r.reads_valuations),
              "  why " + n($r.why)' \
            /tmp/rep.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- 0c · settlement from the venue, per open position --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            "  examined " + n(.settlement.examined)
              + "  settled " + n(.settlement.settled)
              + "  void " + n(.settlement.void)
              + "  already " + n(.settlement.already)
              + "  unresolved " + n(.settlement.unresolved)
              + "  errors " + n(.settlement.errors),
            "  by_status " + n(.settlement.by_status),
            ((.settlement.results // [])[]
              | "  " + n(.position_id),
                "     slug " + n(.us_market_slug)
                  + "  venue " + n(.venue_status) + "/" + n(.venue_class)
                  + "  read " + n(.settlement_read),
                "     STATUS " + n(.status) + "  written " + n(.written)
                  + "  net " + n(.accounting.net_usd)
                  + "  cash " + n(.accounting.realized_cash_usd)
                  + "  residual " + n(.accounting.residual_qty),
                "     why " + n(.why))' \
            /tmp/st.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- 0d · the venue's own settlement prose, as read live --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            (.probes // [])[]
            | "  " + n(.slug) + "  field " + n(.settlement_terms.field)
                + "  chars " + n(.settlement_terms.chars)
                + "  truncated " + n(.settlement_terms.truncated),
              "     STATED     " + n(.settlement_terms.stated),
              "     NOT STATED " + n(.settlement_terms.not_stated),
              "     conflicts  " + n(.settlement_terms.contradicted)
                + "  sentences " + n(.settlement_terms.sentences),
              "     unused     " + n(.settlement_terms.unused_evidence),
              "     prose      " + n(.settlement_terms.text)' \
            /tmp/vp.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- 1 · the research lane's arming --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            "  authorised        " + n(.authorised.authorised)
              + "   key " + n(.control_key),
            "  calibration_rows  " + n(.calibration_rows)
              + "   still_unmeasured " + n(.calibration_still_unmeasured),
            "  waivable          " + n(.describe.waivable)
              + "   never " + n(.describe.never_waivable)' \
            /tmp/arm.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- 2 · candidates, and who used the waiver --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            (.candidates // []) as $c
            | "  candidates_read    " + n($c|length),
              "  admissible         "
                + n([$c[] | select(.admissible)] | length),
              "  waiver_AUTHORISED  "
                + n([$c[] | select(.risk_verdict.research_waiver.authorised
                                   == true)] | length),
              "  waiver_APPLIED     "
                + n([$c[] | select((.risk_verdict.research_waiver.waived
                                    // []) | length > 0)] | length)
                + "   (a waived gate, not merely an armed lane)",
              "  waiver_gates       "
                + n([$c[] | (.risk_verdict.research_waiver.waived // [])[]]
                    | unique),
              "  waiver_refusals    "
                + n([$c[] | (.risk_verdict.research_waiver.refusals // [])[]]
                    | unique),
              # WHY A ZERO ABOVE IS NOT SELF-EXPLANATORY, and the last run
              # left me guessing. A candidate that never reached the gate has
              # NO risk section at all, and a row written before this build
              # has a risk section with no waiver key. Those are different
              # facts from "the lane was not armed", so they are counted.
              "  risk_section_present " + n([$c[]
                  | select(.risk_verdict != null)] | length)
                + "   with_a_waiver_key " + n([$c[]
                  | select(.risk_verdict.research_waiver != null)] | length),
              "  newest_candidate " + n([$c[] | .decided_at // .observed_at]
                  | max)' \
            /tmp/ee.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- 3 · where each refused candidate stopped (windowed) --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            "  in_window " + n(.summary_in_window.evaluated) + " evaluated  "
              + n(.summary_in_window.admissible) + " admissible  "
              + n(.summary_in_window.refused) + " refused"
              + "   reconciles " + n(.stages.reconciles_with_window),
            ((.stages.by_first_stage // {}) | to_entries[]
              | "  " + .key + "  " + n(.value)),
            # THE DISTINCTION THAT MUST NOT BE LOST: a candidate refused
            # before stage 5 was never priced, so its empty walk is the
            # ABSENCE of a measurement. Only `negative_edge_with_a_walk`
            # supports any statement about depth; `without_a_walk` is a
            # negative edge at the observed best ask and says nothing
            # about the rest of the book.
            "  reached_execution_estimate "
              + n(.stages.reached_execution_estimate)
              + "   walk_took_levels " + n(.stages.walk_took_levels),
            "  negative_edge_WITH_a_walk    "
              + n(.stages.negative_edge_with_a_walk)
              + "   (measured against walked depth)",
            "  negative_edge_WITHOUT_a_walk "
              + n(.stages.negative_edge_without_a_walk)
              + "   (top of book only)",
            "  never_priced_at_all          "
              + n([(.stages.by_first_stage // {}) | to_entries[]
                    | select(.key | test("^[1-4]_")) | .value] | add // 0)
              + "   (refused before 5_EXECUTION_ESTIMATE)",
            # THE OPPORTUNITY ANSWER, AS ITS OWN NUMBER. "None was
            # positive" used to be an inference from two negative counts
            # and a total. An assessment answers "how many candidates
            # showed positive net edge" directly, including when it is 0.
            "  POSITIVE_EDGE                "
              + n(.stages.positive_edge)
              + "   edge_not_computed " + n(.stages.edge_not_computed),
            "  execution_mode  " + n(.stages.execution_mode)
              + "   excludes " + n(.stages.excludes)' \
            /tmp/cx.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          # ── 3a2 · THE FUNNEL, PER SUPPORTED SPORT ──────────────────
          #
          # WHY PER SPORT. Every count above is summed over both supported
          # sports, so a sport that contributes nothing at all is
          # indistinguishable from one that contributes candidates which
          # then refuse. Those are different findings: the first is a
          # coverage or mapping fact, the second is an economics fact.
          # `venue_markets_open_and_fresh` is the OBSERVED UNIVERSE for
          # that sport; `mapped_to_a_venue_contract` is the subset a
          # connected probability source can price at all.
          say "-- 3a2 · observed universe and funnel, per supported sport --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            .statuses.external_valuation.last_cycle as $L
            | if $L == null then
                "  NO CYCLE HEARTBEAT -- the funnel is absent, not empty"
              else
                "  cycle_at " + n($L.at) + "  state " + n($L.state)
                  + "  markets_considered " + n($L.markets_considered),
                "  venue universe by label " + n($L.venue_universe_by_label),
                (($L.funnel_by_provider_sport // {}) | to_entries[]
                  | "  " + .key + "  (" + n(.value.family) + ")"
                    + "  venue_open_fresh " + n(.value.venue_markets_open_and_fresh)
                    + "  provider_events " + n(.value.provider_events)
                    + "  with_pinnacle " + n(.value.with_pinnacle_h2h)
                    + "  mapped " + n(.value.mapped_to_a_venue_contract)
                    + "  evaluated " + n(.value.evaluated)
                    + "  written " + n(.value.written)),
                (($L.funnel_by_provider_sport // {}) | to_entries[]
                  | "     " + .key + " refusals " + n(.value.refusals)),
                "  CYCLE LABEL " + n($L.cycle_label),
                "  " + n($L.cycle_label_note),
                "",
                "  -- every MAPPED candidate against its FIRST refusal --",
                (($L.mapped_candidate_ledger // [])[]
                  | "   " + n(.stage) + "  " + n(.first_refusal // "ADMITTED")
                    + "  us " + n(.us_market_slug)
                    + "  ours " + n(.global_slug)
                    + "  priced " + n(.priced_outcome)
                    + (if .edge == null then ""
                       else "  edge " + (.edge|tostring) end)),
                (($L.mapped_candidate_ledger // [])[]
                  | select(.raw_transact_time != null or .age_s != null)
                  | "      CLOCK raw " + n(.raw_transact_time)
                    + "  parsed " + n(.parsed_epoch_s)
                    + "  decision " + n(.decision_instant_epoch_s)
                    + "  age " + n(.age_s) + "s  limit " + n(.limit_s) + "s"
                    + "  basis " + n(.age_basis)),
                (($L.mapped_candidate_ledger // [])[]
                  | select(.age_semantics != null)
                  | "      CLOCK SEMANTICS " + n(.age_semantics)),
                (($L.mapped_candidate_ledger // [])[]
                  | select(.period_evidence != null)
                  | "      PERIOD " + n(.period_evidence.basis)
                    + "  participants "
                    + n(.period_evidence.participants_named)
                    + "  title " + n(.period_evidence.event_title)),
                "",
                (($L.venue_errors // [])[]
                  | "  venue_error " + n(.us_market_slug // .global_slug)
                    + "  " + n(.refusal)),
                (($L.venue_errors // [])[]
                  | select(.venue_clock != null)
                  | "     RAW CLOCK path " + n(.venue_clock.field_path)
                    + "  type " + n(.venue_clock.raw_type)
                    + "  raw " + n(.venue_clock.raw)),
                (($L.venue_errors // [])[]
                  | select(.venue_clock != null)
                  | "     BOOK AGE " + n(.age_s) + "s  limit "
                    + n(.limit_s) + "s  basis " + n(.age_basis)
                    + "  parsed_epoch " + n(.venue_clock.parsed_epoch_s)),
                "  venue_errors " + n($L.venue_errors)
              end' /tmp/pnl.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          # THE COVERAGE QUESTION, COUNTED OVER THE WHOLE WINDOW. Does ANY
          # supported market have a payoff this source can price? A 25-row
          # sample cannot answer "none", so the census counts every row.
          say "-- 3b · settlement coverage, over the window --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            .settlement_coverage as $S
            | if ($S.computed == false) then
                "  NOT COMPUTED: " + n($S.error)
              else
                "  COMPATIBLE rows " + n($S.compatible_rows),
                (($S.by_verdict // {}) | to_entries[]
                  | "  " + .key + "  rows " + n(.value.rows)
                    + "  admissible " + n(.value.admissible)
                    + "  distinct_slugs " + n(.value.distinct_slugs)),
                # PER SPORT, because "0 COMPATIBLE" summed over two sports
                # does not say whether the OTHER sport was examined and
                # refused or never reached the comparison at all. An
                # UNKNOWN here is a MISSING STATEMENT on one side -- it is
                # never read as agreement, and a market is never selected
                # because a payout pattern failed to match.
                (($S.by_verdict // {}) | to_entries[]
                  | . as $v | ($v.value.by_sport // {}) | to_entries[]
                  | "     " + $v.key + " / " + .key
                    + "  rows " + n(.value.rows)
                    + "  admissible " + n(.value.admissible)
                    + "  distinct_slugs " + n(.value.distinct_slugs)),
                "  conflicting conditions " + n($S.mismatched_conditions)
              end' /tmp/cx.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- 4 · what this lane HOLDS, by provenance --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            (.inventory // []) as $i
            | "  positions " + n($i|length),
              ($i | group_by(.provenance // "UNLABELLED")[]
                | "  " + n(.[0].provenance) + "  " + n(length)
                  + "   ids " + n([.[].position_id]))' \
            /tmp/ee.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- 5 · reconciled P&L, per lane --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            .statuses.shadow_pnl as $P
            | "  mark_basis " + n($P.unrealised_basis),
              ($P.lanes // {} | to_entries[]
                | "  " + .key + "  realised " + n(.value.net_usd)
                  + "  fees " + n(.value.fees_usd)
                  + "  unrealised " + n(.value.unrealised.unrealised_usd)
                  + "  total " + n(.value.total_pnl_usd)
                  + "  marked " + n(.value.unrealised.marked_positions)
                  + "/unmarked " + n(.value.unrealised.unmarked_positions))' \
            /tmp/pnl.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          # ── 6 · MANAGEMENT EVIDENCE, ON ITS OWN EVIDENCE ─────────────
          #
          # THE CONFLATION THIS PREVENTS. A successful terminal-settlement
          # read proves LIFECYCLE CLOSURE: the venue was asked, the answer
          # was authoritative, the accounting was written and the exposure
          # released. It proves NOTHING about recurring management, because
          # settlement is one event and management is a repeated decision
          # with its own observed inputs. The two are reported apart, and
          # `with_observed_runtime_decision` is the only number that speaks
          # to the second one.
          say "-- 6 · recurring MANAGEMENT evidence (not settlement) --"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            .statuses.prospective_rn1_management as $P
            | "  positions " + n($P.positions)
              + "   with_observed_runtime_decision "
              + n($P.with_observed_runtime_decision),
              "  by_decision_basis " + n($P.by_decision_basis),
              "  legacy_backdated_and_reclassified "
                + n($P.legacy_backdated_and_reclassified),
              "  newest_decision_ts " + n($P.newest_decision_ts),
              "  badge " + n($P.badge) + "  producing " + n($P.producing),
              "  why " + n($P.why)' \
            /tmp/pnl.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ═══════════════════════════════════════════════════════════════
      #  THE ACCEPTANCE READBACK. TWO PARTS, NEVER SUMMED.
      # ═══════════════════════════════════════════════════════════════
      #
      #   A · SOFTWARE CAPABILITY. One named position that traversed EVERY
      #       stage through the production code paths: entry, a MODELLED
      #       order, a SIMULATED fill, inventory, recurring management,
      #       exit or settlement, reconciled accounting, and the trace that
      #       publishes it. It proves the lifecycle runs. It says NOTHING
      #       about profitability and nothing about current markets.
      #
      #   B · CURRENT-MARKET OPERATION is the block above (0a-6): the
      #       measured universe, the funnel, the coverage census and the
      #       positive-edge count. A NO_TRADE there is a decision, not an
      #       absence of one.
      #
      #   C · VENUE-NATIVE SCOPE, so "no compatible market" can be
      #       attributed. The entry lane's universe comes from OUR
      #       `markets` table; this reads the VENUE'S OWN board through the
      #       route the desk uses, and the difference between the two is
      #       the attribution.
      #
      # ── THE FOUR AUTHORIZED REPAIRS, READ BACK ───────────────────────
      #
      # S1 sizing, S2 candidate audit, S3 soccer mapping, S4 the whole
      # venue catalogue. Each is a READ of something the release changed;
      # none of them writes, and none of them can submit an order.
      - name: Repairs — sizing, candidate audit, soccer mapping, catalogue
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          A="${API:-https://sportsassets-api.onrender.com}"
          H="X-Admin-Token: ${ADMIN_TOKEN:-}"
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### REPAIRS: S1 sizing · S2 audit · S3 soccer · S4 catalogue" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            say "SKIPPED: no ADMIN_TOKEN"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi

          # ── S1 + S2 · EVERY CANDIDATE THAT PRICED POSITIVELY ─────────
          #
          # THE SEVEN AUDIT DIMENSIONS, from the row rather than re-derived:
          # fixture, payout identity, intent, market period, price
          # orientation, fees and freshness. Before this release four of
          # those were unreadable -- `period` was the literal FULL_GAME on
          # every row, the resolver's identity evidence was three nulls
          # because the wrapper read key names `premap.resolve` does not
          # return, and the freshness decomposition was not persisted at
          # all. So a +0.397 edge could not be told from an artefact.
          say "== S2 · the positive-edge candidates, audited =="
          EC=$(curl -s --max-time 90 -o /tmp/ev.json -w '%{http_code}' \
                 -H "$H" \
                 "$A/api/command/rn1x/external/entry-evidence?hours=6&limit=60" \
                 || echo 000)
          say "entry-evidence HTTP $EC"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            [(.candidates // [])[]
              | select((.estimated_edge_per_contract // -1) > 0)] as $P
            | "  positive_edge_candidates  " + ($P | length | tostring),
              ($P[] | .risk_verdict as $R | .execution_estimate as $E
               | "",
                 "-- " + n(.us_market_slug) + "   edge/contract " + n(.estimated_edge_per_contract),
                 "   1 FIXTURE      condition " + n(.condition_id)
                   + "  event_key " + n(.event_key),
                 "   2 PAYOUT IDENT pays_on " + n(.payout_event)
                   + "  basis " + n(.payout_event_basis),
                 "                  prob_event " + n(.probability_event)
                   + "  complement " + n(.payout_is_complement),
                 "                  resolver_asked " + n(.resolver_asked_for)
                   + "  matched_side " + n(.matched_side_norm),
                 "                  mapped_outcome " + n(.mapped_outcome)
                   + "  match " + n(.mapping_match),
                 "   3 INTENT       " + n(.buy_intent)
                   + "  ladder_side " + n(.ladder_side)
                   + "  identity_basis " + n(.contract_identity_basis),
                 "   4 PERIOD       " + n(.period)
                   + "  market " + n(.market)
                   + "  settlement_rule " + n(.settlement_rule),
                 "   5 ORIENTATION  p " + n(.probability)
                   + "  executable " + n(.executable_price)
                   + "  overround " + n(.overround)
                   + "  devig " + n(.devig_method),
                 "   6 FEES         cost/contract " + n(.cost_per_contract)
                   + "  realised_fee " + n($E.fee_per_contract_realised)
                   + "  basis " + n($E.fee_basis),
                 "                  vwap " + n($E.vwap)
                   + "  submitted_limit " + n($E.submitted_limit)
                   + "  economics_use " + n($E.economics_use),
                 "   4b CATALOGUE  kind " + n(.period_evidence.kind)
                   + "  event " + n(.period_evidence.event_slug)
                   + "  side " + n(.period_evidence.side)
                   + "  siblings " + n(.period_evidence.sibling_markets),
                 "   7 FRESHNESS    fresh " + n($R.freshness_evidence.fresh)
                   + "  pinnacle " + n($R.freshness_evidence.pinnacle_age_s)
                   + "/" + n($R.freshness_evidence.pinnacle_limit_s)
                   + "  venue " + n($R.freshness_evidence.venue_age_s)
                   + "/" + n($R.freshness_evidence.venue_limit_s),
                 "                  venue_clock " + n($R.freshness_evidence.venue_age_basis),
                 "   7b RAW CLOCK   path " + n($R.freshness_evidence.venue_clock.field_path)
                   + "  type " + n($R.freshness_evidence.venue_clock.raw_type),
                 "                  raw " + n($R.freshness_evidence.venue_clock.raw),
                 "                  parser " + n($R.freshness_evidence.venue_clock.parser)
                   + "  parsed_epoch " + n($R.freshness_evidence.venue_clock.parsed_epoch_s),
                 "                  lag provider " + n($R.freshness_evidence.pinnacle_provider_lag_s)
                   + "  ours " + n($R.freshness_evidence.pinnacle_our_processing_s),
                 "                  why " + (n($R.freshness_evidence.why) | .[0:110]),
                 "   S1 SIZING     reduced_by_rails " + n($R.notional_reduced_by_rails)
                   + "  policy_notional " + n($R.policy_notional_usd),
                 "                  qty_cap " + n($R.qty_cap.qty_cap)
                   + "  binding " + n($R.qty_cap.binding_rail),
                 "                  size " + n(.proposed_size)
                   + "  rails_not_passed " + n($R.railsNotPassed),
                 "                  gates_not_passed " + n($R.gatesNotPassed)
                   + "  permitted " + n($R.permitted)
                   + "  reason " + (n($R.reason) | .[0:60]),
                 "   REFUSALS      " + ((.refusals // []) | join(", ") | .[0:190]))' \
            /tmp/ev.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "  READ IT AS: fresh=null is UNKNOWN, not stale -- a clock was"
          say "  not measured, and venue_clock says which. fresh=false means"
          say "  both were measured and one was too old. Those are different"
          say "  problems and only one of them is ours."
          say ""
          say "  AND: rails_failed EMPTY with a positive edge is the S1"
          say "  repair working. Before it, a STANDARD budget reserved at"
          say "  the break-even limit exceeded a STANDARD rail by exactly"
          say "  the edge, so every profitable candidate failed all five."
          say ""

          # ── S3 · WHY SOCCER CANNOT REACH A VENUE CONTRACT ────────────
          say "== S3 · the resolver's own answer, per soccer fixture =="
          for SP in Soccer soccer; do
            MC=$(curl -s --max-time 180 -o /tmp/mg.json -w '%{http_code}' \
                   -H "$H" "$A/api/admin/shadow-mapgap?sport=$SP&limit=14" \
                   || echo 000)
            say "shadow-mapgap sport=$SP HTTP $MC"
            if [ "$MC" = "200" ]; then break; fi
          done
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            "  fixtures_read " + n(.fixtures_read),
            "  steps " + ((.steps // {}) | tojson | .[0:300]),
            ((.fixtures // [])[] | "",
              "-- " + n(.global_slug),
              "   title " + n(.title),
              "   sides " + ((.sides_parsed // []) | tojson),
              ((.per_side // {}) | to_entries[]
                | "   " + (.key | .[0:26])
                  + "  step " + n(.value.step)
                  + "  keys " + n(.value.keys_built)
                  + "  venue_rows " + n(.value.venue_rows_found),
                  "      league_alias_would_hit " + n(.value.league_alias_would_hit)
                    + "  stripped " + n(.value.league_alias_stripped_key)
                    + "  rows " + n(.value.league_alias_venue_rows),
                  "      venue_sample " + (n(.value.league_alias_venue_sample) | .[0:140]),
                  "      bridge " + n(.value.bridge_reason)
                    + "  would_resolve " + n(.value.bridge_would_resolve),
                  "      resolved_slug " + n(.value.market_slug)
                    + "  intent " + n(.value.intent),
                  "      DETAIL " + (n(.value.detail) | .[0:240])),
              "   -- the VENUE'"'"'S OWN ROWS for this event --",
              ((.venue_rows // [])[]
                | "      " + n(.market_slug)
                  + "  kind " + n(.kind)
                  + "  side_norm " + n(.side_norm)
                  + "  siblings " + n(.siblings_for_event)
                  + "  lg " + n(.league)
                  + "  | " + (n(.question) | .[0:80])))' \
            /tmp/mg.json 2>&1 | head -140 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "  THE STEP NAME IS THE REMEDY. no_key_intersection with"
          say "  league_alias_would_hit=true is a LEAGUE token gap, which"
          say "  the resolver already bridges. false with rows found is a"
          say "  TEAM-CODE gap, which needs a witness from the venue's own"
          say "  question text and is a different mechanism entirely."
          say "  Naming which one applies is what stops an alias table"
          say "  being invented."
          say ""

          # ── S4 · THE WHOLE BOARD, NOT THE FIRST 400 ──────────────────
          say "== S4 · every competition on the venue's board =="
          VC=$(curl -s --max-time 180 -o /tmp/vcm.json -w '%{http_code}' \
                 -H "$H" "$A/api/admin/venue-competitions" || echo 000)
          say "venue-competitions HTTP $VC"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            "  events_read " + n(.events_read)
              + "  competitions " + n(.competitions)
              + "  truncated " + n(.truncated),
            "  REAL tokens (no simulation marker in the venue'"'"'s labels):",
            "    " + ((.real_competition_tokens // []) | join(" ") | .[0:600]),
            "  REAL tokens WITH a money line:",
            "    " + ((.real_competitions_with_a_moneyline // []) | join(" ") | .[0:600]),
            "",
            ((.rows // [])[]
              | "  " + n(.league_token)
                + "  events " + n(.events)
                + "  ml_events " + n(.moneyline_events)
                + "  sides " + n(.moneyline_sides)
                + "  sim " + n(.simulated_events)
                + "  " + n(.verdict)
                + "  desk " + ((.desk_league_buckets // {}) | tojson | .[0:60])
                + "  e.g. " + n(.examples[0].event)
                + " | " + n(.examples[0].title))' \
            /tmp/vcm.json 2>&1 | head -120 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          # ── S4b · THE FIXTURE QUESTION, not the token question ───────
          # The lane refuses per FIXTURE. `lmx` being on the board does not
          # mean the fixture we hold a probability for is, and a token
          # census cannot tell those apart. `lmx` holds 7 events, so every
          # one of them fits in the record.
          for T in lmx efl1 cnl lng; do
            say ""
            say "-- S4b · every venue event under '$T' --"
            VT=$(curl -s --max-time 180 -o "/tmp/vt_$T.json" \
                   -w '%{http_code}' -H "$H" \
                   "$A/api/admin/venue-competitions?token=$T" || echo 000)
            say "   HTTP $VT"
            jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
              ((.token_events // [])[]
                | "   " + n(.event) + "  | " + n(.title)
                  + "  kinds " + ((.market_kinds // []) | join(","))
                  + "  ml " + ((.moneyline_us_slugs // []) | join(" ")
                               | .[0:150]))' \
              "/tmp/vt_$T.json" 2>&1 | head -40 \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          done
          say ""
          say "  READ IT AS: our own market slug names a fixture and a"
          say "  PAYOUT EVENT. A venue event listed here with an aec/atc"
          say "  money line is reachable; the same fixture absent is"
          say "  missing venue coverage; and our slug naming an exact"
          say "  score or a total is a payout event the venue does not"
          say "  sell as a money line, which is neither of those."
          say ""
          # ── S4b2 · THE COMMAND CENTRE ITSELF, INSPECTED ──────────────
          # The operating handoff, read through the deployed interface --
          # not a description of it. Controls, Opportunities, Orders,
          # Positions and Performance, with the books kept separate and
          # NO_TRADE reported as a result when the scheduler admitted
          # nothing.
          say ""
          say "== S4b2 · the Bettor EV Engine operating handoff =="
          DK=$(curl -s --max-time 120 -o /tmp/desk.json -w '%{http_code}' \
                 -H "$H" "$A/api/command/bettor/desk?hours=24&limit=40" \
                 || echo 000)
          say "  GET /api/command/bettor/desk  HTTP $DK"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            "  product " + n(.product) + "  view " + n(.view),
            "  funded_submission " + n(.funded_submission)
              + "  reads_only " + n(.reads_only),
            "",
            "  -- CONTROLS --",
            "  mode " + n(.controls.research_mode.label)
              + "  env_flag_set " + n(.controls.research_mode.env_flag_set)
              + "  submits_orders " + n(.controls.research_mode.submits_orders),
            "  build " + n(.controls.build_identity.build)
              + "  source_sha12 " + n(.controls.build_identity.source_sha256_12)
              + "  pid " + n(.controls.build_identity.pid),
            "  cycle_at " + n(.controls.last_cycle_at)
              + "  state " + n(.controls.cycle_state)
              + "  LABEL " + n(.controls.cycle_label),
            "  control_state " + ((.controls.control_state // {}) | tojson | .[0:200]),
            "",
            "  -- OPPORTUNITIES --",
            "  markets_considered " + n(.opportunities.markets_considered)
              + "  candidates " + n((.opportunities.candidates // []) | length)
              + "  admissible " + n(.opportunities.admissible_count),
            "  VERDICT " + n(.opportunities.verdict),
            "  fair value " + n(.opportunities.fair_value_source.name)
              + "  internally_trained "
              + n(.opportunities.fair_value_source.is_an_internally_trained_model),
            (((.opportunities.no_trade_reasons // {}) | to_entries[])
              | "     blocker " + .key + "  x" + (.value|tostring)),
            (((.opportunities.funnel // {}) | to_entries[])
              | "     funnel " + .key
                + "  mapped " + n(.value.mapped_to_a_venue_contract)
                + "  evaluated " + n(.value.evaluated)
                + "  written " + n(.value.written)),
            (((.opportunities.first_refusal_per_mapped_candidate // [])[])
              | "     candidate " + n(.us_market_slug)
                + "  stage " + n(.stage)
                + "  first_refusal " + n(.first_refusal)),
            "",
            "  -- POSITIONS, SEPARATE BOOKS --",
            (((.positions.books // {}) | to_entries[])
              | "     book " + .key + "  count " + (.value.count|tostring)),
            "  " + n(.positions.note),
            "",
            "  -- PERFORMANCE, PER LANE --",
            (((.performance.per_lane // {}) | to_entries[])
              | "     " + .key + "  " + (.value | tojson | .[0:220])),
            "  mark_basis " + n(.performance.mark_basis),
            "",
            "  -- OPEN LIMITATIONS, STATED --",
            "  freshness   " + n(.open_limitations.venue_book_freshness),
            "  settlement  " + n(.open_limitations.settlement_compatibility),
            "  scope       " + n(.open_limitations.market_scope_metadata)' \
            /tmp/desk.json 2>&1 | head -90 | tee -a "$GITHUB_STEP_SUMMARY" \
            || true
          if [ "$DK" != "200" ]; then
            say "  THE HANDOFF DID NOT RETURN 200 -- head of the body:"
            head -c 400 /tmp/desk.json 2>/dev/null \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
          say ""

          # ── S4c · THE PUBLISHED SCHEMA, FETCHED ON THIS RUNNER ───────
          # The container the agent works in cannot reach
          # docs.polymarket.us (its egress proxy blocks the domain). This
          # runner can, and the published schema is the authority for what
          # the two type fields MEAN -- captured samples show which values
          # occur, never what they cover. Fetched read-only, printed with
          # its source named, and it is NOT replaced by older repository
          # classifiers.
          say ""
          say "== S4c · the venue's PUBLISHED Sports Schema =="
          SCU="https://docs.polymarket.us/trader-guide/sports-schema"
          say "  source $SCU"
          SC=$(curl -sL --max-time 60 -o /tmp/schema.html \
                 -w '%{http_code}' "$SCU" || echo 000)
          say "  HTTP $SC  bytes $(wc -c < /tmp/schema.html 2>/dev/null || echo 0)"
          if [ "$SC" = "200" ]; then
            python3 - <<'PYS' | tee -a "$GITHUB_STEP_SUMMARY" || true
          import html, re, sys
          t = open("/tmp/schema.html", errors="replace").read()
          t = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", t)
          t = html.unescape(re.sub(r"(?s)<[^>]+>", "\n", t))
          lines = [l.strip() for l in t.splitlines() if l.strip()]
          keys = ("sportsMarketType", "marketSportType", "market_sport_type",
                  "SPORTS_MARKET_TYPE", "full_game", "full_time",
                  "first_half", "second_half", "period", "scope",
                  "slug", "identifier", "participant", "team")
          hits = [l for l in lines if any(k in l for k in keys)]
          print("  schema lines mentioning the fields: %d" % len(hits))
          for l in hits[:80]:
              print("   | " + l[:160])
          if not hits:
              print("   NO FIELD NAMES FOUND IN THE FETCHED TEXT -- the page")
              print("   may render client-side. Then the published schema is")
              print("   NOT in hand and the token sets stay provisional.")
          PYS
          else
            say "  THE SCHEMA WAS NOT RETRIEVED. The scope token sets in"
            say "  bettor_venue_mapping remain PROVISIONAL -- established"
            say "  from captured responses and held conservatively -- and"
            say "  that is stated in the module, not glossed."
          fi
          say ""

          # ── S4d · THE TWO TYPE FIELDS, TOGETHER, ON REAL CONTRACTS ───
          # v2 is the STRUCTURE and cannot carry scope: captured rows show
          # full_game, first_half and second_half SPREADs all returning
          # SPORTS_MARKET_TYPE_SPREAD. So the pair is printed side by side
          # for a full-game shape, a segment shape and a future shape.
          say "== S4d · sportsMarketTypeV2 AND sportsMarketType, together =="
          for T in mlb cfb nhl f1 lmx; do
            MT=$(curl -s --max-time 180 -o "/tmp/mt_$T.json" \
                   -w '%{http_code}' -H "$H" \
                   "$A/api/admin/venue-competitions?token=$T" || echo 000)
            say ""
            say "-- $T  HTTP $MT"
            jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
              ((.token_events // [])[]
                | "   event " + n(.event) + "  | " + n(.title),
                  ((.market_types // [])[]
                    | "      " + n(.us_slug)
                      + "\n         v2 " + n(.sportsMarketTypeV2)
                      + "\n         v1 " + n(.sportsMarketType)
                      + "\n         kind(diagnostic only) "
                      + n(.kind_diagnostic_only)
                      + "  team " + n(.team) + "/" + n(.team_id)))' \
              "/tmp/mt_$T.json" 2>&1 | head -80 \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          done
          say ""
          say "  READ IT AS: v2 establishes STRUCTURE only. If a full game"
          say "  and a half show the SAME v2, that is the proof, and scope"
          say "  must come from v1's own scope token. A v1 with no"
          say "  recognised token -- the generic \`moneyline\`, or a"
          say "  whole-contest form like \`tennis_match_winner\` -- leaves"
          say "  scope UNRESOLVED rather than full."
          say ""

          # ── S5 · WHAT THE VENUE'"'"'S transactTime ACTUALLY MEANS ──────
          # The gate refuses a book whose transactTime is more than 30 s
          # before the decision instant. That is a staleness measurement
          # ONLY IF the venue stamps the RESPONSE. If it stamps the LAST
          # BOOK CHANGE, an old value means the book has not moved -- the
          # ordinary condition of a quiet pre-game money line -- and the
          # gate would be refusing quiet books and calling it freshness.
          # institutional_book'"'"'s own contract was INSPECTED and does not
          # transfer: its 5 s limit measures OUR CACHED COPY, and what
          # makes that meaningful is a persistent poll process refreshing
          # the cache while the consumer reads memory instead of calling
          # REST to decide. This lane calls REST AT the decision, so
          # receipt age is the round trip and the check cannot fail.
          # obs/streamstate forbids the subtraction outright. THE REFUSAL
          # IS RETAINED and both limits stay where they are.
          #
          # SO THIS BLOCK REPORTS OBSERVATIONS AND DRAWS NO VERDICT: raw
          # stamps, our request and receipt instants, book hashes and the
          # deltas. Two samples of three contracts cannot separate a
          # response stamp from a last-update stamp, and nothing about
          # admission moves either way.
          say ""
          say "== S5 · the venue clock, read twice on the same contract =="
          CP=$(curl -s --max-time 240 -o /tmp/clk.json -w '%{http_code}' \
                 -H "$H" "$A/api/admin/venue-clock-probe?gap_s=12&slugs=aec-mlb-cin-tor-2026-09-26,aec-mlb-nym-wsh-2026-09-26,aec-atp-danmed-valroy-2026-09-23" \
                 || echo 000)
          say "venue-clock-probe HTTP $CP"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            "  configured_limit_s " + n(.configured_limit_s),
            "  SEMANTICS " + n(.semantics),
            ((.pairs // [])[]
              | "  " + n(.slug) + "  gap " + n(.gap_s) + "s  " + n(.verdict),
                "     1 raw " + n(.first.raw_transact_time)
                  + "  type " + n(.first.raw_type)
                  + "  parsed " + n(.first.parsed_epoch_s),
                "       returned_at " + n(.first.returned_at_epoch_s)
                  + "  age_at_return " + n(.first.age_at_return_s) + "s"
                  + "  book " + n(.first.book_sha16)
                  + "  ask " + n(.first.best_ask)
                  + "  depth " + n(.first.displayed_ask_depth),
                "     2 raw " + n(.second.raw_transact_time)
                  + "  parsed " + n(.second.parsed_epoch_s),
                "       returned_at " + n(.second.returned_at_epoch_s)
                  + "  age_at_return " + n(.second.age_at_return_s) + "s"
                  + "  book " + n(.second.book_sha16),
                "     transact_delta " + n(.transact_time_delta_s) + "s"
                  + "  book_changed " + n(.book_changed)),
            "  " + n(.reading)' \
            /tmp/clk.json 2>&1 | head -60 | tee -a "$GITHUB_STEP_SUMMARY" \
            || true

          # ── S6 · THE FIXTURE QUESTION, four verdicts not one ─────────
          say ""
          say "== S6 · competition / fixture / contract / payout event =="
          for SP in Soccer Baseball; do
            FX=$(curl -s --max-time 240 -o "/tmp/fx_$SP.json" \
                   -w '%{http_code}' -H "$H" \
                   "$A/api/admin/venue-fixture-crossing?sport=$SP&limit=30" \
                   || echo 000)
            say ""
            say "-- $SP  HTTP $FX"
            jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
              "   venue_events_considered " + n(.venue_events_considered),
              "   verdicts " + n(.verdict_counts),
              ((.fixtures // [])[]
                | "   " + n(.global_slug),
                  "      verdict " + n(.verdict),
                  "      ours sides " + n(.our_sides)
                    + "  family " + n(.our_market_family)
                    + "  segment " + n(.our_segment)
                    + "  full_match_winner "
                    + n(.our_payout_is_a_full_match_winner),
                  "      venue fixture " + n([(.venue_fixture_candidates
                      // [])[].event])
                    + "  full_match " + n(.venue_full_match_contracts),
                  (if (.single_side_only_near_misses // []) | length > 0
                   then "      ONE SIDE ONLY (not adopted) "
                        + n([(.single_side_only_near_misses[]
                              | .event)])
                   else empty end))' \
              "/tmp/fx_$SP.json" 2>&1 | head -120 \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          done
          say ""
          say "  ONLY the ALL_PRESENT verdict is a mapping defect on our"
          say "  side. The rest are absent venue coverage, or a candidate"
          say "  query asking for a payout event the venue does not sell"
          say "  as a money line, and no normalisation repairs either."
          say ""
          say "  THE EPL QUESTION, SETTLED EITHER WAY. events_read is the"
          say "  WHOLE cached board, not desk-games' first 400, so an"
          say "  absent token here is absence from the board rather than"
          say "  from a sample. A token present with ml_events 0 is listed"
          say "  without a money line, which no mapping repair reaches."
          say ""
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Nothing here writes. Every read is authenticated and existing.
      - name: Acceptance — capability, then current market, then scope
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          A="${API:-https://sportsassets-api.onrender.com}"
          H="X-Admin-Token: ${ADMIN_TOKEN:-}"
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### ACCEPTANCE: A capability · B current market · C scope" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            say "SKIPPED: no ADMIN_TOKEN"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi

          # ── A · THE CONTROLLED LIFECYCLE, FOUND NOT ASSUMED ──────────
          #
          # The position is SEARCHED FOR by the property that matters --
          # orders AND fills AND a settled outcome row -- rather than
          # hardcoded. A hardcoded id is how this report previously came to
          # describe Arizona while the gate judged Houston.
          say "== A · SOFTWARE CAPABILITY: one position, every stage =="
          PC=$(curl -s --max-time 90 -o /tmp/apos.json -w '%{http_code}' \
                 -H "$H" "$A/api/command/rn1x/positions?limit=200" || echo 000)
          say "positions HTTP $PC"
          jq -r '[(.positions // [])[] | .position_id] | .[0:60] | .[]' \
            /tmp/apos.json > /tmp/apids.txt 2>/dev/null || true
          say "candidate positions scanned  $(wc -l < /tmp/apids.txt)"
          FOUND=""
          : > /tmp/atr.json
          while read -r P; do
            [ -n "$P" ] || continue
            curl -s --max-time 60 -H "$H" \
              "$A/api/command/rn1x/trace/$P" -o /tmp/t1.json || continue
            # EVERY STAGE, OR IT IS NOT THE DEMONSTRATION.
            # `.outcome` is ONE OBJECT OR NULL, not an array -- the trace
            # route returns `outcome`, and rn1x_outcomes is keyed by
            # position_id so there is at most one row. Testing `.outcomes`
            # as a list would have matched nothing forever and reported a
            # missing demonstration that was actually a missing key.
            if jq -e '((.orders // []) | length) > 0
                      and ((.fills // []) | length) > 0
                      and (.outcome != null)' \
                 /tmp/t1.json >/dev/null 2>&1; then
              FOUND="$P"; cp /tmp/t1.json /tmp/atr.json; break
            fi
          done < /tmp/apids.txt
          if [ -z "$FOUND" ]; then
            say "NO POSITION IN THE NEWEST 60 TRAVERSED EVERY STAGE."
            say "That is a gap in the demonstration, not a passing result."
          else
            say "subject  $FOUND"
            say "trace    $A/api/command/rn1x/trace/$FOUND"
            jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
              .position as $p
              | "  1 ENTRY        policy " + n($p.policy)
                  + "  provenance " + n($p.provenance)
                  + "  entry_kind " + n($p.entry_kind),
                "                qty " + n($p.qty)
                  + "  filled " + n($p.filled_qty)
                  + "  residual " + n($p.residual_qty)
                  + "  basis_usd " + n($p.cost_basis_usd),
                "  2 ORDERS       " + ((.orders // []) | length | tostring)
                  + "   " + ((.orders // []) | map(
                      n(.side) + "/" + n(.state) + " @" + n(.limit_price)
                      + " x" + n(.qty) + " filled " + n(.filled_qty)
                      + " basis " + n(.fill_basis)) | join("  ")),
                "  3 FILLS        " + ((.fills // []) | length | tostring)
                  + "   " + ((.fills // []) | map(
                      "@" + n(.price) + " x" + n(.qty)
                      + " fee " + n(.fee_usd)
                      + " queue_share " + n(.queue_share)
                      + " basis " + n(.fill_basis)) | join("  ")),
                "  4 MANAGEMENT   decisions "
                  + ((.decisions // []) | length | tostring)
                  + "   distinct_instants "
                  + (((.decisions // []) | map(.decision_ts) | unique
                      | length) | tostring)
                  + "   newest " + n((.decisions // []) | last | .decision_ts),
                # ONE OUTCOME ROW OR NONE. rn1x_outcomes is keyed by
                # position_id, and the route returns it as `outcome`.
                "  5 EXIT/SETTLE  settled_at " + n(.outcome.settled_at)
                  + "   residual " + n(.outcome.residual_qty)
                  + "   unpaired " + n(.outcome.unpaired_qty)
                  + "   basis " + n(.outcome.outcome_basis),
                "  6 ACCOUNTING   realized_cash " + n(.outcome.realized_cash_usd)
                  + "  fees " + n(.outcome.fees_usd)
                  + "  net " + n(.outcome.net_usd)
                  + "  residual_settled " + n(.outcome.residual_settled_usd)
                  + "  turnover " + n(.outcome.turnover_usd)
                  + "  committed_peak " + n(.outcome.committed_peak_usd),
                # THE ROUTE SAYS THIS ITSELF. Printing its own words beats
                # asserting a column that does not exist on the projection:
                # `is_modelled` is CHECKed true in the SCHEMA, and the
                # trace publishes the semantics as prose instead.
                "  LABELS        " + (n(.fill_semantics) | .[0:300])' \
              /tmp/atr.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
            say "                No order was submitted to any venue;"
            say "                migration 100 CHECKs is_modelled true on"
            say "                every rn1x order and fill."
            say "  PROVES        the lifecycle runs end to end."
            say "  DOES NOT      say anything about profitability, about"
            say "                current markets, or about capital."
          fi
          say ""

          # ── A2 · DUPLICATE PROTECTION AND RESTART RECOVERY ───────────
          #
          # Both are demonstrated by REPEATING an operation that already
          # happened and showing the refusal, which is stronger than a
          # test asserting the same thing in isolation.
          say "== A2 · duplicate protection, on a live repeat =="
          SC=$(curl -s --max-time 60 -o /tmp/adup.json -w '%{http_code}' \
                 -X POST -H "$H" -H 'Content-Type: application/json' \
                 -d '{}' "$A/api/admin/rn1x-acceptance-position" || echo 000)
          say "re-seed HTTP $SC"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            "  state " + n(.state) + "  wrote " + n(.wrote)
              + "  position_id " + n(.position_id),
            "  why   " + (n(.why) | .[0:200]),
            "  submits_orders " + n(.submits_orders)
              + "  funded " + n(.funded)' \
            /tmp/adup.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say "  A SECOND CALL MUST NOT CREATE A SECOND HOLDING. wrote=false"
          say "  with an ADOPTED/existing state is the protection working;"
          say "  migration 114's unique index is the backstop."
          say ""
          # WHAT THIS BLOCK DOES AND DOES NOT SHOW.
          #
          # It shows LIVENESS AFTER A PROCESS RESTART: the API was
          # redeployed for this release, and the writer identity below
          # carries THIS build's SHA, so the cycle it timestamps was run
          # by the post-restart process. That is worth reading, and it is
          # all it is.
          #
          # IT IS NOT RESTART RECOVERY OF HELD INVENTORY. Recovery means
          # a position entered before the restart is re-read afterwards
          # with the same identity, the same residual and no duplicate
          # write. This lane holds ZERO positions (§4 of the operating
          # recap), so there is nothing here for a restart to recover,
          # and a completed cycle cannot evidence otherwise.
          #
          # NOR IS A CONNECTION RELOAD A PROCESS RESTART. Re-reading a
          # position on a fresh DB connection in the same interpreter
          # exercises the reload path, not process recovery; the two must
          # not be reported as the same thing.
          #
          # Process recovery is verified separately, by two real OS
          # processes: A enters and manages, then EXITS; B starts in a
          # fresh interpreter and re-reads. See the acceptance record.
          say "== A2b · post-restart liveness (NOT inventory recovery) =="
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            .statuses.external_valuation.last_cycle as $L
            | "  entry loop   writer " + n($L.writer)
                + "  state " + n($L.state)
                + "  at " + n($L.at),
              "  SHOWS      the process that ran this cycle carries this",
              "             SHA for this release, so the loop came back up",
              "             the redeploy and is cycling.",
              "  DOES NOT   show restart recovery of held inventory: this",
              "             lane holds no positions, so no identity, no",
              "             residual and no duplicate protection is under",
              "             test here. A connection reload is also NOT a",
              "             process restart. Process recovery is verified",
              "             by the two-process check in the acceptance",
              "             record, not by this line."' \
            /tmp/pnl.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""

          # ── C · THE VENUE'S OWN BOARD, PER LEAGUE ────────────────────
          #
          # WHY THIS IS HERE. The entry lane's universe is OUR `markets`
          # table. Measured in run 67: 230 open Soccer rows, 29 Pinnacle-
          # priced soccer fixtures, and ZERO reaching a valuation -- three
          # of them refused with the venue's own words, "`markets.slug` is
          # the GLOBAL id and the venue does not accept it". That leaves one
          # question open, and it decides the attribution: does the VENUE
          # natively list a soccer MONEY LINE at all?
          #
          #   money lines exist on the venue  -> OUR ingestion is the defect
          #   they do not                     -> missing venue coverage
          #
          # `aec`/`atc` are the venue's own slug-grammar prefixes for a
          # money line (pmus.list_desk_events). The route below is the one
          # the desk board already uses; the admin token satisfies it.
          say "== C · the VENUE'S OWN board, per league =="
          VC=$(curl -s --max-time 120 -o /tmp/vb.json -w '%{http_code}' \
                 -H "$H" \
                 "$A/api/admin/desk-games?venue=polymarket&league=everything" \
                 || echo 000)
          say "desk-games HTTP $VC"
          jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
            (.games // []) as $g
            | "  events_returned " + ($g | length | tostring),
              "  counts " + ((.counts // {}) | tojson | .[0:400]),
              ($g | group_by(.league)[]
                | . as $rows
                | ($rows | map(.outcomes[]?.us_slug // "")
                         | map(select(test("^(aec|atc)-"))) | length) as $ml
                | "  " + n($rows[0].league)
                  + "  events " + ($rows | length | tostring)
                  + "  moneyline_sides " + ($ml | tostring)
                  + "  HAS_MONEYLINE " + (if $ml > 0 then "YES" else "NO" end)
                  + "   e.g. " + n($rows[0].outcomes[0].us_slug))' \
            /tmp/vb.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "  READ IT AS: a league with HAS_MONEYLINE YES is a contract"
          say "  the venue sells and our lane did not reach -- an"
          say "  INGESTION/MAPPING defect on our side. A league with NO is"
          say "  missing venue coverage, which no code of ours can repair."
          say "  Neither verdict makes an UNKNOWN payout rule compatible."
          say ""

          # ── C2 · WHICH SOCCER CONTRACT, EXACTLY ──────────────────────
          #
          # NOT EVERY NATIVE SOCCER CONTRACT IS SUITABLE, and the previous
          # report's `aec|atc` prefix test could not tell them apart: the
          # example it printed was `atc-ebfpl-ars-che-2026-09-25-dh2-ars`,
          # a DOUBLE CHANCE, and the MLB one was `...-i8-draw`, an INNING
          # SEGMENT. Both classify as "moneyline" today because
          # `copy_sports.market_type_of` returns on the KIND PREFIX alone
          # for the venue grammar and never inspects the suffix -- the
          # suffix analysis that catches segments and exact scores exists
          # only on the kindless feed grammar.
          #
          # So the payout event has to be established from the slug's own
          # shape before any probability is bound to it:
          #   three-way money line   home / draw / away on the full match
          #   binary team-win        one team, full match
          #   double chance          two of three outcomes -- NOT the same
          #                          payout event as a money line
          #   exact score, segments  excluded outright
          #
          # This prints the FULL board of up to three soccer events through
          # `/api/admin/desk-game`, which already applies the classifier,
          # so the real suffix vocabulary and the classifier's verdict on
          # each slug are visible together. It is a read; it decides
          # nothing.
          say "== C2 · the full soccer board, and how it classifies =="
          jq -r '[(.games // [])[] | select(.league == "soccer") | .id]
                 | .[0:3] | .[]' /tmp/vb.json > /tmp/socc.txt 2>/dev/null \
            || true
          say "soccer events sampled  $(wc -l < /tmp/socc.txt)"
          : > /tmp/soccslugs.txt
          while read -r EV; do
            [ -n "$EV" ] || continue
            say ""
            say "-- event $EV"
            GC=$(curl -s --max-time 90 -o /tmp/g1.json -w '%{http_code}' \
                   -H "$H" \
                   "$A/api/admin/desk-game?venue=polymarket&id=$EV" \
                   || echo 000)
            say "   desk-game HTTP $GC"
            # EVERY market, WITH the group label beside it. The payload's
            # exact nesting is not assumed: any object that carries a
            # `us_slug` is printed with whatever label sits next to it, and
            # the raw key list is printed too so a reader can see the shape
            # rather than trust this formatter.
            say "   raw keys: $(jq -r '[keys[]]|tostring' /tmp/g1.json 2>/dev/null | head -c 200)"
            jq -r 'def n(x): if x == null then "-" else (x|tostring) end;
              [.. | objects | select(has("us_slug"))]
              | .[] | "   " + n(.us_slug)
                      + "   label=" + (n(.label) | .[0:52])
                      + "   group=" + n(.group // .kind)' \
              /tmp/g1.json 2>/dev/null \
              | head -40 | tee -a "$GITHUB_STEP_SUMMARY" || true
            jq -r '[.. | objects | .us_slug? // empty] | unique | .[]' \
              /tmp/g1.json 2>/dev/null >> /tmp/soccslugs.txt || true
          done < /tmp/socc.txt
          say ""
          say "-- every distinct soccer us_slug seen --"
          sort -u /tmp/soccslugs.txt | head -60 \
            | sed 's/^/   /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- the SUFFIX VOCABULARY, after the date, with counts --"
          # The suffix is what distinguishes a full-match money line from a
          # double chance or a segment. Counted rather than eyeballed.
          sed -E 's/^[a-z]+-//; s/^.*-[0-9]{4}-[0-9]{2}-[0-9]{2}//; s/^-//' \
            /tmp/soccslugs.txt 2>/dev/null \
            | sed 's/^$/<EMPTY: bare event slug>/' \
            | sort | uniq -c | sort -rn | head -40 \
            | sed 's/^/   /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "-- the venue's own soccer LEAGUE TOKENS (alias check) --"
          sed -E 's/^[a-z]+-//; s/-.*$//' /tmp/soccslugs.txt 2>/dev/null \
            | sort | uniq -c | sort -rn | head -20 \
            | sed 's/^/   /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "  A suffix naming a half, a period, an inning, a correct or"
          say "  exact score, or a player is NOT the full-match payout event."
          say ""
          say "  AND A CORRECTION TO MY OWN EARLIER READING: binary YES/NO"
          say "  PACKAGING DOES NOT DISQUALIFY A CONTRACT. \"Team A wins the"
          say "  match? Y/N\" IS one outcome of a three-way match, and a"
          say "  de-vigged three-way probability prices it directly. Three"
          say "  such binaries -- home, draw, away -- are a three-way money"
          say "  line sold as three contracts. What disqualifies a contract"
          say "  is the EVENT it pays on, not how it is packaged. I said"
          say "  otherwise and it was wrong."
          say ""

          # ── C3 · REAL vs SIMULATED, OVER THE WHOLE SOCCER BOARD ──────
          #
          # The 3-event sample in C2 cannot answer the coverage question:
          # whether the venue lists the competitions the SOURCE prices --
          # the real English Premier League (`soccer_epl`) and Liga MX
          # (`soccer_mexico_ligamx`). This histograms the league token of
          # EVERY soccer event the board returned, which is already in hand
          # from the call above, so it costs nothing more.
          #
          # A SIMULATED COMPETITION IS NOT ITS REAL NAMESAKE. `ebfpl` is
          # eBattles FPL, whose own labels say "eBattles"; its fixtures
          # carry real club names and are not real fixtures. Binding a
          # real-league probability to one on a name match is a
          # cross-competition category error, and the token is the only
          # thing that separates them.
          say "== C3 · every soccer league token on the board =="
          jq -r '[(.games // [])[] | select(.league == "soccer")] as $s
                 | "  soccer events on the board  " + ($s | length | tostring),
                   ($s | group_by(.id | split("-")[0])[]
                     | "  " + (.[0].id | split("-")[0])
                       + "   events " + (length | tostring)
                       + "   e.g. " + (.[0].id)
                       + "   title " + ((.[0].title // "-") | .[0:56]))' \
            /tmp/vb.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          say ""
          say "  THE SOURCE PRICES: soccer_epl (the REAL Premier League)"
          say "  and soccer_mexico_ligamx (the REAL Liga MX). A token above"
          say "  that is neither is a competition we hold no probability"
          say "  for, however familiar the club names look."
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Operating desk — the demonstration, the books apart, the controls
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          A="${API:-https://sportsassets-api.onrender.com}"
          H="X-Admin-Token: ${ADMIN_TOKEN}"

          say "== D1 . THE PAGE IS SERVED, AND THE SHORT URL REDIRECTS =="
          PC=$(curl -sS -o /tmp/deskpage.html -w '%{http_code}' \
                 -H "$H" "$A/api/command/bettor/desk/page" || echo 000)
          RC=$(curl -sS -o /dev/null -w '%{http_code}' \
                 "$A/command/desk" || echo 000)
          UC=$(curl -sS -o /dev/null -w '%{http_code}' \
                 "$A/api/command/bettor/desk/page" || echo 000)
          say "  page with the operator token   HTTP $PC (expect 200)"
          say "  short URL /command/desk        HTTP $RC (expect 307)"
          say "  page with NO credential       HTTP $UC (expect 401)"
          say "  page bytes                    $(wc -c < /tmp/deskpage.html)"
          for M in "Bettor EV Engine" "btn-halt" "optoken" \
                   "/api/command/bettor/control/" "NO_TRADE"; do
            if grep -qF "$M" /tmp/deskpage.html; then
              say "  served page contains          $M"
            else
              say "  MISSING from the served page  $M"
            fi
          done

          say ""
          say "== D2 . THE CONTROLLED DEMONSTRATION, WHOLE LIFECYCLE =="
          curl -sS -X POST -H "$H" -H 'Content-Type: application/json' \
            -d '{"stage":"full"}' \
            "$A/api/admin/bettor-demonstration/run" > /tmp/demo.json \
            || say "  the demonstration call failed"
          jq -r '"  experiment      " + (.experiment_id // "-"),
                 "  ok              " + (.ok | tostring),
                 "  position        " + (.position_id // "-"),
                 "  cycles run      " + ((.lifecycle.cycles_run // 0) | tostring),
                 "  flat            " + (.lifecycle.position_is_flat | tostring),
                 "  residual        " + (.lifecycle.residual_settlement // "-"),
                 "  excluded from strategy performance  "
                   + (.excluded_from_strategy_performance | tostring)' \
            /tmp/demo.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '.lifecycle.reconciliation.positions[]?
                 | "  RECONCILED  bought " + (.bought_qty | tostring)
                   + " @ " + (.avg_buy_price | tostring)
                   + "  sold " + (.sold_qty | tostring)
                   + " @ " + (.avg_sell_price | tostring)
                   + "  held " + (.held_qty | tostring)
                   + "  fees " + (.fees_usd | tostring)
                   + "  realised net " + (.realised_net_of_fees_usd | tostring)
                   + "  identity " + (.quantity_identity_holds | tostring)' \
            /tmp/demo.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '.lifecycle.stages[]? | select(.ran == true)
                 | "  cycle " + ((.cycle // 0) | tostring)
                   + "  " + (.selected_action // "-")
                   + "  qty " + ((.selected_qty // 0) | tostring)
                   + "  prints " + ((.prints_applied // 0) | tostring)
                   + "/" + ((.prints_offered // 0) | tostring)
                   + "  residual after " + ((.inventory_after.residual // 0) | tostring)' \
            /tmp/demo.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

          say ""
          say "== D3 . THE DESK, BOOK BY BOOK, NEVER SUMMED =="
          curl -sS -H "$H" "$A/api/command/bettor/desk" > /tmp/desk.json \
            || say "  the desk read failed"
          jq -r '"  as of           " + (.as_of // "-"),
                 "  funded          " + (.funded_submission // "-"),
                 "  cycle label     " + (.controls.cycle_label // "-"),
                 "  build           " + ((.controls.build_identity.build // "-") | tostring),
                 "  verdict         " + (.opportunities.verdict // "-"),
                 "  admissible      " + ((.opportunities.admissible_count // 0) | tostring)' \
            /tmp/desk.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '.positions.books | to_entries[]?
                 | "  BOOK " + .key + "  positions " + ((.value.count // 0) | tostring)
                   + "  strategy performance "
                   + (.value.counts_toward_strategy_performance | tostring)' \
            /tmp/desk.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '.opportunities.no_trade_reasons // {} | to_entries[]?
                 | "  BLOCKED AT  " + .key + "   candidates " + (.value | tostring)' \
            /tmp/desk.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '"  demonstration counts toward strategy performance  "
                 + (.demonstration.counts_toward_strategy_performance | tostring)' \
            /tmp/desk.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

          say ""
          say "== D4 . THE EXCLUSION, AT THE CONSUMING QUERY =="
          curl -sS -H "$H" \
            "$A/api/command/rn1x/external/entry-evidence?hours=720&limit=50" \
            > /tmp/ee2.json || say "  the entry-evidence read failed"
          jq -r '"  evidence is scoped to   " + (.experiment_id // "-"),
                 "  inventory rows          " + ((.inventory // []) | length | tostring),
                 "  rows from another book  "
                   + (((.inventory // []) | map(select(.experiment_id != .experiment_id)) | length) | tostring)' \
            /tmp/ee2.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '(.inventory // [])[]
                 | "  INVENTORY  " + (.experiment_id // "-") + "  " + (.position_id // "-")' \
            /tmp/ee2.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          if grep -qF "DEMONSTRATION" /tmp/ee2.json; then
            say "  CHECK: the word DEMONSTRATION appears in this read"
          else
            say "  the demonstration does NOT appear in the entry lane read"
          fi

          say ""
          say "== D5 . THE CONTROLS, EACH READ BACK =="
          curl -sS -H "$H" "$A/api/command/bettor/control" > /tmp/ctl0.json \
            || say "  the control read failed"
          jq -r '"  research lane armed     " + ((.state.research_lane_armed.value) | tostring),
                 "  funded executor paused  " + ((.state.funded_executor_paused.value) | tostring),
                 "  working modelled orders " + ((.state.working_modelled_orders) | tostring),
                 "  orders this lane submitted " + ((.state.funded_orders_this_lane_submitted) | tostring),
                 "  live_orders rows, all time " + ((.state.live_orders_rows_all_time) | tostring),
                 "  account recorded        " + ((.state.account_proposal.name // "-") | tostring),
                 "  limits recorded         " + ((.state.limits_proposal.proposed // {}) | tostring)' \
            /tmp/ctl0.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

          say "  -- a pause, then a resume, each confirmed from the row --"
          curl -sS -X POST -H "$H" -H 'Content-Type: application/json' \
            -d '{"by":"COMMAND_VERIFY"}' \
            "$A/api/command/bettor/control/pause" > /tmp/ctlp.json || true
          jq -r '"  pause  ok " + (.ok | tostring)
                 + "  armed_confirmed " + ((.armed_confirmed) | tostring)' \
            /tmp/ctlp.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          curl -sS -X POST -H "$H" -H 'Content-Type: application/json' \
            -d '{"by":"COMMAND_VERIFY","scope":"research"}' \
            "$A/api/command/bettor/control/resume" > /tmp/ctlr.json || true
          jq -r '"  resume ok " + (.ok | tostring)
                 + "  armed_confirmed " + ((.armed_confirmed) | tostring)
                 + "  scope " + (.scope // "-")' \
            /tmp/ctlr.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

          say "  -- the two refusals that must stay refusals --"
          FR=$(curl -sS -o /tmp/ctlf.json -w '%{http_code}' -X POST -H "$H" \
                 -H 'Content-Type: application/json' \
                 -d '{"scope":"funded"}' \
                 "$A/api/command/bettor/control/resume" || echo 000)
          say "  funded resume            HTTP $FR (expect 409)"
          jq -r '"  refusal                  " + (.detail.reason // "-")' \
            /tmp/ctlf.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          # THE GUARD IS THE ROW, SO IT IS EXERCISED BY A REAL id. The
          # registry is read first; a display name alone proves only that a
          # name is not an identity, which is a different refusal.
          curl -sS -H "$H" -o /tmp/reg.json \
            "$A/api/admin/funded-account-registry" || true
          jq -r '"  registry accounts        " + ((.count // 0) | tostring),
                 "  eligible by their rows   "
                   + ((.activation_eligible_by_their_rows // [])
                      | join(", ")),
                 "  paused on their rows     "
                   + ((.paused_accounts // []) | join(", ")),
                 "  holds no balances        "
                   + ((.holds_no_balances // false) | tostring)' \
            /tmp/reg.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          PAUSED_ID=$(jq -r '(.paused_accounts // [])[0] // ""' \
                        /tmp/reg.json 2>/dev/null || echo "")
          if [ -n "$PAUSED_ID" ]; then
            say "  submitting the PAUSED account by its canonical id,"
            say "  under a different display name: the row must refuse it."
            curl -sS -X POST -H "$H" -H 'Content-Type: application/json' \
              -d "{\"account\":{\"account_id\":\"$PAUSED_ID\",\"name\":\"Perfectly Fine Desk\",\"venue\":\"PMUS_TEST\"}}" \
              "$A/api/command/bettor/control/account" > /tmp/ctla.json || true
            jq -r '"  paused account by id  ok " + (.ok | tostring)
                   + "  refusal " + (.refusal // "-")' \
              /tmp/ctla.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          else
            say "  no paused account in the registry to exercise the guard"
          fi
          # AND A DISPLAY NAME ALONE IS STILL NOT AN IDENTITY.
          curl -sS -X POST -H "$H" -H 'Content-Type: application/json' \
            -d '{"account":{"name":"PMUS ACCOUNTING_UNCERTAIN","venue":"PMUS"}}' \
            "$A/api/command/bettor/control/account" > /tmp/ctlb.json || true
          jq -r '"  a name with no id     ok " + (.ok | tostring)
                 + "  refusal " + (.refusal // "-")' \
            /tmp/ctlb.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

          say ""
          say "  A READ CREDENTIAL MUST NOT WRITE."
          NW=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                 -H 'Content-Type: application/json' -d '{}' \
                 "$A/api/command/bettor/control/pause" || echo 000)
          say "  control with no operator token   HTTP $NW (expect 401)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Operating desk — the COMMAND session on this hostname
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          A="${API:-https://sportsassets-api.onrender.com}"
          H="X-Admin-Token: ${ADMIN_TOKEN}"
          J=/tmp/cj.txt
          rm -f "$J"

          say "== E1 . THE SESSION COOKIE, ON THIS HOSTNAME =="
          say "  Serving the page here does not establish that the COMMAND"
          say "  session works here. The cookie is minted, then every read"
          say "  below is made with the COOKIE ALONE and no operator token."
          SC=$(curl -sS -o /tmp/sess.json -w '%{http_code}' -X POST \
                 -H "$H" -c "$J" "$A/api/command/session/operator" \
                 || echo 000)
          say "  mint the session               HTTP $SC (expect 200)"
          jq -r '"  cookie                        " + (.cookie // "-")
                 + "   path " + (.cookie_path // "-")
                 + "   token in body " + (.token_in_body | tostring)' \
            /tmp/sess.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          if grep -q "bt_command" "$J"; then
            say "  the jar holds bt_command      yes"
            say "  cookie attributes as sent     $(grep bt_command "$J" | cut -f1-6 | tr '\t' ' ')"
          else
            say "  the jar holds bt_command      NO -- nothing was set"
          fi
          for U in "/api/command/bettor/desk/page" \
                   "/api/command/bettor/desk" \
                   "/api/command/bettor/control" \
                   "/api/command/bettor/desk/page"; do
            printf '  cookie only  %-34s HTTP %s\n' "$U" \
              "$(curl -sS -o /dev/null -w '%{http_code}' -b "$J" "$A$U")" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          say "  (the fourth line is a REFRESH of the page, same cookie)"
          WC=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -b "$J" \
                 -H 'Content-Type: application/json' -d '{}' \
                 "$A/api/command/bettor/control/pause" || echo 000)
          say "  a WRITE with the cookie alone  HTTP $WC (expect 403 -- the"
          say "                                 read roles stay read-only)"

          say ""
          say "== E2 . NO CREDENTIAL IN THE PAGE, THE URL OR STORAGE =="
          curl -sS -b "$J" -o /tmp/page2.html \
            "$A/api/command/bettor/desk/page" || true
          for PAT in "X-Admin-Token: [A-Za-z0-9]" "localStorage\." \
                     "sessionStorage\." "token=" "password="; do
            if grep -qE "$PAT" /tmp/page2.html; then
              say "  FOUND in the served page      $PAT"
            else
              say "  absent from the served page   $PAT"
            fi
          done
          say "  the page reads /api/command/bettor/desk with"
          say "  credentials: same-origin and no token in any URL."

          say ""
          say "== E3 . THE SERVER DECIDES ACTIVATION, AND SAYS WHICH WAY =="
          say "  A REFUSAL IS 409 AND AN AUTHORISATION IS 200. Production"
          say "  has no account bound and no owner-approved limit set, so"
          say "  409 is the expected answer here; a 200 would name the"
          say "  verdict AUTHORIZED_FOR_A_TEST_VENUE and would still enable"
          say "  no capital -- funded submission is off in code."
          AC=$(curl -sS -o /tmp/act.json -w '%{http_code}' -X POST -H "$H" \
                 -H 'Content-Type: application/json' -d '{"by":"CI"}' \
                 "$A/api/command/bettor/control/activate" || echo 000)
          say "  activate                       HTTP $AC (expect 409 here)"
          jq -r '(.detail // .) as $d
                 | "  ok                             "
                     + (($d.ok // false) | tostring),
                   "  verdict                        "
                     + ($d.verdict // "-"),
                   "  refusal                        "
                     + ($d.refusal // "-"),
                   "  venue class                    "
                     + ($d.venue_class // "-"),
                   "  funded submission              "
                     + ($d.funded_submission // "-"),
                   "  authorises capital             "
                     + (($d.authorises_capital // false) | tostring),
                   "  unmet prerequisites            "
                     + (($d.failed.unmet // []) | join(", "))' \
            /tmp/act.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true

          say ""
          say "== E4 . THE CONTROL SESSION IS SCOPED, AND SERVER-SIDE =="
          say "  No operator password is held by this runner, so what is"
          say "  checked is the REFUSAL side: a deliberately wrong password"
          say "  must be rejected with a status, not a 200 carrying"
          say "  ok:false, and it must set no cookie."
          CS=$(curl -sS -o /tmp/ctlno.json -D /tmp/ctlno.hdr -w '%{http_code}' \
                 -X POST -H 'Content-Type: application/json' \
                 -d '{"password":"deliberately-not-the-operator-password"}' \
                 "$A/api/command/session/control" || echo 000)
          say "  wrong operator password        HTTP $CS (expect 401, or 503"
          say "                                 if it is not configured yet)"
          if grep -qi 'set-cookie: *bt_control' /tmp/ctlno.hdr; then
            say "  FOUND a control cookie on a refusal -- that is a defect"
          else
            say "  no control cookie was set on the refusal"
          fi
          jq -r '"  reason                         "
                   + ((.detail.reason // .reason) // "-")' \
            /tmp/ctlno.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          if grep -q 'id="oppass"' /tmp/page2.html; then
            say "  the page offers an operator PASSWORD field, not a token"
          else
            say "  the page has no operator password field -- check the build"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Capacity probe — the isolation audit, against production
        if: ${{ !cancelled() && github.event.inputs.entry_run == 'DO' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API: ${{ github.event.inputs.api }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          A="${API:-https://sportsassets-api.onrender.com}"
          H="X-Admin-Token: ${ADMIN_TOKEN}"
          say "== F1 . DID ANY CAPACITY-PROBE RECORD REACH PRODUCTION =="
          say "  ASKED OF PRODUCTION ITSELF, read-only. The runner holds no"
          say "  database credential, so the service -- which does -- runs"
          say "  the audit. A probe record is identified by the harness own"
          say "  fingerprints: the condition id shape, the slug prefix and"
          say "  the payout event. NEVER by an experiment id, because the"
          say "  experiment id is what was wrong."
          say ""
          say "  AND THE POSITIONS ARE THE LOAD-BEARING COUNT. Positions and"
          say "  fills feed exposure and per-lane P&L DIRECTLY -- neither"
          say "  consumer reads external_valuations on the way to a"
          say "  position -- so a zero valuation count would establish"
          say "  nothing about either. The evidence is zero identified probe"
          say "  positions AND zero of their dependent records."
          AU=$(curl -sS -o /tmp/prodaudit.json -w '%{http_code}' -H "$H" \
                 "$A/api/admin/capacity-probe-audit" || echo 000)
          say "  audit                          HTTP $AU (expect 200)"
          jq -r '"  verdict                        " + (.verdict // "-"),
                 "  probe positions                " + ((.positions // 0) | tostring),
                 "  of those in a strategy book    " + ((.in_strategy_book // 0) | tostring),
                 "  probe orders                   " + ((.orders // 0) | tostring),
                 "  probe fills                    " + ((.fills // 0) | tostring),
                 "  probe decisions                " + ((.decisions // 0) | tostring),
                 "  probe outcome rows             " + ((.outcomes // 0) | tostring),
                 "  probe valuations (not the proof) "
                   + ((.valuations // 0) | tostring),
                 "  positions in this database     " + ((.all_positions // 0) | tostring),
                 "  clean                          " + (.clean | tostring),
                 "  unreadable                     " + (.unreadable // "no")' \
            /tmp/prodaudit.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          jq -r '.books // {} | to_entries[]?
                 | "  BOOK " + (.key // "-") + "   positions " + (.value | tostring)' \
            /tmp/prodaudit.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Entry-run raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-run-evidence
          path: |
            /tmp/rep0.json
            /tmp/rep.json
            /tmp/vp.json
            /tmp/st.json
            /tmp/cal.json
            /tmp/cx.json
            /tmp/arm.json
            /tmp/ee.json
            /tmp/pnl.json
            /tmp/demo.json
            /tmp/desk.json
            /tmp/ee2.json
            /tmp/ctl0.json
            /tmp/sess.json
            /tmp/act.json
            /tmp/prodaudit.json
          if-no-files-found: warn
          retention-days: 14

  # OPERATOR CONTROL ACCESS. It lives in this workflow because GitHub
  # registers workflow_dispatch targets from the DEFAULT branch, and the
  # default branch is protected and auto-deploying -- so a brand-new file
  # on a feature branch cannot be dispatched at all. See the header of
  # the operator job's first step for what it does and does not expose.
  operator-access:
    if: ${{ inputs.operator_action != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Operator access
        shell: bash
        env:
          ACTION: ${{ inputs.operator_action }}
          SERVICE: ${{ inputs.operator_service }}
          API: ${{ inputs.api }}
          CONFIRM: ${{ inputs.operator_confirm }}
          OPERATOR_COMMIT: ${{ inputs.operator_commit }}
          RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          A="${API:-https://sportsassets-api.onrender.com}"

          # ── WHAT THIS RUN CAN AND CANNOT REACH, stated first ─────────
          if [ -z "${RENDER_KEY:-}" ]; then
            say "MISSING PERMISSION: the RENDER_API_KEY secret is not"
            say "available to this workflow, so the service environment"
            say "cannot be written. That is the exact missing permission:"
            say "a Render API key with write access to $SERVICE, exposed to"
            say "this repository as the RENDER_API_KEY Actions secret."
            say "Everything below that needs it is skipped."
          else
            echo "::add-mask::$RENDER_KEY"
          fi
          RAPI=https://api.render.com/v1
          rget() { curl -sS --max-time 45 -H "Authorization: Bearer $RENDER_KEY" \
                        -H "Accept: application/json" "$RAPI$1"; }
          svc_id() { rget "/services?name=$1&limit=20" \
                       | jq -r --arg n "$1" '.[]? | select(.service.name==$n) | .service.id' \
                       2>/dev/null | head -1; }

          say ""
          say "== S1 . IS OPERATOR CONTROL CONFIGURED RIGHT NOW =="
          # THE PROBE NEEDS NO SECRET: a deliberately wrong password tells
          # configured (401) from not-configured (503) without holding the
          # real one.
          PC=$(curl -sS -o /tmp/probe.json -w '%{http_code}' -X POST \
                 -H 'Content-Type: application/json' \
                 -d '{"password":"deliberately-not-the-operator-password"}' \
                 "$A/api/command/session/control" || echo 000)
          say "  wrong-password probe           HTTP $PC"
          jq -r '"  reason                         "
                   + ((.detail.reason // .reason) // "-")' \
            /tmp/probe.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$PC" = "401" ]; then
            say "  => CONFIGURED: the control sign-in is live and refusing"
            say "     a wrong password with a status."
          elif [ "$PC" = "503" ]; then
            say "  => NOT CONFIGURED: OPERATOR_PASSWORD is unset on the"
            say "     service, so the browser controls are unavailable."
          else
            say "  => UNEXPECTED: neither 401 nor 503. Nothing is assumed."
          fi

          if [ "$ACTION" != "rotate" ]; then
            say ""
            say "  status only; nothing was written."
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$CONFIRM" != "DO" ]; then
            say ""
            say "  refused: rotate needs confirm=DO (got '${CONFIRM}')"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "${RENDER_KEY:-}" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

          say ""
          say "== S2a . SUSPEND AUTO-DEPLOY *BEFORE* TOUCHING THE ENV =="
          say "  THE RACE THIS CLOSES. An env change makes Render create a"
          say "  deploy from the service's TRACKED branch -- here the"
          say "  protected default branch. Deploying the reviewed SHA"
          say "  afterwards does not prevent it: that build is already"
          say "  queued and can go live in the gap. So auto-deploy goes OFF"
          say "  FIRST, and this step FAILS CLOSED -- an unknown readback,"
          say "  an unexpected response or a failed read all stop the run"
          say "  BEFORE any secret is written."
          #
          # THE RELEASE SHA IS VALIDATED FIRST, before anything is mutated.
          case "${OPERATOR_COMMIT:-}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) : ;;
            *) say "  refused: operator_commit must be a full 40-hex sha"
               say "  (got '${OPERATOR_COMMIT:-}'). NOTHING has been changed."
               echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          say "  release sha                    ${OPERATOR_COMMIT:0:7} (validated)"
          ID=$(svc_id "$SERVICE")
          if [ -z "$ID" ]; then
            say "  no Render service named $SERVICE -- NOTHING changed"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          say "  service                        $SERVICE ($ID)"
          BEFORE=$(rget "/services/$ID" \
                   | jq -r '"autoDeploy=" + (.autoDeploy // "?")
                            + " branch=" + (.branch // "?")' 2>/dev/null \
                   || echo "unreadable")
          say "  before                         $BEFORE"
          AD=$(curl -sS --max-time 45 -o /tmp/ad.json -w '%{http_code}' \
                 -X PATCH -H "Authorization: Bearer $RENDER_KEY" \
                 -H "Accept: application/json" \
                 -H "Content-Type: application/json" \
                 -d '{"autoDeploy":"no"}' "$RAPI/services/$ID" || echo 000)
          say "  PATCH autoDeploy=no            HTTP $AD"
          # THE UPDATE MUST HAVE SUCCEEDED. Not "did not obviously fail".
          case "$AD" in
            2??) : ;;
            *) say "  the settings update did NOT succeed (HTTP $AD), so"
               say "  auto-deploy may still be on. NOTHING has been written."
               echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          # AND THE READ-BACK MUST BE AN EXPLICIT DISABLED VALUE. Anything
          # else -- empty, absent, a new spelling, an unreadable response --
          # is UNKNOWN and stops the run. The previous version stopped only
          # when it read the exact string "yes", so every one of those cases
          # fell through to the password write.
          RB=$(curl -sS --max-time 45 -o /tmp/svc.json -w '%{http_code}' \
                 -H "Authorization: Bearer $RENDER_KEY" \
                 -H "Accept: application/json" "$RAPI/services/$ID" \
               || echo 000)
          case "$RB" in
            2??) : ;;
            *) say "  could not read the service back (HTTP $RB). The state"
               say "  of auto-deploy is UNKNOWN, so the run stops here."
               echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          NOW_AD=$(jq -r 'if has("autoDeploy") then (.autoDeploy | tostring)
                          else "__ABSENT__" end' /tmp/svc.json 2>/dev/null \
                   || echo "__UNREADABLE__")
          DISABLED_VALUES="no false off No NO False FALSE Off OFF"
          CONFIRMED=no
          for want in $DISABLED_VALUES; do
            [ "$NOW_AD" = "$want" ] && CONFIRMED=yes
          done
          say "  read back                      autoDeploy='$NOW_AD'"
          say "  confirmed disabled             $CONFIRMED"
          if [ "$CONFIRMED" != "yes" ]; then
            say "  NOT CONFIRMED DISABLED. '$NOW_AD' is not one of the"
            say "  values this workflow accepts as off ($DISABLED_VALUES)."
            say "  An unknown state is treated as ENABLED. NOTHING has been"
            say "  written and no secret was mutated."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

          say ""
          say "== S2 . GENERATE ON THIS RUNNER, WRITE TO THE SERVICE =="
          # 30 bytes of urandom, base64, punctuation removed: ~160 bits
          # before trimming, ~130 after. Generated here, so it never was an
          # input and never was in a message.
          PW="$(openssl rand -base64 45 | tr -dc 'A-Za-z0-9' | cut -c1-32)"
          if [ "${#PW}" -lt 24 ]; then
            say "  refusing: generated password is too short (${#PW})"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "::add-mask::$PW"
          say "  generated                      ${#PW} characters, masked"
          SC=$(curl -sS --max-time 45 -o /tmp/set.json -w '%{http_code}' -X PUT \
                 -H "Authorization: Bearer $RENDER_KEY" \
                 -H "Accept: application/json" \
                 -H "Content-Type: application/json" \
                 -d "{\"value\":$(printf '%s' "$PW" | jq -Rs .)}" \
                 "$RAPI/services/$ID/env-vars/OPERATOR_PASSWORD" || echo 000)
          say "  PUT OPERATOR_PASSWORD          HTTP $SC (expect 200)"
          if [ "$SC" != "200" ]; then
            say "  the service environment was not written; nothing else ran"
            head -c 300 /tmp/set.json || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

          # ── THE READ CREDENTIAL, AND WHY IT IS ROTATED HERE TOO ────
          #
          # THE DEFECT THIS CLOSES, 2026-09-27. `config.Settings.desk_password`
          # shipped a default of "bt" -- a password published in this repository
          # -- and a production readback showed DESK_PASSWORD was NOT SET on the
          # service. So the credential actually in force for every protected
          # Command Centre READ was the published one, and anyone who read the
          # file could mint a desk token, a wall token and a COMMAND cookie.
          #
          # The code no longer offers that fallback (empty means refuse). But
          # removing the fallback without SETTING a value locks the legitimate
          # operator out, so the value is provisioned in the same guarded
          # sequence as the operator password -- after auto-deploy is suspended,
          # before the reviewed build goes back.
          DPW="$(openssl rand -base64 45 | tr -dc 'A-Za-z0-9' | cut -c1-32)"
          if [ "${#DPW}" -lt 24 ]; then
            say "  refusing: generated desk password is too short (${#DPW})"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "::add-mask::$DPW"
          say "  generated desk password        ${#DPW} characters, masked"
          DC=$(curl -sS --max-time 45 -o /tmp/setd.json -w '%{http_code}' -X PUT \
                 -H "Authorization: Bearer $RENDER_KEY" \
                 -H "Accept: application/json" \
                 -H "Content-Type: application/json" \
                 -d "{\"value\":$(printf '%s' "$DPW" | jq -Rs .)}" \
                 "$RAPI/services/$ID/env-vars/DESK_PASSWORD" || echo 000)
          say "  PUT DESK_PASSWORD              HTTP $DC (expect 200)"
          if [ "$DC" != "200" ]; then
            say "  DESK_PASSWORD was NOT written. The operator password above"
            say "  WAS. Auto-deploy is still suspended -- resolve before"
            say "  resuming, because the read sign-in is now unconfigured and"
            say "  the new build refuses it rather than falling back."
            head -c 300 /tmp/setd.json || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

          # ── REVOKE EVERY SESSION MINTED AGAINST THE OLD PASSWORD ───
          #
          # Rotating the password stops NEW sign-ins. Existing tokens survive up
          # to 12 h (desk) or 7 DAYS (wall) because they are HMACs keyed by
          # ADMIN_TOKEN, not by the password. Rotating ADMIN_TOKEN would revoke
          # them -- and would also break these verification workflows, which
          # present it as a GitHub secret.
          #
          # So SESSION_EPOCH is bumped instead: it is inside the signed material,
          # so every outstanding desk, wall and control token stops verifying at
          # once, with the signing key untouched. It is a COUNTER, NOT A SECRET,
          # so it is printed.
          EPOCH_BEFORE=$(rget "/services/$ID/env-vars?limit=100" \
            | jq -r '.[]? | .envVar | select(.key=="SESSION_EPOCH") | .value' \
            | head -1)
          # Absent, blank or non-numeric: the code defaults to "1", so the
          # first bump must land on something strictly different from it.
          NEXT=$(python3 -c 'import sys; r=sys.argv[1].strip(); print(int(r)+1 if r.lstrip("-").isdigit() else 2)' "${EPOCH_BEFORE:-}")
          say "  SESSION_EPOCH                  ${EPOCH_BEFORE:-<unset, treated as 1>} -> $NEXT"
          EC=$(curl -sS --max-time 45 -o /tmp/sete.json -w '%{http_code}' -X PUT \
                 -H "Authorization: Bearer $RENDER_KEY" \
                 -H "Accept: application/json" \
                 -H "Content-Type: application/json" \
                 -d "{\"value\":$(printf '%s' "$NEXT" | jq -Rs .)}" \
                 "$RAPI/services/$ID/env-vars/SESSION_EPOCH" || echo 000)
          say "  PUT SESSION_EPOCH              HTTP $EC (expect 200)"
          if [ "$EC" != "200" ]; then
            say "  THE EPOCH WAS NOT BUMPED, so sessions minted against the"
            say "  OLD password are still valid. Both passwords above WERE"
            say "  rotated. This is the state to resolve first."
            head -c 300 /tmp/sete.json || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          say "  => every outstanding desk, wall and control session is now"
          say "     invalid. The signing key was NOT rotated, so these"
          say "     verification workflows keep working."
          say ""
          say "== S2b . PUT THE REVIEWED BUILD BACK, DELIBERATELY =="
          say "  Deploying the reviewed commit AFTERWARDS is not enough: the"
          say "  tracked-branch deploy is created by the env write itself and"
          say "  can go live in the gap. Auto-deploy was suspended BEFORE the"
          say "  write (S2a), so no such deploy was ever created."
          DC=$(curl -sS --max-time 45 -o /tmp/dep.json -w '%{http_code}' \
                 -X POST -H "Authorization: Bearer $RENDER_KEY" \
                 -H "Accept: application/json" \
                 -H "Content-Type: application/json" \
                 -d "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$OPERATOR_COMMIT\"}" \
                 "$RAPI/services/$ID/deploys" || echo 000)
          say "  deploy ${OPERATOR_COMMIT:0:7} by id        HTTP $DC (expect 2xx)"
          jq -r '"  deploy                         " + (.id // "?")
                 + "  status " + (.status // "?")' \
            /tmp/dep.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          case "$DC" in 2??) : ;; *)
            say "  Render refused the deploy; the env var is written and the"
            say "  serving build is NOT the reviewed one. Nothing verified."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac

          say ""
          say "== S3 . WAIT UNTIL THE REVIEWED BUILD IS SERVING =="
          say "  Two conditions, not one: the reviewed SHA must be what"
          say "  answers /api/health, AND the control sign-in must refuse a"
          say "  wrong password with 401 rather than 503."
          for i in $(seq 1 60); do
            # ── TWO DEFECTS FIXED HERE (2026-09-28) ────────────────────
            #
            # FOUND BY INVESTIGATING WHY THIS LOOP COST 10 MINUTES AND
            # CONFIRMED NOTHING on the c3d0cfc release. It ran its full 60
            # iterations, never matched, and fell through SILENTLY -- there
            # is no failure branch. The release was confirmed by S3b's
            # Render deploy list and by the sign-in actually working, so the
            # one step whose job is to prove serving-SHA identity was inert.
            #
            #   1 IT POLLED AN ENDPOINT THAT DOES NOT EXIST. The service
            #     publishes `/healthz` and `/api/health/services`. There is
            #     no `/api/health`, so every poll took a 404 and `jq` read
            #     "?" sixty times.
            #
            #   2 THE COMPARISON WAS INVERTED. `/healthz` reports
            #     `commit: RENDER_GIT_COMMIT[:7]` -- SEVEN characters --
            #     while `case "$SERVING" in "$OPERATOR_COMMIT"*)` requires
            #     the SERVED value to begin with the full 40-hex SHA. A
            #     7-char prefix can never satisfy that, so the check would
            #     have failed even against the right URL.
            #
            # Now: the real endpoint, and the full SHA must begin with the
            # served prefix -- the direction that is true when a short
            # commit identifies a long one. The served value is required to
            # be non-empty and at least 7 characters, so "?" or "" cannot
            # accidentally prefix-match.
            SERVING=$(curl -sS --max-time 20 "$A/healthz" 2>/dev/null \
                      | jq -r '.commit // .build // .sha // ""' 2>/dev/null \
                      || echo "")
            if [ "${#SERVING}" -ge 7 ]; then
              case "$OPERATOR_COMMIT" in
                "$SERVING"*) say "  serving $SERVING after $((i*10))s (matches ${OPERATOR_COMMIT:0:7})"
                             SHA_CONFIRMED=yes; break ;;
              esac
            fi
            sleep 10
          done
          # ── THE TERMINAL CONDITION. IT FAILS THE JOB. ───────────────
          #
          # A WARNING WAS NOT ENOUGH, AND THAT WAS MY ERROR (2026-09-28).
          # My first repair printed a warning here and let the job continue,
          # on the reasoning that S3b independently reads the live commit
          # from Render and fails closed. The reasoning was true and the
          # conclusion was wrong: a step whose stated purpose is to prove
          # serving-SHA identity must not report SUCCESS when it has
          # proved nothing. Leaving it non-fatal keeps the exact property
          # that made the original defect invisible -- the job's exit
          # status stops depending on whether this check worked.
          #
          # THE TWO SOURCES ARE NOT INTERCHANGEABLE, WHICH IS WHY BOTH
          # MUST PASS. Render's deploy list says what the platform believes
          # it LAUNCHED. `/healthz` says what the process actually
          # IMPORTED. A container serving stale code under a live deploy
          # satisfies the first and fails the second, and that is precisely
          # the condition a release check exists to catch. So an expired
          # wait is a FAILURE here, independently of S3b.
          #
          # The comparison itself is `sportsassets.serving_sha`, which
          # validates the format explicitly and returns a NAMED refusal for
          # a 404, an unreadable body, a truncated value, a wrong build and
          # an expired wait. Those five are distinct conditions and its
          # tests hold them apart; a `case` statement in a 400 KB workflow
          # could not be tested at all.
          if [ "${SHA_CONFIRMED:-no}" != "yes" ]; then
            say "  ✗ /healthz never reported the reviewed SHA within $((60*10))s."
            say "    Last value read: '${SERVING:-<empty>}'"
            say "    Expected:        $OPERATOR_COMMIT"
            PYTHONPATH=backend python3 -m sportsassets.serving_sha \
              "$OPERATOR_COMMIT" "${SERVING:-}" "${LIVE_FULL_SHA:-}" || true
            say "    THIS FAILS THE JOB. The process-side readback is the"
            say "    only check that can see a container serving stale code"
            say "    under a live deploy, so an unconfirmed result here is"
            say "    not covered by S3b and must not be reported as a"
            say "    verified release."
            exit 1
          fi
          # The wrong-password probe flipping 503 -> 401 is the signal, and
          # it needs no secret. Bounded wait.
          OK=no
          for i in $(seq 1 40); do
            sleep 15
            P=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' \
                  -d '{"password":"deliberately-not-the-operator-password"}' \
                  "$A/api/command/session/control" || echo 000)
            if [ "$P" = "401" ]; then OK=yes; say "  live after $((i*15))s (probe HTTP 401)"; break; fi
          done
          if [ "$OK" != "yes" ]; then
            say "  the probe never reached 401; the change may still be"
            say "  deploying. Nothing below was verified."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

          say ""
          say "== S3b . NO PENDING DEPLOY CAN REPLACE THE REVIEWED SHA =="
          say "  Checked, not assumed: every deploy Render is holding is"
          say "  listed, and any that is live-or-queued for a DIFFERENT"
          say "  commit is a failure of this step."
          DEPS_HTTP=$(curl -sS --max-time 45 -o /tmp/deps.json \
                        -w '%{http_code}' \
                        -H "Authorization: Bearer $RENDER_KEY" \
                        -H "Accept: application/json" \
                        "$RAPI/services/$ID/deploys?limit=10" || echo 000)
          say "  deploy list                    HTTP $DEPS_HTTP"
          # THE CHECK MUST SUCCEED TO COUNT. A failed read is not "no
          # pending deploys"; it is no answer.
          case "$DEPS_HTTP" in
            2??) : ;;
            *) say "  could not list deploys, so whether one is queued is"
               say "  UNKNOWN. This run does not call the build safe."
               echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac
          jq -r '.[]? | .deploy
                 | "  " + (.status // "?") + "  " + ((.commit.id // "?")[0:7])
                   + "  " + (.createdAt // "?")' /tmp/deps.json \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          PENDING=$(jq -r --arg c "$OPERATOR_COMMIT" '[.[]? | .deploy
                      | select((.status // "") | test("build_in_progress|created|queued|update_in_progress|pre_deploy_in_progress"))
                      | select((.commit.id // "") != $c)] | length' \
                    /tmp/deps.json 2>/dev/null || echo "?")
          say "  pending deploys for another commit: $PENDING (expect 0)"
          if [ "$PENDING" = "?" ] || [ -z "$PENDING" ]; then
            say "  the deploy list could not be PARSED, so the answer is"
            say "  UNKNOWN. Stopping rather than assuming zero."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ "$PENDING" != "0" ]; then
            say "  A DEPLOY OF ANOTHER COMMIT IS IN FLIGHT. The reviewed"
            say "  build could be replaced; this run does not call it safe."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          say "  autoDeploy is still            $(rget "/services/$ID" | jq -r '.autoDeploy // "?"')"
          say "  (left OFF deliberately: auto-deploy from the protected"
          say "   default branch is the hazard this step exists to close."
          say "   Releases go out by commit id through render-ops.)"

          say ""
          say "== S4 . ORDINARY PASSWORD SIGN-IN, THEN A REAL CONTROL =="
          say "  This is the test that matters: the PASSWORD mints the"
          say "  session, and an admin-minted read cookie is not that test."
          J=/tmp/opjar.txt; rm -f "$J"
          SI=$(curl -sS -o /tmp/si.json -c "$J" -w '%{http_code}' -X POST \
                 -H 'Content-Type: application/json' \
                 -d "{\"password\":$(printf '%s' "$PW" | jq -Rs .)}" \
                 "$A/api/command/session/control" || echo 000)
          say "  password sign-in               HTTP $SI (expect 200)"
          jq -r '"  scope                          " + (.scope // "-"),
                 "  cookie                         " + (.cookie // "-"),
                 "  token in body                  "
                   + ((.token_in_body // false) | tostring),
                 "  ttl_s                          "
                   + ((.ttl_s // 0) | tostring)' \
            /tmp/si.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          # THIS STEP IS THE DELIVERABLE, SO IT FAILS CLOSED.
          #
          # It used to REPORT a bad sign-in and carry on, so the run could
          # finish green while the password was not accepted -- the same
          # fail-open shape corrected in S2a, in the one step whose whole
          # purpose is to prove operator access works.
          if [ "$SI" != "200" ]; then
            say "  SIGN-IN DID NOT SUCCEED. The credential is configured but"
            say "  the ordinary password route did not accept it, so operator"
            say "  access is NOT verified by this run."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if grep -q 'bt_control' "$J"; then
            say "  the jar holds bt_control       yes"
          else
            say "  the jar holds bt_control       NO -- nothing was set, so"
            say "  there is no operator session to exercise."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          # AND THE SCOPE IN THE MINTED SESSION IS THE CONTROL SCOPE, not a
          # read scope that happens to carry the same cookie name.
          SC=$(jq -r '.scope // "__ABSENT__"' /tmp/si.json 2>/dev/null \
               || echo "__UNREADABLE__")
          if [ "$SC" != "control" ]; then
            say "  the minted scope is '$SC', not 'control'. A read session"
            say "  is not the thing this step exists to verify."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

          # AN AUTHORISED SHADOW CONTROL ACTION, with its effect read back.
          # pause, then resume: the research lane is left exactly as found.
          PA=$(curl -sS -o /tmp/pa.json -w '%{http_code}' -X POST -b "$J" \
                 -H 'Content-Type: application/json' -d '{"by":"OPERATOR_ACCESS_CI"}' \
                 "$A/api/command/bettor/control/pause" || echo 000)
          say "  pause with the OPERATOR cookie HTTP $PA (expect 200)"
          jq -r '"  ok                             " + ((.ok // false) | tostring),
                 "  applied (read back)            "
                   + ((.applied // "nothing") | tostring),
                 "  armed_confirmed                "
                   + ((.armed_confirmed // false) | tostring),
                 "  research lane now             "
                   + ((.state_after.research_lane_armed.value // false) | tostring)' \
            /tmp/pa.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          RE=$(curl -sS -o /tmp/re.json -w '%{http_code}' -X POST -b "$J" \
                 -H 'Content-Type: application/json' -d '{"by":"OPERATOR_ACCESS_CI"}' \
                 "$A/api/command/bettor/control/resume" || echo 000)
          say "  resume with the same cookie    HTTP $RE (expect 200)"
          jq -r '"  ok                             " + ((.ok // false) | tostring),
                 "  armed_confirmed                "
                   + ((.armed_confirmed // false) | tostring),
                 "  scope                          " + (.scope // "-"),
                 "  funded submission              " + (.funded_submission // "-")' \
            /tmp/re.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          # THE CONTROL ACTION HAD TO ACTUALLY WORK, both ways. A pause that
          # did not take, or a resume that failed, would leave the research
          # lane in a state this run did not intend AND would be reported as
          # a pass.
          if [ "$PA" != "200" ] || [ "$RE" != "200" ]; then
            say "  THE CONTROL ACTION DID NOT COMPLETE (pause $PA, resume"
            say "  $RE). An authorised shadow control is NOT demonstrated,"
            say "  and the lane may be left paused -- check it."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

          # AND THE SCOPE IS STILL NARROW: the control cookie must not open
          # an /api/admin route.
          AD=$(curl -sS -o /dev/null -w '%{http_code}' -b "$J" \
                 "$A/api/admin/funded-activation-readiness" || echo 000)
          say "  the control cookie on /api/admin HTTP $AD (expect 401/403)"
          # A CONTROL COOKIE THAT OPENS AN ADMIN ROUTE IS THE FAILURE THIS
          # PROBE EXISTS TO CATCH, so it fails the run rather than printing
          # the surprising number and continuing.
          case "$AD" in
            401|403) : ;;
            *) say "  THE CONTROL COOKIE REACHED AN ADMIN ROUTE (HTTP $AD)."
               say "  The operator scope is not narrow. This is a failure."
               echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac

          say ""
          say "== S4b . THE READ CREDENTIAL, VERIFIED THE SAME WAY =="
          say "  S4 proves the OPERATOR password mints a control session."
          say "  It says nothing about the DESK password, which is what"
          say "  gates every Command Centre READ -- and a production"
          say "  readback showed /healthz reporting"
          say "    auth_not_configured: [\"desk_password\"]"
          say "  so the page served, was correctly gated, and would have"
          say "  rejected every sign-in. Writing the value is not the same"
          say "  as verifying it, so this step signs in with it."
          DJ=/tmp/deskjar.txt; rm -f "$DJ"
          DS=$(curl -sS -o /tmp/du.json -c "$DJ" -w '%{http_code}' -X POST \
                 -H 'Content-Type: application/json' \
                 -d "{\"password\":$(printf '%s' "$DPW" | jq -Rs .)}" \
                 "$A/api/desk/unlock" || echo 000)
          say "  desk password sign-in          HTTP $DS (expect 200)"
          # THE BODY'S VERDICT, NEVER ITS TOKEN. `/api/desk/unlock` answers
          # 200 with {"ok": false} on a wrong password, so the status code
          # alone would pass on a rejection.
          DOK=$(jq -r '(.ok // false) | tostring' /tmp/du.json 2>/dev/null \
                || echo "unreadable")
          DTOK=$(jq -r '.token // ""' /tmp/du.json 2>/dev/null || echo "")
          [ -n "$DTOK" ] && echo "::add-mask::$DTOK"
          say "  body ok                        $DOK (expect true)"
          say "  token returned                 ${#DTOK} characters, masked"
          jq -r '"  expires_at                     "
                 + ((.expires_at // 0) | tostring)' /tmp/du.json \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$DS" != "200" ] || [ "$DOK" != "true" ] || [ -z "$DTOK" ]; then
            say "  THE DESK SIGN-IN DID NOT SUCCEED. The value is written but"
            say "  the read route did not accept it, so Command Centre access"
            say "  is NOT verified. Note /api/desk/unlock answers 200 with"
            say "  ok:false on a wrong password, which is why the body is"
            say "  checked and not only the status."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          # AND THE TOKEN MUST ACTUALLY OPEN A DESK-GATED READ. A mint that
          # authorises nothing is not access.
          DR=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -H "X-Desk-Token: $DTOK" "$A/api/wall/state" || echo 000)
          say "  the token on a desk-gated read HTTP $DR (expect 200)"
          if [ "$DR" != "200" ]; then
            say "  THE MINTED DESK TOKEN DID NOT AUTHORISE A DESK-GATED"
            say "  READ. A token that opens nothing is not access."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          # A WRONG PASSWORD MUST STILL BE REFUSED. Otherwise the two checks
          # above would also pass on a route that accepts anything.
          DW=$(curl -sS -o /tmp/dw.json -w '%{http_code}' -X POST \
                 -H 'Content-Type: application/json' \
                 -d '{"password":"deliberately-not-the-desk-password"}' \
                 "$A/api/desk/unlock" || echo 000)
          DWOK=$(jq -r '(.ok // false) | tostring' /tmp/dw.json 2>/dev/null \
                 || echo "unreadable")
          say "  a WRONG desk password          HTTP $DW ok=$DWOK (expect ok=false)"
          if [ "$DWOK" != "false" ]; then
            say "  A WRONG PASSWORD WAS NOT REFUSED. The sign-in above"
            say "  therefore proves nothing about the credential."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          # AND THE SERVICE'S OWN POSTURE MUST NOW AGREE. This is the field
          # that reported the problem in the first place.
          PH=$(curl -sS --max-time 20 "$A/healthz" 2>/dev/null || echo '{}')
          say "  healthz auth_all_configured    $(printf '%s' "$PH" | jq -r '.auth_all_configured // "?"') (expect true)"
          say "  healthz auth_not_configured    $(printf '%s' "$PH" | jq -c '.auth_not_configured // "?"')"
          ALLC=$(printf '%s' "$PH" | jq -r '(.auth_all_configured // false) | tostring' 2>/dev/null || echo "unreadable")
          if [ "$ALLC" != "true" ]; then
            say "  THE SERVICE STILL REPORTS A CREDENTIAL UNCONFIGURED."
            say "  The sign-ins above succeeded, so this is a DIFFERENT"
            say "  setting than the two rotated here. Named, not skipped."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          say "  => the Command Centre is USABLE: the read sign-in works,"
          say "     the minted token opens a gated read, a wrong password is"
          say "     refused, and the service agrees nothing is unconfigured."

          say ""
          say "== S5 . DELIVERY =="
          printf 'OPERATOR_PASSWORD=%s\n' "$PW" > /tmp/operator-password.txt
          printf 'DESK_PASSWORD=%s\n' "$DPW" >> /tmp/operator-password.txt
          say "  the password is in the run artifact 'operator-credential',"
          say "  one line, nothing else. It is masked in every log line of"
          say "  this run and was never a workflow input."
          say "  Rotate by running this workflow again with action=rotate;"
          say "  the old value stops working the moment the new one serves."
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Deliver the credential
        if: ${{ inputs.operator_action == 'rotate' && inputs.operator_confirm == 'DO' }}
        uses: actions/upload-artifact@v4
        with:
          name: operator-credential
          path: /tmp/operator-password.txt
          retention-days: 1
          if-no-files-found: warn

  # ── THE FUNDED READBACK, FROM THE SERVING PROCESS ──────────────────
  #
  # WHY IT IS A SEPARATE JOB. The `verify` job above is twenty-six steps of
  # shadow-lane acceptance and takes most of an hour; a release readback that
  # has to be quoted in a handoff must be readable on its own, and must not
  # be reported as passing because a step nineteen places away passed.
  #
  # WHAT IT ESTABLISHES, and nothing beyond it: which build is serving, what
  # every submission switch is set to IN THAT PROCESS, what the funded
  # command-centre section actually says, what the last COMPLETED scheduled
  # cycle did and what actually blocked it, and that the demonstration books
  # are labelled and are not summed into any strategy total.
  #
  # WHAT IT IS NOT. It is not a funded trade, not an order, not a venue
  # interaction, and not evidence about the market. Every call below is a GET
  # behind the command role.
  funded-readback:
    if: ${{ inputs.funded_readback != '' }}
    runs-on: ubuntu-latest
    steps:
      # THE SOURCE IS ON DISK FOR ONE REASON: S6 reads the read-session
      # password's DEFAULT out of `config.py` rather than retyping it here, so
      # this step cannot drift from what the service would accept. Every other
      # step in this job is an HTTP call and needs nothing checked out.
      - uses: actions/checkout@v4
      - name: S1 · The serving build
        id: build
        env:
          API: ${{ inputs.api }}
          EXPECT: ${{ inputs.expect_commit }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### S1 · the serving build' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          code=000
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/hz.json -w '%{http_code}' --max-time 60 \
                   "$API/healthz")
            say "GET /healthz                   HTTP $code  (attempt $attempt)"
            [ "$code" = "200" ] && break
            say "  not serving yet; waiting 20 s."
            sleep 20
          done
          [ "$code" = "200" ] || { say "the service did not answer; nothing below is a readback"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          jq -r '"  serving commit               " + (.commit|tostring),
                 "  db reachable                 " + (.db_ok|tostring),
                 "  boot id                      " + (.boot_id|tostring),
                 "  uptime_s                     " + (.uptime_s|tostring)' \
            /tmp/hz.json | tee -a "$GITHUB_STEP_SUMMARY"
          GOT=$(jq -r '.commit' /tmp/hz.json)
          if [ -n "${EXPECT:-}" ]; then
            SHORT=$(printf '%s' "$EXPECT" | cut -c1-7)
            if [ "$GOT" = "$SHORT" ]; then
              say "  => SERVING THE EXPECTED BUILD ($SHORT)"
            else
              say "  => NOT the expected build: expected $SHORT, serving $GOT"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: S2 · Every submission switch, as the serving process reports it
        env:
          API: ${{ inputs.api }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          echo '### S2 · the submission switches, in the serving process' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            say "SKIPPED: no ADMIN_TOKEN secret, so the authenticated read is unavailable from here"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          # THE STATUS CLASSES ARE NOT THE SAME ANSWER, and the first version of
          # this step called a 502 "the command role was not accepted" -- a
          # statement about our credential when the service had simply not
          # finished booting. A freshly deployed instance is also mid
          # catalogue-sweep at over a gigabyte of RSS, and this read assembles
          # every section, so it is the one read that deserves a retry.
          code=000
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/desk.json -w '%{http_code}' --max-time 120 \
                   -H "X-Admin-Token: $ADMIN_TOKEN" \
                   "$API/api/command/bettor/desk" || echo 000)
            say "GET /api/command/bettor/desk   HTTP $code  (attempt $attempt)"
            case "$code" in
              200) break ;;
              401|403)
                say "  the command role was REFUSED with $code. That is an"
                say "  authorization answer, not a service one, and retrying"
                say "  cannot change it."
                echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
              5*|000)
                say "  the service did not serve this read. Waiting 25 s."
                sleep 25 ;;
              *)
                say "  unexpected status; waiting 25 s."
                sleep 25 ;;
            esac
          done
          if [ "$code" != "200" ]; then
            say "  five attempts, last status $code. The service is not"
            say "  serving the command read, so there is no readback to quote."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          cp /tmp/desk.json /tmp/desk.keep.json
          say ""
          say "-- the entry lane (adding funded exposure) --"
          jq -r '.funded_book.entry_lane_disablements[]
                 | "  \(.n). \(.what)  =  \(.value|tostring)"
                   + "\n      where       \(.where)"
                   + "\n      cleared by  \(.cleared_by)"' /tmp/desk.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "-- the servicing lane (exits and cancels on what is held) --"
          jq -r '.funded_book.servicing_lane_disablements[]
                 | "  \(.n). \(.what)  =  \(.value|tostring)"
                   + "\n      where       \(.where)"
                   + "\n      cleared by  \(.cleared_by)"' /tmp/desk.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          jq -r '"  activation.funded_submission   " + (.activation.funded_submission|tostring)' \
            /tmp/desk.json | tee -a "$GITHUB_STEP_SUMMARY"
          # THE ASSERTION, not the eyeball: no boolean switch in either lane
          # may be true. A non-boolean value (the process-bound execution gate,
          # an absent credential) is reported as its own line above and is not
          # asserted here, because "bound per process" is not a flag.
          TRUES=$(jq '[ (.funded_book.entry_lane_disablements
                         + .funded_book.servicing_lane_disablements)[]
                        | select(.value == true) ] | length' /tmp/desk.json)
          say ""
          if [ "$TRUES" = "0" ]; then
            say "  => EVERY BOOLEAN SUBMISSION SWITCH IS FALSE in the serving process."
          else
            say "  => $TRUES SWITCH(ES) ARE TRUE. This build can submit. FAILING."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          SUB=$(jq -r '.activation.funded_submission' /tmp/desk.json)
          [ "$SUB" = "DISABLED" ] || { say "  => activation reports funded_submission=$SUB. FAILING."; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: S3 · The funded command-centre section, in full
        env:
          API: ${{ inputs.api }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          echo '### S3 · the funded book, as the command centre serves it' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          [ -s /tmp/desk.keep.json ] || { say "S2 left no desk read"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          jq -r '.funded_book
                 | "  section                        " + (.section|tostring),
                   "  label                          " + (.label|tostring),
                   "  books                          " + (.book_count|tostring),
                   "  counts_toward_strategy_perf.   " + (.counts_toward_strategy_performance|tostring),
                   "  unresolved discrepancies       " + (.unresolved_discrepancy_count|tostring),
                   "  error (if the read failed)     " + ((.error // "none")|tostring)' \
            /tmp/desk.keep.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "-- one book per account and venue, with its own exposure and P&L --"
          jq -r 'if (.funded_book.books | length) == 0
                 then "  (no funded intent exists at any account or venue)"
                 else (.funded_book.books[]
                   | "  \(.account_id) @ \(.venue)  intents=\(.intents)"
                     + "\n      exposure   \(.exposure|tostring)"
                     + "\n      pnl        \(.pnl|tostring)") end' \
            /tmp/desk.keep.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "-- every unresolved discrepancy, as a list and not a total --"
          jq -r 'if (.funded_book.unresolved_discrepancies | length) == 0
                 then "  (none recorded)"
                 else (.funded_book.unresolved_discrepancies[]
                   | "  \(.kind)  intent=\(.intent_id // "-")") end' \
            /tmp/desk.keep.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          jq -r '"  servicing_outlives_entry:", ("    " + (.funded_book.servicing_outlives_entry|tostring)),
                 "  is_not_summed_with:", ("    " + (.funded_book.is_not_summed_with|join(", ")))' \
            /tmp/desk.keep.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: S4 · The last completed scheduled cycle, and what actually blocked it
        env:
          API: ${{ inputs.api }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          echo '### S4 · one completed scheduled cycle, and its actual blockers' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # SAME TREATMENT AS THE DESK READ, and for the same reason: this is
          # a heavy authenticated read against an instance that may still be
          # sweeping the venue catalogue. `|| echo 000` is gone -- curl already
          # writes 000 into %{http_code} on a timeout, so the two together
          # printed "000000", a status that does not exist.
          code=000
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/st.json -w '%{http_code}' --max-time 120 \
                   -H "X-Admin-Token: $ADMIN_TOKEN" \
                   "$API/api/command/rn1x/statuses")
            say "GET /api/command/rn1x/statuses HTTP $code  (attempt $attempt)"
            case "$code" in
              200) break ;;
              401|403)
                say "  the command role was REFUSED with $code; retrying cannot change that."
                echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
              *) say "  the service did not serve this read. Waiting 25 s."; sleep 25 ;;
            esac
          done
          if [ "$code" != "200" ]; then
            say "five attempts, last status $code. No status read, so the cycle cannot be quoted."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          say ""
          say "-- the scheduled lane's own heartbeat (the process that cycles) --"
          jq -r '.statuses.external_valuation.last_cycle
                 | "  writer                 " + ((.writer // "none")|tostring),
                   "  reported_at            " + ((.at // "none")|tostring),
                   "  state                  " + ((.state // "none")|tostring),
                   "  markets_considered     " + ((.markets_considered // "none")|tostring),
                   "  evaluated              " + ((.evaluated // "none")|tostring),
                   "  written                " + ((.written // "none")|tostring),
                   "  elapsed_s              " + ((.elapsed_s // "none")|tostring)' \
            /tmp/st.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "-- THE ACTUAL BLOCKERS: every refusal counter this cycle recorded --"
          jq -r '((.statuses.external_valuation.last_cycle.refusals // {})
                  | to_entries | map(select(.value != 0 and .value != null)))
                 | if length == 0 then "  (no refusal counter fired)"
                   else (.[] | "  \(.key)   \(.value)") end' \
            /tmp/st.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          jq -r '((.statuses.external_valuation.last_cycle.venue_errors // [])
                 | if length == 0 then "  venue_errors: none"
                   else (.[] | "  venue_error: " + (.|tostring)) end)' \
            /tmp/st.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "-- what the same cycle's SERVICING pass had to work with --"
          say "   cycle() runs _funded_service FIRST, before the entry lane's"
          say "   stop, table and credential gates, so none of the refusals"
          say "   above can stop the funded book being serviced. It returns"
          say "   not-configured when no funded account is BOUND, and the"
          say "   heartbeat row persists the ENTRY lane's tally only, so the"
          say "   servicing result is not in it. Its precondition is read"
          say "   directly instead:"
          code=$(curl -s -o /tmp/fr.json -w '%{http_code}' --max-time 120 \
                 -H "X-Admin-Token: $ADMIN_TOKEN" \
                 "$API/api/admin/funded-activation-readiness")
          say "   GET /api/admin/funded-activation-readiness  HTTP $code"
          if [ "$code" = "200" ]; then
            jq -r '"   bound funded account   "
                     + ((.bound_account.account_id // "NONE BOUND")|tostring),
                   "   bound venue            "
                     + ((.bound_account.venue // "none")|tostring),
                   "   readiness.ready        "
                     + ((.readiness.ready // "unknown")|tostring)' \
              /tmp/fr.json | tee -a "$GITHUB_STEP_SUMMARY"
            jq -r '"   unmet checks           "
                     + (((.readiness.unmet // []) | length)|tostring)' \
              /tmp/fr.json | tee -a "$GITHUB_STEP_SUMMARY"
            jq -r '((.readiness.unmet // [])
                   | if length == 0 then "     (none)"
                     else (.[] | "     - "
                       + ((if type == "object" then (.check // .) else . end)
                          |tostring)) end)' \
              /tmp/fr.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            say "   the admin role did not serve it from here"
          fi
          say ""
          say "-- and the same question from the command centre's own panel --"
          jq -r '"  activation.readiness.ready     " + ((.activation.readiness.ready // "unknown")|tostring),
                 "  unmet prerequisites            " + (((.activation.unmet_prerequisites // []) | length)|tostring)' \
            /tmp/desk.keep.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '((.activation.unmet_prerequisites // [])
                 | if length == 0 then "  (none)" else (.[] | "    - " + (.|tostring)) end)' \
            /tmp/desk.keep.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: S5 · The demonstration books are labelled, and are not summed
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### S5 · the demonstration, separately and plainly labelled' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.demonstration
                 | "  section                        " + (.section|tostring),
                   "  label                          " + (.label|tostring),
                   "  experiment_id                  " + (.experiment_id|tostring),
                   "  counts_toward_strategy_perf.   " + (.counts_toward_strategy_performance|tostring),
                   "  inputs_are_chosen_not_observed " + (.inputs_are_chosen_not_observed|tostring)' \
            /tmp/desk.keep.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "-- every position book, and whether it is strategy performance --"
          jq -r '.positions.books | to_entries[]
                 | "  \(.key)  count=\(.value.count)  counts_toward_strategy_performance=\(.value.counts_toward_strategy_performance)"' \
            /tmp/desk.keep.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          COUNTED=$(jq -r '[ .positions.books | to_entries[]
                             | select(.value.counts_toward_strategy_performance == true)
                             | .key ] | join(", ")' /tmp/desk.keep.json)
          say "  the ONLY book flagged as strategy performance: ${COUNTED:-none}"
          DEMO=$(jq -r '.demonstration.counts_toward_strategy_performance' /tmp/desk.keep.json)
          [ "$DEMO" = "false" ] || { say "  => the demonstration claims to count toward performance. FAILING."; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          say "  => the demonstration is published in full, labelled, and excluded."
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: S6 · Operator sign-in and an authenticated desk read
        env:
          API: ${{ inputs.api }}
          RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ inputs.operator_service }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### S6 · the credentials actually work, not merely refuse' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # WHY THIS EXISTS. The operator-access job probes with a DELIBERATELY
          # WRONG password and reads 401. That establishes that the sign-in is
          # configured and rejects -- it does not establish that anybody can get
          # in. This step signs in with the EXISTING credentials and then reads
          # the desk with the resulting session cookie alone.
          #
          # NO CREDENTIAL IS PRINTED, TYPED AS AN INPUT, OR WRITTEN. The values
          # are read from the service environment through the Render API, masked
          # before use, held in a cookie jar in the runner's temp space, and
          # never echoed. Nothing is rotated and nothing is set.
          if [ -z "${RENDER_KEY:-}" ]; then
            say "SKIPPED: no RENDER_API_KEY, so the existing credentials cannot"
            say "be read from the service environment from here. A successful"
            say "sign-in is therefore NOT established by this run."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "::add-mask::$RENDER_KEY"
          RAPI=https://api.render.com/v1
          rget() { curl -sS --max-time 45 -H "Authorization: Bearer $RENDER_KEY" \
                        -H "Accept: application/json" "$RAPI$1"; }
          ID=$(rget "/services?name=${SERVICE:-sportsassets-api}&limit=20" \
               | jq -r --arg n "${SERVICE:-sportsassets-api}" \
                    '.[]? | select(.service.name==$n) | .service.id' | head -1)
          [ -n "$ID" ] || { say "no service named ${SERVICE:-sportsassets-api}"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          rget "/services/$ID/env-vars?limit=100" > /tmp/ev.json
          OPW=$(jq -r '.[]? | .envVar | select(.key=="OPERATOR_PASSWORD") | .value' /tmp/ev.json | head -1)
          DPW=$(jq -r '.[]? | .envVar | select(.key=="DESK_PASSWORD") | .value' /tmp/ev.json | head -1)
          rm -f /tmp/ev.json
          [ -n "$OPW" ] && echo "::add-mask::$OPW"
          [ -n "$DPW" ] && echo "::add-mask::$DPW"
          say "OPERATOR_PASSWORD present in the service environment   $([ -n "$OPW" ] && echo yes || echo NO)"
          say "DESK_PASSWORD present in the service environment       $([ -n "$DPW" ] && echo yes || echo NO)"

          FAIL=0
          # ── 1 . THE CONTROL SIGN-IN, WITH THE RIGHT PASSWORD ─────────
          if [ -n "$OPW" ]; then
            code=$(curl -sS -o /tmp/ctl.json -w '%{http_code}' --max-time 60 \
                   -c /tmp/ctl.jar -X POST -H 'Content-Type: application/json' \
                   --data "$(jq -nc --arg p "$OPW" '{password:$p}')" \
                   "$API/api/command/session/control")
            say ""
            say "POST /api/command/session/control (correct password)  HTTP $code"
            if [ "$code" = "200" ]; then
              jq -r '"  scope                        " + (.scope|tostring),
                     "  cookie                       " + (.cookie|tostring),
                     "  token_in_body                " + (.token_in_body|tostring),
                     "  ttl_s                        " + (.ttl_s|tostring),
                     "  opens                        " + (.opens|tostring)' \
                /tmp/ctl.json | tee -a "$GITHUB_STEP_SUMMARY"
              grep -qi "bt_control\|control" /tmp/ctl.jar \
                && say "  => a CONTROL cookie was set in the jar" \
                || { say "  => 200 but NO cookie was set"; FAIL=1; }
            else
              say "  => the operator password in the service environment was"
              say "     NOT accepted by the serving build. Sign-in unproven."
              FAIL=1
            fi
          else
            say "  => OPERATOR_PASSWORD is not set, so the control sign-in"
            say "     cannot be exercised at all."
            FAIL=1
          fi

          # ── 2 . THE READ CREDENTIAL ACTUALLY IN FORCE ────────────────
          #
          # `DESK_PASSWORD` unset does NOT mean the read sign-in is closed:
          # `config.Settings.desk_password` carries a default, and
          # `/api/command/session` accepts it. So when the env var is absent the
          # credential in force is that default -- which is published in this
          # repository -- and the honest readback is to sign in with it AND say
          # so, rather than to report "not configured" and move on. It is read
          # out of the checked-out source here instead of being retyped, so this
          # step cannot drift from what the service would accept.
          DEFAULTED=no
          if [ -z "$DPW" ]; then
            DPW=$(python3 - <<'PYX'
          import re, pathlib
          src = pathlib.Path("backend/sportsassets/config.py").read_text()
          m = re.search(r'^\s*desk_password:\s*str\s*=\s*"([^"]*)"', src, re.M)
          print(m.group(1) if m else "")
          PYX
          )
            DEFAULTED=yes
            say ""
            say "  !! DESK_PASSWORD IS NOT SET ON THE SERVICE, so the read"
            say "     sign-in is protected by the DEFAULT in config.py, which"
            say "     is published in this repository. That is an owner"
            say "     decision to make, not a defect this readback can fix,"
            say "     and it is stated here rather than left implicit."
            say "     (The value is not printed; it is in the source.)"
          fi
          if [ -n "$DPW" ]; then
            code=$(curl -sS -o /tmp/sess.json -w '%{http_code}' --max-time 60 \
                   -c /tmp/desk.jar -X POST -H 'Content-Type: application/json' \
                   --data "$(jq -nc --arg p "$DPW" '{password:$p}')" \
                   "$API/api/command/session")
            say ""
            say "POST /api/command/session (correct password)           HTTP $code"
            ok=$(jq -r '.ok // false' /tmp/sess.json 2>/dev/null || echo false)
            say "  ok                           $ok"
            if [ "$code" = "200" ] && [ "$ok" = "true" ] \
               && grep -q "bt_command" /tmp/desk.jar; then
              say "  => a COMMAND cookie was set in the jar"
              # THE DESK READ, WITH THE COOKIE AND NOTHING ELSE. No admin
              # token on this request: a read that needs the service credential
              # proves nothing about operator access.
              dcode=$(curl -sS -o /tmp/dsk.json -w '%{http_code}' --max-time 120 \
                      -b /tmp/desk.jar "$API/api/command/bettor/desk")
              say ""
              say "GET /api/command/bettor/desk (cookie only, NO admin token)  HTTP $dcode"
              if [ "$dcode" = "200" ]; then
                jq -r '"  sections                     "
                         + ([paths(scalars)|.[0]]|unique|length|tostring),
                       "  funded_book.funded_capability  "
                         + ((.funded_book.funded_capability // "-")|tostring),
                       "  activation.funded_submission   "
                         + ((.activation.funded_submission // "-")|tostring),
                       "  demonstration.label            "
                         + ((.demonstration.label // "-")|tostring)' \
                  /tmp/dsk.json | tee -a "$GITHUB_STEP_SUMMARY"
                say "  => AUTHENTICATED DESK ACCESS WORKS with no service"
                say "     token in the request. Credential used: $([ "$DEFAULTED" = yes ] && echo "the config.py DEFAULT (DESK_PASSWORD unset)" || echo "DESK_PASSWORD from the service environment")"
              else
                say "  => the cookie did not open the desk read"; FAIL=1
              fi
            else
              say "  => the desk password in the service environment did not"
              say "     open a read session. Access unproven."
              FAIL=1
            fi
          else
            say "  => DESK_PASSWORD is not set."; FAIL=1
          fi

          # ── 3 . THE SCOPE BOUNDARY, ASSERTED ────────────────────────
          #
          # AND THE FIRST VERSION OF THIS STEP GOT IT BACKWARDS. It read the
          # control cookie against a READ route, got 401, and narrated that as
          # "confirms the session is live". It confirms the opposite and the
          # right thing: `require_command` grants reads to the READ credential,
          # and a CONTROL cookie is not one. The two credentials are separate on
          # purpose -- whoever may halt the lane is not automatically whoever may
          # look at the numbers, and the reverse -- so 401 here is the property,
          # not a failure, and anything else would be the defect.
          if [ -s /tmp/ctl.jar ]; then
            ccode=$(curl -sS -o /tmp/ctlread.json -w '%{http_code}' --max-time 60 \
                    -b /tmp/ctl.jar "$API/api/command/bettor/control")
            say ""
            say "GET a READ route with the CONTROL cookie alone         HTTP $ccode"
            if [ "$ccode" = "401" ]; then
              say "  => CORRECT: the control credential does not grant reads."
            else
              say "  => UNEXPECTED: a control cookie opened a read ($ccode)."
              FAIL=1
            fi
          fi
          rm -f /tmp/ctl.jar /tmp/desk.jar /tmp/sess.json /tmp/ctl.json
          say ""
          if [ "$FAIL" = "0" ]; then
            say "  => OPERATOR SIGN-IN AND AUTHENTICATED DESK ACCESS: PROVEN."
            say "     Nothing was written, rotated or printed."
          else
            say "  => NOT PROVEN. The lines above say which half failed."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── THE FUNDED MIGRATIONS, ON THE VERSION PRODUCTION ACTUALLY RUNS ──
  #
  # WHY THIS JOB EXISTS. The release gate builds its database on PostgreSQL
  # 16.13. Production is 18.6. On 2026-09-27 migration 126 applied cleanly on
  # every 16 it met, passed a gate that was green by failure identity, and then
  # rolled back on production -- because PostgreSQL 17 and later build indexes
  # under a safe `search_path` and re-parse a SQL function body when the planner
  # inlines it. A green gate on the wrong major version established nothing
  # about the migration, and saying so afterwards is not the same as testing it.
  #
  # So the funded migrations are exercised HERE, on 18, with the SAME runner
  # production boots with -- `python -m sportsassets.scripts.migrate`, asyncpg,
  # whole file per transaction -- and then the funded suite runs against that
  # database. It needs no secret, reaches no network and deploys nothing.
  funded-pg18:
    if: ${{ inputs.pg18_migrations != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: funded_pg18
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          cd backend
          pip install --quiet -e ".[dev]"
      - name: The server this is actually being tested on
        env:
          PGPASSWORD: postgres
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### funded migrations on PostgreSQL 18' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          V=$(psql -h 127.0.0.1 -U postgres -d funded_pg18 -tAc "SHOW server_version")
          N=$(psql -h 127.0.0.1 -U postgres -d funded_pg18 -tAc "SHOW server_version_num")
          say "server_version      $V"
          say "server_version_num  $N"
          # THE POINT OF THE JOB IS THE VERSION. If the container is not 17+,
          # this proves nothing and says so rather than passing.
          [ "$N" -ge 170000 ] || { say "NOT 17+: this job would establish nothing"; exit 1; }
          say "maintenance search_path restriction applies from 17 onward"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Apply every migration with the runner production boots with
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/funded_pg18
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### the runner, file by file' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cd backend
          # THE RUNNER STOPS AT THE FIRST FAILING FILE, which is the behaviour
          # that made a broken 126 block 127 and 128 in production. Two
          # pre-existing files depend on a table no migration creates
          # (`us_premap`, built by the collector), so this loops: run the
          # runner, and when it dies on one of those, record the version so it
          # is skipped, and run again. A funded file that fails is NOT skipped --
          # it fails the job.
          python - <<'PY'
          import asyncio, os, pathlib, subprocess, sys
          import asyncpg

          DSN = os.environ["DATABASE_URL"]
          FUNDED = ("125_", "126_", "127_", "128_")
          skipped, ok = [], False

          async def mark(version):
              c = await asyncpg.connect(DSN)
              await c.execute(
                  "CREATE TABLE IF NOT EXISTS schema_migrations "
                  "(version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL "
                  " DEFAULT now(), content_sha TEXT)")
              await c.execute(
                  "INSERT INTO schema_migrations (version, content_sha) "
                  "VALUES ($1, 'SKIPPED-IN-PG18-VALIDATION') "
                  "ON CONFLICT (version) DO NOTHING", version)
              await c.close()

          for attempt in range(40):
              r = subprocess.run([sys.executable, "-m",
                                  "sportsassets.scripts.migrate"],
                                 capture_output=True, text=True)
              out = (r.stdout or "") + (r.stderr or "")
              if r.returncode == 0:
                  ok = True
                  print("migrations complete after %d pass(es)" % (attempt + 1))
                  break
              # which file was it applying when it died?
              applying = [ln.split("applying ", 1)[1].strip()
                          for ln in out.splitlines() if "applying " in ln]
              failed = applying[-1] if applying else None
              err = [ln for ln in out.splitlines()
                     if "Error" in ln or "error" in ln][-3:]
              if failed is None:
                  print("FAILED with no file named:\n%s" % out[-2000:])
                  sys.exit(1)
              if failed.startswith(FUNDED):
                  print("A FUNDED MIGRATION FAILED ON POSTGRESQL 18: %s" % failed)
                  print("\n".join(err))
                  print(out[-3000:])
                  sys.exit(1)
              print("skipping pre-existing unrelated failure: %s (%s)"
                    % (failed, err[-1] if err else "?"))
              skipped.append(failed)
              asyncio.run(mark(failed))
          if not ok:
              print("the runner never completed"); sys.exit(1)
          print("SKIPPED (unrelated to the funded lane): %s"
                % (", ".join(skipped) or "none"))
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: The funded schema is actually there, on 18
        env:
          PGPASSWORD: postgres
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### what 18 ended up with' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          Q() { psql -h 127.0.0.1 -U postgres -d funded_pg18 -tAc "$1"; }
          for m in 125 126 127 128; do
            got=$(Q "SELECT count(*) FROM schema_migrations WHERE version LIKE '${m}%' AND coalesce(content_sha,'') <> 'SKIPPED-IN-PG18-VALIDATION'")
            say "migration $m applied        $got"
            [ "$got" = "1" ] || { say "  => migration $m did NOT apply on PostgreSQL 18"; exit 1; }
          done
          for c in residual_qty kind parent_intent_id closed_at payout_event; do
            got=$(Q "SELECT count(*) FROM information_schema.columns WHERE table_name='bettor_funded_intents' AND column_name='$c'")
            say "intents.$c            $got"
            [ "$got" = "1" ] || exit 1
          done
          for f in bettor_funded_position_is_open bettor_funded_available_to_exit; do
            got=$(Q "SELECT count(*) FROM pg_proc WHERE proname='$f'")
            say "function $f  $got"
            [ "$got" = "1" ] || exit 1
          done
          # AND THE INDEX WHOSE BUILD IS WHAT FAILED, by name.
          got=$(Q "SELECT count(*) FROM pg_indexes WHERE indexname='bettor_funded_one_open_position'")
          say "index bettor_funded_one_open_position  $got"
          [ "$got" = "1" ] || { say "  => the partial index did not build on 18"; exit 1; }
          # THE PREDICATE, EVALUATED UNDER THE MAINTENANCE PATH 17+ USES.
          say ""
          say "-- the predicate under search_path = pg_catalog, pg_temp --"
          Q "BEGIN; SET LOCAL search_path = pg_catalog, pg_temp; SELECT public.bettor_funded_position_is_open('FILLED', 1, NULL); ROLLBACK;" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          say "   (an unqualified body raises here; this is the 2026-09-27 failure)"
          # A REINDEX IS THE REAL MAINTENANCE OPERATION, and 17+ runs it under
          # that path itself -- no SET needed. If the body were unqualified this
          # is where it would fail.
          Q "REINDEX INDEX bettor_funded_one_open_position" >/dev/null \
            && say "REINDEX bettor_funded_one_open_position  OK" \
            || { say "REINDEX FAILED -- the predicate is not maintenance-safe"; exit 1; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: The funded suite, against PostgreSQL 18
        env:
          RN1X_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/funded_pg18
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/funded_pg18
          ADMIN_TOKEN: t
        run: |
          set -uo pipefail
          echo '### the funded suite on 18' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cd backend
          python -m pytest -q -p no:randomly \
            tests/test_the_funded_lifecycle_is_complete.py \
            tests/test_the_funded_book_is_durable.py \
            tests/test_a_filled_order_is_not_a_closed_position.py \
            tests/test_the_funded_path_is_the_real_adapter.py \
            tests/test_funded_activation_is_a_real_path.py \
            tests/test_partial_exit_pnl_is_separable.py \
            tests/test_a_partial_loss_actually_stops_new_exposure.py \
            tests/test_the_audit_drawdown_reproduction.py \
            2>&1 | tail -25 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: The risk tests RAN rather than skipped
        env:
          RN1X_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/funded_pg18
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/funded_pg18
          ADMIN_TOKEN: t
        run: |
          set -uo pipefail
          # ── A SKIP IS NOT A PASS, AND THIS STEP EXISTS TO SAY SO ────
          #
          # Owner requirement: "'No local DSN' is an execution dependency,
          # not acceptance evidence. Use the available authorized test
          # environment and show that the tests ran rather than skipped."
          #
          # THE FAILURE MODE THIS CLOSES. Every one of these tests is
          # guarded by `@pg`, which skips when RN1X_TEST_DSN is unset. A
          # typo in the env block, a service container that never came up,
          # or a renamed variable would make them ALL skip -- and pytest
          # reports `N skipped` with exit 0, which the job reads as green.
          # The capital-critical risk tests would then be "passing" while
          # never executing, which is worse than not having them: their
          # presence is cited as evidence.
          #
          # So the count of PASSED tests in the risk file is asserted to be
          # non-zero, and any skip in it fails the step.
          cd backend
          python -m pytest -q -p no:randomly \
            tests/test_a_partial_loss_actually_stops_new_exposure.py \
            tests/test_the_audit_drawdown_reproduction.py \
            --junitxml=/tmp/risk.xml 2>&1 | tail -15
          rc=${PIPESTATUS[0]}
          # THE GUARD IS A MODULE, NOT A HEREDOC. A `<<'PYX'` body at column
          # 0 inside this block scalar ended the scalar early; GitHub then
          # could not parse the file and reported "Workflow does not have
          # 'workflow_dispatch' trigger" -- which names nothing about
          # indentation and sent me hunting a missing trigger that was there.
          # Local yaml.safe_load had accepted it. The module has no such
          # failure surface and, better, it has its own tests.
          PYTHONPATH=. python3 -m sportsassets.assert_tests_ran /tmp/risk.xml
          pyrc=$?
          echo "risk-gate rc=$pyrc pytest rc=$rc"
          [ "$pyrc" = "0" ] && [ "$rc" = "0" ]
      - name: The venue SDK CI installs is the pinned one
        run: |
          set -uo pipefail
          # ── WHY THIS IS A GATE STEP AND NOT ONLY A TEST ─────────────
          #
          # CI installs with `pip install -e ".[dev]"` from the same
          # `pyproject.toml` the image builds from, so an exact pin makes
          # the two resolve the same client BY CONSTRUCTION. That is the
          # reproducibility; this step is the evidence.
          #
          # THE DEFECT IT WOULD HAVE CAUGHT. With `polymarket-us>=0.1.2`,
          # this runner and the deployed image each took whatever PyPI had
          # latest at their own moment -- and they disagreed: 0.1.2 has no
          # retry logic, 1.0.2 retries twice, so one logical read made 1
          # request here and 3 in production. Nothing was wrong with the
          # tests; they were testing a different dependency. A silent
          # divergence like that has to fail a job, not be discovered in a
          # reproduction weeks later.
          #
          # `report()["refusals"]` is non-empty when the installed build is
          # not the pinned one, when the version cannot be read, or when the
          # constructor did not accept `max_retries` -- so the step fails on
          # "we could not tell" as well as on "it is wrong".
          # A MODULE, NOT INLINE PYTHON. The same trap as the risk step
          # below documents: a continuation line at column 0 inside this
          # block scalar ENDS the scalar, and GitHub then reports
          # "Workflow does not have 'workflow_dispatch' trigger" -- a
          # message that names nothing about indentation. `python3 -c` with
          # a multi-line body is that trap wearing a different hat. The
          # module also has its own tests, which inline script never does.
          echo '### the venue SDK this job installed' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cd backend
          PYTHONPATH=. python3 -m sportsassets.venue_sdk 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Rate control end to end, and it RAN
        run: |
          set -uo pipefail
          # The counterexamples for Codex's five points, through the real
          # scheduled reader against the pinned SDK. Needs no database, but
          # it is placed in this job because it is the same class of
          # evidence: a control that is asserted rather than described.
          #
          # ASSERT_TESTS_RAN AGAIN, for the same reason as the risk step. A
          # collection error in this file would report 0 tests and exit 0 on
          # some invocations, and "no rate-control test ran" must not read
          # as green.
          echo '### rate control, end to end' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cd backend
          python -m pytest -q -p no:randomly \
            tests/test_the_scheduled_read_is_rate_controlled_end_to_end.py \
            tests/test_every_venue_http_attempt_is_accounted_for.py \
            --junitxml=/tmp/rate.xml 2>&1 | tail -20 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          PYTHONPATH=. python3 -m sportsassets.assert_tests_ran /tmp/rate.xml \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          pyrc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "rate-gate rc=$pyrc pytest rc=$rc"
          [ "$pyrc" = "0" ] && [ "$rc" = "0" ]

  # ── WHAT `transactTime` MEANS, ESTABLISHED BY READING TWICE ─────────
  #
  # WHY THIS MATTERS MORE THAN IT LOOKS. The entry lane computes
  # `age = decision_instant - transactTime` and refuses a book over 30 s old.
  # That arithmetic is a STALENESS measurement only if the venue stamps the
  # RESPONSE. If it stamps the LAST BOOK CHANGE, an old value means the book has
  # not moved -- the ordinary condition of a quiet money line -- and refusing on
  # it refuses every quiet market while calling it freshness. Production's
  # candidate ledger is dominated by exactly that refusal, with stamps two to
  # eight minutes old, so which semantics hold decides whether the lane can ever
  # evaluate anything.
  #
  # THE OBSERVABLE. Two reads of the same contract, `gap_s` apart:
  #   * transact_time_delta ~= our receipt delta, book unchanged  -> RESPONSE stamp
  #   * transact_time_delta == 0, book unchanged                  -> LAST-CHANGE stamp
  #   * transact_time advances AND the book hash changed          -> consistent with LAST-CHANGE
  # The probe route itself draws no verdict and neither does this job: it prints
  # the observations and the reading they support, and nothing downstream reads
  # them.
  venue-clock:
    if: ${{ inputs.clock_probe != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Read each contract twice and print the deltas
        env:
          API: ${{ inputs.api }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SLUGS: ${{ inputs.clock_probe }}
          GAP: ${{ inputs.clock_probe_gap_s }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### what marketData.transactTime tracks' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          [ -n "${ADMIN_TOKEN:-}" ] && echo "::add-mask::$ADMIN_TOKEN"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            say "SKIPPED: no ADMIN_TOKEN"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/clk.json -w '%{http_code}' --max-time 300 \
                   -H "X-Admin-Token: $ADMIN_TOKEN" \
                   "$API/api/admin/venue-clock-probe?slugs=$SLUGS&gap_s=$GAP")
            say "GET /api/admin/venue-clock-probe  HTTP $code  (attempt $attempt)"
            case "$code" in
              200) break ;;
              401|403) say "  the admin role was refused"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
              *) say "  not served; waiting 20 s"; sleep 20 ;;
            esac
          done
          [ "$code" = "200" ] || { say "not served after three attempts"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          say ""
          jq -r '.pairs[]?
                 | "  " + (.slug|tostring),
                   "     our receipt delta     " + ((.our_receipt_delta_s // "-")|tostring) + " s",
                   "     transactTime delta    " + ((.transact_time_delta_s // "-")|tostring) + " s",
                   "     book content changed  " + ((.book_sha_changed // "-")|tostring),
                   "     age at 1st return     " + ((.first.age_at_return_s // "-")|tostring) + " s",
                   "     age at 2nd return     " + ((.second.age_at_return_s // "-")|tostring) + " s",
                   "     stamp 1st / 2nd       " + ((.first.raw_transact_time // "-")|tostring)
                                                 + "  /  " + ((.second.raw_transact_time // "-")|tostring),
                   "     best ask 1st / 2nd    " + ((.first.best_ask // "-")|tostring)
                                                 + "  /  " + ((.second.best_ask // "-")|tostring)' \
            /tmp/clk.json | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          # THE READING, DERIVED FROM THE NUMBERS ABOVE AND NAMED AS A READING.
          ZERO=$(jq '[.pairs[]? | select(.transact_time_delta_s == 0)] | length' /tmp/clk.json)
          TRACK=$(jq '[.pairs[]? | select(.transact_time_delta_s != null
                        and .our_receipt_delta_s != null
                        and ((.transact_time_delta_s - .our_receipt_delta_s) | fabs) < 3)] | length' /tmp/clk.json)
          MOVED=$(jq '[.pairs[]? | select(.book_sha_changed == true)] | length' /tmp/clk.json)
          N=$(jq '[.pairs[]?] | length' /tmp/clk.json)
          say "contracts read                  $N"
          say "  stamp identical on both reads  $ZERO"
          say "  stamp tracked our request      $TRACK  (delta within 3 s of the receipt gap)"
          say "  book content changed           $MOVED"
          say ""
          if [ "$N" -gt 0 ] && [ "$TRACK" = "$N" ]; then
            say "  READING: the stamp tracks the RESPONSE on every contract read."
            say "  An old stamp would then be a genuinely stale read, and the"
            say "  30 s bound is measuring what it claims to."
          elif [ "$N" -gt 0 ] && [ "$ZERO" -gt 0 ] && [ "$TRACK" = "0" ]; then
            say "  READING: the stamp did NOT move while we read twice. That is"
            say "  the LAST-CHANGE reading: the age measures how long since the"
            say "  book moved, not how current our read is -- so the 30 s bound"
            say "  refuses every quiet market and calls it freshness. The bound"
            say "  is NOT loosened on this evidence; what it is applied to has"
            say "  to change, and that is a separate, named repair."
          else
            say "  READING: mixed or insufficient. Nothing is concluded; the"
            say "  numbers above are the record."
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── THE OFFICIAL FEE DOCUMENTATION, RETRIEVED WHERE EGRESS EXISTS ──
  #
  # WHY THIS JOB EXISTS. `calibration_fees` implements half-up rounding and the
  # 2026-09-27 management audit reports the current published policy is half-even
  # with a cumulative taker-fill adjustment. The difference is one cent on an
  # exact tie, and it cannot be settled from the build container: outbound HTTPS
  # to docs.polymarket.us is denied by the egress policy (CONNECT 403). So the
  # module records the discrepancy, carries both figures and pins six
  # discriminating vectors -- and REFUSES to change the arithmetic to match a
  # page nobody has read. That refusal is correct and it is not an answer.
  #
  # THIS RUNNER CAN REACH THE PAGE. It fetches it, prints the relevant sentences
  # VERBATIM rather than summarising them, and records the fetch instant and the
  # response's own headers so the retrieval is datable. A summary of a fee policy
  # is how the `min(p, 1-p)` defect got written; the text is what settles it.
  # ── CREDENTIAL CAPABILITY, VERIFIED RATHER THAN ASSUMED ────────────
  #
  # THE CLAIM THIS EXISTS TO CHECK. I wrote that the credential should be
  # provisioned as a READ-ONLY key, and cited the venue's retail authentication
  # documentation as the support. That page describes API-KEY AUTHENTICATION.
  # Describing how a key authenticates does not establish that a read-only SCOPE
  # is on offer, and I ran the two together.
  #
  # THREE THINGS THAT MUST BE KEPT APART, and the job prints them separately:
  #
  #   1  what is needed for READ-ONLY ONBOARDING -- balances, positions, open
  #      orders, executions. Reads, no order authority.
  #   2  what is needed LATER for SUBMISSION AND SERVICING -- placing,
  #      cancelling, amending. A strictly larger permission.
  #   3  OUR OWN APPLICATION CONTROLS that keep submission disabled regardless
  #      of what the credential permits. These are ours and are not evidence
  #      about the venue's scopes at all.
  #
  # NEVER TEST ORDER AUTHORITY BY SENDING AN ORDER. This job sends no credential
  # and places nothing; an unauthorized order is not a permission probe, it is an
  # unauthorized order. The only evidence it collects is what the venue publishes.
  credential-capability:
    if: ${{ inputs.credential_capability != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the published authentication and key-provisioning pages
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### venue credential capability, read directly' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          say "retrieved_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          say "NO CREDENTIAL IS SENT BY THIS JOB. No order is placed."
          say ""
          say "THE CLAIM UNDER TEST: that a READ-ONLY key option exists."
          say "The authentication page describes API-KEY AUTHENTICATION. That is"
          say "a different statement, and conflating them is the error here."
          say ""

          PAGES="
          https://docs.polymarket.us/api-reference/authentication
          https://docs.polymarket.us/api-reference/introduction
          https://docs.polymarket.us/quickstart
          https://docs.polymarket.us/api-reference/api-keys
          https://docs.polymarket.us/developers/api-keys
          "
          : > /tmp/cap_all.txt
          for url in $PAGES; do
            code=$(curl -sS -L -o /tmp/cap.html -w '%{http_code}' --max-time 60 \
                   "$url" || echo 000)
            bytes=$(wc -c < /tmp/cap.html 2>/dev/null || echo 0)
            say "GET $url  HTTP $code  bytes=$bytes"
            [ "$code" = "200" ] || continue
            URL="$url" python3 - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY" \
              | tee -a /tmp/cap_all.txt
          import html, os, re
          raw = open('/tmp/cap.html', encoding='utf-8', errors='replace').read()
          raw = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', raw)
          txt = html.unescape(re.sub(r'(?s)<[^>]+>', ' ', raw))
          flat = re.sub(r'\s+', ' ', txt)
          # EACH QUESTION SEPARATELY, and a question with no matching sentence
          # is printed as UNANSWERED rather than left out -- an absent sentence
          # is the finding, not a gap in the report.
          WANT = {
            '1_read_only_scope_offered':
                r'read[- ]only|readonly|read access only|view only',
            '1_scopes_or_permissions_at_all':
                r'\bscope\b|\bscopes\b|permission|privilege|capabilit',
            '1_onboarding_reads':
                r'balance|position|open order|execution|fill history',
            '2_submission_permission':
                r'place an order|submit an order|create order|post order|'
                r'trading permission|order authority',
            '2_servicing_permission':
                r'cancel|amend|modify an order|replace an order',
            '3_key_creation_choices':
                r'create (an )?api key|generate (an )?api key|new api key|'
                r'derive|passphrase|secret',
            '3_revocation_or_rotation':
                r'revoke|rotate|delete (the )?key|disable (the )?key|expire',
          }
          print()
          print('---- %s ----' % os.environ['URL'])
          for name, pat in sorted(WANT.items()):
              hits = [s.strip() for s in re.split(r'(?<=[.!?])\s+', flat)
                      if re.search(pat, s, re.I)]
              print('[%s] %d matching sentence(s)' % (name, len(hits)))
              for h in hits[:5]:
                  print('   | ' + h[:340])
              if not hits:
                  print('   | UNANSWERED BY THIS PAGE')
          PYEOF
          done

          say ""
          say "== THE VERDICT, STATED AT THE WIDTH THE EVIDENCE SUPPORTS =="
          if grep -qiE 'read[- ]?only|readonly' /tmp/cap_all.txt; then
            say "A read-only scope IS mentioned in the retrieved pages. The exact"
            say "sentences are printed above; read them before relying on it --"
            say "a mention is not a provisioning option with enforced limits."
          else
            say "NO RETRIEVED PAGE MENTIONS A READ-ONLY SCOPE."
            say "So the claim that a read-only key option exists is NOT"
            say "SUPPORTED by the published documentation. That is not the"
            say "same as the option not existing: these pages may be"
            say "incomplete, and the provisioning UI may offer choices no page"
            say "describes. The supportable statement is that WE HAVE NO"
            say "EVIDENCE FOR IT, and the remedy is to look at the actual"
            say "provisioning screen -- not to assume either way."
          fi
          say ""
          say "== 3 . OUR OWN CONTROLS, WHICH ARE NOT EVIDENCE ABOUT THE VENUE =="
          say "These hold regardless of what the credential permits, and they"
          say "are OURS -- they say nothing about the venue's scopes:"
          grep -n 'REAL_ORDER_SUBMISSION_ENABLED = ' \
            backend/sportsassets/bettor_entry_execution.py \
            | tee -a "$GITHUB_STEP_SUMMARY"
          grep -n 'POLICY_ADMISSION_ENABLED = ' \
            backend/sportsassets/bettor_admission_policy.py \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  fee-docs:
    if: ${{ inputs.fee_docs != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the published fee policy, verbatim
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### the venue fee policy, as published' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          say "retrieved_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ok=0
          for url in "https://docs.polymarket.us/fees" \
                     "https://docs.polymarket.us/trading/fees" \
                     "https://docs.polymarket.us/" ; do
            code=$(curl -sS -L -o /tmp/fees.html -D /tmp/fees.hdr \
                   -w '%{http_code}' --max-time 60 "$url" || echo 000)
            say "GET $url  HTTP $code  bytes=$(wc -c < /tmp/fees.html 2>/dev/null || echo 0)"
            if [ "$code" = "200" ] && [ -s /tmp/fees.html ]; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            say "NOT RETRIEVED. The rounding question stays UNRECONCILED and"
            say "calibration_fees.FEE_ARITHMETIC_IS_EXACT stays False."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          say ""
          say "-- response metadata (datable retrieval) --"
          grep -iE '^(date|last-modified|etag|age|cache-control):' /tmp/fees.hdr \
            | sed 's/^/  /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          # TEXT, NOT TAGS. A fee sentence inside a <span> is still the sentence.
          python3 - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import html, re, sys
          raw = open('/tmp/fees.html', encoding='utf-8', errors='replace').read()
          raw = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', raw)
          txt = html.unescape(re.sub(r'(?s)<[^>]+>', ' ', raw))
          txt = re.sub(r'[ \t\r\f\v]+', ' ', txt)
          lines = [l.strip() for l in txt.splitlines() if l.strip()]
          flat = ' '.join(lines)
          print()
          print('-- VERBATIM sentences bearing on the four questions --')
          WANT = {
            'rounding': r'round|half[- ]?up|half[- ]?even|banker|nearest cent|truncat',
            'cumulative_taker_fill': r'cumulat|partial fill|per fill|aggregate|incremental',
            'effective_date': r'effective|as of|updated|last revised|20\d\d-\d\d-\d\d',
            'execution_report_units': r'unit|cent|micro|notional|basis point|bps|scale|decimal',
            'coefficient_and_formula': r'0\.0695|0\.0125|coefficient|p \* \(1|price \(1|rebate',
          }
          for name, pat in WANT.items():
              hits = [s.strip() for s in re.split(r'(?<=[.!?])\s+', flat)
                      if re.search(pat, s, re.I)]
              print()
              print('[%s] %d matching sentence(s)' % (name, len(hits)))
              for h in hits[:8]:
                  print('   | ' + h[:400])
              if not hits:
                  print('   | NONE FOUND IN THE RETRIEVED PAGE -- this question is'
                        ' NOT answered by this document and stays unreconciled')
          print()
          print('-- what this job does NOT do --')
          print('   it does not change any fee arithmetic. A human reads the')
          print('   sentences above and, if they settle the question, the change')
          print('   is a separate reviewed commit with the quote in its message.')
          PYEOF
          say ""
          say "-- our discriminating vectors, for comparison --"
          python3 -c "
          import json, sys
          sys.path.insert(0, 'backend')
          from sportsassets import calibration_fees as CF
          d = CF.rounding_discriminators()
          for v in d['vectors']:
              print('   q=%-5s p=%-5s raw=%-13s half_up=%-6s half_even=%s'
                    % (v['quantity'], v['price'], v['raw'],
                       v['if_half_up'], v['if_half_even']))
          print('   implemented_here=%s verified=%s' % (d['implemented_here'], d['verified']))
          " | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
  # -- THE PUBLISHED BOOK PROTOCOL, READ FROM THE RUNNER -------------
  #
  # WHY THIS JOB NEEDS NO DEPLOY. I had concluded that settling mechanism M2
  # required deploying the V3 probe, because that probe lives inside our API.
  # That was a dependency I invented: the endpoint is PUBLIC and documented, the
  # runner has egress, and a public response header does not need our backend to
  # be readable. Production integration still needs its own gated deployment --
  # this settles what the PROTOCOL provides, which is the question that was
  # actually blocking.
  #
  # THREE THINGS, KEPT SEPARATE:
  #   1  what the published Markets WebSocket documentation says about
  #      SUBSCRIPTION_TYPE_MARKET_DATA. If the documented response is a full
  #      order book, replacement authority rests on the PUBLISHED PROTOCOL and
  #      not on an SDK docstring -- and a self-contained replacement does not
  #      need delta reconstruction, so the continuity requirement imposed
  #      earlier was the wrong shape for a snapshot feed;
  #   2  the book endpoint's response contract: every header verbatim, whether a
  #      validator is present, and what a conditional re-request returns;
  #   3  what the payload carries about its own timing -- field names only.
  #
  # AND WHAT IT REFUSES TO CONCLUDE. A validator does NOT establish a numeric
  # market-data age: an origin can validate a representation while its own
  # market-data source is delayed. HTTP cache age, our observation age and any
  # upstream market-data stamp are printed as THREE quantities with no equality
  # drawn between them.
  book-protocol:
    if: ${{ inputs.book_protocol != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the documented protocol and the live book endpoint
        env:
          SLUGS: ${{ inputs.book_protocol_slugs }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '### the published book protocol, read directly' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          say "retrieved_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GW=https://gateway.polymarket.us
          say "gateway=$GW  (the documented public base)"

          say ""
          say "== 1 . WHAT THE PUBLISHED WEBSOCKET DOCS SAY =="
          WSDOC=https://docs.polymarket.us/api-reference/websocket/markets
          code=$(curl -sS -L -o /tmp/ws.html -w '%{http_code}' --max-time 60 "$WSDOC" || echo 000)
          say "GET $WSDOC  HTTP $code  bytes=$(wc -c < /tmp/ws.html 2>/dev/null || echo 0)"
          if [ "$code" = "200" ]; then
          python3 - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import html, re
          raw = open('/tmp/ws.html', encoding='utf-8', errors='replace').read()
          raw = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', raw)
          txt = html.unescape(re.sub(r'(?s)<[^>]+>', ' ', raw))
          flat = re.sub(r'\s+', ' ', txt)
          WANT = {
           'full_book_or_snapshot': r'full order book|full book|snapshot|entire book|replace',
           'delta_or_incremental': r'delta|incremental|increment|diff|partial update',
           'sequence_or_ordering': r'sequence|ordering|out of order|gap|missed message',
           'market_data_subscription': r'SUBSCRIPTION_TYPE_MARKET_DATA',
           'heartbeat_and_reconnect': r'heartbeat|reconnect|resubscribe|disconnect',
           'timing_or_latency': r'latency|transactTime|timestamp|as of|delay',
          }
          for name, pat in WANT.items():
              hits = [x.strip() for x in re.split(r'(?<=[.!?])\s+', flat)
                      if re.search(pat, x, re.I)]
              print()
              print('[%s] %d matching sentence(s)' % (name, len(hits)))
              for h in hits[:6]:
                  print('   | ' + h[:360])
              if not hits:
                  print('   | NONE FOUND -- this question is not answered by this page')
          PYEOF
          else
            say "NOT RETRIEVED. Replacement authority stays open on the"
            say "published protocol and P1 keeps its current verdict."
          fi

          say ""
          say "== 2 . THE BOOK ENDPOINT'S OWN RESPONSE CONTRACT =="
          want="$SLUGS"
          if [ -z "$want" ]; then
            # THE FIRST RUN OF THIS JOB READ THREE EXPIRED MARKETS, and that
            # is not a defect in the venue -- `?limit=20` with no filter
            # returns whatever the catalogue lists first, which happened to be
            # settled 2025 NFL games with ZERO book levels. It still produced
            # the decisive negative result (see section 2b), but a numeric
            # market-data age can only be characterised on a market whose book
            # actually moves. So the state is now a SELECTION CRITERION and a
            # market with no levels is reported as unusable rather than
            # silently standing in for a live one.
            code=$(curl -sS -o /tmp/mk.json -w '%{http_code}' --max-time 60 \
                   "$GW/v1/markets?limit=200" || echo 000)
            say "GET $GW/v1/markets?limit=200  HTTP $code"
          want=$(python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open('/tmp/mk.json'))
          except Exception:
              raise SystemExit
          ms = d.get('markets') or d.get('data') or []
          live, other = [], []
          for m in ms:
              if not isinstance(m, dict):
                  continue
              s = m.get('slug') or m.get('marketSlug')
              if not s:
                  continue
              st = str(m.get('state') or m.get('marketState') or '')
              (live if 'EXPIRED' not in st.upper()
               and 'SETTLED' not in st.upper() else other).append(s)
          # LIVE FIRST, and an expired market only as a last resort so the
          # section still prints a contract rather than nothing.
          print(','.join((live + other)[:4]))
          PYEOF
          )
            say "slugs from the public catalogue (non-expired preferred): ${want:-NONE}"
          fi
          if [ -z "$want" ]; then
            say "NO SLUG AVAILABLE, so the header question stays unanswered."
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

          IFS=',' read -ra ARR <<< "$want"
          for slug in "${ARR[@]}"; do
            [ -n "$slug" ] || continue
            say ""
            say "-- $slug --"
            t0=$(date -u +%s)
            code=$(curl -sS -D /tmp/bk.hdr -o /tmp/bk.json -w '%{http_code}' \
                   --max-time 30 "$GW/v1/markets/$slug/book" || echo 000)
            t1=$(date -u +%s)
            say "GET /v1/markets/$slug/book  HTTP $code  our_round_trip_s=$((t1-t0))"
            say "   every response header, verbatim:"
            sed -n '2,$p' /tmp/bk.hdr | sed 's/^/     /' | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys, time, email.utils
          hdr = {}
          for line in open('/tmp/bk.hdr', encoding='utf-8', errors='replace'):
              if ':' in line:
                  k, _, v = line.partition(':')
                  hdr[k.strip().lower()] = v.strip()
          try:
              body = json.load(open('/tmp/bk.json'))
          except Exception as exc:
              print('   payload unparseable: %s' % type(exc).__name__)
              raise SystemExit
          md = body.get('marketData') if isinstance(body, dict) else None
          print('   payload top-level keys: %s' % (sorted(body)[:12] if isinstance(body, dict) else type(body).__name__))
          if isinstance(md, dict):
              print('   marketData field names: %s' % sorted(md))
              for probe in ('seq', 'sequence', 'sequenceNumber', 'msgId', 'messageId',
                            'isSnapshot', 'snapshot', 'action', 'type', 'updateId'):
                  if probe in md:
                      print('   *** %s IS PRESENT: %r' % (probe, md[probe]))
              print('   bid levels=%s offer levels=%s'
                    % (len(md.get('bids') or []), len(md.get('offers') or [])))
              print('   transactTime=%r  state=%r' % (md.get('transactTime'), md.get('state')))
          now = time.time()
          def hd(v):
              try:
                  return email.utils.parsedate_to_datetime(v).timestamp()
              except Exception:
                  return None
          d0 = hd(hdr.get('date', '')) if hdr.get('date') else None
          age = hdr.get('age')
          print('   -- THREE DIFFERENT QUANTITIES, kept apart --')
          print('   HTTP cache age (Age header)        : %s' % (age if age is not None else 'ABSENT'))
          print('   origin generation (Date - Age)     : %s'
                % ('UNKNOWN' if d0 is None else '%.0f s ago' % (now - (d0 - float(age or 0)))))
          print('   OUR observation age at this instant: ~0 s, we just received it')
          print('   UPSTREAM MARKET-DATA age           : NOT STATED BY ANY HEADER')
          print('      an origin can validate a representation while its own market-data')
          print('      source is delayed, so neither a validator nor Date-Age is a')
          print('      market-data age. transactTime is the only candidate and what it')
          print('      denotes is unresolved.')
          print('   validator: etag=%s last-modified=%s'
                % (hdr.get('etag', 'ABSENT'), hdr.get('last-modified', 'ABSENT')))
          open('/tmp/validator.txt', 'w').write('%s|%s' % (hdr.get('etag', ''), hdr.get('last-modified', '')))
          PYEOF
            ET=$(cut -d'|' -f1 /tmp/validator.txt 2>/dev/null)
            LM=$(cut -d'|' -f2 /tmp/validator.txt 2>/dev/null)
            if [ -n "$ET" ] || [ -n "$LM" ]; then
              say "   -- the conditional re-request, which is the M2 exchange --"
              ARGS=()
              [ -n "$ET" ] && ARGS+=(-H "If-None-Match: $ET")
              [ -n "$LM" ] && ARGS+=(-H "If-Modified-Since: $LM")
              c2=$(curl -sS -D /tmp/bk2.hdr -o /tmp/bk2.json -w '%{http_code}' \
                   --max-time 30 "${ARGS[@]}" "$GW/v1/markets/$slug/book" || echo 000)
              say "   conditional GET -> HTTP $c2   (304 = the origin affirms the representation)"
              grep -iE '^(date|age|etag|cache-control|x-cache|cf-cache-status):' \
                /tmp/bk2.hdr | sed 's/^/     /' | tee -a "$GITHUB_STEP_SUMMARY" || true
              say "   NOTE: a 304 affirms the REPRESENTATION. It is not a market-data age."
            else
              say "   no validator on this response, so the M2 exchange cannot be"
              say "   made HERE. That does not prove no viable data path exists."
            fi
            # THE DISCRIMINATOR, STATED BEFORE IT IS RUN so the conclusion
            # cannot be fitted to whatever comes back.
            #
            # Two candidate readings of `transactTime` have been open all day
            # and they imply opposite repairs:
            #
            #   RESPONSE-STAMP  -> an old value means our read is old, and the
            #                      30 s bound is measuring the right thing.
            #   MARKET-DATA     -> an old value means the BOOK has not moved,
            #                      and the bound is applied to the wrong
            #                      quantity, which is a different repair.
            #
            # A response stamp cannot precede its own response. So if
            # transactTime sits materially BEFORE `date` on any read, the
            # response-stamp reading is CONTRADICTED -- one observation is
            # enough for that direction, and no number of observations could
            # establish the positive direction, which is why this is not the
            # resampling I withdrew earlier.
            #
            # A SECOND READ AFTER A GAP then separates two things this single
            # read cannot: whether transactTime ADVANCES while `date` advances
            # (which would put it back on the response) or HOLDS STILL while
            # `date` advances (which places it on the data). Stated here in
            # advance; the two reads are printed and compared, not narrated.
            say "   -- 2b . THE PRESTATED DISCRIMINATOR --"
            sleep 8
            curl -sS -D /tmp/bk3.hdr -o /tmp/bk3.json --max-time 30 \
                 "$GW/v1/markets/$slug/book" >/dev/null 2>&1 || true
          python3 - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, email.utils, datetime
          def hdrs(p):
              h = {}
              for line in open(p, encoding='utf-8', errors='replace'):
                  if ':' in line:
                      k, _, v = line.partition(':')
                      h[k.strip().lower()] = v.strip()
              return h
          def tt(p):
              try:
                  md = (json.load(open(p)) or {}).get('marketData') or {}
              except Exception:
                  return None, None, None
              return (md.get('transactTime'), len(md.get('bids') or []),
                      len(md.get('offers') or []))
          def secs(iso):
              if not iso:
                  return None
              s = iso.replace('Z', '+00:00')
              # nanosecond precision: python takes at most 6 digits
              if '.' in s:
                  head, _, tail = s.partition('.')
                  frac = ''.join(ch for ch in tail if ch.isdigit())[:6]
                  off = tail[len(''.join(ch for ch in tail if ch.isdigit())):]
                  s = '%s.%s%s' % (head, frac.ljust(6, '0'), off or '+00:00')
              try:
                  return datetime.datetime.fromisoformat(s).timestamp()
              except Exception:
                  return None
          h1, h2 = hdrs('/tmp/bk.hdr'), hdrs('/tmp/bk3.hdr')
          t1, b1, o1 = tt('/tmp/bk.json')
          t2, b2, o2 = tt('/tmp/bk3.json')
          def dsec(h):
              try:
                  return email.utils.parsedate_to_datetime(h.get('date', '')).timestamp()
              except Exception:
                  return None
          d1, d2 = dsec(h1), dsec(h2)
          print('   read 1: date=%s transactTime=%s levels=%s/%s'
                % (h1.get('date'), t1, b1, o1))
          print('   read 2: date=%s transactTime=%s levels=%s/%s'
                % (h2.get('date'), t2, b2, o2))
          print('   last-modified 1=%s' % h1.get('last-modified'))
          print('   last-modified 2=%s' % h2.get('last-modified'))
          s1, s2 = secs(t1), secs(t2)
          if s1 is not None and d1 is not None:
              lag = d1 - s1
              print('   date - transactTime on read 1 = %.1f s' % lag)
              if lag > 120:
                  print('   => RESPONSE-STAMP READING IS CONTRADICTED. A response')
                  print('      stamp cannot precede its own response by %.0f s.' % lag)
                  print('      transactTime is a MARKET-DATA instant.')
              elif lag < -5:
                  print('   => transactTime is AHEAD of the response; neither')
                  print('      reading is supported and this needs its own work.')
              else:
                  print('   => this read does not separate the two readings:')
                  print('      transactTime and date agree to within 120 s, which')
                  print('      is what BOTH readings predict on an active book.')
          if s1 is not None and s2 is not None and d1 and d2:
              print('   across the %.0f s gap: date advanced %.1f s, '
                    'transactTime advanced %.1f s' % (d2 - d1, d2 - d1, s2 - s1))
              if abs((d2 - d1) - (s2 - s1)) < 1.0 and (s2 - s1) > 1.0:
                  print('   => transactTime TRACKS the response clock. That would')
                  print('      make it a response stamp after all, and the 120 s')
                  print('      test above governs -- report BOTH, do not choose.')
              elif abs(s2 - s1) < 0.001:
                  print('   => transactTime HELD STILL while date advanced.')
                  print('      Consistent with a market-data instant. NOTE it does')
                  print('      NOT distinguish "last book change" from any other')
                  print('      data-side event (settlement, last trade): on a book')
                  print('      that did not move in the gap those coincide.')
              else:
                  print('   => transactTime moved but not with the clock. Recorded')
                  print('      as an observation; it settles neither reading.')
          print('   LEVELS MATTER: a book with 0/0 levels cannot characterise a')
          print('   numeric market-data age for a LIVE market. Levels above are')
          print('   printed so a zero-depth read is not mistaken for one.')
          PYEOF
          done

          say ""
          say "== 3 . RUNNER VS PRODUCTION PATH, recorded not assumed =="
          say "this job read $GW directly from a GitHub runner. Production reads"
          say "the same host through polymarket_us from Render. Differences that"
          say "could matter and are NOT settled here:"
          say "  * egress IP and region, so a different CDN edge may answer;"
          say "  * the SDK sends Authorization on authenticated paths and this"
          say "    job sent none, so a validator could differ between them;"
          say "  * Render's outbound path may add or strip hop headers."
          say "SO production integration still needs its own gated deployment and"
          say "its own readback. This settles the PROTOCOL, not our path."
          echo '```' >> "$GITHUB_STEP_SUMMARY"
