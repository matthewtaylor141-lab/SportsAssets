# BETA48 PHASE_2A -- SINGLE-RATE OPERATIONAL CONFIRMATION. READ-ONLY.
# NO ORDERS. NO CREDENTIAL. mirror_live = false.
#
# WHY A SECOND, SEPARATE JOB. The ladder (beta48-rate-pilot.yml) screens. It
# runs four rates back to back against a limiter whose accounting window is
# undocumented, so a rung may pass on credit an earlier rung left or fail on
# debt a faster one ran up. That instrument can say "0.5 rps was refused" and
# it can nominate a starting point. It cannot confirm a rate, and no amount of
# post-processing turns it into something that can.
#
# This job is the other instrument. ONE rate. ONE fresh process. ONE global
# pacer, no concurrency. NO faster traffic ahead of it inside this workflow.
# Then the only thing the result is about is that rate.
#
# WHAT IT DECIDES, AND WHAT IT LEAVES ALONE.
#   COLLECTOR_RATE_OPERATIONALLY_VALIDATED  YES or NO. The gate.
#   VENUE_RATE_LIMIT_MECHANISM_IDENTIFIED   NOT_IDENTIFIED, permanently, and
#                                           nothing here waits on it. Requiring
#                                           it would be a gate with no key.
#
# THE FLOOR AND THE THRESHOLD ARE FROZEN IN rate_confirm.py BEFORE DISPATCH:
#   MIN_DURATION = max(900 s, 300 / rate)  -- 0.125 rps needs >= 2,400 s
#   TARGET_429_RATE = ZERO, with one narrowly defined allowance
# A run that cannot reach its own floor is REFUSED AT THE DOOR by
# dispatch_check rather than run and then reinterpreted. That is why the job
# takes a rate with no default: nothing here starts by accident.

name: beta48-rate-confirm

on:
  workflow_dispatch:
    inputs:
      rate:
        description: "The ONE requests-per-second rate to confirm (no default on purpose)"
        required: true
      markets:
        description: "Distinct markets to rotate through"
        required: false
        default: "6"
      requests:
        description: "Requests (0 = the frozen floor for this rate)"
        required: false
        default: "0"

permissions:
  contents: write

# SHARED with every other venue-touching job: a confirmation running beside a
# capture would measure the wrong thing and add load while doing it.
concurrency:
  group: beta48-forward-capture
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    # 2,400 s at 0.125 rps plus backoff, with room. The job must outlast its
    # own evidence floor or dispatch_check refuses it.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/session-njaewf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the one dependency
        run: python -m pip install --quiet "httpx==0.27.2" "pytest==8.3.3"

      # THE GATE. No venue contact until the boundary is proved.
      - name: Prove the capability boundary offline
        working-directory: research/beta48/shadow
        run: python -m pytest -q

      - name: Single-rate operational confirmation
        working-directory: research/beta48/shadow
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          python rate_confirm.py \
            --universe tick_universe.json \
            --out "evidence/rateconfirm_$SEG" \
            --rate "${{ github.event.inputs.rate }}" \
            --markets "${{ github.event.inputs.markets || 6 }}" \
            --requests "${{ github.event.inputs.requests || 0 }}" \
            --timeout-s 5100

      - name: Seal and commit the confirmation
        if: always()
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          D=research/beta48/shadow/evidence/rateconfirm_$SEG
          [ -d "$D" ] || exit 0
          ( cd "$D" && sha256sum * > SEALED.sha256 2>/dev/null || true )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="beta48-rateconfirm/seg-$SEG"
          git checkout --orphan "$BR"
          git rm -rq --cached . || true
          git add -f "$D"
          git commit -qm "BETA48 single-rate confirmation $SEG [skip render]" || exit 0
          for i in 1 2 4 8 16; do
            git push -f origin "$BR" && break
            echo "push failed, retrying in ${i}s"; sleep "$i"
          done
          echo "BETA48_RATECONFIRM_BRANCH $BR"
