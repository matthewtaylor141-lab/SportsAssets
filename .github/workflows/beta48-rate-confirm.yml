# BETA48 PHASE_2A -- SINGLE-RATE OPERATIONAL CONFIRMATION. READ-ONLY.
# NO ORDERS. NO CREDENTIAL. mirror_live = false.
#
# WHY A SECOND, SEPARATE JOB. The ladder (beta48-rate-pilot.yml) screens: four
# rates back to back against an undocumented limiter, where a rung may pass on
# credit an earlier rung left or fail on debt a faster one ran up. It can say "
# 0.5 rps was refused" and nominate a starting point. It cannot confirm a rate.
# This job is the other instrument: ONE rate, ONE fresh process, ONE global
# pacer, no faster traffic ahead of it.
#
# WHY THE CODE SHA IS AN INPUT AND NOT A BRANCH.
#
# Run 35131981591 sat QUEUED for twenty-five minutes with `ref: <branch>`. The
# runner resolves that to the branch head when it STARTS, so three commits that
# landed while it waited would have been the code it ran. Nothing broke -- the
# executed surface was byte-identical, verified by diff -- but an experiment
# whose code is decided after it is authorised is not an experiment.
#
# So an evidence run checks out an EXPLICIT SHA and proves it on the runner
# before the first request:
#
#     DISPATCH_SHA == EXECUTED_SHA    or    EVIDENCE_RUN_VALIDITY = FAIL
#
# The check costs a failed job on mismatch. Checking afterwards would cost the
# collection window too.
#
# THE ARITHMETIC THAT CANCELLED THE LAST RUN. The pacer does not wait before
# the first request, so N requests span N-1 intervals:
#
#     300 requests at 0.25 rps  ->  299 x 4 s  =  1196 s,  NOT 1200 s
#
# Run 35131981591 was dispatched on N/rate and cancelled before it started,
# because its validation verdict was already necessarily NO. The corrected
# count is ceil(MIN_DURATION x RATE) + 1 = 301, and dispatch_check now refuses
# anything short of it at the door.
#
# THE SUPPORT FLOOR IS PACED EXPOSURE, NOT WALL CLOCK. Time spent obeying a
# venue refusal is time we were NOT operating at the rate; a 429 may never help
# a rate pass. Response latency may not carry a 1,196-second experiment to a
# "1,200-second" validation either.

name: beta48-rate-confirm

on:
  workflow_dispatch:
    inputs:
      code_sha:
        description: "IMMUTABLE commit to execute (full 40-char SHA). No default on purpose."
        required: true
      rate:
        description: "The ONE requests-per-second rate to confirm"
        required: true
      requests:
        description: "Requests (0 = the frozen floor for this rate)"
        required: false
        default: "0"
      markets:
        description: "Distinct markets to rotate through"
        required: false
        default: "6"

permissions:
  contents: write
  actions: read          # to see whether another BETTOR collector is running

concurrency:
  # THE GLOBAL PMUS VENUE-ACCESS DOMAIN. Every workflow that can reach
  # gateway.polymarket.us shares this one group, so two BETTOR collectors can
  # never read the venue at the same time and contaminate each other's
  # measurements. The ladder in run 35129103916 was reported as isolated and
  # was not: run85-phase2-capture held its own group and ran throughout.
  #
  # QUEUE, NEVER CANCEL: an evidence run must not be killed mid-collection by
  # a scheduled job. The loser waits its turn.
  group: pmus-public-read-global
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    # 1,200 s of paced requests plus backoff, with room. The job must outlast
    # its own evidence floor or dispatch_check refuses it.
    timeout-minutes: 90

    steps:
      # THE IMMUTABLE CHECKOUT. An exact commit, never a moving branch head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.code_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the one dependency
        run: python -m pip install --quiet "httpx==0.27.2" "pytest==8.3.3"

      # GATE 1. No venue contact until the capability boundary is proved.
      - name: Prove the capability boundary offline
        working-directory: research/beta48/shadow
        run: python -m pytest -q

      # GATE 2. No venue contact until the code that ran is the code that was
      # authorised. Printed, persisted, and able to stop the job.
      - name: Prove the executed revision
        working-directory: research/beta48/shadow
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          EXECUTED_SHA="$(git rev-parse HEAD)"
          echo "DISPATCH_SHA  = ${{ github.event.inputs.code_sha }}"
          echo "EXECUTED_SHA  = $EXECUTED_SHA"
          echo "WORKFLOW_REF  = ${{ github.sha }}"
          mkdir -p "evidence/rateconfirm_$SEG"
          python provenance.py \
            --dispatch-sha "${{ github.event.inputs.code_sha }}" \
            --executed-sha "$EXECUTED_SHA" \
            --workflow-ref-sha "${{ github.sha }}" \
            --workflow-file "../../../.github/workflows/beta48-rate-confirm.yml" \
            --config tick_universe.json \
            --out "evidence/rateconfirm_$SEG/provenance.json"
          echo "EXECUTED_SHA=$EXECUTED_SHA" >> "$GITHUB_ENV"

      # GATE 3. No venue contact while another BETTOR collector is reading the
      # venue. The concurrency domain should already guarantee this; this step
      # VERIFIES it at the moment the job begins rather than trusting it, and
      # aborts before the first GET rather than collecting contaminated rows.
      - name: Prove BETTOR collector isolation at start
        working-directory: research/beta48/shadow
        env:
          SEG: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=100" \
               -o /tmp/active_start.json
          python venue_domain.py --root ../../.. \
            --active-runs /tmp/active_start.json \
            --self-run-id "$SEG" \
            --mode start \
            --out "evidence/rateconfirm_$SEG/isolation_at_start.json"

      # The pre-dispatch receipt prints and persists BEFORE the first request;
      # rate_confirm refuses to send anything if any gate fails.
      - name: Single-rate operational confirmation
        working-directory: research/beta48/shadow
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          python rate_confirm.py \
            --universe tick_universe.json \
            --out "evidence/rateconfirm_$SEG" \
            --rate "${{ github.event.inputs.rate }}" \
            --markets "${{ github.event.inputs.markets || 6 }}" \
            --requests "${{ github.event.inputs.requests || 0 }}" \
            --timeout-s 5100 \
            --dispatch-sha "${{ github.event.inputs.code_sha }}" \
            --executed-sha "$EXECUTED_SHA" \
            --workflow-ref-sha "${{ github.sha }}" \
            --workflow-file "../../../.github/workflows/beta48-rate-confirm.yml"

      # Did a known collector RUN while we were reading? Only a RUNNING one is
      # a confound -- a collector queued behind us by the domain made no
      # request, and failing the run for that would punish the domain for
      # working. Records, never aborts.
      - name: Check isolation again at the end
        if: always()
        working-directory: research/beta48/shadow
        env:
          SEG: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=100" \
               -o /tmp/active_end.json
          python venue_domain.py --root ../../.. \
            --active-runs /tmp/active_end.json \
            --self-run-id "$SEG" \
            --mode during \
            --out "evidence/rateconfirm_$SEG/isolation_at_end.json" || true
          # SEAL THE RUN HISTORY. The verdict on isolation-throughout comes
          # from EXECUTION-INTERVAL OVERLAP against the evidence window, not
          # from this end snapshot -- a collector that started and finished
          # inside the window is invisible here.
          #
          # WHY THIS PAGES PER WORKFLOW, AND TO EXHAUSTION.
          #
          # The previous revision paged the whole repository until the earliest
          # run fetched was older than the window start minus the longest job
          # timeout. That was wrong. A job timeout bounds how long a run may
          # EXECUTE, not how long it may sit QUEUED first, and queue delay has
          # no bound we can prove -- so a run created long before any finite
          # cutoff can still start executing inside the window. There is no
          # sound created-at shortcut, and inventing one would dress a guess as
          # a proof.
          #
          # What IS provable is exhaustion, and it is cheap per workflow: each
          # known direct collector's own run list is walked until the API has
          # no more runs to give (short page, or total_count reached). A
          # workflow that hits the page cap without exhausting is reported
          # NOT_ESTABLISHED, never covered.
          python - <<'PYEOF' || true
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, ".")
          import venue_domain as VD

          API = "%s/repos/%s/actions" % (os.environ["API_URL"],
                                         os.environ["REPO"])
          TOK = os.environ["GH_TOKEN"]
          seg = os.environ["SEG"]
          d = pathlib.Path("evidence/rateconfirm_%s" % seg)

          def get(url):
              raw = subprocess.run(
                  ["curl", "-sS", "-H", "Authorization: Bearer %s" % TOK,
                   "-H", "Accept: application/vnd.github+json", url],
                  capture_output=True, text=True).stdout
              try:
                  return json.loads(raw)
              except Exception:
                  return None

          known = sorted(VD.venue_touching_workflows("../../.."))
          KEEP = ("id", "name", "status", "conclusion", "created_at",
                  "run_started_at", "updated_at")
          PAGE_CAP = 20                     # 2,000 runs per workflow; a bound

          # ---- STAGE 1: run/job metadata, per workflow, to exhaustion ----
          runs, pages, more = [], {}, {}
          for wf in known:
              got_all, page, exhausted = [], 1, None
              while page <= PAGE_CAP:
                  body = get("%s/workflows/%s.yml/runs?per_page=100&page=%d"
                             % (API, wf, page))
                  if body is None or "workflow_runs" not in body:
                      break                 # unreadable -> coverage unknown
                  batch = body["workflow_runs"]
                  got_all += batch
                  total = body.get("total_count")
                  page += 1
                  if len(batch) < 100 or (isinstance(total, int)
                                          and len(got_all) >= total):
                      exhausted = True
                      break
              else:
                  exhausted = False         # hit the cap with runs still there
              pages[wf] = page - 1
              if exhausted is not None:
                  more[wf] = not exhausted
              for r in got_all:
                  r["name"] = r.get("name") or wf
                  runs.append({k: r.get(k) for k in KEEP})

          # ---- STAGE 2: request times, for stage-1 CANDIDATES ONLY ----
          # A run whose execution interval never overlapped ours cannot have
          # made a request inside our window, so there is nothing to fetch for
          # it. For the few that did overlap, look for a sealed evidence branch
          # carrying that run's OWN first/last venue GET. Absent -> level B.
          # Nothing here invents a timestamp.
          start = None
          try:
              start = json.loads((d / "confirm_report.json").read_text()).get(
                  "FIRST_VENUE_GET_TIME")
          except Exception:
              pass
          windows = {}
          if start:
              probe = VD.overlap_audit(
                  start, json.loads((d / "confirm_report.json").read_text()
                                    ).get("LAST_VENUE_GET_TIME"),
                  runs, known, self_run_id=seg)
              cands = [row["ID"] for row in
                       probe["DIRECT_RUNS_OVERLAPPING_EVIDENCE_WINDOW"]]
              heads = subprocess.run(
                  ["git", "ls-remote", "--heads", "origin"],
                  capture_output=True, text=True).stdout
              for rid in cands:
                  br = "beta48-rateconfirm/seg-%s" % rid
                  if br not in heads:
                      continue              # no sealed evidence -> level B
                  subprocess.run(["git", "fetch", "-q", "origin", br],
                                 capture_output=True, text=True)
                  blob = subprocess.run(
                      ["git", "show", "FETCH_HEAD:research/beta48/shadow/"
                       "evidence/rateconfirm_%s/confirm_report.json" % rid],
                      capture_output=True, text=True).stdout
                  try:
                      rep = json.loads(blob)
                      f, l = (rep.get("FIRST_VENUE_GET_TIME"),
                              rep.get("LAST_VENUE_GET_TIME"))
                      if f and l:
                          windows[str(rid)] = [f, l]
                  except Exception:
                      pass

          (d / "run_history.json").write_text(json.dumps({
              "workflow_runs": runs,
              "HISTORY_PAGES_FETCHED": pages,
              "MORE_PAGES_AVAILABLE": more,
              "VENUE_REQUEST_WINDOWS": windows,
              "COVERAGE_REQUIRES": "API_HISTORY_EXHAUSTED",
              "NO_CREATED_AT_LOOKBACK": True,
          }, indent=1, sort_keys=True))
          PYEOF

      - name: Seal and commit the confirmation
        if: always()
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          D=research/beta48/shadow/evidence/rateconfirm_$SEG
          [ -d "$D" ] || exit 0
          ( cd "$D" && sha256sum * > SEALED.sha256 2>/dev/null || true )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="beta48-rateconfirm/seg-$SEG"
          git checkout --orphan "$BR"
          git rm -rq --cached . || true
          git add -f "$D"
          git commit -qm "BETA48 single-rate confirmation $SEG [skip render]" || exit 0
          for i in 1 2 4 8 16; do
            git push -f origin "$BR" && break
            echo "push failed, retrying in ${i}s"; sleep "$i"
          done
          echo "BETA48_RATECONFIRM_BRANCH $BR"
