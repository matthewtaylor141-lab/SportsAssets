# CAPTURE THE INCENTIVE MANIFEST, AND COMMIT IT.
#
# WHY A WORKFLOW AND NOT A LOCAL RUN. The development container's
# network policy answers 403 to CONNECT for gateway.polymarket.us --
# verified, not assumed: the agent proxy's own status endpoint reports
# `connect_rejected ... policy denial` for that host. A capture that
# cannot reach the venue is not a capture, so it runs where egress is
# open.
#
# BOUNDED. The script enforces its own ceiling in-process and records
# every request it made into the artifact it writes. `max_requests` is
# passed through so the declared preflight allowance is the enforced
# one.
#
# READ-ONLY AT THE VENUE. One unauthenticated GET /v1/incentives, with
# pagination. No credential is present in this job and none is needed.
name: incentive-manifest

on:
  workflow_dispatch:
    inputs:
      et_date:
        description: 'ET date to capture for (YYYY-MM-DD)'
        required: true
      max_requests:
        description: 'Hard ceiling on outbound requests (preflight allowance)'
        required: false
        default: '6'
      commit:
        description: 'Type COMMIT to push the manifest to this branch'
        required: false
        default: ''

# THE GLOBAL PMUS VENUE-ACCESS DOMAIN. This workflow had NO concurrency
# block at all, and it really does read the venue gateway: it runs
# research/beta48/capture_incentive_manifest.py, which imports
# sportsassets.bettor_incentive_manifest, whose INCENTIVES_URL is
# https://gateway.polymarket.us/v1/incentives. So it could run alongside
# any other venue reader -- including the calibration evidence gather that
# has to prove it owns this slot before it reads.
#
# venue_domain.audit() named it as the reason DOMAIN_AUDIT was FAIL, which
# made startup_census.post_acquisition refuse ownership with
# INCOMPATIBLE_GROUP_MEMBERSHIP. Joining the domain is the fix; relaxing
# the audit would not have been one.
concurrency:
  group: pmus-public-read-global
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture
        id: cap
        run: |
          set -o pipefail
          python research/beta48/capture_incentive_manifest.py \
            --et-date "${{ inputs.et_date }}" \
            --max-requests "${{ inputs.max_requests }}" | tee /tmp/cap.log
          echo "--- request accounting ---"
          python - <<'PY'
          import json
          m = json.load(open("research/beta48/acceptance/incentive_manifest.json"))
          r = m["capture"]["request_report"]
          print("outbound requests used:", r["used"], "of", r["cap"])
          print("pages read:", m.get("pages_read"))
          print("errors:", json.dumps(m.get("errors")))
          fp = m.get("freeze_preview") or {}
          print("freeze ok:", fp.get("ok"), "markets:", fp.get("markets"),
                "programmes:", fp.get("distinct_programs"),
                "events:", fp.get("distinct_events"))
          PY
      - name: Commit the manifest
        if: inputs.commit == 'COMMIT'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/beta48/acceptance/incentive_manifest.json
          git diff --cached --quiet && { echo "manifest unchanged"; exit 0; }
          git commit -m "Capture the incentive manifest for ${{ inputs.et_date }}

          Captured by .github/workflows/incentive-manifest.yml from a
          runner, because the development container's network policy
          answers 403 to CONNECT for gateway.polymarket.us. One
          unauthenticated GET /v1/incentives, bounded in-process, with
          the request accounting recorded inside the artifact."
          git push origin HEAD:${{ github.ref_name }}
