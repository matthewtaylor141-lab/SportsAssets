# WHALE LEDGER CENSUS (owner order 2026-08-26: "Stop taking our data at
# face value. Pull it directly from the POLYMARKET ledger and learn
# exactly what they are doing and why our system isn't capturing that
# edge they verifiably have.")
#
# Runs on a GitHub runner because the analysis container's network
# policy blocks the venue. Everything here comes from the venue's OWN
# public data API (data-api.polymarket.com) keyed by the whales' wallet
# addresses -- none of it passes through our ingestion pipeline, so it
# can disagree with our tables and the disagreement is the finding.
#
# Its own workflow (not a job in engine-diagnostic) so it can be
# triggered and re-read without waiting out the ~19-minute probe, and so
# a push cancelling the probe does not cancel this.
#
# QUESTIONS IT ANSWERS, per roster whale, from the raw ledger:
#   1. Is the account profitable by the venue's own accounting?
#      (positions realizedPnl / cashPnl, portfolio value)
#   2. What do they actually DO? Activity split: TRADE buys vs sells,
#      MERGE, REDEEM, SPLIT -- counts and USDC volumes.
#   3. The owner's round-trip thesis, tested on raw fills: shares
#      bought and then EXITED (sold or merged) inside the window --
#      what fraction exits before resolution, at what margin per
#      share, after what hold time, and how fast the freed capital
#      re-enters (the restake cadence).
#   4. Exit mechanism: of exited shares, what fraction left by SELL
#      vs MERGE vs REDEEM.
name: whale-ledger-census
on:
  workflow_dispatch:
    inputs:
      # ONE WHALE, DEEPER (management question 2026-09-05: "does he ever
      # sell his positions or buy the other side to exit?"). The roster
      # crawl is capped at 80 pages of 500 rows, which for a 37,000-buy
      # month is the month and no more; a lifetime answer needs one
      # wallet crawled to its first row. A single-whale run never
      # publishes venue P&L (a one-wallet snapshot must not replace the
      # roster's).
      whale:
        description: 'Only this username (case-insensitive); empty = whole roster'
        required: false
        default: ''
      days:
        description: 'How far back the activity crawl reaches, in days'
        required: false
        default: '30'
      max_pages:
        description: 'Activity pages of 500 rows per wallet (80 = the roster default)'
        required: false
        default: '80'
      names:
        description: 'Comma-separated names to search held positions and today rows for (e.g. swiatek,bouzkova)'
        required: false
        default: ''

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE: https://sportsassets-api.onrender.com
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      WHALE: ${{ inputs.whale }}
      DAYS: ${{ inputs.days || '30' }}
      MAX_PAGES: ${{ inputs.max_pages || '80' }}
      PAIR_NAMES: ${{ inputs.names }}
    steps:
      - name: Pull roster wallets, crawl the venue ledger, compute
        run: |
          set +e
          D="https://data-api.polymarket.com"
          echo "###########################################################"
          echo "#  WHALE LEDGER CENSUS - venue's own data, not our tables  #"
          echo "###########################################################"
          # Roster with addresses from our API (the only thing our stack
          # is trusted for here: WHO to look at, never WHAT they did).
          curl -sS --max-time 45 "$BASE/api/whales" -o /tmp/roster.json \
            || echo "ROSTER FETCH FAILED"
          jq -r '.[] | select(.active) | "\(.username) \(.address)"' \
            /tmp/roster.json > /tmp/roster.txt 2>/dev/null
          if [ -n "$WHALE" ]; then
            grep -i "^${WHALE} " /tmp/roster.txt > /tmp/roster_one.txt
            mv /tmp/roster_one.txt /tmp/roster.txt
            echo "SINGLE-WHALE RUN: whale=$WHALE days=$DAYS max_pages=$MAX_PAGES (venue P&L not published)"
          fi
          echo "ROSTER $(wc -l < /tmp/roster.txt) active whales"
          cat /tmp/roster.txt | sed 's/^/  R /'

          # Crawl DAYS days of activity per whale, at most MAX_PAGES
          # pages. The activity feed caps offset at 5000, so paging
          # advances by rows returned and, when the cap nears,
          # re-anchors with end=<oldest-1> at offset 0 -- depth via
          # time windows, not offsets. The CRAWL line prints the oldest
          # row reached, so a capped crawl says how far it got instead
          # of wearing the window's label.
          CUT=$(date -u -d "${DAYS} days ago" +%s)
          crawl () {  # $1 name  $2 address
            local out="/tmp/act_$1.json" n=0 off=0 end="" rows cnt oldest=0
            : > "$out"
            while [ $n -lt "$MAX_PAGES" ]; do
              url="$D/activity?user=$2&limit=500&offset=$off"
              [ -n "$end" ] && url="$url&end=$end"
              rows=$(curl -sS --max-time 25 "$url")
              cnt=$(echo "$rows" | jq 'length' 2>/dev/null || echo 0)
              if [ -z "$cnt" ] || [ "$cnt" = "0" ] || [ "$cnt" = "null" ]; then break; fi
              echo "$rows" | jq -c '.[]' >> "$out"
              oldest=$(echo "$rows" | jq '[.[].timestamp] | min' 2>/dev/null || echo 0)
              n=$((n+1)); off=$((off+cnt))
              if [ "$oldest" != "null" ] && [ "$oldest" -lt "$CUT" ]; then break; fi
              if [ $off -ge 4500 ]; then end=$((oldest-1)); off=0; fi
              sleep 0.35
            done
            local reached="?"
            [ "$oldest" != "null" ] && [ "$oldest" -gt 0 ] 2>/dev/null && reached=$(date -u -d "@$oldest" +%FT%TZ)
            echo "CRAWL $1 pages=$n rows=$(wc -l < "$out") oldest=$reached cut=$(date -u -d "@$CUT" +%FT%TZ) capped=$([ $n -ge "$MAX_PAGES" ] && echo yes || echo no)"
          }
          # Positions: the venue's own P&L per position.
          posget () {  # $1 name  $2 address
            local out="/tmp/pos_$1.json" off=0 n=0 rows cnt
            : > "$out"
            while [ $n -lt 20 ]; do
              rows=$(curl -sS --max-time 25 \
                "$D/positions?user=$2&limit=500&offset=$off&sizeThreshold=0")
              cnt=$(echo "$rows" | jq 'length' 2>/dev/null || echo 0)
              if [ -z "$cnt" ] || [ "$cnt" = "0" ] || [ "$cnt" = "null" ]; then break; fi
              echo "$rows" | jq -c '.[]' >> "$out"
              n=$((n+1)); off=$((off+cnt)); sleep 0.3
            done
            echo "POS $1 rows=$(wc -l < "$out")"
          }
          while read -r NAME ADDR; do
            [ -z "$ADDR" ] && continue
            crawl "$NAME" "$ADDR"
            posget "$NAME" "$ADDR"
            V=$(curl -sS --max-time 20 "$D/value?user=$ADDR" 2>/dev/null)
            echo "VALUE $NAME $V"
            # THE PROFILE P&L -- the venue's own headline number for
            # this wallet, the one the owner sees on polymarket.com.
            # The /positions realizedPnl sums are NOT this: winners
            # drop off after redemption while worthless losers persist
            # as dead rows, so that endpoint is survivorship-biased
            # toward losses and must never be quoted as a verdict.
            # user-pnl is the venue's own cumulative account P&L curve;
            # the last point is the number.
            P=$(curl -sS --max-time 25 "https://user-pnl-api.polymarket.com/user-pnl?user_address=$ADDR&interval=all&fidelity=1d" 2>/dev/null)
            LAST=$(echo "$P" | jq -r 'if type=="array" and length>0 then "points=\(length) first_t=\(.[0].t) last_t=\(.[-1].t) pnl=$\(.[-1].p)" else "unreadable" end' 2>/dev/null)
            echo "PNLHEAD $NAME $LAST"
            M=$(curl -sS --max-time 25 "https://user-pnl-api.polymarket.com/user-pnl?user_address=$ADDR&interval=1m&fidelity=1d" 2>/dev/null)
            LASTM=$(echo "$M" | jq -r 'if type=="array" and length>1 then "start=$\(.[0].p) end=$\(.[-1].p) delta=$\((.[-1].p - .[0].p) * 100 | round / 100)" else "unreadable" end' 2>/dev/null)
            echo "PNL30D $NAME $LASTM"
            # Accumulate for the production POST below: the venue's
            # number is only useful if code can read it, and the
            # container cannot reach the venue itself.
            echo "$P" | jq -c --arg n "$NAME" --arg a "$ADDR" --argjson m "$(echo "$M" | jq 'if type=="array" and length>1 then (.[-1].p - .[0].p) else null end' 2>/dev/null || echo null)" \
              'if type=="array" and length>0 then {username:$n, address:$a, alltime:.[-1].p, d30:$m, points:length, first_t:.[0].t, last_t:.[-1].t} else empty end' \
              >> /tmp/venue_pnl.jsonl 2>/dev/null || true
          done < /tmp/roster.txt

          # PUBLISH into production (display/grading input only; the
          # order path never reads it). Failure is printed, not fatal:
          # the census's own output above remains the record.
          if [ -n "$WHALE" ]; then
            echo "VENUEPNL-POST skipped: single-whale run"
          elif [ -s /tmp/venue_pnl.jsonl ]; then
            jq -s '{whales: ., source: "user-pnl-api via ledger-census"}' \
              /tmp/venue_pnl.jsonl > /tmp/venue_pnl.json
            HTTP=$(curl -sS --max-time 30 -o /tmp/vp_resp.json \
              -w "%{http_code}" -X POST \
              -H "X-Admin-Token: $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data @/tmp/venue_pnl.json \
              "$BASE/api/admin/venue-pnl" || echo 000)
            echo "VENUEPNL-POST HTTP $HTTP $(cat /tmp/vp_resp.json 2>/dev/null | head -c 200)"
          else
            echo "VENUEPNL-POST skipped: nothing accumulated"
          fi

          python3 - <<'PYEOF'
          import glob
          import json
          import os
          import statistics as st

          # The window label is the input, not a constant: a 150-day
          # single-whale crawl must not print "30d".
          W = f"{os.environ.get('DAYS', '30')}d"

          def f(x):
              try:
                  return float(x)
              except (TypeError, ValueError):
                  return 0.0

          for path in sorted(glob.glob("/tmp/act_*.json")):
              name = path.split("act_", 1)[1][:-5]
              acts, seen = [], set()
              with open(path) as fh:
                  for line in fh:
                      try:
                          a = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      # A line can parse and still not be a row -- the
                      # crawler appends whatever jq emitted, and one
                      # bare string crashed the whole analysis pass
                      # after every wallet had already printed.
                      if not isinstance(a, dict):
                          continue
                      # DEDUP. The crawl re-anchors with end=<oldest-1>
                      # when the offset cap nears; if the server ever
                      # ignores `end`, pages would repeat and every
                      # count below would silently double. A ledger
                      # census that can double-count is not a census.
                      key = (a.get("transactionHash"), a.get("asset"),
                             a.get("timestamp"), a.get("size"),
                             a.get("side"), a.get("type"))
                      if key in seen:
                          continue
                      seen.add(key)
                      acts.append(a)
              # ---- 2. what they DO: type x side, counts + USDC
              agg = {}
              for a in acts:
                  t = (a.get("type") or "?").upper()
                  side = (a.get("side") or "").upper()
                  key = f"{t}:{side}" if t == "TRADE" else t
                  usdc = f(a.get("usdcSize"))
                  n, v = agg.get(key, (0, 0.0))
                  agg[key] = (n + 1, v + usdc)
              parts = "  ".join(
                  f"{k} n={n} ${v:,.0f}" for k, (n, v) in
                  sorted(agg.items(), key=lambda kv: -kv[1][1]))
              print(f"WLV {name} ACT{W}: {parts}")

              # ---- 3. round trips per asset: entries matched to exits
              by_asset = {}
              for a in sorted(acts, key=lambda x: x.get("timestamp") or 0):
                  t = (a.get("type") or "").upper()
                  side = (a.get("side") or "").upper()
                  asset = a.get("asset") or a.get("conditionId") or ""
                  if not asset:
                      continue
                  sh, usdc = f(a.get("size")), f(a.get("usdcSize"))
                  ts = a.get("timestamp") or 0
                  b = by_asset.setdefault(asset, {
                      "bsh": 0.0, "busd": 0.0, "xsh": 0.0, "xusd": 0.0,
                      "mech": {}, "bt": [], "xt": []})
                  if t == "TRADE" and side == "BUY":
                      b["bsh"] += sh; b["busd"] += usdc; b["bt"].append(ts)
                  elif ((t == "TRADE" and side == "SELL")
                        or t in ("MERGE", "REDEEM")):
                      mech = "SELL" if t == "TRADE" else t
                      b["xsh"] += sh; b["xusd"] += usdc; b["xt"].append(ts)
                      b["mech"][mech] = b["mech"].get(mech, 0.0) + sh
              bought = sum(b["bsh"] for b in by_asset.values())
              buy_usd = sum(b["busd"] for b in by_asset.values())
              exited, exit_usd, margin_usd = 0.0, 0.0, 0.0
              holds, restakes, mech_all = [], [], {}
              pre_resolution = 0.0
              for b in by_asset.values():
                  if b["bsh"] <= 0:
                      continue
                  m = min(b["bsh"], b["xsh"])   # shares that round-tripped
                  if m <= 0:
                      continue
                  exited += m
                  cost_ps = b["busd"] / b["bsh"]
                  proc_ps = b["xusd"] / b["xsh"] if b["xsh"] else 0.0
                  exit_usd += m * proc_ps
                  margin_usd += m * (proc_ps - cost_ps)
                  # REDEEM is post-resolution; SELL/MERGE are the
                  # pre-resolution exits the owner is pointing at
                  nonredeem = sum(v for k, v in b["mech"].items()
                                  if k != "REDEEM")
                  pre_resolution += min(m, nonredeem)
                  for k, v in b["mech"].items():
                      mech_all[k] = mech_all.get(k, 0.0) + v
                  if b["bt"] and b["xt"]:
                      holds.append((st.median(b["xt"])
                                    - st.median(b["bt"])) / 60.0)
              # restake cadence: exit anywhere -> next entry anywhere
              exits_ts = sorted(ts for b in by_asset.values()
                                for ts in b["xt"])
              buys_ts = sorted(ts for b in by_asset.values()
                               for ts in b["bt"])
              j = 0
              for xt in exits_ts:
                  while j < len(buys_ts) and buys_ts[j] <= xt:
                      j += 1
                  if j < len(buys_ts):
                      restakes.append((buys_ts[j] - xt) / 60.0)
              if bought > 0:
                  mstr = " ".join(f"{k}={v:,.0f}sh"
                                  for k, v in sorted(mech_all.items()))
                  print(
                      f"WLV {name} RT{W}: bought={bought:,.0f}sh "
                      f"(${buy_usd:,.0f})  exited={exited:,.0f}sh "
                      f"({exited / bought:.1%})  pre_resolution="
                      f"{pre_resolution / bought:.1%}  "
                      f"margin=${margin_usd:,.0f} "
                      f"({(margin_usd / (exit_usd - margin_usd)) if exit_usd - margin_usd else 0:+.2%} on exited cost)  "
                      f"hold_med={st.median(holds):,.0f}min "
                      f"restake_med={st.median(restakes):,.0f}min"
                      if holds and restakes else
                      f"WLV {name} RT{W}: bought={bought:,.0f}sh "
                      f"exited={exited:,.0f}sh (insufficient timing data)")
                  print(f"WLV {name} EXITMECH: {mstr}")

          # ---- 1. venue's own P&L verdict from positions
          for path in sorted(glob.glob("/tmp/pos_*.json")):
              name = path.split("pos_", 1)[1][:-5]
              pos = []
              with open(path) as fh:
                  for line in fh:
                      try:
                          row = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      # Run 4 (2026-09-05) died here on a whale whose
                      # positions file held a bare JSON string (the
                      # venue's error text) among the rows: a str has
                      # no .get. Only objects are positions.
                      if isinstance(row, dict):
                          pos.append(row)
              if not pos:
                  print(f"WLV {name} POS: none returned")
                  continue
              rp = sum(f(p.get("realizedPnl")) for p in pos)
              cp = sum(f(p.get("cashPnl")) for p in pos)
              cur = sum(f(p.get("currentValue")) for p in pos)
              ini = sum(f(p.get("initialValue")) for p in pos)
              print(f"WLV {name} POS: n={len(pos)} realizedPnl=${rp:,.0f} "
                    f"cashPnl=${cp:,.0f} currentValue=${cur:,.0f} "
                    f"initialValue=${ini:,.0f}")

              # ---- 4. BOTH SIDES OF ONE MATCH (owner question 2026-09-05:
              # "does HomeRunHazard take both sides of the same match?").
              # A match market is one conditionId with two outcome tokens,
              # so holding both outcomes of one conditionId IS holding
              # both sides. Read from the venue's positions (held now) and
              # from today's ledger rows (bought today; settled today =
              # REDEEM today). Every row is the venue's own; nothing here
              # passes through our tables.
              import datetime as dt
              day0 = int(dt.datetime.now(dt.timezone.utc)
                         .replace(hour=0, minute=0, second=0, microsecond=0)
                         .timestamp())
              def label(r):
                  return (r.get("title") or r.get("slug") or r.get("eventSlug")
                          or r.get("conditionId") or "?")
              held = {}
              for p in pos:
                  cid = p.get("conditionId")
                  if not cid or f(p.get("size")) <= 0:
                      continue
                  held.setdefault(cid, {"title": label(p), "sides": {}})
                  held[cid]["sides"][str(p.get("outcome"))] = f(p.get("size"))
              both_held = {c: v for c, v in held.items() if len(v["sides"]) >= 2}
              print(f"WLV {name} PAIRS-HELD: conditions_held={len(held)} "
                    f"both_sides_held={len(both_held)}")
              for c, v in sorted(both_held.items(), key=lambda kv: kv[1]["title"])[:40]:
                  sides = "  ".join(f"{o}={s:,.0f}sh" for o, s in sorted(v["sides"].items()))
                  print(f"WLV {name} PAIR-HELD: {v['title']} | {sides}")
              acts = []
              apath = f"/tmp/act_{name}.json"
              try:
                  with open(apath) as fh:
                      for line in fh:
                          try:
                              a = json.loads(line)
                          except json.JSONDecodeError:
                              continue
                          if isinstance(a, dict):
                              acts.append(a)
              except OSError:
                  pass
              today = [a for a in acts if (a.get("timestamp") or 0) >= day0]
              bought = {}
              for a in today:
                  if (a.get("type") or "").upper() != "TRADE" or (a.get("side") or "").upper() != "BUY":
                      continue
                  cid = a.get("conditionId")
                  if not cid:
                      continue
                  bought.setdefault(cid, {"title": label(a), "sides": {}})
                  o = str(a.get("outcome"))
                  bought[cid]["sides"][o] = bought[cid]["sides"].get(o, 0.0) + f(a.get("size"))
              both_bought = {c: v for c, v in bought.items() if len(v["sides"]) >= 2}
              print(f"WLV {name} PAIRS-TODAY: buys={sum(1 for a in today if (a.get('type') or '').upper() == 'TRADE')} "
                    f"conditions_bought={len(bought)} both_sides_bought={len(both_bought)}")
              for c, v in sorted(both_bought.items(), key=lambda kv: kv[1]["title"])[:40]:
                  sides = "  ".join(f"{o}={s:,.0f}sh" for o, s in sorted(v["sides"].items()))
                  print(f"WLV {name} PAIR-TODAY: {v['title']} | {sides}")
              # settled today = REDEEM rows today; for each, which sides
              # did he ever BUY in the crawl window
              all_bought = {}
              for a in acts:
                  if (a.get("type") or "").upper() == "TRADE" and (a.get("side") or "").upper() == "BUY" and a.get("conditionId"):
                      all_bought.setdefault(a["conditionId"], set()).add(str(a.get("outcome")))
              settled = {}
              for a in today:
                  if (a.get("type") or "").upper() == "REDEEM" and a.get("conditionId"):
                      settled.setdefault(a["conditionId"], label(a))
              settled_both = {c: t for c, t in settled.items() if len(all_bought.get(c, ())) >= 2}
              print(f"WLV {name} PAIRS-SETTLED-TODAY: settled_conditions={len(settled)} "
                    f"of_which_he_bought_both_sides={len(settled_both)} (sides judged over the crawl window)")
              for c, t in sorted(settled_both.items(), key=lambda kv: kv[1])[:40]:
                  print(f"WLV {name} PAIR-SETTLED: {t} | sides bought: {', '.join(sorted(all_bought[c]))}")
              # NAME SEARCH (env PAIR_NAMES, comma-separated): every held
              # position and every ledger row today whose title, slug,
              # event or outcome carries the name.
              names = [n.strip().lower() for n in os.environ.get("PAIR_NAMES", "").split(",") if n.strip()]
              def hit(r):
                  blob = " ".join(str(r.get(k) or "") for k in ("title", "slug", "eventSlug", "outcome")).lower()
                  return [n for n in names if n in blob]
              for p in pos:
                  h = hit(p)
                  if h:
                      print(f"WLV {name} NAME-HELD [{','.join(h)}]: {label(p)} | outcome={p.get('outcome')} "
                            f"size={f(p.get('size')):,.0f}sh avg={f(p.get('avgPrice')):.3f} cur={f(p.get('curPrice')):.3f} "
                            f"end={p.get('endDate')} redeemable={p.get('redeemable')} cid={p.get('conditionId')}")
              for a in sorted(today, key=lambda x: x.get("timestamp") or 0):
                  h = hit(a)
                  if h:
                      ts = dt.datetime.fromtimestamp(a.get("timestamp") or 0, dt.timezone.utc).strftime("%H:%M:%SZ")
                      print(f"WLV {name} NAME-TODAY [{','.join(h)}]: {ts} {a.get('type')} {a.get('side') or ''} "
                            f"{label(a)} | outcome={a.get('outcome')} size={f(a.get('size')):,.0f}sh "
                            f"usdc=${f(a.get('usdcSize')):,.0f} price={f(a.get('price')):.3f} cid={a.get('conditionId')}")
              if names:
                  print(f"WLV {name} NAME-SEARCH done: names={names} held_rows={len(pos)} today_rows={len(today)}")
          PYEOF
