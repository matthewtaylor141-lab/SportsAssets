# A twenty-second read of the API from the outside (2026-09-05).
#
# During the disk-full outage and the recovery after it, the only external
# eyes on the platform were the 16-32 minute engine-diagnostic probe and the
# gate-lever's two admin reads -- neither prints the HTTP status code, so
# "UNAVAILABLE" could not tell a 502 (no healthy instance: a failed deploy,
# a crash loop) from a hang (DB reads timing out) from a 200 with a broken
# body. This job asks /healthz three times with the code and the timing,
# then the heartbeat table, and prints exactly what came back. Nothing here
# changes state; there is no token in the healthz read and the heartbeat
# read is the same public one the probe makes. The second step reads the
# agent pages and the paper account with GETs only (ADMIN_TOKEN, read role).
name: ping

on:
  workflow_dispatch:
    inputs:
      demo:
        description: "blank = read-only ping only; chat-voice = also run the authorized agent chat + speech demonstration (writes conversation records only); narration = fetch the stored speech for tools/narration/narration-manifest.json (speech reads only)"
        required: false
        default: ""
      verify:
        description: "site-voice = after a release: set each agent's voice through the audited persona route, speak once per agent, and render the production homepage and agent pages in mobile WebKit and phone-sized Chromium (authenticated and signed out); film = follow the homepage demo link and play the whole cinematic film signed in (prepares each chapter through the agent persona chat + stored speech; writes conversation records only), measuring voices, music and 3D frames; office = drive the management office pages against the persisted records with chat/voice timings (writes conversation records only); experiment = read the paper experiment API and render the homepage and agent pages signed in, checking the same positions, fills and cash (read-only); talk = drive the Talk-to-agent panels on /derek /xavier /audrey (typed question, follow-up, refresh-resume, spoken question via a fake microphone, voice reply, permission-denied and a simulated provider error) in desktop + phone Chromium and WebKit iPhone 13 (writes conversation records only); pinnapi = fetch the PinnAPI public docs (no key) and run the read-only in-API probe: key names, then at most 6 authenticated GETs (writes nothing, opens no stream); research = read the research worker control and work (GET only); research-apply = enable the research worker and create the three owner goals through the authenticated capability controls (idempotent request ids); research-reissue-xavier = open one new flow for Xavier's owner goal (v3 request id)"
        required: false
        default: ""
      terms_slugs:
        description: "optional comma-separated venue slugs: read each contract's published rules prose through POST /api/admin/venue-settlement-probe (read-only GETs at the venue; writes nothing)"
        required: false
        default: ""
      pinnapi_paths:
        description: "verify=pinnapi only: optional comma-separated RELATIVE PinnAPI paths for the in-API probe (max 6 GETs, >= 1 s apart; the key stays in the API). Blank = /health only. The public docs are always fetched (no key)."
        required: false
        default: ""
      pinnapi_ws:
        description: "verify=pinnapi only: optional comma-separated PinnAPI sport ids (e.g. 6,1) for a bounded <= 20 s raw WebSocket sample in the API, taken under the feed owner's lease (refused while the production socket is open). Blank = no sample."
        required: false
        default: ""
      team_slugs:
        description: "verify=team-logos only: comma-separated venue market slugs whose sides carry those teams (the venue market record's team object, incl. logo)"
        required: false
        default: ""
      team_ids:
        description: "verify=team-logos only: comma-separated VENUE team ids (us_premap.team_id) whose venue team records and logo images are fetched from the venue's public gateway (no key) with provenance, and committed to claude/site-verify-evidence"
        required: false
        default: ""
      pinnapi_feed:
        description: "verify=pinnapi only: blank = no feed call; state = read the C1 feed owner state (GET); on / off = write the 'pinnapi_feed' arm row through POST /api/admin/pinnapi-feed/{on|off} (read-back returned), then read the state. C1 is observe-only: it changes no decision."
        required: false
        default: ""

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read /healthz and the service heartbeats
        shell: bash
        env:
          BASE: https://sportsassets-api.onrender.com
        run: |
          set +e
          set -u
          for i in 1 2 3; do
            rm -f /tmp/hz.json /tmp/hz.err
            code=$(curl -sS --max-time 20 -o /tmp/hz.json -w '%{http_code} in %{time_total}s' "$BASE/healthz" 2>/tmp/hz.err)
            echo "healthz #$i at $(date -u +%H:%M:%S)Z: HTTP ${code:-none}"
            if [ -s /tmp/hz.json ]; then echo "  body: $(head -c 600 /tmp/hz.json)"; fi
            if [ -s /tmp/hz.err ]; then echo "  curl: $(cat /tmp/hz.err)"; fi
            sleep 5
          done
          rm -f /tmp/svc.json
          code=$(curl -sS --max-time 30 -o /tmp/svc.json -w '%{http_code} in %{time_total}s' "$BASE/api/health/services" 2>/dev/null)
          echo "services at $(date -u +%H:%M:%S)Z: HTTP ${code:-none}"
          if [ -s /tmp/svc.json ]; then
            jq -r '.[]? | "  \(.service) \(.status) beat=\(.beat_at)"' /tmp/svc.json 2>/dev/null \
              || echo "  body (not JSON): $(head -c 400 /tmp/svc.json)"
          fi
          exit 0

      - name: Agent pages and the paper account strip (READ-ONLY)
        shell: bash
        env:
          BASE: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # GETs only. The three management URLs must serve the agent shell
          # (status 200, the address kept by the netlify rewrite), paper.js
          # must be published, and with a COMMAND role the framed pages,
          # the one paper ledger and the agents' state must read back.
          # Chat and speech are POST routes that write conversation
          # records, so only their configuration status is read here.
          set +e
          HOST="command.bettortoken.com"
          API="$BASE"
          {
            echo "### Agent pages"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for path in /derek /xavier /audrey /paper.js /agent.html /live.html /live.js; do
            code=$(curl -s -o /tmp/pg -w '%{http_code}' --max-time 25 "https://$HOST$path" || echo 000)
            printf '%-12s %s %s bytes  frames-agent-page:%s  account-strip:%s\n' "$path" "$code" \
              "$(wc -c < /tmp/pg)" "$(grep -c 'agents/.*page\|/page' /tmp/pg)" \
              "$(grep -c 'paper/account' /tmp/pg)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          curl -s --max-time 25 "https://$HOST/" > /tmp/home
          curl -s --max-time 25 "https://$HOST/app.js" > /tmp/appjs
          echo "homepage loads paper.js: $(grep -c 'paper.js' /tmp/home)  app.js OUR AGENTS nav: $(grep -c 'OUR AGENTS' /tmp/appjs)  links: $(grep -o 'href="/\(derek\|xavier\|audrey\)"' /tmp/appjs | sort -u | tr '\n' ' ')" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "SKIPPED authenticated reads: no ADMIN_TOKEN secret" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          for a in derek xavier audrey; do
            code=$(curl -s -o /tmp/ap -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/agents/$a/page" || echo 000)
            echo "api agents/$a/page HTTP $code $(wc -c < /tmp/ap) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          code=$(curl -s -o /tmp/acct.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/paper/account?entries=5" || echo 000)
          echo "paper/account HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c 'del(.ledger) | {account, session, last_updated_at, drawdown_status: .drawdown.status}' /tmp/acct.json 2>&1 \
            | cut -c1-2500 | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '.ledger | {status, why, entries: ((.data.entries // .data // []) | if type == "array" then map({seq: (.sequence // .seq), kind, cash_after_usd, reserved_after_usd}) else . end)}' /tmp/acct.json 2>&1 \
            | cut -c1-1500 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/bm.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/paper/benchmark" || echo 000)
          echo "paper/benchmark HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '.' /tmp/bm.json 2>/dev/null | cut -c1-6000 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/ag.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/agents" || echo 000)
          echo "agents HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '.' /tmp/ag.json 2>/dev/null | cut -c1-2000 | tee -a "$GITHUB_STEP_SUMMARY"
          # Small Live · Paper vs Actual: signed out through the published
          # proxy must be refused; with the read role the summary reads back.
          echo "small-live signed out via $HOST: HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "https://$HOST/api/command/small-live" || echo 000)" | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/sl.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/small-live?limit=5" || echo 000)
          echo "small-live HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c 'del(.rows) | del(.basis)' /tmp/sl.json 2>/dev/null | cut -c1-3000 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/ps.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/agents/persona-status" || echo 000)
          echo "persona-status HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '{chat_llm: .chat.llm, voice: .speech.voice, personas}' /tmp/ps.json 2>/dev/null \
            | cut -c1-1500 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  demo:
    # AUTHORIZED DEMONSTRATION, OFF UNLESS demo == chat-voice. Each agent is
    # asked one grounded question about the live paper session (POST .../chat
    # writes a conversation record and nothing else), then one stored
    # assistant message per agent is spoken (POST .../speak, audio bytes
    # counted, not printed). No paper ledger, session, order or directive.
    if: ${{ inputs.demo == 'chat-voice' }}
    runs-on: ubuntu-latest
    steps:
      - name: Chat and voice for Derek, Xavier and Audrey
        shell: bash
        env:
          API: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set +e
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "no ADMIN_TOKEN secret"; exit 1; }
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          code=$(curl -s -o /tmp/acct.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/paper/account?entries=5")
          echo "paper/account HTTP $code"
          jq -c '{session: .session.session_id, active: .session.active, cash: .account.data.cash_usd, reserved: .account.data.reserved_usd, available: .account.data.available_usd, ledger_entries: .account.data.ledger_entries, consistent: .account.data.ledger_consistent}' /tmp/acct.json
          Q="What are the paper account's cash, reserved and available balances right now, which paper session is running, and what have you decided today and why? Cite the records."
          RID_BASE="demo-$(date -u +%Y%m%dT%H%M%S)"
          for a in derek xavier audrey; do
            echo "================ $a ================"
            body=$(jq -nc --arg m "$Q" --arg r "$RID_BASE-$a" '{message:$m, request_id:$r}')
            code=$(curl -s -o /tmp/chat_$a.json -w '%{http_code}' --max-time 120 -X POST -H "$H" \
                   -H "Content-Type: application/json" -d "$body" "$API/api/command/agents/$a/chat")
            echo "chat HTTP $code"
            jq -r 'keys | join(",")' /tmp/chat_$a.json 2>/dev/null | sed 's/^/keys: /'
            jq -c '{status, agent, role, conversation_id, user_message_id, assistant_message_id, message_id, provider: (.provider // .llm // null), persona: .persona.display_name}' /tmp/chat_$a.json 2>/dev/null
            echo "--- answer ---"
            jq -r '(.reply.text // .answer // .text // .assistant.text // .message.text // .reply // "") | tostring' /tmp/chat_$a.json 2>/dev/null | cut -c1-1800
            echo "--- grounding ---"
            jq -c '(.facts // .grounding // .citations // .reply.citations // null)' /tmp/chat_$a.json 2>/dev/null | cut -c1-1500
            [ "$code" = "200" ] || head -c 1200 /tmp/chat_$a.json; echo
            MID=$(jq -r '.assistant_message_id // .reply.message_id // .message_id // .assistant.message_id // empty' /tmp/chat_$a.json 2>/dev/null)
            echo "speak message_id=$MID"
            if [ -n "$MID" ]; then
              code=$(curl -s -D /tmp/sh_$a.txt -o /tmp/speak_$a.bin -w '%{http_code}' --max-time 120 -X POST -H "$H" \
                     -H "Content-Type: application/json" -d "$(jq -nc --arg m "$MID" '{message_id:$m}')" "$API/api/command/agents/$a/speak")
              echo "speak HTTP $code bytes=$(wc -c < /tmp/speak_$a.bin) $(grep -i '^content-type' /tmp/sh_$a.txt | tr -d '\r') $(grep -i '^x-speech' /tmp/sh_$a.txt | tr -d '\r' | tr '\n' ' ')"
              [ "$code" = "200" ] || head -c 600 /tmp/speak_$a.bin; echo
            fi
          done
          code=$(curl -s -o /tmp/acct2.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/paper/account?entries=5")
          echo "paper/account after HTTP $code"
          jq -c '{session: .session.session_id, cash: .account.data.cash_usd, reserved: .account.data.reserved_usd, available: .account.data.available_usd, ledger_entries: .account.data.ledger_entries}' /tmp/acct2.json

  venue-terms:
    # READ-ONLY. The admin probe makes two GETs per slug at the venue (the
    # settlement endpoint and the listing) through the existing reader and
    # returns the listing's prose verbatim with the production reader's
    # per-condition reading. It writes nothing and submits nothing.
    if: ${{ inputs.terms_slugs != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Venue rules prose for the named contracts
        shell: bash
        env:
          API: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SLUGS: ${{ inputs.terms_slugs }}
        run: |
          set +e
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "no ADMIN_TOKEN secret"; exit 1; }
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          body=$(jq -nc --arg s "$SLUGS" '{slugs: ($s | split(",") | map(gsub("\\s"; "")) | map(select(length > 0)))}')
          code=$(curl -s -o /tmp/probe.json -w '%{http_code}' --max-time 120 -X POST -H "$H" \
                 -H "Content-Type: application/json" -d "$body" "$API/api/admin/venue-settlement-probe")
          echo "probe HTTP $code at $(date -u +%FT%TZ)"
          jq -r '(.results // .slugs // .probes // [])[]? | "== \(.slug // .market_slug)\n" +
                 ((.settlement_terms // {}) | "field=\(.field) chars=\(.chars) truncated=\(.truncated)\nTEXT: \(.text)\nstated: \(.stated | tojson)\nnot_stated: \(.not_stated | tojson)\ncontradicted: \(.contradicted | tojson)")' /tmp/probe.json 2>/dev/null
          echo "== keys: $(jq -c 'keys' /tmp/probe.json 2>/dev/null)"
          [ "$code" = "200" ] || head -c 1500 /tmp/probe.json

  pinnapi:
    # READ-ONLY, OFF UNLESS verify == pinnapi.
    # 1. PUBLIC DOCS: the provider's public documentation pages fetched from
    #    this runner with NO key (the session container's egress cannot reach
    #    pinnapi.com), committed to the evidence branch so the adapter is
    #    written from the current documentation.
    # 2. IN THE API, where the owner installed `pinnapi_key`: POST
    #    /api/admin/pinnapi-probe -- which key NAMES are present (never a
    #    value, length or prefix), then at most 6 authenticated GETs to the
    #    given relative provider paths, >= 1 s apart, returning status,
    #    timing, rate-limit headers and a sanitized structure. The key never
    #    leaves the API. No stream is opened (an extra stream consumer could
    #    displace the production connection), nothing is written at the
    #    provider or in the database, nothing is ordered.
    if: ${{ inputs.verify == 'pinnapi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Public documentation (no key)
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pinn/docs
          for u in llms-full.txt llms.txt docs pinnacle-websocket-api pricing; do
            f="/tmp/pinn/docs/$(echo "$u" | tr '/.' '__').txt"
            code=$(curl -sS -L --max-time 40 --max-filesize 6000000 -o "$f" -w '%{http_code}' "https://pinnapi.com/$u")
            echo "$u HTTP $code bytes $(wc -c < "$f" 2>/dev/null || echo 0)" | tee -a /tmp/pinn/docs/index.txt
          done
      - name: Key names and authenticated readiness (in the API)
        shell: bash
        env:
          API: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PATHS: ${{ inputs.pinnapi_paths }}
          WS: ${{ inputs.pinnapi_ws }}
          FEED: ${{ inputs.pinnapi_feed }}
        run: |
          set +e
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "no ADMIN_TOKEN secret"; exit 0; }
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          code=$(curl -s -o /tmp/pinn/keys.json -w '%{http_code}' --max-time 30 -X POST -H "$H" \
                 -H "Content-Type: application/json" -d '{"action":"keys"}' "$API/api/admin/pinnapi-probe")
          echo "keys HTTP $code"; jq -c . /tmp/pinn/keys.json 2>/dev/null || head -c 300 /tmp/pinn/keys.json
          [ "$code" = "200" ] || { echo "probe route not deployed on the serving build (HTTP $code); docs only"; exit 0; }
          case "$FEED" in
            on|off)
              code=$(curl -s -o /tmp/pinn/feed_$FEED.json -w '%{http_code}' --max-time 30 -X POST -H "$H" "$API/api/admin/pinnapi-feed/$FEED")
              echo "feed $FEED HTTP $code at $(date -u +%FT%TZ)"; jq -c . /tmp/pinn/feed_$FEED.json 2>/dev/null || head -c 300 /tmp/pinn/feed_$FEED.json
              sleep 20 ;;
          esac
          if [ -n "$FEED" ]; then
            code=$(curl -s -o /tmp/pinn/feed_state.json -w '%{http_code}' --max-time 30 -H "$H" "$API/api/admin/pinnapi-feed/state")
            echo "feed state HTTP $code at $(date -u +%FT%TZ)"
            jq -c '{this_process: (.this_process | {state, refused, enabled_env, c1_decision_effect}), arm: .rows.pinnapi_feed, scope: .rows.pinnapi_feed_scope, heartbeat: (.rows.pinnapi_feed_last // {} | {state, refused, beat_at, sport_ids, streams, transitions, cache, coverage_census})}' /tmp/pinn/feed_state.json 2>/dev/null | head -c 6000 || head -c 600 /tmp/pinn/feed_state.json
            echo
          fi
          code=$(curl -s -o /tmp/pinn/account.json -w '%{http_code}' --max-time 30 -X POST -H "$H" \
                 -H "Content-Type: application/json" -d '{"action":"account"}' "$API/api/admin/pinnapi-probe")
          echo "account HTTP $code (entitlement fields only)"; jq -c . /tmp/pinn/account.json 2>/dev/null | head -c 3000; echo
          sleep 1
          [ -n "$PATHS" ] || PATHS="/health"
          body=$(jq -nc --arg s "$PATHS" '{action: "rest", paths: ($s | split(",") | map(gsub("\\s"; "")) | map(select(length > 0)))}')
          code=$(curl -s -o /tmp/pinn/rest.json -w '%{http_code}' --max-time 120 -X POST -H "$H" \
                 -H "Content-Type: application/json" -d "$body" "$API/api/admin/pinnapi-probe")
          echo "rest HTTP $code at $(date -u +%FT%TZ)"
          jq -r '.reads[]? | "\(.path) http=\(.http) ok=\(.ok) ms=\(.elapsed_ms) ratelimit=\(.rate_limit_headers|tojson) inventory=\(.inventory|tojson)"' /tmp/pinn/rest.json 2>/dev/null
          if [ -n "$WS" ]; then
            body=$(jq -nc --arg s "$WS" '{action: "ws_sample", seconds: 15, streams: ["live","prematch"], sport_ids: ($s | split(",") | map(gsub("\\s"; "")) | map(select(length > 0)) | map(tonumber))}')
            code=$(curl -s -o /tmp/pinn/ws_sample.json -w '%{http_code}' --max-time 90 -X POST -H "$H" \
                   -H "Content-Type: application/json" -d "$body" "$API/api/admin/pinnapi-probe")
            echo "ws_sample HTTP $code at $(date -u +%FT%TZ)"
            jq -c '{ok, reason, connect_ms, frames, bytes, pongs_sent, frame_kinds, live_topics, snapshot_events, errors, connect_error, provider_stamp_to_receipt_ms}' /tmp/pinn/ws_sample.json 2>/dev/null || head -c 600 /tmp/pinn/ws_sample.json
          fi
      - uses: actions/checkout@v4
        if: always()
      - name: Commit the evidence
        if: always()
        shell: bash
        run: |
          set +e
          RUN="${GITHUB_RUN_ID}"
          D="evidence/pinnapi/$(date -u +%Y%m%dT%H%M%SZ)_run$RUN"
          git config user.name "site-verify"
          git config user.email "site-verify@users.noreply.github.com"
          for try in 1 2 3 4; do
            git fetch -q origin claude/site-verify-evidence && git checkout -q -f -B ev origin/claude/site-verify-evidence || git checkout -q --orphan ev
            git rm -rq --cached . >/dev/null 2>&1 || true
            mkdir -p "$D" && cp -r /tmp/pinn/. "$D"/
            git add "$D" && git commit -q -m "pinnapi evidence, run $RUN" && git push -q origin ev:claude/site-verify-evidence && { echo "evidence pushed: $D"; break; }
            echo "push attempt $try failed (concurrent evidence push?); retrying"; sleep $((try * 5))
          done

  site-voice:
    # POST-RELEASE VERIFICATION, OFF UNLESS verify == site-voice.
    # The screenshots and report are also committed to the evidence branch
    # claude/site-verify-evidence (never the protected branch) so they can be
    # read where the artifact store cannot be reached.
    # 1. VOICE: appends one persona version per agent naming an ElevenLabs
    #    PUBLIC PREMADE voice id from that profile's own preferred names
    #    (audited, versioned; the server key lacks voices_read, so the list
    #    cannot be read and names cannot be matched), forces a resolution, asks
    #    one grounded question and speaks the stored answer. Audio bytes are
    #    counted, never printed; the key never leaves the server.
    # 2. BROWSER: tools/site_verify/verify.mjs (read-only GETs).
    if: ${{ inputs.verify == 'site-voice' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Voice through the configured provider
        shell: bash
        env:
          API: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set +e
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "no ADMIN_TOKEN secret"; exit 1; }
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          for pair in derek:TX3LPaxmHKxFdv7VOQHJ:Liam xavier:nPczCjzI2devNBz1zQrb:Brian audrey:XB0fDUnXU5powFXDhCwa:Charlotte; do
            a=${pair%%:*}; rest=${pair#*:}; vid=${rest%%:*}; name=${rest#*:}
            echo "================ $a ($name $vid) ================"
            body=$(jq -nc --arg v "$vid" --arg n "$name" '{reason: ("voice: ElevenLabs public premade voice " + $n + " (the server key cannot list voices: voices_read missing)"), changes: {voice_profile: {voice_id: $v}}}')
            code=$(curl -s -o /tmp/p_$a.json -w '%{http_code}' --max-time 45 -X POST -H "$H" -H "Content-Type: application/json" -d "$body" "$API/api/command/agents/$a/persona")
            echo "persona append HTTP $code $(jq -c '{ok, version: .profile.version, refusal}' /tmp/p_$a.json 2>/dev/null)"
            code=$(curl -s -o /tmp/r_$a.json -w '%{http_code}' --max-time 45 -X POST -H "$H" "$API/api/command/agents/$a/persona/voice/resolve")
            echo "resolve HTTP $code $(jq -c '.resolution | {status, method, voice_id, reason}' /tmp/r_$a.json 2>/dev/null)"
            q=$(jq -nc --arg r "verify-$a-$(date -u +%s)" '{message: "In two sentences: what is your role, and what is the paper account cash right now? Cite the record.", request_id: $r}')
            code=$(curl -s -o /tmp/c_$a.json -w '%{http_code}' --max-time 120 -X POST -H "$H" -H "Content-Type: application/json" -d "$q" "$API/api/command/agents/$a/chat")
            MID=$(jq -r '.message_id // empty' /tmp/c_$a.json)
            echo "chat HTTP $code message_id=$MID"
            jq -r '.answer // .' /tmp/c_$a.json | head -c 900; echo
            [ -n "$MID" ] || continue
            code=$(curl -s -D /tmp/sh_$a.txt -o /tmp/s_$a.bin -w '%{http_code}' --max-time 120 -X POST -H "$H" -H "Content-Type: application/json" -d "$(jq -nc --arg m "$MID" '{message_id:$m}')" "$API/api/command/agents/$a/speak")
            echo "speak HTTP $code bytes=$(wc -c < /tmp/s_$a.bin) $(grep -i '^content-type' /tmp/sh_$a.txt | tr -d '\r')"
            if [ "$code" != "200" ]; then head -c 900 /tmp/s_$a.bin; echo; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render the production pages (WebKit iPhone 13 and Chromium 390x844)
        timeout-minutes: 25
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          OUT: site_verify_out
        run: |
          set +e
          echo "::add-mask::$ADMIN_TOKEN"
          cd tools/site_verify
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps webkit chromium >/dev/null 2>&1
          node verify.mjs
      - name: Commit the screenshots to the evidence branch
        if: always()
        shell: bash
        run: |
          set +e
          RUN="${GITHUB_RUN_ID}"
          D="evidence/site_verify/$(date -u +%Y%m%dT%H%M%SZ)_run$RUN"
          git config user.name "site-verify"
          git config user.email "site-verify@users.noreply.github.com"
          git fetch -q origin claude/site-verify-evidence && git checkout -q -B ev origin/claude/site-verify-evidence || git checkout -q --orphan ev
          git rm -rq --cached . >/dev/null 2>&1
          mkdir -p "$D" && cp tools/site_verify/site_verify_out/* "$D"/ 2>/dev/null
          git add "$D" && git commit -q -m "site verify evidence, run $RUN" && git push -q origin ev:claude/site-verify-evidence && echo "evidence pushed: $D"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-verify-screenshots
          path: tools/site_verify/site_verify_out
          retention-days: 7

