  research:
    # OFF UNLESS verify == research (read-only) or research-apply.
    # Runs the completion package's activation script (tools/research/
    # activate_research.py) through the existing authenticated capability
    # controls with the ADMIN_TOKEN secret, which never leaves the runner's
    # environment and is masked. research = read the control, heartbeat and
    # work (GET only). research-apply = enable the research worker
    # (hourly_limit 24) and create the three owner goals (coverage/DEREK,
    # modeling/XAVIER, audit/AUDREY) with fixed request ids, so a repeat run
    # is idempotent; then read the work and its events back. Paper research
    # only: no order, policy activation or funded path is reachable here.
    if: ${{ inputs.verify == 'research' || inputs.verify == 'research-apply' || inputs.verify == 'research-reissue-xavier' || inputs.verify == 'research-improve-stale' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Activation script (authenticated control route)
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MODE: ${{ inputs.verify }}
        run: |
          set +e
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "no ADMIN_TOKEN secret"; exit 1; }
          echo "::add-mask::$ADMIN_TOKEN"
          pip install -q httpx >/dev/null 2>&1
          if [ "$MODE" = "research-apply" ]; then A="--apply"; else A=""; fi
          # research-reissue-xavier: one new flow for Xavier's goal (v3 request
          # id); the rejected v2 flow and its records are left as recorded
          if [ "$MODE" = "research-reissue-xavier" ]; then A="--reissue management-execution-exits"; fi
          # research-improve-stale: one improvement flow (fixed request id)
          if [ "$MODE" = "research-improve-stale" ]; then A="--improve stale-measure"; fi
          python3 tools/research/activate_research.py --actor "Matt Taylor" $A
          echo "script exit=$?"
      - name: Read the research work and its events back (GET only)
        shell: bash
        env:
          API: https://sportsassets-api.onrender.com/api/command/agents/capabilities
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set +e
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          code=$(curl -s -o /tmp/cap.json -w '%{http_code}' --max-time 30 -H "$H" "$API")
          echo "capabilities HTTP $code at $(date -u +%FT%TZ)"
          jq -c '{control, heartbeat, work_count: ((.work // []) | length)}' /tmp/cap.json 2>/dev/null
          jq -r '(.work // [])[:20][] | "\(.task_id // .id) \(.kind) \(.status) owner=\(.claimed_by // .owner // .first // "-") updated=\(.updated_at // "-")"' /tmp/cap.json 2>/dev/null
          code=$(curl -s -o /tmp/ev.json -w '%{http_code}' --max-time 30 -H "$H" "$API/events")
          echo "events HTTP $code"
          jq -r '((.events // .) | if type=="array" then .[:40][] else empty end) | "\(.at // .created_at) \(.actor) \(.kind) \(.task_id) \((.detail // .summary // "") | tostring | .[0:240])"' /tmp/ev.json 2>/dev/null

  execmirror:
    # OFF UNLESS verify starts with execmirror or slack. Calls the API's own
    # authenticated routes with the ADMIN_TOKEN secret (masked, never
    # printed); the venue credential never leaves the API service.
    #   execmirror          read-only: credential names present, account
    #                       identity/balance/positions/open orders, the market
    #                       rules of recent paper markets, the mirror view
    #   execmirror-enable   the mirror's own control: enable (account must be
    #                       empty; records baseline + cutover), actor = owner
    #   execmirror-stop     emergency stop (cancel open mirror orders)
    #   execmirror-flatten  emergency stop and close live positions
    #   slack               the Slack bridge status (configuration booleans)
    #   slack-enable        enable the Slack bridge (actor = owner)
    if: ${{ startsWith(inputs.verify, 'execmirror') || startsWith(inputs.verify, 'slack') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mirror / Slack control and read-back (authenticated routes)
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MODE: ${{ inputs.verify }}
          SLUGS: ${{ inputs.terms_slugs }}
          API: https://sportsassets-api.onrender.com
        run: |
          set +e
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "no ADMIN_TOKEN secret"; exit 1; }
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          post() { curl -s -o /tmp/r.json -w '%{http_code}' --max-time 60 -H "$H" -H 'Content-Type: application/json' -X POST "$API$1" -d "$2"; }
          get() { curl -s -o /tmp/r.json -w '%{http_code}' --max-time 60 -H "$H" "$API$1"; }
          show() { echo "== $1 · HTTP $2 =="; jq . /tmp/r.json 2>/dev/null | head -${3:-200} || head -c 3000 /tmp/r.json; echo; }
          ACTOR="Matt Taylor (owner instruction 2026-10-02)"
          case "$MODE" in
            execmirror)
              c=$(post /api/admin/execmirror/probe '{"action":"keys"}'); show keys $c
              c=$(post /api/admin/execmirror/probe '{"action":"account"}'); show account $c 260
              if [ -n "$SLUGS" ]; then J=$(printf '%s' "$SLUGS" | jq -Rc 'split(",")'); else J='["atc-brb-ber-crb-2026-10-02-ber","aec-mlb-sd-mil-2026-10-03"]'; fi
              c=$(post /api/admin/execmirror/probe "{\"action\":\"markets\",\"slugs\":$J}"); show markets $c 160
              c=$(get /api/command/execmirror); echo "== view · HTTP $c =="; jq '{title, control, coverage, pnl: (.pnl|{paper_total,expected_live_total,live_total,difference,tracking_ratio}), account: (.account|{at,balances,open_orders,reconciliation}), orders: [.orders[:12][]|{paper_order_id,role,market,expected_scaled_qty,live:(.live|{qty,state,exclusion,venue_order_id,filled_qty,avg_px,fees_usd,submit_latency_ms})}], events: .events[:12]}' /tmp/r.json 2>/dev/null | head -220;;
            execmirror-cand22)
              # READ-ONLY candidate-22 production readback: retail account, P5, Xavier, Karen, intel, coverage, quality, pages
              c=$(post /api/admin/execmirror/probe '{"action":"keys"}'); show keys $c 40
              c=$(post /api/admin/execmirror/probe '{"action":"account"}'); show account $c 120
              c=$(get /api/command/p5/evidence); echo "== p5 · HTTP $c =="; jq -c '{verdict, first_blocking, first_blocking_external, owner_approved, artifact, deciding_process, preds: [.predicates[]? | {p:(.predicate // .id), s:.status, r:(.reason // "" | tostring | .[0:160])}], runtime_evidence}' /tmp/r.json 2>/dev/null | head -c 9000; echo
              c=$(get "/api/command/xavier/management?limit=40"); echo "== xavier · HTTP $c =="; jq -c '{policy, summary, positions: [.positions[]? | {kind:.position_kind, g:.group_id, m:.us_market_slug, r:(.latest_review|{trigger,assessed_at,review_latency_s,within_bound}), ev:(.evidence|{state:.evidence_state, age:.probability_age_s, src:.probability_source}), rec:.recommendation, thesis:(.thesis.thesis_state // .thesis)}]}' /tmp/r.json 2>/dev/null | head -c 9000; echo
              c=$(get /api/command/karen); echo "== karen · HTTP $c =="; jq -c '{profile: (.profile // .identity), metrics, n: ((.challenges // .current_challenges // []) | length), first: ((.challenges // .current_challenges // [])[:3])}' /tmp/r.json 2>/dev/null | head -c 5000; echo
              for q in intel coverage quality "postmortems?limit=3"; do c=$(get "/api/command/$q"); echo "== $q · HTTP $c =="; jq -c . /tmp/r.json 2>/dev/null | head -c 3500; echo; done
              c=$(get /api/command/agents); echo "== agents · HTTP $c =="; jq -c '[.agents[]? | {agent_id, state, policy_version, management_policy_label, last_heartbeat_at, code_version}]' /tmp/r.json 2>/dev/null | head -c 3000; echo
              for pg in /karen /institutional.html /institutional.js /live.html; do echo "page $pg HTTP $(curl -s -o /tmp/pg -w '%{http_code}' --max-time 25 https://command.bettortoken.com$pg) $(wc -c < /tmp/pg) bytes"; done;;
            execmirror-recon)
              # READ-ONLY retail reconciliation (compact) + mirror control + karen + p5 symbol detail
              c=$(post /api/admin/execmirror/probe '{"action":"account"}'); echo "== account · HTTP $c =="; jq -c '{at, state, authenticated, fingerprint: .keys.key_fingerprint, balances, open_positions, positions_n: (.positions|length), positions_complete, open_orders, activity, errors: {b: .balances_error, p: .positions_error, o: .open_orders_error}}' /tmp/r.json 2>/dev/null | head -c 6000; echo
              c=$(get "/api/command/small-live?limit=3"); echo "== control · HTTP $c =="; jq -c '{control, counts: {live_orders_placed: .counts.live_orders_placed, actual_status: .counts.actual_status}, launch: (.launch | {lane_state, actual_orders_possible_now, why_not, approved_live_book_rules, intents_last_24h})}' /tmp/r.json 2>/dev/null | head -c 4000; echo
              c=$(get "/api/command/karen/challenges?limit=4"); echo "== karen challenges · HTTP $c =="; head -c 2500 /tmp/r.json; echo
              c=$(get /api/command/karen); echo "== karen · HTTP $c =="; jq -c 'keys' /tmp/r.json 2>/dev/null; jq -c '.metrics // .data.metrics // empty' /tmp/r.json 2>/dev/null | head -c 2500; echo;;
            execmirror-enable)
              c=$(post /api/admin/execmirror/control "{\"action\":\"enable\",\"actor\":\"$ACTOR\"}"); show enable $c;;
            execmirror-stop)
              c=$(post /api/admin/execmirror/control "{\"action\":\"stop\",\"actor\":\"$ACTOR\"}"); show stop $c;;
            execmirror-flatten)
              c=$(post /api/admin/execmirror/control "{\"action\":\"stop\",\"flatten\":true,\"actor\":\"$ACTOR\"}"); show flatten $c;;
            slack)
              c=$(get /api/command/agents/slack); show slack $c;;
            slack-enable)
              c=$(post /api/command/agents/slack/control "{\"enabled\":true,\"actor\":\"$ACTOR\"}"); show slack-enable $c;;
            slack-check)
              # Slack auth.test per bot token: ok/error, bot user, team, value KIND only
              c=$(post /api/command/agents/slack/control "{\"action\":\"check_tokens\",\"actor\":\"$ACTOR\"}"); show slack-check $c;;
            slack-requeue)
              # re-send stored answers Slack refused BEFORE posting (invalid_auth etc.)
              c=$(post /api/command/agents/slack/control "{\"action\":\"requeue_refused\",\"actor\":\"$ACTOR\"}"); show slack-requeue $c;;
            *) echo "unknown mode $MODE"; exit 1;;
          esac

  team-logos:
    # OFF UNLESS verify == team-logos. Reads the venue's OWN team records
    # (public gateway GET /v1/sports/teams/provider, no key) for the given
    # venue team ids and downloads each record's logo image, bounded, with
    # provenance (id, record, URL, content type, sha256, time). Writes only
    # to the evidence branch; nothing reaches trading or decision code.
    if: ${{ inputs.verify == 'team-logos' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Venue team records and logos
        shell: bash
        env:
          IDS: ${{ inputs.team_ids }}
          SLUGS: ${{ inputs.team_slugs }}
        run: |
          set +e
          case "$IDS" in *[!0-9,\ ]*) echo "team_ids must be digits and commas"; exit 1 ;; esac
          [ -n "$IDS" ] || { echo "no team_ids"; exit 1; }
          case "$SLUGS" in *[!a-z0-9,-]*) echo "team_slugs must be slugs and commas"; exit 1 ;; esac
          python3 tools/team_logos/fetch_venue_team_logos.py /tmp/team_logos "$IDS" "$SLUGS"
          ls -la /tmp/team_logos | head -60
          python3 -c "import json;m=json.load(open('/tmp/team_logos/manifest.json'));[print(r['requested_id'],r['status'],(r.get('venue_record') or {}).get('name'),(r.get('venue_record') or {}).get('league'),r.get('content_type'),r.get('bytes'),(r.get('logo_url') or '')[:90]) for r in m['teams']]"
      - name: Commit the logos and manifest
        if: always()
        shell: bash
        run: |
          set +e
          RUN="${GITHUB_RUN_ID}"
          D="evidence/team_logos/$(date -u +%Y%m%dT%H%M%SZ)_run$RUN"
          git config user.name "site-verify"
          git config user.email "site-verify@users.noreply.github.com"
          git fetch -q origin claude/site-verify-evidence && git checkout -q -f -B ev origin/claude/site-verify-evidence || git checkout -q --orphan ev
          git rm -rq --cached . >/dev/null 2>&1
          mkdir -p "$D" && cp /tmp/team_logos/* "$D"/ 2>/dev/null
          git add "$D" && git commit -q -m "venue team logos, run $RUN" && git push -q origin ev:claude/site-verify-evidence && echo "evidence pushed: $D"

  logos:
    # TEAM LOGOS ON THE PRODUCTION SITE. OFF UNLESS verify == logos. Read-only:
    # homepage and the three offices on Chromium desktop and WebKit iPhone 13;
    # payload coverage by league, rendered marks (loaded / initials / broken),
    # signed-out image refusal, CSP errors, layout shift, screenshots.
    if: ${{ inputs.verify == 'logos' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render the logos (Chromium desktop, WebKit iPhone 13)
        timeout-minutes: 20
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          OUT: site_verify_out
        run: |
          set +e
          echo "::add-mask::$ADMIN_TOKEN"
          cd tools/site_verify
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps webkit chromium >/dev/null 2>&1
          node logos.mjs
      - name: Commit the evidence
        if: always()
        shell: bash
        run: |
          set +e
          RUN="${GITHUB_RUN_ID}"
          D="evidence/logos/$(date -u +%Y%m%dT%H%M%SZ)_run$RUN"
          git config user.name "site-verify"
          git config user.email "site-verify@users.noreply.github.com"
          git fetch -q origin claude/site-verify-evidence && git checkout -q -f -B ev origin/claude/site-verify-evidence || git checkout -q --orphan ev
          git rm -rq --cached . >/dev/null 2>&1
          mkdir -p "$D" && cp tools/site_verify/site_verify_out/* "$D"/ 2>/dev/null
          git add "$D" && git commit -q -m "logos evidence, run $RUN" && git push -q origin ev:claude/site-verify-evidence && echo "evidence pushed: $D"
