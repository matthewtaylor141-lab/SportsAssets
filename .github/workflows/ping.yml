# A twenty-second read of the API from the outside (2026-09-05).
#
# During the disk-full outage and the recovery after it, the only external
# eyes on the platform were the 16-32 minute engine-diagnostic probe and the
# gate-lever's two admin reads -- neither prints the HTTP status code, so
# "UNAVAILABLE" could not tell a 502 (no healthy instance: a failed deploy,
# a crash loop) from a hang (DB reads timing out) from a 200 with a broken
# body. This job asks /healthz three times with the code and the timing,
# then the heartbeat table, and prints exactly what came back. Nothing here
# changes state; there is no token in the healthz read and the heartbeat
# read is the same public one the probe makes. The second step reads the
# agent pages and the paper account with GETs only (ADMIN_TOKEN, read role).
name: ping

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read /healthz and the service heartbeats
        shell: bash
        env:
          BASE: https://sportsassets-api.onrender.com
        run: |
          set +e
          set -u
          for i in 1 2 3; do
            rm -f /tmp/hz.json /tmp/hz.err
            code=$(curl -sS --max-time 20 -o /tmp/hz.json -w '%{http_code} in %{time_total}s' "$BASE/healthz" 2>/tmp/hz.err)
            echo "healthz #$i at $(date -u +%H:%M:%S)Z: HTTP ${code:-none}"
            if [ -s /tmp/hz.json ]; then echo "  body: $(head -c 600 /tmp/hz.json)"; fi
            if [ -s /tmp/hz.err ]; then echo "  curl: $(cat /tmp/hz.err)"; fi
            sleep 5
          done
          rm -f /tmp/svc.json
          code=$(curl -sS --max-time 30 -o /tmp/svc.json -w '%{http_code} in %{time_total}s' "$BASE/api/health/services" 2>/dev/null)
          echo "services at $(date -u +%H:%M:%S)Z: HTTP ${code:-none}"
          if [ -s /tmp/svc.json ]; then
            jq -r '.[]? | "  \(.service) \(.status) beat=\(.beat_at)"' /tmp/svc.json 2>/dev/null \
              || echo "  body (not JSON): $(head -c 400 /tmp/svc.json)"
          fi
          exit 0

      - name: Agent pages and the paper account strip (READ-ONLY)
        shell: bash
        env:
          BASE: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # GETs only. The three management URLs must serve the agent shell
          # (status 200, the address kept by the netlify rewrite), paper.js
          # must be published, and with a COMMAND role the framed pages,
          # the one paper ledger and the agents' state must read back.
          # Chat and speech are POST routes that write conversation
          # records, so only their configuration status is read here.
          set +e
          HOST="command.bettortoken.com"
          API="$BASE"
          {
            echo "### Agent pages"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for path in /derek /xavier /audrey /paper.js /agent.html; do
            code=$(curl -s -o /tmp/pg -w '%{http_code}' --max-time 25 "https://$HOST$path" || echo 000)
            printf '%-12s %s %s bytes  frames-agent-page:%s  account-strip:%s\n' "$path" "$code" \
              "$(wc -c < /tmp/pg)" "$(grep -c 'agents/.*page\|/page' /tmp/pg)" \
              "$(grep -c 'paper/account' /tmp/pg)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          curl -s --max-time 25 "https://$HOST/" > /tmp/home
          curl -s --max-time 25 "https://$HOST/app.js" > /tmp/appjs
          echo "homepage loads paper.js: $(grep -c 'paper.js' /tmp/home)  app.js OUR AGENTS nav: $(grep -c 'OUR AGENTS' /tmp/appjs)  links: $(grep -o 'href="/\(derek\|xavier\|audrey\)"' /tmp/appjs | sort -u | tr '\n' ' ')" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "SKIPPED authenticated reads: no ADMIN_TOKEN secret" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          for a in derek xavier audrey; do
            code=$(curl -s -o /tmp/ap -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/agents/$a/page" || echo 000)
            echo "api agents/$a/page HTTP $code $(wc -c < /tmp/ap) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          code=$(curl -s -o /tmp/acct.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/paper/account?entries=5" || echo 000)
          echo "paper/account HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c 'del(.ledger) | {account, session, last_updated_at, drawdown_status: .drawdown.status}' /tmp/acct.json 2>&1 \
            | cut -c1-2500 | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '.ledger | {status, why, entries: ((.data.entries // .data // []) | if type == "array" then map({seq: (.sequence // .seq), kind, cash_after_usd, reserved_after_usd}) else . end)}' /tmp/acct.json 2>&1 \
            | cut -c1-1500 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/ag.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/agents" || echo 000)
          echo "agents HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '.' /tmp/ag.json 2>/dev/null | cut -c1-2000 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/ps.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/agents/persona-status" || echo 000)
          echo "persona-status HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '{chat_llm: .chat.llm, voice: .speech.voice, personas}' /tmp/ps.json 2>/dev/null \
            | cut -c1-1500 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
