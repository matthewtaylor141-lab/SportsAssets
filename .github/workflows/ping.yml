# A twenty-second read of the API from the outside (2026-09-05).
#
# During the disk-full outage and the recovery after it, the only external
# eyes on the platform were the 16-32 minute engine-diagnostic probe and the
# gate-lever's two admin reads -- neither prints the HTTP status code, so
# "UNAVAILABLE" could not tell a 502 (no healthy instance: a failed deploy,
# a crash loop) from a hang (DB reads timing out) from a 200 with a broken
# body. This job asks /healthz three times with the code and the timing,
# then the heartbeat table, and prints exactly what came back. Nothing here
# changes state; there is no token in the healthz read and the heartbeat
# read is the same public one the probe makes.
name: ping

on:
  workflow_dispatch:
    inputs:
      p0:
        description: "blank = healthz only; on = also the P0 closeout production readback: GET-only reads of the paper freshness / market-data telemetry, the reconciliation receipt, Xavier's packets, the coverage first-loss census, the PAPER turnaround and capital-authority acceptance, SMALL LIVE and the release alignment (ADMIN_TOKEN, read role; writes nothing)"
        required: false
        default: ""

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read /healthz and the service heartbeats
        shell: bash
        env:
          BASE: https://sportsassets-api.onrender.com
        run: |
          set +e
          set -u
          for i in 1 2 3; do
            rm -f /tmp/hz.json /tmp/hz.err
            code=$(curl -sS --max-time 20 -o /tmp/hz.json -w '%{http_code} in %{time_total}s' "$BASE/healthz" 2>/tmp/hz.err)
            echo "healthz #$i at $(date -u +%H:%M:%S)Z: HTTP ${code:-none}"
            if [ -s /tmp/hz.json ]; then echo "  body: $(head -c 600 /tmp/hz.json)"; fi
            if [ -s /tmp/hz.err ]; then echo "  curl: $(cat /tmp/hz.err)"; fi
            sleep 5
          done
          rm -f /tmp/svc.json
          code=$(curl -sS --max-time 30 -o /tmp/svc.json -w '%{http_code} in %{time_total}s' "$BASE/api/health/services" 2>/dev/null)
          echo "services at $(date -u +%H:%M:%S)Z: HTTP ${code:-none}"
          if [ -s /tmp/svc.json ]; then
            jq -r '.[]? | "  \(.service) \(.status) beat=\(.beat_at)"' /tmp/svc.json 2>/dev/null \
              || echo "  body (not JSON): $(head -c 400 /tmp/svc.json)"
          fi
          exit 0

      - name: P0 closeout production readback (READ-ONLY)
        if: ${{ inputs.p0 == 'on' }}
        shell: bash
        env:
          BASE: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set +e
          set -u
          [ -z "${ADMIN_TOKEN:-}" ] && { echo "no ADMIN_TOKEN secret: authenticated reads NOT_ESTABLISHED"; exit 1; }
          echo "::add-mask::$ADMIN_TOKEN"
          mkdir -p p0
          get() {  # name path
            code=$(curl -s -o "p0/$1.json" -w '%{http_code}' --max-time 90 \
                   -H "X-Admin-Token: $ADMIN_TOKEN" "$BASE$2" || echo 000)
            echo "== $1 GET $2 -> HTTP $code ($(wc -c < "p0/$1.json") bytes) at $(date -u +%FT%TZ)"
          }
          get release /api/command/release
          jq -c '{api: .api.sha, workers: .workers.sha, alignment, schema: {status: .schema.status, max_version: .schema.max_version}}' p0/release.json 2>&1 | cut -c1-1500
          get freshness "/api/command/paper/freshness?limit=0"
          jq -c '.freshness | {status, counts, fresh_rate, stale_management_rate, classified, markable, freshly_manageable}' p0/freshness.json 2>&1 | cut -c1-3000
          jq -c '.market_data // .freshness.market_data | del(.owner)' p0/freshness.json 2>&1 | cut -c1-6000
          get reconciliation /api/command/paper/reconciliation
          jq -c '.reconciliation | {status, rule, counts}' p0/reconciliation.json 2>&1 | cut -c1-3000
          jq -c '.reconciliation.sections | {legacy_reader_phantoms, sub_contract_remainders, live_protection_on_closed_positions, economic_duplicate_suspects: [.economic_duplicate_suspects[]? | {order_id, role, qty, price, n, filled_at}]}' p0/reconciliation.json 2>&1 | cut -c1-12000
          get xavier "/api/command/paper/xavier?limit=200"
          jq -c '[.. | objects | select(has("management_packet")) | .management_packet | {complete, missing}] | group_by(.complete) | map({complete: .[0].complete, n: length, missing: ([.[].missing[]?] | group_by(.) | map({(.[0]): length}) | add)})' p0/xavier.json 2>&1 | cut -c1-3000
          get first_loss "/api/command/coverage/first-loss?hours=24"
          jq -c '.data.totals | {provider_events, entered, by_class, first_loss, software: [.by_code[]? | select(.class=="SOFTWARE") | {stage, code, events}]}' p0/first_loss.json 2>&1 | cut -c1-6000
          get first_loss_1h "/api/command/coverage/first-loss?hours=1"
          jq -c '.data.totals | {provider_events, entered, by_class, first_loss, software: [.by_code[]? | select(.class=="SOFTWARE") | {stage, code, events}]}' p0/first_loss_1h.json 2>&1 | cut -c1-6000
          get turnaround /api/command/paper/turnaround
          jq -c 'del(.rows) | del(.events)' p0/turnaround.json 2>&1 | cut -c1-8000
          get capital_authority /api/command/paper/capital-authority
          jq -c '.' p0/capital_authority.json 2>&1 | cut -c1-12000
          get profitability_scoreboard /api/command/paper/profitability-scoreboard
          jq -c '.' p0/profitability_scoreboard.json 2>&1 | cut -c1-12000
          get capital_readiness /api/command/capital-readiness
          jq -c '{status, why, label, authority, readiness: (.readiness | {readiness_status, recommended_capital_usd, blocking_gates, computed_at, source_sha}), agent_championship: .agent_championship.agents, shadow_court, scale_twin: {status: .scale_twin.status, rows: (.scale_twin.rows | length)}}' p0/capital_readiness.json 2>&1 | cut -c1-8000
          get trader_mode /api/command/paper/trader-mode
          jq -c '{schema, source, mode, authority, execution_authority, source_sha, snapshot_at, total_position_count, returned_position_count, truncated, counts, score_feed, missing: ([.positions[]? | select(.state=="ACTIVE") | .packet.missing[]] | group_by(.) | map({(.[0]): length}) | add), orders: [.positions[]? | .orders[]? | {position_id, role, state, direction, limit_price, remaining_qty, met: .gap.condition_met, is_fill: .gap.is_fill}]}' p0/trader_mode.json 2>&1 | cut -c1-12000
          get loss_attribution /api/command/paper/loss-attribution
          jq -c 'del(.missed_exits.sample)' p0/loss_attribution.json 2>&1 | cut -c1-12000
          get ncaaf_funnel /api/command/ncaaf-funnel
          jq -c '{status, why, watch, stages, refused, unexplained_losses, venue_side: (.venue_side | {venue_events, contracts, matched, unmatched, unmatched_by_reason, sample: .unmatched_events[:20]}), events: .events[:40]}' p0/ncaaf_funnel.json 2>&1 | cut -c1-12000
          get market_plane "/api/command/market-plane?limit=50"
          jq -c '{status, why, snapshot_at, counts, coverage_by_state, certification, universe: .snapshot.universe, subscription: (.snapshot.subscription | {armed, arming_why, configured_capacity, subscribed, fresh, stale_subscribed, plan: (.plan | {complete, symbols, capacity, overflow_count, subscribable, shards_required_for_all}), shards}), sources: .snapshot.sources, latency: .snapshot.latency, catalogue: .snapshot.catalogue, radar: .snapshot.radar}' p0/market_plane.json 2>&1 | cut -c1-12000
          get small_live "/api/command/small-live?limit=1"
          jq -c 'del(.rows) | del(.basis)' p0/small_live.json 2>&1 | cut -c1-3000
          get revenue_readiness /api/command/revenue-readiness
          jq -c '{status, why, label, authority, daily: (.data.daily_revenue_readiness | {overall_status, management_bankroll_usd, proven_positive_capacity_usd, planned_capital_usd, cash_usd, expected_daily_profit_usd, what_has_earned_capital_today, agent_certification, regime_status_counts, reasons_unused_capital_is_cash}), tournament: (.data.strategy_tournament | {selected, status, reason}), authority_changed: .data.authority_changed, small_live: .data.small_live}' p0/revenue_readiness.json 2>&1 | cut -c1-8000
          get completion_readiness /api/command/completion-readiness
          jq -c '{status, why, label, authority, readiness: (.data.readiness | {status, blockers, governors, auto_activation, capital_authority_granted}), runtime: .data.runtime, market: (.data.market_data | {snapshot, subscription_mode, market_data_streams, priority_freshness, refdata: (.refdata | {active_contracts, pmx_listed, pmx_unlisted, refdata_pending, coverage_rate})}), management: .data.management_freshness, gates: .data.gates, probability: (.data.probability | {authority, reason, decisions_scored, independent_events, bettor_logloss_minus_market, improvement_lower_bound}), ev: (.data.executable_ev | {verdict, reason, decisions_priced, portfolio_lower_bound_ev_per_contract}), twin: (.data.digital_twin | {status, replayed, agree, fill_agreement_rate, residual_mismatch_taxonomy, optimistic_twin_mismatch_taxonomy}), arb: (.data.arbitrage | {verdict, guaranteed_after_costs}), venue: .data.venue_positions, settlement: .data.settlement, owner: .data.owner_blockers, small_live: .data.small_live, authority_changed: .data.authority_changed}' p0/completion_readiness.json 2>&1 | cut -c1-12000
          exit 0

      - name: Keep the P0 readback as evidence
        if: ${{ inputs.p0 == 'on' }}
        uses: actions/upload-artifact@v4
        with:
          name: p0-readback
          path: p0/
          retention-days: 30
