# A twenty-second read of the API from the outside (2026-09-05).
#
# During the disk-full outage and the recovery after it, the only external
# eyes on the platform were the 16-32 minute engine-diagnostic probe and the
# gate-lever's two admin reads -- neither prints the HTTP status code, so
# "UNAVAILABLE" could not tell a 502 (no healthy instance: a failed deploy,
# a crash loop) from a hang (DB reads timing out) from a 200 with a broken
# body. This job asks /healthz three times with the code and the timing,
# then the heartbeat table, and prints exactly what came back. Nothing here
# changes state; there is no token in the healthz read and the heartbeat
# read is the same public one the probe makes. The second step reads the
# agent pages and the paper account with GETs only (ADMIN_TOKEN, read role).
name: ping

on:
  workflow_dispatch:
    inputs:
      demo:
        description: "blank = read-only ping only; chat-voice = also run the authorized agent chat + speech demonstration (writes conversation records only)"
        required: false
        default: ""
      terms_slugs:
        description: "optional comma-separated venue slugs: read each contract's published rules prose through POST /api/admin/venue-settlement-probe (read-only GETs at the venue; writes nothing)"
        required: false
        default: ""

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read /healthz and the service heartbeats
        shell: bash
        env:
          BASE: https://sportsassets-api.onrender.com
        run: |
          set +e
          set -u
          for i in 1 2 3; do
            rm -f /tmp/hz.json /tmp/hz.err
            code=$(curl -sS --max-time 20 -o /tmp/hz.json -w '%{http_code} in %{time_total}s' "$BASE/healthz" 2>/tmp/hz.err)
            echo "healthz #$i at $(date -u +%H:%M:%S)Z: HTTP ${code:-none}"
            if [ -s /tmp/hz.json ]; then echo "  body: $(head -c 600 /tmp/hz.json)"; fi
            if [ -s /tmp/hz.err ]; then echo "  curl: $(cat /tmp/hz.err)"; fi
            sleep 5
          done
          rm -f /tmp/svc.json
          code=$(curl -sS --max-time 30 -o /tmp/svc.json -w '%{http_code} in %{time_total}s' "$BASE/api/health/services" 2>/dev/null)
          echo "services at $(date -u +%H:%M:%S)Z: HTTP ${code:-none}"
          if [ -s /tmp/svc.json ]; then
            jq -r '.[]? | "  \(.service) \(.status) beat=\(.beat_at)"' /tmp/svc.json 2>/dev/null \
              || echo "  body (not JSON): $(head -c 400 /tmp/svc.json)"
          fi
          exit 0

      - name: Agent pages and the paper account strip (READ-ONLY)
        shell: bash
        env:
          BASE: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # GETs only. The three management URLs must serve the agent shell
          # (status 200, the address kept by the netlify rewrite), paper.js
          # must be published, and with a COMMAND role the framed pages,
          # the one paper ledger and the agents' state must read back.
          # Chat and speech are POST routes that write conversation
          # records, so only their configuration status is read here.
          set +e
          HOST="command.bettortoken.com"
          API="$BASE"
          {
            echo "### Agent pages"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for path in /derek /xavier /audrey /paper.js /agent.html; do
            code=$(curl -s -o /tmp/pg -w '%{http_code}' --max-time 25 "https://$HOST$path" || echo 000)
            printf '%-12s %s %s bytes  frames-agent-page:%s  account-strip:%s\n' "$path" "$code" \
              "$(wc -c < /tmp/pg)" "$(grep -c 'agents/.*page\|/page' /tmp/pg)" \
              "$(grep -c 'paper/account' /tmp/pg)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          curl -s --max-time 25 "https://$HOST/" > /tmp/home
          curl -s --max-time 25 "https://$HOST/app.js" > /tmp/appjs
          echo "homepage loads paper.js: $(grep -c 'paper.js' /tmp/home)  app.js OUR AGENTS nav: $(grep -c 'OUR AGENTS' /tmp/appjs)  links: $(grep -o 'href="/\(derek\|xavier\|audrey\)"' /tmp/appjs | sort -u | tr '\n' ' ')" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "SKIPPED authenticated reads: no ADMIN_TOKEN secret" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          for a in derek xavier audrey; do
            code=$(curl -s -o /tmp/ap -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/agents/$a/page" || echo 000)
            echo "api agents/$a/page HTTP $code $(wc -c < /tmp/ap) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          code=$(curl -s -o /tmp/acct.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/paper/account?entries=5" || echo 000)
          echo "paper/account HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c 'del(.ledger) | {account, session, last_updated_at, drawdown_status: .drawdown.status}' /tmp/acct.json 2>&1 \
            | cut -c1-2500 | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '.ledger | {status, why, entries: ((.data.entries // .data // []) | if type == "array" then map({seq: (.sequence // .seq), kind, cash_after_usd, reserved_after_usd}) else . end)}' /tmp/acct.json 2>&1 \
            | cut -c1-1500 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/bm.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/paper/benchmark" || echo 000)
          echo "paper/benchmark HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '.' /tmp/bm.json 2>/dev/null | cut -c1-6000 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/ag.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/agents" || echo 000)
          echo "agents HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '.' /tmp/ag.json 2>/dev/null | cut -c1-2000 | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/ps.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/agents/persona-status" || echo 000)
          echo "persona-status HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '{chat_llm: .chat.llm, voice: .speech.voice, personas}' /tmp/ps.json 2>/dev/null \
            | cut -c1-1500 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  demo:
    # AUTHORIZED DEMONSTRATION, OFF UNLESS demo == chat-voice. Each agent is
    # asked one grounded question about the live paper session (POST .../chat
    # writes a conversation record and nothing else), then one stored
    # assistant message per agent is spoken (POST .../speak, audio bytes
    # counted, not printed). No paper ledger, session, order or directive.
    if: ${{ inputs.demo == 'chat-voice' }}
    runs-on: ubuntu-latest
    steps:
      - name: Chat and voice for Derek, Xavier and Audrey
        shell: bash
        env:
          API: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set +e
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "no ADMIN_TOKEN secret"; exit 1; }
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          code=$(curl -s -o /tmp/acct.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/paper/account?entries=5")
          echo "paper/account HTTP $code"
          jq -c '{session: .session.session_id, active: .session.active, cash: .account.data.cash_usd, reserved: .account.data.reserved_usd, available: .account.data.available_usd, ledger_entries: .account.data.ledger_entries, consistent: .account.data.ledger_consistent}' /tmp/acct.json
          Q="What are the paper account's cash, reserved and available balances right now, which paper session is running, and what have you decided today and why? Cite the records."
          RID_BASE="demo-$(date -u +%Y%m%dT%H%M%S)"
          for a in derek xavier audrey; do
            echo "================ $a ================"
            body=$(jq -nc --arg m "$Q" --arg r "$RID_BASE-$a" '{message:$m, request_id:$r}')
            code=$(curl -s -o /tmp/chat_$a.json -w '%{http_code}' --max-time 120 -X POST -H "$H" \
                   -H "Content-Type: application/json" -d "$body" "$API/api/command/agents/$a/chat")
            echo "chat HTTP $code"
            jq -r 'keys | join(",")' /tmp/chat_$a.json 2>/dev/null | sed 's/^/keys: /'
            jq -c '{status, agent, role, conversation_id, user_message_id, assistant_message_id, message_id, provider: (.provider // .llm // null), persona: .persona.display_name}' /tmp/chat_$a.json 2>/dev/null
            echo "--- answer ---"
            jq -r '(.reply.text // .answer // .text // .assistant.text // .message.text // .reply // "") | tostring' /tmp/chat_$a.json 2>/dev/null | cut -c1-1800
            echo "--- grounding ---"
            jq -c '(.facts // .grounding // .citations // .reply.citations // null)' /tmp/chat_$a.json 2>/dev/null | cut -c1-1500
            [ "$code" = "200" ] || head -c 1200 /tmp/chat_$a.json; echo
            MID=$(jq -r '.assistant_message_id // .reply.message_id // .message_id // .assistant.message_id // empty' /tmp/chat_$a.json 2>/dev/null)
            echo "speak message_id=$MID"
            if [ -n "$MID" ]; then
              code=$(curl -s -D /tmp/sh_$a.txt -o /tmp/speak_$a.bin -w '%{http_code}' --max-time 120 -X POST -H "$H" \
                     -H "Content-Type: application/json" -d "$(jq -nc --arg m "$MID" '{message_id:$m}')" "$API/api/command/agents/$a/speak")
              echo "speak HTTP $code bytes=$(wc -c < /tmp/speak_$a.bin) $(grep -i '^content-type' /tmp/sh_$a.txt | tr -d '\r') $(grep -i '^x-speech' /tmp/sh_$a.txt | tr -d '\r' | tr '\n' ' ')"
              [ "$code" = "200" ] || head -c 600 /tmp/speak_$a.bin; echo
            fi
          done
          code=$(curl -s -o /tmp/acct2.json -w '%{http_code}' --max-time 45 -H "$H" "$API/api/command/paper/account?entries=5")
          echo "paper/account after HTTP $code"
          jq -c '{session: .session.session_id, cash: .account.data.cash_usd, reserved: .account.data.reserved_usd, available: .account.data.available_usd, ledger_entries: .account.data.ledger_entries}' /tmp/acct2.json

  venue-terms:
    # READ-ONLY. The admin probe makes two GETs per slug at the venue (the
    # settlement endpoint and the listing) through the existing reader and
    # returns the listing's prose verbatim with the production reader's
    # per-condition reading. It writes nothing and submits nothing.
    if: ${{ inputs.terms_slugs != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Venue rules prose for the named contracts
        shell: bash
        env:
          API: https://sportsassets-api.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SLUGS: ${{ inputs.terms_slugs }}
        run: |
          set +e
          [ -n "${ADMIN_TOKEN:-}" ] || { echo "no ADMIN_TOKEN secret"; exit 1; }
          echo "::add-mask::$ADMIN_TOKEN"
          H="X-Admin-Token: $ADMIN_TOKEN"
          body=$(jq -nc --arg s "$SLUGS" '{slugs: ($s | split(",") | map(gsub("\\s"; "")) | map(select(length > 0)))}')
          code=$(curl -s -o /tmp/probe.json -w '%{http_code}' --max-time 120 -X POST -H "$H" \
                 -H "Content-Type: application/json" -d "$body" "$API/api/admin/venue-settlement-probe")
          echo "probe HTTP $code at $(date -u +%FT%TZ)"
          jq -r '(.results // .slugs // .probes // [])[]? | "== \(.slug // .market_slug)\n" +
                 ((.settlement_terms // {}) | "field=\(.field) chars=\(.chars) truncated=\(.truncated)\nTEXT: \(.text)\nstated: \(.stated | tojson)\nnot_stated: \(.not_stated | tojson)\ncontradicted: \(.contradicted | tojson)")' /tmp/probe.json 2>/dev/null
          echo "== keys: $(jq -c 'keys' /tmp/probe.json 2>/dev/null)"
          [ "$code" = "200" ] || head -c 1500 /tmp/probe.json
