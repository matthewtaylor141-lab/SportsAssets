# BACKEND TEST SUITE IN CI (2026-08-26).
#
# Until now the suite ran only in the development sandbox, and twice
# today that sandbox's permission layer refused to run pytest at all --
# once while an edit to the ORDER-PLACEMENT PATH was sitting unverified,
# which forced the edit to be reverted rather than shipped. A
# verification path that can be withdrawn mid-change is not a
# verification path.
#
# This runs the identical suite on every push. It needs no secrets.
#
# THE PRODUCTION IMAGE'S ENVIRONMENT, NOT THE INDEX'S (R30A, 2026-10-04).
# Run 37223385978 on 0c08b0a went red with 91 failures, a third of them
# environmental: Python 3.11.16 with `pip install -e ".[dev]"` resolving
# anthropic 1.11.0 / pycryptodome 3.24.0 / python-dotenv 1.2.4 / uvloop 0.23.0
# / websockets 17.2 (the image runs the lock on 3.12.3), ~25 DB proofs failing
# "RN1X_TEST_DSN is not set", and RecursionErrors that do not reproduce on the
# image's interpreter. A suite that is red for its own environment cannot
# say anything about the code. So this job now stands on the same ground as
# capital-critical.yml: Python 3.12.3, backend/requirements.lock plus the
# gate's pinned test tools, a PostgreSQL 16 service built by production's
# migration runner, and RN1X_TEST_DSN set. Nothing is skipped or excused here:
# pytest's own exit status is still the step's (the capital-critical job adds
# the quarantine-aware verdict on top).
name: backend-tests
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    # RAISED FROM 15 (2026-09-20). The suite outgrew the cap and CI had
    # stopped being able to finish it: runs 421-427 every one ran 15.3
    # minutes and reported `cancelled`, which reads exactly like a push
    # cancelling a superseded run. It was not that. The step "Run the
    # suite" ran 14m50s and hit the limit, on six consecutive commits.
    #
    # A green tick was never the risk -- a timeout cannot report pass.
    # The cost was subtler: every one of those runs LOOKED like it had
    # been superseded, so the absence of a CI verdict was attributed to
    # pushing too often rather than to a cap the suite no longer fits
    # under. 10,100 tests take ~22 minutes.
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      BT_DSN: postgresql://postgres:postgres@127.0.0.1:5432/backend_tests
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history: the suite pins a few functions byte for byte
          # against a named commit (git show <sha>:<path>); a depth-1
          # checkout answered those with exit 128 (runs 262-264, 2026-09-08)
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # the image's interpreter (backend/Dockerfile FROM ...3.12.3-slim@sha256)
          python-version: "3.12.3"
      - name: Install the image's lock and the gate's test tools
        run: |
          set -euo pipefail
          cd backend
          python -m pip install --quiet --no-cache-dir -r requirements.lock -r requirements-test.lock
          python -m pip check
          python -c "from sportsassets import runtime_manifest as RM; print(RM.log_line(RM.check()))"
      - name: Build the database with production's migration runner
        env:
          DATABASE_URL: ${{ env.BT_DSN }}
        run: |
          set -euo pipefail
          cd backend
          # the scratch-database proofs run as the development server's
          # `sportsassets` role and skip without it
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE sportsassets LOGIN PASSWORD 'sportsassets' CREATEDB"
          # `us_premap` is the collector's table (workers/premap._ensure_table);
          # no migration creates it and four alter it
          python - <<'PY'
          import asyncio
          from sportsassets.db import get_pool, close_pool
          from sportsassets.workers import premap

          async def main():
              pool = await get_pool()
              await premap._ensure_table(pool)
              await close_pool()

          asyncio.run(main())
          PY
          python -m sportsassets.scripts.migrate
      - name: Run the suite
        # FAILING NODE IDS ARE PART OF THE RESULT (c28, 2026-10-04). The
        # previous `| tail -30` kept only the summary, so a red run could not
        # be compared with the release gate's baseline failures: the receipts
        # for fd6cc5b and 8e62749 had to record CI as UNREADABLE. The full
        # console and a junit report are now an artifact, and every FAILED /
        # ERROR id is printed. pytest's own exit status is still the step's.
        env:
          RN1X_TEST_DSN: ${{ env.BT_DSN }}
          RN1X_CAPACITY_SLOT_MUST_BE_FREE: "1"
        run: |
          cd backend
          # the default shell is bash -e: capture the status, do not die on it
          rc=0
          python -m pytest tests -q -p no:cacheprovider --tb=short -rfE \
            --junitxml="$RUNNER_TEMP/backend-tests-junit.xml" \
            > "$RUNNER_TEMP/backend-tests-console.txt" 2>&1 || rc=$?
          tail -30 "$RUNNER_TEMP/backend-tests-console.txt"
          echo "== failing node ids =="
          grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/backend-tests-console.txt" || echo "(none)"
          exit $rc
      - name: Keep the console and junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/backend-tests-console.txt
            ${{ runner.temp }}/backend-tests-junit.xml
          if-no-files-found: warn
          retention-days: 14
