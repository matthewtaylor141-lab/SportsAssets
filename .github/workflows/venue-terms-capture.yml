# CAN THE VENUE'S PER-CONDITION SETTLEMENT TERMS BE RETRIEVED AT ALL?
#
# THE BLOCKER THIS EXISTS TO RESOLVE OR TO NAME. Every one of the 464
# candidates the entry lane evaluated in 24 hours carries
# VOID_ABANDONMENT_RULE_NOT_ESTABLISHED. The cause is not the bookmaker
# side: Pinnacle's baseball h2h terms ARE captured, with citations, from
# www.pinnacle.com/en/future/betting-rules retrieved 2026-09-24T20:30:22Z.
# The cause is the VENUE side.
#
# `bettor_settlement_terms.compare` returns COMPATIBLE only when EVERY
# applicable condition is stated by BOTH sides -- `silence_is_not_agreement`
# is True, deliberately. There are seven applicable conditions for a
# baseball money line. The only venue prose we hold is the listing's
# `description` field, measured at 380 characters, which states one of them
# (postponed/abandoned). Six stay silent, so the verdict is UNKNOWN and the
# rule is NOT ESTABLISHED. That is structural: a 380-character blurb cannot
# state seven conditions, so no amount of re-reading the listing will clear
# it.
#
# So the question is whether the venue publishes a per-condition settlement
# document somewhere a reader can reach. This asks, from a runner with
# ordinary egress -- the development container's network policy denies these
# hosts, which is why the Pinnacle capture also had to happen here.
#
# IT IS READ-ONLY AND CARRIES NO CREDENTIAL. Plain HTTPS GETs to published
# documentation hosts. No database, no deployment, no venue API, no order.
#
# WHAT IT DOES NOT DO. It does not write terms into the repository. A
# retrieval is evidence; deciding which sentence states which condition is a
# reading, and that reading belongs in `bettor_settlement_terms.BOOK_TERMS`
# alongside a quote and a retrieval time, added deliberately. A workflow that
# scraped text straight into a settlement table is how an unread rule becomes
# an asserted one.
#
# EVERY OUTCOME IS RECORDED, INCLUDING A REFUSAL. A 403 or a 404 is the
# answer to "does the venue publish this", and it is worth as much as a 200.
name: venue-terms-capture

on:
  workflow_dispatch:
    inputs:
      extra_urls:
        description: >-
          Additional candidate URLs, comma separated. Tried after the
          built-in list below.
        required: false
        default: ''
      max_chars:
        description: 'Characters of extracted text to print per source'
        required: false
        default: '6000'

# This host is not the §10 gateway and shares no limiter with it, but the
# venue-domain audit classifies anything naming a venue host as
# venue-touching, and the strict reading is honoured rather than argued
# with. See tape-probe.yml for the same decision and its reasoning.
concurrency:
  group: pmus-public-read-global
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve, and record every outcome
        env:
          EXTRA: ${{ inputs.extra_urls }}
          MAXC: ${{ inputs.max_chars }}
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; }
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          say "retrieved_at   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          say "reader         github-actions runner, ubuntu-latest, ordinary egress"
          say "what           candidate VENUE settlement-terms documents"
          say "why            VOID_ABANDONMENT_RULE_NOT_ESTABLISHED on 464/464"
          say "               candidates. The book side is captured; the venue"
          say "               side has only a 380-char listing description,"
          say "               which states 1 of 7 applicable conditions."
          say "not_captured   nothing here is written into the repository."
          say "               A retrieval is evidence; which sentence states"
          say "               which condition is a reading, made deliberately."
          say ""

          # Candidates, most specific first. Each is a GUESS at where the
          # venue might publish per-condition grading rules; a 404 is a real
          # answer and is reported as one.
          CAND="https://docs.polymarket.us/settlement
          https://docs.polymarket.us/rules
          https://docs.polymarket.us/market-rules
          https://docs.polymarket.us/faqs/settlement
          https://docs.polymarket.us/faqs/market-resolution
          https://docs.polymarket.us/resolution
          https://docs.polymarket.us/sports-rules
          https://docs.polymarket.us/fees
          https://docs.polymarket.us/
          https://polymarket.us/rules
          https://polymarket.us/terms"

          if [ -n "${EXTRA:-}" ]; then
            for U in ${EXTRA//,/ }; do CAND="$CAND
          $U"; done
          fi

          i=0
          OK=0
          printf '%s\n' "$CAND" | while read -r U; do
            U=$(printf '%s' "$U" | tr -d '[:space:]')
            [ -z "$U" ] && continue
            i=$((i+1))
            CODE=$(curl -sS -L --max-time 60 \
                     -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125 Safari/537.36" \
                     -H "Accept: text/html,application/xhtml+xml" \
                     -H "Accept-Language: en-US,en;q=0.9" \
                     -o "/tmp/v$i.html" -w '%{http_code}' "$U" 2>/tmp/e$i || echo "000")
            BYTES=$(wc -c < "/tmp/v$i.html" 2>/dev/null || echo 0)
            say "----------------------------------------------------------------"
            say "SOURCE $i  $U"
            say "  http $CODE   bytes $BYTES"
            if [ "$CODE" != "200" ] || [ "$BYTES" -lt 200 ]; then
              say "  NOT CAPTURED -- this source answered nothing usable."
              # `head -c` under pipefail sends the producer SIGPIPE and ends
              # the step. Read a bounded slice with dd instead.
              dd if="/tmp/e$i" bs=1 count=200 2>/dev/null \
                | tee -a "$GITHUB_STEP_SUMMARY" || true
              say ""
              continue
            fi
            say ""
            MAXC="${MAXC:-6000}" python3 - "/tmp/v$i.html" <<'PY' 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          import html
          import os
          import re
          import sys

          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          # Scripts and styles first, or their bodies land in the text.
          raw = re.sub(r"(?is)<(script|style|noscript)[^>]*>.*?</\1>", " ", raw)
          txt = html.unescape(re.sub(r"(?s)<[^>]+>", "\n", raw))
          lines = [ln.strip() for ln in txt.splitlines()]
          lines = [ln for ln in lines if ln]
          body = "\n".join(lines)
          cap = int(os.environ.get("MAXC") or 6000)

          # WHICH OF THE SEVEN CONDITIONS DOES THIS DOCUMENT EVEN MENTION?
          # A keyword hit is NOT a captured rule -- it says "there is a
          # sentence here worth reading", which is what this job is for.
          PROBES = {
              "COMPLETED_IN_REGULATION": r"regulation|official game|final score",
              "DECIDED_AFTER_REGULATION": r"extra inning|overtime|extra time",
              "CALLED_AND_GRADED": r"called game|shortened|curtailed",
              "STOPPED_BEFORE_THE_MINIMUM": r"minimum|before .{0,20}innings",
              "SUSPENDED_AND_RESUMED": r"suspend|resum",
              "POSTPONED_OR_ABANDONED": r"postpon|abandon",
              "VOID_OR_REFUND": r"\bvoid|refund|stake.{0,20}return|cancel",
          }
          print("  words %d" % len(body.split()))
          print("  CONDITION KEYWORDS PRESENT (a mention, not a rule):")
          for name, pat in PROBES.items():
              n = len(re.findall(pat, body, re.I))
              print("    %-28s %s" % (name, ("%d hit(s)" % n) if n else "-"))
          print("")
          print("  ---- extracted text, the publisher's own words ----")
          print(body[:cap])
          if len(body) > cap:
              print("  ... truncated at %d of %d characters" % (cap, len(body)))
          PY
          done

          echo '```' >> "$GITHUB_STEP_SUMMARY"
