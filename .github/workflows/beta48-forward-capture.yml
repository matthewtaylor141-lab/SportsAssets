# BETA48 FORWARD — the prospective capture. READ ONLY. NO CREDENTIAL.
#
# WHY THIS EXISTS. The retrospective programme is finished: Engine A closed on
# total economics, Engine B failed its holdout, and the maker ledger measured
# against RN1's flow came out negative. Every one of those answers was limited
# by the same thing — a dataset selected by one whale, on the wrong venue, with
# prices and outcomes that never met. This captures the board BETTOR actually
# trades, with the settlement follow-up whose absence was the entire gap.
#
# CAPABILITY BOUNDARY, unchanged from the authorized run85 collector and
# re-proved by AST scan before the job is allowed to contact anything:
#   GET only. gateway.polymarket.us only — never api.polymarket.us. No
#   credential, no repository secret, no wallet, no signer, no authentication
#   header, no trading SDK, no order or cancel endpoint, no POST/PUT/PATCH/
#   DELETE. 2.0 rps ceiling as OUR restraint, Retry-After honoured exactly,
#   never raised to buy more samples. mirror_live stays false; this job cannot
#   reach anything that could change it.
#
# THE OFFLINE TESTS RUN FIRST and the job refuses to contact the venue if any
# fails. The capability boundary is not a promise in a comment — it is a gate.
#
# RATE GUARD IS THE CONCURRENCY GROUP. Two capture jobs at once would double
# the aggregate request rate, which the rate policy forbids. cancel-in-progress
# is false, so a late segment queues and the next cron is dropped rather than
# stacked.
#
# NO PROFITABILITY CLAIM. The runner records responses and derived
# observations. It computes no expectancy, no ROI, no fill probability and no
# fee-adjusted figure. TOUCH is never written into a FILL field. Fills are
# decided offline, later, under frozen models.
#
# THROUGHPUT IS MEASURED, NOT ASSUMED. Board size, achieved request rate and
# settlement arrivals come out of the first runs; every calendar estimate in
# the sequential programme derives from those numbers afterwards.

name: beta48-forward-capture

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      depth_seconds:
        description: "Seconds of dense cohort sampling this segment"
        required: false
        default: "1800"
      depth_cohort:
        description: "Markets in the dense cohort (nearest to start)"
        required: false
        default: "8"
      depth_interval:
        description: "Seconds between dense cycles"
        required: false
        default: "5"
      breadth_book_reads:
        description: "Markets that also get a book read (0 = board quotes only)"
        required: false
        default: "0"
      panel_per_stratum:
        description: "Depth-panel markets per decision-time stratum"
        required: false
        default: "4"
      panel_rounds:
        description: "Depth-panel passes per segment"
        required: false
        default: "3"
      panel_selection:
        description: >-
          Within-stratum order. Defaults to the ORIGINAL lexicographic rule so
          a dispatch that does not ask for the new one behaves exactly as
          before. SALTED_HASH_WITHIN_FROZEN_STRATA removes the alphabetic
          sport-name artifact; the salt is frozen in fwd_collect.py.
        required: false
        default: "LEXICOGRAPHIC_WITHIN_FROZEN_STRATA"
        type: choice
        options:
          - LEXICOGRAPHIC_WITHIN_FROZEN_STRATA
          - SALTED_HASH_WITHIN_FROZEN_STRATA

      # ── BRANCH-LOCAL ADDITION, authorized 2026-09-22 ───────────────
      #
      # WHY IT IS IN THIS FILE AND NOT A NEW ONE. `workflow_dispatch`
      # resolves the workflow by ID against the DEFAULT branch, so a
      # workflow that exists only on a feature branch cannot be
      # dispatched at all -- that is the 404 the earlier attempt hit.
      # A workflow that IS on the default branch can be dispatched at
      # any ref, and GitHub then runs the file AS IT EXISTS AT THAT
      # REF. So the route is to extend an already-dispatchable
      # workflow on the release branch, which is what this is.
      #
      # THIS ADDITION NOW REACHES THE DEFAULT BRANCH, as part of the
      # authorized release. The 2-hourly schedule is unaffected: the
      # `capture` job's condition names the event, so a scheduled run
      # always takes the original collector path, and the `manifest`
      # job cannot be reached from a schedule at all.
      #
      # Setting this input runs the manifest capture INSTEAD OF the
      # forward capture -- see the `if:` on both jobs. It never runs
      # both, so a manifest dispatch cannot start a 120-minute
      # collection by accident.
      manifest_et_date:
        description: >-
          ET date (YYYY-MM-DD) for the bounded incentive-programme
          manifest capture. Set this and the forward capture is SKIPPED
          and the manifest capture runs instead. Leave blank for the
          ordinary forward capture.
        required: false
        default: ""

permissions:
  contents: write


concurrency:
  # THE GLOBAL PMUS VENUE-ACCESS DOMAIN. Every workflow that can reach
  # gateway.polymarket.us shares this one group, so two BETTOR collectors can
  # never read the venue at the same time and contaminate each other's
  # measurements. The ladder in run 35129103916 was reported as isolated and
  # was not: run85-phase2-capture held its own group and ran throughout.
  #
  # QUEUE, NEVER CANCEL: an evidence run must not be killed mid-collection by
  # a scheduled job. The loser waits its turn.
  group: pmus-public-read-global
  cancel-in-progress: false
  # queue: max added 2026-09-18 (sprint override, queue repair).
  #
  # WHY EVERY MEMBER NEEDS IT. GitHub keeps at most ONE pending run per
  # concurrency group, and the run that ARRIVES decides what happens to
  # the one already waiting. `queue: max` was set on
  # beta48-substantive-capture alone, so on 2026-09-18 at 14:06:52Z the
  # scheduled beta48-forward-capture arrived and the waiting evidence run
  # was cancelled one second later. A queue policy on the waiter protects
  # nothing; it has to be on the arrival.
  #
  # NOTHING ELSE CHANGES: same group, cancel-in-progress still false, same
  # schedule, same job, same collector code.
  queue: max

jobs:
  capture:
    # SKIPPED when a manifest date is supplied. The two jobs are
    # mutually exclusive so one dispatch never does both.
    #
    # THE event_name TEST IS NOT REDUNDANT, and leaving it out would be
    # the most expensive kind of subtle. On a SCHEDULED run there is no
    # `inputs` object at all, so `github.event.inputs.manifest_et_date`
    # is null; GitHub casts both sides to a number when the types
    # differ, null and '' both become 0, and the comparison happens to
    # come out true. The 2-hourly collector would therefore keep
    # running -- by coincidence of a coercion rule, with the whole
    # scheduled collector resting on it. Naming the event makes the
    # scheduled path unconditional instead of lucky.
    if: >-
      github.event_name != 'workflow_dispatch'
      || github.event.inputs.manifest_et_date == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/session-njaewf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the one dependency
        run: python -m pip install --quiet "httpx==0.27.2" "pytest==8.3.3"

      # THE GATE. No venue contact until the boundary is proved.
      - name: Prove the capability boundary offline
        run: python -m pytest research/beta48/forward/test_fwd_collect.py -q

      # The venue's own rule pages, captured so the fee coefficient and the
      # reward schedule stop being relayed numbers. Runs FIRST so every later
      # observation in the segment sits beside the rules in force at the time.
      - name: Capture the incentive and fee rules in force
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          D=research/beta48/forward/evidence/seg_$SEG
          mkdir -p "$D"
          python research/beta48/forward/fwd_collect.py rules --out "$D"

      - name: Enumerate the board to a terminal boundary or a named prefix
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          D=research/beta48/forward/evidence/seg_$SEG
          mkdir -p "$D"
          python research/beta48/forward/fwd_collect.py board --out "$D"

      # Every board row already carries both quotes, so breadth costs no venue
      # requests by default. One book read per market would be ~20,000
      # requests — about 2.8 h at our 2 rps ceiling — which does not fit a
      # segment, and capping the sample would reintroduce selection bias.
      - name: Breadth — one row per market across the observed prefix, no sampling
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          D=research/beta48/forward/evidence/seg_$SEG
          python research/beta48/forward/fwd_collect.py breadth \
            --out "$D" --board "$D/board.json" \
            --book-reads "${{ github.event.inputs.breadth_book_reads || 0 }}" \
            --registry research/beta48/forward/evidence/registry.json

      - name: Settlement follow-up — the step whose absence was the gap
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          D=research/beta48/forward/evidence/seg_$SEG
          python research/beta48/forward/fwd_collect.py settle \
            --out "$D" \
            --registry research/beta48/forward/evidence/registry.json

      # A SEPARATE DATASET from the breadth census, never pooled with it.
      # Breadth is the whole observed prefix with no selection; this is a
      # stratified sample on decision-time programme facts only, frozen before
      # any economics are examined, for the Target Size scoring-range question.
      - name: Incentive depth panel — the Target Size question
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          D=research/beta48/forward/evidence/seg_$SEG
          python research/beta48/forward/fwd_collect.py panel \
            --out "$D" --board "$D/board.json" --rules "$D/rules.json" \
            --per-stratum "${{ github.event.inputs.panel_per_stratum || 4 }}" \
            --rounds "${{ github.event.inputs.panel_rounds || 3 }}" \
            --panel-selection "${{ github.event.inputs.panel_selection || 'LEXICOGRAPHIC_WITHIN_FROZEN_STRATA' }}" \
            --interval 30

      - name: Depth — dense cohort, for execution questions only
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          D=research/beta48/forward/evidence/seg_$SEG
          python research/beta48/forward/fwd_collect.py depth \
            --out "$D" --board "$D/board.json" \
            --seconds "${{ github.event.inputs.depth_seconds || 1800 }}" \
            --cohort "${{ github.event.inputs.depth_cohort || 8 }}" \
            --interval "${{ github.event.inputs.depth_interval || 5 }}"

      - name: Seal and commit the segment
        env:
          SEG: ${{ github.run_id }}
        run: |
          set -e
          D=research/beta48/forward/evidence/seg_$SEG
          ( cd "$D" && sha256sum * > SEALED.sha256 2>/dev/null || true )
          gzip -9 "$D"/breadth.jsonl "$D"/depth.jsonl "$D"/board_raw.jsonl \
                  "$D"/settle_raw.jsonl "$D"/incentives_raw.jsonl "$D"/panel.jsonl \
                  "$D"/rules_docs.jsonl 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="beta48-forward/seg-$SEG"
          git checkout --orphan "$BR"
          git rm -rq --cached . || true
          git add -f "$D" research/beta48/forward/evidence/registry.json
          git commit -qm "BETA48 forward segment $SEG [skip render]" || exit 0
          for i in 1 2 4 8 16; do
            git push -f origin "$BR" && break
            echo "push failed, retrying in ${i}s"; sleep "$i"
          done
          echo "BETA48_FORWARD_BRANCH $BR"

  # ── BRANCH-LOCAL: THE BOUNDED INCENTIVE MANIFEST CAPTURE ──────────
  #
  # Runs INSTEAD OF the forward capture when `manifest_et_date` is set.
  #
  # WHAT IT PRESERVES, deliberately and each for a reason:
  #   - the workflow-level concurrency group `pmus-public-read-global`,
  #     so this can never read the venue while another BETTOR collector
  #     is reading it;
  #   - GET only, gateway.polymarket.us only, and NO CREDENTIAL. No
  #     `secrets.` reference appears in this job. `/v1/incentives` is
  #     unauthenticated; `/v1/incentives/earnings`, which is not, is
  #     never contacted;
  #   - the preflight allowance, which is DURABLE. The ledger is a
  #     committed file, seeded from what earlier attempts already
  #     spent, so a re-dispatch resumes instead of resetting. Two of
  #     six are already gone.
  #
  # IT CHECKS OUT THE DISPATCHED COMMIT -- `github.sha`, not a branch
  # name -- so what ran is identifiable after the fact even if the
  # branch moves.
  manifest:
    # Dispatch only, and only with a date. A scheduled run can never
    # reach this job.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.manifest_et_date != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Refuse to touch the auto-deploy branch
        run: |
          set -e
          # A capture that can commit to the branch the services track
          # is a deployment mechanism wearing a research hat.
          if [ "${{ github.ref_name }}" = "claude/session-njaewf" ]; then
            echo "REFUSED: dispatched at the auto-deploy branch."
            echo "Dispatch this at the untracked release branch instead."
            exit 1
          fi
          echo "ref_name = ${{ github.ref_name }}   sha = ${{ github.sha }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # THE GATE, kept from the forward capture: no venue contact until
      # the capability boundary is proved offline.
      - name: Prove the capability boundary offline
        run: |
          set -e
          python -m pip install --quiet "httpx==0.27.2" "pytest==8.3.3"
          python -m pytest research/beta48/forward/test_fwd_collect.py -q

      - name: Show the allowance before spending any of it
        run: python -c "import json;d=json.load(open('research/beta48/acceptance/preflight_allowance.json'));print('cap',d['cap'],'spent',d['spent'],'remaining',d['remaining'])"

      - name: Capture the programme manifest
        id: cap
        run: |
          set +e
          python research/beta48/capture_incentive_manifest.py \
            --et-date "${{ github.event.inputs.manifest_et_date }}" \
            --where "github-actions run ${{ github.run_id }}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Show the allowance after
        if: always()
        run: python -c "import json;d=json.load(open('research/beta48/acceptance/preflight_allowance.json'));print('cap',d['cap'],'spent',d['spent'],'remaining',d['remaining']);print('attempts',len(d['attempts']))"

      # COMMITTED WHATEVER THE CAPTURE RETURNED. A refused or empty
      # capture is evidence too, and the spent allowance must reach the
      # repository even when nothing usable came back -- otherwise a
      # failure is a way to spend requests without recording them.
      - name: Commit the manifest and the allowance
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/beta48/acceptance/incentive_manifest.json \
                  research/beta48/acceptance/preflight_allowance.json
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          git commit -qm "Capture the incentive programme manifest (run ${{ github.run_id }}) [skip render]"
          for i in 1 2 4 8 16; do
            git push origin HEAD:refs/heads/${{ github.ref_name }} && break
            echo "push failed, retrying in ${i}s"; sleep "$i"
          done
          git log --oneline -1

      - name: Report the capture verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          m = json.load(open('research/beta48/acceptance/incentive_manifest.json'))
          fp = m.get('freeze_preview') or {}
          print('programs      ', len(m.get('programs') or []))
          print('pages_read    ', m.get('pages_read'))
          print('errors        ', json.dumps(m.get('errors'))[:300])
          print('freeze ok     ', fp.get('ok'), '--', fp.get('why'))
          print('markets       ', fp.get('markets'))
          print('programmes    ', fp.get('distinct_programs'))
          print('events        ', fp.get('distinct_events'))
          PY
