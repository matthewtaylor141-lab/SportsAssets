# ROTATE A SERVICE SECRET WITHOUT THE SECRET EVER BEING AN INPUT.
#
# ── WHY THIS IS ITS OWN FILE, AND NOT AN ACTION IN render-ops ─────────
#
# It belongs in `render-ops` on every other ground. It cannot go there:
# `render-ops.yml` is 511,578 bytes against GitHub's 512,000-byte hard limit for
# a workflow file, which is 422 bytes of headroom. Adding this action to it took
# the file to 515,157 bytes -- OVER the limit, at which point GitHub rejects the
# whole file and the authorized API-only deploy route stops working. The
# repository's own size guard caught it; that is what the guard is for.
#
# So the split is a consequence of a real constraint, recorded here rather than
# left to look like a preference.
#
# ── WHY `env-set` IS NOT SUITABLE FOR A CREDENTIAL ────────────────────
#
# `render-ops` → `env-set` takes the value in its `arg` input. workflow_dispatch
# inputs are RECORDED WITH THE RUN and readable through the API, so masking the
# log does not help -- the input is stored outside the log. A credential set that
# way is a credential written down.
#
# ── WHAT THIS DOES INSTEAD ───────────────────────────────────────────
#
# The value is GENERATED ON THE RUNNER from the OS CSPRNG, PUT straight to
# Render, and then cleared. It is never an input, never printed, never echoed,
# never returned, and never written to a file. The operator reads it from the
# Render dashboard, which is the private mechanism.
#
# WHAT IS PRINTED: the key name, the character count, and whether the PUT
# succeeded. Not the value, not a hash, not a prefix -- a prefix of a rotated
# credential is a head start.
name: secret-rotate

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Render service name'
        required: false
        default: 'sportsassets-api'
      key:
        description: >-
          The env var to rotate: A-Z, 0-9 and underscore only. NO VALUE -- the
          value is generated on the runner. Allowed keys are pinned in the job.
        required: true
      confirm:
        description: 'Type DO to allow the rotation'
        required: true
        default: ''
      render_key:
        description: 'Render API key (only if the RENDER_API_KEY secret is not set)'
        required: false
        default: ''

# ONE ROTATION AT A TIME. Two concurrent rotations of the same key would leave
# the service holding one value and whoever read the dashboard holding the other.
concurrency:
  group: secret-rotate-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Rotate
        env:
          KEY_SECRET: ${{ secrets.RENDER_API_KEY }}
          KEY_INPUT: ${{ inputs.render_key }}
          SERVICE: ${{ inputs.service }}
          WANT: ${{ inputs.key }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -uo pipefail
          [ "$CONFIRM" = "DO" ] || { echo "refused: confirm must be DO"; exit 1; }
          KEY="${KEY_SECRET:-$KEY_INPUT}"
          [ -n "$KEY" ] || { echo "::error::no Render API key"; exit 1; }
          echo "::add-mask::$KEY"
          API=https://api.render.com/v1

          # ── THE KEY MUST BE ON THE ALLOW LIST ──────────────────────
          #
          # An open key name would let this job overwrite DATABASE_URL or a venue
          # credential with 48 random bytes, which is a data-loss button rather
          # than a rotation. These are the three authentication credentials, and
          # nothing else is rotatable here.
          case "$WANT" in
            ADMIN_TOKEN|DESK_PASSWORD|OPERATOR_PASSWORD) : ;;
            *) echo "refused: '$WANT' is not a rotatable authentication credential."
               echo "allowed: ADMIN_TOKEN, DESK_PASSWORD, OPERATOR_PASSWORD"
               exit 1 ;;
          esac

          ID=$(curl -sS --max-time 45 -H "Authorization: Bearer $KEY" \
                 -H "Accept: application/json" \
                 "$API/services?name=$SERVICE&limit=20" \
               | jq -r --arg n "$SERVICE" \
                   '.[]? | select(.service.name==$n) | .service.id' | head -1)
          [ -n "$ID" ] || { echo "::error::no service named $SERVICE"; exit 1; }
          echo "rotating $WANT on $SERVICE ($ID)"

          # 48 bytes of OS entropy, URL-safe. Generated HERE and nowhere else.
          V=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          echo "::add-mask::$V"
          echo "  generated ${#V} characters from the OS CSPRNG on this runner"

          CODE=$(curl -sS --max-time 45 -o /tmp/r.json -w '%{http_code}' -X PUT \
                 -H "Authorization: Bearer $KEY" -H "Accept: application/json" \
                 -H "Content-Type: application/json" \
                 -d "{\"value\":$(printf '%s' "$V" | jq -Rs .)}" \
                 "$API/services/$ID/env-vars/$WANT")
          V=""
          echo "HTTP $CODE"
          case "$CODE" in
            200|201) : ;;
            *) echo "::error::the rotation was REFUSED (HTTP $CODE). The OLD value still stands."
               head -c 300 /tmp/r.json; rm -f /tmp/r.json; exit 1 ;;
          esac
          jq -r '"  stored: \(.key // "?") (\((.value // "") | length) chars)"' \
            /tmp/r.json 2>/dev/null || true
          rm -f /tmp/r.json

          {
            echo "### rotated \`$WANT\` on \`$SERVICE\`"
            echo
            echo "The value is **not** in this log, **not** an input to this run,"
            echo "and **not** in any file. Read it from:"
            echo
            echo "    Render -> $SERVICE -> Environment -> $WANT"
            echo
            if [ "$WANT" = "ADMIN_TOKEN" ]; then
              echo "**Every existing session is now invalid.** \`ADMIN_TOKEN\` is the"
              echo "HMAC signing key for every desk, wall and command session token,"
              echo "so rotating it revokes all of them with no session store to purge."
              echo "That is the intended effect when sessions may have been minted"
              echo "against a compromised password."
            fi
            echo
            echo "Render redeploys the service on an env change."
          } >> "$GITHUB_STEP_SUMMARY"
