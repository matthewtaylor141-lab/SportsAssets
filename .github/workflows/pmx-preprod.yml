name: pmx-preprod

# PREPRODUCTION ONLY. Talks to the institutional PRE-PRODUCTION exchange
# (api.preprod.polymarketexchange.com / pmx-preprod.us.auth0.com) from the
# runner, which has open internet. No production host is ever contacted:
# the base URLs are fixed to preprod below and are not inputs. Read-only
# actions (whoami, health, refdata, bbo, positions, open-orders,
# report-orders, reconcile-order, order-stream, order-preview,
# duplicate-preview) need no confirm; any action
# that could send an order needs confirm=DO.
#
# THE CREDENTIALS COME FROM THE SECRET STORE, NOT FROM THE FORM.
#
# They used to be workflow_dispatch INPUTS. The private key was handled
# carefully -- read from the event payload on disk and masked before
# anything could print it -- but the other three were not secret at all:
# `client_id`, `participant_id` and `key_id` were mapped through a step's
# `env:`, and the runner prints a step's env block into the log. Runs 1-24
# on 2026-09-10 therefore carry the firm's client id, participant resource
# name and key id in plain text in their logs, for anyone who can read this
# repository's Actions history.
#
# They are now PMX_CLIENT_ID / PMX_PARTICIPANT_ID / PMX_KEY_ID /
# PMX_PRIVATE_KEY_B64 in the repository secret store, so the runner masks
# them, nobody has to paste a key into a web form to run a read, and a
# scheduled or scripted dispatch becomes possible at all. Every one of them
# is read from the event-free `secrets` context into the SCRIPT rather than
# through a rendered `run:` line, for the same reason the key already was.
#
# Ask the venue to rotate the exposed preprod key id before this lane is
# used for anything that matters; the identifiers in those logs cannot be
# unpublished.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "whoami | health | refdata | instruments (arg=JSON body) | bbo (arg=symbol) | book (arg=symbol) | positions (arg=account name) | open-orders | report-orders (arg=JSON) | reconcile-order (arg=JSON {orderId?, clordId?, symbol?, startTime?, endTime?}) | order-stream (arg=JSON {seconds?, symbol?}) | order-preview (arg=JSON) | duplicate-preview (arg=JSON; PREVIEW REPEATABILITY ONLY, places nothing, establishes NOTHING about insert idempotency) | order (arg=JSON, needs confirm=DO) | cancel (arg=JSON {orderId|clordId, symbol}, needs confirm=DO)"
        required: true
        type: string
      arg:
        description: "action argument: symbol for bbo; JSON body for order-preview / order; refdata filter text; JSON for reconcile-order and order-stream"
        required: false
        type: string
        default: ""
      confirm:
        description: "DO to allow an action that can send an order"
        required: false
        type: string
        default: ""

concurrency:
  group: pmx-preprod
  cancel-in-progress: false

jobs:
  preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PMX_AUTH0_DOMAIN: pmx-preprod.us.auth0.com
      PMX_BASE_URL: https://api.preprod.polymarketexchange.com
      PMX_AUDIENCE: https://api.preprod.polymarketexchange.com
    steps:
      - name: Stage the key from the secret store
        # A repository secret is masked by the runner before any step runs,
        # so `env:` is safe for it -- unlike a workflow_dispatch input,
        # which is printed verbatim in the step's env block.
        env:
          KEY_B64: ${{ secrets.PMX_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "${KEY_B64:-}" ] || { echo "refused: PMX_PRIVATE_KEY_B64 is not set"; exit 1; }
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/pk.pem"
          head -c 32 "$RUNNER_TEMP/pk.pem" | grep -q "BEGIN" || { echo "refused: key is not a PEM"; exit 1; }
          echo "key staged ($(wc -c < "$RUNNER_TEMP/pk.pem") bytes)"
      - name: Install
        run: pip install -q pyjwt cryptography requests
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          ARG: ${{ inputs.arg }}
          CONFIRM: ${{ inputs.confirm }}
          PMX_CLIENT_ID: ${{ secrets.PMX_CLIENT_ID }}
          PMX_PARTICIPANT_ID: ${{ secrets.PMX_PARTICIPANT_ID }}
          PMX_KEY_ID: ${{ secrets.PMX_KEY_ID }}
        run: |
          set -euo pipefail
          for v in PMX_CLIENT_ID PMX_PARTICIPANT_ID PMX_KEY_ID; do
            [ -n "${!v:-}" ] || { echo "refused: $v is not set in the secret store"; exit 1; }
          done
          case "$ACTION" in
            whoami|health|refdata|instruments|bbo|book|positions|open-orders|report-orders|order-preview) ;;
            reconcile-order) ;;      # the documented search contract; reads only
            duplicate-preview) ;;    # PREVIEW repeatability only; places nothing
            order-stream) ;;         # subscribe and observe; sends no order
            order|cancel) if [ "$CONFIRM" != "DO" ]; then echo "refused: $ACTION needs confirm=DO"; exit 1; fi ;;
            *) echo "refused: unknown action '$ACTION'"; exit 1 ;;
          esac
          echo "== pmx-preprod $ACTION at $(date -u +%FT%TZ) base=$PMX_BASE_URL =="
          python3 - <<'PY'
          import json, os, pathlib, sys, time, uuid
          import jwt, requests
          act = os.environ["ACTION"]; arg = os.environ.get("ARG", "")
          cid = os.environ["PMX_CLIENT_ID"]; kid = os.environ["PMX_KEY_ID"]
          dom = os.environ["PMX_AUTH0_DOMAIN"]; base = os.environ["PMX_BASE_URL"].rstrip("/")
          aud = os.environ["PMX_AUDIENCE"]; pid = os.environ["PMX_PARTICIPANT_ID"]
          pk = open(os.path.join(os.environ["RUNNER_TEMP"], "pk.pem")).read()
          if act == "health":
              r = requests.get(f"{base}/v1/health", timeout=30)
              print("health", r.status_code, r.text[:500]); sys.exit(0)
          def token():
              now = int(time.time())
              # the venue's own helper: aud = https://<domain>/ and a form-encoded token call
              a = jwt.encode({"iss": cid, "sub": cid, "aud": f"https://{dom}/", "iat": now,
                              "exp": now + 60, "jti": str(uuid.uuid4())}, pk, algorithm="RS256",
                             headers={"kid": kid})
              r = requests.post(f"https://{dom}/oauth/token", data={
                  "client_id": cid,
                  "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-bearer",
                  "client_assertion": a, "audience": aud, "grant_type": "client_credentials"},
                  headers={"Content-Type": "application/x-www-form-urlencoded"}, timeout=30)
              print("token", r.status_code, {k: v for k, v in r.json().items() if k != "access_token"} if r.headers.get("content-type", "").startswith("application/json") else r.text[:300])
              r.raise_for_status()
              return r.json()["access_token"]
          t = token()
          try:
              import base64
              p = t.split(".")[1]; p += "=" * (-len(p) % 4)
              print("scopes:", json.loads(base64.urlsafe_b64decode(p)).get("scope"))
          except Exception as e:
              print("scope decode failed", e)
          H = {"Authorization": f"Bearer {t}", "X-Client-Id": cid, "X-Request-Id": str(uuid.uuid4()),
               "x-participant-id": pid}
          def show(r):
              print(r.request.method, r.url, "->", r.status_code)
              try: print(json.dumps(r.json(), indent=1)[:12000])
              except Exception: print(r.text[:2000])
          if act == "whoami":
              show(requests.get(f"{base}/v1/whoami", headers=H, timeout=30))
              show(requests.get(f"{base}/v1/users", headers=H, timeout=30))
          elif act == "refdata":
              body = {}
              if arg.strip(): body = {"filter": arg.strip()}
              for path in ("/v1/refdata/symbols", "/v1/refdata/instruments", "/v1/refdata/metadata"):
                  r = requests.post(f"{base}{path}", headers=H, json=body, timeout=60)
                  print(path, "->", r.status_code); print(r.text[:6000])
          elif act == "bbo":
              show(requests.get(f"{base}/v1/orderbook/{arg.strip()}/bbo", headers=H, timeout=30))
          elif act == "book":
              show(requests.get(f"{base}/v1/orderbook/{arg.strip()}", headers=H, timeout=30))
          elif act == "instruments":
              # arg = the JSON body of POST /v1/refdata/instruments (pageSize, symbols,
              # clearingSym, tradableFilter, states, startTimeGte ...); {} lists the first page
              # a JSON list runs each body in turn (ListInstruments is capped at 6 req/min)
              bodies = json.loads(arg) if arg.strip() else {"pageSize": 20}
              if isinstance(bodies, dict): bodies = [bodies]
              for body in bodies[:5]:
                  r = requests.post(f"{base}/v1/refdata/instruments", headers=H, json=body, timeout=60)
                  print("POST /v1/refdata/instruments", json.dumps(body), "->", r.status_code)
                  try:
                      j = r.json()
                      for i in j.get("instruments", []):
                          md = i.get("metadata") or {}
                          print(" ", i.get("symbol"), i.get("state"), "px_scale", i.get("priceScale"), "tick", i.get("tickSize"),
                                "fq_scale", i.get("fractionalQtyScale"), "minqty", i.get("minimumTradeQty"),
                                "|", md.get("market_sport_type"), md.get("event_id"), md.get("long_participant_id"),
                                md.get("outcome_strike"), md.get("event_start_time"), "|", (i.get("description") or "")[:80])
                      print("  count", len(j.get("instruments", [])), "nextPageToken:", j.get("nextPageToken"))
                      print(json.dumps(j.get("instruments", [])[:1], indent=1)[:5000])
                  except Exception as e:
                      print(r.text[:3000], e)
          elif act == "positions":
              # arg = the account resource name (firms/<firm>/accounts/<account>)
              acct = arg.strip()
              show(requests.get(f"{base}/v1/positions", headers=H, params={"name": acct} if acct else None, timeout=30))
              show(requests.post(f"{base}/v1/positions/balance", headers=H, json={"account": acct, "currency": "USD"} if acct else {}, timeout=30))
              show(requests.post(f"{base}/v1/positions/balances", headers=H, json={"account": acct} if acct else {}, timeout=30))
              show(requests.get(f"{base}/v1/accounts/accounts", headers=H, timeout=30))
          elif act == "open-orders":
              show(requests.get(f"{base}/v1/trading/orders/open", headers=H, timeout=30))
          elif act == "report-orders":
              body = json.loads(arg) if arg.strip() else {"stateFilter": "ORDER_STATE_FILTER_OPEN"}
              show(requests.post(f"{base}/v1/report/orders/search", headers=H, json=body, timeout=30))
          elif act == "reconcile-order":
              # THE DOCUMENTED SEARCH CONTRACT, used as documented.
              #   https://docs.polymarket.us/api-reference/report/search-orders
              # `orderId` and `clordId` are DISTINCT SINGULAR fields. The
              # earlier probe tried plural and capitalisation variants; that
              # was guessing, and it is gone.
              #
              # WHAT THIS RECONCILES. On 2026-09-10 an insert answered
              # 200 {"orderId": "CDHM9PJV16R7"} and the order was then absent
              # from open orders, positions and every search we ran. Those
              # searches were run wrong. This runs them right, and it does
              # NOT assume the exchange-returned id is our client id: the
              # two are asked for separately, and the submitted clordId --
              # which that run never recorded -- is searched for only if the
              # operator supplies it.
              #
              # arg = JSON:
              #   {"orderId": "...",          the exchange id, if known
              #    "clordId": "...",          OUR submitted id, if known
              #    "symbol": "...",           bind the search to the instrument
              #    "startTime": "...Z",       the historical window
              #    "endTime": "...Z",
              #    "pageSize": 100}
              #
              # AN EMPTY RESULT PROVES NOTHING. It is not evidence the order
              # was never submitted and it is not permission to send another.
              spec = json.loads(arg) if arg.strip() else {}
              acct = spec.get("account") or ""
              want_oid = spec.get("orderId")
              want_clord = spec.get("clordId")
              if not want_oid and not want_clord:
                  print("refused: reconcile-order needs orderId and/or clordId"); sys.exit(1)
              page_size = int(spec.get("pageSize") or 100)
              # the binding fields, applied to EVERY query below: an
              # unbound search can answer about another account's order
              bind = {}
              for k in ("symbol", "startTime", "endTime", "account",
                        "participantId", "stateFilter"):
                  if spec.get(k):
                      bind[k] = spec[k]
              print("BINDING", json.dumps(bind), "account_arg", bool(acct))

              seen_ids, seen_clords, receipts = set(), set(), []

              def walk(label, key, value):
                  # FOLLOW PAGINATION TO EXHAUSTION. A single page that does
                  # not contain the id is not "no record": the id may be on a
                  # page never read. A truncated walk is reported as
                  # TRUNCATED, never as empty.
                  token, pages, rows, truncated = "", 0, 0, False
                  while True:
                      body = {**bind, key: value, "pageSize": page_size}
                      if token:
                          body["pageToken"] = token
                      t0 = time.time()
                      r = requests.post(f"{base}/v1/report/orders/search",
                                        headers=H, json=body, timeout=30)
                      dt = time.time() - t0
                      pages += 1
                      try:
                          j = r.json()
                      except Exception:
                          j = None
                      got = (j or {}).get("order") or (j or {}).get("orders") or []
                      rows += len(got)
                      # SANITIZED RECEIPT: the request body (no credentials
                      # are in it), the status, the identifiers returned, and
                      # the timestamps. Never the full payload.
                      receipts.append({
                          "query": label, "page": pages, "request": body,
                          "status": r.status_code,
                          "requestedAt": t0, "elapsedS": round(dt, 3),
                          "returnedAt": time.time(),
                          "xRequestId": H["X-Request-Id"],
                          "rowIds": [{"id": o.get("id") or o.get("orderId"),
                                      "clordId": o.get("clordId") or o.get("clord_id"),
                                      "symbol": o.get("symbol"),
                                      "state": o.get("state"),
                                      "account": o.get("account"),
                                      "lastTransactTime": o.get("lastTransactTime")}
                                     for o in got],
                      })
                      print(f"{label} page {pages} -> {r.status_code} rows {len(got)}")
                      if r.status_code != 200:
                          print(r.text[:1500]); break
                      for o in got:
                          if o.get("id"): seen_ids.add(str(o["id"]))
                          if o.get("orderId"): seen_ids.add(str(o["orderId"]))
                          c = o.get("clordId") or o.get("clord_id")
                          if c: seen_clords.add(str(c))
                      token = (j or {}).get("nextPageToken") or ""
                      if not token:
                          break
                      if pages >= 50:
                          truncated = True
                          print(f"{label}: TRUNCATED after {pages} pages, a next token remains")
                          break
                  return {"query": label, "pages": pages, "rows": rows,
                          "truncated": truncated}

              summary = []
              if want_oid:
                  summary.append(walk("by-orderId", "orderId", want_oid))
              if want_clord:
                  summary.append(walk("by-clordId", "clordId", want_clord))

              # VALIDATE WHAT CAME BACK. A search bound to one identifier
              # that answers rows carrying a different one has not found our
              # order; saying so is the point of asking.
              print("SUMMARY", json.dumps(summary))
              print("IDS_RETURNED", json.dumps(sorted(seen_ids)))
              print("CLORDIDS_RETURNED", json.dumps(sorted(seen_clords)))
              matched = []
              if want_oid and str(want_oid) in seen_ids:
                  matched.append("orderId")
              if want_clord and str(want_clord) in seen_clords:
                  matched.append("clordId")
              any_truncated = any(s["truncated"] for s in summary)
              if matched:
                  print("RECONCILED_ON", json.dumps(matched))
              elif any_truncated:
                  print("RECONCILIATION_INCONCLUSIVE_TRUNCATED_WALK")
              else:
                  print("NOT_FOUND_ON_THIS_CONTRACT")
                  print("An empty result is NOT proof of non-submission and "
                        "NOT permission to retry. If the correct bound "
                        "searches cannot reconcile an acknowledged order, "
                        "the next step is a venue-support trace package, "
                        "not another order.")
              pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp"), "receipts.json") \
                      .write_text(json.dumps({"summary": summary,
                                              "receipts": receipts}, indent=1))
              print("receipts written for the artifact step")
          elif act == "duplicate-preview":
              # PREVIEW_REPEATABILITY. THAT IS THE WHOLE CLAIM.
              #
              # This previews the same clordId twice and reports what the
              # PREVIEW endpoint does with a repeat. It does NOT establish:
              #   * insert idempotency
              #   * duplicate-order protection
              #   * that a retry after a lost response is safe
              #   * any relaxation of the single-send boundary
              # The preview places nothing, so it cannot answer a question
              # about placing. A preview that happily accepts a repeat and
              # an insert that rejects one are entirely consistent, and so
              # are the opposites.
              #
              # A REAL duplicate-INSERT test is a separate, authorized
              # exercise. Its scope, maximum dummy exposure, observation and
              # cleanup plan are written up in
              # research/institutional/DUPLICATE_INSERT_PROPOSAL.md and it
              # must not be performed from here.
              #
              # arg = the JSON order request; its clordId is sent TWICE.
              body = json.loads(arg)
              req = body.get("request", body)
              if not req.get("clordId"):
                  print("refused: duplicate-preview needs a clordId in the request"); sys.exit(1)
              answers = []
              for attempt in (1, 2):
                  r = requests.post(f"{base}/v1/trading/orders/preview",
                                    headers=H, json=body, timeout=30)
                  answers.append(r.status_code)
                  print(f"PREVIEW attempt {attempt} clordId={req['clordId']} ->", r.status_code)
                  print(r.text[:2000])
              print("RESULT PREVIEW_REPEATABILITY", json.dumps(answers))
              print("SCOPE: this run establishes PREVIEW_REPEATABILITY only. "
                    "It establishes NOTHING about insert idempotency, "
                    "duplicate-order protection, or permission to relax the "
                    "single-send boundary. Those need the separate authorized "
                    "duplicate-insert test.")
          elif act == "order-stream":
              # THE ORDER STREAM, OBSERVED BEFORE THE NEXT ORDER TEST.
              #   https://docs.polymarket.us/streaming-endpoints/order-stream
              #
              # WHAT THIS RUN ESTABLISHES, and nothing beyond it: that a
              # subscription can be opened with this credential, what the
              # messages actually look like, which account they are scoped
              # to, which identifiers they carry (exchange id, clordId, and
              # whether an execution reports an AGGRESSOR), and what happens
              # on reconnect. The schema is READ OFF THE WIRE, not assumed:
              # this prints the observed top-level keys of each message
              # rather than asserting a shape we have not seen.
              #
              # It sends no order. It only listens.
              #
              # arg = JSON {"seconds": 60, "symbol": "...", "path": "..."}
              spec = json.loads(arg) if arg.strip() else {}
              seconds = float(spec.get("seconds") or 60)
              paths = ([spec["path"]] if spec.get("path") else
                       ["/v1/trading/orders/stream", "/v1/stream/orders",
                        "/v1/trading/orders/subscribe"])
              sub = {}
              if spec.get("symbol"):
                  sub["symbols"] = [spec["symbol"]]
              if spec.get("account"):
                  sub["account"] = spec["account"]

              def listen(path, label):
                  url = f"{base}{path}"
                  keys, msgs, execs, clords, accounts = set(), 0, 0, set(), set()
                  t0 = time.time()
                  try:
                      with requests.post(url, headers={**H, "Accept": "application/json"},
                                         json=sub, stream=True, timeout=(10, seconds + 15)) as r:
                          print(f"{label} {url} -> {r.status_code} "
                                f"content-type={r.headers.get('content-type')}")
                          if r.status_code != 200:
                              print(r.text[:1500]); return None
                          for line in r.iter_lines(decode_unicode=True):
                              if time.time() - t0 > seconds:
                                  break
                              if not line:
                                  continue
                              msgs += 1
                              try:
                                  m = json.loads(line[6:] if line.startswith("data: ") else line)
                              except Exception:
                                  print("  non-json frame:", str(line)[:200]); continue
                              if isinstance(m, dict):
                                  keys |= set(m.keys())
                                  blob = json.dumps(m)
                                  if "ggressor" in blob:
                                      execs += 1
                                  for k in ("clordId", "clord_id"):
                                      if m.get(k): clords.add(str(m[k]))
                                  if m.get("account"): accounts.add(str(m["account"]))
                                  if msgs <= 5:
                                      print(f"  msg {msgs}:", blob[:1200])
                  except Exception as exc:
                      print(f"{label}: {type(exc).__name__}: {str(exc)[:200]}")
                      return None
                  return {"path": path, "messages": msgs,
                          "topLevelKeys": sorted(keys),
                          "messagesMentioningAggressor": execs,
                          "clordIdsSeen": sorted(clords),
                          "accountsSeen": sorted(accounts),
                          "seconds": round(time.time() - t0, 1)}

              first = None
              for path in paths:
                  first = listen(path, "SUBSCRIBE")
                  if first:
                      break
              if not first:
                  print("ORDER_STREAM_NOT_ESTABLISHED: none of the tried paths "
                        "answered a stream. The documented path must be read "
                        "from the reference and passed as arg.path; this run "
                        "does NOT conclude the stream is unavailable.")
                  sys.exit(0)
              print("STREAM_OBSERVED", json.dumps(first))
              # RECONNECT: the same subscription again, so the run says
              # whether a second connection is accepted and whether it
              # replays or starts clean.
              second = listen(first["path"], "RECONNECT")
              print("RECONNECT_OBSERVED", json.dumps(second))
              pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp"), "receipts.json") \
                      .write_text(json.dumps({"stream": first,
                                              "reconnect": second}, indent=1))
              print("NOTE: an observed aggressor field on this stream is "
                    "evidence about OUR OWN executions only. Full-market "
                    "aggressor coverage and exact queue position remain "
                    "separate, unverified claims.")
          elif act in ("order-preview", "order"):
              body = json.loads(arg)
              path = "/v1/trading/orders/preview" if act == "order-preview" else "/v1/trading/orders"
              show(requests.post(f"{base}{path}", headers=H, json=body, timeout=30))
              if act == "order":
                  # read the order back at once so the run records what the venue holds
                  show(requests.get(f"{base}/v1/trading/orders/open", headers=H, timeout=30))
          elif act == "cancel":
              # arg = JSON CancelOrderRequest {orderId | clordId, symbol}; the open orders are
              # read back after the cancel so the run records the venue's answer
              body = json.loads(arg)
              show(requests.post(f"{base}/v1/trading/orders/cancel", headers=H, json=body, timeout=30))
              show(requests.get(f"{base}/v1/trading/orders/open", headers=H, timeout=30))
          PY
      - name: Stage the receipts for the artifact
        if: always()
        run: |
          mkdir -p receipts
          if [ -s "$RUNNER_TEMP/receipts.json" ]; then
            cp "$RUNNER_TEMP/receipts.json" "receipts/receipts_${{ github.run_id }}.json"
            echo "receipts staged ($(wc -c < receipts/receipts_${{ github.run_id }}.json) bytes)"
          else
            echo "this action wrote no receipts" > "receipts/receipts_${{ github.run_id }}.json"
          fi
      # SANITIZED RECEIPTS, RETAINED. reconcile-order and order-stream write
      # request bodies, statuses, the identifiers returned and the
      # timestamps -- never a key, a bearer, a signed assertion or a full
      # account payload. The evidence outlives the log.
      - name: Publish the receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmx-preprod-receipts-${{ github.run_id }}
          path: receipts/
          if-no-files-found: warn
      - name: Scrub
        if: always()
        run: rm -f "$RUNNER_TEMP/pk.pem"; echo scrubbed
