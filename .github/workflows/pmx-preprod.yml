name: pmx-preprod

# PREPRODUCTION ONLY. Talks to the institutional PRE-PRODUCTION exchange
# (api.preprod.polymarketexchange.com / pmx-preprod.us.auth0.com) from the
# runner, which has open internet. No production host is ever contacted:
# the base URLs are fixed to preprod below and are not inputs. Read-only
# actions (whoami, health, refdata, bbo, positions, open-orders,
# report-orders, reconcile-order, order-stream, grpc-probe, order-preview,
# duplicate-preview) need no confirm; any action
# that could send an order needs confirm=DO.
#
# THE CREDENTIALS COME FROM THE SECRET STORE, NOT FROM THE FORM.
#
# They used to be workflow_dispatch INPUTS. The private key was handled
# carefully -- read from the event payload on disk and masked before
# anything could print it -- but the other three were not secret at all:
# `client_id`, `participant_id` and `key_id` were mapped through a step's
# `env:`, and the runner prints a step's env block into the log. Runs 1-24
# on 2026-09-10 therefore carry the firm's client id, participant resource
# name and key id in plain text in their logs, for anyone who can read this
# repository's Actions history.
#
# They are now PMX_PREPROD_CLIENT_ID / PMX_PREPROD_PARTICIPANT_ID /
# PMX_PREPROD_KEY_ID / PMX_PREPROD_PRIVATE_KEY_B64 in the repository secret
# store -- PREFIXED, because the unprefixed PMX_* slots are PRODUCTION and
# belong to pmx-production.yml -- so the runner masks
# them, nobody has to paste a key into a web form to run a read, and a
# scheduled or scripted dispatch becomes possible at all. Every one of them
# is read from the event-free `secrets` context into the SCRIPT rather than
# through a rendered `run:` line, for the same reason the key already was.
#
# THE PRIVATE KEY WAS NOT EXPOSED, and that is verified rather than
# assumed: run 24 (job 102911933685) was re-read on 2026-09-19. The key
# never appeared in an `env:` block or a rendered `run:` line -- it was
# read from $GITHUB_EVENT_PATH with jq, ::add-mask::'d before the base64
# was decoded, written 0600 to $RUNNER_TEMP/pk.pem, and removed by the
# scrub step. The staging step printed only a byte count. No "BEGIN", no
# bearer token and no signed assertion appears in any of those logs.
#
# What IS in them is the client id, the participant resource name and the
# key id. Identifiers are not key material. Rotating the preprod kid is a
# HYGIENE RECOMMENDATION, not a prerequisite for anything, and it is the
# venue's to perform -- we do not revoke unilaterally. Nothing is blocked
# on it. The identifiers themselves cannot be unpublished.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "whoami | health | refdata | instruments (arg=JSON body) | bbo (arg=symbol) | book (arg=symbol) | positions (arg=account name) | open-orders | report-orders (arg=JSON) | reconcile-order (arg=JSON {orderId?, clordId?, symbol?, startTime?, endTime?}) | order-stream (arg=JSON {seconds?, symbol?, target?}) | grpc-probe (arg=JSON {targets?}; READ-ONLY hostname diagnostic over the documented preprod gRPC candidates) | order-preview (arg=JSON) | duplicate-preview (arg=JSON; PREVIEW REPEATABILITY ONLY, places nothing, establishes NOTHING about insert idempotency) | order (arg=JSON, needs confirm=DO) | cancel (arg=JSON {orderId|clordId, symbol}, needs confirm=DO)"
        required: true
        type: string
      arg:
        description: "action argument: symbol for bbo; JSON body for order-preview / order; refdata filter text; JSON for reconcile-order and order-stream"
        required: false
        type: string
        default: ""
      confirm:
        description: "DO to allow an action that can send an order"
        required: false
        type: string
        default: ""

concurrency:
  group: pmx-preprod
  cancel-in-progress: false

jobs:
  preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PMX_AUTH0_DOMAIN: pmx-preprod.us.auth0.com
      PMX_BASE_URL: https://api.preprod.polymarketexchange.com
      PMX_AUDIENCE: https://api.preprod.polymarketexchange.com
    steps:
      - uses: actions/checkout@v4
      - name: Stage the key from the secret store
        # A repository secret is masked by the runner before any step runs,
        # so `env:` is safe for it -- unlike a workflow_dispatch input,
        # which is printed verbatim in the step's env block.
        env:
          KEY_B64: ${{ secrets.PMX_PREPROD_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          # ── THE PREFIX IS THE ATTESTATION ──────────────────────────
          #
          # On 2026-09-19 the unprefixed PMX_* slots turned out to hold
          # PRODUCTION credentials. Nothing ran -- run 25 had already
          # failed at decoding and this lane has no schedule -- but it
          # was one working paste away from signing a PRODUCTION
          # assertion and posting it to the PREPRODUCTION Auth0 tenant.
          #
          # The first fix was a separate PMX_ENVIRONMENT secret to attest
          # the environment. That is now gone, replaced by something with
          # no moving part: this lane reads PMX_PREPROD_*, the production
          # lane reads PMX_*, and the two namespaces do not intersect.
          # An unprefixed slot is production; a prefixed one is
          # preproduction. Nothing to set, nothing to forget, and no way
          # for either lane to pick up the other's keys.
          #
          # The hosts were never the problem: every one below is fixed to
          # preprod and `assert_preprod` refuses anything else.
          # NOTHING BELOW ECHOES THE VALUE. Every branch reports a NAME.
          if [ -z "${KEY_B64:-}" ]; then
            echo "SECRET_MISSING: PMX_PREPROD_PRIVATE_KEY_B64 is not set"
            echo "  Preproduction credentials go in PMX_PREPROD_*."
            echo "  The unprefixed PMX_* slots are PRODUCTION and are read"
            echo "  by pmx-production.yml, never by this workflow."
            exit 1
          fi
          # EITHER FORM IS ACCEPTED, because the first attempt on 2026-09-19
          # (run 25) died on "base64: invalid input" -- the secret was set but
          # was not decodable, and a foot-gun that costs a dispatch round-trip
          # to diagnose is a defect in this step, not in the operator. A PEM
          # pasted as-is is now staged verbatim; anything else is treated as
          # base64 with whitespace stripped, since a wrapped paste is the
          # other likely shape.
          if printf '%s' "$KEY_B64" | head -c 64 | grep -q -- "-----BEGIN"; then
            printf '%s' "$KEY_B64" > "$RUNNER_TEMP/pk.pem"
            FORM=raw-pem
          else
            printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 -d \
              > "$RUNNER_TEMP/pk.pem" 2>/dev/null || {
              echo "SECRET_PRESENT_BUT_NOT_DECODABLE: the preprod key is"
              echo "  set but is neither a PEM nor valid base64 of one."
              echo "  Re-set it with:  base64 -w0 <key>.pem"
              echo "  (macOS: base64 -i <key>.pem | tr -d '\\n')"
              exit 1; }
            FORM=base64
          fi
          if ! head -c 64 "$RUNNER_TEMP/pk.pem" | grep -q -- "-----BEGIN"; then
            echo "SECRET_DECODED_BUT_NOT_A_PEM: the value decoded to"
            echo "  $(wc -c < "$RUNNER_TEMP/pk.pem") bytes with no PEM header."
            exit 1
          fi
          echo "key staged ($FORM, $(wc -c < "$RUNNER_TEMP/pk.pem") bytes)"
      - name: Install
        run: pip install -q pyjwt cryptography requests
      - name: Run the exploratory read
        if: ${{ !contains(fromJSON('["auth","reconcile-order","order-stream","grpc-probe"]'), inputs.action) }}
        env:
          ACTION: ${{ inputs.action }}
          ARG: ${{ inputs.arg }}
          CONFIRM: ${{ inputs.confirm }}
          PMX_PREPROD_CLIENT_ID: ${{ secrets.PMX_PREPROD_CLIENT_ID }}
          PMX_PREPROD_PARTICIPANT_ID: ${{ secrets.PMX_PREPROD_PARTICIPANT_ID }}
          PMX_PREPROD_KEY_ID: ${{ secrets.PMX_PREPROD_KEY_ID }}
        run: |
          set -euo pipefail
          for v in PMX_PREPROD_CLIENT_ID PMX_PREPROD_PARTICIPANT_ID PMX_PREPROD_KEY_ID; do
            [ -n "${!v:-}" ] || { echo "refused: $v is not set in the secret store"; exit 1; }
          done
          case "$ACTION" in
            whoami|health|refdata|instruments|bbo|book|positions|open-orders|report-orders|order-preview) ;;
            duplicate-preview) ;;    # PREVIEW repeatability only; places nothing
            auth|reconcile-order|order-stream|grpc-probe)
              echo "refused: $ACTION is served by the module step, not this one"; exit 1 ;;
            order|cancel) if [ "$CONFIRM" != "DO" ]; then echo "refused: $ACTION needs confirm=DO"; exit 1; fi ;;
            *) echo "refused: unknown action '$ACTION'"; exit 1 ;;
          esac
          echo "== pmx-preprod $ACTION at $(date -u +%FT%TZ) base=$PMX_BASE_URL =="
          python3 - <<'PY'
          import json, os, pathlib, sys, time, uuid
          import jwt, requests
          act = os.environ["ACTION"]; arg = os.environ.get("ARG", "")
          cid = os.environ["PMX_PREPROD_CLIENT_ID"]; kid = os.environ["PMX_PREPROD_KEY_ID"]
          dom = os.environ["PMX_AUTH0_DOMAIN"]; base = os.environ["PMX_BASE_URL"].rstrip("/")
          aud = os.environ["PMX_AUDIENCE"]; pid = os.environ["PMX_PREPROD_PARTICIPANT_ID"]
          pk = open(os.path.join(os.environ["RUNNER_TEMP"], "pk.pem")).read()
          if act == "health":
              r = requests.get(f"{base}/v1/health", timeout=30)
              print("health", r.status_code, r.text[:500]); sys.exit(0)
          def token():
              now = int(time.time())
              # TWO AUDIENCES, NOT ONE (corrected 2026-09-19).
              #   the assertion's `aud` CLAIM  -> Auth0's TOKEN ENDPOINT
              #   the request's `audience` FIELD -> the API base (PMX_AUDIENCE)
              # Until today the claim carried the bare issuer, f"https://{dom}/".
              # The venue accepted that on 2026-09-10, so it is tolerated -- but
              # the current documentation specifies the token endpoint, and that
              # is what we send. The form encoding is UNCHANGED: runs 1-24 prove
              # it is accepted, so the docs' JSON example does not displace it.
              a = jwt.encode({"iss": cid, "sub": cid, "aud": f"https://{dom}/oauth/token",
                              "iat": now,
                              "exp": now + 60, "jti": str(uuid.uuid4())}, pk, algorithm="RS256",
                             headers={"kid": kid})
              r = requests.post(f"https://{dom}/oauth/token", data={
                  "client_id": cid,
                  "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-bearer",
                  "client_assertion": a, "audience": aud, "grant_type": "client_credentials"},
                  headers={"Content-Type": "application/x-www-form-urlencoded"}, timeout=30)
              print("token", r.status_code, {k: v for k, v in r.json().items() if k != "access_token"} if r.headers.get("content-type", "").startswith("application/json") else r.text[:300])
              r.raise_for_status()
              return r.json()["access_token"]
          t = token()
          try:
              import base64
              p = t.split(".")[1]; p += "=" * (-len(p) % 4)
              print("scopes:", json.loads(base64.urlsafe_b64decode(p)).get("scope"))
          except Exception as e:
              print("scope decode failed", e)
          H = {"Authorization": f"Bearer {t}", "X-Client-Id": cid, "X-Request-Id": str(uuid.uuid4()),
               "x-participant-id": pid}
          def show(r):
              print(r.request.method, r.url, "->", r.status_code)
              try: print(json.dumps(r.json(), indent=1)[:12000])
              except Exception: print(r.text[:2000])
          if act == "whoami":
              show(requests.get(f"{base}/v1/whoami", headers=H, timeout=30))
              show(requests.get(f"{base}/v1/users", headers=H, timeout=30))
          elif act == "refdata":
              body = {}
              if arg.strip(): body = {"filter": arg.strip()}
              for path in ("/v1/refdata/symbols", "/v1/refdata/instruments", "/v1/refdata/metadata"):
                  r = requests.post(f"{base}{path}", headers=H, json=body, timeout=60)
                  print(path, "->", r.status_code); print(r.text[:6000])
          elif act == "bbo":
              show(requests.get(f"{base}/v1/orderbook/{arg.strip()}/bbo", headers=H, timeout=30))
          elif act == "book":
              show(requests.get(f"{base}/v1/orderbook/{arg.strip()}", headers=H, timeout=30))
          elif act == "instruments":
              # arg = the JSON body of POST /v1/refdata/instruments (pageSize, symbols,
              # clearingSym, tradableFilter, states, startTimeGte ...); {} lists the first page
              # a JSON list runs each body in turn (ListInstruments is capped at 6 req/min)
              bodies = json.loads(arg) if arg.strip() else {"pageSize": 20}
              if isinstance(bodies, dict): bodies = [bodies]
              for body in bodies[:5]:
                  r = requests.post(f"{base}/v1/refdata/instruments", headers=H, json=body, timeout=60)
                  print("POST /v1/refdata/instruments", json.dumps(body), "->", r.status_code)
                  try:
                      j = r.json()
                      for i in j.get("instruments", []):
                          md = i.get("metadata") or {}
                          print(" ", i.get("symbol"), i.get("state"), "px_scale", i.get("priceScale"), "tick", i.get("tickSize"),
                                "fq_scale", i.get("fractionalQtyScale"), "minqty", i.get("minimumTradeQty"),
                                "|", md.get("market_sport_type"), md.get("event_id"), md.get("long_participant_id"),
                                md.get("outcome_strike"), md.get("event_start_time"), "|", (i.get("description") or "")[:80])
                      print("  count", len(j.get("instruments", [])), "nextPageToken:", j.get("nextPageToken"))
                      print(json.dumps(j.get("instruments", [])[:1], indent=1)[:5000])
                  except Exception as e:
                      print(r.text[:3000], e)
          elif act == "positions":
              # arg = the account resource name (firms/<firm>/accounts/<account>)
              acct = arg.strip()
              show(requests.get(f"{base}/v1/positions", headers=H, params={"name": acct} if acct else None, timeout=30))
              show(requests.post(f"{base}/v1/positions/balance", headers=H, json={"account": acct, "currency": "USD"} if acct else {}, timeout=30))
              show(requests.post(f"{base}/v1/positions/balances", headers=H, json={"account": acct} if acct else {}, timeout=30))
              show(requests.get(f"{base}/v1/accounts/accounts", headers=H, timeout=30))
          elif act == "open-orders":
              show(requests.get(f"{base}/v1/trading/orders/open", headers=H, timeout=30))
          elif act == "report-orders":
              body = json.loads(arg) if arg.strip() else {"stateFilter": "ORDER_STATE_FILTER_OPEN"}
              show(requests.post(f"{base}/v1/report/orders/search", headers=H, json=body, timeout=30))
          elif act == "duplicate-preview":
              # PREVIEW_REPEATABILITY. THAT IS THE WHOLE CLAIM.
              #
              # This previews the same clordId twice and reports what the
              # PREVIEW endpoint does with a repeat. It does NOT establish:
              #   * insert idempotency
              #   * duplicate-order protection
              #   * that a retry after a lost response is safe
              #   * any relaxation of the single-send boundary
              # The preview places nothing, so it cannot answer a question
              # about placing. A preview that happily accepts a repeat and
              # an insert that rejects one are entirely consistent, and so
              # are the opposites.
              #
              # A REAL duplicate-INSERT test is a separate, authorized
              # exercise. Its scope, maximum dummy exposure, observation and
              # cleanup plan are written up in
              # research/institutional/DUPLICATE_INSERT_PROPOSAL.md and it
              # must not be performed from here.
              #
              # arg = the JSON order request; its clordId is sent TWICE.
              body = json.loads(arg)
              req = body.get("request", body)
              if not req.get("clordId"):
                  print("refused: duplicate-preview needs a clordId in the request"); sys.exit(1)
              answers = []
              for attempt in (1, 2):
                  r = requests.post(f"{base}/v1/trading/orders/preview",
                                    headers=H, json=body, timeout=30)
                  answers.append(r.status_code)
                  print(f"PREVIEW attempt {attempt} clordId={req['clordId']} ->", r.status_code)
                  print(r.text[:2000])
              print("RESULT PREVIEW_REPEATABILITY", json.dumps(answers))
              print("SCOPE: this run establishes PREVIEW_REPEATABILITY only. "
                    "It establishes NOTHING about insert idempotency, "
                    "duplicate-order protection, or permission to relax the "
                    "single-send boundary. Those need the separate authorized "
                    "duplicate-insert test.")
          elif act in ("order-preview", "order"):
              body = json.loads(arg)
              path = "/v1/trading/orders/preview" if act == "order-preview" else "/v1/trading/orders"
              show(requests.post(f"{base}{path}", headers=H, json=body, timeout=30))
              if act == "order":
                  # read the order back at once so the run records what the venue holds
                  show(requests.get(f"{base}/v1/trading/orders/open", headers=H, timeout=30))
          elif act == "cancel":
              # arg = JSON CancelOrderRequest {orderId | clordId, symbol}; the open orders are
              # read back after the cancel so the run records the venue's answer
              body = json.loads(arg)
              show(requests.post(f"{base}/v1/trading/orders/cancel", headers=H, json=body, timeout=30))
              show(requests.get(f"{base}/v1/trading/orders/open", headers=H, timeout=30))
          PY
      # THE CANONICAL PROTO BUNDLE, for the gRPC subscription only.
      #   https://docs.polymarket.us/streaming-endpoints/getting-started
      # The generated client is the venue's own contract. Nothing here
      # hand-writes a protobuf message, and a bundle that will not
      # download or generate is a NAMED failure, never a fallback to a
      # guessed shape.
      - name: Generate the venue's gRPC client
        if: ${{ contains(fromJSON('["order-stream","grpc-probe"]'), inputs.action) }}
        run: |
          set -euo pipefail
          pip install -q "grpcio==1.68.1" "grpcio-tools==1.68.1" "protobuf==5.29.1"
          mkdir -p protos gen
          curl -sSL -o protos/bundle.zip "$PROTO_URL"
          unzip -q -o protos/bundle.zip -d protos
          ls protos
          python -m grpc_tools.protoc --python_out=gen --grpc_python_out=gen \
            --proto_path=protos/api \
            protos/api/polymarket/v1/*.proto \
            protos/api/google/api/*.proto \
            protos/api/protoc-gen-openapiv2/options/*.proto
          python - <<'PY'
          import sys; sys.path.insert(0, "gen")
          from polymarket.v1 import trading_pb2, trading_pb2_grpc
          req = trading_pb2.CreateOrderSubscriptionRequest(
              symbols=[], accounts=[], snapshot_only=True)
          assert hasattr(trading_pb2_grpc, "OrderEntryAPIStub")
          print("GENERATED_CLIENT_OK fields:",
                sorted(f.name for f in req.DESCRIPTOR.fields))
          PY
        env:
          PROTO_URL: "https://drive.google.com/uc?export=download&id=1oT9gaeBEn0vukHD9GOoj_YvzPnR3otng"

      # THE MODULE, not a heredoc. `research/institutional/pmx_preprod_ops`
      # holds the contract (search body, row validation, verdicts, auth
      # classification) and is unit-tested; `pmx_preprod_net` opens the
      # sockets and makes no decisions of its own.
      - name: Run the preprod operation
        if: ${{ contains(fromJSON('["auth","reconcile-order","order-stream","grpc-probe"]'), inputs.action) }}
        env:
          PMX_PREPROD_CLIENT_ID: ${{ secrets.PMX_PREPROD_CLIENT_ID }}
          PMX_PREPROD_PARTICIPANT_ID: ${{ secrets.PMX_PREPROD_PARTICIPANT_ID }}
          PMX_PREPROD_KEY_ID: ${{ secrets.PMX_PREPROD_KEY_ID }}
          PMX_PREPROD_PRIVATE_KEY_B64: ${{ secrets.PMX_PREPROD_PRIVATE_KEY_B64 }}
          ARG: ${{ inputs.arg }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/research/institutional:$PWD/gen:${PYTHONPATH:-}"
          OP="${{ inputs.action }}"
          [ "$OP" = "reconcile-order" ] && OP="reconcile"
          [ "$OP" = "order-stream" ] && OP="stream"
          # rc 0  the operation answered cleanly
          # rc 1  a NAMED verdict (secret missing, rejected, permission
          #       denied, NOT_FOUND, INCONCLUSIVE, FAILED) -- a completed
          #       command that reports a real outcome
          # any other rc -> the step fails, which is what an unhandled
          #       exception must look like
          set +e
          python research/institutional/pmx_preprod_ops.py "$OP" \
            --spec "$ARG" --out "$RUNNER_TEMP/receipts.json"
          RC=$?
          set -e
          echo "OPERATION_EXIT=$RC"
          if [ "$RC" -gt 1 ]; then exit "$RC"; fi

      - name: Stage the receipts for the artifact
        if: always()
        run: |
          mkdir -p receipts
          if [ -s "$RUNNER_TEMP/receipts.json" ]; then
            cp "$RUNNER_TEMP/receipts.json" "receipts/receipts_${{ github.run_id }}.json"
            echo "receipts staged ($(wc -c < receipts/receipts_${{ github.run_id }}.json) bytes)"
          else
            echo "this action wrote no receipts" > "receipts/receipts_${{ github.run_id }}.json"
          fi
      # SANITIZED RECEIPTS, RETAINED. reconcile-order and order-stream write
      # request bodies, statuses, the identifiers returned and the
      # timestamps -- never a key, a bearer, a signed assertion or a full
      # account payload. The evidence outlives the log.
      - name: Publish the receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmx-preprod-receipts-${{ github.run_id }}
          path: receipts/
          if-no-files-found: warn
      - name: Scrub
        if: always()
        run: rm -f "$RUNNER_TEMP/pk.pem"; echo scrubbed
