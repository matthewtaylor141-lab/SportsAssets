# What does our odds plan ACTUALLY return?
#
# The engine refuses ~780 segment outcomes per cycle with
# `no_sharp_quote_segment_*` and every one reports `segments_priced: none`.
# Two explanations fit that equally well from the inside: the provider does
# not carry these markets on our plan, or we are asking for them wrongly.
# Nobody has ever asked the provider directly, because the assistant's
# session cannot reach the internet and the engine only reports what it got,
# never what it asked for.
#
# A runner can reach it. This asks, per sport, exactly which of our requested
# market keys come back with quotes — the difference between "buy a bigger
# plan" and "fix our request", which is a four-figure decision.
#
# SECRET REQUIRED: EDGE_ODDS_API_KEY (repo Settings -> Secrets -> Actions).
# The key is never printed; GitHub masks registered secrets in logs, and the
# script only ever emits market keys and counts.

name: feed-coverage

on:
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma-separated sport keys (blank = probe the defaults)"
        required: false
        default: ""
      value_slate:
        description: >-
          Also run PINNACLE_DEVIG_V1 over the slate and record every
          decision and refusal in `external_valuations`. Reads the feed and
          `markets`; writes only that one table, whose order_submitted
          column has a CHECK that it is FALSE.
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      probe:
        description: "Run the original coverage probe (set false to only value)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      provision_api_key:
        description: >-
          Provision EDGE_ODDS_API_KEY onto sportsassets-api from the
          repository secret. The value moves secret-store to secret-store
          and is never an input, a log line or a file. Requires confirm=DO.
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      confirm:
        description: "Type DO to allow provisioning"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ask the provider what it carries
        if: ${{ github.event.inputs.probe != 'false' }}
        env:
          EDGE_ODDS_API_KEY: ${{ secrets.EDGE_ODDS_API_KEY }}
          SPORTS_IN: ${{ github.event.inputs.sports }}
        run: |
          if [ -z "$EDGE_ODDS_API_KEY" ]; then
            echo "::error::EDGE_ODDS_API_KEY secret is not set."
            echo "Add it at Settings -> Secrets and variables -> Actions."
            echo "Without it this probe cannot ask the provider anything."
            exit 1
          fi

          BASE=https://api.the-odds-api.com/v4
          SPORTS="${SPORTS_IN:-baseball_mlb,soccer_epl,soccer_mexico_ligamx,basketball_nba,icehockey_nhl}"

          echo "==================== QUOTA ===================="
          curl -sS "$BASE/sports/?apiKey=$EDGE_ODDS_API_KEY" -D /tmp/h -o /tmp/sports.json >/dev/null || true
          grep -i '^x-requests-' /tmp/h || echo "(no quota headers returned)"
          echo "sports carried by this plan: $(jq 'length' /tmp/sports.json 2>/dev/null || echo '?')"

          # The market keys the engine asks for, straight from the source so
          # this probe cannot drift away from what the engine actually sends.
          ALL=$(python3 - <<'PY'
          import re, pathlib
          src = pathlib.Path("edge-engine/src/edge/fairvalue/feed.py").read_text()
          block = re.search(r"SEGMENT_MARKETS\s*=\s*\{(.*?)\n    \}", src, re.S).group(1)
          keys = sorted(set(re.findall(r'"([a-z0-9_]+)"', block)) - {
              "baseball", "soccer", "basketball", "americanfootball", "icehockey"})
          print(",".join(["h2h", "spreads", "totals"] + keys))
          PY
          )
          echo "engine asks for: $ALL"

          # Credits are charged per request x per market x per region, so
          # "does it work" is only half the question — "what does it cost"
          # decides whether we can afford it every cycle.
          used () { grep -i '^x-requests-used' /tmp/h2 | tr -d '\r' | awk '{print $2}'; }

          for SPORT in ${SPORTS//,/ }; do
            echo ""
            echo "───────────────────────────────────────────────"
            echo "$SPORT"
            echo "───────────────────────────────────────────────"

            # (1) Featured markets, bulk endpoint — what we get today.
            code=$(curl -sS -o /tmp/ev.json -D /tmp/h2 -w '%{http_code}' \
              "$BASE/sports/$SPORT/odds/?apiKey=$EDGE_ODDS_API_KEY&regions=eu,uk,us&markets=h2h,spreads,totals&oddsFormat=decimal" || true)
            U1=$(used)
            echo "[featured, bulk]  HTTP $code   credits_used_total=$U1"
            if [ "$code" = "200" ]; then
              echo "  events: $(jq 'length' /tmp/ev.json)"
              echo "  sharp books quoting this sport:"
              jq -r '[.[] | .bookmakers[]?.key] | group_by(.) | map({k: .[0], n: length})
                     | map(select(.k as $k | ["pinnacle","betfair_ex_eu","betfair_ex_uk",
                         "betfair_ex_au","smarkets","matchbook","betanysports","lowvig"]
                         | index($k)))
                     | if length == 0 then "     NONE — no anchor for this sport at all"
                       else sort_by(-.n)[] | "     \(.k): \(.n) events" end' /tmp/ev.json
              EVID=$(jq -r '.[0].id // empty' /tmp/ev.json)
            else
              head -c 300 /tmp/ev.json; echo; EVID=""
            fi

            # (2) Segments on the PER-EVENT endpoint — the actual question.
            if [ -n "$EVID" ]; then
              case "$SPORT" in
                baseball*)         SEG=h2h_1st_5_innings,spreads_1st_5_innings,totals_1st_5_innings ;;
                soccer*)           SEG=h2h_h1,totals_h1 ;;
                basketball*)       SEG=h2h_h1,spreads_h1,totals_h1 ;;
                americanfootball*) SEG=h2h_h1,spreads_h1,totals_h1 ;;
                icehockey*)        SEG=h2h_p1,totals_p1 ;;
                *)                 SEG="" ;;
              esac
              if [ -n "$SEG" ]; then
                code=$(curl -sS -o /tmp/one.json -D /tmp/h2 -w '%{http_code}' \
                  "$BASE/sports/$SPORT/events/$EVID/odds/?apiKey=$EDGE_ODDS_API_KEY&regions=eu,uk,us&markets=$SEG&oddsFormat=decimal" || true)
                U2=$(used)
                echo "[segments, per-event]  HTTP $code   credits_used_total=$U2   COST=$((U2 - U1))"
                if [ "$code" = "200" ]; then
                  echo "  segment markets returned:"
                  jq -r '[.bookmakers[]?.markets[]?.key] | group_by(.) | sort_by(-length)
                         | if length == 0 then "     (none — endpoint OK but no quotes)"
                           else .[] | "     \(.[0]): \(length) books" end' /tmp/one.json
                  echo "  sharp books on segments:"
                  jq -r '[.bookmakers[] | select(.markets | length > 0) | .key]
                         | map(select(. as $k | ["pinnacle","betfair_ex_eu","betfair_ex_uk",
                             "betfair_ex_au","smarkets","matchbook","betanysports","lowvig"]
                             | index($k)))
                         | if length == 0 then "     NONE" else join(", ") end' /tmp/one.json
                else
                  head -c 400 /tmp/one.json; echo
                fi
              fi
            fi
            # (3) PLAYER PROPS. Polymarket lists dozens per game
            # ("Shota Imanaga 5+ strikeouts") and every one currently lands
            # in no_side_match_moneyline because we have nothing to price it
            # against. This is the biggest untapped universe by far, so the
            # question is whether the plan carries it and what it costs.
            if [ -n "$EVID" ]; then
              case "$SPORT" in
                baseball*)   PROPS=pitcher_strikeouts,pitcher_outs,batter_home_runs,batter_hits,batter_total_bases ;;
                soccer*)     PROPS=player_goal_scorer_anytime,player_shots_on_target ;;
                basketball*) PROPS=player_points,player_rebounds,player_assists ;;
                icehockey*)  PROPS=player_points,player_shots_on_goal ;;
                *)           PROPS="" ;;
              esac
              if [ -n "$PROPS" ]; then
                U3=$(used)
                code=$(curl -sS -o /tmp/pr.json -D /tmp/h2 -w '%{http_code}' \
                  "$BASE/sports/$SPORT/events/$EVID/odds/?apiKey=$EDGE_ODDS_API_KEY&regions=eu,uk,us&markets=$PROPS&oddsFormat=decimal" || true)
                U4=$(used)
                echo "[props, per-event]  HTTP $code   COST=$((U4 - U3))"
                if [ "$code" = "200" ]; then
                  jq -r '[.bookmakers[]?.markets[]?.key] | group_by(.) | sort_by(-length)
                         | if length == 0 then "     (none returned)"
                           else .[] | "     \(.[0]): \(length) books" end' /tmp/pr.json
                  echo "     outcomes available: $(jq '[.bookmakers[]?.markets[]?.outcomes[]?] | length' /tmp/pr.json)"
                  echo "     sharp books on props:"
                  jq -r '[.bookmakers[] | select(.markets | length > 0) | .key]
                         | map(select(. as $k | ["pinnacle","betfair_ex_eu","betfair_ex_uk",
                             "betfair_ex_au","smarkets","matchbook","betanysports","lowvig"]
                             | index($k)))
                         | if length == 0 then "        NONE" else "        " + join(", ") end' /tmp/pr.json
                else
                  head -c 300 /tmp/pr.json; echo
                fi
              fi
            fi
          done

          echo ""
          echo "==========================================================="
          echo "READ THIS AS:"
          echo "  per-event 200 + markets  -> FREE FIX: move segments to that endpoint"
          echo "  per-event 200 + none     -> books do not quote it; nothing to buy either"
          echo "  per-event 422/404        -> not on this plan; an upgrade would be needed"
          echo "  COST is credits per EVENT — multiply by the slate to size the bill"
          echo "==========================================================="

      # ── PROVISION THE ODDS KEY ONTO sportsassets-api ──────────────
      #
      # WHY THIS SHAPE. The value must reach the service without ever
      # existing anywhere a human or a log can read it. So:
      #
      #   * it is NOT a workflow input. `workflow_dispatch` inputs are
      #     stored verbatim in the run's event payload, which is readable
      #     from the API -- `::add-mask::` hides a value from LOG OUTPUT
      #     and does nothing about that. A key typed into a form is
      #     already disclosed.
      #   * it is read from `secrets.EDGE_ODDS_API_KEY`, which GitHub
      #     masks in logs automatically, and written straight to Render's
      #     env-var endpoint. Secret store to secret store.
      #   * the request body is built by python from os.environ, never
      #     from argv, so the value never appears in a process list.
      #   * the verification prints KEY NAMES only.
      #
      # It is NOT the generic render-ops `env-set`, which takes KEY=VALUE
      # as an input and would therefore put the key in the event payload.
      #
      # Hosted in THIS workflow because it is registered on the default
      # branch (so it is dispatchable) and already holds the odds secret.
      # A new workflow file would not be dispatchable from a feature
      # branch at all.
      - name: Provision EDGE_ODDS_API_KEY on sportsassets-api
        if: ${{ github.event.inputs.provision_api_key == 'true' }}
        env:
          ODDS_KEY: ${{ secrets.EDGE_ODDS_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -u -o pipefail
          if [ "$CONFIRM" != "DO" ]; then
            echo "::error::confirm must be DO to provision a credential"
            exit 1
          fi
          for v in ODDS_KEY RENDER_API_KEY; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::$v is not set as a repository secret"; exit 1
            fi
          done
          API=https://api.render.com/v1
          SVC=$(curl -sS --max-time 45 \
                 -H "Authorization: Bearer $RENDER_API_KEY" \
                 -H "Accept: application/json" \
                 "$API/services?name=sportsassets-api&limit=20" \
                | jq -r '.[]?|select(.service.name=="sportsassets-api")|.service.id' \
                | head -1)
          if [ -z "$SVC" ]; then
            echo "::error::could not resolve the sportsassets-api service id"
            exit 1
          fi
          echo "service resolved"

          echo "--- env var KEYS before (names only, never values) ---"
          curl -sS --max-time 45 -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "$API/services/$SVC/env-vars?limit=100" \
            | jq -r '[.[]?.envVar.key]|sort|.[]' | sed 's/^/  /'

          # THE VALUE NEVER TOUCHES argv. python reads it from the
          # environment and writes the JSON body to a file; curl sends the
          # file. Nothing here can surface in a process list or a log.
          python3 -c 'import json,os,sys; sys.stdout.write(json.dumps({"value": os.environ["ODDS_KEY"]}))' > /tmp/body.json
          CODE=$(curl -sS --max-time 45 -o /tmp/put.json -w '%{http_code}' \
                 -X PUT -H "Authorization: Bearer $RENDER_API_KEY" \
                 -H "Accept: application/json" \
                 -H "Content-Type: application/json" \
                 --data @/tmp/body.json \
                 "$API/services/$SVC/env-vars/EDGE_ODDS_API_KEY")
          shred -u /tmp/body.json 2>/dev/null || rm -f /tmp/body.json
          echo "PUT env-vars/EDGE_ODDS_API_KEY -> HTTP $CODE"
          case "$CODE" in
            2??) : ;;
            *) echo "::error::Render refused the env-var write (HTTP $CODE)"
               jq -r '.message // empty' /tmp/put.json 2>/dev/null
               exit 1 ;;
          esac

          echo "--- env var KEYS after (names only) ---"
          curl -sS --max-time 45 -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "$API/services/$SVC/env-vars?limit=100" \
            | jq -r '[.[]?.envVar.key]|sort|.[]' | sed 's/^/  /' \
            | tee /tmp/keys.txt
          if ! grep -qx '  EDGE_ODDS_API_KEY' /tmp/keys.txt; then
            echo "::error::the key is still absent after a 2xx write"
            exit 1
          fi
          {
            echo "### EDGE_ODDS_API_KEY provisioned on sportsassets-api"
            echo ""
            echo "- Render PUT returned HTTP $CODE"
            echo "- the key NAME is present in env-vars; no value was read,"
            echo "  printed or written to disk beyond the request body,"
            echo "  which was shredded"
            echo "- a redeploy is still required for the running process to"
            echo "  see it: render-ops deploy-api-commit"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── PINNACLE_DEVIG_V1 over the same slate ─────────────────────
      #
      # WHY HERE. `EDGE_ODDS_API_KEY` is on edge-shadow and as a repository
      # secret; it is NOT on sportsassets-api, where the shadow decision
      # path runs, and a production credential is never copied between
      # services. This workflow already holds the key and already asks the
      # provider what it carries, so valuing what it carries belongs beside
      # that question rather than in a second place with a second copy of
      # the credential.
      #
      # IT WRITES ONE TABLE. `external_valuations`, whose order_submitted
      # column has a CHECK that it is FALSE -- so this step cannot place an
      # order even if its code tried to. No trading flag, control row,
      # position or legacy accounting record is touched.
      - name: Value the slate with PINNACLE_DEVIG_V1
        if: ${{ github.event.inputs.value_slate == 'true' }}
        env:
          EDGE_ODDS_API_KEY: ${{ secrets.EDGE_ODDS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          if [ -z "${EDGE_ODDS_API_KEY:-}" ]; then
            echo "::error::EDGE_ODDS_API_KEY is not set"; exit 1; fi
          # DATABASE_URL IS NOT REQUIRED HERE. It is measured absent on this
          # runner (empty at 2026-09-23T23:44:08Z; referenced by
          # calibration-evidence.yml but not actually a repository secret),
          # and the script degrades to FEED-ONLY mode, which still produces
          # the real valuations and the refusal census. Hard-failing on it
          # threw away the half that does work -- that was this step's own
          # bug, not the script's.
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "note: DATABASE_URL absent -> feed-only mode"
          fi
          pip install --quiet "asyncpg>=0.29" || true
          python research/beta48/ext_pinnacle_run.py 2>&1 | tee /tmp/val.txt
          {
            echo "### PINNACLE_DEVIG_V1 over the slate"
            echo '```'
            cat /tmp/val.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
