[project]
name = "rn1-collector"
version = "0.1.0"
description = "Standalone RN1 observability collector — no venue SDK, no signer, no order client"
requires-python = ">=3.11"

# THE DEPENDENCY LIST IS HALF THE CONTAINMENT PROOF. The other half is the file
# census in build_artifact.py.
#
#   httpx       talks to the SIGNING BROKER. Not to the venue's REST surface,
#               which the network policy must make unreachable.
#   websockets  the PMUS/CLOB market sockets. Read-only frames in.
#   asyncpg     writes rn1_obs_* rows.
#
# ABSENT, and asserted absent by the census and by
# test_run834_artifacts.py::test_the_collector_artifact_excludes_every_prohibited_component:
#
#   polymarket-us   the order client. Also the general signer and the private
#                   websocket implementation -- all three live in that one
#                   distribution, which is why it is excluded whole.
#   py-clob-client  the other venue SDK.
#   pynacl          the signing primitive. The collector cannot sign; the broker
#                   holds that, in its own image.
#   eth-account / web3 / coincurve  wallet material. Nothing here needs a key.
#
# NOTE ON THE OBS CORE: sportsassets/obs imports ONLY the standard library.
# Every dependency above belongs to rn1collector/ -- the transport and the
# runner -- not to the decoders or the 0 ms rule.
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rn1collector"]
