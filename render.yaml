# Render blueprint: API (web) + all background loops (one worker) + Postgres + Redis.
# Deploy: Render dashboard → New → Blueprint → connect this repo.
# The ingestion loop must never sleep: use paid instances (starter), not free.

databases:
  - name: sportsassets-db
    plan: basic-256mb
    # 16 -> 18 on 2026-09-05: the owner took Render's in-dashboard major
    # version upgrade during the disk outage. Render cannot downgrade a
    # major version, so a blueprint still saying "16" would fail every
    # sync from here on -- harmlessly, but blocking the diskSizeGB and
    # any future change in this file. Keep this equal to what the
    # instance actually runs; change it only by upgrading the instance.
    postgresMajorVersion: "18"
    # STORAGE IS DECLARED HERE BECAUSE THE BLUEPRINT OWNS IT (2026-09-05).
    #
    # This field was absent, so the instance sat at its plan default and
    # the dashboard refused to raise it by hand -- Render pins
    # Blueprint-managed settings to what this file says. That is what
    # made a full disk unfixable from the UI during the outage below.
    #
    # THE OUTAGE IT CAUSED. The database filled, Render degraded the
    # instance, and its internal hostname stopped resolving: every
    # service logged `DB connect failed ([Errno -2] Name or service not
    # known)` while the processes themselves stayed healthy. From the
    # outside that reads as a hang, not an error -- /healthz served
    # {"ok": true, "db_ok": false}, every DB-backed endpoint timed out
    # with zero bytes received, and venue reads kept working. The
    # platform was down from roughly 23:15 UTC on 2026-09-04 until this
    # was raised. `db_ok` false with a healthy process means READ THE
    # DATABASE'S OWN LOGS FIRST; the edge symptoms cannot tell a full
    # disk from a saturated pool, and a whole night went into that gap.
    #
    # Raise this number rather than editing storage in the dashboard.
    # Render only ever grows a Postgres disk, so a value BELOW the
    # current size is rejected at sync time -- harmless, but it means
    # this must be set above whatever the instance is on today. The
    # first attempt here said 10 and Render answered "cannot shrink
    # database disk from 15 GB to 10 GB", which is how the current size
    # became known at all: the instance was ALREADY on 15 GB and full.
    #
    # 25 leaves roughly 10 GB of headroom on a database that filled 15.
    # The growth is not the copy engine -- it is measurement. The paper
    # account writes ~21,000 rows/day to ai_trades (83,815 in the four
    # days to 2026-09-05) across all seven source+vetting whales,
    # including the five funded at $0, and copy_probes takes a row per
    # probe beside it. Neither needs unbounded history to do its job, so
    # a retention policy on both is the actual fix; this number buys the
    # time to measure and write one.
    #
    # A DISK CANNOT BE SHRUNK AFTERWARDS. Over-provisioning here is
    # permanent and paid monthly, so raise it deliberately rather than
    # reflexively -- but not so cautiously that a full disk takes the
    # platform down for thirteen hours again.
    diskSizeGB: 25

services:
  - type: keyvalue
    name: sportsassets-redis
    plan: free
    ipAllowList: []   # only reachable from services in this Render account

  - type: web
    name: sportsassets-api
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: sh start.sh
    healthCheckPath: /healthz
    envVars: &backend_env
      - key: DATABASE_URL
        fromDatabase:
          name: sportsassets-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sportsassets-redis
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ENGINE_INGEST_TOKEN   # must equal EDGE_INGEST_TOKEN on edge-shadow
        sync: false
      - key: LIVE_TRADING_ENABLED  # REAL MONEY switch — leave unset/0 until armed
        sync: false
      - key: PMUS_KEY_ID           # Polymarket US API key (polymarket.us/developer)
        sync: false
      - key: PMUS_SECRET_KEY       # shown once at key creation — store it here
        sync: false
      - key: PM_PRIVATE_KEY        # global CLOB only (non-US) — leave empty for US accounts
        sync: false
      - key: PM_FUNDER
        sync: false
      - key: CORS_ORIGINS        # set to your Netlify URL after the first frontend deploy
        sync: false
      - key: POLYGON_WS_URL      # Alchemy/QuickNode Polygon WS (Path A); optional at first
        sync: false
      - key: POLYGON_HTTP_URL
        sync: false
      - key: VAPID_PUBLIC_KEY    # python -m sportsassets.scripts.gen_vapid
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      - key: NTFY_TOPIC           # free phone push via the ntfy app — use a long
        sync: false               # random topic name; subscribe to it in the app
      - key: NTFY_WATCH_ADDRESSES # comma-separated wallets; empty = all whales
        sync: false
      - key: TWILIO_ACCOUNT_SID   # SMS trade alerts (twilio.com console)
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER   # your Twilio number, E.164 (+1...)
        sync: false
      - key: SMS_TO_NUMBERS       # comma-separated recipients, E.164
        sync: false
      - key: SMS_WATCH_ADDRESSES  # comma-separated wallets; empty = all whales
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_CHANNEL_INVITE_URL
        sync: false

  - type: worker
    name: sportsassets-workers
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m sportsassets.workers.all
    envVars: *backend_env

  # Edge-engine shadow runner (logs would-be fills; never places orders).
  # Requires EDGE_ODDS_API_KEY. Suspend this service to pause shadow logging.
  - type: worker
    name: edge-shadow
    runtime: docker
    plan: starter
    rootDir: edge-engine
    dockerfilePath: ./Dockerfile
    disk:                        # persistent — the SQLite ledger + reports live here
      name: edge-data
      mountPath: /var/edge-data
      sizeGB: 1
    envVars:
      - key: EDGE_ODDS_API_KEY
        sync: false
      - key: EDGE_CYCLE_SECONDS
        value: "120"
      - key: EDGE_KALSHI
        value: "1"
      - key: EDGE_DATA_DIR       # writable state (ledger, shadow log, reports)
        value: "/var/edge-data"
      - key: EDGE_LEDGER_DB      # ledger survives deploys on the mounted disk
        value: "/var/edge-data/edge_ledger.sqlite3"
      - key: EDGE_PLATFORM_API   # whale-alignment signal + fill recording
        value: "https://sportsassets-api.onrender.com"
      - key: EDGE_INGEST_TOKEN   # must equal ENGINE_INGEST_TOKEN on the api service
        sync: false
      - key: EDGE_SKIP_MAPPER_GATE  # "1" = owner override: arm without 24h
        sync: false                 # mapper history (per-trade 0.95 gate stays)
      # LIVE_* credentials — leave unset while mode: PAPER (config/risk.yaml).
      - key: EDGE_KALSHI_KEY_ID
        sync: false
      - key: EDGE_KALSHI_PRIVATE_KEY
        sync: false
      - key: EDGE_PMUS_KEY_ID
        sync: false
      - key: EDGE_PMUS_SECRET_KEY
        sync: false
