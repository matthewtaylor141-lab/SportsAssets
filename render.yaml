# Render blueprint: API (web) + all background loops (one worker) + Postgres + Redis.
# Deploy: Render dashboard → New → Blueprint → connect this repo.
# The ingestion loop must never sleep: use paid instances (starter), not free.

databases:
  - name: sportsassets-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: sportsassets-redis
    plan: free
    ipAllowList: []   # only reachable from services in this Render account

  - type: web
    name: sportsassets-api
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: sh start.sh
    healthCheckPath: /healthz
    envVars: &backend_env
      - key: DATABASE_URL
        fromDatabase:
          name: sportsassets-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sportsassets-redis
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ENGINE_INGEST_TOKEN   # must equal EDGE_INGEST_TOKEN on edge-shadow
        sync: false
      - key: LIVE_TRADING_ENABLED  # REAL MONEY switch — leave unset/0 until armed
        sync: false
      - key: PM_PRIVATE_KEY        # dedicated beta wallet ONLY
        sync: false
      - key: PM_FUNDER
        sync: false
      - key: CORS_ORIGINS        # set to your Netlify URL after the first frontend deploy
        sync: false
      - key: POLYGON_WS_URL      # Alchemy/QuickNode Polygon WS (Path A); optional at first
        sync: false
      - key: POLYGON_HTTP_URL
        sync: false
      - key: VAPID_PUBLIC_KEY    # python -m sportsassets.scripts.gen_vapid
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_CHANNEL_INVITE_URL
        sync: false

  - type: worker
    name: sportsassets-workers
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m sportsassets.workers.all
    envVars: *backend_env

  # Edge-engine shadow runner (logs would-be fills; never places orders).
  # Requires EDGE_ODDS_API_KEY. Suspend this service to pause shadow logging.
  - type: worker
    name: edge-shadow
    runtime: docker
    plan: starter
    rootDir: edge-engine
    dockerfilePath: ./Dockerfile
    envVars:
      - key: EDGE_ODDS_API_KEY
        sync: false
      - key: EDGE_CYCLE_SECONDS
        value: "120"
      - key: EDGE_KALSHI
        value: "1"
      - key: EDGE_PLATFORM_API   # whale-alignment signal + fill recording
        value: "https://sportsassets-api.onrender.com"
      - key: EDGE_INGEST_TOKEN   # must equal ENGINE_INGEST_TOKEN on the api service
        sync: false
